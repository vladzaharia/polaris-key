name = "polaris-key"
main = "src/index.ts"
# 2026-04-07 enables WebCrypto Ed25519 for config-doc JWS signing.
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# The single assets root, ASSEMBLED from the two built frontends (admin SPA + gated docs
# site) by `scripts/assemble-assets.mjs` — run `pnpm --filter @polaris-key/worker assemble`
# after building, before `wrangler dev`/`deploy`. The directory is gitignored.
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[durable_objects.bindings]]
name = "RL"
class_name = "RateLimitDO"

[[migrations]]
tag = "v1"
# SQLite-backed, not KV-backed. Cloudflare no longer permits accounts to create the legacy
# KV-backed Durable Object classes that `new_classes` declares, so this line as originally
# written would have failed the very first deploy — and, per the operational-resilience
# review, it also silently broke the "redeploy into a clean Cloudflare account" step that
# every disaster-recovery procedure depends on.
#
# Changing it is free ONLY because this object has never been deployed and therefore holds
# no state. Once RateLimitDO holds data, moving between storage backends is a real migration.
new_sqlite_classes = ["RateLimitDO"]

# ---------------------------------------------------------------------------
# Scheduled maintenance (R11-09 / R12-10). Without this block the worker has no `scheduled()`
# invocation at all, and `audit`, `portal_audit` and `release_download_tokens` grow forever
# while dormant device seats stay occupied. `src/scheduled.ts` is the handler.
#
# 03:17 UTC, daily. Retention is measured in months (RETENTION_SECONDS = 180 days), so nothing
# is gained by running more often, and a daily tick still bounds the tables and re-runs the
# deploy-time index assertion within a day of any bad deploy. The odd minute is deliberate:
# `0 3 * * *` puts the job in the same second as every other cron on the platform, and a sweep
# that competes with a thundering herd for D1 is a sweep that starts timing out.
#
# `triggers` is an INHERITABLE wrangler key, so this one block applies to prod, staging and dev
# without a per-environment copy; overriding it for one environment means adding
# `[env.<name>.triggers]`, which then replaces this list for that environment entirely.
# ---------------------------------------------------------------------------
[triggers]
crons = ["17 3 * * *"]

# ---------------------------------------------------------------------------
# Per-environment bindings. The D1 database and KV namespace are created once,
# per environment, with wrangler (see docs/DEPLOYMENT.md "Cloudflare resources"):
#   wrangler d1 create polaris_key_<env>          -> database_id
#   wrangler kv namespace create POLARIS_HOT_<env> -> id
# Paste the returned ids over the REPLACE_ME_* placeholders below before deploying;
# they require a one-time bootstrap against the Cloudflare account and cannot be
# committed here as real values.
# ---------------------------------------------------------------------------
[env.prod]
[[env.prod.routes]]
pattern = "key.plrs.im"
custom_domain = true
[[env.prod.durable_objects.bindings]]
name = "RL"
class_name = "RateLimitDO"
[[env.prod.kv_namespaces]]
binding = "HOT"
id = "51b31c97ac2140e5af2402bed1a31e71"
[[env.prod.d1_databases]]
binding = "DB"
database_name = "polaris_key_prod"
database_id = "4bcb24b2-80af-4180-abcc-0e5e99564ed8"
[[env.prod.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@plrs.im"]

[env.staging]
[[env.staging.routes]]
pattern = "key-staging.plrs.im"
custom_domain = true
[[env.staging.durable_objects.bindings]]
name = "RL"
class_name = "RateLimitDO"
[[env.staging.kv_namespaces]]
binding = "HOT"
id = "REPLACE_ME_STAGING_KV_ID"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "polaris_key_staging"
database_id = "REPLACE_ME_STAGING_D1_ID"

[env.dev]
[[env.dev.routes]]
pattern = "key-dev.plrs.im"
custom_domain = true
[[env.dev.durable_objects.bindings]]
name = "RL"
class_name = "RateLimitDO"
[[env.dev.kv_namespaces]]
binding = "HOT"
id = "REPLACE_ME_DEV_KV_ID"
[[env.dev.d1_databases]]
binding = "DB"
database_name = "polaris_key_dev"
database_id = "REPLACE_ME_DEV_D1_ID"

# Required secrets (set with `wrangler secret put <NAME> --env <env>`):
#   KEY_HASH_PEPPER, ADMIN_SESSION_SECRET, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY,
#   GITHUB_WEBHOOK_SECRET, PLATFORM_ADMIN_GROUP, PLATFORM_KEK,
#   PLATFORM_OIDC_ISSUER, PLATFORM_OIDC_CLIENT_ID, PLATFORM_OIDC_CLIENT_SECRET.
# Optional portal-specific secret:
#   PORTAL_SESSION_SECRET (falls back to ADMIN_SESSION_SECRET when omitted).
# Customer portal email:
#   prod binds Cloudflare Email Service as EMAIL and restricts senders to noreply@plrs.im.
#   Set PORTAL_EMAIL_FROM if the default sender should not be "Polaris Key <noreply@plrs.im>".
# Product signing keys and product-scoped secrets are sealed in D1 through the admin API.
