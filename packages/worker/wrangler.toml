name = "polaris-key"
main = "src/index.ts"
# 2026-04-07 enables WebCrypto Ed25519 for config-doc JWS signing.
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# The single assets root, ASSEMBLED from the two built frontends (admin SPA + gated docs
# site) by `scripts/assemble-assets.mjs` — run `pnpm --filter @polaris-key/worker assemble`
# after building, before `wrangler dev`/`deploy`. The directory is gitignored.
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[durable_objects.bindings]]
name = "RL"
class_name = "RateLimitDO"

# P6-03: the update-health counters (`src/updateHealthDo.ts`), one object per (product,
# deliverable, release), reached only through `src/core/updateHealth.ts`. `durable_objects` is
# NOT inheritable, so every environment below repeats every binding.
[[durable_objects.bindings]]
name = "UPDATE_HEALTH"
class_name = "UpdateHealthDO"

# I-02: the atomic single-use store (`src/singleUseDo.ts`): sign-in flows, magic links, device
# codes and email codes, consumed at most once. Reached only through `src/core/singleUse.ts`.
[[durable_objects.bindings]]
name = "SINGLE_USE"
class_name = "SingleUseDO"

[[migrations]]
tag = "v1"
# SQLite-backed, not KV-backed. Cloudflare no longer permits accounts to create the legacy
# KV-backed Durable Object classes that `new_classes` declares, so this line as originally
# written would have failed the very first deploy — and, per the operational-resilience
# review, it also silently broke the "redeploy into a clean Cloudflare account" step that
# every disaster-recovery procedure depends on.
#
# Changing it is free ONLY because this object has never been deployed and therefore holds
# no state. Once RateLimitDO holds data, moving between storage backends is a real migration.
new_sqlite_classes = ["RateLimitDO"]

# P6-03: the update-health counters. A new class, SQLite-backed like RateLimitDO; a migration
# tag is append-only once deployed, so this is its own `v2` rather than an edit of `v1`.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["UpdateHealthDO"]

# I-02: the single-use store. Its own append-only tag, SQLite-backed like the others.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["SingleUseDO"]

# ---------------------------------------------------------------------------
# Scheduled maintenance (R11-09 / R12-10). Without this block the worker has no `scheduled()`
# invocation at all, and `audit`, `portal_audit` and `release_download_tokens` grow forever
# while dormant device seats stay occupied. `src/scheduled.ts` is the handler.
#
# 03:17 UTC, daily. Retention is measured in months (RETENTION_SECONDS = 180 days), so nothing
# is gained by running more often, and a daily tick still bounds the tables and re-runs the
# deploy-time index assertion within a day of any bad deploy. The odd minute is deliberate:
# `0 3 * * *` puts the job in the same second as every other cron on the platform, and a sweep
# that competes with a thundering herd for D1 is a sweep that starts timing out.
#
# Every 15 minutes (P5-02): the store-connector poll (`CONNECTOR_POLL_CRON` in
# `src/scheduled.ts`; `services/distribution/connectors/`). It reads what no store webhook
# covers — Apple's phased release, review submissions, internal TestFlight state; every Google
# Play track through a throwaway edit (P5-03: Play has no release webhooks at all), and, when an
# operator opted in, Play's crash and ANR rates for the vitals auto-halt — for products with
# Distribution on and a connector set up, and nothing for anyone else. The same tick runs the
# update-telemetry auto-halt (P6-03) for products whose operator turned it on, reading only the
# UPDATE_HEALTH Durable Objects. `scheduled()`
# dispatches on `event.cron`; any trigger other than this one runs the maintenance sweep.
# `test/scheduled.test.ts` pins this list to the two constants.
#
# `triggers` is an INHERITABLE wrangler key, so this one block applies to prod, staging and dev
# without a per-environment copy; overriding it for one environment means adding
# `[env.<name>.triggers]`, which then replaces this list for that environment entirely.
# ---------------------------------------------------------------------------
[triggers]
crons = ["17 3 * * *", "*/15 * * * *"]

# ---------------------------------------------------------------------------
# The Core blob store and the bytes host (P2-01; docs/DEPLOYMENT.md "Blob store").
#
# Each environment binds its own R2 bucket as BLOBS — polaris-key-blobs-<env>, created by
# the operator with an AGE lock of 180 days on blobs/, bundles/, deltas/ and gated/, a 1-day
# lifecycle expiry on staging/, and r2.dev DISABLED. No R2 public/custom domain is ever
# attached to a bucket: every read goes through this Worker (core/blobs.ts), the only place
# that sets ETag to the SHA-256, adds Repr-Digest and enforces the per-product ref check.
#
# The bytes host is the SAME Worker on a second custom domain (dl*.plrs.im), declared as a
# route with custom_domain = true; BLOB_ORIGIN names it so src/core/bytesHost.ts can confine
# that host to byte routes. dl.plrs.im is same-site with key.plrs.im (an owner decision that
# deviates from the separate-registrable-domain rule — see docs/security/THREAT-MODEL.md §3);
# the compensating headers and the cookie rules are test-pinned in test/bytesHost.test.ts.
# `vars` is NOT inheritable, so each environment carries its own BLOB_ORIGIN.
#
# The registry host (F-02; docs/DEPLOYMENT.md "Registry host and feeds") is the same Worker on a
# THIRD custom domain, pkg*.plrs.im, with PKG_ORIGIN naming it so src/core/registryHost.ts can
# confine that host to the package-feed routes, its landing page and OCI's /v2/ root. It keeps
# every bytes-host compensation (test/registryHost.test.ts). Its rendered index documents live
# under registry/ in the same bucket, a prefix that gets NO age lock and NO lifecycle rule.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Lazy hot-pair deltas (P4-17; docs/DEPLOYMENT.md "Lazy deltas"). Each environment binds the
# queue pkey-deltas-<env> as a PRODUCER (DELTA_QUEUE) for the nightly sweep; `queues` is NOT
# inheritable, so each environment carries its own. The CONSUMER is a second Worker script,
# `polaris-key-deltas-<env>` from wrangler.deltas.toml, with the dead-letter queue
# pkey-deltas-dlq-<env>: an encode never runs in this Worker's isolates. `LAZY_DELTAS = "runtime"`
# (A-13) hands the switch to the console's platform settings store (`platform_settings`, read by
# both scripts), where it defaults to off: the subsystem stays dormant until an operator turns it
# on in Platform → Settings and opts a product in. `LAZY_DELTAS = "off"` here is the deploy-time
# hard off that no console value can override.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Per-environment bindings. The D1 database and KV namespace are created once,
# per environment, with wrangler (see docs/DEPLOYMENT.md "Cloudflare resources"):
#   wrangler d1 create polaris_key_<env>          -> database_id
#   wrangler kv namespace create POLARIS_HOT_<env> -> id
# Paste the returned ids over the REPLACE_ME_* placeholders below before deploying;
# they require a one-time bootstrap against the Cloudflare account and cannot be
# committed here as real values.
# ---------------------------------------------------------------------------
[env.prod]
[[env.prod.routes]]
pattern = "key.plrs.im"
custom_domain = true
[[env.prod.routes]]
pattern = "dl.plrs.im"
custom_domain = true
[[env.prod.routes]]
pattern = "pkg.plrs.im"
custom_domain = true
[[env.prod.durable_objects.bindings]]
name = "RL"
class_name = "RateLimitDO"
[[env.prod.durable_objects.bindings]]
name = "UPDATE_HEALTH"
class_name = "UpdateHealthDO"
[[env.prod.durable_objects.bindings]]
name = "SINGLE_USE"
class_name = "SingleUseDO"
[[env.prod.kv_namespaces]]
binding = "HOT"
id = "51b31c97ac2140e5af2402bed1a31e71"
[[env.prod.d1_databases]]
binding = "DB"
database_name = "polaris_key_prod"
database_id = "4bcb24b2-80af-4180-abcc-0e5e99564ed8"
[[env.prod.r2_buckets]]
binding = "BLOBS"
bucket_name = "polaris-key-blobs-prod"
# P4-17: the lazy-delta queue, PRODUCER only (the nightly sweep's hot pairs). Its consumer is the
# separate `polaris-key-deltas-prod` script (wrangler.deltas.toml).
[[env.prod.queues.producers]]
binding = "DELTA_QUEUE"
queue = "pkey-deltas-prod"
# A-14: the lazy-delta dead-letter queue, bound as a producer ONLY so the Operations page can read
# its backlog (`DELTA_DLQ.metrics()`). Nothing sends to it: test/platformOperations.test.ts
# asserts no source file calls `.send`/`.sendBatch` on it (THREAT-MODEL "Platform settings and
# operations").
[[env.prod.queues.producers]]
binding = "DELTA_DLQ"
queue = "pkey-deltas-dlq-prod"
# A-11: the running version's own Cloudflare id, tag and upload time (`env.CF_VERSION_METADATA`).
# A binding, so NOT inherited from the top level (`wrangler deploy --dry-run` warns): one per env.
[env.prod.version_metadata]
binding = "CF_VERSION_METADATA"
[env.prod.vars]
# ADMIN.md A-1: names the deployment to the console (/manage/api/me `environment`).
PKEY_ENVIRONMENT = "prod"
BLOB_ORIGIN = "https://dl.plrs.im"
# F-02: the registry host (core/registryHost.ts); it answers only the package-feed routes.
PKG_ORIGIN = "https://pkg.plrs.im"
# P2b-06: the console host, where the download page on dl.plrs.im links the storefront feeds.
CONSOLE_ORIGIN = "https://key.plrs.im"
# P2-02: the bucket name the upload tickets' R2 temporary credentials are scoped to (the
# same bucket as the BLOBS binding above; the S3 API names buckets, the binding does not).
BLOBS_BUCKET_NAME = "polaris-key-blobs-prod"
# P4-17: lazy hot-pair deltas' kill switch. A-13: "runtime" = the console's platform settings
# store decides (default off); "off" = a hard off no console value can override.
LAZY_DELTAS = "runtime"
# F-10 automation: the deploy hook (src/platformDeploy.ts, POST /webhooks/deploy). Only this
# repository's .github/workflows/deploy.yml, in the `production` environment, at a protected
# v* tag, may call it with its GitHub OIDC token; the ids are GitHub's numeric repository and
# owner ids (`gh api repos/vladzaharia/polaris-key --jq '.id, .owner.id'`), pinned against renames.
PLATFORM_REPOSITORY = "vladzaharia/polaris-key"
PLATFORM_REPOSITORY_ID = "1278490640"
PLATFORM_REPOSITORY_OWNER_ID = "79390"
# I-18: the shared sign-in sender (core/emailSender.ts). Uncomment once auth.plrs.im passes
# `pnpm --filter @polaris-key/worker email:dns-check` and the staging send is aligned; until then
# the Worker sends from noreply@plrs.im.
# EMAIL_SENDER_ADDRESS = "noreply@auth.plrs.im"
# I-18: "registered" once auth.plrs.im and noreply@auth.plrs.im are registered for Apple's
# private email relay; until then relay recipients get email_unavailable instead of a bounce.
# EMAIL_APPLE_RELAY = "registered"
# I-18: the deploy-wide daily cap on one product's passthrough mail (default 500 in code; a
# product's email_product_caps row wins).
# EMAIL_PRODUCT_DAILY_CAP = "500"
# I-18: sign-in and account mail. The binding may send only from these addresses: today's
# noreply@plrs.im, and the auth sending subdomain's noreply@auth.plrs.im, which the Worker uses
# once EMAIL_SENDER_ADDRESS above names it (RUNBOOK "Sign-in email").
[[env.prod.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@plrs.im", "noreply@auth.plrs.im"]

