  /{product}/devices/register:
    post:
      operationId: registerDevice
      tags: [core]
      summary: Keyless device registration (policy-gated)
      description: >
        Mints a `pkeyt_` device token under the product's registration policy: `open` mints
        directly; `requires-identity` needs an identity exchange (the Identity service
        authorizes it); `requires-license` refuses uniformly (`registration_closed`) —
        tokens then come only from license activation/enrollment.


        The device id arrives as the `X-PKey-Device` HEADER, not a body field, and unlike
        activation it must be exactly 32 base64url characters. The optional JSON body carries
        only a fingerprint. `registration_closed` is ONE body for four causes — policy is
        `requires-license`; policy is `requires-identity` and no valid product session was
        presented; policy is `requires-identity` on an identity-disabled product; the device
        id is already bound to a real license — because telling them apart is the
        reconnaissance being refused. Re-registering the same id ROTATES the token (the old
        one dies at once) and preserves `firstSeen`. This route answers in the NESTED shape
        throughout.
      parameters: [{ $ref: "#/components/parameters/Product" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FingerprintEnvelope" }
            examples:
              anchorOnly:
                summary: A single anchor component (test/register.test.ts)
                value:
                  fingerprint:
                    components: { machineUuid: uuidxxxxxxxxxxxxxxxxxx }
      responses:
        "200":
          description: "Registered. `cache-control: no-store`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationResult" }
              examples:
                minted:
                  summary: test/register.test.ts
                  value:
                    token: pkeyt_Zk8LqR8nT0sYp2vcEgHj6Bf3QdNwXr7uKmA1sVe9tYo
                    deviceId: 6Yl0uQ2xZk8LqR8nT0sYp2vcEgHj6Bf3
        "400":
          description: >
            Missing or malformed `X-PKey-Device` — NESTED, with `message` beside `error`
            rather than inside it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
              examples:
                badDeviceId:
                  value:
                    error: { code: bad_request }
                    message: missing or malformed device id
        "403":
          description: Registration closed under the product's policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
              examples:
                closed:
                  summary: The single body for all four causes (test/register.test.ts)
                  value: { error: { code: registration_closed } }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429":
          description: >
            10 registrations per 60 s per client IP, fail-closed — NESTED. A
            `requires-license` product is refused BEFORE the limiter so its budget cannot be
            drained by strangers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
              examples:
                limited: { value: { error: { code: rate_limited } } }
    options:
      operationId: preflightRegisterDevice
      tags: [core]
      summary: CORS preflight
      description: >
        Browser preflight for a page on one of the product's `web.origins`. Answered
        before service dispatch, so the result never depends on whether the service
        behind this path is enabled. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/devices/attest/challenge:
    post:
      operationId: attestChallenge
      tags: [core]
      summary: A single-use device attestation challenge (P6-02)
      description: >
        Issues a challenge for `POST /{product}/devices/attest`: 32 random bytes, base64url,
        single-use, valid five minutes and bound to the calling device. `requestHash` is the
        only value the client hands the platform API —
        `base64url(SHA-256("pkey-attest/1:<product>:<deviceId>:<challenge>"))`. App Attest
        passes `SHA-256(UTF-8(requestHash))` as the client data hash; a standard Play Integrity
        request passes `requestHash` verbatim. `play.cloudProjectNumber` is present when the
        operator's trust policy names the Google Cloud project the app's integrity requests use.
        10 challenges per device per hour, fail-closed. Auth requires a usable license only
        when the product enables the License service. NESTED errors.
      security: [{ deviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Product" }]
      responses:
        "200":
          description: "A challenge. `cache-control: no-store`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttestChallenge" }
              examples:
                issued:
                  summary: test/attest.test.ts
                  value:
                    challenge: q1Wm2dS7oP0b9xYzA4cVfGhJkLnR3tU6wE8iQ5rT2yU
                    requestHash: Hs3n0bM2cV5xZ8aQ1wE4rT7yU0iO3pL6kJ9hG2fD5sA
                    expiresAt: 1767225900
                    play: { cloudProjectNumber: "123456789012" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429":
          description: 10 challenges per device per hour, fail-closed — NESTED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
              examples:
                limited: { value: { error: { code: rate_limited } } }

  /{product}/devices/attest:
    post:
      operationId: attestDevice
      tags: [core]
      summary: Raise the device's trust level with App Attest or Play Integrity (P6-02)
      description: >
        Verifies an attestation against a challenge from `/devices/attest/challenge` and, on
        success, records the device at trust level `attested` (on the device row only: no signed
        document and no device token changes). The challenge is spent before verification, pass
        or fail. `app-attest`: the CBOR attestation object's `x5c` chain to the pinned Apple App
        Attestation Root CA, the nonce extension, the key id, the RP ID hash of
        `<TeamID>.<bundleId>` (the Team ID from the operator's trust policy, the bundle ids from
        the live App Store and TestFlight outlets), counter 0, and the aaguid of the policy's
        environment. `play-integrity`: the token decoded by Google with the product's pinned
        `google-service-account` credential, then the package, `requestHash`, a timestamp within
        five minutes, `PLAY_RECOGNIZED` and `MEETS_DEVICE_INTEGRITY`; the licensing verdict is
        recorded, not required. A refused verdict is recorded on the device and never changes
        its level. 4 attempts per device per hour, fail-closed. NESTED errors.
      security: [{ deviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Product" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttestRequest" }
            examples:
              playIntegrity:
                summary: test/attest.test.ts
                value:
                  kind: play-integrity
                  token: eyJhbGciOiJBMjU2S1ciLCJlbmMiOiJBMjU2R0NNIn0.example
                  challenge: q1Wm2dS7oP0b9xYzA4cVfGhJkLnR3tU6wE8iQ5rT2yU
      responses:
        "200":
          description: "The device is attested. `cache-control: no-store`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttestResult" }
              examples:
                attested:
                  summary: test/attest.test.ts
                  value:
                    {
                      trustLevel: attested,
                      kind: play-integrity,
                      attestedAt: 1767225700,
                    }
        "400":
          description: A malformed body — NESTED, with `message` beside `error`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
              examples:
                badKind:
                  value:
                    error: { code: bad_request }
                    message: kind must be "app-attest" or "play-integrity"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409":
          description: >
            The product is not set up for this kind: no App Attest Team ID in the trust policy
            or no App Store/TestFlight outlet; no Play outlet with a pinned
            `google-service-account` credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
              examples:
                unavailable:
                  value:
                    error: { code: attestation_unavailable }
                    message: Play Integrity is not set up for this product (a play outlet with a google-service-account credential pinned to its package)
        "422":
          description: >
            A used, expired or foreign challenge, or a verdict that failed a check. One code
            for every cause; the reason is kept in the audit trail and on the device row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
              examples:
                rejected:
                  value:
                    error: { code: attestation_rejected }
                    message: the attestation did not verify
        "429":
          description: 4 attempts per device per hour, fail-closed — NESTED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
              examples:
                limited: { value: { error: { code: rate_limited } } }
        "503":
          description: Google's Play Integrity service could not be reached with the product's credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
              examples:
                upstream:
                  value:
                    error: { code: attestation_unavailable }
                    message: Play Integrity answered 500

