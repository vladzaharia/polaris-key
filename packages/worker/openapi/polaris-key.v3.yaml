      summary: The device-authorization page (side-effect-free GET)
      description: >
        Renders the user code, the device label (`deviceName` if given, else the device id)
        and the product slug, plus a POST form carrying a single-use hidden field named
        `csrf`. Nothing is confirmed by this GET — that is the point of splitting the two
        methods. Served under the strict script-free static-HTML CSP with `no-store` and
        `referrer-policy: no-referrer`, so the device code never leaks in a Referer.
