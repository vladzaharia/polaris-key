        The gate reads `X-PKey-Version` (defaulting to `0.0.0`) and `X-PKey-Channel`, under the
        channel vocabulary of WIRE-CONTRACT-V3 §5.1: `stable`, `beta`, `pr`/`pr-<n>`, `dev` and
        manual names, with `staging` (→ `beta`) and `latest` (→ `stable`) accepted as aliases.
