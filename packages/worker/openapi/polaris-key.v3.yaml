        no-transform`; others `private, no-store, no-transform` after the delivery access (the
        strictest of the deliverables whose releases carry the digest) admits the caller. Served on the console host (always an octet-stream attachment) and on
        the bytes host.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: sha256
          in: path
          required: true
