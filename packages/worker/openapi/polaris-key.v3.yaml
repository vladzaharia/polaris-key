  # ── The customer portal's library, product and media routes (PX-W1, docs/design/PORTAL.md
  # G1, G5, G16) and Discover (PX-W10, G24, G25). The rest of the portal API stays narrative (see
  # the header); these are pinned here and in `test/routeCoverage.test.ts` (PORTAL_KIND_PATHS). Root paths on the
  # console host, never CORS: they share this origin with the portal session cookie.
  /api/library:
    get:
      operationId: getPortalLibrary
      tags: [portal]
      summary: The signed-in account's library
      description: >
        One entry per product the portal account holds a licence for (portal-enabled products
        only): the product's presentation from its `.pkey/distribution` root `listing`, the
        status of its best licence, that licence's summary with seats, and the support links.
        Art is only ever a same-origin `/media/…` URL, and only when the media proxy would serve
        it. Session-authenticated by the portal cookie; `cache-control: no-store`.
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalLibrary" }
              examples:
                oneProduct:
                  summary: One product, one licence, two of three seats in use
                  value:
                    products:
                      - product: tidewater
                        name: Tidewater Studio
                        developerName: Fennick Studio
                        tintColor: "#1f3b5c"
                        website: https://tidewater.example
                        iconUrl: /media/tidewater/icon?v=3f9a0c2d1e4b5a6c
                        headerUrl: /media/tidewater/header?v=8b7c6d5e4f3a2b1c
                        support:
                          url: https://tidewater.example/help
                          email: help@tidewater.example
                        status: active
                        license:
                          id: lic_8f2a
                          tier: pro
                          status: active
                          licenseStatus: active
                          activatedAt: 1790000000
                          expiresAt: null
                          maxOfflineDays: 14
                          deviceLimit: 3
                          activeSeatCount: 2
                          deviceCount: 3
                          dormantCount: 1
                        licenseCount: 1
                        addedAt: 1790000000
                    discoverCount: 1
        "401":
          description: No portal session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
  /api/products/{product}:
    get:
      operationId: getPortalProduct
      tags: [portal]
      summary: One product in the signed-in account's library
      description: >
        The product's presentation, its `services` (each service's own toggle, so the page shows
        a section only for a service that is on), its status, and every linked licence, best
        first (status precedence, then the later expiry), each with its seats, its entitlements
        and its authorized devices; a device past the dormancy window is `dormant` and holds no
        seat. Each licence also carries its `purchase` (G8): a store purchase, the developer, a
        sign-in or a free auto-issue, with its store grants. `404` when the account holds no licence for the product, or the developer has the
        portal off for it. Session-authenticated by the portal cookie; `cache-control: no-store`.
      parameters: [{ $ref: "#/components/parameters/Product" }]
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalProduct" }
              examples:
                product:
                  summary: A product with one licence and a dormant device
                  value:
                    product: tidewater
                    name: Tidewater Studio
                    developerName: Fennick Studio
                    tintColor: "#1f3b5c"
                    website: https://tidewater.example
                    iconUrl: /media/tidewater/icon?v=3f9a0c2d1e4b5a6c
                    headerUrl: null
                    support:
                      { url: https://tidewater.example/help, email: null }
                    services:
                      license: true
                      config: true
                      release: true
                      distribution: true
                      update: false
                      identity: false
                    status: active
                    addedAt: 1790000000
                    returnTo:
                      { origins: [https://app.tidewater.example], schemes: [] }
                    licenses:
                      - id: lic_8f2a
                        tier: pro
                        status: active
                        licenseStatus: active
                        activatedAt: 1790000000
                        expiresAt: null
                        maxOfflineDays: 14
                        deviceLimit: 3
                        activeSeatCount: 1
                        deviceCount: 2
                        dormantCount: 1
                        purchase:
                          source: store
                          store: steam
                          stores: [steam]
                          grants:
                            - store: steam
                              state: active
                              grantedAt: 1790000000
                              revokedAt: null
                              flag: pro
                              label: Pro effects
                        entitlements: []
                        devices:
                          - deviceId: dev-studio
                            label: Studio PC
                            platform: windows
                            arch: x64
                            appVersion: 2.4.0
                            firstSeen: 1790000000
                            lastSeen: 1790500000
                            dormant: false
                          - deviceId: dev-old
                            label: Old laptop
                            platform: macos
                            arch: arm64
                            appVersion: 2.1.0
                            firstSeen: 1780000000
                            lastSeen: 1780000000
                            dormant: true
        "401":
          description: No portal session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/signin/requests/{request}:
    get:
      operationId: getSignInRequest
      tags: [portal]
      summary: One app sign-in request, as the sign-in card renders it
      description: >
        PX-W13 (WIRE-CONTRACT-V4 §12.7.2, docs/design/PORTAL.md §4.7, G28). The card behind
        "<App> wants you to sign in" reads the request ONLY through this route: the client
        record (`appName`, `developerName`, a same-origin `iconUrl`, the client `kind`, the
        product's registered `origins` and the services the sign-in reaches), the device's
        normalised label and the device-code user code. No display query parameter (`appName`,
        `name`, `icon`, `developer`, `origin`, `device`) is read anywhere. An app name that
        fails the display-name rules at render time is replaced by the product slug with
        `nameVerified: false`. The handle is bound to the browser that created it by the
        `__Host-pk_req` binder cookie; no portal session is needed. A handle that is unknown,
        expired, presented without its binder, or for a product whose Identity toggle is off
        answers 404. `cache-control: no-store`.
      parameters:
        - name: request
          in: path
          required: true
          description: The opaque handle, `rq_` and 22 base64url characters.
          schema: { type: string, pattern: "^rq_[A-Za-z0-9_-]{22}$" }
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInRequestView" }
              examples:
                deviceCode:
                  summary: A device-code sign-in
                  value:
                    request: rq_3q2Lk0bW9xV1mZp8RtYc4A
                    client:
                      product: mossgarden
                      kind: device
                      appName: Mossgarden
                      developerName: Fennick Studio
                      iconUrl: /media/mossgarden/icon?v=3f9a0c2d1e4b5a6c
                      origins: []
                      services: { license: true, cloudSync: false }
                      nameVerified: true
                    deviceLabel: Living room TV
                    userCode: WDJB-MJHT
                    expiresAt: 1780000600
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/signin/requests/{request}/consent:
    get:
      operationId: getSignInConsent
      tags: [portal]
      summary: What the app gets if the signed-in person continues (app consent)
      description: >
        PX-W13 (WIRE-CONTRACT-V4 §12.7.3, D19, D22). Needs the portal session AND the request's
        binder cookie. `items` lists the licence line (the anchor licence the device would draw
        on, a dry run that writes nothing, and how many others the account holds for this
        product: 0 under the `legacy` entitlement model), Cloud Sync when the product runs it,
        and the profile claims. `scopeHash` is the SHA-256 of the canonical JSON
        `{claims, services, v: 1}`; `firstTime` and `changed` compare it with the app consent
        already recorded (`account_product_grants.scope_hash`): only a change of claims or
        services asks again. `person` is shown to the person only. 404 as for the request
        itself. `cache-control: no-store`.
      parameters:
        - name: request
          in: path
          required: true
          description: The opaque handle, `rq_` and 22 base64url characters.
          schema: { type: string, pattern: "^rq_[A-Za-z0-9_-]{22}$" }
      responses:
        "200":
          description: The app-consent view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConsentView" }
              examples:
                firstTime:
                  summary: A first sign-in to the app, with a licence
                  value:
                    request: rq_3q2Lk0bW9xV1mZp8RtYc4A
                    person:
                      displayName: Ada
                      email: ada@example.com
                      avatarUrl: null
                    items:
                      - kind: license
                        anchor:
                          name: Pro
                          tierName: Pro
                          term: perpetual
                          seat: { position: 2, limit: 5 }
                        more: 0
                      - kind: profile
                        claims: [name, picture, email]
                    scopeHash: 6b0f7d0a4c8e2f9b1d3a5c7e9f0b2d4a6c8e0f1b3d5a7c9e1f3b5d7a9c0e2f4b
                    firstTime: true
                    changed: false
        "401":
          description: No portal session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/discover:
    get:
      operationId: getPortalDiscover
      tags: [portal]
      summary: The products the signed-in account could add for free
      description: >
        PX-W10 (docs/design/PORTAL.md §4.16, G24). Every product whose licence policy would
        auto-issue to this account on the product's first sign-in, evaluated by the same policy
        function in dry-run mode: nothing is written. A product qualifies through its
        `oidcDefault` auto-issue rule (`reason: free_with_account`) or a `groupRoleMap` group the
        account holds at the platform IdP (`reason: group:<group>`). Only products that run
        License, authenticate against the platform issuer with auto-linking on, and have the
        portal and Discover (`discoverEnabled`) on are considered; purchase-only and
        operator-issued products, and products the account already holds, never appear. An
        account with no platform identity is offered nothing. Every offer carries its reason.
        Session-authenticated by the portal cookie; `cache-control: no-store`.
      responses:
        "200":
          description: The offers, in product-name order (possibly none).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalDiscover" }
              examples:
                oneOffer:
                  summary: One free product
                  value:
                    offers:
                      - product: mossgarden
                        name: Mossgarden
                        developerName: Fennick Studio
                        tintColor: "#2f5d3a"
                        website: https://mossgarden.example
                        iconUrl: /media/mossgarden/icon?v=3f9a0c2d1e4b5a6c
                        headerUrl: null
                        support: null
                        platforms: [macos, windows]
                        offer:
                          tier: free
                          tierLabel: Free
                          deviceLimit: 5
                          expiresAt: null
                          expiryDays: null
                        reason: free_with_account
        "401":
          description: No portal session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
  /api/discover/{product}/claim:
    post:
      operationId: claimPortalDiscover
      tags: [portal]
      summary: Add a Discover product to the library
      description: >
        PX-W10 (G25). Re-evaluates the offer server-side and mints the licence through the
        auto-issue path itself (the product sign-in's), so it carries exactly the tier, limits
        and entitlements a first sign-in would give; the licence is linked to the account and
        audited with `source: discover`. Idempotent per account and product: a repeat, or a
        racing double submit, answers the same licence with `added: false` and mints nothing.
        `409 not_eligible` when the product is not (or no longer) offered to this account,
        including an unknown product. Needs the `X-PKey-Portal-CSRF` header. Rate-limited on the
        account-wide bucket the activate preview and the key claim share (10 a minute).
      parameters: [{ $ref: "#/components/parameters/Product" }]
      responses:
        "200":
          description: "The licence, new (`added: true`) or already held (`added: false`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalDiscoverClaim" }
              examples:
                added:
                  summary: Just added
                  value:
                    added: true
                    product: mossgarden
                    license:
                      id: lic_3c9d
                      tier: free
                      tierLabel: Free
                      status: active
                      usable: true
                      expiresAt: null
                      deviceLimit: 5
        "401":
          description: No portal session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "403":
          description: Missing or wrong CSRF header.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "409":
          description: "`not_eligible`: the product is not offered to this account; nothing was minted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                notEligible:
                  value:
                    {
                      error: not_eligible,
                      message: this product is no longer offered to your account,
                    }
        "429":
          description: "`rate_limited`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
  /media/{product}/{asset}:
    get:
      operationId: getPortalMedia
      tags: [portal]
      summary: A product's listing art, served same-origin
      description: >
        The customer portal's media proxy: the product's `listing.iconUrl` (`asset` = `icon`,
        at most 1 MiB) or `listing.headerUrl` (`header`, at most 5 MiB), fetched by the Worker
        and served from this origin, because the portal's CSP is `img-src 'self' data:`. Public
        (listing art is public store-page metadata). The source must be an https URL on a
        GitHub-hosted name (`github.com`, `*.githubusercontent.com`); redirects are followed by
        hand, at most three, each re-checked; the bytes must be a PNG, JPEG, WebP or GIF by their
        magic numbers, and the response carries the sniffed type, `x-content-type-options:
        nosniff`, `content-security-policy: default-src 'none'; sandbox` and
        `cross-origin-resource-policy: same-origin`. Every refusal is the same `404`
        (THREAT-MODEL "Portal media proxy").
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - {
            name: asset,
            in: path,
            required: true,
            schema: { type: string, enum: [icon, header] },
            description: "Which listing field: `icon` (iconUrl) or `header` (headerUrl).",
          }
        - {
            name: v,
            in: query,
            required: false,
            schema: { type: string, pattern: "^[0-9a-f]{16}$" },
            description: "The source URL's version (the first 16 hex digits of its SHA-256), as `GET /api/library` hands it out. When it is the current one the answer is immutable for a year; otherwise it is cached for five minutes.",
          }
      responses:
        "200":
          description: "The image. `cache-control: public, max-age=31536000, immutable` with the current `v`, else `public, max-age=300`."
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Too many upstream fetches for this product from this client (cache misses only).
  # ── Godot tokenised URLs (F-21) ──
