  # ── registry host (pkg.plrs.im) ───────────────────────────────────────────────
  #
  # F-02 (plans/F-01.md §6.1, §6.10). The registry host is the same Worker on a third custom
  # domain, so its paths carry a path-level `servers` override. Each ecosystem package (F-04 to
  # F-09) adds its routes here under tag `registry`, each linking its protocol specification
  # rather than restating it; `test/routeCoverage.test.ts` checks this section against
  # `mount.ts` `REGISTRY_ROUTES` in both directions (its `REGISTRY_PATHS` table).
  /:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    get:
      operationId: registryLanding
      tags: [registry]
      summary: The registry host's landing page (registry host only)
      description: >
        F-02. A static HTML page naming the host (the Polaris Key Delivery lockup, BRAND §8) and
        linking the console and the docs. No request input reaches it. It carries the
        inert-document policy the host checks (`sandbox` with no tokens, `default-src 'none'`,
        the one stylesheet by hash, `img-src data:`, `base-uri`, `form-action` and
        `frame-ancestors` `'none'`), plus the host's own headers: `nosniff`,
        `Referrer-Policy: no-referrer`, `Cross-Origin-Resource-Policy: same-origin`, no cookie
        read or set, no CORS. On the console host `/` is unchanged.
      responses:
        "200":
          description: "HTML. `text/html; charset=utf-8`, `cache-control: public, max-age=3600`."
          content:
            text/html:
              schema: { type: string }
    head:
      operationId: registryLandingHead
      tags: [registry]
      summary: The registry host's landing page, headers only (registry host only)
      description: F-02. As `GET /`, with no body.
      responses:
        "200":
          description: "`text/html; charset=utf-8`, `cache-control: public, max-age=3600`."
  # ── PyPI (F-05) ───────────────────────────────────────────────────────────────
  /pypi/{owner}/simple/:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - {
          name: owner,
          in: path,
          required: true,
          description: "The owner (product slug).",
          schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" },
        }
    get:
      operationId: pypiSimpleIndex
      tags: [registry]
      summary: PyPI project list (registry host only)
      description: >
        F-05. The owner's project list in the Simple Repository API
        (https://packaging.python.org/en/latest/specifications/simple-repository-api/), API
        version 1.1. PEP 691 JSON (`application/vnd.pypi.simple.v1+json`, the exact type pip and
        uv require) whenever `Accept` lists the JSON type; otherwise the inert PEP 503 HTML form
        (`application/vnd.pypi.simple.v1+html`, the registry host's one HTML answer: every value
        escaped, no script, form or style, served under `sandbox; default-src 'none';
        frame-ancestors 'none'; base-uri 'none'; form-action 'none'`). With the feed's
        `htmlFallback` off, a client that cannot take JSON gets 406. A project whose delivery
        access is stricter than the feed's is omitted. `/pypi/{owner}/simple` answers 301 here.
        The feed's access check runs first: a feed that is off (or an unknown owner) is the
        not-found, a non-public feed the `Basic` challenge.
      responses:
        "200":
          description: >
            The project list. `Vary: Accept`; `cache-control: public, max-age=60,
            stale-while-revalidate=60` and a strong ETag (the body's SHA-256) on a public feed.
          content:
            application/vnd.pypi.simple.v1+json:
              schema:
                type: object
                required: [meta, projects]
                properties:
                  meta:
                    {
                      type: object,
                      properties:
                        { api-version: { type: string, const: "1.1" } },
                    }
                  projects:
                    type: array
                    items:
                      {
                        type: object,
                        required: [name],
                        properties: { name: { type: string } },
                      }
            application/vnd.pypi.simple.v1+html:
              schema: { type: string }
        "304": { description: "Not modified (`If-None-Match`)." }
        "401": { description: "A non-public feed (`WWW-Authenticate: Basic`)." }
        "404": { description: "The not-found (`no-store`)." }
        "406":
          {
            description: "The feed's `htmlFallback` is off and `Accept` admits no JSON type.",
          }
    head:
      operationId: pypiSimpleIndexHead
      tags: [registry]
      summary: PyPI project list, headers only (registry host only)
      description: F-05. As `GET /pypi/{owner}/simple/`, with no body.
      responses:
        "200": { description: "The project list's headers." }
        "404": { description: "The not-found." }
  /pypi/{owner}/simple/{project}/:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - {
          name: owner,
          in: path,
          required: true,
          description: "The owner (product slug).",
          schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" },
        }
      - {
          name: project,
          in: path,
          required: true,
          description: "The PEP 503 normalised project name.",
          schema: { type: string },
        }
    get:
      operationId: pypiSimpleProject
      tags: [registry]
      summary: PyPI project page (registry host only)
      description: >
        F-05. One project's page in the Simple Repository API, API version 1.1 (PEP 691, PEP 700),
        negotiated as the project list is. Each wheel and sdist of every version is listed with
        `hashes.sha256` (the `#sha256=` fragment in HTML; corruption protection only),
        `requires-python`, `size`, `upload-time` and, for a wheel published with its
        `*.dist-info/METADATA`, `core-metadata: {sha256}` (PEP 714; `data-core-metadata` in
        HTML). A yanked version's files carry PEP 592's `yanked` with the reason and stay
        fetchable; PyPI has no deprecation or channel tags, so a deprecated version is listed
        as live and pre-releases are chosen by their PEP 440 version. File URLs are relative to
        the page (`../../files/{sha256}/{filename}`). Any non-normalised name, and a name without
        its trailing slash, answers 301 to this URL (PEP 503). Rendered when a package changes
        and kept under `registry/` in the blob bucket.
      responses:
        "200":
          description: >
            The project page. `Vary: Accept`; `cache-control: public, max-age=60,
            stale-while-revalidate=60` and a strong ETag (the body's SHA-256) on a public feed.
          content:
            application/vnd.pypi.simple.v1+json:
              schema:
                type: object
                required: [meta, name, versions, files]
                properties:
                  meta:
                    {
                      type: object,
                      properties:
                        { api-version: { type: string, const: "1.1" } },
                    }
                  name: { type: string }
                  versions: { type: array, items: { type: string } }
                  files:
                    type: array
                    items:
                      type: object
                      required: [filename, url, hashes, yanked, size]
                      properties:
                        filename: { type: string }
                        url: { type: string }
                        hashes:
                          {
                            type: object,
                            properties: { sha256: { type: string } },
                          }
                        requires-python: { type: string }
                        core-metadata:
                          {
                            type: object,
                            properties: { sha256: { type: string } },
                          }
                        yanked: { oneOf: [{ type: boolean }, { type: string }] }
                        size: { type: integer }
                        upload-time: { type: string }
            application/vnd.pypi.simple.v1+html:
              schema: { type: string }
        "301":
          {
            description: "To the PEP 503 normalised name with its trailing slash.",
          }
        "304": { description: "Not modified (`If-None-Match`)." }
        "401":
          {
            description: "A non-public feed or project (`WWW-Authenticate: Basic`).",
          }
        "404":
          {
            description: "The not-found (`no-store`), whether the project or the feed is absent.",
          }
        "406":
          {
            description: "The feed's `htmlFallback` is off and `Accept` admits no JSON type.",
          }
    head:
      operationId: pypiSimpleProjectHead
      tags: [registry]
      summary: PyPI project page, headers only (registry host only)
      description: F-05. As `GET /pypi/{owner}/simple/{project}/`, with no body.
      responses:
        "200": { description: "The project page's headers." }
        "301": { description: "To the normalised name." }
        "404": { description: "The not-found." }
  /pypi/{owner}/files/{sha256}/{filename}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - {
          name: owner,
          in: path,
          required: true,
          description: "The owner (product slug).",
          schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" },
        }
      - {
          name: sha256,
          in: path,
          required: true,
          description: "The file's SHA-256 (lower-case hex).",
          schema: { type: string, pattern: "^[0-9a-f]{64}$" },
        }
      - {
          name: filename,
          in: path,
          required: true,
          description: "The file's name, or a wheel's name plus `.metadata`.",
          schema: { type: string },
        }
    get:
      operationId: pypiFile
      tags: [registry]
      summary: PyPI file or PEP 658 metadata (registry host only)
      description: >
        F-05. A wheel or sdist a project page lists, named by its SHA-256, so the URL is
        immutable. `{wheel}.metadata` answers that wheel's core metadata (PEP 658, advertised as
        `core-metadata`). The name and the hash must both match a file of the owner's package,
        and the owner must hold the blob's reference; anything else is the not-found. Served
        as `application/octet-stream` with `attachment`, `ETag: "<sha256>"`, `Repr-Digest`,
        `Accept-Ranges: bytes` and, on a public feed, `cache-control: public, max-age=31536000,
        immutable, no-transform`.
      responses:
        "200":
          description: The bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: "A satisfiable `Range`." }
        "304": { description: "Not modified (`If-None-Match`)." }
        "401":
          {
            description: "A non-public feed or project (`WWW-Authenticate: Basic`).",
          }
        "404": { description: "The not-found (`no-store`)." }
        "416": { description: "An unsatisfiable `Range`." }
    head:
      operationId: pypiFileHead
      tags: [registry]
      summary: PyPI file or PEP 658 metadata, headers only (registry host only)
      description: F-05. As `GET /pypi/{owner}/files/{sha256}/{filename}`, with no body.
      responses:
        "200": { description: "The file's headers." }
        "404": { description: "The not-found." }
  /v2/:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    get:
      operationId: ociBase
      tags: [registry]
      summary: OCI distribution base endpoint (registry host only)
      description: >
        F-02, F-21. The OCI Distribution Specification's base endpoint (`end-1`,
        https://github.com/opencontainers/distribution-spec/blob/main/spec.md#determining-support).
        With `REGISTRY_TOKEN_KEY` unset: always 200 with `Docker-Distribution-API-Version:
        registry/2.0` and the body `{}`. Once it is set (plans/F-20.md Q1): 200 only to a request
        bearing a valid pull token from `/v2/token`, else 401 with
        `WWW-Authenticate: Bearer realm="https://pkg.plrs.im/v2/token",service="pkg.plrs.im"`,
        as Docker Hub and GHCR answer; anonymous pull tokens keep public pulls working, and
        `docker login` checks its credentials at once. `/v2` answers the same. Any method other
        than GET and HEAD under `/v2/` is 405 with OCI's error JSON (`UNSUPPORTED`).
      responses:
        "200":
          description: The registry speaks OCI distribution v2.
          headers:
            Docker-Distribution-API-Version:
              schema: { type: string, const: registry/2.0 }
          content:
            application/json:
              schema: { type: object, maxProperties: 0 }
              examples:
                base: { value: {} }
        "401": { $ref: "#/components/responses/OciError" }
    head:
      operationId: ociBaseHead
      tags: [registry]
      summary: OCI distribution base endpoint, headers only (registry host only)
      description: F-02. As `GET /v2/`, with no body.
      responses:
        "200":
          description: The registry speaks OCI distribution v2.
          headers:
            Docker-Distribution-API-Version:
              schema: { type: string, const: registry/2.0 }
  # ── npm (F-04) ──
  /npm/{owner}/{escapedName}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    get:
      operationId: npmPackument
      tags: [registry]
      summary: npm packument (registry host only)
      description: >
        F-04. The package metadata document of the npm registry API
        (https://github.com/npm/registry/blob/main/docs/responses/package-metadata.md), for a
        scoped name escaped the way npm clients send it (`@scope%2fname`; `%2f` and `%2F` are
        one document, and `/npm/{owner}/{scope}/{name}` is the same route unescaped). Scoped names
        only, and the scope must be the feed's; anything else is the not-found. The full document
        (`application/json`) by default; the abbreviated one
        (`application/vnd.npm.install-v1+json`) when `Accept` lists it first, as installers do.
        `dist.tarball` is absolute on this host, `dist.integrity` is SHA-512 SRI (SHA-256 when the
        ingest had no SHA-512), `dist.shasum` SHA-1; `dist-tags` come from the release channels
        (`stable` is `latest`). npm has no yank: a yanked version stays listed and installable by
        exact version, leaves every dist-tag and carries `deprecated` (the reason); a deprecated
        one carries its message. Every read runs the feed's access check before the edge cache.
      parameters:
        - $ref: "#/components/parameters/NpmOwner"
        - name: escapedName
          in: path
          required: true
          description: The scoped package name with its slash escaped, `@scope%2fname`.
          schema:
            {
              type: string,
              pattern: "^@[a-z0-9][a-z0-9._~-]*%2[fF][a-z0-9][a-z0-9._~-]*$",
            }
        - $ref: "#/components/parameters/NpmAccept"
      responses:
        "200": { $ref: "#/components/responses/NpmPackument" }
        "304": { $ref: "#/components/responses/NpmNotModified" }
        "401": { $ref: "#/components/responses/NpmBasicChallenge" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
    head:
      operationId: npmPackumentHead
      tags: [registry]
      summary: npm packument, headers only (registry host only)
      description: F-04. As `GET /npm/{owner}/{escapedName}`, with no body.
      parameters:
        - $ref: "#/components/parameters/NpmOwner"
        - {
            name: escapedName,
            in: path,
            required: true,
            schema: { type: string },
          }
        - $ref: "#/components/parameters/NpmAccept"
      responses:
        "200": { description: The packument's headers. }
        "401": { description: npm's Basic challenge (a non-public feed). }
        "404": { description: The not-found. }
  /npm/{owner}/{scope}/{name}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    get:
      operationId: npmPackumentUnescaped
      tags: [registry]
      summary: npm packument, unescaped name (registry host only)
      description: >
        F-04. The same document as `/npm/{owner}/{escapedName}`, for a client that sends the
        scoped name with a literal slash (`@scope/name`).
      parameters:
        - $ref: "#/components/parameters/NpmOwner"
        - $ref: "#/components/parameters/NpmScope"
        - $ref: "#/components/parameters/NpmName"
        - $ref: "#/components/parameters/NpmAccept"
      responses:
        "200": { $ref: "#/components/responses/NpmPackument" }
        "304": { $ref: "#/components/responses/NpmNotModified" }
        "401": { $ref: "#/components/responses/NpmBasicChallenge" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
    head:
      operationId: npmPackumentUnescapedHead
      tags: [registry]
      summary: npm packument, unescaped name, headers only (registry host only)
      description: F-04. As `GET /npm/{owner}/{scope}/{name}`, with no body.
      parameters:
        - $ref: "#/components/parameters/NpmOwner"
        - $ref: "#/components/parameters/NpmScope"
        - $ref: "#/components/parameters/NpmName"
        - $ref: "#/components/parameters/NpmAccept"
      responses:
        "200": { description: The packument's headers. }
        "401": { description: npm's Basic challenge (a non-public feed). }
        "404": { description: The not-found. }
  /npm/{owner}/{scope}/{name}/-/{tarball}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    get:
      operationId: npmTarball
      tags: [registry]
      summary: npm tarball (registry host only)
      description: >
        F-04. A version's tarball, at the URL its packument's `dist.tarball` names
        (`name-<version>.tgz`, the conventional path Yarn Berry rebuilds). The content-addressed
        blob, `application/octet-stream` as an attachment, immutable for a year with the
        SHA-256 as ETag; clients verify it against `dist.integrity`. A yanked version's tarball
        is still served (npm has no yank). Also answered under the escaped spelling,
        `/npm/{owner}/{escapedName}/-/{tarball}`.
      parameters:
        - $ref: "#/components/parameters/NpmOwner"
        - $ref: "#/components/parameters/NpmScope"
        - $ref: "#/components/parameters/NpmName"
        - $ref: "#/components/parameters/NpmTarballFile"
      responses:
        "200": { $ref: "#/components/responses/NpmTarball" }
        "304": { $ref: "#/components/responses/NpmNotModified" }
        "401": { $ref: "#/components/responses/NpmBasicChallenge" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
    head:
      operationId: npmTarballHead
      tags: [registry]
      summary: npm tarball, headers only (registry host only)
      description: F-04. As `GET /npm/{owner}/{scope}/{name}/-/{tarball}`, with no body and its `Content-Length`.
      parameters:
        - $ref: "#/components/parameters/NpmOwner"
        - $ref: "#/components/parameters/NpmScope"
        - $ref: "#/components/parameters/NpmName"
        - $ref: "#/components/parameters/NpmTarballFile"
      responses:
        "200": { description: The tarball's headers. }
        "401": { description: npm's Basic challenge (a non-public feed). }
        "404": { description: The not-found. }
  /npm/{owner}/{escapedName}/-/{tarball}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    get:
      operationId: npmTarballEscaped
      tags: [registry]
      summary: npm tarball, escaped name (registry host only)
      description: >
        F-04. The same tarball as `/npm/{owner}/{scope}/{name}/-/{tarball}`, under the escaped
        spelling of the scoped name (`@scope%2fname`).
      parameters:
        - $ref: "#/components/parameters/NpmOwner"
        - {
            name: escapedName,
            in: path,
            required: true,
            schema: { type: string },
          }
        - $ref: "#/components/parameters/NpmTarballFile"
      responses:
        "200": { $ref: "#/components/responses/NpmTarball" }
        "304": { $ref: "#/components/responses/NpmNotModified" }
        "401": { $ref: "#/components/responses/NpmBasicChallenge" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
    head:
      operationId: npmTarballEscapedHead
      tags: [registry]
      summary: npm tarball, escaped name, headers only (registry host only)
      description: F-04. As `GET /npm/{owner}/{escapedName}/-/{tarball}`, with no body.
      parameters:
        - $ref: "#/components/parameters/NpmOwner"
        - {
            name: escapedName,
            in: path,
            required: true,
            schema: { type: string },
          }
        - $ref: "#/components/parameters/NpmTarballFile"
      responses:
        "200": { description: The tarball's headers. }
        "401": { description: npm's Basic challenge (a non-public feed). }
        "404": { description: The not-found. }
  # ── Swift package registry (F-06) ─────────────────────────────────────────────────────────
  #
  # SwiftPM's registry protocol (SE-0292, https://github.com/swiftlang/swift-package-manager/blob/main/Documentation/PackageRegistry/Registry.md)
  # under `/swift/<owner>/`, the URL `swift package-registry set --scope <scope>` takes. Every
  # answer carries `Content-Version: 1`; errors are `application/problem+json`; `Accept` naming
  # an invalid registry version or media type is 400, an unsupported one 415. The not-found is
  # the same for an unknown owner, package or version and a feed that is off.
  /swift/{owner}/{scope}/{name}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - {
          name: owner,
          in: path,
          required: true,
          schema: { type: string },
          description: The owner (product slug).,
        }
      - {
          name: scope,
          in: path,
          required: true,
          schema: { type: string },
          description: The package scope (case-insensitive).,
        }
      - {
          name: name,
          in: path,
          required: true,
          schema: { type: string },
          description: "The package name (case-insensitive); a `.json` suffix is accepted.",
        }
    get:
      operationId: swiftListReleases
      tags: [registry]
      summary: List a Swift package's releases (registry host only)
      description: >
        F-06, Registry.md §4.1. Every version in precedence order; a yanked one carries a
        `problem` (410 Gone), so SwiftPM never resolves it. No `url` is listed: a client expands
        `/{scope}/{name}/{version}` on this host. `Link: <…>; rel="latest-version"` names the
        `latest` tag (the stable channel's head) when it is available, else the highest stable
        version. Index caching: `public, max-age=60, stale-while-revalidate=60` and a strong
        ETag.
      responses:
        "200":
          description: The release list.
          headers:
            Content-Version: { schema: { type: string, const: "1" } }
            Link: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        problem: { type: object }
        "400":
          { description: "Invalid API version in `Accept` (problem+json)." }
        "401":
          {
            description: "A non-public feed, and no valid registry token (F-21): `WWW-Authenticate: Basic` (problem+json); a valid licence-bound token the mode does not admit is 403.",
          }
        "404": { description: "Not found (problem+json)." }
        "415":
          {
            description: "Unsupported API version or media type in `Accept` (problem+json).",
          }
    head:
      operationId: swiftListReleasesHead
      tags: [registry]
      summary: List a Swift package's releases, headers only (registry host only)
      description: F-06. As the GET, with no body.
      responses:
        "200": { description: The release list's headers. }
  /swift/{owner}/{scope}/{name}/{version}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: scope, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
      - {
          name: version,
          in: path,
          required: true,
          schema: { type: string },
          description: "The semver version; a `.json` suffix is accepted.",
        }
    get:
      operationId: swiftReleaseInfo
      tags: [registry]
      summary: A Swift package release's metadata (registry host only)
      description: >
        F-06, Registry.md §4.2. `id`, `version`, the `source-archive` resource with its SHA-256
        `checksum` and, for a signed release, `signing {signatureBase64Encoded,
        signatureFormat: cms-1.0.0}`, `metadata` and `publishedAt`. `Link` carries
        `latest-version`, `predecessor-version` and `successor-version`. A yanked version's
        metadata stays served (an archive never changes after publish). Index caching.
      responses:
        "200":
          description: The release metadata.
          headers:
            Content-Version: { schema: { type: string, const: "1" } }
            Link: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [id, version, resources, metadata]
                properties:
                  id: { type: string }
                  version: { type: string }
                  resources: { type: array, items: { type: object } }
                  metadata: { type: object }
                  publishedAt: { type: string, format: date-time }
        "404": { description: "Not found (problem+json)." }
    head:
      operationId: swiftReleaseInfoHead
      tags: [registry]
      summary: A Swift package release's metadata, headers only (registry host only)
      description: F-06. As the GET, with no body.
      responses:
        "200": { description: The release metadata's headers. }
  /swift/{owner}/{scope}/{name}/{version}/Package.swift:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: scope, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string } }
      - {
          name: swift-version,
          in: query,
          required: false,
          schema: { type: string },
          description: "Selects `Package@swift-<v>.swift`.",
        }
    get:
      operationId: swiftManifest
      tags: [registry]
      summary: A Swift package release's manifest (registry host only)
      description: >
        F-06, Registry.md §4.3. The SIGNED manifest copy the publisher uploaded (never one taken
        from the archive), `text/x-swift` as an attachment, immutable. The unqualified manifest
        lists every `Package@swift-*.swift` as `Link: <…?swift-version=X>; rel="alternate";
        filename=…; swift-tools-version=…`. A `swift-version` with no such manifest is 303 to
        the unqualified one.
      responses:
        "200":
          description: The manifest.
          content:
            text/x-swift:
              schema: { type: string }
        "303":
          {
            description: No manifest for that swift-version; `Location` is the unqualified manifest.,
          }
        "404": { description: "Not found (problem+json)." }
    head:
      operationId: swiftManifestHead
      tags: [registry]
      summary: A Swift package release's manifest, headers only (registry host only)
      description: F-06. As the GET, with no body.
      responses:
        "200": { description: The manifest's headers. }
  /swift/{owner}/{scope}/{name}/{version}.zip:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: scope, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string } }
    get:
      operationId: swiftSourceArchive
      tags: [registry]
      summary: A Swift package release's source archive (registry host only)
      description: >
        F-06, Registry.md §4.4. The zip by its SHA-256 (ETag, `Repr-Digest`), `application/zip`
        as `attachment; filename="<Name>-<version>.zip"`, immutable for a year, with `Range`
        support. A signed release adds `X-Swift-Package-Signature-Format: cms-1.0.0` and
        `X-Swift-Package-Signature` (base64 CMS).
      responses:
        "200":
          description: The source archive.
          headers:
            X-Swift-Package-Signature-Format: { schema: { type: string } }
            X-Swift-Package-Signature: { schema: { type: string } }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "206": { description: A byte range of the archive. }
        "404": { description: "Not found (problem+json)." }
    head:
      operationId: swiftSourceArchiveHead
      tags: [registry]
      summary: A Swift package release's source archive, headers only (registry host only)
      description: F-06. As the GET, with no body.
      responses:
        "200": { description: The archive's headers. }
  /swift/{owner}/identifiers:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - {
          name: url,
          in: query,
          required: true,
          schema: { type: string },
          description: A source repository URL.,
        }
    get:
      operationId: swiftIdentifiers
      tags: [registry]
      summary: Swift package identifiers for a repository URL (registry host only)
      description: >
        F-06, Registry.md §4.5. The packages the feed's `repositoryUrls` setting maps the URL to
        (compared without scheme, user, `.git` or case), limited to packages the feed holds and
        the reader may read. None is 404; a missing `url` is 400.
      responses:
        "200":
          description: The identifiers.
          content:
            application/json:
              schema:
                type: object
                required: [identifiers]
                properties:
                  identifiers: { type: array, items: { type: string } }
        "400": { description: "Missing `url` (problem+json)." }
        "404": { description: "Not found (problem+json)." }
    head:
      operationId: swiftIdentifiersHead
      tags: [registry]
      summary: Swift package identifiers for a repository URL, headers only (registry host only)
      description: F-06. As the GET, with no body.
      responses:
        "200": { description: The identifiers' headers. }
  /swift/{owner}/login:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
    post:
      operationId: swiftLogin
      tags: [registry]
      summary: SwiftPM registry login (registry host only)
      description: >
        F-21 (plans/F-20.md §6.3). `swift package-registry login https://pkg.plrs.im/swift/<owner>
        --token <t>` posts here with `Authorization: Bearer <t>` (or Basic), and SwiftPM stores the
        credential only on a 200. 200 (empty body, `Content-Version: 1`) when the token is a live
        registry token (`pkeyr_`) or CI token (`pkeyci_`) of this owner, valid for Swift, whose
        licence (if licence-bound) is usable; 401 with `WWW-Authenticate: Basic` (problem+json)
        otherwise; the host's not-found when the owner's Swift feed does not answer. Counted in the
        `registryLogin` budget (per IP, fail closed). Publishing (`PUT`, Registry.md §4.6) is 405
        until F-22.
      responses:
        "200":
          {
            description: "The token is valid for this owner's Swift feed (empty body).",
          }
        "401":
          {
            description: "No valid registry token (problem+json, `WWW-Authenticate: Basic`).",
          }
        "404":
          {
            description: "The owner's Swift feed does not answer (problem+json).",
          }
        "429":
          { description: "The login budget (problem+json, `Retry-After`)." }
  # ── Maven (F-07) ──
  /maven/{owner}/{groupPath}/{artifactId}/maven-metadata.xml:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    get:
      operationId: mavenMetadata
      tags: [registry]
      summary: Maven artifact metadata, maven-metadata.xml (registry host only)
      description: >
        F-07. The artifact-level `maven-metadata.xml` of the Maven repository layout
        (https://maven.apache.org/repository/layout.html,
        https://maven.apache.org/ref/current/maven-repository-metadata/repository-metadata.html),
        rendered from Release's package state, never uploaded. `versions` lists every version
        that is not yanked, oldest publication first; `release` is the `stable` channel's head
        (Maven's `RELEASE`), omitted when it serves nothing; `latest` the newest listed version of
        any channel (`LATEST`); `lastUpdated` the newest listed version's publication time. A
        yanked version leaves the index but its files stay downloadable by exact coordinates; a
        deprecated one stays listed (Maven has neither state). Sent as
        `application/octet-stream` with `Content-Disposition: attachment`, never as XML.
        `Cache-Control: public, max-age=60, stale-while-revalidate=60` with a strong ETag of the
        body's SHA-256 (`If-None-Match` answers 304); a feed that is not public answers 401 with
        `WWW-Authenticate: Basic` and `private, no-store`. An unknown owner, artifact or a feed
        that is off answers the plain not-found.
      parameters:
        - $ref: "#/components/parameters/MavenOwner"
        - $ref: "#/components/parameters/MavenGroupPath"
        - $ref: "#/components/parameters/MavenArtifactId"
      responses:
        "200":
          description: The metadata document.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304": { description: Not modified (the ETag matched). }
        "401":
          {
            description: The feed is not public,
            and no valid registry token was presented (F-21).,
          }
        "404": { description: No such owner, feed or artifact. }
    head:
      operationId: mavenMetadataHead
      tags: [registry]
      summary: Maven artifact metadata, headers only (registry host only)
      description: F-07. As the GET, with no body.
      parameters:
        - $ref: "#/components/parameters/MavenOwner"
        - $ref: "#/components/parameters/MavenGroupPath"
        - $ref: "#/components/parameters/MavenArtifactId"
      responses:
        "200": { description: The metadata document's headers. }
        "404": { description: No such owner, feed or artifact. }
  /maven/{owner}/{groupPath}/{artifactId}/maven-metadata.xml.{checksum}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    get:
      operationId: mavenMetadataChecksum
      tags: [registry]
      summary: A checksum sidecar of maven-metadata.xml (registry host only)
      description: >
        F-07. The lowercase hex digest of the artifact's current `maven-metadata.xml`, rendered
        with it (https://maven.apache.org/repository/layout.html). `md5`, `sha1`, `sha256` and
        `sha512`; anything else is the not-found. Same caching as the metadata.
      parameters:
        - $ref: "#/components/parameters/MavenOwner"
        - $ref: "#/components/parameters/MavenGroupPath"
        - $ref: "#/components/parameters/MavenArtifactId"
        - $ref: "#/components/parameters/MavenChecksum"
      responses:
        "200":
          description: The hex digest.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: The feed is not public. }
        "404": { description: No such owner, feed, artifact or algorithm. }
    head:
      operationId: mavenMetadataChecksumHead
      tags: [registry]
      summary: A checksum sidecar of maven-metadata.xml, headers only (registry host only)
      description: F-07. As the GET, with no body.
      parameters:
        - $ref: "#/components/parameters/MavenOwner"
        - $ref: "#/components/parameters/MavenGroupPath"
        - $ref: "#/components/parameters/MavenArtifactId"
        - $ref: "#/components/parameters/MavenChecksum"
      responses:
        "200": { description: The sidecar's headers. }
        "404": { description: No such owner, feed, artifact or algorithm. }
  /maven/{owner}/{groupPath}/{artifactId}/{version}/{file}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    get:
      operationId: mavenFile
      tags: [registry]
      summary: A file of a Maven publication, or its checksum sidecar (registry host only)
      description: >
        F-07. One file of a published version, at the path the Maven repository layout fixes
        (`<artifactId>-<version>[-<classifier>].<extension>`,
        https://maven.apache.org/repository/layout.html): the POM, the Gradle module metadata
        (`.module`, https://github.com/gradle/gradle/blob/master/platforms/documentation/docs/src/docs/design/gradle-module-metadata-latest-specification.md),
        the jar or AAR and any classified file the publication carried. The bytes come from the
        blob store by SHA-256: `ETag: "<sha256>"`, `Range` (206), and
        `Cache-Control: public, max-age=31536000, immutable, no-transform` (a version is never
        republished). `<file>.md5`, `.sha1`, `.sha256` and `.sha512` answer the file's digest as
        lowercase hex, from the digests Release computed at ingest (immutable, ETag of the
        body's SHA-256). Every answer is `application/octet-stream` with
        `Content-Disposition: attachment`: a POM or `.module` is never served as XML or JSON.
        A yanked version's files stay downloadable. Signatures (`.asc`), version-level metadata
        and directory listings are not served.
      parameters:
        - $ref: "#/components/parameters/MavenOwner"
        - $ref: "#/components/parameters/MavenGroupPath"
        - $ref: "#/components/parameters/MavenArtifactId"
        - { name: version, in: path, required: true, schema: { type: string } }
        - name: file
          in: path
          required: true
          description: The file name, optionally followed by `.md5`, `.sha1`, `.sha256` or `.sha512`.
          schema: { type: string }
      responses:
        "200":
          description: The file's bytes, or its hex digest.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: The requested range of the file. }
        "304": { description: Not modified (the ETag matched). }
        "401": { description: The feed is not public. }
        "404":
          {
            description: No such owner,
            feed,
            artifact,
            version,
            file or digest.,
          }
        "416": { description: The range cannot be satisfied. }
    head:
      operationId: mavenFileHead
      tags: [registry]
      summary: A file of a Maven publication, headers only (registry host only)
      description: F-07. As the GET, with no body (`Content-Length` is the file's size).
      parameters:
        - $ref: "#/components/parameters/MavenOwner"
        - $ref: "#/components/parameters/MavenGroupPath"
        - $ref: "#/components/parameters/MavenArtifactId"
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The file's headers. }
        "404":
          {
            description: No such owner,
            feed,
            artifact,
            version,
            file or digest.,
          }
  # F-08: OCI pull (the read side of the OCI Distribution Specification). `{repository}` is a
  # path of one or more `/`-separated components under the owner, so these templates stand for
  # every depth (`/v2/acme/tools/app/manifests/latest`).
  /v2/token:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    get:
      operationId: ociToken
      tags: [registry]
      summary: OCI token service (registry host only)
      description: >
        F-21 (plans/F-20.md §6.4; https://distribution.github.io/distribution/spec/auth/token/).
        The realm a non-public OCI feed's Bearer challenge names, and the one owner-less route on
        the registry host: `scope=repository:<owner>/<repository>:pull` (repeatable, at most four)
        names the owners. Grants pull per scope when the access ladder admits the caller: with no
        credential only public repositories (an anonymous token), with Basic
        `__token__:<pkeyr_ or pkeyci_>` per the access mode. A scope is all or nothing. `push`,
        `delete` and `registry:catalog:*` are refused. With no scope (`docker login`), a valid
        credential gets a token granting nothing, and an invalid one 401. The pull token is
        opaque, lives 300 s and carries identity only: every OCI request re-runs the ladder.
        `cache-control: no-store`. Counted in the `registryOciToken` budget (per IP, fail closed).
      parameters:
        - {
            name: service,
            in: query,
            required: false,
            schema: { type: string },
            description: "The registry host name; any other value is 401.",
          }
        - {
            name: scope,
            in: query,
            required: false,
            schema: { type: string },
            description: "`repository:<owner>/<repository>:pull`, repeatable.",
          }
      responses:
        "200":
          description: A pull token.
          content:
            application/json:
              schema:
                type: object
                required: [token, access_token, expires_in, issued_at]
                properties:
                  token: { type: string }
                  access_token: { type: string }
                  expires_in: { type: integer, const: 300 }
                  issued_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/OciError" }
        "403": { $ref: "#/components/responses/OciError" }
        "429": { $ref: "#/components/responses/OciError" }
        "503": { $ref: "#/components/responses/OciError" }
    head:
      operationId: ociTokenHead
      tags: [registry]
      summary: OCI token service, headers only (registry host only)
      description: F-21. As `GET /v2/token`, with no body.
      responses:
        "200": { description: Headers only. }
        "401": { description: No valid credential. }
  /v2/{owner}/{repository}/manifests/{reference}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - { $ref: "#/components/parameters/OciOwner" }
      - { $ref: "#/components/parameters/OciRepository" }
      - name: reference
        in: path
        required: true
        description: A tag (a version, `latest`, or a channel name) or a `sha256:` digest.
        schema:
          {
            type: string,
            pattern: "^([A-Za-z0-9_][A-Za-z0-9._-]{0,127}|sha256:[0-9a-f]{64})$",
          }
    get:
      operationId: ociManifest
      tags: [registry]
      summary: OCI manifest or image index by tag or digest (registry host only)
      description: >
        F-08. Pulling manifests
        (https://github.com/opencontainers/distribution-spec/blob/main/spec.md#pulling-manifests).
        The body is the stored manifest or image index, byte for byte, with its own media type
        (`application/vnd.oci.image.manifest.v1+json`, `…index.v1+json`, or Docker's schema 2
        manifest and manifest list) and `Docker-Content-Digest`. Version tags never move; `latest`
        (the stable channel) and other channel tags do; a yanked version has no tag but still
        pulls by digest; a deprecated version is served as live. By digest the answer is
        immutable (`public, max-age=31536000, immutable`); by tag it is an index document
        (`public, max-age=60, stale-while-revalidate=60`). An `Accept` that lists only other
        manifest types answers `MANIFEST_UNKNOWN`. A non-public feed answers 401 with the Bearer
        challenge (no credentials until F-21).
      responses:
        "200":
          description: The manifest.
          headers:
            Docker-Content-Digest: { schema: { type: string } }
            Docker-Distribution-API-Version:
              schema: { type: string, const: registry/2.0 }
          content:
            application/vnd.oci.image.manifest.v1+json:
              schema: { type: object }
            application/vnd.oci.image.index.v1+json:
              schema: { type: object }
            application/vnd.docker.distribution.manifest.v2+json:
              schema: { type: object }
            application/vnd.docker.distribution.manifest.list.v2+json:
              schema: { type: object }
        "304":
          description: "`If-None-Match` named the manifest's digest."
        "401": { $ref: "#/components/responses/OciError" }
        "404": { $ref: "#/components/responses/OciError" }
    head:
      operationId: ociManifestHead
      tags: [registry]
      summary: OCI manifest existence check (registry host only)
      description: >
        F-08. As `GET`, with no body: `Content-Type`, `Content-Length` and
        `Docker-Content-Digest` only.
      responses:
        "200":
          description: The manifest exists.
          headers:
            Docker-Content-Digest: { schema: { type: string } }
        "401":
          description: The feed is not public.
        "404":
          description: Unknown manifest, repository or owner.
  /v2/{owner}/{repository}/blobs/{digest}:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - { $ref: "#/components/parameters/OciOwner" }
      - { $ref: "#/components/parameters/OciRepository" }
      - name: digest
        in: path
        required: true
        description: The blob's `sha256:` digest, one of the repository's published files.
        schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    get:
      operationId: ociBlob
      tags: [registry]
      summary: OCI blob by digest, with Range (registry host only)
      description: >
        F-08. Pulling blobs
        (https://github.com/opencontainers/distribution-spec/blob/main/spec.md#pulling-blobs).
        `application/octet-stream` as an attachment, `Docker-Content-Digest`, a strong ETag of
        the SHA-256 and `public, max-age=31536000, immutable, no-transform`. A single `Range`
        answers 206 with `Content-Range`; one that selects nothing answers 416. `If-Range` and
        `If-None-Match` are honoured. Only a digest the repository published is served
        (`BLOB_UNKNOWN` otherwise). Blobs are up to 5 GiB and bypass the Cache API.
      responses:
        "200":
          description: The blob.
          headers:
            Docker-Content-Digest: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The requested range.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: "`If-None-Match` named the blob's digest."
        "401": { $ref: "#/components/responses/OciError" }
        "404": { $ref: "#/components/responses/OciError" }
        "416":
          description: "The range selects nothing (`Content-Range: bytes */<size>`)."
    head:
      operationId: ociBlobHead
      tags: [registry]
      summary: OCI blob existence and size (registry host only)
      description: F-08. As `GET`, with no body; `Content-Length` is the blob's size.
      responses:
        "200":
          description: The blob exists.
        "401":
          description: The feed is not public.
        "404":
          description: Unknown blob, repository or owner.
  /v2/{owner}/{repository}/tags/list:
    servers:
      - url: https://pkg.plrs.im
        description: The registry host (pkg-staging and pkg-dev in the other environments).
    parameters:
      - { $ref: "#/components/parameters/OciOwner" }
      - { $ref: "#/components/parameters/OciRepository" }
      - name: "n"
        in: query
        required: false
        description: At most this many tags (capped at 1000).
        schema: { type: integer, minimum: 0 }
      - name: last
        in: query
        required: false
        description: Only tags lexically after this one.
        schema: { type: string }
    get:
      operationId: ociTags
      tags: [registry]
      summary: OCI tag list, paginated (registry host only)
      description: >
        F-08. Listing tags
        (https://github.com/opencontainers/distribution-spec/blob/main/spec.md#listing-tags):
        `{"name": "<owner>/<repository>", "tags": [...]}` in lexical order, rendered from the
        package's state (every version that is not yanked, `latest` and each channel tag). With
        `n`, a `Link: <…?n=&last=>; rel="next"` header names the next page. An index document
        (`public, max-age=60, stale-while-revalidate=60`).
      responses:
        "200":
          description: The tags.
          headers:
            Link:
              description: The next page, when there is one.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [name, tags]
                properties:
                  name: { type: string }
                  tags: { type: array, items: { type: string } }
              examples:
                tags:
                  value:
                    {
                      name: acme/tools/app,
                      tags: ["1.0.0", "1.1.0-beta.1", beta, latest],
                    }
        "401": { $ref: "#/components/responses/OciError" }
        "404": { $ref: "#/components/responses/OciError" }
    head:
      operationId: ociTagsHead
      tags: [registry]
      summary: OCI tag list, headers only (registry host only)
      description: F-08. As `GET`, with no body.
      responses:
        "200":
          description: The repository exists.
        "404":
          description: Unknown repository or owner.
