  /{product}/identity/auth/device:
    parameters:
      - { $ref: "#/components/parameters/Product" }
    get:
      operationId: deviceAuthEntryPage
      tags: [identity]
      summary: The RFC 8628 user-code page (entry form, or confirmation for `?user_code=`)
      description: >
        The `verificationUri` a device-code client shows. Without `user_code` it renders the
        entry form: one text field that POSTs back to this URL. With `user_code` (the
        `verificationUriComplete` a QR code carries) it looks the code up server-side and
        renders the confirmation page — product, device label (`deviceName` if given, else
        "Unnamed device"; never the device id) and user code — with a fresh single-use hidden
        `csrf` field; that form posts
        `user_code` and `csrf` back here, never the device code. Input is case-insensitive and
        spaces and hyphens are ignored; anything outside `BCDFGHJKLMNPQRSTVWXZ` or not eight
        characters long is invalid. An unknown, expired, malformed or already-confirmed code
        re-renders the entry form with one generic message and status 404. Every page is
        script-free, under the
        static-HTML CSP, `cache-control: no-store` and `referrer-policy: no-referrer`; the
        confirmation page's `form-action` additionally allows the IdP origin its POST
        redirects to. Nothing about the flow is confirmed by this GET.
      parameters:
        - name: user_code
          in: query
          required: false
          description: The user code, as typed or as `verificationUriComplete` carries it.
          schema: { type: string }
          example: WDJB-MJHT
      responses:
        "200":
          description: "The entry form, or the confirmation page. `text/html; charset=utf-8`, `cache-control: no-store`."
          content:
            text/html:
              schema: { type: string }
              examples:
                entry:
                  summary: No `user_code` (test/oidcEdge.test.ts)
                  value: |
                    <form method="post" action="https://key.plrs.im/djdl/identity/auth/device">
                      <input id="user_code" name="user_code" type="text" required placeholder="XXXX-XXXX">
                      <button type="submit">Continue</button>
                    </form>
                confirmation:
                  summary: "`?user_code=wdjb mjht` (test/oidcEdge.test.ts reads `csrf` out of it)"
                  value: |
                    <dl><dt>Code<dd>WDJB-MJHT<dt>Device<dd>Steam Deck<dt>Product<dd>djdl</dl>
                    <form method="post" action="https://key.plrs.im/djdl/identity/auth/device">
                      <input type="hidden" name="user_code" value="WDJB-MJHT">
                      <input type="hidden" name="csrf" value="7hK2mQ0xZk8LqR8nT0sYp2">
                      <button type="submit">Continue to sign in</button>
                    </form>
        "404":
          description: >
            Unknown, expired, malformed or already-confirmed code: the entry form again with one
            generic line ("That code is not valid or has expired."), whatever the reason.
            `text/html`.
          content:
            text/html:
              schema: { type: string }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429":
          description: >
            30 requests per 60 s per client network — the IPv4 address, or the IPv6 /64
            (fail-closed) — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                limited:
                  { value: { error: rate_limited, message: too many requests } }
    post:
      operationId: deviceAuthEntry
      tags: [identity]
      summary: Look a typed code up, or confirm it (CSRF from the confirmation page)
      description: >
        Two forms post here. The entry form sends `user_code` alone: the code is looked up and
        the confirmation page rendered, exactly as the GET with `?user_code=` does. The
        confirmation form sends `user_code` and `csrf`: when the `csrf` field is present at
        all, this is a confirmation — the single-use token must match the one the page minted,
        and on success the flow is stamped confirmed, the user code stops resolving, and the
        browser is sent to the IdP with a 303, `cache-control: no-store` and
        `referrer-policy: no-referrer`, as `deviceAuthVerify` does. Both forms are refused when
        cross-site: `Sec-Fetch-Site` decides when present (only `same-origin` passes);
        otherwise an `Origin` naming another origin is refused, while an absent `Origin` or
        `Origin: null` — what a browser sends from this no-referrer page — passes to the
        `csrf` check. A cross-site request, and an empty, wrong, reused or orphaned `csrf`,
        share ONE 403 message. The body is
        `application/x-www-form-urlencoded` (the pages' own forms) or JSON when the
        `content-type` says so.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/DeviceAuthEntryRequest" }
            examples:
              lookup:
                summary: The entry form
                value: { user_code: wdjb-mjht }
              confirm:
                summary: The confirmation form (test/oidcEdge.test.ts)
                value: { user_code: WDJB-MJHT, csrf: 7hK2mQ0xZk8LqR8nT0sYp2 }
          application/json:
            schema: { $ref: "#/components/schemas/DeviceAuthEntryRequest" }
            examples:
              confirm:
                value: { user_code: WDJB-MJHT, csrf: 7hK2mQ0xZk8LqR8nT0sYp2 }
      responses:
        "200":
          description: "No `csrf` field: the confirmation page, as for the GET. `text/html; charset=utf-8`."
          content:
            text/html:
              schema: { type: string }
        "303":
          description: >
            Confirmed. Empty body; the browser is sent to the IdP. `cache-control: no-store`,
            `referrer-policy: no-referrer`.
          headers:
            Location:
              description: The IdP authorize URL stored when the device flow started.
              schema: { type: string, format: uri }
              example: https://id.example/authorize
        "403":
          description: >
            A cross-site request, or a `csrf` that is empty, wrong, already used, or for a code
            that no longer exists — LEGACY FLAT. One message for all of them, deliberately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                confirmationFailed:
                  { value: { error: forbidden, message: confirmation failed } }
        "404":
          description: >
            No `csrf` field and an unknown, expired or malformed code: the generic entry page,
            as for the GET. `text/html`. (A confirmation whose OIDC flow record lapsed between
            render and submit answers the LEGACY FLAT `not_found` instead.)
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                expired:
                  { value: { error: not_found, message: device code expired } }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429":
          description: >
            30 requests per 60 s per client network — the IPv4 address, or the IPv6 /64
            (fail-closed) — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                limited:
                  { value: { error: rate_limited, message: too many requests } }
  /{product}/identity/auth/device/verify:
    parameters:
      - { $ref: "#/components/parameters/Product" }
      - name: device_code
        in: query
        required: true
        description: >
          The `deviceCode` from `deviceAuthStart`. Snake_case HERE, like `user_code` on
          `/identity/auth/device`, because it is a URL a browser opens. `deviceAuthStart` no
          longer hands this URL out (its `verificationUri` is the user-code page); the route stays
          for flows started before that change and for any client that builds it itself.
        schema: { type: string }
    get:
      operationId: deviceAuthVerifyPage
      tags: [identity]
      summary: The device-authorization page (side-effect-free GET)
      description: >
        Renders the user code, the device label (`deviceName` if given, else the device id)
        and the product slug, plus a POST form carrying a single-use hidden field named
        `csrf`. Nothing is confirmed by this GET — that is the point of splitting the two
        methods. Served under the strict script-free static-HTML CSP with `no-store` and
        `referrer-policy: no-referrer`, so the device code never leaks in a Referer.
      responses:
        "200":
          description: "HTML confirmation page. `text/html; charset=utf-8`, `cache-control: no-store`."
          content:
            text/html:
              schema: { type: string }
              examples:
                page:
                  summary: The form the POST needs (test/oidcEdge.test.ts reads `csrf` out of it)
                  value: |
                    <dl><dt>Code<dd>ZK8L-QR8N<dt>Device<dd>Studio Mac<dt>Product<dd>djdl</dl>
                    <form method="post" action="https://key.plrs.im/djdl/identity/auth/device/verify?device_code=Zk8LqR8nT0sYp2vcEgHj6A">
                      <input type="hidden" name="csrf" value="7hK2mQ0xZk8LqR8nT0sYp2">
                      <button type="submit">Continue to sign in</button>
                    </form>
        "400":
          description: No `device_code` — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                missingCode:
                  { value: { error: bad_request, message: missing code } }
        "404":
          description: Unknown or lapsed device code — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                expired:
                  { value: { error: not_found, message: device code expired } }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429":
          description: 60 requests per 60 s per client IP — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                limited:
                  { value: { error: rate_limited, message: too many requests } }
    post:
      operationId: deviceAuthVerify
      tags: [identity]
      summary: Confirm the device authorization (CSRF from the GET)
      description: >
        Consumes the single-use `csrf` token the GET embedded and hands the browser on to the
        IdP. Success is 303 with an empty body and a `Location` naming the authorize URL
        stored at device-start — not 200, and not 302, so the follow-up is a GET regardless of
        this POST. The token is deleted on use. The body may be
        `application/x-www-form-urlencoded` (the page's own form) or JSON when the
        `content-type` says so; either way the field is named `csrf`. A cross-site request
        (the same `Sec-Fetch-Site` / `Origin` rule as `deviceAuthEntry`, under which
        `Origin: null` passes) and a missing/wrong token share ONE 403 message.
      requestBody:
