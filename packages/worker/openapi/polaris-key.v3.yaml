  /{product}/distribution/report:
    post:
      operationId: ciDistributionReport
      tags: [distribution]
      summary: Report availability, a submission state or a signing key (CI)
      description: >
        P2b-03. Until the store connectors exist (P5-02 to P5-04), CI reports what a store says.
        `type: availability` records whether release R (build B, or the whole release when
        `buildId` is omitted) is available on outlet O: `pending`, `processing`, `in-review`,
        `approved`, `live`, `rejected` or `removed`. `type: submission` records where R stands
        in O's review lifecycle: `prepared`, `submitted`, `in-review`, `approved`, `rejected`,
        `pending-developer-release`, `released` or `cancelled`. Name the release by `releaseId`,
        or by `version` (with `deliverable`, default `app`). The outlet must be declared and not
        removed; the release and build must exist. A report may move a state backwards (a
        rejection after review): the row keeps the current state and every change is audited as
        `ci:<subject>`. Store-assigned ids go in `platformRef` (availability only); omit it to
        keep the stored one, `null` to clear it. A pack release's report on an outlet whose
        transport for the pack is `apple-ba`, with `platformRef.assetPackIdentifier` naming an
        asset pack of that pack (`<pack>-c<contentApi>`), is stored per asset pack (as if
        `buildId` were that identifier), so one release bound at two content levels keeps a
        state per level (P5-08). Self-hosted outlets need no report: their
        availability is derived from Release's truth. `type: key` reports the SHA-256 fingerprint
        (64 lower-case hex) CI signed with for a purpose (`android-app-signing`,
        `android-upload`, `android-sideload`, `fdroid-repo`, `sparkle-ed25519`, `release`,
        `msix-publisher`): it never changes the operator-owned key inventory; one that matches
        no entry is stored as an observation and flagged (`match: false`). A refused report
        writes nothing. `type: store-step` (A-18h) is the report-back of a CI-plane store step:
        `store` (`itch`, `snap`, `steam`, `msstore`, `epic`), the storefront `op`, the allow-listed
        `command` and its `argv` (the tool excluded), `outlet` when the command is bound to the
        outlet's identity, `runId` (the job attempt, the step's idempotency key), `state`
        (`pending` before the tool runs, then `done` or `failed`) and `exitCode`. The Worker
        re-checks the command against the store's allow-list and the outlet identity, then writes
        the step's `store_operations` row with `plane = ci`; a `pending` report of a step already
        done in the same run answers `replayed: true` (CI skips the tool). Requires a `pkeyci_`
        token with `distribution:report` (in the default CI grant). No CORS. Errors are LEGACY
        FLAT with a machine-readable `reason` (`unknown_outlet`, `unknown_release`,
        `unknown_build` 404; `invalid_state`, `unknown_purpose`, `invalid_fingerprint`,
        `invalid_body`, `command_not_allowed` 422; `too_many_observations` 409, past 64
        unreviewed key observations; `worker_draft_staged` 409, a store step the ledger's
        Worker-plane draft blocks; `step_conflict` 409, a different request under the same step;
        `bad_body` 400).
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  {
                    type: string,
                    enum: [availability, submission, key, store-step],
                  }
                releaseId: { type: string, description: "Not with `version`." }
                version: { type: string, description: "Not with `releaseId`." }
                deliverable:
                  {
                    type: string,
                    default: app,
                    description: "With `version` only.",
                  }
                outlet:
                  {
                    type: string,
                    description: "Required for availability and submission; optional for key.",
                  }
                buildId:
                  {
                    type: string,
                    description: "Availability only; omitted = the whole release.",
                  }
                state:
                  { type: string, description: "From the type's vocabulary." }
                since:
                  {
                    type: integer,
                    description: "Epoch seconds the state was entered; default now (or unchanged while the state is).",
                  }
                platformRef:
                  {
                    type: [object, "null"],
                    description: "Availability only: store-assigned ids.",
                  }
                detail: { type: [object, "null"] }
                purpose:
                  type: string
                  enum:
                    [
                      android-app-signing,
                      android-upload,
                      android-sideload,
                      fdroid-repo,
                      sparkle-ed25519,
                      release,
                      msix-publisher,
                    ]
                sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                store:
                  {
                    type: string,
                    enum: [itch, snap, steam, msstore, epic],
                    description: "store-step only.",
                  }
                op:
                  {
                    type: string,
                    description: "store-step only: the storefront operation (uploadBuild, release, writeListingText).",
                  }
                command:
                  {
                    type: string,
                    description: "store-step only: the allow-list's command id (push, upload, upload-metadata, run-app-build, publish, upload-binary).",
                  }
                argv:
                  {
                    type: array,
                    maxItems: 32,
                    items: { type: string, minLength: 1, maxLength: 1024 },
                    description: "store-step only: the tool's arguments, the tool excluded.",
                  }
                runId:
                  {
                    type: string,
                    pattern: "^[A-Za-z0-9-]{8,128}$",
                    description: "store-step only: the job attempt.",
                  }
                exitCode: { type: integer, description: "store-step only." }
                runUrl:
                  {
                    type: string,
                    description: "store-step only: the https URL of the CI run.",
                  }
            examples:
              storeStep:
                value:
                  {
                    type: store-step,
                    store: itch,
                    op: uploadBuild,
                    command: push,
                    argv:
                      [
                        push,
                        build/windows,
                        "vlad/dice:windows",
                        --userversion,
                        1.2.0,
                      ],
                    outlet: itch,
                    runId: gh-123456-1,
                    state: done,
                    exitCode: 0,
                  }
              availability:
                value:
                  {
                    type: availability,
                    releaseId: v1.1.0,
                    outlet: app-store,
                    buildId: ios,
                    state: in-review,
                    platformRef: { ascBuildId: abc-123 },
                  }
              submission:
                value:
                  {
                    type: submission,
                    version: 1.1.0,
                    outlet: app-store,
                    state: submitted,
                  }
              key:
                value:
                  {
                    type: key,
                    purpose: android-app-signing,
                    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
                    outlet: play,
                  }
      responses:
        "200":
          description: The record after the report (`availability`, `submission`), or the key verdict.
          content:
            application/json:
              schema:
                type: object
                required: [ok, type]
                properties:
                  ok: { type: boolean, const: true }
                  type:
                    {
                      type: string,
                      enum: [availability, submission, key, store-step],
                    }
                  step:
                    type: object
                    properties:
                      opId: { type: string }
                      store: { type: string }
                      op: { type: string }
                      command: { type: string }
                      state:
                        {
                          type: string,
                          enum: [pending, done, failed, ambiguous],
                        }
                      plane: { type: string, const: ci }
                      replayed: { type: boolean }
                  availability:
                    type: object
                    properties:
                      deliverableId: { type: string }
                      releaseId: { type: string }
                      buildId: { type: string }
                      outletId: { type: string }
                      transport: { type: string }
                      state: { type: string }
                      since: { type: integer }
                      platformRef: { type: [object, "null"] }
                      detail: { type: [object, "null"] }
                      source: { type: string }
                      derived: { type: boolean, const: false }
                      updatedAt: { type: integer }
                  submission:
                    type: object
                    properties:
                      deliverableId: { type: string }
                      releaseId: { type: string }
                      outletId: { type: string }
                      state: { type: string }
                      submittedAt: { type: [integer, "null"] }
                      reviewedAt: { type: [integer, "null"] }
                      detail: { type: [object, "null"] }
                      source: { type: string }
                      updatedAt: { type: integer }
                  key:
                    type: object
                    properties:
                      purpose: { type: string }
                      sha256: { type: string }
                      match: { type: boolean }
                      flagged: { type: boolean }
              examples:
                availability:
                  summary: test/distributionAvailability.test.ts
                  value:
                    ok: true
                    type: availability
                    availability:
                      deliverableId: app
                      releaseId: v1.1.0
                      buildId: cli-arm64
                      outletId: app-store
                      transport: pkey-cdn
                      state: in-review
                      since: 1700000000
                      platformRef: { ascBuildId: abc-123 }
                      detail: null
                      source: ci
                      derived: false
                      updatedAt: 1700000000
                keyMismatch:
                  summary: test/distributionAvailability.test.ts
                  value:
                    ok: true
                    type: key
                    key:
                      purpose: android-app-signing
                      sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                      match: false
                      flagged: true
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "409": { $ref: "#/components/responses/CiRefusal" }
        "422": { $ref: "#/components/responses/CiRefusal" }

  /{product}/distribution/listing/{store}:
    get:
      operationId: ciListingProjection
      tags: [distribution]
      summary: A CI-plane store's projection of the listing model (CI)
      description: >
        A-18h. The store's projection of the shared listing model (A-18b), for a CI-plane listing
        step: `pkey storefront snap metadata` writes the Snap projection's summary and
        description into `snapcraft.yaml` before the snap is built, and `snapcraft
        upload-metadata` sends them. Only a store whose adapter declares `writeListingText` on the
        CI plane is served (`snap`); any other store is the not-found. `payload` is null while a
        red issue blocks it (a missing summary, a value over the store's limit); `issues` says
        which, never with the text. A product with no listing answers `exists: false`. Requires
        a `pkeyci_` token with `distribution:report` (in the default CI grant). No CORS.
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: store
          in: path
          required: true
          schema: { type: string, enum: [snap] }
      responses:
        "200":
          description: The projection.
          content:
            application/json:
              schema:
                type: object
                required: [ok, listing]
                properties:
                  ok: { type: boolean, const: true }
                  listing:
                    type: object
                    required:
                      [store, exists, defaultLocale, status, payload, issues]
                    properties:
                      store: { type: string }
                      exists: { type: boolean }
                      defaultLocale: { type: string }
                      status: { type: string, enum: [green, amber, red] }
                      payload:
                        type: [object, "null"]
                        properties:
                          app: { type: object }
                          locales: { type: object }
                      issues: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /{product}/distribution/hooks/asc:
    post:
      operationId: ascWebhook
      tags: [distribution]
      summary: App Store Connect webhook notifications (Apple → Worker)
      description: >
        P5-02. Called by App Store Connect, never by a client: the connector registers it
        (`POST /v1/webhooks`, all 12 `WebhookEventType`s) from the console. The body is Apple's
        thin JSON:API envelope; `x-apple-signature: hmacsha256=<hex>` is HMAC-SHA256 over the raw
        body with the product's `asc-webhook-secret` outlet credential, compared in constant time.
        A missing header or another scheme is 401 before anything is opened; deliveries are
        rate-limited per product BEFORE the secret is opened (429 `rate_limited`). A `data.id`
        seen in the last 7 days answers 200 `{ok, duplicate: true}` and changes nothing. The
        webhook is a hint: the instance it names (an App Store version, build upload, build beta
        detail or Background Asset version/release) is re-read from the App Store Connect API
        and only what the API says is written — availability, submissions and the phased-release
        mirror (`source: asc`). Beta feedback, alternative-distribution events and Apple's ping
        are stored raw (200); an unknown event type answers 204 and is stored as `ignored`. The
        product must declare an `app-store` or `testflight` outlet with an `appleId` and hold
        an `asc-api-key` credential that the operator has PINNED to that same `appleId`, and an
        `asc-webhook-secret`; otherwise — like with Distribution off — the answer is the service
        not-found shape, so a manifest naming another app than the pinned one mirrors nothing.
        No CORS. Errors are LEGACY FLAT.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: x-apple-signature
          in: header
          required: true
          schema: { type: string, pattern: "^hmacsha256=[0-9a-fA-F]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [id, type]
                  properties:
                    id:
                      {
                        type: string,
                        description: "The delivery id; the dedupe key.",
                      }
                    type:
                      type: string
                      description: "The event type in Apple's camel-case spelling (`appStoreVersionAppVersionStateUpdated`)."
                    version: { type: integer }
                    attributes: { type: object }
                    relationships:
                      type: object
                      description: "`instance` names the object, as `{data: {type, id}}` or — Background Asset events — `{type, id, links}`."
            examples:
              appVersionState:
                summary: test/fixtures/asc/webhooks/APP_STORE_VERSION_APP_VERSION_STATE_UPDATED.json
                value:
                  data:
                    type: appStoreVersionAppVersionStateUpdated
                    id: 5f1c1e3a-0001-4b8e-9d2a-000000000001
                    version: 1
                    attributes:
                      newValue: READY_FOR_DISTRIBUTION
                      oldValue: PENDING_DEVELOPER_RELEASE
                      timestamp: "2026-09-30T17:00:00.000Z"
                    relationships:
                      instance:
                        data: { type: appStoreVersions, id: asv-110 }
      responses:
        "200":
          description: "Accepted (the follow-up read runs after the response), stored, or a duplicate."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
                  duplicate: { type: boolean, const: true }
        "204":
          {
            description: "An event type this build does not know; stored as `ignored`.",
          }
        "400":
          description: "Not a webhook payload (`reason: bad_body`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "401":
          description: Missing, malformed or wrong `x-apple-signature`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Body over 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "429":
          description: Too many deliveries for this product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }

  /{product}/distribution/hooks/sentry:
    post:
      operationId: sentryWebhook
      tags: [distribution]
      summary: Sentry alert webhook — opens a halt candidate (Sentry → Worker)
      description: >
        P6-03. Called by a Sentry internal integration, never by a client. `Sentry-Hook-Signature`
        is the hex HMAC-SHA256 of the raw body with the integration's client secret, stored as
        the product's `sentry-integration` outlet credential, and compared in constant time. A
        missing or malformed signature is 401 before anything is opened; deliveries are
        rate-limited per product BEFORE the secret is opened (429 `rate_limited`). A body seen
        before (by its SHA-256) answers 200 `{ok, duplicate: true}` and changes nothing. Only
        `Sentry-Hook-Resource: event_alert` with `action: triggered` is acted on: the event's
        `release` (`<deliverable>@<version>[+<build>]`), `environment` (the channel) and optional
        `pkey.outlet` tag are mapped through Release's catalog to the product's active or paused,
        non-mirrored rollouts of that release, and each gets one halt candidate. A candidate
        HALTS NOTHING: a platform admin confirms (halts) or dismisses it in the console. Any
        other resource or action answers 204 and is stored as `ignored`; an alert that maps to
        no rollout answers 200 with `candidates: 0`. Without an active `sentry-integration`
        credential — like with Distribution off — the answer is the service not-found shape. No
        CORS. Errors are LEGACY FLAT.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: Sentry-Hook-Signature
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
        - name: Sentry-Hook-Resource
          in: header
          required: true
          schema:
            type: string
            description: "`event_alert` is acted on; `installation`, `issue`, `metric_alert`, `error` and `comment` are stored as `ignored`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  {
                    type: string,
                    description: "`triggered` for an alert rule.",
                  }
                data:
                  type: object
                  properties:
                    triggered_rule: { type: string }
                    event:
                      type: object
                      properties:
                        release:
                          type: string
                          description: "`<deliverable>@<version>[+<build>]`, the SDK tagging convention."
                        environment:
                          type: string
                          description: The release channel.
                        issue_id: { type: string }
                        tags:
                          type: array
                          description: "`[key, value]` pairs; `pkey.outlet` names the outlet."
                          items: {}
            examples:
              eventAlert:
                summary: test/sentry.test.ts
                value:
                  action: triggered
                  data:
                    triggered_rule: Crash spike
                    event:
                      event_id: 9b1f0c3e5d2a4c8e9f7a6b5c4d3e2f10
                      issue_id: "4200001"
                      release: app@1.1.0
                      environment: stable
                      tags:
                        - [environment, stable]
                        - [pkey.outlet, direct]
      responses:
        "200":
          description: "Handled (`candidates` = halt candidates newly opened), or a duplicate."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
                  candidates: { type: integer, minimum: 0 }
                  duplicate: { type: boolean, const: true }
        "204":
          {
            description: "A resource or action other than a triggered event alert; stored as `ignored`.",
          }
        "400":
          description: "Not a JSON object (`reason: bad_body`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "401":
          description: Missing, malformed or wrong `Sentry-Hook-Signature`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Body over 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "429":
          description: Too many deliveries for this product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }

  /{product}/distribution/commerce/binding:
    get:
      operationId: commerceBinding
      tags: [distribution]
      summary: The licence's purchase binding and the store products on sale (device token)
      description: >
        P6-01. The opaque binding UUID of the caller's licence — created on first use, never the
        licence id, not PII — which the SDK hands the store BEFORE the purchase: Apple
        `appAccountToken`, Play `obfuscatedAccountId`, or the `identity` of a Steam web-API
        ticket. `products` lists the store products the operator mapped (store, product id, the
        licence flag it grants, the deliverable it unlocks) for every store the product is set
        up for, so a client knows what to sell; on an Apple outlet the SDK hides a flag that is
        not also an App Store product (App Store 3.1.3(b); the licence document stays
        outlet-agnostic). A device with no licence is 403 `not_entitled` with `reason:
        no_license` — enrol first; the bridge never creates a licence. With License off for the
        product the route is the service not-found. No CORS. Errors are NESTED.
      security: [{ deviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
      responses:
        "200":
          description: "The binding and the mapped store products (`Cache-Control: private, no-store`)."
          content:
            application/json:
              schema:
                type: object
                required: [bindingId, products]
                properties:
                  bindingId:
                    type: string
                    format: uuid
                    description: Lowercase RFC 4122 UUID; compared case-insensitively.
                  products:
                    type: array
                    items:
                      type: object
                      required: [store, productId, flag, deliverable]
                      properties:
                        store: { type: string, enum: [app-store, play, steam] }
                        productId:
                          type: string
                          description: The App Store product id, the Play product id, or the Steam DLC app id.
                        flag: { type: string }
                        deliverable: { type: string }
              examples:
                binding:
                  summary: test/commerce.test.ts
                  value:
                    bindingId: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
                    products:
                      - {
                          store: app-store,
                          productId: gg.acme.djdl.skins,
                          flag: extras.diceSkins,
                          deliverable: app,
                        }
                      - {
                          store: steam,
                          productId: "1234560",
                          flag: extras.diceSkins,
                          deliverable: app,
                        }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "The device has no licence (`not_entitled`, `reason: no_license`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /{product}/distribution/commerce/claim:
    post:
      operationId: commerceClaim
      tags: [distribution]
      summary: Claim a store purchase as a licence flag (device token)
      description: >
        P6-01. The device forwards what its store handed it; the Worker verifies it with the
        store and grants the mapped flag on the caller's licence, for every release of the
        deliverable, through License (`applyStoreGrant`). App Store: the StoreKit 2 JWS is
        verified (ES256, `x5c` chain of three ending byte-for-byte at Apple Root CA - G3, Apple's
        leaf and intermediate OIDs), then the transaction is re-read from the App Store Server
        API and Apple's copy decides (bundle id, environment — `Sandbox` only where the operator
        accepts it, `Xcode` never — non-consumable, owned as `PURCHASED`, `revocationDate`).
        Play: `purchases.products.get` decides — only `purchaseState` 0 grants, 2 (pending)
        records nothing granted, a licence-tester purchase only where the operator accepts test
        purchases — and a granted purchase is acknowledged once. Steam:
        `ISteamUserAuth/AuthenticateUserTicket` with the caller's binding as the ticket identity,
        then `ISteamUser/CheckAppOwnership` for the DLC (owned by the account itself, not a
        timed trial). In every case the store's record must name the CALLER's binding: a
        transaction bound to another licence is 403 `binding_mismatch`, one already recorded for
        another licence 403 `bound_elsewhere`, one with no binding 403 `unbound`. A replay
        answers 200 with `changed: false`. Rate-limited per licence. With License off, or the
        store not set up (no settings, or no credential pinned to the configured app), the route
        is the service not-found. No CORS. Errors are NESTED; `reason` rides beside `error`.
      security: [{ deviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [store, signedTransaction]
                  properties:
                    store: { const: app-store }
                    signedTransaction:
                      type: string
                      description: StoreKit 2 `Transaction.jwsRepresentation` (at most 32 KiB).
                - type: object
                  required: [store, productId, purchaseToken]
                  properties:
                    store: { const: play }
                    productId:
                      { type: string, pattern: "^[a-z0-9][a-z0-9._]{0,139}$" }
                    purchaseToken:
                      { type: string, pattern: "^[A-Za-z0-9._-]{1,1024}$" }
                - type: object
                  required: [store, ticket, dlcAppId]
                  properties:
                    store: { const: steam }
                    ticket:
                      type: string
                      pattern: "^[0-9A-Fa-f]{16,4096}$"
                      description: A web-API session ticket (hex) whose identity is the binding.
                    dlcAppId: { type: string, pattern: "^[1-9][0-9]{0,9}$" }
            examples:
              steam:
                summary: test/commerce.test.ts
                value:
                  {
                    store: steam,
                    ticket: 14000000ab14000000ab,
                    dlcAppId: "1234560",
                  }
      responses:
        "200":
          description: "Recorded. `granted` is true when the flag is now on the licence; `changed` false for a replay."
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    ok,
                    store,
                    productId,
                    flag,
                    deliverable,
                    state,
                    granted,
                    changed,
                  ]
                properties:
                  ok: { type: boolean, const: true }
                  store: { type: string, enum: [app-store, play, steam] }
                  productId: { type: string }
                  flag: { type: string }
                  deliverable: { type: string }
                  state: { type: string, enum: [active, pending, revoked] }
                  granted: { type: boolean }
                  changed: { type: boolean }
              examples:
                granted:
                  summary: test/commerce.test.ts
                  value:
                    {
                      ok: true,
                      store: app-store,
                      productId: gg.acme.djdl.skins,
                      flag: extras.diceSkins,
                      deliverable: app,
                      state: active,
                      granted: true,
                      changed: true,
                    }
        "400":
          description: >
            `bad_request` with a `reason`: `bad_body`; `invalid_jws`, `untrusted_chain`,
            `wrong_app`, `environment`, `unsupported_type`, `family_shared`,
            `transaction_mismatch`, `unknown_transaction` (App Store); `unknown_purchase`,
            `test_purchase`, `invalid_purchase` (Play); `invalid_ticket` (Steam).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            `forbidden` with `reason` `binding_mismatch`, `bound_elsewhere`, `unbound` or
            `not_owned` (Steam); `not_entitled` with `reason: no_license` for a device without a
            licence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
        "404":
          description: "The service not-found, or `reason: unmapped_product` — the store product unlocks nothing here."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
        "413":
          description: Body over 32 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "429":
          description: Too many claims for this licence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "503":
          description: "The store could not be reached (`unavailable`, `reason: store_unavailable`); retry."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }

  /{product}/distribution/hooks/app-store:
    post:
      operationId: appStoreNotifications
      tags: [distribution]
      summary: App Store Server Notifications V2 (Apple → Worker)
      description: >
        P6-01. The URL an operator sets in App Store Connect (App Information → App Store Server
        Notifications, Version 2). The body's `signedPayload` is verified like a StoreKit JWS
        (`x5c` to the pinned Apple Root CA - G3; 401 otherwise) BEFORE anything is believed.
        Deduplicated on `notificationUUID`. ONE_TIME_CHARGE, REFUND, REVOKE and REFUND_REVERSED
        are acted on — the transaction is re-read from the App Store Server API and Apple's copy
        grants or revokes — and every other type (TEST included) is stored raw. A notification
        for another bundle id or Apple ID, or from an environment the product refuses (a sandbox
        delivery to a production product), answers 200 with `ignored` and changes nothing. A
        Server API outage answers 503 so Apple redelivers. Rate-limited per client IP before verification and per product after it (only verified deliveries count against the product). Without App
        Store settings and a pinned `app-store-server-key`, or with License off, the service
        not-found. No CORS.
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties:
                signedPayload:
                  { type: string, description: The Apple-signed JWS. }
      responses:
        "200":
          description: "Handled, a duplicate, or `ignored` (with the reason)."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
                  duplicate: { type: boolean, const: true }
                  ignored: { type: string }
        "400":
          description: "Not `{signedPayload}` (`reason: bad_body`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
        "401":
          description: "Not signed by Apple (`reason`: `invalid_jws` or `untrusted_chain`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Body over 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "429":
          description: Too many deliveries for this product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "503":
          description: The App Store Server API could not be reached; Apple redelivers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }

  /{product}/distribution/hooks/play-rtdn:
    post:
      operationId: playRtdn
      tags: [distribution]
      summary: Google Play real-time developer notifications over Pub/Sub push (Google → Worker)
      description: >
        P6-01. The endpoint of an authenticated Pub/Sub push subscription on the app's RTDN
        topic. `Authorization: Bearer` must be a Google-signed OIDC token (Google's JWKS, issuer
        `https://accounts.google.com`, the configured audience, `email` equal to the push
        service account, `email_verified`) — 401 with a `reason` otherwise, before the body is
        read. Deduplicated on `message.messageId`. A `oneTimeProductNotification` is re-read
        with `purchases.products.get` (the API decides; only PURCHASED grants, and a granted
        purchase is acknowledged once); a `voidedPurchaseNotification` revokes; a test
        notification is stored. A body that is not an RTDN for the configured package answers
        200 (`ignored`) so Pub/Sub does not redeliver it. A Play API outage answers 503 so
        Pub/Sub redelivers. Rate-limited per client IP before verification and per product after it (only verified deliveries count against the product). Without Play settings and a pinned
        `google-service-account`, or with License off, the service not-found. No CORS.
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [data, messageId]
                  properties:
                    data:
                      { type: string, description: Base64 of the RTDN JSON. }
                    messageId: { type: string }
                    publishTime: { type: string }
                subscription: { type: string }
      responses:
        "200":
          description: "Handled, a duplicate, or `ignored`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
                  duplicate: { type: boolean, const: true }
                  ignored: { type: string }
        "401":
          description: >
            The push token is missing or wrong (`reason`: `no_token`, `bad_token`,
            `unknown_key`, `wrong_issuer`, `wrong_audience`, `wrong_account`,
            `unverified_email`, `expired`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Body over 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "429":
          description: Too many deliveries for this product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "503":
          description: The Play Developer API could not be reached; Pub/Sub redelivers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }

  /{product}/distribution/altstore/{channel}/source.json:
    get:
      operationId: altstoreSource
      tags: [distribution]
      summary: AltStore Classic / SideStore source for one channel
      description: >
        P2b-05. The product's `altstore` outlet as an AltStore source (notes/E1 §B1–§B4):
        versions newest first and unique by (`version`, `buildVersion`), `appPermissions` from
        the IPA metadata `pkey release publish` extracted (a release without it is skipped:
        AltStore refuses an install whose permissions differ), the legacy app-level `version`,
        `versionDate`, `versionDescription`, `downloadURL` and `size` beside `versions[]`
        (SideStore issue #735), and NO `marketplaceID` (SideStore refuses a source carrying one).
        Lists the releases the channel serves (beta includes stable) that have the outlet's
        build, are live on it, are not yanked and are not held back by a paused, halted or
        partial outlet rollout — the previous release stands in. Download URLs are immutable
        `files/<releaseId>/<name>` URLs on the bytes host when there is one. Exists only while
        the app's delivery access is `public` (no client of it can authenticate); otherwise, and
        for an unknown channel or a product without the outlet, the plain not-found.
        `?outlet=<id>` picks one of several `altstore` outlets. `Cache-Control: public,
        max-age=300`; the strong ETag is the body's SHA-256.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - { $ref: "#/components/parameters/FeedOutlet" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/FeedDocument" }
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightAltstoreSource
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins` (a source browser). See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/altstore-pal/{channel}/source.json:
    get:
      operationId: altstorePalSource
      tags: [distribution]
      summary: AltStore PAL source for one channel
      description: >
        P2b-05. The `altstore-pal` outlet's source: the AltStore document WITH `marketplaceID`
        (the outlet's `marketplaceId`; not-found without one). AltStore PAL is a store outlet, so
        a release appears only once reported `live` there (`POST …/distribution/report` or a
        connector). The download URL is the build's payload as the release declares it.
        Otherwise as `altstoreSource`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - { $ref: "#/components/parameters/FeedOutlet" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/FeedDocument" }
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightAltstorePalSource
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/obtainium/{channel}.json:
    get:
      operationId: obtainiumConfig
      tags: [distribution]
      summary: Obtainium app config for one channel
      description: >
        P2b-05. The app config an `obtainium://app/<url-encoded JSON>` link carries (notes/E2 §B3;
        key names checked against Obtainium's `App.fromJson`): `id`, `url`, `author`, `name`,
        `overrideSource` and `additionalSettings`, a JSON STRING. With a live `fdroid-repo`
        outlet the config tracks that repository (`FDroidRepo`: version codes, ABI selection,
        stable preferring stable versions); otherwise it is a `DirectAPKLink` to the channel's
        `builds/<channel>/<buildId>` URL, pseudo-versioned by its ETag (the payload's SHA-256).
        Needs a live `obtainium` outlet and a package name (the outlet's `packageName` or the
        APK metadata). Same access, caching and not-found rules as `altstoreSource`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - { $ref: "#/components/parameters/FeedOutlet" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/FeedDocument" }
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightObtainiumConfig
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/fdroid/{channel}/repo/{path}:
    get:
      operationId: fdroidRepoFile
      tags: [distribution]
      summary: F-Droid repository relay (one channel's repository)
      description: >
        P2b-05. One F-Droid repository per channel (notes/E2 §C2), signed BY CI with the repo key
        Polaris Key never holds. Serves only the files CI registered
        (`POST …/distribution/feeds/fdroid/{channel}`) — `entry.jar`, `entry.json`,
        `index-v2.json`, `diff/<timestamp>.json`, `icons/…` (`{path}` may contain `/`) — from the
        blob store with the type chosen at registration (`application/json`,
        `application/java-archive`, `image/png`, …), `nosniff` and a sandbox CSP,
        `Cache-Control: public, max-age=300, no-transform` and the SHA-256 as ETag (the paths are
        mutable). An APK the registered `index-v2.json` names and the channel's F-Droid feed
        still selects (`<name>.apk`) is a `302` to its immutable delivery URL. A path failing the safe-path check, any other path, a non-public
        app deliverable, a registered file whose object a non-public deliverable's release
        carries (the blob route's strictest-mode rule), or a product without a live
        `fdroid-repo` outlet: the plain not-found.
        The repository URL users add is `…/fdroid/{channel}/repo?fingerprint=<sha256>`, the
        fingerprint from the key inventory (`fdroid-repo` purpose).
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - name: path
          in: path
          required: true
          description: A repository path relative to `repo/`; may contain `/` (`diff/1700000000.json`).
          schema: { type: string }
        - { $ref: "#/components/parameters/Range" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: The registered file.
          content:
            application/json:
              schema: { type: object }
            application/java-archive:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "206":
          description: Partial content for a `Range` request.
        "302":
          description: An APK the index lists, redirected to its immutable delivery URL.
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightFdroidRepoFile
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/scoop/{channel}.json:
    get:
      operationId: scoopManifest
      tags: [distribution]
      summary: Scoop app manifest for one channel
      description: >
        P2b-05. A Scoop manifest (notes/E3 §A4) for the newest release the channel serves on the
        product's `direct` outlet covering Windows: `version`, `architecture.{64bit,arm64}.{url,
        hash}` (immutable URLs, SHA-256s), `bin` and `shortcuts` from the outlet's `scoop`
        identity, and `checkver` / `autoupdate` pointing back at this URL, so a bucket can track
        it or a user can `scoop install <url>`. Same selection, access, caching and not-found
        rules as `altstoreSource`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - { $ref: "#/components/parameters/FeedOutlet" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/FeedDocument" }
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightScoopManifest
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/flathub/{channel}.json:
    get:
      operationId: flathubChecker
      tags: [distribution]
      summary: Flathub x-checker-data JSON for one channel
      description: >
        P2b-05. `{version, releases: [{arch, url, sha256, size}]}` for the newest release the
        channel serves with Linux builds (notes/E3 §B2), what a `type: json` External Data
        Checker reads for an extra-data source. A deterministic template over release data, and
        never a manifest: Polaris Key does not open, comment on or automate a Flathub pull
        request (S-07 row 12). Needs a live `flathub` outlet; liveness is the bytes we serve
        (the checker is what leads to a Flathub build), held-back rollouts on the outlet still
        apply. Same access, caching and not-found rules as `altstoreSource`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - { $ref: "#/components/parameters/FeedOutlet" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/FeedDocument" }
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightFlathubChecker
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/download.json:
    get:
      operationId: downloadPageModel
      tags: [distribution]
      summary: The public download page's model
      description: >
        P2b-06. Everything the public download page shows, as JSON, and the ONLY input its HTML is
        rendered from (`DownloadModel`): per platform the actions in priority order (the first is
        the primary) and the downloadable builds with version, size, SHA-256 and minimum OS; the
        store links (App Store, Google Play, Microsoft Store, Steam, itch.io, Flathub, Snap,
        winget), each only once the channel has a release reported live there; the add-source
        links for AltStore, SideStore and AltStore PAL, the Obtainium app config as an
        `obtainium://app/…` link with its `apps.obtainium.imranr.dev/redirect` fallback, the
        F-Droid repository with its fingerprint, the Scoop and Homebrew commands, all pointing at
        the storefront feeds on this host; the key inventory's public fingerprints; the newest
        offered release with a plain-text summary of its notes (only while metadata is public).
        Releases are chosen by the storefront feeds' rules: the `stable` channel's, live on the
        outlet, not yanked, not held by a paused, halted or partial rollout. Exists only while
        the app deliverable's delivery access is `public`; otherwise, with Release or
        Distribution off, or with no release configuration, the plain not-found. Every identity
        and listing field is re-validated and every URL built by the Worker. Served like a feed:
        `Cache-Control: public, max-age=300`, a strong ETag of the body's SHA-256, the feeds'
        per-IP budget. Console host only (the page itself is on the bytes host).
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: The model. `application/json; charset=utf-8`, strong `ETag`, `nosniff`.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadModel" }
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightDownloadPageModel
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/download:
    get:
      operationId: downloadPage
      tags: [distribution]
      summary: The public download page (bytes host only)
      description: >
        P2b-06. A cookie-free HTML page rendered from `downloadPageModel` for the visitor's
        platform, detected server-side from User-Agent Client Hints (`Sec-CH-UA-Platform`,
        `Sec-CH-UA-Mobile`) with a User-Agent fallback; an iPad, whose Safari reports a Mac, gets
        the iOS primary through a pointer media query. One primary action, then every other way
        to get the product (deep links, QR codes as inline SVG, commands, the F-Droid
        fingerprint), every build with its SHA-256, the signing-key fingerprints. Served ONLY on
        the bytes host (`BLOB_ORIGIN`): on the console host this path is the plain not-found, so
        no repo-authored HTML is ever served on the console's origin. Its own
        `Content-Security-Policy` is checked by the bytes host before it leaves: `default-src
        'none'`, the one stylesheet by hash, `base-uri`, `form-action` and `frame-ancestors`
        `'none'`, and `sandbox allow-downloads allow-top-navigation-to-custom-protocols` (an
        opaque origin, no script). `nosniff`, `Referrer-Policy: no-referrer`, no cookie read or
        set, no CORS, `Vary` on the hints. The same not-found and rate-limit rules as the model.
      parameters:
        - { $ref: "#/components/parameters/Product" }
      responses:
        "200":
          description: "HTML. `text/html; charset=utf-8`, `cache-control: public, max-age=300`."
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }

  /{product}/distribution/feeds/fdroid/{channel}:
    get:
      operationId: ciFdroidInputs
      tags: [distribution]
      summary: The F-Droid generator's inputs (CI)
      description: >
        P2b-05. What `pkey feeds fdroid` builds `index-v2.json`, `entry.json` and diffs from: the
        repository address and the `fdroid-repo` fingerprints of the key inventory, the outlet's
        package name and listing, the APKs the channel's F-Droid feed selects (newest first, each
        with its release, a `stable` flag, notes, delivery URL and the APK metadata from the
        descriptor), and the files registered now (so CI can diff against the current index).
        Requires a `pkeyci_` token with `distribution:feeds` (opt-in). No CORS. `no_feed` 404
        when the product cannot serve a public F-Droid feed for the channel.
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
      responses:
        "200":
          description: The inputs.
          content:
            application/json:
              schema:
                type: object
                required: [product, channel, outlet, repo, versions, files]
                properties:
                  product: { type: string }
                  channel: { type: string }
                  outlet: { type: string }
                  packageName: { type: [string, "null"] }
                  repo:
                    type: object
                    properties:
                      address: { type: string }
                      fingerprints: { type: array, items: { type: string } }
                  productName: { type: string }
                  listing: { type: [object, "null"] }
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        releaseId: { type: string }
                        version: { type: string }
                        stable: { type: boolean }
                        publishedAt: { type: [integer, "null"] }
                        notes: { type: [string, "null"] }
                        apk:
                          type: object
                          properties:
                            name: { type: string }
                            sha256: { type: [string, "null"] }
                            size: { type: [integer, "null"] }
                            url: { type: string }
                        metadata: { type: [object, "null"] }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        sha256: { type: string }
                        size: { type: integer }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }
    post:
      operationId: ciFdroidRegister
      tags: [distribution]
      summary: Register the F-Droid repository files CI signed and uploaded (CI)
      description: >
        P2b-05. `{ticket?, files: [{path, sha256, size}]}`: at most 256 files, which must include
        `entry.jar`, `entry.json` and `index-v2.json`; each path a safe relative path ending in
        `.json`, `.jar`, `.png`, `.jpg`, `.jpeg`, `.webp` or `.asc`, each at most 32 MiB. Every
        file is the content-addressed `blobs/sha256/<sha256>`: one an earlier register already
        earned (this product's `feed` blob ref; a release's or a pack's ref does not count), or
        an object of the upload `ticket` (P2-02's uploads route, which accepts
        `distribution:feeds`), verified in staging and promoted here. No file may be an object
        that a non-public deliverable's release carries (the blob route's strictest-mode rule,
        which the relay re-applies per request). The channel's set and its
        `feed` blob refs are then REPLACED in one batch. Audited as
        `distribution.feeds.register`. Requires a `pkeyci_` token with `distribution:feeds`. No
        CORS. Errors are LEGACY FLAT with a `reason`: `bad_files`, `bad_feed_path`,
        `incomplete_repository`, `object_not_in_ticket`, `staged_object_missing`,
        `staged_object_mismatch`, `stored_object_mismatch`, `ticket_redeemed`, `bad_body` (400);
        `invalid_ticket`, `ticket_expired`, `not_public` (403); `unknown_channel`,
        `unknown_outlet`, `no_blob_store` (404); `promote_failed` (409, retryable).
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                ticket:
                  {
                    type: string,
                    description: "A `pkeyup_` ticket; needed when any file is not already a registered feed file of the product.",
                  }
                files:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: object
                    required: [path, sha256, size]
                    properties:
                      path: { type: string }
                      sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                      size: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The registered set.
          content:
            application/json:
              schema:
                type: object
                required: [ok, feed, channel, files]
                properties:
                  ok: { type: boolean, const: true }
                  feed: { type: string, const: fdroid }
                  channel: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        sha256: { type: string }
                        size: { type: integer }
                        contentType: { type: string }
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "409": { $ref: "#/components/responses/CiRefusal" }

  /{product}/distribution/listing/assets:
    post:
      operationId: ciListingAssetsRegister
      tags: [distribution]
      summary: Register the listing assets CI derived and uploaded (CI)
      description: >
        A-18d. `pkey listing assets` derives every store's icons, composes its store art from the
        key art and wordmark, fits screenshots per store (each crop or pad accepted per image) and
        packs each store's outputs, in CI; this route stores them into the shared listing model
        (`dist_listing_assets`), from which the storefront adapters push listing images. Nothing
        is pushed to a store here and nothing is served. `{ticket?, assets: [{slot, locale?,
        sha256, size, width?, height?, alpha, derivedFrom?, textAllowed}]}`: 1 to 160 rows, each
        validated by the model (a known slot: the fixed slots or
        `<store>:screenshot:<class>:<n>`; the slot's `textAllowed`; a locale code; 1 to 16,384
        pixels; a known `derivedFrom`), each object at most 128 MiB. Every object is the
        content-addressed `blobs/sha256/<sha256>`: one an earlier register already earned (this
        product's `listing-asset` blob ref; any other ref kind does not count), or an object of
        the upload `ticket` (P2-02's uploads route, which accepts `distribution:listing`),
        verified in staging and promoted here. A row the operator uploaded (`source = admin`) is
        never replaced and is answered in `kept`. Rows are written with `source = import` and
        their refs in one batch. Audited as `distribution.listing.assets`. Requires a `pkeyci_`
        token with `distribution:listing` (opt-in). No CORS. Errors are LEGACY FLAT with a
        `reason`: `bad_assets`, `invalid_asset`, `object_not_in_ticket`,
        `staged_object_missing`, `staged_object_mismatch`, `stored_object_mismatch`,
        `ticket_redeemed`, `bad_body` (400); `invalid_ticket`, `ticket_expired` (403);
        `no_blob_store` (404); `promote_failed` (409, retryable).
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assets]
              properties:
                ticket:
                  {
                    type: string,
                    description: "A `pkeyup_` ticket; needed when any object is not already one the product's listing rows hold.",
                  }
                assets:
                  type: array
                  minItems: 1
                  maxItems: 160
                  items:
                    type: object
                    required: [slot, sha256, size, alpha, textAllowed]
                    properties:
                      slot: { type: string }
                      locale: { type: [string, "null"] }
                      sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                      size: { type: integer, minimum: 1 }
                      width:
                        { type: [integer, "null"], minimum: 1, maximum: 16384 }
                      height:
                        { type: [integer, "null"], minimum: 1, maximum: 16384 }
                      alpha: { type: boolean }
                      derivedFrom: { type: [string, "null"] }
                      textAllowed: { type: string, enum: [none, title, free] }
      responses:
        "200":
          description: The stored rows, and the operator's rows left as they were.
          content:
            application/json:
              schema:
                type: object
                required: [ok, stored, kept]
                properties:
                  ok: { type: boolean, const: true }
                  stored:
                    type: array
                    items:
                      type: object
                      properties:
                        slot: { type: string }
                        locale: { type: [string, "null"] }
                        sha256: { type: string }
                        blob: { type: string }
                  kept:
                    type: array
                    items:
                      type: object
                      properties:
                        slot: { type: string }
                        locale: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "409": { $ref: "#/components/responses/CiRefusal" }

  /{product}/release/channels/{channel}/promote:
    post:
      operationId: ciPromoteChannel
      tags: [release]
      summary: Promote a release to a channel (CI)
      description: >
        P2-05. Sets the channel's pointer for the deliverable to `releaseId` (the pin flag is
        left as it is, so promoting a pinned channel moves the pin); the release becomes a
        member of the channel. A yanked release cannot be promoted (409 `release_yanked`).
        Requires a `pkeyci_` token with `release:promote` (P2-02 issues them). Channel names are
        canonical: `staging` means `beta` unless the product declares a manual `staging`
        channel. Writes the policy as an operator change (`source = admin`, so a resync never
        undoes it), audits it as `ci:<subject>`, and invalidates cached resolutions. No CORS: a
        CI route, not a browser one. Errors are LEGACY FLAT with a machine-readable `reason`.
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/PolicyChannel" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PointerRequest" }
            examples:
              promote: { value: { releaseId: v1.4.0 } }
      responses:
        "200": { $ref: "#/components/responses/ChannelPolicyChanged" }
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "409": { $ref: "#/components/responses/CiRefusal" }
        "422": { $ref: "#/components/responses/CiRefusal" }

  /{product}/release/channels/{channel}/pin:
    post:
      operationId: ciPinChannel
      tags: [release]
      summary: Pin a channel to a release (CI)
      description: >
        P2-05. Sets the pointer to `releaseId` and pins it: the channel serves only releases at
        or below the pointer (per platform), and a pinned pointer resolves even when it is
        yanked — yanked releases resolve only by explicit pin. Same token, scope, canonical
        names, audit and error shape as `ciPromoteChannel`.
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/PolicyChannel" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PointerRequest" }
            examples:
              pin: { value: { releaseId: v1.3.2 } }
      responses:
        "200": { $ref: "#/components/responses/ChannelPolicyChanged" }
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "422": { $ref: "#/components/responses/CiRefusal" }

  /{product}/release/channels/{channel}/unpin:
    post:
      operationId: ciUnpinChannel
      tags: [release]
      summary: Unpin a channel (CI)
      description: >
        P2-05. Clears the pin; the pointer stays a member of the channel, and the channel serves
        its newest eligible release again. `releaseId` is not needed. Same token, scope, audit
        and error shape as `ciPromoteChannel`.
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/PolicyChannel" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PointerRequest" }
            examples:
              unpin: { value: {} }
      responses:
        "200": { $ref: "#/components/responses/ChannelPolicyChanged" }
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }

  /{product}/release/releases/{releaseId}/yank:
    post:
      operationId: ciYankRelease
      tags: [release]
      summary: Yank a release (CI)
      description: >
        P2-05. The release stops resolving on every moving selector — `/release/dl`, the
        appcasts, `/update/version` and `/release/builds` — and remains reachable only through
        an explicit pin or a version selector. Nothing is deleted; re-yanking updates the
        reason. Requires a `pkeyci_` token with `release:yank` (opt-in in P2-02's default
        grant). Audited as `ci:<subject>`; invalidates cached resolutions. Lifting a yank is an
        operator action in the console. No CORS.
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: releaseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
            examples:
              yank: { value: { reason: crashes on launch on macOS 15 } }
      responses:
        "200":
          description: The release is yanked.
          content:
            application/json:
              schema:
                type: object
                required: [ok, yank]
                properties:
                  ok: { type: boolean, const: true }
                  yank:
                    type: object
                    properties:
                      releaseId: { type: string }
                      yanked: { type: boolean }
                      reason: { type: [string, "null"] }
                      at: { type: [integer, "null"] }
                      by: { type: [string, "null"] }
                  packSets: { $ref: "#/components/schemas/PackSetsOutcome" }
              examples:
                yanked:
                  summary: test/releasePolicy.test.ts
                  value:
                    ok: true
                    yank:
                      {
                        releaseId: v1.1.0,
                        yanked: true,
                        reason: crashes on launch,
                        at: 1700000000,
                        by: "ci:static:tok_1",
                      }
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "422": { $ref: "#/components/responses/CiRefusal" }

  /{product}/release/publish/token:
    post:
      operationId: ciPublishToken
      tags: [release]
      summary: Exchange a GitHub Actions OIDC token for a pkeyci_ token (trusted publishing)
      description: >
        P2-02. The trusted-publisher exchange (README §3.4). The body carries the job's GitHub
        Actions OIDC token, requested with the audience `<origin>/<product>/release/publish`
        (for example `https://key.plrs.im/diceroll/release/publish`). The Worker verifies it —
        RS256 only, issuer exactly `https://token.actions.githubusercontent.com`, JWKS cached
        in KV, `exp`/`nbf` with 60 s skew — and then the product's publisher policy, every
        check required: numeric `repository_id` and `repository_owner_id` equal the linked
        repository's; `job_workflow_ref` is `<owner>/<repo>/<workflow>@<ref>` for the declared
        workflow at the triggering ref; `environment` equals the declared one (default
        `release`); `ref_protected` is `"true"` (a tag-triggered release needs a tag ruleset);
        `runner_environment` is `github-hosted`; `event_name` is `push`, `release` or
        `workflow_dispatch`. The exchange is single-use per OIDC `jti`. On success it returns a
        `pkeyci_` token valid for 30 minutes with the policy's scopes (default
        `release:publish`, `release:promote`, `distribution:report`; `release:yank` and `distribution:rollout` are opt-in).
        Rate-limited per IP on every request, and per product only once a token has passed
        the signature, audience and policy checks, so no outsider can spend the product's
        budget (both fail closed). No CORS. Errors are LEGACY FLAT with
        a `reason`: `invalid_oidc_token`, `oidc_token_replayed` (401);
        `publisher_not_configured`, `policy_mismatch` with the failing `claim` (403);
        `bad_body` (400); `rate_limited` (429).
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  {
                    type: string,
                    description: The GitHub Actions OIDC token (a JWT).,
                  }
      responses:
        "200":
          description: A short-lived, scoped CI token. Shown once; only its peppered hash is stored.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, scopes]
                properties:
                  token: { type: string, pattern: "^pkeyci_" }
                  expiresAt: { type: integer, description: Epoch seconds. }
                  scopes: { type: array, items: { type: string } }
              examples:
                issued:
                  summary: test/publishRoutes.test.ts
                  value:
                    token: pkeyci_Zm9vYmFyYmF6cXV4cXV1eGNvcmdlZ3JhdWx0Z2FycGx5d2FsZG8
                    expiresAt: 1700001800
                    scopes:
                      [distribution:report, release:promote, release:publish]
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiRefusal" }
        "403": { $ref: "#/components/responses/CiRefusal" }
        "429": { $ref: "#/components/responses/CiRefusal" }

  /{product}/release/publish/uploads:
    post:
      operationId: ciPublishUploads
      tags: [release]
      summary: Obtain an upload ticket and R2 temporary credentials (trusted publishing)
      description: >
        P2-02. Requires a `pkeyci_` token with `release:publish` — or, for the F-Droid repository
        files `pkey feeds fdroid` uploads, `distribution:feeds` (P2b-05), or, for the listing assets
        `pkey listing assets` derived, `distribution:listing` (A-18d). The body lists the objects CI
        intends to upload (`sha256`, `size`, optional `gated` for `gated/blobs/…`; at most 256,
        each one single-part, at most 5 GiB less 5 MiB). The answer is a one-shot ticket
        (expiring with the token, at most an hour), R2 temporary credentials scoped to
        `staging/<product>/<ticketId>/` with `PutObject` and `HeadObject` only — no read, list,
        copy or multipart — and, per object, its staging `key` and whether it is `present`:
        already referenced by THIS product, so CI may skip the upload. `present` never reflects
        another product's copy. `nextSeq` is each deliverable's highest seq + 1 at issue time.
        Upload each object with `x-amz-checksum-sha256` so R2 records its digest. The route
        answers 404 until the environment's parent R2 token (`R2_ACCOUNT_ID`,
        `R2_PARENT_ACCESS_KEY_ID`, `R2_PARENT_SECRET_ACCESS_KEY`, `BLOBS_BUCKET_NAME`) and the
        `BLOBS` binding exist. No CORS. `bad_objects`, `bad_releases` and `bad_body` are 400.
        P3-03: `releases` names the releases CI is about to publish (at most 16
        `{deliverable, version}`), and `seqs` answers each one's `seq` — the stored one for a
        release that exists (the GitHub sync may have created it first), else the next one for
        its deliverable, counting the new releases named before it. CI signs that `seq` into
        the release record and the descriptor; a re-run gets the stored value again.
        P4-02: an existing release's entry also carries `recordSha256`, its record's hash (CI
        resolves `--pin <packId>@<version>` with it and proves its cached delta bases). A pack's
        entry carries `entitlement`, the pack's delivery gate (the `entitlement` of its own
        `dist_access` row, read through Distribution's `delivery.entitlement`; `null` when
        ungated): CI stages every object `gated` exactly when it is set and signs it into the
        record. A request with a non-empty `releases` may omit `objects`: the PREFLIGHT, which
        issues no ticket and answers only `seqs`. An `objects` array that is present stays
        non-empty. A pack named while Distribution is off is `distribution_disabled` (409).
        P4-22: a pack's ticket names its pack in `deliverable`, and `present` then means that
        PACK already uploaded the object (a `pack-upload` ref of that pack id), not merely the
        product: a pack's stage round skips only those, and ingest requires the pack's own ref on
        a chunk index and its bundles. An object another pack of the product holds is uploaded
        and promoted again (the bytes are not rewritten) and earns this pack's ref. `deliverable`
        must be a pack the product declares (`unknown_pack_deliverable`, 400); it never reveals
        another product's objects.
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`objects`, or (the P4-02 preflight) a non-empty `releases` alone."
              anyOf:
                - required: [objects]
                - required: [releases]
                  properties: { releases: { minItems: 1 } }
              properties:
                objects:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: object
                    required: [sha256, size]
                    properties:
                      sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                      size: { type: integer, minimum: 0, maximum: 5363466240 }
                      gated: { type: boolean }
                deliverable:
                  description: "P4-22: the pack this ticket uploads for; `present` is then that pack's own uploads."
                  type: string
                  pattern: "^[a-z][a-z0-9-]*(\\.[a-z0-9-]+)*$"
                  maxLength: 64
                releases:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required: [deliverable, version]
                    properties:
                      deliverable:
                        {
                          type: string,
                          pattern: "^[a-z][a-z0-9-]*(\\.[a-z0-9-]+)*$",
                          maxLength: 64,
                        }
                      version:
                        {
                          type: string,
                          pattern: "^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$",
                        }
      responses:
        "200":
          description: >
            The ticket, the credentials, the staging keys and `nextSeq`; or, for the preflight,
            `seqs` alone.
          content:
            application/json:
              schema:
                type: object
                required: [seqs]
                properties:
                  ticket: { type: string, pattern: "^pkeyup_" }
                  expiresAt: { type: integer }
                  credentials:
                    type: object
                    required:
                      [
                        endpoint,
                        bucket,
                        accessKeyId,
                        secretAccessKey,
                        sessionToken,
                      ]
                    properties:
                      endpoint: { type: string }
                      bucket: { type: string }
                      accessKeyId: { type: string }
                      secretAccessKey: { type: string }
                      sessionToken: { type: string }
                  prefix: { type: string }
                  objects:
                    type: array
                    items:
                      type: object
                      required: [sha256, key, present]
                      properties:
                        sha256: { type: string }
                        size: { type: integer }
                        gated: { type: boolean }
                        key:
                          {
                            type: string,
                            description: The staging key to PUT to.,
                          }
                        target:
                          {
                            type: string,
                            description: The blob-store key a submit promotes it to.,
                          }
                        present: { type: boolean }
                  nextSeq:
                    type: object
                    additionalProperties: { type: integer }
                  seqs:
                    type: array
                    description: One entry per `releases` entry, in order (empty without `releases`).
                    items:
                      type: object
                      required: [deliverable, version, seq]
                      properties:
                        deliverable: { type: string }
                        version: { type: string }
                        seq: { type: integer, minimum: 1 }
                        recordSha256:
                          type: string
                          pattern: "^[0-9a-f]{64}$"
                          description: "P4-02: the existing release's record hash."
                        entitlement:
                          type: [string, "null"]
                          description: "P4-02, a pack only: its delivery gate, `null` when ungated."
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "409": { $ref: "#/components/responses/CiRefusal" }

  /{product}/release/publish/stage:
    post:
      operationId: ciPublishStage
      tags: [release]
      summary: A stage round of a pack's objects (trusted publishing)
      description: >
        P4-02 (plans/P4-01.md §6, decision 28). Requires a `pkeyci_` token with `release:publish`
        and a ticket that token obtained (at most 256 objects, 64 KiB, as `uploads`).
        `deliverable` must be a pack the product declares (`unknown_pack_deliverable`). Every
        ticket object the product does not already reference is verified in its staging prefix
        (`staged_object_missing`, `staged_object_mismatch`), and must be `gated` exactly when the
        pack's delivery gate is set (`gated_mismatch`); then the ticket is claimed (once,
        `ticket_redeemed`), each object promoted into the blob store and one `blob_refs` row
        written per object, kind `pack-upload` with the pack id. A failure gives the claim back
        (`promote_failed`, 409, `retryable`); objects already promoted keep their refs. A pack
        whose product has Distribution off is `distribution_disabled` (409). `staged` lists the
        keys promoted by this round, `present` the ones the product already referenced. A
        `pack-upload` ref is possession, not liveness: it lets the record submit name the
        object. No CORS.
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, deliverable]
              properties:
                ticket: { type: string, pattern: "^pkeyup_" }
                deliverable:
                  {
                    type: string,
                    pattern: "^[a-z][a-z0-9-]*(\\.[a-z0-9-]+)*$",
                    maxLength: 64,
                  }
      responses:
        "200":
          description: The round's promoted and already-present keys.
          content:
            application/json:
              schema:
                type: object
                required: [ok, deliverable, staged, present]
                properties:
                  ok: { type: boolean, const: true }
                  deliverable: { type: string }
                  staged: { type: array, items: { type: string } }
                  present: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiRefusal" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "409": { $ref: "#/components/responses/CiRefusal" }

  /{product}/release/publish/delegations:
    post:
      operationId: ciPublishDelegations
      tags: [release]
      summary: The product's content-key delegations (trusted publishing)
      description: >
        P4-19 (plans/P4-19.md §6.3). Requires a `pkeyci_` token with `release:publish`; the body
        cap is `uploads`' (64 KiB). Lists every stored `kind: delegation` record of the product —
        its record hash, scope root, `seq`, the lowercase hex SHA-256 of the delegated key's raw
        bytes (`keyFingerprint`, as `releaseKeyFingerprints`), its signing window, its `origin`
        (`submit`, or `revocation` for one first seen supplied with its revocation) and whether
        it is revoked, its `version`, and its compact JWS verbatim (`jws`), so the CLI can revoke
        or publish under a delegation whatever the product's metadata access. With
        `deliverable`, `nextSeq` is one more than that scope's highest
        `origin: submit` `seq` (1 when none). `pkey release delegate` reads it before signing, to
        refuse a key any delegation already names and to take its `seq`. A delegation is a
        signature, never bytes, so the route needs no blob store. A `deliverable` that is not a
        pack id is `bad_body`. No CORS.
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deliverable:
                  {
                    type: string,
                    pattern: "^[a-z][a-z0-9-]*(\\.[a-z0-9-]+)*$",
                    maxLength: 64,
                    description: "A scope root (a pack id): ask for its `nextSeq`.",
                  }
      responses:
        "200":
          description: The product's delegations.
          content:
            application/json:
              schema:
                type: object
                required: [delegations]
                properties:
                  delegations:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          sha256,
                          deliverable,
                          seq,
                          version,
                          keyFingerprint,
                          issuedAt,
                          expiresAt,
                          origin,
                          revoked,
                          jws,
                        ]
                      properties:
                        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                        deliverable: { type: string }
                        seq: { type: integer, minimum: 1 }
                        keyFingerprint:
                          { type: string, pattern: "^[0-9a-f]{64}$" }
                        issuedAt: { type: integer }
                        expiresAt: { type: integer }
                        version: { type: string }
                        origin: { type: string, enum: [submit, revocation] }
                        revoked: { type: boolean }
                        jws:
                          {
                            type: string,
                            description: "The delegation record's compact JWS, verbatim (its SHA-256 is `sha256`).",
                          }
                  nextSeq:
                    {
                      type: integer,
                      minimum: 1,
                      description: "Present only when `deliverable` was given.",
                    }
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiRefusal" }
        "404": { $ref: "#/components/responses/CiRefusal" }

  /{product}/release/publish/submit:
    post:
      operationId: ciPublishSubmit
      tags: [release]
      summary: Submit a release descriptor against an upload ticket (trusted publishing)
      description: >
        P2-02. Requires a `pkeyci_` token with `release:publish` and the ticket that token
        obtained. Every `r2` location the product does not already reference must be an object
        of the ticket, and its staged copy must verify (present, exact size, exact SHA-256);
        the descriptor is then checked exactly as P2-04's ingest checks it, all before anything
        is promoted. `dryRun: true` stops there and writes nothing; a dry run may come before
        the uploads (P2-06's `pkey release publish --dry-run` uploads nothing), and a ticket
        object not yet staged is then judged as if it were and listed in `unverified` (a
        staged copy that is present must still verify). Otherwise the ticket is
        redeemed (once), the objects are promoted into the blob store, and the descriptor is
        ingested. A failure gives the ticket back. The answer is the same whether or not the
        bytes were already stored (no cross-tenant signal). One descriptor per submit.
        Refusals are LEGACY FLAT with a `reason`: `staged_object_missing`,
        `staged_object_mismatch`, `object_not_in_ticket`, the descriptor ingest's reasons
        (`invalid_descriptor`, `seq_not_increasing`, `release_exists`, …) with their statuses;
        `invalid_ticket`, `ticket_expired` (403); `ticket_redeemed` (409); `promote_failed`
        (409). A body carrying `retryable: true` (the lost-race `release_exists`, a
        `promote_failed`) may be sent again; every other refusal is final. A descriptor's
        `title`, `notes` and `publishedAt` are the release's until a GitHub release with the
        same tag is synced, after which GitHub's are shown. No CORS.
        P3-03: `record` is the CI-signed release record (`pkey-release+jws`, WIRE-CONTRACT-V4
        §2.4) — the descriptor moved into a signed payload, signed with a key from the
        product's declared `releaseKeys`. It is checked after the descriptor and before anything
        is promoted, and stored (never rewritten) in the descriptor's batch. A refusal is
        `release_record_rejected` with a `reason`: `typ`, `kid` (not a declared release key),
        `product-key` (the key is one of the product's signing keys), `signature`, `claims`,
        `scheme` (the version does not parse under the deliverable's scheme; SemVer 2.0's
        grammar for `semver`), `descriptor-mismatch` (the record is not the descriptor under
        §2.4's mapping, or the descriptor does not carry the record's `seq` explicitly) — all
        400 — or `seq` (409, `retryable`: not the release's `seq`; ask the upload route again).
        Because the descriptor carries the `seq`, two publishes racing for one new `seq` are
        refused by the ingest (`seq_not_increasing` or the retryable `release_exists`) with
        nothing stored. A re-run whose release already holds a record keeps it
        (`record.stored: false`).
        P4-02: an app record's `content` and `builds[].embeds` are its descriptor's (the
        `descriptor-mismatch` comparison covers them), and the release's packs are checked
        against the stored records, refused as `release_record_rejected` with `content-api`
        (packs declared, no `content`), `pin-unknown`, `pin-mismatch`, `pin-yanked`,
        `pin-missing`, `pin-gated`, `embeds` or `pack-unreadable` (a declared pack's stored
        declaration does not read back; resync the manifest); a descriptor submitted without a record is
        checked the same way. A PACK release is `{ticket?, record, dryRun?}` with NO
        descriptor (the body at most 92,940 bytes): a `kind: pack` record, refused after the
        shared checks with `pack-unknown`, `scheme`, `seq` (409), `pack-type`,
        `pack-variant`, `pack-entitlement` (not the pack's delivery gate, or not the
        manifest's assertion), `pack-index` (an index over 8 MiB, the indexes over 64 MiB in
        all, or an index `parseFilesIndex` refuses) or `pack-object` (an object the record or
        an index names is not stored with that length under this product's refs and the pack's
        prefix, or a `full` whose size is not its payload's). The optional ticket is promoted as
        a stage round first; a dry run checks without promoting and lists in `unverified` the
        ticket objects not uploaded yet. The release id is `<packId>@<version>`.
        P4-22 (plans/P4-10.md §6): a variant's `chunks` (a `pkey-chunks/1` index) is refused as
        `pack-index` when its `size` or `bytes` is over 8 MiB or its `format` is not
        `pkey-chunks/1` (before anything is read), or when client-core's `parseChunkIndex`
        refuses it bound to the variant's payload; and as `pack-object` unless the index and
        every bundle in its table are stored with that length and held by a `pack-upload` ref
        of THIS pack under its prefix (another pack's or a release's ref does not count). A
        dry run lists an index neither stored nor staged, and a bundle not yet held, in
        `unverified`. Discovery advertises this as `services.release.chunks: true`.
        P4-12 (compatible and standalone packs): a pack record is also refused with
        `pack-requires` (a variant's signed `requires.contentApi`, `requires.packs` or
        `conflicts` disagrees with the pack's binding or names an undeclared pack),
        `pack-channel` (a channel the pack does not publish to) or `pack-unsatisfiable` (at a
        live selector it is meant for it lacks the selector's variant, or it is passed over for
        an older release because it breaks a dependency or a conflict, or it breaks a live app
        release's holds; the message names the selector and the constraint). An app release is
        also refused with `pin-requires`, `hold-unknown`, `hold-mismatch`, `hold-yanked`,
        `hold-binding`, `hold-requires`, `hold-unsatisfiable`, `content-unsatisfied` (a required
        compatible or standalone pack has no release at one of its selectors) or
        `pack-channels-conflict` (its `packChannels` differs from another live app release's on
        the same channel and contentApi). Either is refused `pack-sets-bound` when resolution
        cannot finish inside its bounds. When the product resolves pack sets, the answer (dry
        run or not) carries `packSets`: the resulting sets with the selectors and app releases
        that receive them, and every selector whose set changed. A dry run writes nothing.
        P4-13 (plans/P4-13.md §6.2): a REVOCATION is `{record, dryRun?}` with no descriptor and
        no ticket — a `kind: revocation` record signed by a declared release key (a product key
        is refused at `product-key`, an undeclared one at `kid`), naming a stored pack record by
        hash (`revokes`) and optionally a `replacement` of the same pack. After the shared
        checks it is refused, in order, with `revocation-body` (client-core's `revocationOf`
        finds the body unusable), `revocation-target` (not a stored pack record of that
        deliverable, version and `seq`), `revocation-stale` (409: the target already has a
        revocation that is newer by `issuedAt`, ties by record hash), `revocation-replacement`
        (not a stored, non-yanked, non-revoked record of the same pack) or
        `revocation-replacement-incompatible` (a variant of the target is missing from the
        replacement or runs on another engine, or a live level the target admits — or that of an
        app release pinning or holding it — is outside the replacement's range). A byte-identical
        resubmit answers `outcome: unchanged`; a newer revocation of the same target updates the
        stored one (`superseded`); nothing ever removes one. Ingest also yanks the target (reason
        `revoked`) and re-resolves the pack sets, which skip revoked releases. An app release is
        also refused with `pin-revoked` or `hold-revoked` (a pinned or held release is revoked).
        P4-19 (plans/P4-19.md §6.2): a DELEGATION is `{record, dryRun?}` — a `kind: delegation`
        record signed by a declared release key, refused after the shared checks with
        `delegation-body` (client-core's `delegationOf` finds it unusable, or a listed type is not
        delegable), `delegation-key` (the delegated key is a declared release key, a product
        signing key, or the key of any stored delegation), `seq` (409: not above the scope's last
        delegation's) or `delegation-window` (`issuedAt` over 300 s ahead, or `expiresAt` past); a
        byte-identical resubmit is `unchanged`; the answer carries `delegation`. A pack record
        whose kid is `pkd1-<delegation hash>` is signed by that delegation's content key: before
        the pack checks it is refused with `kid` (a revocation, delegation or app record under a
        `pkd1-` kid), `delegation-unknown`, `delegation-revoked`, `product-key` or
        `delegation-key` (the delegated key is a product or release key), `signature`, `claims`,
        `delegation-scope` (not a tree-layout pack of a delegated type under the scope, issued
        inside the window) or `delegation-window` (the window has closed, or `issuedAt` is more
        than a day old or 300 s ahead); after them with `delegation-binding` (not a compatible or
        standalone pack) or `delegation-data-only` (an index path outside the data-only extension
        allow-list). An app release is refused with `pin-delegated` or `hold-delegated`. A
        REVOCATION may name a delegation by hash: stored, or supplied alongside as
        `{record, delegation, dryRun?}` (the body at most 181,784 bytes), which must hash to
        `revokes`, verify against the release keys and be usable; it is then stored already
        revoked. `deliverable`, `version` and `seq` must be the delegation's
        (`revocation-target`); a replacement on a delegation target, or a replacement signed
        under a delegation, is `revocation-replacement`. Ingest yanks every release signed under
        the delegation (reason `delegation-revoked`).
        P4-20 (save compatibility): a pack record's record-level `provides` and `removes` (each
        an array of at most 4,096 distinct content ids, printable ASCII without spaces, 1 to 128
        characters) are checked before anything is promoted, dry run included: refused as
        `pack-provides` (a malformed list, or no `provides` while the pack declares
        `provides.required`) or `provides-dropped` (an id the deliverable's previous record
        provided is neither provided nor listed in `removes`, at a live contentApi level both
        releases support; two releases without a contentApi range always share a line; the
        message names the ids and the levels). The answer carries `warnings` for a `removes` id
        the previous record never provided or this one still provides. An APP descriptor submit
        may carry `contentInterface`, the SHA-256 of its content-interface registry, stored as
        unsigned release metadata (never a record member; `bad_body` when malformed or on a
        pack); the answer, dry run or not, then carries `contentInterface` with the channel's
        current app release's `releaseId`, `version`, `contentApi` and fingerprint (`previous`,
        null when the channel serves none), which `pkey release publish --content-interface`
        compares.
        F-03 (plans/F-01.md §3.2, §6.10): a PACKAGE release is a descriptor of `kind: package`
        (no `builds`, `tag` or `content`; a `package` block of `ecosystem`, `name`, `files` with
        `r2` locations only, and the CLI-extracted `metadata`), for a `kind: package` deliverable
        of `.pkey/release`. Its release id is `<deliverable>@<version>`. It is never signed: a
        submit carrying a `record` with it is refused `release_record_rejected`, reason
        `package-unsigned` (400), and so is `contentInterface` (`bad_body`). It is refused
        `invalid_descriptor` with reason `package-shape` (the validator's findings in
        `errors`, `unsupported_deliverable_kind` among them when the descriptor's kind and the
        deliverable's disagree), `maven-snapshot` (a Maven `-SNAPSHOT` version),
        `package-namespace` (no feed of the ecosystem is configured for the product, or the
        name is outside the feed's namespace), `package-too-large` (over the feed's size
        ceiling, never above the platform's: per release, per blob for OCI) or `swift-unsigned`
        (a Swift release without its `cms-1.0.0` signature on a feed that requires one, the
        default); `release_exists` with reason `package-version-taken` (409) when the version
        was ever published, in any state — a yanked or deprecated version is never published
        again, and only the identical descriptor of a live version answers `outcome:
        unchanged`; `distribution_disabled` (409) while Distribution is off. After promotion
        the Worker reads each npm tarball and Maven file once for its SHA-512, SHA-1 (and MD5)
        digests. The answer is the app answer without `record`, `packSets` or
        `contentInterface`. Package releases are served only by the package feeds: no
        device-facing route (the channel feed, the update decision, builds, files, blobs, the
        appcast, the records route, the download page, the storefront feeds) ever shows one.
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`{ticket, descriptor, record?, dryRun?}`, or (P4-02) a pack release: `{ticket?, record, dryRun?}`, or (P4-13) a revocation: `{record, dryRun?}`, which (P4-19) may carry the delegation it revokes: `{record, delegation, dryRun?}`, or (P4-19) a delegation: `{record, dryRun?}`."
              anyOf:
                - required: [ticket, descriptor]
                - required: [record]
                  not: { required: [descriptor] }
              properties:
                ticket: { type: string, pattern: "^pkeyup_" }
                descriptor:
                  type: object
                  description: A release descriptor (`release-descriptor.schema.json` in `@polaris-key/manifest`).
                record:
                  type: string
                  maxLength: 88844
                  description: "P3-03: the compact JWS of the release record (`pkey-release+jws`)."
                delegation:
                  type: string
                  maxLength: 88844
                  description: "P4-19, a revocation of a delegation the Worker never stored: that delegation's compact JWS."
                contentInterface:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: "P4-20, an app descriptor submit: the SHA-256 of the app's content-interface registry, stored as unsigned release metadata."
                dryRun: { type: boolean }
      responses:
        "200":
          description: Ingested (or, with `dryRun`, the plan).
          content:
            application/json:
              schema:
                type: object
                required: [ok, dryRun, outcome]
                description: "`releaseId` is present on every answer except a revocation's (P4-13), which carries `revocation` instead, and a delegation's (P4-19), which carries `delegation`."
                properties:
                  ok: { type: boolean, const: true }
                  dryRun: { type: boolean }
                  releaseId: { type: string }
                  outcome:
                    {
                      type: string,
                      enum: [created, enriched, unchanged, superseded],
                    }
                  revocation:
                    type: object
                    description: >
                      P4-13, a revocation: its record hash (the record route's path), the target
                      and replacement record hashes, `kid` on a dry run, and whether this submit
                      stored it (`stored`).
                    properties:
                      sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                      kid: { type: string }
                      target: { type: string, pattern: "^[0-9a-f]{64}$" }
                      replacement:
                        { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
                      kind:
                        {
                          type: string,
                          enum: [delegation],
                          description: "P4-19: present when the target is a delegation.",
                        }
                      stored: { type: boolean }
                  delegation:
                    type: object
                    description: >
                      P4-19, a delegation: its record hash, the content kid a delegated record
                      carries (`pkd1-<sha256>`), scope, `seq`, effective types, window, and
                      whether this submit stored it.
                    properties:
                      sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                      kid: { type: string, pattern: "^pkd1-[0-9a-f]{64}$" }
                      deliverable: { type: string }
                      seq: { type: integer }
                      types: { type: array, items: { type: string } }
                      issuedAt: { type: integer }
                      expiresAt: { type: integer }
                      stored: { type: boolean }
                  descriptorSha256:
                    type: string
                    description: A descriptor submit's (absent for a pack release).
                  staged:
                    type: array
                    items: { type: string }
                    description: "P4-02, a pack release: the keys its own ticket promoted."
                  files:
                    type: integer
                    description: "P4-02, a pack dry run: how many file blobs the indexes named."
                  planned:
                    {
                      type: [object, "null"],
                      description: "`dryRun` only: the rows that would be written.",
                    }
                  unverified:
                    type: array
                    items: { type: string }
                    description: "`dryRun` only: storage keys of ticket objects not yet uploaded, judged as if they were."
                  warnings:
                    type: array
                    items: { type: string }
                    description: "P4-20, a pack release: `removes` ids the previous record never provided or this one still provides."
                  contentInterface:
                    type: object
                    description: "P4-20, an app submit that carried `contentInterface`: it, and the channel's current app release (`previous`, null when none)."
                    required: [sha256, previous]
                    properties:
                      sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                      previous:
                        type: [object, "null"]
                        required: [releaseId, version, contentApi, sha256]
                        properties:
                          releaseId: { type: string }
                          version: { type: string }
                          contentApi: { type: [integer, "null"] }
                          sha256:
                            {
                              type: [string, "null"],
                              pattern: "^[0-9a-f]{64}$",
                            }
                  record:
                    type: object
                    description: >
                      P3-03, when the submit carried a record: its `sha256` (the record route's
                      path) and `kid` on a dry run; otherwise the release's stored record and
                      whether it is this submit's (`stored`).
                    properties:
                      sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                      kid: { type: string }
                      stored: { type: boolean }
                  packSets:
                    type: object
                    description: >
                      P4-12, when the product resolves pack sets: what this release does to them.
                      `sets` are the resulting distinct sets (by `packSetId` and `unsatisfied`),
                      each with the selectors that resolve to it and the app releases that
                      receive it; `changed` lists every selector whose `packSetId` moved
                      (`null` for a selector that appears or disappears).
                    required: [sets, changed]
                    properties:
                      sets:
                        type: array
                        items:
                          type: object
                          required:
                            [
                              packSetId,
                              packs,
                              unsatisfied,
                              selectors,
                              appReleases,
                            ]
                          properties:
                            packSetId: { type: string }
                            packs:
                              type: array
                              items:
                                type: object
                                required: [pack, version, sha256]
                                properties:
                                  pack: { type: string }
                                  version: { type: string }
                                  sha256:
                                    { type: string, pattern: "^[0-9a-f]{64}$" }
                            unsatisfied:
                              type: array
                              items:
                                type: object
                                required: [pack, reason, detail]
                                properties:
                                  pack: { type: string }
                                  reason:
                                    type: string
                                    enum:
                                      [
                                        no-release,
                                        content-api,
                                        engine,
                                        variant,
                                        content-floor,
                                        dependency,
                                        conflict,
                                      ]
                                  detail: { type: string }
                            selectors:
                              type: array
                              items:
                                { $ref: "#/components/schemas/PackSetSelector" }
                            appReleases:
                              type: array
                              items: { type: string }
                      changed:
                        type: array
                        items:
                          allOf:
                            - { $ref: "#/components/schemas/PackSetSelector" }
                            - type: object
                              required: [before, after]
                              properties:
                                before: { type: [string, "null"] }
                                after: { type: [string, "null"] }
              examples:
                created:
                  summary: test/publishRoutes.test.ts
                  value:
                    {
                      ok: true,
                      dryRun: false,
                      releaseId: app@1.3.0,
                      outcome: created,
                      descriptorSha256: "6f1c…",
                    }
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiRefusal" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "409": { $ref: "#/components/responses/CiRefusal" }

  /{product}/release/records/{sha256}:
    get:
      operationId: getReleaseRecord
      tags: [release]
      summary: A CI-signed release record, by its SHA-256
      description: >
        P3-03 (WIRE-CONTRACT-V4 §2.4–§2.5). The stored `pkey-release+jws` exactly as CI signed
        it, so the lowercase hex SHA-256 of the body equals the path: a client checks that hash
        before any signature work, then verifies the record against the release keys its binary
        pins (never the product trust set). `ETag` is the quoted hash; `If-None-Match` answers
        304; `HEAD` returns the same headers. Governed by the release METADATA access mode:
        `public` answers anyone with `public, max-age=31536000, immutable, no-transform`;
        otherwise `private, no-store, no-transform`. The mode's request-level check runs first
        (under `entitled` it proves only a usable licence); an unknown hash is then the plain
        404, so the route is no oracle for which records exist; under `entitled` the licence's
        version window must also admit the record's own release (its stored version, pinned —
        the byte blob route's rule). Discovery advertises it as `release.endpoints.record`.
        A `kind: pack` record (P4-02) and a `kind: revocation` record (P4-13) skip that version
        rule: the request-level check governs. A revocation record is served by its hash too,
        and only the CURRENT revocation of a target is stored: one superseded by a newer
        revocation is the plain 404 (the feed lists the current one). P4-19: a `kind: delegation`
        record, and the current revocation of a delegation, are served by their hashes the same
        way (the request-level check governs); a delegated pack record names its delegation in
        its kid (`pkd1-<hash>`), and the device fetches the delegation here.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: sha256
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: "The compact JWS, `application/jose`."
          content:
            application/jose:
              schema: { type: string }
        "304":
          description: Not modified (`If-None-Match`).
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429":
          description: The record rate limit — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
    options:
      operationId: preflightGetReleaseRecord
      tags: [release]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { name: sha256, in: path, required: true, schema: { type: string } }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  # ── update ────────────────────────────────────────────────────────────────────
  /{product}/update/appcast.xml:
    get:
      operationId: getAppcast
      tags: [update]
      summary: The Sparkle appcast (default channel)
      description: >
        The `stable` channel's feed, forced server-side regardless of what the caller asks
        for. Exactly one `<item>` — the newest matching release — carrying
        `sparkle:version`, `sparkle:shortVersionString`, an optional
        `sparkle:minimumSystemVersion`, an optional CDATA `<description>` holding the curated
        changelog summary, and an `<enclosure>` whose `url` points back at
        `/{product}/release/dl/…` (the permanent alias of `/{product}/distribution/dl/…`).
        `sparkle:edSignature` is present only when a verified sidecar signature exists and is
        omitted entirely otherwise. Gated by the `app` deliverable's DELIVERY access
        (Distribution's `dist_access`, P2b-04 — the same answer the download behind each
        enclosure enforces), not the metadata mode, so a product can leave `/update/version`
        public while closing the feed.


        EXTENDED (P3-09) for a product that publishes CI-signed release records: the feed is
        then rendered from the records and Distribution's per-outlet state, as every app-updater
        feed is — up to three releases with a macOS build for `?arch=` (a universal DMG serves
        both architectures; `?outlet=` picks a `direct` outlet), `sparkle:version` the build
        number, `sparkle:hardwareRequirements` `arm64` for an Apple-silicon-only build,
        `sparkle:criticalUpdate` (with no attribute for the channel's critical pointer release;
        with `sparkle:version` = the floor's build number for a release above the channel floor),
        `sparkle:phasedRolloutInterval` while the direct outlet's rollout on this channel is
        active (only the channel's own rollout row phases; an active rollout of `bp` opens
        `ceil(bp × 7 / 10000)` of Sparkle's seven groups and holds them,
        by a one-year interval and a backdated `pubDate`), and `<sparkle:deltas>` from delta
        artifacts that name their `deltaFrom`. A paused or halted rollout, or a yank, serves the
        previous release. Enclosures are the immutable `/distribution/files/…` URLs (on the
        bytes host), and every `sparkle:edSignature` is CI's sidecar, verified over the stored
        bytes; an enclosure whose signature does not verify is left out. A strong `ETag`
        answers `If-None-Match` with 304. A product with no release record keeps the legacy
        feed above, byte for byte.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/Arch" }
      responses:
        "200":
          description: "Appcast XML. `application/xml; charset=utf-8`, `cache-control: public, max-age=300`."
          content:
            application/xml:
              schema: { type: string }
              examples:
                stable:
                  summary: test/updateFeed.test.ts (inline snapshot, trimmed)
                  value: |
                    <?xml version="1.0" encoding="utf-8"?>
                    <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
                      <channel>
                        <title>djdl</title>
                        <link>https://key.plrs.im</link>
                        <item>
                          <title>djdl 1.2.3</title>
                          <pubDate>Fri, 02 Jan 2026 03:04:05 GMT</pubDate>
                          <sparkle:version>1.2.3</sparkle:version>
                          <sparkle:shortVersionString>1.2.3</sparkle:shortVersionString>
                          <description><![CDATA[Faster exports and a fix for the queue.]]></description>
                          <enclosure url="https://key.plrs.im/djdl/release/dl/1.2.3/djdl-1.2.3-arm64.dmg" type="application/octet-stream" length="4096" />
                        </item>
                      </channel>
                    </rss>
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/ReleaseRateLimited" }
        "503": { $ref: "#/components/responses/UpstreamRateLimited" }
    options:
      operationId: preflightGetAppcast
      tags: [update]
      summary: CORS preflight
      description: >
        Browser preflight for a page on one of the product's `web.origins`. Answered
        before service dispatch, so the result never depends on whether the service
        behind this path is enabled. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }
  /{product}/update/{channel}/appcast.xml:
    get:
      operationId: getChannelAppcast
      tags: [update]
      summary: The Sparkle appcast for a channel
      description: >
        Identical to the default feed except that `{channel}` selects the release stream and
        appears in the channel `<title>` as `<binary> (<channel>)`. `staging` is the legacy
        alias of `beta` and serves the beta release (keeping its own spelling in the title and
        the enclosure) unless the product declares a manual channel named `staging`, which
        wins. Under the `entitled`
        access mode this is where a stable-only license is refused a beta feed — 403
        `channel_not_allowed`, with no `allowedRange`. `arch` is part of the edge-cache key,
        so the two architectures never share a cached body. Extended for a product that
        publishes release records exactly as the default feed is (P3-09).
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/Channel" }
        - { $ref: "#/components/parameters/Arch" }
      responses:
        "200":
          description: "Appcast XML. `application/xml; charset=utf-8`, `cache-control: public, max-age=300`."
          content:
            application/xml:
              schema: { type: string }
              examples:
                beta:
                  summary: x86_64 enclosure, channel-titled (test/updateFeed.test.ts)
                  value: |
                    <?xml version="1.0" encoding="utf-8"?>
                    <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
                      <channel>
                        <title>djdl (beta)</title>
                        <link>https://key.plrs.im</link>
                        <item>
                          <title>djdl 1.2.3</title>
                          <pubDate>Fri, 02 Jan 2026 03:04:05 GMT</pubDate>
                          <sparkle:version>1.2.3</sparkle:version>
                          <sparkle:shortVersionString>1.2.3</sparkle:shortVersionString>
                          <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                          <enclosure url="https://key.plrs.im/djdl/release/dl/1.2.3/djdl-1.2.3-x86_64.dmg" type="application/octet-stream" length="5120" />
                        </item>
                      </channel>
                    </rss>
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/ReleaseRateLimited" }
        "503": { $ref: "#/components/responses/UpstreamRateLimited" }
    options:
      operationId: preflightGetChannelAppcast
      tags: [update]
      summary: CORS preflight
      description: >
        Browser preflight for a page on one of the product's `web.origins`. Answered
        before service dispatch, so the result never depends on whether the service
        behind this path is enabled. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/Channel" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }
  /{product}/update/{channel}/feed.jws:
    get:
      operationId: getChannelFeed
      tags: [update]
      summary: The signed channel feed (pkey-feed+jws)
      description: >
        P3-03 (WIRE-CONTRACT-V4 §2.3). The device-less `pkey-feed+jws` for one channel, signed
        with the product key: per platform, the release target (pinning a CI-signed release
        record by hash, `seq` and version), that platform's floor (a prompt, never a block),
        `critical`, and an entry per live outlet of the platform (keyed by outlet id, with its
        `kind`, the newest release `live` there, `halted`, a client-evaluated `rollout`, a store
        `listingUrl` and any operator-narrowed `capabilities`). Every caller of a channel gets
        the same bytes. The `channel` claim is the CANONICAL channel (`latest` → `stable`;
        `staging` → `beta` unless the product declares a manual `staging`), which keys the
        client's `seq` floor. `seq` is shared by every selector of the channel and moves only
        when the composed content changes; `expiresAt = issuedAt + 900`; a stored copy is
        re-signed once it is 450 s old. A channel that has never offered a target is signed at
        the starting `seq` (1, or the ceiling after a `feed:seq-ceiling` recovery) with empty
        `targets`, and nothing is stored for it. The channel-wide document (`selector: {}`) is served
        while its payload fits 65 536 bytes, else the per-platform one (`selector:
        {platform}`); a document that fails the composer's self-check (the v4 claims and the
        strict JSON profile) or does not fit is never signed: `500 feed_not_composable`.
        P4-13 (plans/P4-13.md §2.2, §6.3): the document may carry the content members
        `packSets` (the resolved pack sets of the app's live levels: a release table by record
        hash, sets keyed by `packSetId`, one row per (contentApi, platform, engine, variant
        group), and per-outlet `pinned` narrowing), `packFloors` (per pack and live level) and
        `revocations` (the revocation records in force, by hash, with their targets). Clients
        read them beside the claims (`feedContent`); a malformed member is unusable, never a
        refusal. When the per-platform document is still over the cap, content is shed in a
        fixed order, each step audited: `packSets`, `packFloors`, the unreferenced revocations,
        every revocation; content alone never causes `feed_not_composable`. P4-19: a revocation of
        a delegation is listed with `kind: delegation` and `pack` = the delegation's scope root;
        it counts as referenced, so it is kept under the 64-entry cap and at the third shedding
        step, and leaves only when `revocations` is omitted. P4-29 (plans/P4-29.md §2.2, §6):
        the document may carry `deltas`, the delta menu: target payload SHA-256 → up to 4
        `payload`-scope `zstd-patch-from` deltas to it (`{from, method, scope, memBytes,
        artifact {sha256, bytes}}`, at most 64 in all), the ready lazy deltas of the pack
        records the document names (its `packSets` releases and its targets' pins and holds),
        ranked by the base's installed devices. Listed only while the deployment's `LAZY_DELTAS`
        is `on` and the product is opted in; the menu is added after the document is chosen and
        shed, only into the room left under the cap, lowest-ranked entries trimmed first
        (audited), so it never changes the document or sheds a content member. Clients read it
        with `feedContent`; every byte it produces is checked against the CI-signed record.
        Governed by the release METADATA access mode; under `entitled` the licence's
        entitlements must hold the canonical channel (403 `channel_not_allowed`). `public`
        caches `public, max-age=60, no-transform`, every other mode `private, no-store,
        no-transform`. An unknown channel, or a missing or unknown `platform`, is the plain
        404. Discovery advertises it as `update.endpoints.feed`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/Channel" }
        - name: platform
          in: query
          required: true
          schema:
            { type: string, enum: [macos, ios, android, windows, linux, web] }
      responses:
        "200":
          description: "The compact JWS, `application/jose`."
          content:
            application/jose:
              schema: { type: string }
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429":
          description: The feed rate limit — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "500":
          description: "`feed_not_composable` — nothing was signed; keep deciding from the committed feed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
    options:
      operationId: preflightGetChannelFeed
      tags: [update]
      summary: CORS preflight
      description: >
        Browser preflight for a page on one of the product's `web.origins`. Answered
        before service dispatch, so the result never depends on whether the service
        behind this path is enabled. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/Channel" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }
  /{product}/update/{channel}/winsparkle.xml:
    get:
      operationId: getWinSparkleAppcast
      tags: [update]
      summary: The WinSparkle appcast for a channel
      description: >
        P3-09 (README §3.6, notes/E3 §A3.2). A Sparkle-format appcast for Windows installer
        builds, one URL per channel (WinSparkle has no channels): up to three releases with a
        stored release record, newest first, each one `<item>` with one `<enclosure>` per
        Windows installer build (`.exe` / `.msi` payloads only — WinSparkle runs what it
        downloads), x64 first, each with `sparkle:os` (`windows-x64`, `windows-arm64`,
        `windows`), `sparkle:version` (the build number) and `sparkle:shortVersionString` on
        the enclosure, `sparkle:installerArguments` from the build format (`msi` → `/passive`,
        `inno` → `/SILENT /SP- /NOICONS`, `nsis` → `/S`), and CI's sidecar
        `sparkle:edSignature`, verified over the stored bytes (an enclosure whose signature
        does not verify is left out, as on the appcast). No rollout concept: a release whose
        rollout on the outlet is not complete is held back and the previous one listed; a yank
        or halt removes a release at once. `?outlet=` picks a `direct` outlet. Governed by the
        app's delivery access, like the appcast; `public` caches `public, max-age=300`, every
        other mode `private, no-store`. Strong `ETag`, 304 on `If-None-Match`. Discovery:
        `update.endpoints.winsparkle`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/Channel" }
        - name: outlet
          in: query
          required: false
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
      responses:
        "200":
          description: "Appcast XML, `application/xml; charset=utf-8`."
          content:
            application/xml:
              schema: { type: string }
        "304": { description: Not modified. }
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429":
          description: The feed rate limit — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
  /{product}/update/{channel}/velopack/releases.{velopackChannel}.json:
    get:
      operationId: getVelopackFeed
      tags: [update]
      summary: The Velopack feed for a channel
      description: >
        P3-09 (notes/E3 §A3.1). Velopack's `releases.<channel>.json` for an app packed with
        `vpk pack --channel <velopackChannel>`, served under the Polaris channel's base URL
        (`…/update/{channel}/velopack/`). The Velopack channel's first token is the OS (`win`,
        `osx`, `linux`), the second, when it is `x64` or `arm64`, the architecture; else the
        client's `?arch=` (Velopack appends it), else x64. Velopack's other parameters (`os`,
        `rid`, `id`, `localVersion`) are ignored and key nothing. `Assets` lists the newest
        release's `-full.nupkg` payload (`Type: Full`) and the `-delta.nupkg` delta artifacts
        (`Type: Delta`) of up to ten releases with a stored record, newest first (Velopack
        applies deltas to the full package it holds, so older full packages are not listed):
        `PackageId` from the package file name, `Version`, `FileName` as the BARE package file
        name (Velopack's Rust core saves to `packages_dir.join(FileName)`, so a URL there fails
        the local write; the client resolves the name against this feed's URL, which lands on
        `getVelopackPackage`), `SHA256` from the record, `SHA1` computed by a streaming digest over
        the stored bytes (which also checks the recorded SHA-256) and memoised, `Size`, and the
        release notes. No rollout concept: the previous release until a rollout completes.
        Access, caching and `ETag` as the WinSparkle appcast. Discovery:
        `update.endpoints.velopack`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/Channel" }
        - name: velopackChannel
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        - name: arch
          in: query
          required: false
          schema: { type: string }
        - name: outlet
          in: query
          required: false
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
      responses:
        "200":
          description: '`{"Assets": [...]}`, `application/json; charset=utf-8`.'
          content:
            application/json:
              schema:
                type: object
                required: [Assets]
                properties:
                  Assets:
                    type: array
                    items:
                      type: object
                      required:
                        [PackageId, Version, Type, FileName, SHA1, SHA256, Size]
                      properties:
                        PackageId: { type: string }
                        Version: { type: string }
                        Type: { type: string, enum: [Full, Delta] }
                        FileName:
                          type: string
                          pattern: "^(?!.*\\.\\.)[A-Za-z0-9][A-Za-z0-9._+-]{0,199}\\.nupkg$"
                          description: >
                            The bare package file name, never a URL or a path; fetched from
                            `…/velopack/{FileName}`.
                        SHA1: { type: string, pattern: "^[0-9A-F]{40}$" }
                        SHA256: { type: string, pattern: "^[0-9A-F]{64}$" }
                        Size: { type: integer, minimum: 0 }
                        NotesMarkdown: { type: string }
                        NotesHTML: { type: string }
        "304": { description: Not modified. }
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429":
          description: The feed rate limit — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
  /{product}/update/{channel}/velopack/{fileName}:
    get:
      operationId: getVelopackPackage
      tags: [update]
      summary: A package the Velopack feed lists, by its file name
      description: >
        notes/S-11 §5.1. Where a Velopack client fetches a package: the feed names each one by
        its bare `FileName`, and the client resolves that against the feed URL
        (`…/velopack/releases.<velopackChannel>.json` → `…/velopack/<FileName>`). Answers `302`
        to the package's immutable delivery URL (`…/distribution/files/<releaseId>/<name>`, on
        the bytes host when one is configured), which enforces the delivery access again on its
        own. The lookup is the feed's own selection, for every Velopack target (`win`, `osx`,
        `linux` × x64, arm64): the newest release's `-full.nupkg` and the descriptor-named
        `-delta.nupkg` files of up to ten releases with a stored record, and only one whose
        stored bytes give the feed's `SHA1`. Anything the feed does not list is 404. Access is
        the feed's: the app's delivery access, the same refusals (`401`/`403`), the same
        `updateFeed` rate limit; `public` caches `public, max-age=300`, every other mode
        `private, no-store`. A `fileName` outside the pattern (a separator, `..`, a leading dot,
        an escape, any other character, or another extension) is 404 before any read. A client
        need not resend `Authorization` across the redirect (notes/S-11 §5.2: the measured
        updaters drop it cross-origin), so under a non-public delivery the second hop may be
        refused; public delivery is the measured Velopack path.
      security: [{}, { deviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/Channel" }
        - name: fileName
          in: path
          required: true
          description: >
            A `FileName` from the feed: one segment, `vpk`'s `<packId>-<version>[-<channel>]-full.nupkg`
            or `-delta.nupkg`. A name starting `releases.` is the feed, not a package.
          schema:
            type: string
            pattern: "^(?!.*\\.\\.)[A-Za-z0-9][A-Za-z0-9._+-]{0,199}\\.nupkg$"
        - name: outlet
          in: query
          required: false
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
      responses:
        "302":
          description: The package's immutable delivery URL, in `Location`. No body.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429":
          description: The feed rate limit — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
  /{product}/update/{channel}/app.appinstaller:
    get:
      operationId: getAppInstallerFile
      tags: [update]
      summary: The MSIX App Installer file for a channel
      description: >
        P3-09 (notes/E3 §A2). An `.appinstaller` in the 2021 schema for the newest release with
        a stored record whose MSIX payload (`.msixbundle`, `.appxbundle`, `.msix`, `.appx`) the
        `app-installer` outlet delivers: `Uri` is EXACTLY the URL served (App Installer re-polls
        it), so the route reads at most ONE query pair — `?arch=x64|arm64` or `?outlet=<id>` —
        and both together are 404; the main package (a `MainBundle` for a bundle, else a
        `MainPackage` with its `ProcessorArchitecture`) names the outlet's identity — the
        `<Name>` of `packageFamilyName` and `publisher` from `.pkey/distribution` (an outlet
        without both has no file) — the build's four-part version (a four-part build number,
        else `major.minor.patch.0`), and the immutable, Range-capable distribution URL; and
        `<UpdateSettings>` carries `OnLaunch` (`HoursBetweenUpdateChecks`, `ShowPrompt`,
        `UpdateBlocksActivation`) and `AutomaticBackgroundTask` as the outlet's
        `updateSettings` declare them. No rollout concept: the previous release until a rollout
        on the outlet completes. Access, caching and `ETag` as the WinSparkle appcast. Discovery:
        `update.endpoints.appInstaller`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/Channel" }
        - name: arch
          in: query
          required: false
          schema: { type: string, enum: [x64, x86_64, arm64] }
        - name: outlet
          in: query
          required: false
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
      responses:
        "200":
          description: "App Installer XML, `application/appinstaller`."
          content:
            application/appinstaller:
              schema: { type: string }
        "304": { description: Not modified. }
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429":
          description: The feed rate limit — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
  /{product}/update/{channel}/{buildId}.AppImage.zsync:
    get:
      operationId: getAppImageZsync
      tags: [update]
      summary: The stable per-channel zsync control file of an AppImage build
      description: >
        P3-09 (notes/E3 §B1). The URL an AppImage embeds as its update information
        (`zsync|<this URL>`), constant across versions: `{buildId}` is the artifact-map id of
        a Linux build whose payload is an `.AppImage`. The body is CI's `<AppImage>.zsync`
        control file of the newest release with a stored record (checked against its recorded
        SHA-256, at most 16 MiB) with its `URL:` header rewritten to the current AppImage's
        absolute, immutable, Range-capable distribution URL; its `Length:` must equal the
        AppImage's size or there is no file. The checksum blocks are passed through unchanged.
        `application/x-zsync` (the type zsync's tooling and AppImageUpdate use). No rollout
        concept: the previous release until a rollout completes. Access, caching and `ETag` as
        the WinSparkle appcast. Discovery: `update.endpoints.zsync`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/Channel" }
        - name: buildId
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
        - name: outlet
          in: query
          required: false
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
      responses:
        "200":
          description: "The control file, `application/x-zsync`."
          content:
            application/x-zsync:
              schema: { type: string, format: binary }
        "304": { description: Not modified. }
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429":
          description: The feed rate limit — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
  /{product}/update/version:
    get:
      operationId: getLatestVersion
      tags: [update]
      summary: Latest-version check
      description: >
        The newest release on the requested channel (default `stable`), as three strings.
        `?channel=` accepts the same vocabulary as a channel appcast path segment — held to
        the same `[a-z0-9-]` alphabet, refused 404 beyond it, resolved 404 for a well-formed
        unknown name — and the entitled gate evaluates it exactly as it does a path channel.
        Without `?platform=`, `?arch=` is accepted and discarded: the answer names a release,
        not an asset. Gated by the METADATA access mode, which is why a product can leave this
        open while closing its appcasts. `version` is the tag with one leading `v` stripped; `tag` is
        GitHub's verbatim.


        EXTENDED (P3-09) when the request names `?platform=` (optionally with `?arch=`,
        `?outlet=` or `?build=`), for a product that publishes release records: the answer is
        the newest release with a stored record that the outlet (default `direct`; `?outlet=`
        names any self-hosted outlet) delivers for that platform, by the same rules as every
        app-updater feed — yanks removed, a release whose rollout on the outlet is not complete
        held back — with one build of it (the exact `?arch=` over a universal build, or the
        `?build=` artifact-map id). It keeps `version`, `tag` (the release's tag; `null` for a
        tagless descriptor release) and `url` (its GitHub release page, else the download URL)
        and adds `build`, `sha256`, `size`, `downloadUrl` (immutable, on the bytes host),
        `minOS` and `critical` (the channel's critical pointer release). Documented here only:
        no SDK reads the extended fields (they read the v3 three in `check()` and the signed
        feed for everything else). Without `?platform=`, or for a product with no record, the
        answer is the legacy one above (`?arch=`, `?outlet=` and `?build=` alone are discarded).
        With records, an unknown `?platform=` or no matching recorded build is 404.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: channel
          in: query
          required: false
          description: "Channel to check (default stable): stable, beta (staging is its legacy alias), pr-<n>, or a manifest-declared manual channel."
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
        - name: platform
          in: query
          required: false
          description: "P3-09: the platform of the extended answer."
          schema:
            { type: string, enum: [macos, ios, android, windows, linux, web] }
        - name: arch
          in: query
          required: false
          description: "P3-09: prefer a build of this arch (a universal build also matches)."
          schema: { type: string }
        - name: outlet
          in: query
          required: false
          description: "P3-09: a self-hosted outlet id (default `direct`)."
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
        - name: build
          in: query
          required: false
          description: "P3-09: one artifact-map build id."
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
      responses:
        "200":
          description: "Version info. `cache-control: public, max-age=120`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionCheck" }
              examples:
                latest:
                  summary: test/release.test.ts
                  value:
                    version: 1.9.0
                    tag: v1.9.0
                    url: https://github.com/acme/djdl/releases/tag/v1.9.0
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/ReleaseRateLimited" }
        "503": { $ref: "#/components/responses/UpstreamRateLimited" }
    options:
      operationId: preflightGetLatestVersion
      tags: [update]
      summary: CORS preflight
      description: >
        Browser preflight for a page on one of the product's `web.origins`. Answered
        before service dispatch, so the result never depends on whether the service
        behind this path is enabled. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  # ── identity ──────────────────────────────────────────────────────────────────
  /{product}/identity/session:
    get:
      operationId: getBrowserSession
      tags: [identity]
      summary: The browser session's fused document
      description: >
        Cookie-authenticated (`pkey_<product>_session`); the build gate also enforces here.


        This is the ONE surface still serving the FUSED v2 shape — licence claims, config,
        secrets and entitlements in a single `doc` — because the React SDK migrates against
        whatever this route serves, in its own wave. It is plain JSON, NOT a JWS: nothing on
        this path is signed, so there is no `typ`, no `ETag` and no 304. `payload.secrets`
        is ALWAYS `{}`; a browser is not a secret-delivery target.


        There is no 401 on this route, ever. An absent, unknown or dead session is a 200 with
        `{"authenticated": false, "doc": null}` — the page decides what to render. A build-gate
        refusal is also a 200: `authenticated` stays true, `doc` goes null, and `blocked`
        carries the hyphenated `reason` plus, for a version block only, `allowedRange`.
        `csrfToken` is present on both authenticated bodies and is what `POST
        /identity/auth/logout` demands back in `X-CSRF-Token`.
      security: [{ browserSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/VersionHeader" }
        - { $ref: "#/components/parameters/ChannelHeader" }
      responses:
        "200":
          description: Session document — or the unauthenticated/blocked forms of it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSessionResponse" }
              examples:
                anonymous:
                  summary: No cookie, unknown session, or a dead device (test/browserSession.test.ts)
                  value: { authenticated: false, doc: null }
                signedIn:
                  summary: The fused document
                  value:
                    authenticated: true
                    csrfToken: csrf_7hK2mQ0xZ
                    doc:
                      schemaVersion: 1
                      aud: djdl
                      iss: key.plrs.im
                      licenseId: lic_djdl_1
                      deviceId: browser:lic_djdl_1
                      issuedAt: 1756252800
                      expiresAt: 1756256400
                      graceUntil: 1758844800
                      profile:
                        name: Ada Lovelace
                        firstName: Ada
                        email: ada@example.com
                        activatedAt: 1690000000
                      payload:
                        config:
                          app.theme:
                            {
                              state: enforced,
                              value: dark,
                              updatedAt: 1756252800,
                            }
                        secrets: {}
                        entitlements:
                          polarisVpn:
                            {
                              state: enforced,
                              value: true,
                              updatedAt: 1756252800,
                            }
                blocked:
                  summary: The build gate refused this page's version
                  value:
                    authenticated: true
                    doc: null
                    blocked:
                      reason: version-too-old
                      allowedRange: { min: "2.0.0", max: "99.0.0" }
                    csrfToken: csrf_7hK2mQ0xZ
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500":
          description: >
            The active catalog could not validate the payload — LEGACY FLAT. Fails closed:
            a broken catalog row withholds the document rather than widening it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                catalogUnavailable:
                  summary: test/browserSession.test.ts
                  value:
                    {
                      error: catalog_unavailable,
                      message: active catalog could not validate the config payload,
                    }
  /{product}/identity/session/license:
    post:
      operationId: sessionFromLicenseKey
      tags: [identity]
      summary: Mint a browser session from a license key
      description: >
        Exchanges a `pkey_<product>_…` key for the session cookie, for products whose portal
        offers key entry beside (or instead of) OIDC. The key may be sent as the body field
        `key` or, if that is absent, as `Authorization: Bearer`. Success is 201, not 200, and
        the body is only `{"ok": true}` — the payload is the `Set-Cookie`. Seat accounting
        applies: a browser session takes a seat like any other device, so an exhausted pool
        is a 403 `device_limit` carrying `limit` and `deviceCount` at the top level. All
        errors are LEGACY FLAT.
      parameters: [{ $ref: "#/components/parameters/Product" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionFromLicenseRequest" }
            examples:
              key:
                summary: test/browserSession.test.ts
                value: { key: pkey_djdl_4Sc9ItiFEQMbGXeAbXVdIw }
      responses:
        "201":
          description: >
            Session established. The body is `{"ok": true}`; the cookie is the point.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResult" }
              examples:
                established: { value: { ok: true } }
        "400":
          description: Unparseable body — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                invalidBody:
                  { value: { error: bad_request, message: invalid body } }
        "401": { $ref: "#/components/responses/LegacyUnauthorized" }
        "403":
          description: The license's seat pool is exhausted — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                deviceLimit:
                  {
                    value:
                      {
                        error: device_limit,
                        message: device limit reached,
                        limit: 5,
                        deviceCount: 5,
                      },
                  }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429":
          description: 30 attempts per 60 s per client IP — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                limited:
                  {
                    value:
                      {
                        error: rate_limited,
                        message: too many session attempts,
                      },
                  }
  /{product}/identity/auth/start:
    get:
      operationId: authStart
      tags: [identity]
      summary: Begin browser OIDC (PKCE) — 302 to the IdP
      description: >
        Mints the flow record and redirects to the IdP's `/authorize` with
        `response_type=code`, `client_id`, `redirect_uri`, `scope=openid email profile groups`,
        `state`, `nonce`, `code_challenge` and `code_challenge_method=S256`. The
        `redirect_uri` is computed in exactly one place —
        `<origin>/<product>/identity/auth/callback` — and must appear in the product's
        allow-list or the request is a 400. An optional `return_to` marks this as the BROWSER
        flow (the callback will 302 back and set the cookie); omitting it marks the
        device/CLI flow (the callback renders the "you're signed in" page instead).
        `return_to` must be same-origin. All errors are LEGACY FLAT.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: return_to
          in: query
          required: false
          description: >
            Where to send the browser after the callback. Must parse as a URL whose origin
            equals this request's origin; anything else is a 400. Its presence is what
            selects the browser flow over the device flow.
          schema: { type: string, format: uri }
      responses:
        "302":
          description: Redirect to the IdP authorize endpoint.
          headers:
            Location:
              description: The IdP `/authorize` URL with the PKCE parameters.
              schema: { type: string, format: uri }
              example: https://id.example/authorize?response_type=code&client_id=client-djdl&redirect_uri=https%3A%2F%2Fkey.plrs.im%2Fdjdl%2Fidentity%2Fauth%2Fcallback&scope=openid+email+profile+groups&state=s3&nonce=n1&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256
        "400":
          description: An unusable `return_to` or a non-allow-listed redirect URI — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                crossOriginReturn:
                  {
                    value:
                      { error: bad_request, message: return_to not allowed },
                  }
                redirectNotAllowListed:
                  {
                    value:
                      {
                        error: bad_request,
                        message: redirect_uri not allow-listed,
                      },
                  }
        "404":
          description: The product has no OIDC configuration — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                disabled:
                  { value: { error: disabled, message: oidc is disabled } }
        "429":
          description: 60 starts per 60 s per client IP — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                limited:
                  { value: { error: rate_limited, message: too many requests } }
        "500":
          description: >
            The stored OIDC configuration cannot be used — LEGACY FLAT, one code and several
            messages (an unpermitted issuer, an unsealable client secret, an unconfigured
            platform provider).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                missingCustom:
                  {
                    value:
                      {
                        error: misconfigured,
                        message: custom oidc config missing,
                      },
                  }
                issuerNotPermitted:
                  {
                    value:
                      {
                        error: misconfigured,
                        message: custom oidc issuer is not permitted,
                      },
                  }
                secretUnavailable:
                  {
                    value:
                      {
                        error: misconfigured,
                        message: oidc client secret unavailable,
                      },
                  }
  /{product}/identity/auth/callback:
    get:
      operationId: authCallback
      tags: [identity]
      summary: OIDC redirect URI
      description: >
        The single-use landing point for both flows. `state` is consumed on first use, so a
        replayed callback is an `unknown state` 400 rather than a second sign-in. Which
        response you get depends on how the flow STARTED: a flow with `return_to` (browser)
        answers 302 to that URL with the session `Set-Cookie`; a flow without one (device/CLI)
        answers 200 with a static, script-free HTML page telling the user to close the tab —
        the token is collected by polling, never by this response. All errors are LEGACY FLAT.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: code
          in: query
          required: true
          description: The IdP's authorization code.
          schema: { type: string }
        - name: state
          in: query
          required: true
          description: The flow id minted by `authStart`. Single-use.
          schema: { type: string }
      responses:
        "200":
          description: >
            Signed-in page (HTML) — the DEVICE/CLI branch, when the flow carried no
            `return_to`. `text/html; charset=utf-8`, `cache-control: no-store`, served under
            the strict script-free CSP.
          content:
            text/html:
              schema: { type: string }
              examples:
                signedIn:
                  summary: The page body, verbatim
                  value: '<!doctype html><meta charset=utf-8><title>Signed in</title><body style="font-family:system-ui;padding:3rem;text-align:center"><h1>You''re signed in</h1><p>You can close this tab and return to the app.</p>'
        "302":
          description: >
            The BROWSER branch — the flow carried a `return_to`, so the session cookie is set
            and the user is sent back where they came from.
          headers:
            Location:
              description: The `return_to` the flow was started with.
              schema: { type: string, format: uri }
              example: https://key.plrs.im/djdl/portal
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
        "400":
          description: Missing/replayed parameters, or a non-allow-listed redirect URI — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                missing:
                  { value: { error: bad_request, message: missing code/state } }
                unknownState:
                  summary: Absent, corrupt, or already consumed
                  value: { error: bad_request, message: unknown state }
        "401":
          description: >
            The id token did not verify, its nonce was absent or wrong, its `sub` was empty,
            or the license could not be attached — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                idTokenInvalid:
                  { value: { error: unauthorized, message: id token invalid } }
                licenseUnavailable:
                  {
                    value:
                      { error: unauthorized, message: license unavailable },
                  }
        "403":
          description: The identity verified but is not entitled to this product — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                notEntitled:
                  summary: test/oidcEdge.test.ts
                  value: { error: forbidden, message: not entitled }
                deviceLimit:
                  {
                    value:
                      {
                        error: device_limit,
                        message: device limit reached,
                        limit: 5,
                        deviceCount: 5,
                      },
                  }
        "429":
          description: >
            60 callbacks per 60 s per client IP AND 5 per 60 s per `state` — LEGACY FLAT. The
            per-state lane is what stops a captured code being ground against the exchange.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                limited:
                  { value: { error: rate_limited, message: too many requests } }
        "502":
          description: The IdP answered unusably — LEGACY FLAT, one code and three messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                exchangeFailed:
                  {
                    value:
                      { error: oidc_error, message: token exchange failed },
                  }
                responseInvalid:
                  {
                    value:
                      { error: oidc_error, message: token response invalid },
                  }
                noIdToken:
                  { value: { error: oidc_error, message: no id_token } }
  /{product}/identity/auth/poll:
    get:
      operationId: authPoll
      tags: [identity]
      summary: Poll a browser sign-in flow
      description: >
        Polls a sign-in flow by `state` for the device token. Both query parameters are
        required. Only a flow bound to a device id can complete, and a flow begun by
        `authDeviceStart` never completes here: it answers `error` and redeems only on
        `authDevicePoll`, with the secret device code, because `state` rides on the authorize
        URL the user-code confirmation page hands to anyone holding the public user code.
        Four terminal-or-not states, all at HTTP 200: `pending` (nothing confirmed yet),
        `ready` (with the minted `pkeyt_` token), `timeout` (the flow record is gone —
        including immediately after a `ready`, which deletes it), and `error`. `error`
        deliberately carries NO reason: an unauthenticated poller learns that it failed, not
        why.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: state
          in: query
          required: true
          description: The flow id returned by `authStart`.
          schema: { type: string }
        - name: device
          in: query
          required: true
          description: The device id the flow was started for. A mismatch answers `error`.
          schema: { type: string }
      responses:
        "200":
          description: Flow state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthFlowState" }
              examples:
                pending: { value: { status: pending } }
                ready:
                  summary: test/oidcEdge.test.ts
                  value:
                    status: ready
                    token: pkeyt_Zk8LqR8nT0sYp2vcEgHj6Bf3QdNwXr7uKmA1sVe9tYo
                    schemaVersion: 1
                timeout:
                  summary: The very next poll after a `ready`
                  value: { status: timeout }
                error:
                  summary: No `reason` field, deliberately (D8)
                  value: { status: error }
        "400":
          description: Missing `state` or `device` — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                missing:
                  {
                    value:
                      { error: bad_request, message: missing state/device },
                  }
        "429":
          description: 120 polls per 60 s per client IP AND 40 per 60 s per `state` — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                limited:
                  { value: { error: rate_limited, message: too many requests } }
    options:
      operationId: preflightAuthPoll
      tags: [identity]
      summary: CORS preflight
      description: >
        Browser preflight for a page on one of the product's `web.origins`. Answered
        before service dispatch, so the result never depends on whether the service
        behind this path is enabled. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }
  /{product}/identity/auth/logout:
    post:
      operationId: authLogout
      tags: [identity]
      summary: End the browser session
      description: >
        Deletes the session record and clears the cookie. Takes no body; it takes the session
        cookie plus the `X-CSRF-Token` header, whose value is the `csrfToken` from
        `GET /identity/session`. Note the shape of the CSRF check: it runs only when a session
        actually exists, so logging out with no session is a plain 200 with the clear-cookie
        rather than a 403.
      security: [{ browserSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: X-CSRF-Token
          in: header
          required: true
          description: The `csrfToken` this session was issued by `GET /{product}/identity/session`.
          schema: { type: string, pattern: "^csrf_[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: Logged out. The cookie is cleared with `Max-Age=0`.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResult" }
              examples:
                loggedOut:
                  summary: test/browserSession.test.ts
                  value: { ok: true }
        "403":
          description: >
            A session exists but the CSRF header is missing or wrong — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                csrfMismatch:
                  { value: { error: forbidden, message: csrf mismatch } }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /{product}/identity/auth/device/start:
    post:
      operationId: deviceAuthStart
      tags: [identity]
      summary: Begin the device-code flow
      description: >
        RFC 8628 in shape but NOT in spelling: every field is camelCase (`deviceCode`,
        `userCode`, `verificationUri`, `expiresIn`) except `interval`, which coincides. There
        is no `device_code`/`user_code`/`expires_in` in the JSON body — the one snake_case
        survivor is the `user_code` QUERY parameter inside `verificationUriComplete`. Two extra
        fields RFC 8628 does not have: `status`, always `"pending"`, and `pollUrl`, the
        absolute URL of `/identity/auth/device/poll`.


        `userCode` is eight characters from RFC 8628 §6.1's consonant alphabet
        (`BCDFGHJKLMNPQRSTVWXZ`), shown as `XXXX-XXXX` and generated independently of
        `deviceCode`. `verificationUri` is the code-entry page (`/identity/auth/device`), short
        enough to type; `verificationUriComplete` is the same page with `?user_code=` filled in,
        for a QR code or a clickable link (RFC 8628 §3.3.1). Neither URL carries the device
        code. A client should show `userCode` large, render `verificationUriComplete` as a QR
        code and as the link it opens, and show `verificationUri` as the URL to type; a client
        that opens `verificationUri` instead lands on the entry form and the user has to type
        the code.


        The device id may come from the body, the `X-PKey-Device` header, or a `?device=`
        query parameter, in that order. An empty body is legal. `deviceName` is the device label
        (WIRE-CONTRACT-V4 §12.7.1, PX-W13): the Worker normalises it exactly as the SDK did
        (whitespace controls to spaces, controls and zero-width and bidi code points removed,
        spaces collapsed and trimmed, at most 64 code points), never rejects it, and echoes the
        stored label as `deviceName` in the answer (`null` when none is left), so a UI kit shows
        exactly what the sign-in page shows.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/DeviceHeader" }
        - name: device
          in: query
          required: false
          description: Last-resort device id, used when neither the body nor the header carries one.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceAuthStartRequest" }
            examples:
              named:
                summary: test/oidcEdge.test.ts
                value: { deviceId: dev-1, deviceName: Studio Mac }
              headerOnly:
                summary: Device id supplied by `X-PKey-Device` instead
