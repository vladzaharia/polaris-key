  /{product}/distribution/report:
    post:
      operationId: ciDistributionReport
      tags: [distribution]
      summary: Report availability, a submission state or a signing key (CI)
      description: >
        P2b-03. Until the store connectors exist (P5-02 to P5-04), CI reports what a store says.
        `type: availability` records whether release R (build B, or the whole release when
        `buildId` is omitted) is available on outlet O: `pending`, `processing`, `in-review`,
        `approved`, `live`, `rejected` or `removed`. `type: submission` records where R stands
        in O's review lifecycle: `prepared`, `submitted`, `in-review`, `approved`, `rejected`,
        `pending-developer-release`, `released` or `cancelled`. Name the release by `releaseId`,
        or by `version` (with `deliverable`, default `app`). The outlet must be declared and not
        removed; the release and build must exist. A report may move a state backwards (a
        rejection after review): the row keeps the current state and every change is audited as
        `ci:<subject>`. Store-assigned ids go in `platformRef` (availability only); omit it to
        keep the stored one, `null` to clear it. Self-hosted outlets need no report: their
        availability is derived from Release's truth. `type: key` reports the SHA-256 fingerprint
        (64 lower-case hex) CI signed with for a purpose (`android-app-signing`,
        `android-upload`, `android-sideload`, `fdroid-repo`, `sparkle-ed25519`, `release`,
        `msix-publisher`): it never changes the operator-owned key inventory; one that matches
        no entry is stored as an observation and flagged (`match: false`). A refused report
        writes nothing. Requires a `pkeyci_` token with `distribution:report` (in the default
        CI grant). No CORS. Errors are LEGACY FLAT with a machine-readable `reason`
        (`unknown_outlet`, `unknown_release`, `unknown_build` 404; `invalid_state`,
        `unknown_purpose`, `invalid_fingerprint`, `invalid_body` 422; `too_many_observations`
        409, past 64 unreviewed key observations; `bad_body` 400).
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [availability, submission, key] }
                releaseId: { type: string, description: "Not with `version`." }
                version: { type: string, description: "Not with `releaseId`." }
                deliverable:
                  {
                    type: string,
                    default: app,
                    description: "With `version` only.",
                  }
                outlet:
                  {
                    type: string,
                    description: "Required for availability and submission; optional for key.",
                  }
                buildId:
                  {
                    type: string,
                    description: "Availability only; omitted = the whole release.",
                  }
                state:
                  { type: string, description: "From the type's vocabulary." }
                since:
                  {
                    type: integer,
                    description: "Epoch seconds the state was entered; default now (or unchanged while the state is).",
                  }
                platformRef:
                  {
                    type: [object, "null"],
                    description: "Availability only: store-assigned ids.",
                  }
                detail: { type: [object, "null"] }
                purpose:
                  type: string
                  enum:
                    [
                      android-app-signing,
                      android-upload,
                      android-sideload,
                      fdroid-repo,
                      sparkle-ed25519,
                      release,
                      msix-publisher,
                    ]
                sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            examples:
              availability:
                value:
                  {
                    type: availability,
                    releaseId: v1.1.0,
                    outlet: app-store,
                    buildId: ios,
                    state: in-review,
                    platformRef: { ascBuildId: abc-123 },
                  }
              submission:
                value:
                  {
                    type: submission,
                    version: 1.1.0,
                    outlet: app-store,
                    state: submitted,
                  }
              key:
                value:
                  {
                    type: key,
                    purpose: android-app-signing,
                    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
                    outlet: play,
                  }
      responses:
        "200":
          description: The record after the report (`availability`, `submission`), or the key verdict.
          content:
            application/json:
              schema:
                type: object
                required: [ok, type]
                properties:
                  ok: { type: boolean, const: true }
                  type: { type: string, enum: [availability, submission, key] }
                  availability:
                    type: object
                    properties:
                      deliverableId: { type: string }
                      releaseId: { type: string }
                      buildId: { type: string }
                      outletId: { type: string }
                      transport: { type: string }
                      state: { type: string }
                      since: { type: integer }
                      platformRef: { type: [object, "null"] }
                      detail: { type: [object, "null"] }
                      source: { type: string }
                      derived: { type: boolean, const: false }
                      updatedAt: { type: integer }
                  submission:
                    type: object
                    properties:
                      deliverableId: { type: string }
                      releaseId: { type: string }
                      outletId: { type: string }
                      state: { type: string }
                      submittedAt: { type: [integer, "null"] }
                      reviewedAt: { type: [integer, "null"] }
                      detail: { type: [object, "null"] }
                      source: { type: string }
                      updatedAt: { type: integer }
                  key:
                    type: object
                    properties:
                      purpose: { type: string }
                      sha256: { type: string }
                      match: { type: boolean }
                      flagged: { type: boolean }
              examples:
                availability:
                  summary: test/distributionAvailability.test.ts
                  value:
                    ok: true
                    type: availability
                    availability:
                      deliverableId: app
                      releaseId: v1.1.0
                      buildId: cli-arm64
                      outletId: app-store
                      transport: pkey-cdn
                      state: in-review
                      since: 1700000000
                      platformRef: { ascBuildId: abc-123 }
                      detail: null
                      source: ci
                      derived: false
                      updatedAt: 1700000000
                keyMismatch:
                  summary: test/distributionAvailability.test.ts
                  value:
                    ok: true
                    type: key
                    key:
                      purpose: android-app-signing
                      sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                      match: false
                      flagged: true
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "409": { $ref: "#/components/responses/CiRefusal" }
        "422": { $ref: "#/components/responses/CiRefusal" }

  /{product}/distribution/hooks/asc:
    post:
      operationId: ascWebhook
      tags: [distribution]
      summary: App Store Connect webhook notifications (Apple → Worker)
      description: >
        P5-02. Called by App Store Connect, never by a client: the connector registers it
        (`POST /v1/webhooks`, all 12 `WebhookEventType`s) from the console. The body is Apple's
        thin JSON:API envelope; `x-apple-signature: hmacsha256=<hex>` is HMAC-SHA256 over the raw
        body with the product's `asc-webhook-secret` outlet credential, compared in constant time.
        A missing header or another scheme is 401 before anything is opened; deliveries are
        rate-limited per product BEFORE the secret is opened (429 `rate_limited`). A `data.id`
        seen in the last 7 days answers 200 `{ok, duplicate: true}` and changes nothing. The
        webhook is a hint: the instance it names (an App Store version, build upload, build beta
        detail or Background Asset version/release) is re-read from the App Store Connect API
        and only what the API says is written — availability, submissions and the phased-release
        mirror (`source: asc`). Beta feedback, alternative-distribution events and Apple's ping
        are stored raw (200); an unknown event type answers 204 and is stored as `ignored`. The
        product must declare an `app-store` or `testflight` outlet with an `appleId` and hold
        an `asc-api-key` credential that the operator has PINNED to that same `appleId`, and an
        `asc-webhook-secret`; otherwise — like with Distribution off — the answer is the service
        not-found shape, so a manifest naming another app than the pinned one mirrors nothing.
        No CORS. Errors are LEGACY FLAT.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: x-apple-signature
          in: header
          required: true
          schema: { type: string, pattern: "^hmacsha256=[0-9a-fA-F]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [id, type]
                  properties:
                    id:
                      {
                        type: string,
                        description: "The delivery id; the dedupe key.",
                      }
                    type:
                      type: string
                      description: "The event type in Apple's camel-case spelling (`appStoreVersionAppVersionStateUpdated`)."
                    version: { type: integer }
                    attributes: { type: object }
                    relationships:
                      type: object
                      description: "`instance` names the object, as `{data: {type, id}}` or — Background Asset events — `{type, id, links}`."
            examples:
              appVersionState:
                summary: test/fixtures/asc/webhooks/APP_STORE_VERSION_APP_VERSION_STATE_UPDATED.json
                value:
                  data:
                    type: appStoreVersionAppVersionStateUpdated
                    id: 5f1c1e3a-0001-4b8e-9d2a-000000000001
                    version: 1
                    attributes:
                      newValue: READY_FOR_DISTRIBUTION
                      oldValue: PENDING_DEVELOPER_RELEASE
                      timestamp: "2026-09-30T17:00:00.000Z"
                    relationships:
                      instance:
                        data: { type: appStoreVersions, id: asv-110 }
      responses:
        "200":
          description: "Accepted (the follow-up read runs after the response), stored, or a duplicate."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
                  duplicate: { type: boolean, const: true }
        "204":
          {
            description: "An event type this build does not know; stored as `ignored`.",
          }
        "400":
          description: "Not a webhook payload (`reason: bad_body`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "401":
          description: Missing, malformed or wrong `x-apple-signature`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Body over 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
        "429":
          description: Too many deliveries for this product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }

  /{product}/distribution/altstore/{channel}/source.json:
    get:
      operationId: altstoreSource
      tags: [distribution]
      summary: AltStore Classic / SideStore source for one channel
      description: >
        P2b-05. The product's `altstore` outlet as an AltStore source (notes/E1 §B1–§B4):
        versions newest first and unique by (`version`, `buildVersion`), `appPermissions` from
        the IPA metadata `pkey release publish` extracted (a release without it is skipped:
        AltStore refuses an install whose permissions differ), the legacy app-level `version`,
        `versionDate`, `versionDescription`, `downloadURL` and `size` beside `versions[]`
        (SideStore issue #735), and NO `marketplaceID` (SideStore refuses a source carrying one).
        Lists the releases the channel serves (beta includes stable) that have the outlet's
        build, are live on it, are not yanked and are not held back by a paused, halted or
        partial outlet rollout — the previous release stands in. Download URLs are immutable
        `files/<releaseId>/<name>` URLs on the bytes host when there is one. Exists only while
        the app's delivery access is `public` (no client of it can authenticate); otherwise, and
        for an unknown channel or a product without the outlet, the plain not-found.
        `?outlet=<id>` picks one of several `altstore` outlets. `Cache-Control: public,
        max-age=300`; the strong ETag is the body's SHA-256.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - { $ref: "#/components/parameters/FeedOutlet" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/FeedDocument" }
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightAltstoreSource
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins` (a source browser). See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/altstore-pal/{channel}/source.json:
    get:
      operationId: altstorePalSource
      tags: [distribution]
      summary: AltStore PAL source for one channel
      description: >
        P2b-05. The `altstore-pal` outlet's source: the AltStore document WITH `marketplaceID`
        (the outlet's `marketplaceId`; not-found without one). AltStore PAL is a store outlet, so
        a release appears only once reported `live` there (`POST …/distribution/report` or a
        connector). The download URL is the build's payload as the release declares it.
        Otherwise as `altstoreSource`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - { $ref: "#/components/parameters/FeedOutlet" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/FeedDocument" }
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightAltstorePalSource
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/obtainium/{channel}.json:
    get:
      operationId: obtainiumConfig
      tags: [distribution]
      summary: Obtainium app config for one channel
      description: >
        P2b-05. The app config an `obtainium://app/<url-encoded JSON>` link carries (notes/E2 §B3;
        key names checked against Obtainium's `App.fromJson`): `id`, `url`, `author`, `name`,
        `overrideSource` and `additionalSettings`, a JSON STRING. With a live `fdroid-repo`
        outlet the config tracks that repository (`FDroidRepo`: version codes, ABI selection,
        stable preferring stable versions); otherwise it is a `DirectAPKLink` to the channel's
        `builds/<channel>/<buildId>` URL, pseudo-versioned by its ETag (the payload's SHA-256).
        Needs a live `obtainium` outlet and a package name (the outlet's `packageName` or the
        APK metadata). Same access, caching and not-found rules as `altstoreSource`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - { $ref: "#/components/parameters/FeedOutlet" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/FeedDocument" }
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightObtainiumConfig
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/fdroid/{channel}/repo/{path}:
    get:
      operationId: fdroidRepoFile
      tags: [distribution]
      summary: F-Droid repository relay (one channel's repository)
      description: >
        P2b-05. One F-Droid repository per channel (notes/E2 §C2), signed BY CI with the repo key
        Polaris Key never holds. Serves only the files CI registered
        (`POST …/distribution/feeds/fdroid/{channel}`) — `entry.jar`, `entry.json`,
        `index-v2.json`, `diff/<timestamp>.json`, `icons/…` (`{path}` may contain `/`) — from the
        blob store with the type chosen at registration (`application/json`,
        `application/java-archive`, `image/png`, …), `nosniff` and a sandbox CSP,
        `Cache-Control: public, max-age=300, no-transform` and the SHA-256 as ETag (the paths are
        mutable). An APK the registered `index-v2.json` names and the channel's F-Droid feed
        still selects (`<name>.apk`) is a `302` to its immutable delivery URL. A path failing the safe-path check, any other path, a non-public
        app deliverable, a registered file whose object a non-public deliverable's release
        carries (the blob route's strictest-mode rule), or a product without a live
        `fdroid-repo` outlet: the plain not-found.
        The repository URL users add is `…/fdroid/{channel}/repo?fingerprint=<sha256>`, the
        fingerprint from the key inventory (`fdroid-repo` purpose).
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - name: path
          in: path
          required: true
          description: A repository path relative to `repo/`; may contain `/` (`diff/1700000000.json`).
          schema: { type: string }
        - { $ref: "#/components/parameters/Range" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: The registered file.
          content:
            application/json:
              schema: { type: object }
            application/java-archive:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "206":
          description: Partial content for a `Range` request.
        "302":
          description: An APK the index lists, redirected to its immutable delivery URL.
        "304":
          description: Not modified (`If-None-Match`).
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
    options:
      operationId: preflightFdroidRepoFile
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { $ref: "#/components/parameters/FeedChannel" }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/scoop/{channel}.json:
