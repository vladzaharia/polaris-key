              examples:
                script:
                  summary: The two lines test/release.test.ts pins
                  value: |
                    CLI_BASE='/djdl/release/dl'
                    URL="$ORIGIN$CLI_BASE/$VERSION/djdl-$ARCH"
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/ReleaseRateLimited" }
        "503": { $ref: "#/components/responses/UpstreamRateLimited" }
    options:
      operationId: preflightGetInstallScript
      tags: [distribution]
      summary: CORS preflight
      description: >
        Browser preflight for a page on one of the product's `web.origins`. Answered
        before service dispatch, so the result never depends on whether the service
        behind this path is enabled. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }
  /{product}/distribution/dl/{version}/{asset}:
    get:
      operationId: downloadArtifact
      tags: [distribution]
      summary: Download a release artifact
      description: >
        P2b-04: moved from Release to Distribution, which owns all byte delivery;
        `/{product}/release/dl/{version}/{asset}` is its permanent alias. Unifies the v2
        `/cli/*` and `/dmg/*` families: `{asset}` is `<binary>-<arch>` or `<binary>-<arch>.dmg`
        (arch ∈ arm64|aarch64|x86_64|amd64). Gated by the `app` deliverable's delivery access
        (`dist_access`, the answer the appcast and the portal read too); `entitled` returns
        nested v3 errors (401 unauthorized / 403 channel_not_allowed / 403 version_blocked +
        allowedRange). The bytes are GitHub's, streamed by Release through the catalog hook.


        ── WHICH ERROR SHAPE, AND WHY IT DIFFERS BY MODE ────────────────────────────────

        `authenticated` and `licensed` are the pre-v3 code path and answer with the LEGACY
        FLAT body `{"error":"download_auth_required","message":…}` at 401 — and with nothing
        else: neither mode inspects channel or version at all, so no 403 exists on those
        branches. `entitled` (D-13) is v3's own and answers NESTED: 401
        `{"error":{"code":"unauthorized"}}`, 403 `{"error":{"code":"channel_not_allowed"}}`
        with NO `allowedRange`, and 403 `{"error":{"code":"version_blocked"}}` WITH
        `allowedRange` as a TOP-LEVEL sibling of `error`. Unlike `/license/document`, the
        release path carries no `error.reason`. `public` demands nothing.


        The worker STREAMS the artifact rather than redirecting: GitHub's redirect is followed
        server-side (with the storage host checked against an allowlist and the Authorization
        header dropped before the second hop), so the client sees 200 — or 206 for a `Range`
        request, or 304 for `If-None-Match`, both of which are forwarded upstream. The
        response `content-type` is always this worker's own, never the repo-controlled
        upstream value. `?checksum=sha256` serves the published sidecar digest as bare
        lowercase hex instead of the artifact.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: version
          in: path
          required: true
          description: >
            A selector, not necessarily a semver: `latest`, `stable`, a pinned bare `1.2.3`
            (looked up as the `v1.2.3` tag, then as `1.2.3` if that 404s; a `v`-prefixed
            selector is not accepted), `beta` (or its legacy alias `staging`, unless the product
            declares a manual channel of that name), `pr-42`, or an operator-defined channel
            name. An aliased selector keeps its own spelling for the asset suffix. Pinned selectors
            get `max-age=86400, immutable`; moving ones `max-age=120`.
          schema: { type: string }
        - name: asset
          in: path
          required: true
          schema:
            {
              type: string,
              pattern: "^.+-(arm64|aarch64|x86_64|amd64)(\\.dmg)?$",
            }
        - name: checksum
          in: query
          required: false
          description: >
            Set to `sha256` to serve the artifact's published `<asset>.sha256` sidecar as a
            bare lowercase hex digest plus a newline, instead of the artifact itself. 404 when
            no sidecar exists or its first token is not 64 hex characters.
          schema: { type: string, enum: [sha256] }
        - { $ref: "#/components/parameters/Range" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: >
            The artifact, streamed through the worker. `content-type` is
            `application/x-apple-diskimage` for a `.dmg` and `application/octet-stream`
            otherwise; `content-disposition: attachment` names the sanitised asset.
            `Content-Length`, `Accept-Ranges`, `ETag` and `Last-Modified` are passed through
            from upstream.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/x-apple-diskimage:
              schema: { type: string, format: binary }
            text/plain:
              schema:
                type: string
                pattern: "^[0-9a-f]{64}\\n$"
              examples:
                checksum:
                  summary: "?checksum=sha256 (test/attack/R6-release.test.ts)"
                  value: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\n"
        "206":
          description: Partial content, when the client sent a `Range` header.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: Not modified, when the client sent a matching `If-None-Match`.
        "401":
          description: >
            Two different bodies depending on the deliverable's delivery access — LEGACY
            FLAT under `authenticated`/`licensed`, NESTED under `entitled`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/FlatError" }
                  - { $ref: "#/components/schemas/WireError" }
              examples:
                licensedModeFlat:
                  summary: "`authenticated` / `licensed` — test/release.test.ts"
                  value:
                    error: download_auth_required
                    message: a valid license is required to download this release artifact
                entitledModeNested:
                  summary: "`entitled` — test/updateFeed.test.ts"
                  value: { error: { code: unauthorized } }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429":
          description: >
            120 artifact requests per 60 s per client IP (a wider lane than metadata's 30) —
            LEGACY FLAT. Only cache misses are metered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                limited:
                  {
                    value:
                      {
                        error: rate_limited,
                        message: too many release requests,
                      },
                  }
        "503": { $ref: "#/components/responses/UpstreamRateLimited" }
    options:
      operationId: preflightDownloadArtifact
      tags: [distribution]
      summary: CORS preflight
      description: >
        Browser preflight for a page on one of the product's `web.origins`. Answered
        before service dispatch, so the result never depends on whether the service
        behind this path is enabled. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/builds/{selector}/{buildId}:
    get:
      operationId: downloadBuild
      tags: [distribution]
      summary: Download the payload of a declared build
      description: >
        P2-05; P2b-04 moved it to Distribution (`/{product}/release/builds/…` is its permanent
        alias, on both hosts). Serves the `app` deliverable only: `?deliverable=` naming any
        other deliverable (a pack) answers not-found, because a pack's objects are reached by
        SHA-256 on `downloadBlob` alone, under the pack's own delivery access and gate (P4-05).
        Resolves `{selector}` from the release truth store — channel membership and `includes` (beta ⊇ stable), the channel's
        pointer and pin, yanks, the deliverable's version scheme, the tag filter — keeping only
        releases that have the build `{buildId}`, so a release missing one platform's build falls
        back to the newest release that has it. Then serves that build's `payload` artifact from
        its first location: R2 (`ETag` = the SHA-256, `Repr-Digest`, `Range`, `If-Range`,
        `If-None-Match`), then GitHub (streamed through the worker; the signed storage URL is
        cached, so a `Range` chunk costs no API call), then an external `https://` URL (302).
        Also answers `HEAD` with the same headers and no body. Served on the console host and on
        the bytes host (`BLOB_ORIGIN`, e.g. `dl.plrs.im`); discovery advertises the bytes-host
        URL. Access follows the deliverable's delivery access (`dist_access`) exactly as
        `/distribution/dl` does (flat 401 under `authenticated`/`licensed`, nested under
        `entitled`), and requests count against the artifact rate-limit lane. A moving selector
        is cached `public, max-age=120`, a version selector `immutable`; a non-public
        deliverable's bytes are `private, no-store`. Served only while Distribution is enabled
        for the product: otherwise the console answers the registry not-found and the bytes host
        its flat `{"error":"not_found"}`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: selector
          in: path
          required: true
          description: >
            A channel (`stable`, `latest`, `beta`, the legacy `staging` = `beta`, a manual
            channel, a channel a release was published to) or a version (`1.2.3`, `1.2.3.4`).
            A version is explicit: it resolves even when that release is yanked.
          schema: { type: string }
        - name: buildId
          in: path
          required: true
          description: The build's id in the deliverable's artifact map (`macos`, `win-zip`, `apk`).
          schema: { type: string }
        - name: deliverable
          in: query
          required: false
          schema: { type: string, default: app }
        - name: checksum
          in: query
          required: false
          description: >
            `sha256` answers the payload's SHA-256 as bare lowercase hex plus a newline instead of
            the payload (`text/plain` on the console host, `application/octet-stream` on the
            bytes host, which serves no text type).
          schema: { type: string, enum: [sha256] }
        - name: redirect
          in: query
          required: false
          description: >
            `1` asks for a 302 to GitHub's own download URL instead of a stream. Honoured only
            for a PUBLIC artifact of a PUBLIC repository; everything else streams. Streaming is
            the default because winget refuses redirects and App Installer and zsync need `Range`.
          schema: { type: string, enum: ["1"] }
        - { $ref: "#/components/parameters/Range" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: The payload (or, with `?checksum=sha256`, its digest).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, pattern: "^[0-9a-f]{64}\\n$" }
              examples:
                checksum:
                  summary: "?checksum=sha256 (test/releaseBytes.test.ts)"
                  value: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\n"
        "206":
          description: Partial content for a `Range` request.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "302":
          description: >
            `?redirect=1` on a public artifact of a public repository, or an artifact whose only
            location is an external `https://` URL.
        "304":
          description: Not modified (`If-None-Match`).
        "401":
          description: >
            The delivery access refused the caller — LEGACY FLAT under
            `authenticated`/`licensed`, NESTED under `entitled` (see `/distribution/dl`).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/FlatError" }
                  - { $ref: "#/components/schemas/WireError" }
              examples:
                licensedModeFlat:
                  summary: "`authenticated` / `licensed` — test/releaseBytes.test.ts"
                  value:
                    error: download_auth_required
                    message: a valid license is required to download this release artifact
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "416":
          description: "An unsatisfiable `Range` (R2-served bytes), with `Content-Range: bytes */<size>`."
        "429":
          description: The artifact rate-limit lane (120 per 60 s per client IP) — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                limited:
                  {
                    value:
                      {
                        error: rate_limited,
                        message: too many release requests,
                      },
                  }
        "503": { $ref: "#/components/responses/UpstreamRateLimited" }
    options:
      operationId: preflightDownloadBuild
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { name: selector, in: path, required: true, schema: { type: string } }
        - { name: buildId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/files/{releaseId}/{name}:
    get:
      operationId: downloadReleaseFile
      tags: [distribution]
      summary: Download one exact file of one release
      description: >
        P2-05; P2b-04 moved it to Distribution (`/{product}/release/files/…` is its permanent
        alias, on both hosts). One file of one release by its exact name — payloads and sidecars
        alike
        (`.sig`, `.sha256`, an index). Immutable: the release id and the name fix the bytes, so a
        public response is cached `public, max-age=31536000, immutable`. Same locations, `HEAD`,
        `Range`, access mode, rate-limit lane and `?redirect=1` rule as `downloadBuild`; served
        on the console host and on the bytes host. Serves the `app` deliverable's releases only:
        a pack release's files answer not-found here (P4-05), since a pack's objects are reached
        by SHA-256 on `downloadBlob` alone, under the pack's own delivery access and gate, never
        under the app's version window. Access is the app's delivery access; under `entitled`
        the release's STORED version is checked against the caller's window as a fixed, pinned
