  /{product}/distribution/blobs/sha256/{sha256}:
    get:
      operationId: downloadBlob
      tags: [distribution]
      summary: Download a content-addressed object
      description: >
        P2-05; P2b-04 moved it to Distribution (`/{product}/release/blobs/…` is its permanent
        alias, on both hosts). The object stored under `blobs/sha256/{sha256}` — served only if
        an artifact (or a pack object) of THIS product references it (`blob_refs`); another product's copy of the
