components:
  securitySchemes:
    ciToken:
      type: http
      scheme: bearer
      bearerFormat: pkeyci_
      description: >
        A CI credential (`pkeyci_…`), scoped to one product and a set of scopes
        (`release:promote`, `release:yank`, …). Minted by P2-02's trusted-publisher exchange or
        issued by an operator; only its peppered hash is stored. A missing or unknown token is
        401 (`reason: ci_token_required` / `invalid_ci_token`), a token for another product is
        indistinguishable from an unknown one, and a token without the route's scope is 403
        (`reason: missing_scope`).
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: pkeyt_
      description: >
        The per-device bearer token (`pkeyt_…`), minted by activation, enrollment, or
        policy-gated registration. Never a signing key; rotated via /license/token.
        `pkeyt_` + 43 base64url characters (256-bit), hash-stored server-side.
    licenseKey:
      type: http
      scheme: bearer
      bearerFormat: pkey_
      description: >
        The customer's LICENSE KEY (`pkey_<product>_…`), presented as a bearer credential by
        `/license/activate` and (optionally) `/identity/session/license`. It is not a session
        credential: it is redeemed once per device for a `pkeyt_` device token and should
        never be sent to any other route.
    browserSession:
      type: apiKey
      in: cookie
      name: pkey_<product>_session
      description: >
        The product browser session cookie. The real name substitutes the product slug with
        every dash replaced by an underscore (`my-app` → `pkey_my_app_session`), while the
        cookie's `Path` uses the raw slug. `HttpOnly; Secure; SameSite=Lax; Max-Age=2592000`.
        The value is an opaque base64url token with no prefix — unlike `pkeyt_` device
        tokens.
  parameters:
    OciOwner:
      name: owner
      in: path
      required: true
      description: F-08. The feed's owner (a product slug), the first component of the repository name.
      schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
    OciRepository:
      name: repository
      in: path
      required: true
      description: >
        F-08. The repository path under the owner: one or more lower-case components joined by
        `/` (the OCI name grammar), at most 255 characters with the owner.
      schema: { type: string }
    PolicyChannel:
      name: channel
      in: path
      required: true
      description: >
        A canonical channel (`stable`, `beta`, a declared manual channel, `pr-<n>`, or a channel a
        release was published to). `staging` is accepted as the legacy spelling of `beta` unless
        the product declares a manual `staging` channel, and is never stored; `latest` means
        `stable`.
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
    Product:
      name: product
      in: path
      required: true
      description: The product slug (tenant).
      schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
    MintId:
      name: mintId
      in: path
      required: true
      description: >
        The edge-mint recipe id. A value outside the pattern does not reach the handler — the
        route simply does not match, and the registry answers its nested not-found.
      schema: { type: string, pattern: "^[a-z0-9-]+$" }
    Channel:
      name: channel
      in: path
      required: true
      description: >
        A release channel name (`stable`, `beta`, `nightly`, `pr-42`, …). `staging` is accepted
        as the legacy alias of `beta` unless the product declares a manual `staging` channel
        (WIRE-CONTRACT-V3 §5.1).
      schema: { type: string, pattern: "^[a-z0-9-]+$" }
    Arch:
      name: arch
      in: query
      required: false
      description: >
        Artifact architecture for dual-enclosure appcasts. Default arm64. Matching is
        case-insensitive over five accepted tokens which normalise to two canonical values:
        `arm64`/`aarch64` → `arm64`, and `x86_64`/`amd64`/`x64` → `x86_64`. An UNRECOGNISED
        value is not an error — it falls back to `arm64`, so a confused updater gets a feed
        rather than a 404. Discovery advertises only the two canonical values.
      schema: { type: string, enum: [arm64, aarch64, x86_64, amd64, x64] }
    DeviceHeader:
      name: X-PKey-Device
      in: header
      description: >
        The client's device id. REQUIRED by activate, enroll, token and register. Registration
        demands exactly 32 base64url characters; the license routes accept any non-empty
        string.
      schema: { type: string }
    VersionHeader:
      name: X-PKey-Version
      in: header
      description: >
        The calling build's version. Read by the build gate on `/license/document` and
        `/identity/session`, where it DEFAULTS to `0.0.0` when absent; elsewhere it is
        recorded as the device's `appVersion`.
      schema: { type: string }
    ChannelHeader:
      name: X-PKey-Channel
      in: header
      description: >
        The channel the caller declares (WIRE-CONTRACT-V3 §5.1): `stable`, `beta`, `pr` (read
        as the build's own `pr-<n>`), `pr-<n>`, `dev` or a manual name; `staging` and `latest`
        are accepted aliases of `beta` and `stable`. It can only TIGHTEN the channel the
        version already implies, never replace it. A malformed value is itself a refusal
        rather than a free pass, and an unknown well-formed name must be granted by name.
      schema: { type: string }
    PlatformHeader:
      name: X-PKey-Platform
      in: header
      description: >
        The OS family of the running binary (WIRE-CONTRACT-V3 §5.2): `macos`, `ios` (iPadOS
        too), `android`, `windows`, `linux` or `web`. An SDK omits it when its runtime's
        spelling has no value. Recorded on the device row and echoed back as `platform`; an
        older spelling (`darwin`, `win32`, `browser`, …) is stored as its canonical value, any
        other value as sent, and an empty value as absent.
      schema: { type: string }
    ArchHeader:
      name: X-PKey-Arch
      in: header
      description: >
        The CPU architecture the running binary was built for (WIRE-CONTRACT-V3 §5.2): `arm64`,
        `x86_64`, `armv7` or `wasm32`; a browser sends none. Recorded on the device row and
        echoed back as `arch`; an older spelling (`x64`, `AMD64`, `aarch64`, …) is stored as its
        canonical value, any other value as sent, and an empty value as absent.
      schema: { type: string }
    SdkHeader:
      name: X-PKey-SDK
      in: header
      description: >
        The SDK id (WIRE-CONTRACT-V3 §5.2): `node`, `react`, `python`, `swift` or `godot`; a
        later SDK registers its own. The package version is `X-PKey-SDK-Version`. Recorded on
        the device row and echoed back as `sdkName`; a pre-§5.2 package name
        (`@polaris-key/node`, `PolarisKeySwift`, …) is stored as its id, any other value as
        sent, and an empty value as absent.
      schema: { type: string }
    SdkVersionHeader:
      name: X-PKey-SDK-Version
      in: header
      description: Recorded on the device row and echoed back as `sdkVersion`.
      schema: { type: string }
    FeedChannel:
      name: channel
      in: path
      required: true
      description: A channel name (`stable`, `beta`, a manual channel; `staging` is beta's alias). Beta includes stable.
      schema: { type: string }
    FeedOutlet:
      name: outlet
      in: query
      required: false
      description: One outlet id, when the product declares several outlets of the feed's kind. Default — the outlet whose id is the kind, else the first by id.
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: >
        Compared by EXACT string equality against the freshly computed strong ETag — there is
        no `W/` handling and no list parsing.
      schema: { type: string }
    Range:
      name: Range
      in: header
      description: Forwarded to the artifact origin; a satisfiable range yields 206.
      schema: { type: string }
    # Maven feed (F-07)
    MavenOwner:
      name: owner
      in: path
      required: true
      description: The feed's owner, a product slug (`polaris-key` for the platform's own packages).
      schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
    MavenGroupPath:
      name: groupPath
      in: path
      required: true
      description: >
        The groupId with each `.` as a `/` (`im/plrs/key`): one or more path segments, matched
        case-sensitively against the declared `groupId:artifactId`.
      schema: { type: string }
    MavenArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string }
    MavenChecksum:
      name: checksum
      in: path
      required: true
      schema: { type: string, enum: [md5, sha1, sha256, sha512] }
  headers:
    ETag:
      description: >
        A strong, quoted, base64url SHA-256 over the document's CONTENT only — the per-request
        `issuedAt`/`expiresAt`/`graceUntil` are excluded, so re-signing the same content at a
        later clock yields the same tag and a client's conditional request still collapses to
        304.
      schema: { type: string }
      example: '"KJ3nQ0xZk8LqR8nT0sYp2vcEgHj6Bf3QdNwXr7uKmA1"'
    SetSessionCookie:
      description: The product browser-session cookie.
      schema: { type: string }
      example: pkey_djdl_session=Zk8LqR8nT0sYp2vcEgHj6A; Path=/djdl; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax
    ClearSessionCookie:
      description: The same cookie with an empty value and `Max-Age=0`.
      schema: { type: string }
      example: pkey_djdl_session=; Path=/djdl; Max-Age=0; HttpOnly; Secure; SameSite=Lax
    # ── npm (F-04, the registry host) ──
    NpmOwner:
      name: owner
      in: path
      required: true
      description: The feed's owner, a product slug (`polaris-key` for the platform's own packages).
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]*$" }
    NpmScope:
      name: scope
      in: path
      required: true
      description: The package's scope with its `@`; it must be the feed's scope.
      schema: { type: string, pattern: "^@[a-z0-9][a-z0-9._~-]*$" }
    NpmName:
      name: name
      in: path
      required: true
      description: The package name without its scope.
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9._~-]*$" }
    NpmTarballFile:
      name: tarball
      in: path
      required: true
      description: "`<name>-<version>.tgz`, as the packument's `dist.tarball` names it."
      schema: { type: string, pattern: "^[^/]+\\.tgz$" }
    NpmAccept:
      name: Accept
      in: header
      required: false
      description: >
        `application/vnd.npm.install-v1+json` listed first (at a quality at least that of an
        explicit `application/json`) selects the abbreviated packument; anything else the full
        one.
      schema: { type: string }
  responses:
    OciError:
      description: >
        OCI's error JSON (distribution-spec "Error Codes"): `NAME_UNKNOWN`, `MANIFEST_UNKNOWN`,
        `BLOB_UNKNOWN`, `UNAUTHORIZED` (401, with the Bearer challenge) or `UNSUPPORTED` (405),
        `no-store`, with `Docker-Distribution-API-Version: registry/2.0`.
      content:
        application/json:
          schema:
            type: object
            required: [errors]
            properties:
              errors:
                type: array
                items:
                  type: object
                  required: [code, message]
                  properties:
                    code: { type: string }
                    message: { type: string }
    ChannelPolicyChanged:
      description: The channel's policy after the change.
      content:
        application/json:
          schema:
            type: object
            required: [ok, policy]
            properties:
              ok: { type: boolean, const: true }
              policy: { $ref: "#/components/schemas/ChannelPolicy" }
              packSets: { $ref: "#/components/schemas/PackSetsOutcome" }
          examples:
            promoted:
              summary: test/releasePolicy.test.ts
              value:
                ok: true
                policy:
                  deliverable: app
                  channel: beta
                  pointer: v1.0.0
                  pinned: false
                  includes: null
                  minSupported: null
                  critical: false
                  source: admin
                  modifiedAt: 1700000000
                  modifiedBy: "ci:repo:acme/djdl:environment:release"
    FeedDocument:
      description: >
        A storefront feed document (P2b-05), rendered for one channel. `application/json;
        charset=utf-8`, `Cache-Control: public, max-age=300`, a strong `ETag` that is the body's
        SHA-256, `X-Content-Type-Options: nosniff`.
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { type: object }
    FeedRateLimited:
      description: The public feed rate-limit lane (per IP) — LEGACY FLAT.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FlatError" }
    CiRefusal:
      description: >
        LEGACY FLAT with a machine-readable `reason` (and `fields` where one field is at fault):
        `unknown_channel`, `unknown_deliverable`, `unknown_release`, `unknown_outlet`,
        `unknown_build`, `no_rollout` (404); `bad_body` (400); `bad_release`, `bad_reason`,
        `invalid_body`, `invalid_state`, `unknown_purpose`, `invalid_fingerprint` (422);
        `release_yanked`, `invalid_transition`, `rollout_mirrored`, `stale_release`,
        `too_many_observations` (409).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FlatError" }
          examples:
            yanked:
              value:
                error: bad_request
                message: a yanked release cannot be promoted; unyank it or pin it explicitly
                reason: release_yanked
                fields: [releaseId]
    CiUnauthorized:
      description: No `pkeyci_` bearer, or one that is unknown, expired, revoked or issued for another product — LEGACY FLAT.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FlatError" }
          examples:
            invalid:
              value:
                {
                  error: unauthorized,
                  message: "unknown, expired or revoked CI token",
                  reason: invalid_ci_token,
                }
    CiForbidden:
      description: A valid token for this product that lacks the route's scope — LEGACY FLAT.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FlatError" }
          examples:
            missingScope:
              value:
                {
                  error: forbidden,
                  message: this token lacks the release:yank scope,
                  reason: missing_scope,
                  scope: "release:yank",
                }
    CorsPreflight:
      description: >
        CORS preflight (P0-05). Always `204` with no body. When the request's `Origin` is
        exactly one of the product's `web.origins` (`.pkey/product`), the allow headers below
        are attached; for any other origin, or a product that lists none, the 204 carries no
        `Access-Control-*` header at all, which a browser treats as a refused preflight.
        `Access-Control-Allow-Credentials` is never sent: no cookie crosses origins here, and
        the cookie-bearing identity routes, the console, the portal and the docs site answer
        no CORS at all.


        The actual (non-preflight) response on the same path carries
        `Access-Control-Allow-Origin: <that origin>` and `Access-Control-Expose-Headers:
        ETag, Content-Range, Accept-Ranges, Content-Length, Repr-Digest` for a listed origin,
        and `Vary: Origin` whenever the product lists any origin.
      headers:
        Access-Control-Allow-Origin:
          description: The request's own `Origin`, echoed exactly. Never `*`.
          schema: { type: string }
          example: https://diceroll.gg
        Access-Control-Allow-Methods:
          schema: { type: string, const: "GET, POST, PATCH, DELETE" }
        Access-Control-Allow-Headers:
          description: Listed explicitly (a `*` would not cover `Authorization`).
          schema:
            type: string
            const: "Authorization, Content-Type, Range, If-None-Match, If-Range, X-PKey-Device, X-PKey-Version, X-PKey-Channel, X-PKey-SDK, X-PKey-SDK-Version, X-PKey-Platform, X-PKey-Arch"
        Access-Control-Max-Age:
          schema: { type: string, const: "600" }
        Vary:
          description: "`Origin`, whenever the product lists any origin."
          schema: { type: string }
    NotFound:
      description: >
        Not found — including "the product does not exist", "the service is not enabled for
        this product", and "no such route inside the namespace", which are DELIBERATELY
        indistinguishable (hide-don't-reveal; one body for all three). This is the REGISTRY's
        answer and uses the NESTED shape; Core routes and the migrated service handlers
        answer their own not-founds with the flat shape (see `LegacyNotFound`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WireError" }
          examples:
            notFound: { value: { error: { code: not_found } } }
    Unauthorized:
      description: >
        Missing/invalid credential. One /license/token re-acquire then retry is the SDK
        convention. NESTED shape — used by the two signed-document routes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WireError" }
          examples:
            unauthorized: { value: { error: { code: unauthorized } } }
    LegacyNotFound:
      description: >
        Not found — LEGACY FLAT. Emitted for an unknown PRODUCT (which precedes all service
        dispatch, so every route can answer this) and by the handlers that carried their v2
        bodies across the move. Some carry a `message`, most do not.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FlatError" }
          examples:
            bare: { value: { error: not_found } }
    LegacyUnauthorized:
      description: >
        Missing/invalid credential — LEGACY FLAT, with no `message`. One /license/token
        re-acquire then retry is the SDK convention; a registered-without-license device
        re-registers instead, under the same single-attempt rule.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FlatError" }
          examples:
            unauthorized: { value: { error: unauthorized } }
    MethodNotAllowed:
      description: >
        The route exists but not for this verb. The body is the PLAIN-TEXT string
        `Method Not Allowed` with no `content-type` set — it is not JSON, and neither error
        schema applies.
      content:
        text/plain:
          schema: { type: string }
          examples:
            text: { value: Method Not Allowed }
    ReleaseUnauthorized:
      description: >
        The release/update surface's access mode demands a credential this caller did not
        present. TWO shapes: `authenticated` and `licensed` answer the LEGACY FLAT
        `download_auth_required`; `entitled` answers the NESTED `unauthorized`.
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/FlatError" }
              - { $ref: "#/components/schemas/WireError" }
          examples:
            authenticatedOrLicensed:
              value:
                error: download_auth_required
                message: a valid license is required to download this release artifact
            entitled:
              value: { error: { code: unauthorized } }
    ReleaseForbidden:
      description: >
        The `entitled` access mode only (D-13). `channel_not_allowed` carries NO
        `allowedRange` — naming the window of a feed the caller may not see would leak its
        shape — while `version_blocked` carries it as a TOP-LEVEL sibling of `error`. Neither
        carries `error.reason`; that field exists only on `/license/document`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WireError" }
          examples:
            channelNotAllowed:
              summary: test/updateFeed.test.ts
              value: { error: { code: channel_not_allowed } }
            versionBlocked:
              summary: test/updateFeed.test.ts
              value:
                error: { code: version_blocked }
                allowedRange: { min: "2.0.0", max: "99.0.0" }
    ReleaseRateLimited:
      description: >
        LEGACY FLAT. Two lanes: metadata (`changelog`, `install.sh`, `version`) at 30 per
        60 s per client IP, artifacts (`dl`, appcasts) at 120. Only cache MISSES are metered.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FlatError" }
          examples:
            limited:
              {
                value:
                  { error: rate_limited, message: too many release requests },
              }
    UpstreamRateLimited:
      description: >
        GitHub's quota is exhausted, so release truth is momentarily unknowable — LEGACY
        FLAT, `cache-control: no-store`, with `Retry-After` when the upstream said when.
        Deliberately NOT a 404: "we cannot tell you right now" must not be cached by a client
        as "it does not exist".
      headers:
        Retry-After:
          description: Seconds until the upstream quota resets, when known.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FlatError" }
          examples:
            upstream:
              {
                value:
                  {
                    error: upstream_rate_limited,
                    message: release metadata is temporarily unavailable,
                  },
              }
    # ── npm (F-04, the registry host) ──
    NpmPackument:
      description: >
        The packument. `Vary: Accept`; `cache-control: public, max-age=60,
        stale-while-revalidate=60` and a strong ETag of the body's SHA-256 on a public feed
        (`private, no-store` and no ETag otherwise).
      content:
        application/json:
          schema: { type: object, required: [name, dist-tags, versions] }
        application/vnd.npm.install-v1+json:
          schema: { type: object, required: [name, dist-tags, versions] }
    NpmTarball:
      description: >
        The tarball's bytes. `content-disposition: attachment`; `cache-control: public,
        max-age=31536000, immutable` and the SHA-256 as ETag on a public feed.
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    NpmNotModified:
      description: "`If-None-Match` named the answer's ETag."
    NpmBasicChallenge:
      description: >
        The feed is not public, and the request carries no valid registry token (F-21, a `pkeyr_`
        token as Bearer or Basic `__token__:<t>`): `WWW-Authenticate: Basic realm="pkg.plrs.im"`
        (the deployment's own registry host name), `cache-control: no-store`.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FlatError" }
          examples:
            unauthorized: { value: { error: unauthorized } }
  schemas:
    CompactJws:
      type: string
      description: A compact EdDSA JWS (header.payload.signature, base64url).
      pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
    PackSetSelector:
      type: object
      description: >
        P4-12: one resolved pack set's key: the app channel, the live contentApi level, the
        platform of the live builds and the variant key over every resolvable pack's axes (`""`
        when none declares one).
      required: [channel, contentApi, platform, engine, variant]
      properties:
        channel: { type: string }
        contentApi: { type: integer, minimum: 1 }
        platform: { type: string }
        engine:
          type: string
          description: The live builds' `requires.engine`; `""` for builds that declare none.
        variant:
          type: string
          description: >
            The variant key over one GROUP's axes (packs with the same axes, merged across
            dependencies and conflicts); a device's set is one row per group.
    PackSetsOutcome:
      type: object
      description: >
        P4-12: the pack-set re-resolution a policy change (or a resync or sync) triggered. `ok:
        false` means resolution failed (`pack-sets-bound`, `pack-sets-error`): the operation
        itself applied, the product's resolved sets were cleared (fail closed) and an audit row
        written. `sets` counts the rows stored.
      required: [ok]
      properties:
        ok: { type: boolean }
        sets: { type: integer }
        reason: { type: string, enum: [pack-sets-bound, pack-sets-error] }
        message: { type: string }
    ChannelPolicy:
      type: object
      description: >
        P2-05: one deliverable's policy on one canonical channel. `minSupported` is the device
        floor. P4-12: a pack deliverable's view adds `packFloors`, its floors per contentApi line
        on this channel (set by the operator PUT with `contentApi`).
      required:
        [
          deliverable,
          channel,
          pointer,
          pinned,
          includes,
          minSupported,
          critical,
          source,
        ]
      properties:
        deliverable: { type: string }
        channel: { type: string }
        pointer: { type: [string, "null"] }
        pinned: { type: boolean }
        includes: { type: [array, "null"], items: { type: string } }
        minSupported: { type: [string, "null"] }
        critical: { type: boolean }
        source: { type: string, enum: [manifest, admin] }
        modifiedAt: { type: [integer, "null"] }
        modifiedBy: { type: [string, "null"] }
        packFloors:
          type: array
          items:
            type: object
            required: [contentApi, minSupported, modifiedAt, modifiedBy]
            properties:
              contentApi: { type: integer, minimum: 1 }
              minSupported: { type: string }
              modifiedAt: { type: integer }
              modifiedBy: { type: [string, "null"] }
    WireError:
      type: object
      description: >
        The nested wire-v3 error body, built by `core/errors.ts`'s `wireError`. `error` holds
        the `code` (and, on `/license/document` build blocks only, a `reason`); every OTHER
        field — `message`, `allowedRange`, and any handler-specific extra — rides at the TOP
        level as a sibling of `error`, not inside it. Spoken by the two signed documents,
        keyless registration, the registry's not-found, and the `entitled` release mode.
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: { type: string }
            reason:
              type: string
              description: >
                Present only on `/license/document` build-gate 403s, where `code` collapses
                both version outcomes into `version_blocked` and this keeps the distinction a
                client needs to word its message. Hyphenated, unlike `code`.
              enum: [version-too-old, version-too-new, channel-not-entitled]
        message:
          type: string
          description: A human-readable detail. A SIBLING of `error`, never inside it.
        allowedRange:
          $ref: "#/components/schemas/AllowedRange"
      examples:
        - { error: { code: unauthorized } }
        - {
            error: { code: version_blocked, reason: version-too-old },
            allowedRange: { min: "2.0.0", max: "99.0.0" },
          }
    DownloadModel:
      type: object
      description: >
        The public download page's model (P2b-06, `services/distribution/page/model.ts`).
        `schemaVersion` changes when a field changes meaning. Every string is Worker-built or
        validated; every URL is `https:` except `deepLink`, a custom-scheme link the Worker built.
      required:
        [
          schemaVersion,
          product,
          channel,
          pageUrl,
          listing,
          release,
          platforms,
          actions,
          keys,
        ]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        product:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
        channel:
          {
            type: string,
            description: "Always `stable` (beta channels are not on the page).",
          }
        pageUrl:
          type: [string, "null"]
          description: The HTML page on the bytes host, or null without one.
        listing:
          type: object
          properties:
            name: { type: string }
            subtitle: { type: [string, "null"] }
            description: { type: [string, "null"] }
            developerName: { type: [string, "null"] }
            website: { type: [string, "null"] }
        release:
          type: [object, "null"]
          properties:
            releaseId: { type: string }
            version: { type: string }
            title: { type: [string, "null"] }
            publishedAt: { type: [integer, "null"] }
            summary: { type: [string, "null"] }
        platforms:
          type: array
          items:
            type: object
            properties:
              platform:
                { type: string, enum: [ios, android, macos, windows, linux] }
              label: { type: string }
              primary: { type: [string, "null"], description: "An action id." }
              actions: { type: array, items: { type: string } }
              builds:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/DownloadBuild" },
                }
        actions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind:
                type: string
                enum:
                  [
                    app-store,
                    play,
                    ms-store,
                    steam,
                    itch,
                    flathub,
                    snap,
                    winget,
                    homebrew,
                    scoop,
                    download,
                    altstore,
                    sidestore,
                    altstore-pal,
                    obtainium,
                    fdroid,
                  ]
              outletId: { type: string }
              platforms: { type: array, items: { type: string } }
              label: { type: string }
              url: { type: [string, "null"] }
              deepLink: { type: [string, "null"] }
              qr:
                {
                  type: [string, "null"],
                  description: "The text the page's QR code encodes.",
                }
              command: { type: [string, "null"] }
              fingerprint: { type: [string, "null"] }
              version: { type: [string, "null"] }
              build:
                oneOf:
                  - { $ref: "#/components/schemas/DownloadBuild" }
                  - { type: "null" }
        keys:
          type: array
          items:
            type: object
            properties:
              purpose: { type: string }
              sha256: { type: string }
              outletId: { type: [string, "null"] }
    DownloadBuild:
      type: object
      properties:
        releaseId: { type: string }
        version: { type: string }
        buildId: { type: string }
        platform: { type: string }
        arch: { type: string }
        format: { type: [string, "null"] }
        name: { type: string }
        size: { type: [integer, "null"] }
        sha256: { type: [string, "null"] }
        minOs: { type: [string, "null"] }
        url:
          {
            type: string,
            description: "The immutable `files/<releaseId>/<name>` URL on the bytes host.",
          }
        outletId: { type: string }
    PortalPresentation:
      type: object
      description: >
        A product's presentation in the portal (PX-W1, G1, G16), from its `.pkey/distribution`
        root `listing`; without Distribution or a listing, `name` is the product's name and the
        rest is null.
      required:
        [name, developerName, tintColor, website, iconUrl, headerUrl, support]
      properties:
        name: { type: string }
        developerName: { type: [string, "null"] }
        tintColor: { type: [string, "null"], pattern: "^#[0-9A-Fa-f]{6}$" }
        website: { type: [string, "null"] }
        iconUrl:
          type: [string, "null"]
          description: A same-origin `/media/<product>/icon?v=…` URL, or null.
        headerUrl:
          type: [string, "null"]
          description: A same-origin `/media/<product>/header?v=…` URL, or null.
        support:
          oneOf:
            - type: "null"
            - type: object
              required: [url, email]
              properties:
                url: { type: [string, "null"] }
                email: { type: [string, "null"] }
    PortalLicenseSeats:
      type: object
      description: >
        One licence's summary with seats (G5). `status` is the portal status; `licenseStatus` the
        stored one (`active` or `disabled`). `deviceLimit` is the limit activation enforces;
        `activeSeatCount` the authorized devices inside the dormancy window; `dormantCount` those
        past it, which hold no seat.
      required:
        [
          id,
          tier,
          status,
          licenseStatus,
          activatedAt,
          expiresAt,
          maxOfflineDays,
          deviceLimit,
          activeSeatCount,
          deviceCount,
          dormantCount,
        ]
      properties:
        id: { type: string }
        tier: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/PortalStatus" }
        licenseStatus: { type: string }
        activatedAt: { type: [integer, "null"] }
        expiresAt: { type: [integer, "null"] }
        maxOfflineDays: { type: [integer, "null"] }
        deviceLimit: { type: integer }
        activeSeatCount: { type: integer }
        deviceCount: { type: integer }
        dormantCount: { type: integer }
    PortalStatus:
      type: string
      description: >
        A product's status from its best licence, first match wins: `suspended` (the developer
        disabled the licence), `expired`, `device_limit` (every seat in use), `expires_soon`
        (within 14 days), `active`.
      enum: [suspended, expired, device_limit, expires_soon, active]
    PortalLibrary:
      type: object
      required: [products, discoverCount]
      properties:
        discoverCount:
          type: integer
          minimum: 0
          description: >
            How many products `GET /api/discover` offers this account (PX-W10): the Discover
            count in the portal's nav.
        products:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PortalPresentation"
              - type: object
                required: [product, status, license, licenseCount, addedAt]
                properties:
                  product: { type: string, description: The product slug. }
                  status: { $ref: "#/components/schemas/PortalStatus" }
                  license: { $ref: "#/components/schemas/PortalLicenseSeats" }
                  licenseCount: { type: integer, minimum: 1 }
                  addedAt:
                    type: [integer, "null"]
                    description: When the account's first licence for the product was linked.
    PortalPurchase:
      type: object
      description: >
        A licence's purchase source (portal gap G8). `source` is `store` while a store purchase
        verified by the commerce bridge is active on the licence ("Bought on Steam"); otherwise it
        is how the licence was minted: `developer` (issued by the developer), `sign_in` (minted
        at sign-in) or `free` (auto-issued to a device). A refunded or revoked purchase stays in
        `grants` as `revoked`. A grant names its flag and label only when the developer shows
        that flag in the portal (`userGrant`); otherwise both are null. No purchase key is ever
        returned.
      required: [source, store, stores, grants]
      properties:
        source:
          type: string
          enum: [store, developer, sign_in, free]
        store:
          type: [string, "null"]
          description: For `store`, the store of the earliest active purchase.
          enum: [app-store, play, steam, null]
        stores:
          type: array
          description: Every store with an active purchase on the licence, earliest first.
          items: { type: string, enum: [app-store, play, steam] }
        grants:
          type: array
          items:
            type: object
            required: [store, state, grantedAt, revokedAt, flag, label]
            properties:
              store: { type: string, enum: [app-store, play, steam] }
              state: { type: string, enum: [active, revoked] }
              grantedAt: { type: integer }
              revokedAt: { type: [integer, "null"] }
              flag: { type: [string, "null"] }
              label: { type: [string, "null"] }
    ClientRecord:
      type: object
      description: >
        PX-W13 (WIRE-CONTRACT-V4 §12.7.2): the server-side view of the app asking to sign the
        person in. Built from the product's listing (through Distribution), its registered
        `web.origins` and its service toggles; never from a query parameter.
      required:
        [
          product,
          kind,
          appName,
          developerName,
          iconUrl,
          origins,
          services,
          nameVerified,
        ]
      properties:
        product: { type: string }
        kind: { type: string, enum: [web, native, device] }
        appName:
          type: string
          description: The listing name, else the product name; the product slug when `nameVerified` is false.
        developerName: { type: [string, "null"] }
        iconUrl:
          type: [string, "null"]
          description: Same-origin `/media/<product>/icon?v=…`, or null.
        origins: { type: array, items: { type: string } }
        services:
          type: object
          description: Both members are always present.
          properties:
            license: { type: boolean }
            cloudSync: { type: boolean }
        nameVerified:
          type: boolean
          description: False when the app name failed the display-name rules at render time; render the neutral frame.
    SignInRequestView:
      type: object
      required: [request, client, deviceLabel, userCode, expiresAt]
      properties:
        request: { type: string, pattern: "^rq_[A-Za-z0-9_-]{22}$" }
        client: { $ref: "#/components/schemas/ClientRecord" }
        deviceLabel:
          type: [string, "null"]
          description: The device's normalised label (§12.7.1), as reported by the device.
        userCode: { type: [string, "null"] }
        expiresAt: { type: integer, description: Epoch seconds. }
    AppConsentView:
      type: object
      required: [request, person, items, scopeHash, firstTime, changed]
      properties:
        request: { type: string, pattern: "^rq_[A-Za-z0-9_-]{22}$" }
        person:
          type: object
          required: [displayName, email, avatarUrl]
          properties:
            displayName: { type: [string, "null"] }
            email: { type: [string, "null"] }
            avatarUrl: { type: [string, "null"] }
        items:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind: { type: string, enum: [license, cloudSync, profile] }
              anchor:
                type: [object, "null"]
                properties:
                  name: { type: string }
                  tierName: { type: [string, "null"] }
                  term:
                    description: "`perpetual`, or the licence's end as epoch seconds."
                    oneOf:
                      [{ type: string, const: perpetual }, { type: integer }]
                  seat:
                    type: [object, "null"]
                    properties:
                      position: { type: integer }
                      limit: { type: integer }
              more: { type: integer, minimum: 0 }
              claims: { type: array, items: { type: string } }
        scopeHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        firstTime: { type: boolean }
        changed: { type: boolean }
    PortalDiscover:
      type: object
      required: [offers]
      properties:
        offers:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PortalPresentation"
              - type: object
                required: [product, platforms, offer, reason]
                properties:
                  product: { type: string, description: The product slug. }
                  platforms:
                    type: array
                    description: The platforms of the newest app release's builds.
                    items: { type: string }
                  offer: { $ref: "#/components/schemas/PortalDiscoverTerms" }
                  reason:
                    type: string
                    pattern: "^(free_with_account|group:.+)$"
                    description: >
                      Why the account can add the product, always present (owner decision Q-6):
                      `free_with_account` (the `oidcDefault` auto-issue rule) or `group:<group>`
                      (a platform-IdP group mapped in the product's `groupRoleMap`). An open set:
                      clients show an unknown reason generically.
    PortalDiscoverTerms:
      type: object
      description: What adding the product would give, from the same policy that would mint it.
      required: [tier, tierLabel, deviceLimit, expiresAt, expiryDays]
      properties:
        tier: { type: [string, "null"] }
        tierLabel: { type: [string, "null"] }
        deviceLimit: { type: integer }
        expiresAt:
          type: [integer, "null"]
          description: "The expiry if minted now; null = never expires."
        expiryDays:
          type: [integer, "null"]
          description: "The tier's policy length in days; null = lifetime."
    PortalDiscoverClaim:
      type: object
      required: [added, product, license]
      properties:
        added:
          type: boolean
          description: "True when this call minted the licence; false when it was already held."
        product: { type: string }
        license:
          type: object
          required:
            [id, tier, tierLabel, status, usable, expiresAt, deviceLimit]
          properties:
            id: { type: string }
            tier: { type: [string, "null"] }
            tierLabel: { type: [string, "null"] }
            status: { type: string }
            usable: { type: boolean }
            expiresAt: { type: [integer, "null"] }
            deviceLimit: { type: integer }
    PortalProduct:
      allOf:
        - $ref: "#/components/schemas/PortalPresentation"
        - type: object
          required: [product, services, status, addedAt, licenses]
          properties:
            product: { type: string }
            services:
              type: object
              description: Each service slug and whether it is on for the product.
              additionalProperties: { type: boolean }
            status: { $ref: "#/components/schemas/PortalStatus" }
            addedAt: { type: [integer, "null"] }
            returnTo:
              type: object
              description: >
                Where the portal's focused flows may send the person back to (`?return=`).
                `origins` is the product's exact declared browser origins (`web.origins`); a
                return URL must match one exactly (scheme, host and port). `schemes` stays empty
                until the manifest can declare app schemes (S-16 I-15); until then a scheme
                return is refused and the flow ends on the product page.
              required: [origins, schemes]
              properties:
                origins: { type: array, items: { type: string } }
                schemes: { type: array, items: { type: string } }
            licenses:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/PortalLicenseSeats"
                  - type: object
                    required: [purchase, entitlements, devices]
                    properties:
                      purchase:
                        oneOf:
                          - type: "null"
                          - $ref: "#/components/schemas/PortalPurchase"
                        description: >
                          Where the licence came from (G8), read through License's
                          `licenseProvenance` hook; `null` while License is off for the product.
                      entitlements:
                        type: array
                        items:
                          type: object
                          required: [key, label, value]
                          properties:
                            key: { type: string }
                            label: { type: string }
                            value: {}
                      devices:
                        type: array
                        items:
                          type: object
                          required:
                            [
                              deviceId,
                              label,
                              platform,
                              arch,
                              appVersion,
                              firstSeen,
                              lastSeen,
                              dormant,
                            ]
                          properties:
                            deviceId: { type: string }
                            label: { type: [string, "null"] }
                            platform: { type: [string, "null"] }
                            arch: { type: [string, "null"] }
                            appVersion: { type: [string, "null"] }
                            firstSeen: { type: integer }
                            lastSeen: { type: integer }
                            dormant:
                              type: boolean
                              description: Past the dormancy window; holds no seat.
    FlatError:
      type: object
      description: >
        The LEGACY FLAT error body, built by `core/errors.ts`'s `errorResponse`: `error` is a
        STRING, not an object. Every handler that moved into the v3 service layout without
        changing its body still answers with this, so most of Core, all of License's
        non-document routes, the catalog, edge-mint, and the release/update surfaces speak it.
        Extras (`limit`, `deviceCount`, `drift`, `changed`) ride at the top level.
      required: [error]
      additionalProperties: true
      properties:
        error:
          type: string
          description: The stable error code.
        message: { type: string }
        limit:
          type: integer
          description: On `device_limit` — the seat cap.
        deviceCount:
          type: integer
          description: On `device_limit` — how many seats are already taken.
        drift:
          type: integer
          description: On `hardware_mismatch` — how many fingerprint components changed.
        changed:
          type: array
          description: On `hardware_mismatch` — which components changed.
          items: { $ref: "#/components/schemas/FingerprintComponent" }
      examples:
        - { error: unauthorized }
        - {
            error: device_limit,
            message: device limit reached,
            limit: 1,
            deviceCount: 1,
          }
    AllowedRange:
      type: object
      description: >
        The version window a blocked client may run within — the product's compat range
        intersected with the grant's own `app.minVersion`/`app.maxVersion`, tighter winning in
        both directions. BOTH fields are optional and either may be absent.
      properties:
        min: { type: string }
        max: { type: string }
      examples:
        - { min: "2.0.0", max: "99.0.0" }
        - { max: "2.0.0" }
    ManagedEntry:
      type: object
      description: >
        A managed value, its MDM-style management state, and when an admin last changed it.
        `enforced` means the server value wins; `hidden` means enforced AND withheld from
        user-facing enumeration; `default` means the client may override it.
      required: [state, value, updatedAt]
      properties:
        state: { type: string, enum: [default, enforced, hidden] }
        value:
          description: Any JSON value.
        updatedAt:
          type: integer
          description: Epoch SECONDS of the last admin change to this key.
      examples:
        - { state: enforced, value: dark, updatedAt: 1756252800 }
    FingerprintComponent:
      type: string
      description: >
        One hashed hardware signal. `machineUuid` is the ANCHOR: when it matches, drift
        tolerance widens by one. The order here is canonical — the composite digest is built
        by iterating it, so every SDK must use this order rather than a native map ordering.
      enum:
        [
          machineUuid,
          boardSerial,
          cpuModel,
          primaryMac,
          bootVolumeUuid,
          ramBucket,
          machineModel,
        ]
    FingerprintEnvelope:
      type: object
      description: >
        The optional hardware fingerprint on activate, enroll and register. Components the
        device could not read are OMITTED, never substituted with a placeholder, so a partial
        read degrades match precision instead of colliding with every other partial reader.
        Unknown component names are silently DROPPED (a newer SDK still activates), but a
        KNOWN component whose value is not exactly 22 base64url characters voids the whole
        fingerprint. A client-sent `hwid` is accepted and DISCARDED — the server recomputes
        it, because a forged one would let a caller collide with another device's dedupe key.
        The whole body is capped at 4 KiB; exceeding it means "no fingerprint", not an error.
        `deviceName` (PX-W13) is the device's label on activate and register: normalised as
        WIRE-CONTRACT-V4 §12.7.1 says, never rejected, and stored only while the device row has
        no label, so a console or portal rename always wins. Enroll ignores it.
      properties:
        deviceName:
          type: string
          description: The device label (WIRE-CONTRACT-V4 §12.7.1), display data only.
        fingerprint:
          type: object
          required: [components]
          properties:
            components:
              type: object
              minProperties: 1
              additionalProperties:
                type: string
                pattern: "^[A-Za-z0-9_-]{22}$"
              propertyNames:
                { $ref: "#/components/schemas/FingerprintComponent" }
            hwid:
              type: string
              description: Ignored. Recomputed server-side from the components.
      examples:
        - fingerprint:
            components:
              machineUuid: 4Sc9ItiFEQMbGXeAbXVdIw
              boardSerial: HkkgWaC6QKS4SdCUJf1vLQ
              cpuModel: 8UvzXqhwR0mDPPlgKtEQqA
    DiscoveryDocument:
      type: object
      description: >
        The unsigned capability document. `version` is this document's own version; the wire
        version is `protocolVersion`; the product's catalog version is `schemaVersion`. All
        three are deliberately different counters. `product` and `slug` are the same string,
        carried twice for client convenience.
      required:
        [
          version,
          protocolVersion,
          schemaVersion,
          product,
          slug,
          name,
          baseUrl,
          core,
          trust,
          services,
        ]
      properties:
        version: { type: integer, const: 2 }
        protocolVersion: { type: integer, const: 4 }
        schemaVersion: { type: integer }
        product: { type: string }
        slug: { type: string }
        name: { type: string }
        baseUrl:
          type: string
          format: uri
          description: The serving ORIGIN, with no product suffix.
        core:
          type: object
          required: [registration, compat, endpoints]
          properties:
            registration:
              type: string
              enum: [open, requires-identity, requires-license]
            compat:
              type: object
              properties:
                min: { type: string }
                max: { type: string }
            endpoints:
              type: object
              required: [discovery, jwks, trustManifest, devices, report]
              properties:
                discovery: { type: string, format: uri }
                jwks: { type: string, format: uri }
                trustManifest: { type: string, format: uri }
                devices: { type: string, format: uri }
                report: { type: string, format: uri }
                register:
                  type: string
                  format: uri
                  description: OMITTED when `registration` is `requires-license`.
        trust:
          type: object
          required:
            [
              jwksUrl,
              trustManifestUrl,
              cacheSeconds,
              pinnedKeys,
              signingKid,
              signingPub,
              keys,
            ]
          properties:
            jwksUrl: { type: string, format: uri }
            trustManifestUrl: { type: string, format: uri }
            cacheSeconds: { type: integer }
            pinnedKeys:
              type: object
              description: kid → base64url raw Ed25519 public key. The pin-once set.
              additionalProperties: { type: string }
            signingKid: { type: string }
            signingPub: { type: [string, "null"] }
            keys:
              type: array
              description: >
                Note this is a THIRD key spelling, distinct from both JWKS (`x`) and the trust
                manifest (no `active`). Empty when the product has no public signing key yet.
              items:
                type: object
                properties:
                  kid: { type: string }
                  alg: { type: string, const: EdDSA }
                  kty: { type: string, const: OKP }
                  crv: { type: string, const: Ed25519 }
                  publicKey: { type: string }
                  status: { type: string, enum: [active, staged, retired] }
                  active: { type: boolean }
        services:
          type: object
          description: >
            Every service slug, always, in canonical service-table order (the `required` list
            below; test/serviceTable.test.ts pins it to tools/services.json). Core knows the
            shape of no service: an enabled one contributes its own fragment verbatim, a
            disabled one is exactly `{"enabled": false}` and nothing else.
          required: [license, config, release, distribution, update, identity]
          properties:
            distribution: { $ref: "#/components/schemas/DistributionFragment" }
          additionalProperties: { $ref: "#/components/schemas/ServiceFragment" }
    ServiceFragment:
      type: object
      description: >
        A service's self-description. `{"enabled": false}` and NOTHING else when off — no
        endpoints, no configuration hints, nothing to distinguish "off" from "absent".
      required: [enabled]
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        endpoints:
          type: object
          additionalProperties: { type: string }
      examples:
        - { enabled: false }
        - enabled: true
          endpoints:
            document: https://key.plrs.im/djdl/config/document
            schema: https://key.plrs.im/djdl/config/schema
    DistributionFragment:
      description: >
        Distribution's fragment (P2b-01, P2b-04): how releases reach devices and outlets.
        `{"enabled": false}` when off, like every service. When on, `configured` is `true` when
        the product has a release configuration (Release's `releaseCatalog` answers one), so its
        byte routes can serve something; it is `false` otherwise, and every byte route then
        answers not-found. `endpoints` always carries the four canonical byte URLs (P2b-04):
        `download` (`/{product}/distribution/dl`, the legacy binary download) and `install`
        (`/{product}/distribution/install.sh`) on this origin; `builds` (templated
        `{selector}` and `{buildId}`) and `blobs` (templated `{sha256}`) on the bytes host when
        `BLOB_ORIGIN` is set, else on this origin. Release's fragment keeps its own `install`,
        `download`, `builds` and `blobs` keys, which name the permanent `/release/…` aliases.
      oneOf:
        - type: object
          required: [enabled]
          additionalProperties: false
          properties:
            enabled: { type: boolean, const: false }
        - type: object
          required: [enabled, configured, endpoints]
          additionalProperties: true
          properties:
            enabled: { type: boolean, const: true }
            configured: { type: boolean }
            endpoints:
              type: object
              additionalProperties: { type: string }
      examples:
        - { enabled: false }
        - enabled: true
          configured: true
          endpoints:
            download: https://key.plrs.im/djdl/distribution/dl
            install: https://key.plrs.im/djdl/distribution/install.sh
            builds: https://dl.plrs.im/djdl/distribution/builds/{selector}/{buildId}
            blobs: https://dl.plrs.im/djdl/distribution/blobs/sha256/{sha256}
        - enabled: true
          configured: false
          endpoints:
            download: https://key.plrs.im/acme/distribution/dl
            install: https://key.plrs.im/acme/distribution/install.sh
            builds: https://key.plrs.im/acme/distribution/builds/{selector}/{buildId}
            blobs: https://key.plrs.im/acme/distribution/blobs/sha256/{sha256}
    Jwks:
      type: object
      description: >
        The product's published verification keys — `active`, `staged` and `retired`, ordered
        active → staged → retired then newest first. `revoked` keys are never published.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, use, alg, kid, x]
            properties:
              kty: { type: string, const: OKP }
              crv: { type: string, const: Ed25519 }
              use: { type: string, const: sig }
              alg: { type: string, const: EdDSA }
              kid: { type: string }
              x:
                type: string
                description: The base64url raw public key — JOSE's spelling. The manifest calls the same value `publicKey`.
    TrustManifestPayload:
      type: object
      description: >
        The DECODED payload of `pkey-trust+jws`. Verified against PINNED keys only, on both
        the network and the cache-reload path; the discovered set is replaced wholesale on
        each success, so a key's ABSENCE is its revocation. Entries that are not
        EdDSA/OKP/Ed25519 are skipped rather than fatal — a future-alg key must not brick
        current verifiers.
      required:
        [
          schemaVersion,
          aud,
          iss,
          issuedAt,
          expiresAt,
          jwksUrl,
          cacheSeconds,
          keys,
        ]
      properties:
        schemaVersion: { type: integer, const: 1 }
        aud: { type: string }
        iss: { type: string, const: key.plrs.im }
        issuedAt: { type: integer }
        expiresAt: { type: integer }
        jwksUrl: { type: string, format: uri }
        cacheSeconds: { type: integer }
        keys:
          type: array
          items:
            type: object
            required: [kid, alg, kty, crv, publicKey, status]
            properties:
              kid: { type: string }
              alg: { type: string, const: EdDSA }
              kty: { type: string, const: OKP }
              crv: { type: string, const: Ed25519 }
              publicKey: { type: string }
              status:
                type: string
                description: >
                  Never `revoked` on the wire — a revoked key is pruned by disappearing.
                  `retired` and `staged` are trusted for verification.
                enum: [active, staged, retired]
      examples:
        - schemaVersion: 1
          aud: djdl
          iss: key.plrs.im
          issuedAt: 1756252800
          expiresAt: 1756253100
          jwksUrl: https://key.plrs.im/djdl/.well-known/jwks.json
          cacheSeconds: 300
          keys:
            - kid: test-kid
              alg: EdDSA
              kty: OKP
              crv: Ed25519
              publicKey: 3p9wKQ7WQ0xJm1Yy5cQhFhGx8t2fJcW0kLpNvR4sZ1A
              status: active
    DocProfile:
      type: object
      description: >
        The signed greeting block, so a client's offline "Hello, Ada" cannot be spoofed
        locally. Null name/email render as empty strings rather than nulls.
      required: [name, firstName, email, activatedAt]
      properties:
        name: { type: string }
        firstName: { type: string }
        email: { type: string }
        activatedAt:
          type: integer
          description: Epoch seconds the key was first activated.
    LicenseDocPayload:
      type: object
      description: >
        The DECODED payload of `pkey-license+jws` — the shared envelope plus the licence
        claims. `entitlements` is the ONLY carrier of grant data (D-20): tier and admin policy
        arrive here as ENFORCED entries (`license.tier`, `license.tierLabel`, `channels`,
        `app.minVersion`, `app.maxVersion`, `deviceLimit`) beside the catalog's own flags.
        Licence STATE (`ok`/`grace`/…) is never in the document; the client gate derives it.
        Carries no `config`, `secrets` or `payload`.
      required:
        [
          iss,
          aud,
          deviceId,
          issuedAt,
          expiresAt,
          graceUntil,
          licenseId,
          entitlements,
        ]
      properties:
        iss: { type: string, const: key.plrs.im }
        aud: { type: string }
        deviceId: { type: string }
        issuedAt: { type: integer }
        expiresAt:
          type: integer
          description: "`issuedAt + 3600` (DOC_EXPIRY_SECONDS) — short by design."
        graceUntil:
          type: integer
          description: "`issuedAt + maxOfflineDays × 86400` — the long, server-signed offline window."
        licenseId: { type: string }
        profile: { $ref: "#/components/schemas/DocProfile" }
        entitlements:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ManagedEntry" }
      examples:
        - iss: key.plrs.im
          aud: djdl
          deviceId: dev-1
          issuedAt: 1756252800
          expiresAt: 1756256400
          graceUntil: 1758844800
          licenseId: lic_djdl_1
          profile:
            {
              name: Ada Lovelace,
              firstName: Ada,
              email: ada@example.com,
              activatedAt: 1690000000,
            }
          entitlements:
            polarisVpn: { state: default, value: true, updatedAt: 1756252800 }
            license.tier: { state: enforced, value: pro, updatedAt: 1756252800 }
            channels:
              { state: enforced, value: [stable, beta], updatedAt: 1756252800 }
            deviceLimit: { state: enforced, value: 3, updatedAt: 1756252800 }
    ConfigDocPayload:
      type: object
      description: >
        The DECODED payload of `pkey-config+jws`. FLAT: `config` and `secrets` sit beside the
        envelope claims, not under a wrapper. Contains no licence fields whatsoever — that is
        the wire-level guarantee of service independence (D-08), since a config-enabled,
        licence-disabled product issues these to any registered device.
      required:
        [
          iss,
          aud,
          deviceId,
          issuedAt,
          expiresAt,
          graceUntil,
          schemaVersion,
          config,
          secrets,
        ]
      properties:
        iss: { type: string, const: key.plrs.im }
        aud: { type: string }
        deviceId: { type: string }
        issuedAt: { type: integer }
        expiresAt: { type: integer }
        graceUntil: { type: integer }
        schemaVersion:
          type: integer
          description: The product's active CATALOG version, not the wire protocol version.
        config:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ManagedEntry" }
        secrets:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ManagedEntry" }
      examples:
        - iss: key.plrs.im
          aud: djdl
          deviceId: dev-1
          issuedAt: 1756252800
          expiresAt: 1756256400
          graceUntil: 1758844800
          schemaVersion: 7
          config:
            app.theme: { state: enforced, value: dark, updatedAt: 1756252800 }
          secrets: {}
    DeviceView:
      type: object
      description: >
        A device row as the wire renders it (`shapeDevice`). The token hash, seat number,
        stored overrides and last telemetry blob are deliberately NOT exposed. `licenseId` is
        the empty string for a device registered without a licence.
      required:
        [
          id,
          licenseId,
          label,
          status,
          current,
          firstSeen,
          lastSeen,
          userAgent,
          platform,
          arch,
          appVersion,
          sdkName,
          sdkVersion,
        ]
      properties:
        id: { type: string }
        licenseId:
          type: string
          description: Empty string for a registered-without-license device.
        label: { type: [string, "null"] }
        status: { type: string, enum: [authorized, deauthorized] }
        current:
          type: boolean
          description: True when this row is the calling token's own device.
        firstSeen: { type: integer }
        lastSeen: { type: integer }
        userAgent: { type: [string, "null"] }
        platform: { type: [string, "null"] }
        arch: { type: [string, "null"] }
        appVersion: { type: [string, "null"] }
        sdkName: { type: [string, "null"] }
        sdkVersion: { type: [string, "null"] }
    DeviceRoster:
      type: object
      description: >
        The seat pool as this caller may see it: every device on the licence for a licensed
        token, or a one-element list for a device registered without one.
      required: [currentDeviceId, devices]
      properties:
        currentDeviceId: { type: string }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceView" }
    DeviceRenameRequest:
      type: object
      description: >
        The only writable device field. Trimmed and truncated to 120 characters; a non-string,
        empty or absent value CLEARS the label to null rather than erroring.
      properties:
        label: { type: [string, "null"], maxLength: 120 }
    DeviceUpdateResult:
      type: object
      required: [ok, device]
      properties:
        ok: { type: boolean, const: true }
        device: { $ref: "#/components/schemas/DeviceView" }
    OkResult:
      type: object
      description: The bare acknowledgement several mutating routes answer with.
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    DeviceProbeResult:
      type: object
      description: A product-DECLARED companion-application check, answered by the client.
      required: [present]
      properties:
        present: { type: boolean }
        version: { type: string, maxLength: 64 }
    FactsReport:
      type: object
      description: >
        The device's software snapshot. Deliberately narrow: no installed-app enumeration,
        only product-declared probes. Twenty-one top-level keys survive the allowlist and
        anything else is dropped silently. The first six are projected into typed columns
        (strings truncated to 128 characters); the rest are stored as an opaque blob, with
        `engine`, `outlet`, `content`, `updates`, `caps` and `packInstalls` bounded first.
      additionalProperties: false
      properties:
        os:
          type: object
          required: [name]
          properties:
            name: { type: string, maxLength: 128 }
            version: { type: string, maxLength: 128 }
            build: { type: string, maxLength: 128 }
            kernel: { type: string, maxLength: 128 }
        hardware:
          type: object
          properties:
            cpuModel: { type: string, maxLength: 128 }
            cpuCores: { type: integer }
            ramMb: { type: integer }
            machineModel: { type: string, maxLength: 128 }
        runtime:
          type: object
          required: [name, version]
          properties:
            name: { type: string, maxLength: 128 }
            version: { type: string, maxLength: 128 }
        locale: { type: string, maxLength: 128 }
        timezone: { type: string, maxLength: 128 }
        probes:
          type: object
          description: >
            At most 32 entries; probe ids are truncated to 64 characters and an entry whose
            `present` is not a boolean is skipped.
          maxProperties: 32
          additionalProperties:
            { $ref: "#/components/schemas/DeviceProbeResult" }
        sdk: { type: string }
        sdkVersion: { type: string }
        appVersion: { type: string }
        platform: { type: string }
        arch: { type: string }
        gate:
          type: object
          description: Opaque pass-through — the client's own gate verdict, stored unparsed.
          additionalProperties: true
        config:
          type: object
          description: Opaque pass-through.
          additionalProperties: true
        entitlements:
          type: object
          description: Opaque pass-through.
          additionalProperties: true
        timestamp: { type: integer }
        engine:
          type: object
          description: >
            A game engine's build facts (the Godot SDK). Only these fields are kept; strings
            are truncated to 128 characters, `debug` is kept only as a boolean, and any
            other field is dropped.
          additionalProperties: false
          properties:
            id:
              type: string
              maxLength: 128
              description: The engine in the requirements form, such as `godot-4.7`.
            version: { type: string, maxLength: 128 }
            renderer: { type: string, maxLength: 128 }
            videoAdapter: { type: string, maxLength: 128 }
            videoVendor: { type: string, maxLength: 128 }
            videoApi: { type: string, maxLength: 128 }
            display: { type: string, maxLength: 128 }
            debug: { type: boolean }
        outlet:
          type: string
          maxLength: 64
          description: >
            Where the install came from (`direct`, `steam`, `itch`, `app-store`, …): the
            build stamp's outlet, refined on the device by outlet detection. An outlet id or
            kind only, never a raw signal, and absent when unknown. Truncated to 64
            characters; the id itself is not validated.
        content:
          type: object
          description: >
            P4-02 (plans/P4-01.md §2.11): the running build's packs. `packSetId` is the active
            pack set's id (the SHA-256 of its `<packId> <recordSha256>` lines); `appRelease` the
            running app release's record hash, when the SDK has verified it. Only these two are
            kept, each only when it is 64 lowercase hex.
          additionalProperties: false
          properties:
            packSetId: { type: string, pattern: "^[0-9a-f]{64}$" }
            appRelease: { type: string, pattern: "^[0-9a-f]{64}$" }
        updates:
          type: array
          maxItems: 16
          description: >
            Update outcome events (P6-03; the names are the `updateEvent` enum of
            `conformance/parity/enums.json`). At most 16 are read; an entry that does not match
            this schema, or names another event, is dropped and the rest are kept. Counted per
            (deliverable, release, outlet, channel, event) and deduplicated on (device,
            `eventId`). An `at` in the future counts as now; one older than 30 days is not
            counted. An `outlet` the product does not declare is shown as `unknown` and never
            trips the auto-halt. No hardware value and no user identifier is carried.
          items: { $ref: "#/components/schemas/UpdateOutcomeEvent" }
        caps:
          type: array
          maxItems: 128
          description: >
            The SDK's capability list (P1b-10, PARITY §2.2): the parity feature ids its
            `supports()` answers Supported for right now, in registry order. Each kept entry
            is a feature id of at most 64 characters; other entries and duplicates are
            dropped, ids are not checked against the registry, and a non-array value is
            dropped. Sent with every report, since a report overwrites the last one.
          items:
            type: string
            maxLength: 64
            pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9]*)+$"
        packInstalls:
          type: array
          maxItems: 8
          description: >
            Recent pack installs (P4-17, CONTENT §8.1), the input of lazy hot-pair deltas. At most
            8 are read; an entry that does not match this schema is dropped and the rest are
            kept. For a product that opted in, each (pack, from, to) counts once per device;
            when at least 25 devices (configurable per product) moved between the same two
            payloads without a delta within 7 days, the Worker may generate one off the request
            path. An entry whose `strategy` is `delta` is not counted as demand. No hardware value
            and no user identifier is carried.
          items: { $ref: "#/components/schemas/PackInstall" }
    PackInstall:
      type: object
      description: One pack install a device reports (P4-17).
      required: [pack, from, to, strategy]
      additionalProperties: false
      properties:
        pack:
          type: string
          maxLength: 64
          pattern: "^[a-z][a-z0-9-]*(\\.[a-z0-9-]+)*$"
          description: The pack id (its deliverable id).
        from:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The installed release's `payload.sha256` before the install.
        to:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The new release's `payload.sha256`.
        strategy:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
          description: The strategy that installed it (`delta`, `chunk`, `file`, `full`, …).
        bytes: { type: integer, minimum: 0, description: Bytes downloaded. }
        durationMs: { type: integer, minimum: 0 }
        fallbackUsed:
          type: boolean
          description: A strategy failed first and a fallback installed it.
        failureStage:
          type: string
          maxLength: 128
          description: Where the first strategy failed, when one did (printable ASCII).
    UpdateOutcomeEvent:
      type: object
      description: One update outcome event a device reports (P6-03).
      required: [eventId, event, deliverable, release, outlet, channel, at]
      additionalProperties: false
      properties:
        eventId:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
          description: Client-chosen, unique per event; the dedupe key with the device id.
        event:
          type: string
          enum:
            [
              update_offered,
              update_downloaded,
              update_applied,
              update_confirmed,
              update_reverted,
              pack_failed,
              boot_rolled_back,
            ]
        deliverable:
          type: string
          maxLength: 64
          pattern: "^[a-z][a-z0-9-]*(\\.[a-z0-9-]+)*$"
          description: "`app`, or a pack id."
        release:
          type: string
          pattern: "^[A-Za-z0-9._+@:/-]{1,128}$"
          description: The release id the event is about (the feed's `releaseId`).
        fromRelease:
          type: string
          pattern: "^[A-Za-z0-9._+@:/-]{1,128}$"
          description: The release the device moved from, when there was one.
        outlet:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,63}$"
          description: The outlet the build came through (the build stamp's outlet id).
        channel:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        packSetId:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        at: { type: integer, minimum: 1, description: Epoch seconds. }
        code:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
          description: A short machine-readable reason (`pack_failed`, `update_reverted`).
    AttestChallenge:
      type: object
      required: [challenge, requestHash, expiresAt]
      additionalProperties: false
      properties:
        challenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        requestHash:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: base64url(SHA-256("pkey-attest/1:<product>:<deviceId>:<challenge>"))
        expiresAt: { type: integer, description: Epoch seconds. }
        play:
          type: object
          required: [cloudProjectNumber]
          additionalProperties: false
          properties:
            cloudProjectNumber: { type: string, pattern: "^[0-9]{1,20}$" }
    AttestRequest:
      oneOf:
        - type: object
          required: [kind, keyId, attestation, challenge]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [app-attest] }
            keyId:
              type: string
              maxLength: 64
              description: The key id exactly as DCAppAttestService returned it (base64).
            attestation:
              type: string
              description: The attestation object (CBOR), base64.
            challenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        - type: object
          required: [kind, token, challenge]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [play-integrity] }
            token:
              type: string
              maxLength: 16384
              description: The token from a STANDARD Play Integrity request made with `requestHash`.
            challenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    AttestResult:
      type: object
      required: [trustLevel, kind, attestedAt]
      additionalProperties: false
      properties:
        trustLevel: { type: string, enum: [attested] }
        kind: { type: string, enum: [app-attest, play-integrity] }
        attestedAt: { type: integer, description: Epoch seconds. }
    RegistrationResult:
      type: object
      description: Keyless registration's answer — the token and the device id it is bound to.
      required: [token, deviceId]
      properties:
        token: { type: string, pattern: "^pkeyt_[A-Za-z0-9_-]{43,}$" }
        deviceId: { type: string }
    LicenseView:
      type: object
      description: >
        A licence row as activation and enrollment render it (`shapeLicense`). `channels` is
        always an array — `[]` when the row carries none. The identity link, groups, stored
        overrides and enrollment hwid are not exposed.
      required:
        [
          id,
          status,
          name,
          email,
          tierId,
          activatedAt,
          expiresAt,
          maxOfflineDays,
          channels,
          minVersion,
          maxVersion,
        ]
      properties:
        id: { type: string }
        status: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        tierId: { type: [string, "null"] }
        activatedAt: { type: integer }
        expiresAt: { type: [integer, "null"] }
        maxOfflineDays: { type: [integer, "null"] }
        channels:
          type: array
          items: { type: string }
        minVersion: { type: [string, "null"] }
        maxVersion: { type: [string, "null"] }
    ActivationResult:
      type: object
      description: >
        What `/license/activate` and `/license/enroll` both answer with — the same four fields
        in the same order, so an SDK has one code path for "I now hold a seat". `schemaVersion`
        is the product's CATALOG version, which is what tells the client whether its cached
        catalog is stale.
      required: [token, schemaVersion, device, license]
      properties:
        token: { type: string, pattern: "^pkeyt_[A-Za-z0-9_-]{43,}$" }
        schemaVersion: { type: integer }
        device: { $ref: "#/components/schemas/DeviceView" }
        license: { $ref: "#/components/schemas/LicenseView" }
    TokenResult:
      type: object
      description: >
        The re-acquire answer. Deliberately narrower than `ActivationResult`: rotating a
        token is not a re-activation, so no device or licence view is re-sent.
      required: [token, schemaVersion]
      properties:
        token: { type: string, pattern: "^pkeyt_[A-Za-z0-9_-]{43,}$" }
        schemaVersion: { type: integer }
    ProductCatalog:
      type: object
      description: The public config catalog — the product's declared settings surface.
      required: [schemaVersion, entries]
      properties:
        schemaVersion: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ConfigEntry" }
    ConfigEntry:
      type: object
      description: >
        One catalog entry. Note `kind`, not `type` — the JSON Schema for the VALUE lives under
        `schema`. Secrecy is expressed by `kind: "secret"`, with the optional `secret` flag as
        a hint.
      required: [key, kind, category, label, description, schema]
      properties:
        key: { type: string, description: The dotted catalog key. }
        kind: { type: string, enum: [config, secret, flag] }
        category: { type: string }
        label: { type: string }
        description: { type: string }
        schema:
          type: object
          description: A Draft-07 subset describing the value.
          additionalProperties: true
        examples: { type: array }
        default: {}
        secret: { type: boolean }
        managementDefault:
          type: string
          description: CONFIG entries only.
          enum: [default, enforced, hidden]
        userGrant: { type: boolean }
        grantLabel: { type: string }
        ui:
          type: object
          properties:
            widget:
              {
                type: string,
                enum: [password, select, textarea, switch, stepper],
              }
            help: { type: string }
            placeholder: { type: string }
            order: { type: integer }
            scopes:
              {
                type: array,
                items: { type: string, enum: [profile, license, device] },
              }
            advanced: { type: boolean }
            unit: { type: string }
            optionLabels:
              { type: object, additionalProperties: { type: string } }
            adminSection: { type: string }
        dependsOn:
          type: object
          required: [key, equals]
          properties:
            key: { type: string }
            equals: {}
        appliesTo: { type: array, items: { type: string, enum: [cli, app] } }
        accessor:
          {
            type: string,
            description: A dotted path into the client's own config object.,
          }
        deprecated: { type: boolean }
        since: { type: string }
    MintedToken:
      type: object
      description: >
        An edge-mint result. `expiresAt` is the same epoch-seconds value as the token's own
        `exp`, surfaced so a caller need not decode the token to schedule a refresh.
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: integer }
    ChangelogEntry:
      type: object
      required: [version, tag, date, summary, url]
      properties:
        version:
          type: string
          description: The tag with one leading `v` stripped.
        tag:
          type: string
          description: GitHub's `tag_name`, verbatim.
        date:
          type: [string, "null"]
          description: ISO-8601 publication time, or null.
        summary:
          type: [string, "null"]
          description: >
            The curated `pkey:summary` block if present, else the first prose paragraph above
            the first `##` heading, markdown-stripped and capped at 600 characters.
        url: { type: string, format: uri }
    Changelog:
      type: object
      description: Up to 50 non-draft releases, newest first.
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ChangelogEntry" }
    VersionCheck:
      type: object
      description: >
        The newest release on the requested channel. The legacy answer is the three strings;
        the extended answer (P3-09, `?platform=` …) adds the build's facts.
      required: [version, tag, url]
      properties:
        version:
          { type: string, description: The tag with one leading `v` stripped. }
        tag: { type: [string, "null"] }
        url: { type: string, format: uri }
        build:
          { type: [string, "null"], description: "P3-09: the build number." }
        sha256:
          {
            type: [string, "null"],
            description: "P3-09: the payload's SHA-256.",
          }
        size:
          { type: [integer, "null"], description: "P3-09: the payload's size." }
        downloadUrl:
          {
            type: string,
            format: uri,
            description: "P3-09: the immutable download URL.",
          }
        minOS:
          {
            type: [string, "null"],
            description: "P3-09: the build's minimum OS.",
          }
        critical:
          {
            type: boolean,
            description: "P3-09: the channel's critical pointer release.",
          }
    ManagedPayload:
      type: object
      description: >
        The fused browser-session payload. `secrets` is ALWAYS empty on this surface — a page
        is not a secret-delivery target.
      required: [config, secrets, entitlements]
      properties:
        config:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ManagedEntry" }
        secrets:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ManagedEntry" }
        entitlements:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ManagedEntry" }
    FusedSessionDoc:
      type: object
      description: >
        The FUSED v2 shape — licence claims, config, secrets and entitlements in ONE artifact,
        served UNSIGNED as JSON. Wire v3 split this into `pkey-license+jws` +
        `pkey-config+jws`; the browser session is the last minter, and this schema goes with it
        when the React SDK migrates. `deviceId` is always `browser:<licenseId>`.
      required:
        [
          schemaVersion,
          aud,
          iss,
          licenseId,
          deviceId,
          issuedAt,
          expiresAt,
          graceUntil,
          profile,
          payload,
        ]
      properties:
        schemaVersion: { type: integer }
        aud: { type: string }
        iss: { type: string, const: key.plrs.im }
        licenseId: { type: string }
        deviceId: { type: string }
        issuedAt: { type: integer }
        expiresAt: { type: integer }
        graceUntil: { type: integer }
        profile: { $ref: "#/components/schemas/DocProfile" }
        payload: { $ref: "#/components/schemas/ManagedPayload" }
    BrowserSessionResponse:
      type: object
      description: >
        Always HTTP 200. `authenticated:false` with a null `doc` covers no cookie, an unknown
        session and a dead device alike; `authenticated:true` with a null `doc` plus `blocked`
        is the build gate's refusal. `csrfToken` appears only on the authenticated forms.
      required: [authenticated, doc]
      properties:
        authenticated: { type: boolean }
        doc:
          oneOf:
            - { $ref: "#/components/schemas/FusedSessionDoc" }
            - { type: "null" }
        blocked:
          type: object
          description: Present only when the build gate refused this build.
          required: [reason]
          properties:
            reason:
              {
                type: string,
                enum: [version-too-old, version-too-new, channel-not-entitled],
              }
            allowedRange: { $ref: "#/components/schemas/AllowedRange" }
        csrfToken:
          type: string
          description: Echo this back in `X-CSRF-Token` to log out.
          pattern: "^csrf_[A-Za-z0-9_-]+$"
    SessionFromLicenseRequest:
      type: object
      description: >
        The licence key to exchange. When `key` is absent or not a string the handler falls
        back to `Authorization: Bearer`.
      properties:
        key: { type: string, pattern: "^pkey_[a-z0-9-]+_.+$" }
    AuthFlowState:
      type: object
      description: >
        The polled state of a sign-in flow, at HTTP 200 in every case. `error` carries NO
        reason: an unauthenticated poller learns that it failed, not why. A `ready` poll
        deletes the flow record, so the poll after it is `timeout`.
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirm, ready, timeout, error]
          description: >
            `confirm` is `deviceAuthPoll` only, answered to a poll that asked to confirm the
            identity (`confirmIdentity` / `attachLicense`) once the player has signed in.
        token:
          type: string
          description: Present only on `ready`.
          pattern: "^pkeyt_[A-Za-z0-9_-]{43,}$"
        schemaVersion:
          type: integer
          description: Present only on `ready` — the product's catalog version.
        identity:
          type: object
          description: >
            On `confirm`, and on a device-code flow's `ready`: who signed in, for the device to
            show the player. `email` only when the IdP verified it; never the subject or groups.
          properties:
            name: { type: string }
            email: { type: string }
        attachable:
          type: boolean
          description: >
            On `confirm`: the poll's bearer is a live token of the flow's device on an anonymous,
            usable enrolled licence, so `attachLicense: true` would attach it, and that the
            attach keeps the identity's licence within its device limit as the activation will
            leave it (the identity's mapped tier and provisioned overrides): every authorized
            device on the anonymous licence (dormant ones included), plus on a migrate the
            identity licence's seat-holding devices, fits that limit. Always `false` when the identity's tier has fingerprint
            mode `strict`, because the mint would be refused.
        attached:
          type: string
          enum: [claimed, migrated]
          description: >
            On `ready` after `attachLicense: true`: the anonymous licence became the identity's
            (`claimed`), or every device on it moved onto the identity's licence and the
            anonymous one was retired (`migrated`).
    SlowDown:
      type: object
      description: >
        Returned at HTTP 429 by `deviceAuthPoll` when the client polled faster than the
        advertised interval. A flow STATE, not an error body — the field is `status`, and
        there is no `error` key at all.
      required: [status, interval]
      properties:
        status: { type: string, const: slow_down }
        interval:
          { type: integer, description: Seconds to wait before the next poll. }
    DeviceAuthStartRequest:
      type: object
      description: >
        Both fields optional; an empty body is legal. The device id is taken from `deviceId`,
        then the `X-PKey-Device` header, then `?device=`.
      properties:
        deviceId: { type: string }
        deviceName:
          type: string
          description: The device label (WIRE-CONTRACT-V4 §12.7.1), normalised and never rejected; shown to the human on the sign-in page as reported by the device.
    DeviceAuthStartResult:
      type: object
      description: >
        RFC 8628 in shape, camelCase in spelling. `userCode` is independent of `deviceCode`;
        `verificationUri` is the user-code entry page and `verificationUriComplete` the same page
        with `?user_code=` pre-filled, and neither carries the device code. `pollUrl` and
        `status` are additions RFC 8628 does not define.
      required:
        [
          status,
          deviceCode,
          userCode,
          verificationUri,
          verificationUriComplete,
          expiresIn,
          interval,
          pollUrl,
        ]
      properties:
        status: { type: string, const: pending }
        deviceCode: { type: string }
        userCode:
          type: string
          pattern: "^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$"
          description: RFC 8628 §6.1's consonant alphabet, eight characters, shown as `XXXX-XXXX`.
        verificationUri:
          type: string
          format: uri
          description: The code-entry page, `<origin>/<product>/identity/auth/device`.
        verificationUriComplete:
          type: string
          format: uri
          description: The entry page with the code filled in — `…/identity/auth/device?user_code=XXXX-XXXX`.
        expiresIn: { type: integer, description: Seconds — 600. }
        interval: { type: integer, description: Seconds between polls — 2. }
        pollUrl: { type: string, format: uri }
        deviceName:
          type: [string, "null"]
          description: >
            PX-W13: the stored, normalised device label (WIRE-CONTRACT-V4 §12.7.1), or null when
            the device sent none. An older Worker omits the member; a client then shows its own
            label.
    DeviceAuthConfirmRequest:
      type: object
      description: >
        The single-use token the GET page embedded in its hidden `csrf` field. Accepted as a
        form field or, when the `content-type` says JSON, as this property.
      required: [csrf]
      properties:
        csrf: { type: string }
    DeviceAuthEntryRequest:
      type: object
      description: >
        What the user-code page's two forms submit. `user_code` alone is a lookup (render the
        confirmation page); `user_code` with a `csrf` field is a confirmation.
      required: [user_code]
      properties:
        user_code:
          {
            type: string,
            description: Case-insensitive; spaces and hyphens ignored.,
          }
        csrf:
          {
            type: string,
            description: The single-use token the confirmation page embedded.,
          }
    DeviceAuthPollRequest:
      type: object
      description: >
        `deviceCode` and `deviceId` are both required; the spelling `state` is accepted as an
        alias for `deviceCode`. `confirmIdentity` and `attachLicense` are the opt-in attach
        (P1-07); without them the poll completes as an ordinary sign-in.
      required: [deviceId]
      properties:
        deviceCode: { type: string }
        state: { type: string, description: Accepted alias for `deviceCode`. }
        deviceId: { type: string }
        confirmIdentity:
          type: boolean
          description: >
            Answer `confirm` (the signed-in identity, nothing minted) instead of `ready`, so the
            device can show the identity and the player can accept it first.
        attachLicense:
          type: boolean
          description: >
            The player's decision, sent after a `confirm`: `true` attaches the anonymous enrolled
            licence the bearer is on, `false` signs in without attaching.
