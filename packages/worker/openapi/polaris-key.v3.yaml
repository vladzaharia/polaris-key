        "403":
          description: >
            A cross-site request, or a missing/mismatched `csrf` — LEGACY FLAT. One message for
            both, deliberately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                confirmationFailed:
                  { value: { error: forbidden, message: confirmation failed } }
        "404":
          description: Unknown or lapsed device code, or the flow record is gone — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                expired:
                  { value: { error: not_found, message: device code expired } }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429":
          description: 60 requests per 60 s per client IP — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                limited:
                  { value: { error: rate_limited, message: too many requests } }
  /{product}/identity/auth/device/poll:
    post:
      operationId: deviceAuthPoll
      tags: [identity]
      summary: Poll the device-code flow
      description: >
        The same four flow states as `authPoll`, requested with a body instead of a query
        string: `deviceCode` (the spelling `state` is accepted for the same value) and
        `deviceId`. RFC 8628's error codes are NOT used — `pending` stands in for
        `authorization_pending`, `timeout` for `expired_token`, `error` for `access_denied`.


        `slow_down` is the exception and it is unusual: polling inside the advertised
        `interval` answers HTTP 429 whose body is a STATE, `{"status":"slow_down","interval":2}`,
        not an error body. The OTHER 429 on this route — the ordinary per-IP/per-code rate
        limit — answers the LEGACY FLAT `rate_limited` instead, so a client must branch on the
        body, not the status.


        The sign-in callback activates nothing for a device-code flow: it stores the verified
        identity, and the poll that completes the flow activates it. An ordinary poll then yields
        the identity's own licence (or a new one) and nothing else, and its `ready` carries the
        `identity` (name, verified e-mail) for the device to show the player.


        **Opt-in attach** (P1-07). A device that is on an anonymous enrolled licence can offer
        the player to attach it to the account. Its polls send `confirmIdentity: true` (and the
        device token as a bearer): once the player has signed in, the answer is `confirm` with
        the `identity` and whether this device's licence is `attachable`, and nothing is minted.
        The device shows the identity; after the player accepts it ON THE DEVICE, the next poll
        sends `attachLicense: true` (or `false` to sign in without attaching) with the same
        bearer. Only then does the Worker claim the anonymous licence for the identity (no licence
        yet), or move every device on the anonymous licence onto the identity's licence and
        retire the anonymous one, and `ready` reports `attached`. The bearer must be a live token
        of the device the flow was started for, on an anonymous, usable enrolled licence. The
        attach never takes the identity's licence past its device limit, measured as the licence
        will be after the activation rewrites its tier and overrides to the identity's mapped
        tier and provisioning: a claim is attachable only while every authorized device on the
        anonymous licence (dormant ones too) fits that limit, and a migrate only while those
        devices plus the identity licence's seat-holding devices do. Nothing is attachable when the identity's tier has
        fingerprint mode `strict`: this poll presents no fingerprint, so its mint would be
        refused, and the attach is never committed for a mint that cannot succeed. A decision sent before the device was shown the
        identity, or an attach with nothing attachable, is answered with `confirm` again and
        changes nothing. A user-code holder cannot reach any of this: it needs the device code.
        The flow's starter can, which is why the open R1-07 (no browser binding) also covers
        this decision.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: Authorization
          in: header
          required: false
          description: >
            `Bearer pkeyt_…` — the device's current token, read only with `confirmIdentity` or
            `attachLicense`, to find the anonymous enrolled licence the opt-in attach names.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceAuthPollRequest" }
            examples:
              poll:
                summary: test/oidcEdge.test.ts
                value: { deviceCode: Zk8LqR8nT0sYp2vcEgHj6A, deviceId: dev-1 }
              confirmIdentity:
                summary: test/attack/R8-oidc.test.ts — hold at the identity (opt-in attach)
                value:
                  {
                    deviceCode: Zk8LqR8nT0sYp2vcEgHj6A,
                    deviceId: victim-game,
                    confirmIdentity: true,
                  }
              attach:
                summary: test/attack/R8-oidc.test.ts — the player accepted on the device
                value:
                  {
                    deviceCode: Zk8LqR8nT0sYp2vcEgHj6A,
                    deviceId: victim-game,
                    attachLicense: true,
                  }
      responses:
        "200":
          description: Flow state / activation result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthFlowState" }
              examples:
                pending: { value: { status: pending } }
                confirm:
                  summary: test/attack/R8-oidc.test.ts — signed in; nothing minted yet
                  value:
                    status: confirm
                    identity: { name: Player, email: player@example.com }
                    attachable: true
                ready:
                  summary: test/oidcEdge.test.ts — the flow record is deleted by this call
                  value:
                    status: ready
                    token: pkeyt_Zk8LqR8nT0sYp2vcEgHj6Bf3QdNwXr7uKmA1sVe9tYo
                    schemaVersion: 1
                    identity: { name: Player, email: player@example.com }
                readyAttached:
                  summary: "test/attack/R8-oidc.test.ts — after `attachLicense: true`"
                  value:
                    status: ready
                    token: pkeyt_Zk8LqR8nT0sYp2vcEgHj6Bf3QdNwXr7uKmA1sVe9tYo
                    schemaVersion: 1
                    identity: { name: Player, email: player@example.com }
                    attached: claimed
                timeout: { value: { status: timeout } }
                error: { value: { status: error } }
        "400":
          description: Unparseable body, or a missing `deviceCode`/`deviceId` — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                invalidJson:
                  { value: { error: bad_request, message: invalid json } }
                missing:
                  {
                    value:
                      {
                        error: bad_request,
                        message: missing deviceCode/deviceId,
                      },
                  }
        "401":
          description: The `deviceId` is not the one the flow was started for — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
              examples:
                mismatch:
                  { value: { error: unauthorized, message: device mismatch } }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429":
          description: >
            TWO different bodies at this status. Polling faster than `interval` returns the
            flow STATE `slow_down`; exceeding 120 polls per 60 s per IP (or 40 per code)
            returns the LEGACY FLAT `rate_limited`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/SlowDown" }
                  - { $ref: "#/components/schemas/FlatError" }
              examples:
                slowDown:
                  summary: test/attack/R8-oidc.test.ts — a state, not an error
                  value: { status: slow_down, interval: 2 }
                rateLimited:
                  value: { error: rate_limited, message: too many requests }
    options:
      operationId: preflightDeviceAuthPoll
      tags: [identity]
      summary: CORS preflight
      description: >
        Browser preflight for a page on one of the product's `web.origins`. Answered
        before service dispatch, so the result never depends on whether the service
        behind this path is enabled. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

