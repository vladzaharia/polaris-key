  /{product}/update/version:
    get:
      operationId: getLatestVersion
      tags: [update]
      summary: Latest-version check
      description: >
        The newest release on the requested channel (default `stable`), as three strings.
        `?channel=` accepts the same vocabulary as a channel appcast path segment — held to
        the same `[a-z0-9-]` alphabet, refused 404 beyond it, resolved 404 for a well-formed
        unknown name — and the entitled gate evaluates it exactly as it does a path channel.
        `?arch=` is accepted and discarded: the answer names a release, not an asset. Gated
        by the METADATA access mode, which is why a product can leave this open while
        closing its appcasts. `version` is the tag with one leading `v` stripped; `tag` is
        GitHub's verbatim.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: channel
          in: query
          required: false
          description: "Channel to check (default stable): stable, beta, pr-<n>, or a manifest-declared manual channel."
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: "Version info. `cache-control: public, max-age=120`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionCheck" }
              examples:
                latest:
                  summary: test/release.test.ts
                  value:
                    version: 1.9.0
                    tag: v1.9.0
                    url: https://github.com/acme/djdl/releases/tag/v1.9.0
        "401": { $ref: "#/components/responses/ReleaseUnauthorized" }
        "403": { $ref: "#/components/responses/ReleaseForbidden" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "429": { $ref: "#/components/responses/ReleaseRateLimited" }
        "503": { $ref: "#/components/responses/UpstreamRateLimited" }
    options:
      operationId: preflightGetLatestVersion
      tags: [update]
      summary: CORS preflight
      description: >
