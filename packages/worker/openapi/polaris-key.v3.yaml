        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/blobs/sha256/{sha256}:
    get:
      operationId: downloadBlob
      tags: [distribution]
      summary: Download a content-addressed object
      description: >
        P2-05; P2b-04 moved it to Distribution (`/{product}/release/blobs/…` is its permanent
        alias, on both hosts). One content-addressed object of THIS product's blob store, by
        its stored SHA-256: an app artifact, a registered feed file, or any object of a pack
        release (its `full` payload, files index and gaps, deltas and file blobs; P4-05 — the
        ONLY route that serves a pack's bytes). Authorised by the object's HOLDERS (`blob_refs`
        of this product; another product's copy of the same bytes does not count, and the
        answer is the same plain not-found as an unknown hash). The public key
        `blobs/sha256/{sha256}` is tried first and never reads the gated prefix; the gated key
        `gated/blobs/sha256/{sha256}` holds only the objects of a pack published while it was
        gated. An app artifact follows the strictest delivery access of the deliverables whose
        releases carry the digest, as before (under `entitled`, an app release carrying it must
        pass the caller's window). A pack's object follows the PACK's delivery access
        (`dist_access`, never the app's version window); under the gated prefix, or under an
        `entitled` mode, it needs the pack's CURRENT gate — the licence flag in its own
        `dist_access.entitlement`, never the manifest's assertion or a record's `entitlement` —
        held by the device token's licence (`401 unauthorized` without a usable licence, `403
        not_entitled` without the flag). An `entitled` pack with no gate is refused outright
        (`403 delivery_gate_missing`, fail-closed). `ETag` is the SHA-256 and `Repr-Digest`
        covers the whole representation (also on a 206); a single `Range`, `If-Range` (on the
        strong ETag, evaluated by the Worker) and `If-None-Match` are evaluated against it, a
        multi-range request gets the whole 200, and no response carries `Content-Encoding`;
        `HEAD` returns the same headers. Only an object every holder of whose public key is
        `public` is cached `public, max-age=31536000, immutable, no-transform`; anything else,
        and everything under the gated prefix, is `private, no-store, no-transform`. P4-29: when
        neither blob key is held, the hash may name a generated lazy delta (stored at
        `deltas/<from>/<to>.zstd-patch-from`, or under `gated/`) this product holds a
        `lazy-delta` ref to, as the feed's delta menu offers it; it is served under its pack's
        rules exactly as the pack's other objects (a gated one needs the pack's current gate),
        only while `LAZY_DELTAS` is `on` and the product is opted in. A cold delta is the plain
        not-found. Served on
        the console host (always an octet-stream attachment) and on the bytes host.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: sha256
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - { $ref: "#/components/parameters/Range" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: The object.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Partial content for a `Range` request.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: Not modified (`If-None-Match`).
        "401":
          description: The delivery access refused the caller (see `downloadBuild`).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/FlatError" }
                  - { $ref: "#/components/schemas/WireError" }
        "403":
          description: >
            A grant refused it: the app's `entitled` window (`channel_not_allowed`,
            `version_blocked`, see `ReleaseForbidden`), a pack gate the licence does not hold
            (`not_entitled`), or an `entitled` pack with no gate (`delivery_gate_missing`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
              examples:
                notEntitled:
                  summary: test/packTransports.test.ts
                  value: { error: { code: not_entitled } }
                deliveryGateMissing:
                  summary: test/packTransports.test.ts
                  value:
                    error: { code: delivery_gate_missing }
                    message: "djdl.core3d's delivery access is entitled, but it has no gate; an operator sets one (or a looser mode) under Distribution → Access."
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "405":
          description: "Any method other than `GET` and `HEAD` (`Allow: GET, HEAD`)."
        "416":
          description: "An unsatisfiable `Range`, with `Content-Range: bytes */<size>`."
        "429":
          description: The artifact rate-limit lane — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
    head:
      operationId: headBlob
      tags: [distribution]
      summary: Size, ETag and Repr-Digest of a content-addressed object
      description: >
        `downloadBlob` without a body (P4-05 documents it): the same authorisation, the same
        status and the same headers — `Content-Length`, `ETag` (the SHA-256), `Repr-Digest`,
        `Accept-Ranges`, `Cache-Control` and, for a `Range`, `Content-Range`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: sha256
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - { $ref: "#/components/parameters/Range" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: The object's headers, no body.
        "206":
          description: The headers of a `Range` answer, no body.
        "304":
          description: Not modified (`If-None-Match`).
        "401":
          description: The delivery access refused the caller (see `downloadBlob`).
        "403":
          description: A grant refused the caller (see `downloadBlob`).
        "404":
          description: Not held by this product (or not stored), no body.
        "416":
          description: "An unsatisfiable `Range`, with `Content-Range: bytes */<size>`."
        "429":
          description: The artifact rate-limit lane.
    options:
      operationId: preflightDownloadBlob
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { name: sha256, in: path, required: true, schema: { type: string } }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/packs/{pack}/{variant}/payload/{sha256}:
    get:
      operationId: downloadPackPayload
      tags: [distribution]
      summary: Download a pack's decoded container payload (Compression Dictionary Transport)
      description: >
        P4-18. The payload of one `container` variant of a pack release, by its `payload.sha256`
        (the DECODED payload; the newest of the pack's last 200 releases naming it), for a
        browser: the stored `full` frame streamed unchanged with `Content-Encoding: zstd` (the
        browser decodes it natively), or raw for `codec: none`. A zstd `full` needs `zstd` in
        `Accept-Encoding` (`406` otherwise: the SDK takes the blob route and its WASM decoder).
        When `Available-Dictionary` (RFC 9842) is the SHA-256 of the `from` of a published
        `zstd-patch-from` payload delta to this payload and `dcz` is accepted, the answer is
        `Content-Encoding: dcz`: `5E 2A 4D 18 20 00 00 00`, the 32-byte `from`, then the stored
        delta artifact, unchanged (its bytes are the artifact's plus 40). P4-29: the ready lazy
        deltas to the payload count too (after the record's own), while `LAZY_DELTAS` is `on`
        and the product is opted in. Another dictionary, or
        none, gets the full payload; with `?via=dcz` (the SDK's guard against a silent full
        download) those are `409` with no body. Authorised exactly as `downloadBlob` authorises
        the `full` object (and, for dcz, the artifact): by the holders of its keys, the pack's
        delivery access and, under the gated prefix, its CURRENT gate. Every answer carries
        `Vary: Accept-Encoding, Available-Dictionary`. A `200` for an ungated payload of at most
        100 MiB carries `Use-As-Dictionary: match="/{product}/distribution/packs/{pack}/{variant}/payload/*",
        match-dest=("")`, so the browser keeps it as the dictionary for that (pack, variant)
        only; a gated payload is `private, no-store, no-transform` and never a dictionary. An
        ungated payload is cached `public, max-age=31536000, immutable, no-transform`, or
        `private, max-age=31536000, immutable, no-transform` when the pack needs a licence.
        Full-body only (`Accept-Ranges: none`; a `Range` is ignored); the blob route is
        unchanged. A tree variant, an unknown hash or variant, and a pack the product does not
        declare are the plain not-found. Served on the console host and on the bytes host.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: pack
          in: path
          required: true
          description: The pack id.
          schema:
            {
              type: string,
              pattern: "^[a-z][a-z0-9-]*(\\.[a-z0-9-]+)*$",
              maxLength: 64,
            }
        - name: variant
          in: path
          required: true
          description: "The variant key (`texture=s3tc;locale=fr`, axes sorted), or `default` for an unvaried pack."
          schema: { type: string }
        - name: sha256
          in: path
          required: true
          description: The variant's `payload.sha256`.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - name: via
          in: query
          required: false
          description: "`dcz`: answer `409` instead of the full payload when dcz is not possible."
          schema: { type: string, enum: [dcz] }
        - name: Available-Dictionary
          in: header
          required: false
          description: "RFC 9842: the SHA-256 of the dictionary the browser holds, as an sf-binary (`:<base64>:`)."
          schema: { type: string }
      responses:
        "200":
          description: >
            The payload, `Content-Encoding: zstd` (or raw for `codec: none`), or `Content-Encoding:
            dcz` (the 40-byte header and the delta artifact).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: The delivery access refused the caller (see `downloadBlob`).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/FlatError" }
                  - { $ref: "#/components/schemas/WireError" }
        "403":
          description: A grant refused the caller (see `downloadBlob`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WireError" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "405":
          description: "Any method other than `GET` and `HEAD` (`Allow: GET, HEAD`)."
        "406":
          description: "A zstd `full` and no `zstd` in `Accept-Encoding`; no body."
        "409":
          description: "`?via=dcz` and no dcz answer was possible; no body, `no-store`."
        "429":
          description: The artifact rate-limit lane — LEGACY FLAT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlatError" }
    head:
      operationId: headPackPayload
      tags: [distribution]
      summary: The headers of a pack payload answer
      description: >
        `downloadPackPayload` without a body: the same authorisation, the same choice of
        encoding and the same headers (`Content-Encoding`, `Content-Length`, `Vary`,
        `Use-As-Dictionary`, `Cache-Control`).
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { name: pack, in: path, required: true, schema: { type: string } }
        - { name: variant, in: path, required: true, schema: { type: string } }
        - {
            name: sha256,
            in: path,
            required: true,
            schema: { type: string, pattern: "^[0-9a-f]{64}$" },
          }
      responses:
        "200":
          description: The answer's headers, no body.
        "401":
          description: The delivery access refused the caller (see `downloadBlob`).
        "403":
          description: A grant refused the caller (see `downloadBlob`).
        "404":
          description: Not found, no body.
        "406":
          description: "A zstd `full` and no `zstd` in `Accept-Encoding`."
        "409":
          description: "`?via=dcz` and no dcz answer was possible."
        "429":
          description: The artifact rate-limit lane.
    options:
      operationId: preflightDownloadPackPayload
      tags: [distribution]
      summary: CORS preflight
      description: Browser preflight for a page on one of the product's `web.origins`. See `CorsPreflight`.
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - { name: pack, in: path, required: true, schema: { type: string } }
        - { name: variant, in: path, required: true, schema: { type: string } }
        - { name: sha256, in: path, required: true, schema: { type: string } }
      responses:
        "204": { $ref: "#/components/responses/CorsPreflight" }

  /{product}/distribution/rollouts/{outlet}/{channel}:
    post:
      operationId: ciSetRollout
      tags: [distribution]
      summary: Start an outlet rollout, or set its percentage (CI)
      description: >
        P2b-04. Rolls `releaseId` of the deliverable (default `app`) out on one outlet's channel
        to `bp` basis points (0–10000). A release new to the row starts a new rollout with a
        fresh random 16-byte salt (state `active`); the same release changes its percentage while
        `active` or `paused` and is refused while `halted` (resume first) or `complete` (409
        `invalid_transition`). The bucket is evaluated ON THE DEVICE,
        `u32(sha256(salt ‖ installId)[0..4]) mod 10000`, so the Worker never evaluates it. A
        yanked release is refused (409 `release_yanked`); a row a store connector mirrors refuses
        every direct edit (409 `rollout_mirrored`). The signed channel feed, the app-updater feeds,
        the storefront feeds and the download page read the row, so a pause or halt stops offering
        the release there at once. Requires a `pkeyci_` token with the opt-in
        `distribution:rollout` scope; audited as `ci:<subject>`. No CORS. Errors are LEGACY FLAT
        with a machine-readable `reason` (`unknown_outlet`, `unknown_channel`,
        `unknown_deliverable`, `unknown_release`, `no_rollout`, `invalid_body`).
      security: [{ ciToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Product" }
        - name: outlet
          in: path
          required: true
          description: A live outlet the product declares in `.pkey/distribution` (`direct` when it declares none).
          schema: { type: string }
        - { $ref: "#/components/parameters/PolicyChannel" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releaseId, bp]
              properties:
                deliverable: { type: string, default: app }
                releaseId: { type: string }
                bp: { type: integer, minimum: 0, maximum: 10000 }
            examples:
              quarter: { value: { releaseId: v1.1.0, bp: 2500 } }
      responses:
        "200":
          description: The rollout after the change.
          content:
            application/json:
              schema:
                type: object
                required: [ok, rollout]
                properties:
                  ok: { type: boolean, const: true }
                  rollout:
                    type: object
                    required:
                      [
                        deliverableId,
                        outletId,
                        channel,
                        releaseId,
                        rolloutBp,
                        rolloutSalt,
                        state,
                        mirrored,
                        source,
                        startedAt,
                        updatedAt,
                        updatedBy,
                      ]
                    properties:
                      deliverableId: { type: string }
                      outletId: { type: string }
                      channel: { type: string }
                      releaseId: { type: string }
                      rolloutBp: { type: integer, minimum: 0, maximum: 10000 }
                      rolloutSalt: { type: string, pattern: "^[0-9a-f]{32}$" }
                      state:
                        {
                          type: string,
                          enum: [active, paused, halted, complete],
                        }
                      mirrored: { type: boolean }
                      source: { type: string }
                      startedAt: { type: integer }
                      updatedAt: { type: integer }
                      updatedBy: { type: string }
              examples:
                started:
                  summary: test/distributionRollouts.test.ts
                  value:
                    ok: true
                    rollout:
                      deliverableId: app
                      outletId: direct
                      channel: stable
                      releaseId: v1.1.0
                      rolloutBp: 2500
                      rolloutSalt: 0f1e2d3c4b5a69788796a5b4c3d2e1f0
                      state: active
                      mirrored: false
                      source: ci
                      startedAt: 1700000000
                      updatedAt: 1700000000
                      updatedBy: "ci:static:tok_1"
        "400": { $ref: "#/components/responses/CiRefusal" }
        "401": { $ref: "#/components/responses/CiUnauthorized" }
        "403": { $ref: "#/components/responses/CiForbidden" }
        "404": { $ref: "#/components/responses/CiRefusal" }
        "409": { $ref: "#/components/responses/CiRefusal" }
