[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polaris-key"
version = "0.1.0"
description = "Product-agnostic Python client for Polaris Key: Core plus License, Config, Devices, Identity, Release, Update, Packs and Commerce (wire contracts v3 and v4)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vlad Zaharia" }]
keywords = ["license", "managed-config", "jws", "ed25519", "polaris-key"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cryptography>=41",
  "httpx>=0.24",
  # Packs (plans/P4-01.md §2.7): zstd for every strategy. CPython 3.14+ has `compression.zstd`;
  # below it `zstandard` (BSD-3) is a hard dependency, never an extra (PARITY allows no N/A for
  # packs.apply.full).
  "zstandard>=0.22; python_version < '3.14'",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
click = ["click>=8"]
typer = ["typer>=0.9"]
# The terminal kit (UK-13): rich renders the CLI's styled output; without it the kit writes the same
# ANSI itself. Textual is only for the optional full-screen app (polaris_key.ui.terminal.textual_app).
cli = ["rich>=13"]
tui = ["rich>=13", "textual>=0.80"]
# pyte: the terminal emulator the terminal kit's responsive tests draw into (tests/cli/pyterm.py).
dev = ["pytest>=7", "click>=8", "typer>=0.9", "rich>=13", "textual>=0.80", "pyte>=0.8"]

[project.scripts]
polaris-key = "polaris_key.cli:main"

[project.urls]
Homepage = "https://key.plrs.im"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris_key"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
