[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polaris-key"
version = "0.1.0"
description = "Product-agnostic Python client for Polaris Key: Core plus License, Config, Devices, Identity, Release, Update, Packs and Commerce (wire contracts v3 and v4)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vlad Zaharia" }]
keywords = ["license", "managed-config", "jws", "ed25519", "polaris-key"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cryptography>=41",
  "httpx>=0.24",
  # Packs (plans/P4-01.md §2.7): zstd for every strategy. CPython 3.14+ has `compression.zstd`;
  # below it `zstandard` (BSD-3) is a hard dependency, never an extra (PARITY allows no N/A for
  # packs.apply.full).
  "zstandard>=0.22; python_version < '3.14'",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
click = ["click>=8"]
typer = ["typer>=0.9"]
# The terminal kit (UK-13): rich renders the CLI's styled output; without it the kit writes the same
# ANSI itself. Textual is only for the optional full-screen app (polaris_key.ui.terminal.textual_app).
cli = ["rich>=13"]
# client.backend.requests_auth() (SP-58); httpx_auth() needs nothing beyond the core dependencies.
requests = ["requests>=2.28"]
tui = ["rich>=13", "textual>=0.80"]
# The Qt Quick kit (UK-12): PySide6 is primary; PyQt6 works through qtpy (pip install PyQt6 qtpy).
qt = ["PySide6-Essentials>=6.7"]
# Server drop-ins (SP-56): polaris_key.server needs only cryptography and httpx; each adapter
# imports its framework lazily, and these extras pin the floor versions it is tested against.
starlette = ["starlette>=0.27"]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.2"]
django = ["django>=4.2"]
drf = ["django>=4.2", "djangorestframework>=3.14"]
# Cloud Connect's relay (CC-10.13, D-2): the only WebSocket client the SDK uses, imported on the first
# relay start. Exact pins: the newest release that supports each CPython, at least 14 days old.
connect = [
  "websockets==15.0.1; python_version < '3.10'",
  "websockets==16.1.1; python_version == '3.10'",
  "websockets==17.2; python_version >= '3.11'",
]
# pyte: the terminal emulator the terminal kit's responsive tests draw into (tests/cli/pyterm.py).
dev = ["pytest>=7", "click>=8", "typer>=0.9", "rich>=13", "textual>=0.80", "pyte>=0.8", "mypy==1.19.1", "ruff==0.17.3",
  "fastapi>=0.100", "flask>=2.2", "django>=4.2", "djangorestframework>=3.14", "requests>=2.28",
  "uvicorn>=0.23"]

[project.scripts]
polaris-key = "polaris_key.cli:main"

[project.urls]
Homepage = "https://key.plrs.im"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris_key"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Lint (P0-46.4): ruff and mypy, both pinned exactly in the dev extras (mypy 1.19.1 is the last
# release that runs on CPython 3.9). Today's findings sit in lint-debt.json (ruff: / mypy: rules);
# run them through tools/lint.sh, which feeds tools/lint/lint-debt.mjs.
[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["src/polaris_key/constants_generated.py", "src/polaris_key/copy_generated.py", ".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# Formatting is not enforced here; E501 stays on so long lines are counted, not ignored.

[tool.mypy]
python_version = "3.9"
platform = "linux"
files = ["src/polaris_key"]
exclude = ["src/polaris_key/constants_generated\\.py$", "src/polaris_key/copy_generated\\.py$"]
ignore_missing_imports = true
# Third-party code is not followed: some of it (click, anyio) uses syntax newer than 3.9, and what
# mypy sees there would differ between the CI legs. Its names resolve to Any.
follow_imports = "skip"
show_error_codes = true
show_column_numbers = false
pretty = false
