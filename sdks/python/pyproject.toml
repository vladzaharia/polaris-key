[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polaris-key"
version = "0.1.0"
description = "Product-agnostic Python client for the Polaris Key control plane (license + managed config)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vlad Zaharia" }]
keywords = ["license", "managed-config", "jws", "ed25519", "polaris-key"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cryptography>=41",
  "httpx>=0.24",
  "platformdirs>=3",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
click = ["click>=8"]
typer = ["typer>=0.9"]

[project.scripts]
polaris-key = "polaris_key.cli:main"

[project.urls]
Homepage = "https://key.plrs.im"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris_key"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
