# Versions pinned to Godot 4.7.2's Android build template (AGP 8.6.1, Gradle 8.11.1, Kotlin 2.1.21,
# compile/target SDK 36, min SDK 24, Java 17 bytecode; notes/S-10 §Environment), so the AARs drop
# into a Godot Gradle export unchanged. Play Core versions: the latest on 2026-10-03.
# The JVM modules (P6-06): kotlinx-coroutines and kotlinx-serialization-json at the last releases
# built with Kotlin 2.1, OkHttp 4.12 (the one HTTP client that runs on Android API 24 and the JVM;
# java.net.http does not exist on Android), and Tink as the Ed25519 backend below Android API 33
# (compileOnly in :core: the JCA backend needs nothing, and :android brings tink-android, P6-12).
[versions]
# The shared Android conventions every module reads (P6-09): compile and target SDK, min SDK and the
# JVM bytecode level. Change them here, never in a module's build file.
androidCompileSdk = "36"
androidTargetSdk = "36"
androidMinSdk = "24"
jvmTarget = "17"
agp = "8.6.1"
kotlin = "2.1.21"
godot = "4.7.2.stable"
playAppUpdate = "2.1.0"
playAssetDelivery = "2.3.0"
playIntegrity = "1.6.0"
# Play Billing for :billing (SP-K05): 9.1.0, verified against AGP 8.6.1 and compileSdk 36. Google Play requires Billing
# Library 8 or later for new apps and app updates from 31 August 2026; 9.1.0 declares minSdk 23
# (below ours) and no minCompileSdk, so it builds under compileSdk 36 and AGP 8.6.1.
playBilling = "9.1.0"
junit = "4.13.2"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
coroutines = "1.11.0"
serialization = "1.8.1"
okhttp = "4.12.0"
# The Ktor server plugin (:server-ktor, SP-57): 3.2.x is built with Kotlin 2.1.x.
ktor = "3.2.3"
tink = "1.23.0"
# zstd for pack deltas, chunks and zstd-coded objects (P6-08, notes/E9): the JNI binding to libzstd
# 1.5.7. The JAR carries the desktop natives. :android links the Android AAR instead (16 KB page
# aligned, tools/check_16k_alignment.py), and at 1.5.7-12: every AAR from 1.5.7-13 on declares
# minCompileSdk 37, which compileSdk 36 under AGP 8.6.1 (Godot 4.7.2's template) cannot consume
# (P6-12). The zstd-jni API :packs calls is the same in both builds.
zstdJni = "1.5.7-21"
# The JVM desktop OS keyring (UK-40, SP-K12): java-keyring over JNA (macOS Keychain, Windows
# Credential Manager, Secret Service or KWallet on Linux). compileOnly in :core, so Android and
# headless JVM builds never carry JNA; a desktop app adds it at runtime.
javaKeyring = "1.0.4"
zstdJniAndroid = "1.5.7-12"
# The Compose UI kit (:ui, P6-11): the Compose BOM whose libraries build under Godot's template (AGP 8.6.1,
# compile SDK 36, Kotlin 2.1): the newest BOM is 2026.06.01 (Compose 1.11.4, Material 3 1.4.0: AAR
# metadata minCompileSdk 35, minAndroidGradlePluginVersion 8.6.0). From 2026.08.00 (Compose 1.12) every
# library declares minCompileSdk 37 and AGP 9.1.0, which this template cannot consume (the same wall as
# zstdJniAndroid below): the consumer app's `latest` toolchain (AGP 9.4.1, compileSdk 37) covers
# 2026.09.00. The Compose compiler plugin sits at the Kotlin version,
# ZXing's core encoder for the sign-in QR code (pure Java, no Android dependency, no camera), and
# Roborazzi for the snapshot tests over Robolectric's native graphics (the JVM renders each screen;
# no emulator).
composeBom = "2026.06.01"
zxing = "3.5.4"
# Compose Multiplatform for the docs snippet lane's desktop recipe (:docs-snippets, SP-45b); 1.8.x builds
# with Kotlin 2.1.
composeMultiplatform = "1.12.1"
roborazzi = "1.43.0"
androidxTestExtJunit = "1.3.0"
activityCompose = "1.10.1"
# The version Compose 1.8 already brings in transitively; :ui now names it for the sign-in ViewModel.
lifecycle = "2.8.7"

[libraries]
godot = { module = "org.godotengine:godot", version.ref = "godot" }
play-app-update = { module = "com.google.android.play:app-update", version.ref = "playAppUpdate" }
play-asset-delivery = { module = "com.google.android.play:asset-delivery", version.ref = "playAssetDelivery" }
play-integrity = { module = "com.google.android.play:integrity", version.ref = "playIntegrity" }
play-billing = { module = "com.android.billingclient:billing", version.ref = "playBilling" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth-jvm", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
# The Ed25519 backend below Android API 33 in :android (P6-12): the same Tink, built for Android.
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
java-keyring = { module = "com.github.javakeyring:java-keyring", version.ref = "javaKeyring" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }
zstd-jni-android = { module = "com.github.luben:zstd-jni", version.ref = "zstdJniAndroid" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
