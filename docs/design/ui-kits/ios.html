<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI kits · iOS 26 (SwiftUI)</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* iPhone 17 Pro, 402 × 874 pt. Liquid Glass approximated with backdrop-filter.
         iOS grounds are neutral system greys (no Polaris lavender in product chrome). */
      :root {
        --ios-page: #000000;
        --ios-cell: #16181d;
        --ios-fill: #1f2127;
        --ios-sep: rgb(255 255 255 / 0.1);
        --ios-sym: #2a2d34;
      }
      [data-theme="light"] {
        --ios-page: #f2f2f7;
        --ios-cell: #ffffff;
        --ios-fill: #e9e9ee;
        --ios-sep: rgb(60 60 67 / 0.18);
        --ios-sym: #e5e5ea;
      }
      .shot {
        width: 426px;
        height: 898px;
        padding: 12px;
        border-radius: 68px;
        background: #1b1c20;
        box-shadow:
          0 0 0 1px #3a3b40 inset,
          0 30px 60px -20px rgb(0 0 0 / 0.5);
      }
      [data-theme="light"] .shot {
        background: #d9dbe2;
        box-shadow:
          0 0 0 1px #c3c6cf inset,
          0 30px 60px -20px rgb(6 9 18 / 0.25);
      }
      .screen {
        position: relative;
        width: 402px;
        height: 874px;
        border-radius: 56px;
        overflow: hidden;
        background: var(--ios-page);
        isolation: isolate;
        font-size: 17px;
        line-height: 22px;
        color: var(--pk-text-strong);
      }
      .status {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 32px 0 52px;
        font:
          600 17px/1 -apple-system,
          system-ui,
          sans-serif;
        color: var(--pk-text-strong);
        z-index: 40;
      }
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        transform: translateX(-50%);
        width: 124px;
        height: 36px;
        border-radius: 20px;
        background: #000;
        z-index: 41;
      }
      .sbi {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .home {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 5px;
        border-radius: 3px;
        background: var(--pk-text-strong);
        z-index: 50;
      }

      /* Product ambient: a mesh from the icon palette over the top 45 %, eased out. */
      .ambient {
        position: absolute;
        inset: 0 0 auto;
        height: 560px;
        z-index: -1;
        background:
          radial-gradient(60% 50% at 30% 18%, #0f6f7a, transparent 70%),
          radial-gradient(50% 45% at 78% 14%, #c9a35c, transparent 72%),
          radial-gradient(70% 60% at 55% 40%, #1aa594, transparent 75%),
          radial-gradient(90% 70% at 50% 0%, #0b3a48, transparent 80%);
        opacity: 0.5;
        mask: linear-gradient(
          #000 0%,
          rgb(0 0 0 / 0.75) 40%,
          rgb(0 0 0 / 0.25) 72%,
          transparent 100%
        );
        filter: blur(20px) saturate(1.2);
      }
      [data-theme="light"] .ambient {
        opacity: 0.22;
      }

      /* Liquid Glass: no outline stroke, no drop shadow; a top specular edge and backdrop. */
      .glass {
        background: rgb(255 255 255 / 0.1);
        backdrop-filter: blur(24px) saturate(1.8);
        -webkit-backdrop-filter: blur(24px) saturate(1.8);
        box-shadow:
          inset 0 1px 0.5px rgb(255 255 255 / 0.3),
          inset 0 -0.5px 0.5px rgb(255 255 255 / 0.08);
        color: var(--pk-text-strong);
      }
      [data-theme="light"] .glass {
        background: rgb(255 255 255 / 0.45);
        box-shadow:
          inset 0 1px 0.5px rgb(255 255 255 / 0.95),
          inset 0 -0.5px 0.5px rgb(0 0 0 / 0.04);
      }
      .glass.on-plain {
        background: rgb(120 120 128 / 0.18);
      }
      [data-theme="light"] .glass.on-plain {
        background: rgb(120 120 128 / 0.12);
      }
      /* Glass on a glass sheet: the sheet already samples the backdrop once. Controls on it are
         a flat fill, so the hero behind cannot bleed through twice as a tinted band. */
      .sheet .glass {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      .glass.prominent {
        background: var(--kit-accent);
        color: #fff;
        box-shadow:
          inset 0 1px 0.5px rgb(255 255 255 / 0.4),
          inset 0 -1px 1px rgb(0 0 0 / 0.08),
          0 2px 8px rgb(0 0 0 / 0.12);
      }
      .cap {
        height: 52px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font: 500 17px/1 var(--pk-font-sans);
        width: 100%;
      }
      .circ {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .title-xl {
        font: 600 34px/40px var(--pk-font-sans);
        letter-spacing: -0.01em;
        color: var(--pk-text-strong);
        margin: 0;
        text-wrap: balance;
      }
      .title-l {
        font: 600 28px/34px var(--pk-font-sans);
        letter-spacing: -0.01em;
        color: var(--pk-text-strong);
        margin: 0;
        text-wrap: balance;
      }
      .sub {
        color: var(--pk-text-muted);
        margin: 0;
        font-size: 17px;
        line-height: 22px;
        text-wrap: pretty;
      }
      .foot-note {
        color: var(--pk-text-muted);
        font-size: 13px;
        line-height: 18px;
        text-align: center;
        text-wrap: balance;
      }

      /* Inset grouped lists */
      .list {
        background: var(--ios-cell);
        border-radius: 26px;
        overflow: hidden;
      }
      .cell {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 52px;
        padding: 10px 18px;
        position: relative;
        color: var(--pk-text-strong);
      }
      .cell + .cell::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        left: 18px;
        height: 0.5px;
        background: var(--ios-sep);
      }
      .cell.ind + .cell::before {
        left: 66px;
      }
      .cell .t {
        flex: 1;
        min-width: 0;
      }
      .cell .t small {
        display: block;
        color: var(--pk-text-muted);
        font-size: 15px;
        line-height: 20px;
      }
      .cell .v {
        color: var(--pk-text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cell .v .ic {
        color: var(--pk-text-subtle);
      }
      .sym {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: var(--pk-text-strong);
        background: var(--ios-sym);
        flex: none;
      }
      .tog {
        width: 64px;
        height: 28px;
        border-radius: 999px;
        background: var(--kit-accent);
        position: relative;
        flex: none;
      }
      .tog::after {
        content: "";
        position: absolute;
        right: 2px;
        top: 2px;
        width: 38px;
        height: 24px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.16);
      }
      .sec-h {
        font: 600 15px/20px var(--pk-font-sans);
        color: var(--pk-text-strong);
        margin: 24px 18px 8px;
      }
      .sec-f {
        font-size: 13px;
        line-height: 18px;
        color: var(--pk-text-muted);
        margin: 8px 18px 0;
        text-wrap: pretty;
      }
      .chk {
        color: var(--kit-accent-fg);
      }
      .link {
        color: var(--kit-accent-fg);
        font: 500 15px/44px var(--pk-font-sans);
      }

      /* Sheets (iOS 26: inset, concentric corners, glass at the medium detent) */
      .dim {
        position: absolute;
        inset: 0;
        background: rgb(0 0 0 / 0.32);
        z-index: 5;
      }
      [data-theme="light"] .dim {
        background: rgb(0 0 0 / 0.18);
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        border-radius: 40px 40px 0 0;
        background: var(--ios-cell);
        padding: 10px 20px 40px;
      }
      [data-theme="light"] .sheet {
        background: #f7f7fa;
      }
      .sheet.float {
        left: 8px;
        right: 8px;
        bottom: 8px;
        border-radius: 40px 40px 48px 48px;
        background: rgb(28 30 36 / 0.74);
        backdrop-filter: blur(30px) saturate(1.6);
        box-shadow:
          inset 0 1px 0.5px rgb(255 255 255 / 0.22),
          0 20px 50px rgb(0 0 0 / 0.4);
        padding-bottom: 34px;
      }
      [data-theme="light"] .sheet.float {
        /* Light sheets read as frosted white: near-opaque and unsaturated, so the product hero
           behind never leaks through as a coloured band behind one row. */
        background: rgb(249 249 251 / 0.97);
        backdrop-filter: blur(40px) saturate(1);
        box-shadow:
          inset 0 1px 0.5px #fff,
          0 20px 50px rgb(6 9 18 / 0.18);
      }
      .grab {
        width: 36px;
        height: 5px;
        border-radius: 3px;
        background: var(--pk-text-subtle);
        opacity: 0.5;
        margin: 0 auto 14px;
      }
      .sheet-bar {
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        margin: 4px -6px 20px;
      }
      .sheet-bar .ttl {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font: 600 17px/1 var(--pk-font-sans);
      }
      .flabel {
        font-size: 13px;
        line-height: 18px;
        color: var(--pk-text-subtle);
        margin: 0 4px 8px;
      }
      .field {
        background: var(--ios-fill);
        border-radius: 22px;
        min-height: 56px;
        display: flex;
        align-items: center;
        padding: 10px 8px 10px 18px;
        gap: 10px;
        color: var(--pk-text-strong);
      }
      [data-theme="light"] .field {
        background: #fff;
      }
      .field .mono {
        font-size: 16px;
        line-height: 22px;
        flex: 1;
        overflow-wrap: anywhere;
      }
      .caret {
        display: inline-block;
        width: 2px;
        height: 20px;
        background: var(--kit-accent-fg);
        border-radius: 1px;
        vertical-align: -4px;
        margin-left: 1px;
      }
      .paste {
        height: 36px;
        padding: 0 14px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 6px;
        font:
          500 15px/1 -apple-system,
          system-ui;
        background: rgb(120 120 128 / 0.2);
        color: var(--pk-text-strong);
        align-self: start;
        margin-top: 0;
      }

      /* Keyboard: iOS 26 (larger rounded keys on a glass plate) */
      .kb {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 318px;
        padding: 12px 6px 0;
        z-index: 15;
        background: rgb(44 46 52 / 0.78);
        backdrop-filter: blur(30px) saturate(1.4);
        border-radius: 36px 36px 0 0;
        box-shadow: inset 0 1px 0.5px rgb(255 255 255 / 0.18);
      }
      [data-theme="light"] .kb {
        background: rgb(222 224 230 / 0.82);
        box-shadow: inset 0 1px 0.5px #fff;
      }
      .kb .r {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 12px;
      }
      .kb .k {
        width: 33px;
        height: 46px;
        border-radius: 12px;
        background: rgb(255 255 255 / 0.2);
        color: #fff;
        display: grid;
        place-items: center;
        font:
          400 23px/1 -apple-system,
          system-ui,
          sans-serif;
      }
      [data-theme="light"] .kb .k {
        background: #fff;
        color: #000;
        box-shadow: 0 1px 0 rgb(0 0 0 / 0.16);
      }
      .kb .k.w {
        width: 46px;
        background: rgb(255 255 255 / 0.1);
        font-size: 16px;
      }
      [data-theme="light"] .kb .k.w {
        background: rgb(255 255 255 / 0.55);
      }
      .kb .k.sp {
        width: 176px;
        font-size: 16px;
      }
      .kb .k.go {
        width: 96px;
        font-size: 17px;
        font-weight: 600;
        background: var(--kit-accent);
        color: #fff;
      }

      /* Host app behind sheets and banners */
      .navbar {
        position: absolute;
        top: 58px;
        left: 0;
        right: 0;
        padding: 0 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 4;
      }
      .hosttitle {
        position: absolute;
        top: 112px;
        left: 20px;
      }
      .sessions {
        position: absolute;
        top: 170px;
        left: 16px;
        right: 16px;
        display: grid;
        gap: 12px;
      }
      .sess {
        height: 84px;
        border-radius: 22px;
        background: var(--ios-cell);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        color: var(--pk-text-strong);
        font-family: -apple-system, system-ui;
      }
      .sess .wave {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: #0b3a48;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }
      .sess .wave i {
        width: 2.5px;
        border-radius: 2px;
        background: #5fe3cf;
      }
      .sess small {
        display: block;
        color: var(--pk-text-muted);
        font-size: 15px;
      }
      /* Floats above the home indicator (or the tab bar, as its accessory): never over the nav
         bar or the large title, so the host's navigation stays usable. */
      .banner {
        position: absolute;
        bottom: 30px;
        left: 10px;
        right: 10px;
        z-index: 30;
        border-radius: 30px;
        padding: 12px 12px 12px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgb(36 38 44 / 0.7);
        backdrop-filter: blur(30px) saturate(1.7);
        box-shadow:
          inset 0 1px 0.5px rgb(255 255 255 / 0.22),
          0 12px 30px rgb(0 0 0 / 0.3);
      }
      [data-theme="light"] .banner {
        background: rgb(255 255 255 / 0.72);
        box-shadow:
          inset 0 1px 0.5px #fff,
          0 12px 30px rgb(6 9 18 / 0.14);
      }
      .seat {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .seat i {
        width: 28px;
        height: 6px;
        border-radius: 3px;
        background: color-mix(in oklab, var(--pk-text-strong) 80%, transparent);
      }
      .seat span {
        margin-left: 8px;
        font-size: 15px;
        color: var(--pk-text-muted);
        font-variant-numeric: tabular-nums;
      }
      .apple {
        height: 52px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font:
          600 17px/1 -apple-system,
          system-ui;
        background: #fff;
        color: #000;
      }
      [data-theme="light"] .apple {
        background: #000;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <template id="chrome">
      <div class="status">
        <span>9:41</span>
        <span class="sbi">
          <svg
            width="19"
            height="12"
            viewBox="0 0 19 12"
            fill="currentColor"
            aria-hidden="true"
          >
            <rect x="0" y="8" width="3.4" height="4" rx="1" />
            <rect x="5.2" y="5.5" width="3.4" height="6.5" rx="1" />
            <rect x="10.4" y="3" width="3.4" height="9" rx="1" />
            <rect x="15.6" y="0" width="3.4" height="12" rx="1" />
          </svg>
          <svg
            width="17"
            height="12"
            viewBox="0 0 17 12"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2A10.4 10.4 0 0 0 8.5.6 10.4 10.4 0 0 0 1.1 3.6l1.2 1.2a8.7 8.7 0 0 1 6.2-2.5Z"
            />
            <path
              d="M8.5 5.6c1.5 0 2.9.6 3.9 1.6l1.2-1.2a7.2 7.2 0 0 0-10.2 0l1.2 1.2c1-1 2.4-1.6 3.9-1.6Z"
            />
            <path
              d="M8.5 8.9c.6 0 1.2.2 1.6.7L8.5 11.2 6.9 9.6c.4-.5 1-.7 1.6-.7Z"
            />
          </svg>
          <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true">
            <rect
              x="0.5"
              y="0.5"
              width="23"
              height="12"
              rx="3.8"
              fill="none"
              stroke="currentColor"
              opacity="0.4"
            />
            <rect
              x="2"
              y="2"
              width="20"
              height="9"
              rx="2.5"
              fill="currentColor"
            />
            <path
              d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z"
              fill="currentColor"
              opacity="0.45"
            />
          </svg>
        </span>
      </div>
      <div class="island"></div>
      <div class="home"></div>
    </template>

    <template id="gate">
      <div class="ambient"></div>
      <div
        style="
          position: absolute;
          top: 176px;
          left: 28px;
          right: 28px;
          display: grid;
          justify-items: center;
          text-align: center;
        "
      >
        <div
          class="k-appicon"
          data-art="tidewater"
          data-size="120"
          style="border-radius: 27px"
        ></div>
        <h1 class="title-xl" style="margin-top: 28px">
          Welcome to Tidewater Studio
        </h1>
        <span
          style="font-size: 13px; color: var(--pk-text-subtle); margin-top: 6px"
          >by Harbor Audio</span
        >
        <p class="sub" style="margin-top: 12px">
          Sign in or add your license to start.
        </p>
      </div>
      <div
        class="gate-actions"
        style="
          position: absolute;
          left: 24px;
          right: 24px;
          bottom: 34px;
          display: grid;
          gap: 12px;
        "
      >
        <div class="glass prominent cap">Sign in</div>
        <div class="glass cap">Use a license key</div>
        <div
          style="
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 2px;
          "
        >
          <span class="link">Restore purchase</span
          ><span class="link">Activate offline</span>
        </div>
      </div>
    </template>

    <main class="board">
      <!-- 1. Gate -->
      <figure>
        <figcaption>ios · gate</figcaption>
        <div class="shot" data-shot="gate">
          <div class="screen" data-tpl="gate"></div>
        </div>
      </figure>

      <!-- 2. Activate: sheet with keyboard -->
      <figure>
        <figcaption>ios · activate (large-detent sheet, key parsed)</figcaption>
        <div class="shot" data-shot="activate">
          <div class="screen" data-tpl="gate">
            <div class="dim"></div>
            <div class="sheet" style="top: 214px">
              <div class="grab" style="margin-bottom: 4px"></div>
              <div class="sheet-bar">
                <span
                  class="glass on-plain circ"
                  data-icon="x"
                  data-size="20"
                  aria-label="Cancel"
                ></span>
                <span class="ttl"
                  ><span
                    class="k-appicon"
                    data-art="tidewater"
                    data-size="28"
                    style="border-radius: 7px"
                  ></span
                  >Tidewater Studio</span
                >
                <span
                  class="glass prominent circ"
                  data-icon="check"
                  data-size="20"
                  aria-label="Activate"
                ></span>
              </div>
              <h2 class="title-l" style="margin: 0 4px 6px">
                Add your license
              </h2>
              <p
                class="sub"
                style="margin: 0 4px 22px; font-size: 15px; line-height: 20px"
              >
                Your key is in the purchase email from Harbor Audio.
              </p>
              <div class="flabel">License key</div>
              <div class="field">
                <span class="mono"
                  ><span class="k-key"
                    ><span>pkey_tidewater_7Q2MXK9RV4TC8HJN</span
                    ><span>3WPLDA</span></span
                  ><span class="caret"></span
                ></span>
                <span class="paste"
                  ><span data-icon="paste" data-size="15"></span>Paste</span
                >
              </div>
              <div
                style="
                  display: flex;
                  gap: 8px;
                  align-items: center;
                  margin: 12px 4px 0;
                  font-size: 15px;
                  color: var(--pk-text-muted);
                "
              >
                <span
                  style="color: var(--pk-success)"
                  data-icon="badge"
                  data-size="18"
                ></span>
                <span
                  ><b style="font-weight: 600; color: var(--pk-text-strong)"
                    >Tidewater Studio Pro</b
                  >&#8201;·&#8201;Lifetime&#8201;·&#8201;3 devices</span
                >
              </div>
            </div>
            <div class="kb" id="kb1"></div>
          </div>
        </div>
      </figure>

      <!-- 3. Sign in: method sheet over the real gate -->
      <figure>
        <figcaption>
          ios · sign-in (medium detent, floating; swipe to dismiss)
        </figcaption>
        <div class="shot" data-shot="sign-in">
          <div class="screen" data-tpl="gate">
            <div class="dim"></div>
            <div class="sheet float" style="padding: 10px 20px 34px">
              <div class="grab"></div>
              <h2
                class="title-l"
                style="
                  font-size: 24px;
                  line-height: 30px;
                  text-align: center;
                  margin: 6px 0 22px;
                "
              >
                Sign in to Tidewater Studio
              </h2>
              <div style="display: grid; gap: 10px">
                <div class="apple">
                  <span data-apple data-size="19"></span>Continue with Apple
                </div>

    <script>
      document.querySelectorAll("[data-tpl]").forEach((s) => {
        s.prepend(
          document.getElementById(s.dataset.tpl).content.cloneNode(true),
        );
      });
      document
        .querySelectorAll(".screen")
        .forEach((s) =>
          s.appendChild(
            document.getElementById("chrome").content.cloneNode(true),
          ),
        );
      const rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
      document.getElementById("kb1").innerHTML =
        rows
          .map((r, i) => {
            let keys = [...r]
              .map((c) => `<span class="k">${c}</span>`)
              .join("");
            if (i === 2)
              keys = `<span class="k w">⇧</span>${keys}<span class="k w">⌫</span>`;
            return `<div class="r">${keys}</div>`;
          })
          .join("") +
        `<div class="r"><span class="k w">123</span><span class="k w">☺</span><span class="k sp">space</span><span class="k go">go</span></div>`;
      document.querySelectorAll(".sessions").forEach((sess) => {
        [
          "Harbor demo · 4 tracks",
          "Night swim · 9 tracks",
          "Field notes · 2 tracks",
          "Lighthouse · 6 tracks",
          "Low tide · 5 tracks",
          "Pier 9 · 3 tracks",
        ].forEach((t, n) => {
          const [a, b] = t.split(" · ");
          let w = "";
          for (let i = 0; i < 11; i++)
            w += `<i style="height:${(8 + Math.abs(Math.sin(i * 0.9 + n)) * 24).toFixed(0)}px"></i>`;
          sess.insertAdjacentHTML(
            "beforeend",
            `<div class="sess"><span class="wave">${w}</span><div><b style="font-weight:600">${a}</b><small>${b} · edited today</small></div></div>`,
          );
        });
      });
    </script>
