<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI kits · macOS 26 (SwiftUI; Electron and Tauri on macOS)</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* macOS 26 at Mac scale: 13 pt body, 28 pt regular-large controls, sheets attached under
         the title bar, windows sized to their content. Windows and Linux have their own boards. */
      :root {
        --m-win: #1e1f23;
        --m-sec: #2a2b30;
        --m-sep: rgb(255 255 255 / 0.08);
        --m-field: #18191c;
        --m-bezel: rgb(255 255 255 / 0.12);
        --m-text: rgb(255 255 255 / 0.88);
        --m-mute: rgb(235 235 245 / 0.6);
      }
      [data-theme="light"] {
        --m-win: #f5f5f7;
        --m-sec: #ffffff;
        --m-sep: rgb(0 0 0 / 0.08);
        --m-field: #ffffff;
        --m-bezel: #ffffff;
        --m-text: rgb(0 0 0 / 0.85);
        --m-mute: rgb(60 60 67 / 0.62);
      }
      .shot {
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        isolation: isolate;
        display: grid;
        place-items: center;
        padding: 56px;
      }
      /* Wallpaper (not part of any kit): neutral, not Polaris violet. */
      .shot::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(70% 90% at 15% 0%, #2c4a5e 0%, transparent 60%),
          radial-gradient(60% 80% at 100% 100%, #3a3a46 0%, transparent 60%),
          #15181d;
      }
      [data-theme="light"] .shot::before {
        background:
          radial-gradient(70% 90% at 15% 0%, #c6d7e3 0%, transparent 60%),
          radial-gradient(60% 80% at 100% 100%, #dcdce4 0%, transparent 60%),
          #eceef1;
      }
      .win {
        position: relative;
        border-radius: 26px;
        overflow: hidden;
        background: var(--m-win);
        color: var(--m-text);
        font-size: 13px;
        line-height: 16px;
        box-shadow:
          inset 0 0 0 0.5px rgb(255 255 255 / 0.14),
          0 0 0 0.5px rgb(0 0 0 / 0.6),
          0 24px 60px -12px rgb(0 0 0 / 0.55);
        isolation: isolate;
      }
      [data-theme="light"] .win {
        box-shadow:
          0 0 0 0.5px rgb(0 0 0 / 0.14),
          0 24px 60px -12px rgb(6 9 18 / 0.28);
      }
      .titlebar {
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        position: relative;
      }
      .titlebar .name {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font: 600 13px/1 var(--pk-font-sans);
        color: var(--m-text);
        pointer-events: none;
      }
      .lights {
        display: flex;
        gap: 9px;
        position: relative;
        z-index: 3;
      }
      .lights i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .lights i:nth-child(2) {
        background: #febc2e;
      }
      .lights i:nth-child(3) {
        background: #28c840;
      }
      .lights.utility i:nth-child(n + 2) {
        background: color-mix(in oklab, var(--m-text) 22%, transparent);
      }

      /* Mac controls */
      .mb {
        height: 28px;
        min-width: 72px;
        padding: 0 14px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font: 500 13px/1 var(--pk-font-sans);
        color: var(--m-text);
        background: var(--m-bezel);
        box-shadow:
          inset 0 0.5px 0 rgb(255 255 255 / 0.18),
          0 0.5px 1px rgb(0 0 0 / 0.25);
        white-space: nowrap;
      }
      [data-theme="light"] .mb {
        box-shadow:
          0 0 0 0.5px rgb(0 0 0 / 0.12),
          0 0.5px 1.5px rgb(0 0 0 / 0.12);
      }
      .mb.default {
        background: var(--kit-accent);
        color: #fff;
        box-shadow:
          inset 0 0.5px 0 rgb(255 255 255 / 0.3),
          0 0.5px 1px rgb(0 0 0 / 0.25);
      }
      .mb.xl {
        height: 36px;
        font-size: 14px;
        padding: 0 20px;
      }
      .mb.block {
        width: 100%;
      }
      .mlink {
        color: var(--kit-accent-fg);
        font-size: 13px;
      }
      .mfield {
        min-height: 28px;
        border-radius: 8px;
        background: var(--m-field);
        box-shadow:
          inset 0 0 0 0.5px var(--m-sep),
          inset 0 0.5px 1px rgb(0 0 0 / 0.12);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 6px 6px 10px;
      }
      .mfield.focus {
        box-shadow:
          0 0 0 3.5px color-mix(in oklab, var(--kit-focus) 45%, transparent),
          inset 0 0 0 0.5px var(--kit-focus);
      }
      .mfield .mono {
        flex: 1;
        font-size: 12.5px;
        line-height: 16px;
        overflow-wrap: anywhere;
        color: var(--m-text);
      }
      .mlabel {
        font: 500 13px/16px var(--pk-font-sans);
        margin-bottom: 6px;
        display: block;
      }
      .mhelp {
        font-size: 12px;
        line-height: 15px;
        color: var(--m-mute);
      }
      .mtitle {
        font: 600 22px/28px var(--pk-font-sans);
        letter-spacing: -0.01em;
        margin: 0;
        color: var(--m-text);
        text-wrap: balance;
      }
      .mhead {
        display: flex;
        align-items: center;
        gap: 10px;
        font: 500 13px/16px var(--pk-font-sans);
      }
      .mhead small {
        font-size: 13px;
        color: var(--m-mute);
        font-weight: 400;
      }

      /* Grouped Form */
      .form {
        background: var(--m-sec);
        border-radius: 10px;
        box-shadow: inset 0 0 0 0.5px var(--m-sep);
      }
      [data-theme="light"] .form {
        box-shadow:
          0 0 0 0.5px rgb(0 0 0 / 0.06),
          0 0.5px 1px rgb(0 0 0 / 0.05);
      }
      .frow {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 6px 12px;
        position: relative;
      }
      .frow + .frow::before {
        content: "";
        position: absolute;
        top: 0;
        left: 12px;
        right: 12px;
        height: 0.5px;
        background: var(--m-sep);
      }
      .frow .t {
        flex: 1;
        min-width: 0;
      }
      .frow .t small {
        display: block;
        font-size: 12px;
        line-height: 15px;
        color: var(--m-mute);
      }
      .frow .v {
        color: var(--m-mute);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .frow > .ic:first-child {
        color: var(--m-mute);
      }
      .fh {
        font: 600 13px/16px var(--pk-font-sans);
        margin: 18px 4px 8px;
        color: var(--m-text);
      }
      .mradio {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--m-field);
        box-shadow: inset 0 0 0 0.5px rgb(127 127 127 / 0.6);
        flex: none;
      }
      .mradio.on {
        background: var(--kit-accent);
        box-shadow: none;
        position: relative;
      }
      .mradio.on::after {
        content: "";
        position: absolute;
        inset: 4.5px;
        border-radius: 50%;
        background: #fff;
      }
      .msw {
        width: 32px;
        height: 18px;
        border-radius: 999px;
        background: var(--kit-accent);
        position: relative;
        flex: none;
      }
      .msw::after {
        content: "";
        position: absolute;
        right: 1.5px;
        top: 1.5px;
        width: 24px;
        height: 15px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 0.5px 1.5px rgb(0 0 0 / 0.3);
      }
      .mpop {
        height: 22px;
        padding: 0 6px 0 10px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--m-bezel);
        color: var(--m-text);
        box-shadow: 0 0 0 0.5px var(--m-sep);
      }

      /* Sheet attached under the title bar; the parent is not dimmed. */
      .sheet {
        position: absolute;
        top: 52px;
        left: 50%;
        translate: -50% 0;
        width: 440px;
        border-radius: 0 0 18px 18px;
        padding: 22px 22px 18px;
        background: color-mix(in oklab, var(--m-win) 82%, transparent);
        backdrop-filter: blur(40px) saturate(1.6);
        box-shadow:
          inset 0 0 0 0.5px rgb(255 255 255 / 0.1),
          0 18px 40px -8px rgb(0 0 0 / 0.5);
        display: grid;
        gap: 16px;
        z-index: 20;
      }
      [data-theme="light"] .sheet {
        background: rgb(250 250 252 / 0.86);
        box-shadow:
          0 0 0 0.5px rgb(0 0 0 / 0.1),
          0 18px 40px -8px rgb(6 9 18 / 0.25);
      }
      .btnrow {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 4px;
      }

      /* Gate: split window, product art at full bleed, concentric inner radius 12 */
      .gatewin {
        width: 820px;
        height: 520px;
        display: grid;
        grid-template-columns: 360px 1fr;
      }
      .art {
        margin: 14px 0 14px 14px;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        background: #0b3a48;
      }
      .art svg {
        position: absolute;
        inset: 0;
      }
      .form-col {
        display: grid;
        align-content: center;
        padding: 0 52px 0 48px;
        gap: 22px;
      }
      .ver {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main class="board">
      <!-- 1. Gate -->
      <figure>
        <figcaption>macos · gate (split window, product art)</figcaption>
        <div class="shot" data-shot="gate">
          <div class="win gatewin">
            <div class="art" id="art1"></div>
            <div class="form-col">
              <div style="position: absolute; top: 20px; left: 20px">
                <div class="lights"><i></i><i></i><i></i></div>
              </div>
              <div
                class="k-appicon"
                data-art="tidewater"
                data-size="64"
                style="border-radius: 15px"
              ></div>
              <div style="display: grid; gap: 6px">
                <h1 class="mtitle" style="font-size: 26px; line-height: 32px">
                  Welcome to Tidewater Studio
                </h1>
                <span class="mhelp">by Harbor Audio</span>
                <p
                  style="
                    margin: 6px 0 0;
                    color: var(--m-mute);
                    font-size: 13px;
                    line-height: 18px;
                  "
                >
                  Sign in or add your license to start.
                </p>
              </div>
              <div style="display: grid; gap: 8px; max-width: 300px">
                <span class="mb default xl block">Sign in</span>
                <span class="mb xl block">Use a license key</span>
              </div>
              <div
                style="
                  display: flex;
                  gap: 18px;
                  font-size: 13px;
                  color: var(--m-mute);
                "
              >
                <span>Start a 14-day trial</span><span>Activate offline</span>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <!-- 2. Activate sheet -->
      <figure>
        <figcaption>
          macos · activate (sheet under the title bar, parent not dimmed)
        </figcaption>
        <div class="shot" data-shot="activate">
          <div class="win gatewin" style="grid-template-columns: 360px 1fr">
            <div class="art" id="art2"></div>
            <div class="form-col">
              <div style="position: absolute; top: 20px; left: 20px">
                <div class="lights"><i></i><i></i><i></i></div>
              </div>
              <div
                class="k-appicon"
                data-art="tidewater"
                data-size="64"
                style="border-radius: 15px"
              ></div>
              <h1 class="mtitle" style="font-size: 26px; line-height: 32px">
                Welcome to Tidewater Studio
              </h1>
            </div>
            <div class="sheet" style="top: 0; border-radius: 0 0 18px 18px">
              <div class="mhead">
                <span
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="32"
                  style="border-radius: 8px"
                ></span
                >Tidewater Studio<small>· Pro</small>
              </div>
              <div style="display: grid; gap: 4px">
                <h2 class="mtitle" style="font-size: 17px; line-height: 22px">
                  Add your license
                </h2>
                <span class="mhelp" style="font-size: 13px; line-height: 17px"
                  >Your key is in the purchase email from Harbor Audio.</span
                >
              </div>
              <div>
                <label class="mlabel">License key</label>
                <div class="mfield focus">
                  <span class="mono">pkey_tidewater_7Q2MXK9RV4TC8HJN3WPLDA</span
                  ><span
                    class="mb"
                    style="
                      height: 22px;
                      min-width: 0;
                      padding: 0 8px;
                      font-size: 12px;
                    "
                    >Paste</span
                  >
                </div>
                <div
                  style="
                    display: flex;
                    gap: 6px;
                    align-items: center;
                    margin-top: 8px;
                    font-size: 12px;
                    color: var(--m-mute);
                  "
                >
                  <span
                    style="color: var(--pk-success)"
                    data-icon="checkCircle"
                    data-size="14"
                  ></span>
                  <span
                    ><b style="font-weight: 500; color: var(--m-text)"
                      >Tidewater Studio Pro</b
                    >&#8201;·&#8201;Lifetime&#8201;·&#8201;3 devices</span
                  >
                </div>
              </div>
              <div class="btnrow">
                <span class="mb">Cancel</span
                ><span class="mb default">Activate</span>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <!-- 3. Sign-in hand-off sheet -->
      <figure>
        <figcaption>macos · sign-in hand-off (sheet)</figcaption>
        <div class="shot" data-shot="sign-in">
          <div class="win gatewin">
            <div class="art" id="art3"></div>
            <div class="form-col">
              <div style="position: absolute; top: 20px; left: 20px">
                <div class="lights"><i></i><i></i><i></i></div>
              </div>
            </div>
            <div class="sheet" style="top: 0; width: 520px">
              <div class="mhead">
                <span
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="32"
                  style="border-radius: 8px"
                ></span
                >Tidewater Studio
              </div>
              <div style="display: grid; gap: 4px">
                <h2 class="mtitle" style="font-size: 17px; line-height: 22px">
                  Finish in your browser
                </h2>
                <span class="mhelp" style="font-size: 13px; line-height: 17px"
                  >We opened the sign-in page. Check the code there matches this
                  one.</span
                >
              </div>
              <div
                style="
                  display: grid;
                  grid-template-columns: 1fr auto;
                  gap: 18px;
                  align-items: center;
                "
              >
                <div style="display: grid; gap: 10px">
                  <div
                    style="
                      display: flex;
                      align-items: center;
                      justify-content: space-between;
                      padding: 14px 10px 14px 18px;
                      border-radius: 12px;
                      background: color-mix(
                        in oklab,
                        var(--m-text) 6%,
                        transparent
                      );
                    "
                  >
                    <span
                      class="mono"
                      style="
                        font-size: 28px;
                        line-height: 1;
                        font-weight: 600;
                        letter-spacing: 0.06em;
                      "
                      >WDJB-MJHT</span
                    >
                    <span class="mb" style="min-width: 0; padding: 0 9px"
                      ><span data-icon="copy" data-size="14"></span>Copy</span
                    >
                  </div>
                  <div
                    style="
                      display: flex;
                      align-items: center;
                      gap: 8px;
                      color: var(--m-mute);
                      font-size: 12px;
                    "
                    class="tnum"
                  >
                    <span data-countdown="0.84" data-size="14"></span>Waiting ·
                    code expires in 4:12
                  </div>
                </div>
                <div
                  style="
                    display: grid;
                    justify-items: center;
                    gap: 6px;
                    font-size: 11px;
                    color: var(--m-mute);
                  "
                >
                  <div
                    style="
                      padding: 6px;
                      background: #fff;
                      border-radius: 10px;
                      line-height: 0;
                    "
                    data-qr="7"
                    data-size="96"
                  ></div>
                  Scan with your phone
                </div>
              </div>
              <div class="btnrow">
                <span class="mb">Cancel</span
                ><span class="mb default">Open Browser Again</span>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <!-- 4. Device limit sheet -->
      <figure>
        <figcaption>
          macos · device limit (sheet, grouped list with radio)
        </figcaption>
        <div class="shot" data-shot="device-limit">
          <div class="win" style="width: 760px; height: 560px">
            <div class="titlebar">
              <div class="lights"><i></i><i></i><i></i></div>
              <span class="name">Tidewater Studio</span>
            </div>
            <div
              style="padding: 0 24px; opacity: 0.45; display: grid; gap: 10px"
            >
              <div
                style="
                  height: 40px;
                  border-radius: 8px;
                  background: var(--m-sec);
                "
              ></div>
              <div
                style="
                  height: 40px;
                  border-radius: 8px;
                  background: var(--m-sec);
                "
              ></div>
              <div
                style="
                  height: 40px;
                  border-radius: 8px;
                  background: var(--m-sec);
                "
              ></div>
            </div>
            <div class="sheet" style="width: 460px">
              <div class="mhead">
                <span
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="32"
                  style="border-radius: 8px"
                ></span
                >Tidewater Studio<small>· Pro</small>
              </div>
              <div style="display: grid; gap: 6px">
                <h2 class="mtitle" style="font-size: 17px; line-height: 22px">
                  Your license is on 3 of 3 devices
                </h2>
                <span class="mhelp" style="font-size: 13px; line-height: 17px"
                  >To use it on this Mac, remove one. You can add it back
                  later.</span
                >
              </div>
              <div class="form">
                <div class="frow">
                  <span class="mradio on"></span
                  ><span data-icon="laptop" data-size="16"></span>
                  <div class="t">
                    Work laptop<small
                      >Windows 11 · last used 41 days ago · least recent</small
                    >
                  </div>
                </div>
                <div class="frow">
                  <span class="mradio"></span
                  ><span data-icon="tablet" data-size="16"></span>
                  <div class="t">
                    Mara’s iPad<small>iPadOS 26 · last used yesterday</small>
                  </div>
                </div>
                <div class="frow">
                  <span class="mradio"></span
                  ><span data-icon="laptop" data-size="16"></span>
                  <div class="t">
                    MacBook Pro<small>macOS 26 · last used today</small>
                  </div>
                </div>
              </div>
              <span class="mhelp"
                >Tidewater Studio signs out on Work laptop.</span
              >
              <div class="btnrow">
                <span class="mb">Cancel</span
                ><span class="mb default"
                  >Remove “Work laptop” and Continue</span
                >
              </div>
            </div>
          </div>
        </div>
      </figure>

      <!-- 5. Update window -->
      <figure>
        <figcaption>
          macos · update window (replaces Sparkle’s stock UI; utility window,
          hugs its content)
        </figcaption>
        <div class="shot" data-shot="update">
          <div class="win" style="width: 480px">
            <div class="titlebar" style="height: 44px">
              <div class="lights utility"><i></i><i></i><i></i></div>
            </div>
            <div style="padding: 0 24px 20px; display: grid; gap: 16px">
              <div style="display: flex; gap: 14px; align-items: center">
                <div
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="64"
                  style="border-radius: 15px"
                ></div>
                <div style="display: grid; gap: 2px">
                  <h2 class="mtitle" style="font-size: 17px; line-height: 22px">
                    Tidewater Studio 2.5 is available
                  </h2>
                  <span class="mhelp" style="font-size: 13px" class="ver"
                    >You have 2.4.1 · 61 MB download</span
                  >
                </div>
              </div>
              <div
                style="
                  display: grid;
                  gap: 4px;
                  font-size: 13px;
                  line-height: 18px;
                "
              >
                <span>Stem export in one click, with loudness matching</span>
                <span>Track freeze now works with every plug-in</span>
                <span>Fixes a crash when unplugging an audio interface</span>
                <span class="mlink" style="margin-top: 4px">Release Notes</span>
              </div>
              <div>
                <div class="k-progress" style="height: 4px">
                  <i style="width: 62%"></i>
                </div>
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    margin-top: 6px;
                    font-size: 11px;
                    color: var(--m-mute);
                  "
                  class="tnum"
                >
                  <span>Downloading · 38 of 61 MB</span
                  ><span>About 20 seconds left</span>
                </div>
              </div>
              <div
                style="
                  display: flex;
                  gap: 8px;
                  align-items: center;
                  margin-top: 2px;
                "
              >
                <span class="mb" style="min-width: 0">Skip This Version</span>
                <span style="flex: 1"></span>
                <span class="mb">Remind Me Later</span>
                <span class="mb default">Install and Relaunch</span>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <!-- 6. Settings pane -->
      <figure>
        <figcaption>
          macos · Settings scene, Account pane (window title is the pane name)
        </figcaption>
        <div class="shot" data-shot="settings">
          <div class="win" style="width: 650px">
            <div style="padding: 14px 20px 10px; display: grid; gap: 10px">
              <div style="display: flex; align-items: center">
                <div class="lights"><i></i><i></i><i></i></div>
                <span
                  style="
                    flex: 1;
                    text-align: center;
                    font: 600 13px var(--pk-font-sans);
                    margin-right: 57px;
                  "
                  >Account</span
                >
              </div>
              <div
                style="
                  display: flex;
                  justify-content: center;
                  gap: 4px;
                  font-size: 11px;
                "
              >

          0, 1, 2, 3, 4,
        ]
          .map((i) => {
            const y = 270 + i * 46;
            let d = `M-20 ${y}`;
            for (let x = -20; x <= 380; x += 60) d += ` q15 -16 30 0 t30 0`;
            return `<path d="${d}" stroke="${["#5fe3cf", "#8eeedd", "#bff5ea", "#5fe3cf", "#8eeedd"][i]}" stroke-width="9" fill="none" stroke-linecap="round" opacity="${(0.95 - i * 0.14).toFixed(2)}"/>`;
          })
          .join("")}</svg>`;
      ["art1", "art2", "art3"].forEach(
        (id) => (document.getElementById(id).innerHTML = scene()),
