<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      UI kits · Desktop (macOS 26: SwiftUI, Electron, Tauri, Compose Desktop,
      Qt)
    </title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      .shot {
        width: 1040px;
        height: 700px;
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        background: #2a2f3a;
        isolation: isolate;
        display: grid;
        place-items: center;
      }
      /* A desktop wallpaper behind the windows (not part of any kit). */
      .shot::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(60% 80% at 20% 10%, #3b3f7a 0%, transparent 60%),
          radial-gradient(50% 70% at 90% 90%, #19566b 0%, transparent 60%),
          #151826;
      }
      [data-theme="light"] .shot::before {
        background:
          radial-gradient(60% 80% at 20% 10%, #c9c6f5 0%, transparent 60%),
          radial-gradient(50% 70% at 90% 90%, #b7e3ea 0%, transparent 60%),
          #e8ebf4;
      }
      .win {
        position: relative;
        width: 960px;
        height: 620px;
        border-radius: 26px;
        overflow: hidden;
        background: var(--pk-surface-page);
        box-shadow:
          0 0 0 0.5px rgb(255 255 255 / 0.16) inset,
          0 0 0 0.5px rgb(0 0 0 / 0.5),
          0 30px 70px -10px rgb(0 0 0 / 0.55);
        isolation: isolate;
      }
      [data-theme="light"] .win {
        box-shadow:
          0 0 0 0.5px rgb(0 0 0 / 0.12),
          0 30px 70px -10px rgb(6 9 18 / 0.3);
      }
      .lights {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        gap: 9px;
        z-index: 30;
      }
      .lights i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .lights i:nth-child(2) {
        background: #febc2e;
      }
      .lights i:nth-child(3) {
        background: #28c840;
      }
      .split {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 420px 1fr;
      }
      .heroPane {
        position: relative;
        overflow: hidden;
        margin: 10px;
        border-radius: 18px;
        background: #0b3a48;
        display: grid;
        align-content: end;
        padding: 36px;
        color: #fff;
        isolation: isolate;
      }
      .heroPane .bg {
        position: absolute;
        inset: -20%;
        z-index: -1;
        filter: blur(40px) saturate(1.2);
        opacity: 0.9;
      }
      .heroPane .bg svg {
        width: 100%;
        height: 100%;
      }
      .heroPane > .k-appicon {
        justify-self: start;
      }
      .heroPane h1 {
        font: 700 34px/1.1 var(--pk-font-sans);
        letter-spacing: -0.02em;
        margin: 18px 0 6px;
      }
      .heroPane p {
        margin: 0;
        opacity: 0.8;
      }
      .formPane {
        display: grid;
        place-items: center;
        padding: 40px;
      }
      .formPane .inner {
        width: 380px;
        display: grid;
        gap: 22px;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--kit-scrim);
        z-index: 10;
      }
      .sheet {
        position: absolute;
        z-index: 20;
        left: 50%;
        top: 64px;
        transform: translateX(-50%);
        border-radius: 26px;
        background: color-mix(
          in oklab,
          var(--pk-surface-overlay) 86%,
          transparent
        );
        backdrop-filter: blur(30px) saturate(1.5);
        box-shadow:
          inset 0 1px 0 var(--kit-highlight),
          0 0 0 0.5px var(--pk-border-subtle),
          var(--pk-elevation-3);
        padding: 28px;
        display: grid;
        gap: 20px;
      }
      .toolbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        display: flex;
        align-items: center;
        padding-left: 90px;
        gap: 10px;
        color: var(--pk-text-strong);
        font-weight: 700;
        border-bottom: 1px solid var(--kit-hairline);
        z-index: 2;
      }
      .side {
        position: absolute;
        top: 10px;
        bottom: 10px;
        left: 10px;
        width: 210px;
        border-radius: 18px;
        background: color-mix(
          in oklab,
          var(--pk-surface-raised) 80%,
          transparent
        );
        box-shadow: inset 0 0 0 0.5px var(--pk-border-subtle);
        padding: 54px 10px 10px;
        display: grid;
        align-content: start;
        gap: 2px;
        font-size: 14px;
      }
      .side span {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 7px 10px;
        border-radius: 9px;
        color: var(--pk-text-default);
      }
      .side span.on {
        background: var(--kit-accent-subtle);
        color: var(--pk-text-strong);
        font-weight: 700;
      }
      .side span.on .ic {
        color: var(--kit-accent-fg);
      }
      .content {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 230px;
        right: 0;
        padding: 26px 36px;
        display: grid;
        gap: 18px;
        align-content: start;
      }
      .tracks {
        display: grid;
        gap: 10px;
        margin-top: 70px;
      }
      .track {
        height: 56px;
        border-radius: 12px;
        background: color-mix(in oklab, var(--pk-text-strong) 4%, transparent);
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 14px;
        overflow: hidden;
      }
      .track i {
        width: 3px;
        border-radius: 2px;
        background: #33c3b0;
        opacity: 0.8;
      }
      .track.b i {
        background: #e7b65c;
      }
      .qrbox {
        padding: 10px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 0 0 1px var(--pk-border-subtle);
        line-height: 0;
      }
      .uwin {
        width: 680px;
        height: 460px;
        display: grid;
        grid-template-columns: 150px 1fr;
      }
      .uwin .left {
        padding: 56px 0 0 36px;
      }
      .uwin .right {
        padding: 50px 32px 28px 10px;
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        gap: 18px;
      }
      .notesbox {
        border-radius: 14px;
        background: var(--pk-surface-sunken);
        box-shadow: inset 0 0 0 1px var(--kit-hairline);
        padding: 18px 20px;
        overflow: hidden;
      }
      .notesbox h4 {
        margin: 0 0 10px;
        font-size: 13px;
        color: var(--pk-text-muted);
      }
      .tabs {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 92px;
        display: flex;
        justify-content: center;
        align-items: end;
        gap: 6px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--kit-hairline);
      }
      .tabs span {
        display: grid;
        justify-items: center;
        gap: 4px;
        width: 86px;
        padding: 8px 0 6px;
        border-radius: 12px;
        font-size: 12px;
        color: var(--pk-text-muted);
      }
      .tabs span.on {
        background: color-mix(in oklab, var(--pk-text-strong) 7%, transparent);
        color: var(--kit-accent-fg);
        font-weight: 700;
      }
      .form {
        position: absolute;
        top: 112px;
        left: 0;
        right: 0;
        margin: 0 auto;
        width: 640px;
        display: grid;
        gap: 18px;
      }
      .form h3 {
        margin: 0 0 8px 4px;
        font-size: 13px;
        color: var(--pk-text-muted);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .form h3 .k-cue {
        width: 20px;
        height: 20px;
        border-radius: 6px;
      }
      .form .k-row {
        min-height: 50px;
        padding: 9px 16px;
      }
    </style>
  </head>
  <body>
    <main class="board">
      <figure>
        <figcaption>desktop · gate</figcaption>
        <div class="shot" data-shot="gate">
          <div class="win">
            <div class="lights"><i></i><i></i><i></i></div>
            <div class="split">
              <div class="heroPane">
                <div class="bg" data-art="tidewater" data-size="64"></div>
                <div
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="88"
                ></div>
                <h1>Tidewater Studio</h1>
                <p>by Harbor Audio</p>
              </div>
              <div class="formPane">
                <div class="inner">
                  <div style="display: grid; gap: 8px">
                    <h2 class="k-h1">Let’s get you set up</h2>
                    <p class="k-lede">
                      Sign in, or add the license from your purchase email.
                    </p>
                  </div>
                  <div style="display: grid; gap: 10px">
                    <button class="k-btn primary block focus">Sign in</button>
                    <button class="k-btn secondary block">
                      <span data-icon="key" data-size="18"></span>Use a license
                      key
                    </button>
                  </div>
                  <div
                    style="
                      display: flex;
                      gap: 6px;
                      justify-content: center;
                      color: var(--pk-text-muted);
                    "
                  >
                    <span
                      class="k-btn quiet sm"
                      style="font-weight: 400; color: var(--pk-text-muted)"
                      >Start a 14-day trial</span
                    >
                    <span
                      class="k-btn quiet sm"
                      style="font-weight: 400; color: var(--pk-text-muted)"
                      >Activate offline…</span
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <figure>
        <figcaption>desktop · activate (sheet)</figcaption>
        <div class="shot" data-shot="activate">
          <div class="win">
            <div class="lights"><i></i><i></i><i></i></div>
            <div class="split">
              <div class="heroPane">
                <div class="bg" data-art="tidewater" data-size="64"></div>
                <div
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="88"
                ></div>
                <h1>Tidewater Studio</h1>
                <p>by Harbor Audio</p>
              </div>
              <div></div>
            </div>
            <div class="scrim"></div>
            <div class="sheet" style="width: 460px">
              <h2 class="k-h1" style="font-size: 22px">Add your license</h2>
              <div>
                <label class="k-label">License key</label>
                <div class="k-field focus">
                  <span class="mono"
                    >pkey_tidewater_7Q2MXK9RV4TC8HJN3WPLDA</span
                  >
                </div>
                <div class="k-help ok">
                  <span data-icon="badge" data-size="16"></span
                  ><b>Tidewater Studio Pro</b
                  ><span>· Lifetime · 3 devices</span>
                </div>
              </div>
              <div
                class="row-actions"
                style="display: flex; gap: 10px; justify-content: flex-end"
              >
                <button class="k-btn secondary">Cancel</button>
                <button class="k-btn primary">Activate</button>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <figure>
        <figcaption>
          desktop · sign-in (browser hand-off, phone option)
        </figcaption>
        <div class="shot" data-shot="sign-in">
          <div class="win">
            <div class="lights"><i></i><i></i><i></i></div>
            <div class="split">
              <div class="heroPane">
                <div class="bg" data-art="tidewater" data-size="64"></div>
                <div
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="88"
                ></div>
                <h1>Tidewater Studio</h1>
                <p>by Harbor Audio</p>
              </div>
              <div class="formPane">
                <div class="inner">
                  <div style="display: grid; gap: 8px">
                    <h2 class="k-h1">Finish in your browser</h2>
                    <p class="k-lede">
                      Check the code there matches. This window moves on by
                      itself.
                    </p>
                  </div>
                  <div style="display: flex; gap: 18px; align-items: center">
                    <div class="qrbox" data-qr="11" data-size="112"></div>
                    <div style="display: grid; gap: 6px">
                      <span
                        class="mono"
                        style="
                          font-size: 26px;
                          font-weight: 700;
                          letter-spacing: 0.1em;
                          color: var(--pk-text-strong);
                        "
                        >WDJB-MJHT</span
                      >
                      <span style="font-size: 13px; color: var(--pk-text-muted)"
                        >Or scan to sign in on your phone</span
                      >
                      <span
                        style="
                          display: flex;
                          gap: 8px;
                          align-items: center;
                          font-size: 13px;
                          color: var(--pk-text-muted);
                        "
                        class="tnum"
                        ><span
                          class="k-ring"
                          style="width: 14px; height: 14px; border-width: 2px"
                        ></span
                        >Waiting · 4:52</span
                      >
                    </div>
                  </div>
                  <div style="display: flex; gap: 10px">
                    <button class="k-btn quiet">Cancel</button>
                    <span style="flex: 1"></span>
                    <button class="k-btn secondary">
                      <span data-icon="external" data-size="18"></span>Open
                      browser again
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <figure>
        <figcaption>desktop · device limit (sheet)</figcaption>
        <div class="shot" data-shot="device-limit">
          <div class="win">
            <div class="lights"><i></i><i></i><i></i></div>
            <div class="toolbar">
              <span
                class="k-appicon"
                data-art="tidewater"
                data-size="22"
                style="border-radius: 6px"
              ></span
              >Tidewater Studio
            </div>
            <div class="tracks" style="padding: 0 24px" id="tr1"></div>
            <div class="scrim"></div>
            <div class="sheet" style="width: 520px; top: 50px; gap: 16px">
              <h2 class="k-h1" style="font-size: 22px">
                Your license is on 3 of 3 devices
              </h2>
              <div class="k-meter">
                <i class="on"></i><i class="on"></i><i class="on"></i>
              </div>
              <p class="k-lede" style="font-size: 14px">
                To use it on
                <b style="color: var(--pk-text-strong)">Studio Mac mini</b>,
                remove one. You can add it back later.
              </p>
              <div style="display: grid; gap: 6px">
                <div class="k-choice on">
                  <span class="dev" data-icon="laptop" data-size="20"></span>
                  <div>
                    <b>Work laptop</b
                    ><small>Windows 11 · last used 41 days ago</small>
                  </div>
                  <span class="k-radio"></span>
                </div>
                <div class="k-choice">
                  <span class="dev" data-icon="tablet" data-size="20"></span>
                  <div>
                    <b>Mara’s iPad</b><small>iPadOS 26 · used yesterday</small>
                  </div>
                  <span class="k-radio"></span>
                </div>
                <div class="k-choice">
                  <span class="dev" data-icon="laptop" data-size="20"></span>
                  <div>
                    <b>MacBook Pro</b><small>macOS 26 · used today</small>
                  </div>
                  <span class="k-radio"></span>
                </div>
              </div>
              <div style="display: flex; gap: 10px; justify-content: flex-end">
                <button class="k-btn secondary">Cancel</button>
                <button class="k-btn primary">Remove and continue</button>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <figure>
        <figcaption>
          desktop · update window (replaces Sparkle / electron-updater UI)
        </figcaption>
        <div class="shot" data-shot="update">
          <div class="win uwin">
            <div class="lights"><i></i><i></i><i></i></div>
            <div class="left">
              <div class="k-appicon" data-art="tidewater" data-size="84"></div>
            </div>
            <div class="right">
              <div style="display: grid; gap: 4px">
                <h2 class="k-h1" style="font-size: 22px">
                  Tidewater Studio 2.5 is available
                </h2>
                <span class="k-lede" style="font-size: 14px"
                  >You have 2.4.1 · 61 MB</span
                >
              </div>
              <div class="notesbox">
                <h4>What’s new</h4>
                <ul class="k-notes">
                  <li>Stem export in one click, with loudness matching</li>
                  <li>Track freeze now works with every plug-in</li>
                  <li>Fixes a crash when unplugging an audio interface</li>
                  <li>Faster project loading on Apple silicon</li>
                </ul>
              </div>
              <div style="display: grid; gap: 6px">
                <div class="k-progress"><i style="width: 62%"></i></div>
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    font-size: 12.5px;
                    color: var(--pk-text-muted);
                  "
                  class="tnum"
                >
                  <span>Downloading · 38 of 61 MB</span><span>About 20 s</span>
                </div>
              </div>
              <div style="display: flex; gap: 10px; align-items: center">
                <button class="k-btn quiet sm" style="padding-left: 0">
                  Skip this version
                </button>
                <span style="flex: 1"></span>
                <button class="k-btn secondary sm">Later</button>
                <button class="k-btn primary sm">Relaunch when ready</button>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <figure>
        <figcaption>desktop · settings window (Account tab)</figcaption>
        <div class="shot" data-shot="settings">
          <div class="win">
            <div class="lights"><i></i><i></i><i></i></div>
            <div class="tabs">
              <span
                ><span data-icon="sliders" data-size="22"></span>General</span
              >
              <span><span data-icon="play" data-size="22"></span>Audio</span>
              <span class="on"
                ><span data-icon="user" data-size="22"></span>Account</span
              >
              <span
                ><span data-icon="update" data-size="22"></span>Updates</span
              >
            </div>
            <div class="form">
              <section>
                <div class="k-group">
                  <div class="k-row" style="min-height: 70px">
                    <span
                      class="k-appicon"
                      data-art="tidewater"
                      data-size="40"
                      style="border-radius: 10px"
                    ></span>
                    <div class="t">
                      <b>Tidewater Studio Pro</b
                      ><small>Lifetime · mara@fennick.studio</small>
                    </div>
                    <div class="v">
                      <button class="k-btn secondary sm">Manage…</button>
                    </div>
                  </div>
                </div>
              </section>
              <section>
                <h3>
                  <span
                    class="k-cue license"
                    data-icon="laptop"
                    data-size="12"
                  ></span
                  >Devices · 2 of 3
                </h3>
                <div class="k-group">
                  <div class="k-row">
                    <span data-icon="laptop" data-size="18"></span>
                    <div class="t"><b>Studio Mac mini</b></div>
                    <div class="v">This Mac</div>
                  </div>
                  <div class="k-row">
                    <span data-icon="tablet" data-size="18"></span>
                    <div class="t">
                      <b>Mara’s iPad</b><small>Used yesterday</small>
                    </div>
                    <div class="v">
                      <button class="k-btn quiet sm">Remove…</button>
                    </div>
                  </div>
                </div>
              </section>
              <section>
                <div class="k-group">
                  <div class="k-row">
                    <div class="t">
                      <b>Share crash reports</b
                      ><small>Set by your organization</small>
                    </div>
                    <div class="v">
                      <span data-icon="lock" data-size="14"></span
                      ><span class="k-switch on locked"></span>
                    </div>
                  </div>
                </div>
              </section>
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                "
              >
                <button class="k-btn quiet sm" style="padding-left: 4px">
                  <span data-icon="logout" data-size="16"></span>Sign out
                </button>
                <span class="k-powered"
                  ><span data-k data-size="13"></span>Powered by Polaris
                  Key</span
                >
              </div>
            </div>
          </div>
        </div>
      </figure>
    </main>
    <script>
      const tr = document.getElementById("tr1");
      ["", "b", "", "b", "", "b", ""].forEach((cls, t) => {
        let bars = "";
        for (let i = 0; i < 200; i++)
          bars += `<i style="height:${(6 + Math.abs(Math.sin(i * 0.37 + t) * Math.cos(i * 0.11 + t * 2)) * 38).toFixed(0)}px"></i>`;
        tr.insertAdjacentHTML(
          "beforeend",
          `<div class="track ${cls}">${bars}</div>`,
        );
      });
    </script>
  </body>
</html>
