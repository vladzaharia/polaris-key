<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI kits · Apple: iPad, visionOS, tvOS, watchOS (SwiftUI)</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* The Apple platforms beyond iPhone (UI-KITS §1.4, §8): iPad at regular width (11-inch,
         1180 × 820 pt landscape; the built SwiftUI kit's), then visionOS, tvOS (1920 × 1080 pt)
         and watchOS (41, 45 and 49 mm) in both presets, drawn to the design language. The
         visionOS, tvOS and watchOS shots are generated by the script at the foot of the page. */
      .glass {
        background: rgb(255 255 255 / 0.1);
        backdrop-filter: blur(24px) saturate(1.8);
        -webkit-backdrop-filter: blur(24px) saturate(1.8);
        box-shadow:
          inset 0 1px 0.5px rgb(255 255 255 / 0.3),
          inset 0 -0.5px 0.5px rgb(255 255 255 / 0.08);
        color: var(--pk-text-strong);
      }
      [data-theme="light"] .glass {
        background: rgb(255 255 255 / 0.5);
        box-shadow:
          inset 0 1px 0.5px rgb(255 255 255 / 0.95),
          inset 0 -0.5px 0.5px rgb(0 0 0 / 0.04);
      }
      .glass.prominent {
        background: var(--kit-accent);
        color: #fff;
        box-shadow:
          inset 0 1px 0.5px rgb(255 255 255 / 0.4),
          inset 0 -1px 1px rgb(0 0 0 / 0.08),
          0 2px 8px rgb(0 0 0 / 0.12);
      }
      .cap {
        height: 52px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font: 500 17px/1 var(--pk-font-sans);
      }
      .ttl {
        font: 600 28px/34px var(--pk-font-sans);
        color: var(--pk-text-strong);
        margin: 0;
        text-wrap: balance;
      }
      .sub {
        color: var(--pk-text-muted);
        margin: 0;
        font-size: 17px;
        line-height: 22px;
        text-wrap: pretty;
      }
      .link {
        color: var(--kit-accent-fg);
        font: 500 15px/44px var(--pk-font-sans);
      }

      /* ── iPad ─────────────────────────────────────────────────────────────────────────── */
      .ipad {
        width: 1212px;
        height: 852px;
        padding: 16px;
        border-radius: 40px;
        background: #1b1c20;
        box-shadow:
          0 0 0 1px #3a3b40 inset,
          0 30px 60px -20px rgb(0 0 0 / 0.5);
      }
      [data-theme="light"] .ipad {
        background: #d9dbe2;
        box-shadow:
          0 0 0 1px #c3c6cf inset,
          0 30px 60px -20px rgb(6 9 18 / 0.25);
      }
      .ipad .screen {
        position: relative;
        width: 1180px;
        height: 820px;
        border-radius: 26px;
        overflow: hidden;
        background: #000;
        isolation: isolate;
        color: var(--pk-text-strong);
      }
      [data-theme="light"] .ipad .screen {
        background: #f2f2f7;
      }
      .ipad .bar {
        position: absolute;
        top: 0;
        inset-inline-start: 0;
        inset-inline-end: 0;
        height: 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 24px;
        font:
          600 15px/1 -apple-system,
          system-ui;
        z-index: 40;
      }
      .amb {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(40% 50% at 30% 30%, #0f6f7a, transparent 70%),
          radial-gradient(30% 40% at 70% 22%, #c9a35c, transparent 72%),
          radial-gradient(50% 60% at 50% 60%, #1aa594, transparent 75%);
        opacity: 0.45;
        filter: blur(30px) saturate(1.2);
      }
      [data-theme="light"] .amb {
        opacity: 0.22;
      }
      .ipad .dimmer {
        position: absolute;
        inset: 0;
        background: rgb(0 0 0 / 0.32);
        z-index: 5;
      }
      [data-theme="light"] .ipad .dimmer {
        background: rgb(0 0 0 / 0.18);
      }
      .formsheet {
        position: absolute;
        inset-inline-start: 50%;
        top: 92px;
        translate: -50% 0;
        width: 580px;
        border-radius: 34px;
        padding: 18px 28px 30px;
        z-index: 10;
        background: rgb(28 30 36 / 0.82);
        backdrop-filter: blur(30px) saturate(1.6);
        box-shadow:
          inset 0 1px 0.5px rgb(255 255 255 / 0.22),
          0 30px 70px rgb(0 0 0 / 0.45);
      }
      /* A control on a blurred sheet is a flat fill, never a second backdrop-filter (§7.3). */
      .formsheet .glass {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      [data-theme="light"] .formsheet {
        background: rgb(249 249 251 / 0.97);
        box-shadow:
          inset 0 1px 0.5px #fff,
          0 30px 70px rgb(6 9 18 / 0.2);
      }
      .sbar {
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        margin-bottom: 18px;
      }
      .sbar .mid {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font: 600 17px/1 var(--pk-font-sans);
      }
      .circ {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .fld {
        background: rgb(120 120 128 / 0.2);
        border-radius: 22px;
        min-height: 56px;
        display: flex;
        align-items: center;
        padding: 10px 8px 10px 18px;
        gap: 10px;
      }
      [data-theme="light"] .fld {
        background: #fff;
      }
      .fld .mono {
        flex: 1;
        font-size: 16px;
      }
      .flabel {
        font-size: 13px;
        line-height: 18px;
        color: var(--pk-text-subtle);
        margin: 0 4px 8px;
      }

      /* ── Shared by visionOS, tvOS and watchOS ──────────────────────────────────────────────
         Two presets, drawn from one markup: polaris-key resolves the product accent and sets
         Rubik; native takes the platform's own tint and system font (DL13). Text carries no
         family of its own: it inherits the shot's, so native swaps it in one place. */
      .pk {
        --acc: var(--kit-accent);
        --acc-fg: var(--kit-accent-fg);
        --acc-on: var(--kit-accent-on);
        font-family: var(--pk-font-sans);
      }
      .nat {
        font-family:
          -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif;
      }
      .mono {
        font-family: var(--kit-mono);
      }
      .ico {
        display: block;
        flex: none;
      }

      /* ── visionOS ─────────────────────────────────────────────────────────────────────────
         Windows are 1 pt = 1 px. The glass is the system material in both presets, so the
         product ambient is off: polaris-key shows only in the accent, the type and the
         identity. The room is the person's environment (passthrough), not the kit. */
      .room {
        --wt: 100px;
        --wh: 460px;
        width: 1280px;
        height: 760px;
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        isolation: isolate;
        background:
          radial-gradient(60% 40% at 50% 100%, #3b3127, transparent 70%),
          linear-gradient(#2c3138, #1a1d21 60%, #2b241d);
      }
      [data-theme="light"] .room {
        background:
          radial-gradient(60% 40% at 50% 100%, #d8c6ae, transparent 70%),
          linear-gradient(#e9eef2, #d3dae0 60%, #cdb79c);
      }
      .room.nat {
        --acc: #0a84ff;
        --acc-fg: #5eb0ff;
        --acc-on: #fff;
      }
      .room.s {
        --wh: 580px;
      }
      .room.s2 {
        --wh: 500px;
      }
      .vl.sm {
        font-size: 19px;
        line-height: 26px;
        color: rgb(255 255 255 / 0.7);
      }
      .room.tall {
        --wt: 40px;
        --wh: 560px;
        width: 640px;
        height: 740px;
      }
      .room.mini {
        --wt: 60px;
        --wh: 260px;
        width: 620px;
        height: 440px;
      }
      .room .window-light {
        position: absolute;
        inset-inline-start: 6%;
        top: 8%;
        width: 26%;
        height: 58%;
        border-radius: 6px;
        background: linear-gradient(#cfe3f2, #9ab9cf);
        opacity: 0.35;
        filter: blur(2px);
      }
      .vwin {
        position: absolute;
        inset-inline-start: 50%;
        top: var(--wt);
        translate: -50% 0;
        width: 1000px;
        min-height: var(--wh);
        border-radius: 52px;
        background: rgb(128 128 128 / 0.3);
        backdrop-filter: blur(40px) saturate(1.5);
        box-shadow:
          inset 0 1px 1px rgb(255 255 255 / 0.35),
          inset 0 -1px 1px rgb(255 255 255 / 0.1),
          0 40px 80px rgb(0 0 0 / 0.35);
        color: var(--kit-white);
        display: grid;
        grid-template-columns: 380px 1fr;
        overflow: hidden;
      }
      /* In a bright room the material darkens and the text stays white. */
      [data-theme="light"] .vwin,
      [data-theme="light"] .ornament {
        background: rgb(64 64 70 / 0.5);
      }
      .tall .vwin {
        width: 500px;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .mini .vwin {
        width: 460px;
        display: block;
      }
      /* Start pane: the identity panel (DL1). Icon only, on a sunken inset of the glass. */
      .vstart {
        margin: 14px;
        border-radius: 40px;
        background: rgb(0 0 0 / 0.16);
        display: grid;
        justify-items: center;
        align-content: center;
      }
      .tall .vstart {
        padding: 16px 0;
        align-content: center;
        border-radius: 32px;
      }
      .vend {
        padding: 64px 56px 40px 42px;
        display: grid;
        align-content: start;
        gap: 16px;
        min-width: 0;
      }
      .tall .vend {
        padding: 28px 44px 40px;
        align-content: start;
      }
      .vt {
        margin: 0;
        font-weight: 600;
        font-size: 40px;
        line-height: 48px;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      .tall .vt {
        font-size: 36px;
        line-height: 44px;
      }
      .vl {
        margin: 0;
        font-weight: 400;
        font-size: 21px;
        line-height: 30px;
        color: rgb(255 255 255 / 0.84);
        text-wrap: pretty;
      }
      .vacts {
        display: grid;
        gap: 12px;
        margin-top: 12px;
        max-width: 400px;
      }
      .tall .vacts {
        max-width: none;
      }
      .vb {
        height: 64px;
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 500;
        font-size: 20px;
        line-height: 1;
        background: rgb(255 255 255 / 0.14);
        color: var(--kit-white);
        padding: 0 28px;
        white-space: nowrap;
      }
      .vb.p {
        background: var(--acc);
        color: var(--acc-on);
      }
      /* Gaze hover (.hoverEffect): the control lifts and brightens; DL9's focus signal. */
      .vb.hv {
        background: rgb(255 255 255 / 0.28);
        scale: 1.04;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.3);
      }
      .vb.p.hv {
        background: var(--acc);
        filter: brightness(1.18);
      }
      .vcall {
        background: rgb(0 0 0 / 0.18);
        border-radius: 22px;
        padding: 16px 20px;
        font-weight: 400;
        font-size: 19px;
        line-height: 27px;
        color: rgb(255 255 255 / 0.9);
      }
      .vcode {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 12px 12px 24px;
        border-radius: 24px;
        background: rgb(0 0 0 / 0.18);
      }
      .vcode b {
        font-weight: 600;
        font-size: 44px;
        line-height: 1;
        letter-spacing: 0.06em;
      }
      .vchip {
        height: 60px;
        padding: 0 22px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
        font-size: 19px;
        background: rgb(255 255 255 / 0.14);
      }
      .vwait {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 400;
        font-size: 19px;
        line-height: 24px;
        color: rgb(255 255 255 / 0.84);
      }
      .vwait .k-countdown .left {
        stroke: var(--kit-white);
      }
      .grabber {
        position: absolute;
        inset-inline-start: 50%;
        top: calc(var(--wt) + var(--wh) + 104px);
        translate: -50% 0;
        width: 120px;
        height: 10px;
        border-radius: 5px;
        background: rgb(255 255 255 / 0.55);
      }
      [data-theme="light"] .grabber {
        background: rgb(30 30 30 / 0.35);
      }
      .mini .grabber {
        top: calc(var(--wt) + var(--wh) + 92px);
      }
      .ornament {
        position: absolute;
        inset-inline-start: 50%;
        top: calc(var(--wt) + var(--wh) + 16px);
        translate: -50% 0;
        height: 72px;
        padding: 0 6px;
        border-radius: 36px;
        display: flex;
        align-items: center;
        gap: 4px;
        background: rgb(128 128 128 / 0.32);
        backdrop-filter: blur(30px);
        box-shadow: inset 0 1px 1px rgb(255 255 255 / 0.3);
        color: var(--kit-white);
        font-weight: 500;
        font-size: 18px;
        white-space: nowrap;
      }
      .ornament > span {
        height: 60px;
        padding: 0 22px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ornament > span.vb {
        height: 60px;
        font-size: 18px;
        padding: 0 28px;
      }
      .ornament:has(> span.vb) {
        padding: 0 6px 0 10px;
      }
      .ornament > span.note {
        font-weight: 400;
      }
      .host {
        position: absolute;
        inset-inline-start: 50%;
        top: var(--wt);
        translate: -50% 0;
        width: 460px;
        height: var(--wh);
        border-radius: 40px;
        background: rgb(128 128 128 / 0.22);
        backdrop-filter: blur(40px);
        box-shadow: inset 0 1px 1px rgb(255 255 255 / 0.3);
        display: grid;
        place-items: center;
        color: var(--kit-white);
        font-weight: 600;
        font-size: 24px;
      }
      [data-theme="light"] .host {
        background: rgb(64 64 70 / 0.4);
      }

      /* ── tvOS ─────────────────────────────────────────────────────────────────────────────
         1920 × 1080 pt, drawn at full size inside the system's title-safe area (90 across,
         60 down). Body type starts at 36, past the TV floor. The focus engine replaces the
         ring: the focused control lifts to 1.05 on a plate. First focus is never an opener. */
      .tv {
        width: 1920px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        isolation: isolate;
        background: var(--pk-surface-sunken);
        color: var(--pk-text-strong);
        --plate: var(--kit-white);
        --plate-ink: var(--kit-ink);
        --soft: color-mix(in oklab, var(--pk-text-strong) 14%, transparent);
        --dim: color-mix(in oklab, var(--pk-text-strong) 72%, transparent);
      }
      .tv.nat {
        --acc: var(--kit-white);
        --acc-fg: var(--pk-text-strong);
        --acc-on: var(--kit-ink);
      }
      [data-theme="light"] .tv.nat {
        --acc: var(--pk-text-strong);
        --acc-on: var(--kit-white);
      }
      .tv.sheet {
        height: 540px;
      }
      .tsafe {
        position: absolute;
        inset: 60px 90px;
        display: grid;
        grid-template-columns: 1fr 560px;
        column-gap: 120px;
        align-content: center;
        align-items: start;
      }
      .tsafe.split {
        grid-template-columns: 760px 1fr;
        column-gap: 96px;
      }
      .tsafe.one {
        grid-template-columns: minmax(0, 880px);
        justify-content: center;
      }
      .tstack {
        display: grid;
        gap: 28px;
        align-content: start;
        min-width: 0;
      }
      .thead {
        display: flex;
        align-items: center;
        gap: 24px;
        font-weight: 500;
        font-size: 40px;
        line-height: 48px;
      }
      .tt {
        margin: 0;
        font-weight: 600;
        font-size: 64px;
        line-height: 72px;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      .tt.xl {
        font-size: 76px;
        line-height: 84px;
      }
      .tl {
        margin: 0;
        font-weight: 400;
        font-size: 36px;
        line-height: 50px;
        color: var(--dim);
        text-wrap: pretty;
      }
      .turl {
        font-weight: 500;
        font-size: 56px;
        line-height: 64px;
        color: var(--acc-fg);
      }
      .tcode {
        font-weight: 600;
        font-size: 96px;
        line-height: 1;
        letter-spacing: 0.06em;
      }
      .tcode.sm {
        font-size: 64px;
      }
      .twait {
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 400;
        font-size: 32px;
        line-height: 40px;
        color: var(--dim);
      }
      .tv .k-countdown {
        width: 36px;
        height: 36px;
      }
      .tv.nat .k-countdown .left {
        stroke: var(--pk-text-strong);
      }
      .tpanel {
        height: 640px;
        border-radius: 56px;
        display: grid;
        place-items: center;
        background: var(--kit-accent-subtle);
        position: relative;
        overflow: hidden;
      }
      /* The icon ambient (dark) is one soft wash behind the icon, on the start pane only. */
      [data-theme="dark"] .tv.pk .tpanel {
        background: radial-gradient(
          60% 60% at 50% 45%,
          color-mix(in oklab, var(--kit-accent) 55%, transparent),
          transparent 78%
        );
      }
      .tv.nat .tpanel {
        background: var(--pk-surface-raised);
      }
      .tqr {
        padding: 8px;
        border-radius: 32px;
        background: rgb(255 255 255 / 0.92);
        line-height: 0;
        width: max-content;
      }
      [data-theme="light"] .tqr {
        box-shadow: inset 0 0 0 1px rgb(6 9 18 / 0.1);
      }
      .tdev {
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 400;
        font-size: 32px;
        line-height: 40px;
        color: var(--dim);
      }
      .tacts {
        display: grid;
        gap: 24px;
        margin-top: 12px;
      }
      .tacts.row {
        grid-auto-flow: column;
        justify-content: start;
        gap: 32px;
      }
      .tsafe.split .tacts {
        max-width: 640px;
      }
      .tb {
        height: 92px;
        padding: 0 48px;
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-weight: 500;
        font-size: 36px;
        line-height: 1;
        background: var(--soft);
        color: var(--pk-text-strong);
        white-space: nowrap;
      }
      .tb.p {
        background: var(--acc);
        color: var(--acc-on);
      }
      .tb.f {
        background: var(--plate);
        color: var(--plate-ink);
        scale: 1.05;
        box-shadow: 0 28px 48px -12px rgb(0 0 0 / 0.5);
      }
      .tb.p.f {
        background: var(--acc);
        color: var(--acc-on);
        filter: brightness(1.12);
      }
      [data-theme="light"] .tb.f {
        box-shadow: 0 28px 48px -12px rgb(6 9 18 / 0.3);
      }
      .tb.nofx {
        scale: 1;
        box-shadow: none;
        filter: none;
      }
      .tcall {
        background: var(--pk-surface-raised);
        border-radius: 28px;
        padding: 28px 36px;
        font-weight: 400;
        font-size: 36px;
        line-height: 50px;
        color: var(--pk-text-default);
        text-wrap: pretty;
      }
      .thint {
        position: absolute;
        inset-inline-end: 90px;
        bottom: 60px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
        font-size: 32px;
        line-height: 40px;
        color: var(--dim);
      }
      .tcell {
        display: grid;
        gap: 24px;
        justify-items: center;
      }
      .tcell .lbl {
        font-weight: 500;
        font-size: 32px;
        color: var(--dim);
      }
      .tgrid {
        position: absolute;
        inset: 60px 90px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        align-items: center;
        justify-items: center;
      }

      /* ── watchOS ──────────────────────────────────────────────────────────────────────────
         Dark only: the watch has one scheme, so both renders are the same screen. Sizes are
         the 41, 45 and 49 mm screens in pt; large text is the accessibility step that fits
         three lines of title. */
      .wset {
        display: grid;
        gap: 40px;
        padding: 24px;
      }
      .wrow {
        display: flex;
        align-items: flex-start;
        gap: 40px;
      }
      .wcell {
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      .wcell .lbl {
        font-weight: 500;
        font-size: 13px;
        color: var(--pk-text-muted);
      }
      .watch {
        padding: 12px;
        background: #26272b;
        box-shadow: inset 0 0 0 2px #3c3d42;
      }
      .wscreen {
        background: #000;
        color: #fff;
        position: relative;
        overflow: hidden;
        padding: 36px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        text-align: center;
        font-size: 15px;
        line-height: 19px;
      }
      .wscreen .time {
        position: absolute;
        top: 8px;
        inset-inline-end: 20px;
        font:
          600 15px/1 -apple-system,
          system-ui;
        color: rgb(255 255 255 / 0.85);
      }
      .wscreen.nat {
        --acc: #0a84ff;
        --acc-on: #fff;
        font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
      }
      .wt {
        margin: 0 0 12px;
        font-weight: 600;
        font-size: 17px;
        line-height: 21px;
        text-wrap: balance;
      }
      .wl {
        margin: 0;
        font-weight: 400;
        font-size: 15px;
        line-height: 19px;
        color: rgb(255 255 255 / 0.7);
      }
      .wstat {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
        font-size: 15px;
        line-height: 19px;
      }
      .wcode {
        font-weight: 600;
        font-size: 24px;
        line-height: 28px;
        letter-spacing: 0.06em;
      }
      .wbtn {
        flex: none;
        margin-top: auto;
        width: 100%;
        height: 44px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-weight: 500;
        font-size: 16px;
        line-height: 1;
        background: rgb(255 255 255 / 0.16);
        color: #fff;
      }
      .wbtn.p {
        background: var(--acc);
        color: var(--acc-on);
      }
      .wlink {
        font-weight: 500;
        font-size: 15px;
        line-height: 20px;
        color: color-mix(in oklab, var(--acc) 55%, var(--kit-white));
      }
      .wscreen.big {
        padding-top: 32px;
        font-size: 20px;
        line-height: 25px;
      }
      .big .wt {
        margin-bottom: 6px;
        font-size: 23px;
        line-height: 27px;
      }
      .big .wl,
      .big .wstat,
      .big .wlink {
        font-size: 20px;
        line-height: 25px;
      }
      .big .wbtn {
        height: 50px;
        border-radius: 25px;
        font-size: 21px;
      }
      .big .wcode {
        font-size: 32px;
        line-height: 36px;
      }
    </style>
  </head>
  <body>
    <main class="board">
      <!-- 1. iPad, regular width -->
      <figure>
        <figcaption>
          ipad · regular width (11-inch landscape): the gate and the activate
          form sheet
        </figcaption>
        <div class="ipad" data-shot="ipad">
          <div class="screen">
            <div class="bar"><span>9:41 Mon 5 Oct</span><span>100%</span></div>
            <div class="amb"></div>
            <div
              style="
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                text-align: center;
              "
            >
              <div
                style="
                  display: grid;
                  justify-items: center;
                  gap: 12px;
                  width: 480px;
                "
              >
                <div
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="128"
                  style="border-radius: 29px"
                ></div>
                <h1
                  class="ttl"
                  style="font-size: 34px; line-height: 40px; margin-top: 18px"
                >
                  Welcome to Tidewater Studio
                </h1>
                <span style="font-size: 13px; color: var(--pk-text-subtle)"
                  >by Harbor Audio</span
                >
                <p class="sub">Sign in or add your license to start.</p>
                <div
                  style="
                    display: grid;
                    gap: 12px;
                    width: 380px;
                    margin-top: 18px;
                  "
                >
                  <div class="glass prominent cap">Sign in</div>
                  <div class="glass cap">Use a license key</div>
                </div>
              </div>
            </div>
            <div class="dimmer"></div>
            <div class="formsheet">
              <div class="sbar">
                <span
                  class="glass circ"
                  data-icon="x"
                  data-size="20"
                  aria-label="Cancel"
                ></span>
                <span class="mid"
                  ><span
                    class="k-appicon"
                    data-art="tidewater"
                    data-size="28"
                    style="border-radius: 7px"
                  ></span
                  >Tidewater Studio</span
                >
                <span
                  class="glass prominent circ"
                  data-icon="check"
                  data-size="20"
                  aria-label="Activate"
                ></span>
              </div>
              <h2 class="ttl" style="margin: 0 4px 6px">Add your license</h2>
              <p
                class="sub"
                style="margin: 0 4px 22px; font-size: 15px; line-height: 20px"
              >
                Your key is in the purchase email from Harbor Audio.
              </p>
              <div class="flabel">License key</div>
              <div class="fld">
                <span class="mono"
                  ><span class="k-key"
                    ><span>pkey_tidewater_7Q2MXK9RV4TC8HJN</span
                    ><span>3WPLDA</span></span
                  ></span
                >
              </div>
              <div
                class="k-verdict"
                style="margin: 10px 4px 0; font-size: 15px"
              >
                <span data-icon="checkCircle" data-size="16"></span>
                <span
                  ><b style="font-weight: 600; color: var(--pk-text-strong)"
                    >Tidewater Studio Pro</b
                  >&#8201;·&#8201;Lifetime&#8201;·&#8201;3 devices</span
                >
              </div>
              <div style="display: flex; gap: 12px; margin-top: 28px">
                <div class="glass cap" style="flex: 1">Cancel</div>
                <div class="glass prominent cap" style="flex: 1">Activate</div>
              </div>
            </div>
          </div>
        </div>
      </figure>
    </main>
    <script>
      /* The visionOS, tvOS and watchOS shots are generated from one markup per screen, so the
         polaris-key and native presets (and the sizes) cannot drift apart. Each shot is a
         [data-shot] figure; render.cjs shoots them. */
      (function () {
        const main = document.querySelector("main.board");
        const ic = (n, s) => icon(n, s);
        const fig = (cap, shot, html) => {
          const f = document.createElement("figure");
          f.innerHTML = `<figcaption>${cap}</figcaption>${html}`;
          main.appendChild(f);
          return f;
        };
        const icon3 = (s, round) =>
          `<div class="k-appicon" style="border-radius:${round ? "50%" : Math.round(s * 0.225) + "px"}">${art("tidewater", s)}</div>`;
        const ext = (s) =>
          `<span class="ico" aria-hidden="true">${ic("external", s)}</span>`;

        /* ── visionOS ───────────────────────────────────────────────────────────────────── */
        const orn = (items) =>
          `<div class="ornament">${items.map((t) => `<span>${t}</span>`).join("")}</div>`;
        const restoreOrn = orn(["Restore purchase", "Activate offline"]);
        const vwin = (start, end) =>
          `<div class="vwin"><div class="vstart">${start}</div><div class="vend">${end}</div></div>`;
        const room = (shot, cls, inner, native) =>
          `<div class="room ${cls || ""} ${native ? "nat" : "pk"}" data-shot="${shot}"${native ? ' data-ui-preset="native"' : ""}><div class="window-light"></div>${inner}<div class="grabber"></div></div>`;
        const vGate = (hv) =>
          `<h1 class="vt">Welcome to Tidewater Studio</h1><p class="vl">Sign in or use a license key to continue.</p><div class="vacts"><div class="vb p${hv ? " hv" : ""}">Sign in</div><div class="vb">Use a license key</div></div>`;
        const vSignIn = () =>
          `<h1 class="vt">Finish in your browser</h1><p class="vl">Check the code there matches this one.</p><div class="vcode"><b class="mono">WDJB-MJHT</b><span class="vchip">${ic("copy", 22)}Copy</span></div><div class="vwait">${countdown(0.84, 24)}Code expires in 4:12</div><p class="vl sm">Or go to key.plrs.im/activate</p><div class="vacts"><div class="vb p">Open browser again${ext(20)}</div><div class="vb">Cancel</div></div>`;
        const vLimit = () =>
          `<h1 class="vt">Your license is on 3 of 3 devices</h1><div class="vcall">Replace a device in your browser. Tidewater Studio continues when you're done.</div><div class="vacts"><div class="vb p">Open in browser${ext(20)}</div><div class="vb">Cancel</div></div>`;
        const start = () => icon3(168, true);

        const presets = [
          ["pk", false, "polaris-key"],
          ["nat", true, "native"],
        ];
        for (const [, native, label] of presets) {
          const sfx = native ? "-native" : "";
          fig(
            `<b>visionOS · Welcome</b> ${label}, default window. ${native ? "System font and tint." : "Rubik on the window's own glass."} The icon is a circle, as visionOS draws it.`,
            "",
            room(
              "visionos-gate" + sfx,
              "",
              vwin(start(), vGate(false)) + restoreOrn,
              native,
            ),
          );
          fig(
            `<b>visionOS · Sign-in code</b> ${label}. No QR: the headset browses.`,
            "",
            room(
              "visionos-sign-in" + sfx,
              "s",
              vwin(start(), vSignIn()),
              native,
            ),
          );
          fig(
            `<b>visionOS · Device limit</b> ${label}. A neutral callout; the fix is the one primary.`,
            "",
            room(
              "visionos-device-limit" + sfx,
              "s2",
              vwin(start(), vLimit()),
              native,
            ),
          );
        }
        fig(
          `<b>visionOS · Narrow, tall window</b> polaris-key. One column; the panel is the header strip.`,
          "",
          room(
            "visionos-narrow",
            "tall",
            `<div class="vwin"><div class="vstart">${icon3(56, true)}</div><div class="vend">${vGate(false)}</div></div>${restoreOrn}`,
            false,
          ),
        );
        fig(
          `<b>visionOS · Gaze hover</b> polaris-key. The primary lifts and brightens; no ring.`,
          "",
          room(
            "visionos-gaze",
            "",
            vwin(start(), vGate(true)) + restoreOrn,
            false,
          ),
        );
        const hostRoom = (cls, ornHtml) =>
          `<div class="room mini ${cls}"><div class="window-light"></div><div class="host" data-ui-chrome>Tidewater Studio</div>${ornHtml}<div class="grabber"></div></div>`;
        fig(
          `<b>visionOS · Banners</b> Ornaments on the window's bottom edge, over a running app. Offline reads the days left; the update offers Later and Update now.`,
          "",
          `<div data-shot="visionos-banners" style="display:flex;gap:40px">${hostRoom(
            "pk",
            `<div class="ornament"><span class="note">${ic("wifiOff", 24)}Offline · 5 days left to reconnect</span><span class="vb p">Try again</span></div>`,
          )}${hostRoom(
            "pk",
            `<div class="ornament"><span class="note">Tidewater Studio 2.5 is available</span><span>Later</span><span class="vb p">Update now</span></div>`,
          )}</div>`,
        );

        /* ── tvOS ───────────────────────────────────────────────────────────────────────── */
        const tqr = (seed) =>
          `<div class="tqr">${qr(330, seed, "#060912", "none")}</div>`;
        const tv = (shot, native, cls, inner, hint) =>
          `<div class="tv ${native ? "nat" : "pk"} ${cls || ""}" data-shot="${shot}"${native ? ' data-ui-preset="native"' : ""}>${inner}${hint === false ? "" : `<div class="thint">${ic("chevronLeft", 32)}Back</div>`}</div>`;
        const thead = () =>
          `<div class="thead">${icon3(96, false)}<span>Tidewater Studio</span></div>`;
        const tGate = (native) =>
          `<div class="tsafe split"><div class="tpanel">${icon3(280, false)}</div><div class="tstack"><h1 class="tt xl">Welcome to Tidewater Studio</h1><p class="tl">Sign in or use a license key to continue.</p><div class="tacts"><div class="tb p f">Sign in</div><div class="tb">Use a license key</div></div></div></div>`;
        const tSignIn = () =>
          `<div class="tsafe"><div class="tstack">${thead()}<h1 class="tt">Sign in with a code</h1><p class="tl">Scan the QR code with your phone, or enter this code at the address below.</p><div class="turl">tidewater.app/link</div><div class="tcode mono">WDJB-MJHT</div><div class="twait">${countdown(0.92, 36)}Code expires in 9:12</div></div><div class="tstack">${tqr(11)}<div class="tdev">${ic("monitor", 36)}This TV</div><div class="tacts"><div class="tb f">Use a license key instead</div></div></div></div>`;
        const tLimit = () =>
          `<div class="tsafe"><div class="tstack">${thead()}<h1 class="tt">Your license is on 3 of 3 devices</h1><div class="tcall">Scan the code to replace a device on your phone.</div><div class="tdev">${ic("user", 36)}Signed in as m••••@f••••••.studio</div></div><div class="tstack">${tqr(5)}<div class="turl" style="font-size:44px;line-height:52px">tidewater.app/link</div><div class="tcode sm mono">WDJB-MJHT</div><div class="tacts"><div class="tb p f">Try again</div><div class="tb">Use another license</div></div></div></div>`;
        for (const native of [false, true]) {
          const sfx = native ? "-native" : "";
          const label = native ? "native" : "polaris-key";
          fig(
            `<b>tvOS · Welcome</b> ${label}. First focus is Sign in, which opens no browser.`,
            "",
            tv("tvos-gate" + sfx, native, "", tGate(native), false),
          );
          fig(
            `<b>tvOS · Sign-in code</b> ${label}. Focus lands on the first real control once the code arrives.`,
            "",
            tv("tvos-sign-in" + sfx, native, "", tSignIn()),
          );
          fig(
            `<b>tvOS · Device limit</b> ${label}. The email stays masked until focused.`,
            "",
            tv("tvos-device-limit" + sfx, native, "", tLimit()),
          );
        }
        fig(
          `<b>tvOS · Code expired</b> polaris-key. The QR goes with the code; Get a new code takes focus.`,
          "",
          tv(
            "tvos-expired",
            false,
            "",
            `<div class="tsafe one"><div class="tstack">${thead()}<h1 class="tt">That code or link has expired</h1><p class="tl">Codes and links work once, for 10 minutes.</p><div class="tacts row"><div class="tb p f">Get a new code</div><div class="tb">Use a license key instead</div></div></div></div>`,
          ),
        );
        const cell = (label, cls) =>
          `<div class="tcell"><div class="tb ${cls}">Use a license key</div><span class="lbl">${label}</span></div>`;
        fig(
          `<b>tvOS · Focus engine</b> polaris-key. The focused card lifts to 1.05 on a plate; the primary keeps its fill.`,
          "",
          tv(
            "tvos-focus",
            false,
            "sheet",
            `<div class="tgrid">${cell("Rest", "")}${cell("Focused", "f")}<div class="tcell"><div class="tb p">Sign in</div><span class="lbl">Primary, rest</span></div><div class="tcell"><div class="tb p f">Sign in</div><span class="lbl">Primary, focused</span></div></div>`,
            false,
          ),
        );

        /* ── watchOS ────────────────────────────────────────────────────────────────────── */
        const SIZES = {
          41: [176, 215, 40],
          45: [198, 242, 46],
          49: [205, 251, 50],
        };
        const watch = (mm, body, opts) => {
          const [w, h, r] = SIZES[mm];
          const o = opts || {};
          return `<div class="wcell"><div class="watch" style="width:${w + 24}px;height:${h + 24}px;border-radius:${r + 12}px"><div class="wscreen ${o.native ? "nat" : "pk"} ${o.big ? "big" : ""}"${o.native ? ' data-ui-preset="native"' : ""} style="width:${w}px;height:${h}px;border-radius:${r}px"><span class="time">9:41</span>${body}</div></div><span class="lbl">${o.label || mm + " mm"}</span></div>`;
        };
        const wIcon = (s) => icon3(s, true);
        const wWelcome = (mm, big) =>
          `${wIcon(big ? (mm === 41 ? 26 : 32) : mm === 41 ? 36 : 40)}<h1 class="wt">Welcome to Tidewater Studio</h1><div class="wbtn p">Sign in</div>`;
        const wActive = () =>
          `${wIcon(36)}<h1 class="wt">Tidewater Studio</h1><div class="wstat"><span style="color:color-mix(in oklab, var(--pk-success) 55%, var(--kit-white))">${ic("checkCircle", 18)}</span>Active</div><p class="wl">Pro · Lifetime</p><div class="wbtn p">Manage</div>`;
        const wHandoff = () =>
          `${wIcon(36)}<h1 class="wt">Sign in to Tidewater Studio</h1><div class="wbtn p">Continue on iPhone</div><span class="wlink">Use a code instead</span>`;
        const wCode = () =>
          `<h1 class="wt">Sign in with a code</h1><div class="wcode mono">WDJB-MJHT</div><p class="wl">tidewater.app/link</p><div class="wstat" style="font-weight:400;font-size:15px">${countdown(0.84, 18)}Code expires in 4:12</div>`;
        const wLimit = () =>
          `<h1 class="wt">Your license is on 3 of 3 devices</h1><div class="wbtn p">Continue on iPhone</div>`;
        const row = (cells) => `<div class="wrow">${cells.join("")}</div>`;
        fig(
          `<b>watchOS · Glance</b> polaris-key, 41, 45 and 49 mm; top row default text, bottom row the largest text size. Dark only: both renders match.`,
          "",
          `<div class="wset" data-shot="watch-glance">${row(
            [41, 45, 49].map((m) => watch(m, wWelcome(m, false))),
          )}${row(
            [41, 45, 49].map((m) =>
              watch(m, wWelcome(m, true), {
                big: true,
                label: m + " mm, largest text",
              }),
            ),
          )}</div>`,
        );
        fig(
          `<b>watchOS · Screens</b> 45 mm. Licensed and Welcome in the native preset, then sign-in handed to the iPhone, its code view, and the device limit. The glance leads with Continue on iPhone; the code is one tap away.`,
          "",
          `<div class="wset" data-shot="watch-states">${row([
            watch(45, wActive(), { label: "Licensed" }),
            watch(45, wWelcome(45, false), {
              native: true,
              label: "Welcome, native",
            }),
            watch(45, wHandoff(), { label: "Hand-off" }),
            watch(45, wCode(), { label: "Code" }),
            watch(45, wLimit(), { label: "Device limit" }),
          ])}</div>`,
        );
      })();
    </script>
  </body>
</html>
