<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI kits · Godot (Control nodes)</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* 1280 × 720 game viewport (and 1280 × 800 Steam Deck). Games default to the dark scheme
         (theme.colorScheme "dark" for Godot); light is opt-in and shown for parity.
         Drift Kart's accent #ff6a3d is light, so the resolver keeps the orange solid and flips
         its label to ink in both schemes rather than darkening it to brick. */
      .shot {
        width: 1280px;
        height: 720px;
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        isolation: isolate;
        font-size: 18px;
        line-height: 26px;
        color: var(--pk-text-default);
        --kit-accent: #ff6a3d;
        --kit-accent-on: #1a0b06;
        --kit-accent-fg: #ff8a63;
        --kit-accent-subtle: rgb(255 106 61 / 0.16);
        --kit-focus: #ff8a63;
        --g-glass: rgb(14 12 24 / 0.8);
        --g-tonal: rgb(255 255 255 / 0.1);
        --g-tonal-2: rgb(255 255 255 / 0.06);
        --g-scrim: rgb(0 0 0 / 0.42);
      }
      [data-theme="light"] .shot {
        --kit-accent-fg: #c2410c;
        --kit-focus: #e8551f;
        --kit-accent-subtle: rgb(255 106 61 / 0.14);
        --g-glass: rgb(255 255 255 / 0.86);
        --g-tonal: rgb(6 9 18 / 0.07);
        --g-tonal-2: rgb(6 9 18 / 0.04);
        --g-scrim: rgb(11 10 18 / 0.2);
      }
      .deck {
        height: 800px;
      }
      /* Key art: the game's content (a synthwave dusk with a chase-cam kart), drawn here as one SVG.
         The sun sits low and central so behind any centred glass card it blurs to an even glow,
         never a clipped smudge; the kart leaves the frame whenever a modal is up. */
      .art {
        position: absolute;
        inset: 0;
        z-index: -3;
        overflow: hidden;
        --sky-0: #0b0a1d;
        --sky-1: #251240;
        --sky-2: #6b2247;
        --sun-0: #ffd166;
        --sun-1: #ff5a2c;
        --hill-far: #2b1840;
        --hill-near: #1b1229;
        --ground: #100e18;
        --road: #1a1724;
        --grid: #ff6a3d;
        --edge: #ff9a6a;
        --lane: #ffd08a;
        --kart: #ff5a2c;
        --kart-hi: #ff8a5c;
        --kart-dark: #14111c;
        --helmet: #f3efe7;
        --tyre: #2a2433;
        --tyre-hi: #4a4058;
      }
      [data-theme="light"] .art {
        --sky-0: #8fc6f5;
        --sky-1: #c9d9f2;
        --sky-2: #ffc59a;
        --sun-0: #fff1b8;
        --sun-1: #ff9a5a;
        --hill-far: #b48ea6;
        --hill-near: #8a6f8f;
        --ground: #4b4f5e;
        --road: #343745;
        --grid: #ffffff;
        --edge: #ffe1c4;
        --lane: #ffe3a8;
        --kart: #f2541f;
        --kart-hi: #ff8250;
        --kart-dark: #1d1b26;
        --helmet: #ffffff;
        --tyre: #24222c;
        --tyre-hi: #4a4756;
      }
      .art svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .shot:has(.scrim:not(.side)) .art .kart {
        display: none;
      }
      /* With the card docked left, the sun moves right so no part of it sits behind the glass. */
      .shot:has(.scrim.side) .art .sun {
        transform: translateX(250px);
      }
      /* Modals dim the game first, so highlights never bleed through the glass. */
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--g-scrim);
        z-index: -1;
      }
      .glass {
        background: var(--g-glass);
        backdrop-filter: blur(40px) saturate(1.15);
        border-radius: 28px;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.12),
          0 30px 60px -10px rgb(0 0 0 / 0.5);
        color: var(--pk-text-default);
      }
      [data-theme="light"] .glass {
        box-shadow:
          inset 0 1px 0 #fff,
          0 0 0 1px rgb(6 9 18 / 0.05),
          0 30px 60px -10px rgb(6 9 18 / 0.28);
      }
      .panel {
        position: absolute;
        padding: 44px;
        display: grid;
        gap: 28px;
      }
      .center {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      .gt {
        font: 600 36px/44px var(--pk-font-sans);
        letter-spacing: -0.01em;
        color: var(--pk-text-strong);
        margin: 0;
        text-wrap: balance;
      }
      .gs {
        color: var(--pk-text-muted);
        margin: 0;
        font-size: 19px;
        line-height: 28px;
        text-wrap: pretty;
      }
      .phead {
        display: flex;
        gap: 12px;
        align-items: center;
        font: 600 17px/24px var(--pk-font-sans);
        color: var(--pk-text-muted);
      }
      .gb {
        height: 60px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 24px;
        font: 500 19px/1 var(--pk-font-sans);
        color: var(--pk-text-strong);
        background: var(--g-tonal);
      }
      .gb.primary {
        background: var(--kit-accent);
        color: var(--kit-accent-on);
      }
      /* Console focus: a 3 px ring, 2 px offset, an accent glow; no scale on buttons in a row. */
      .focus {
        outline: 3px solid var(--kit-focus);
        outline-offset: 2px;
        box-shadow:
          0 0 0 1px color-mix(in oklab, var(--kit-focus) 40%, transparent),
          0 8px 28px color-mix(in oklab, var(--kit-focus) 35%, transparent);
      }
      .gtext {
        font: 500 17px/1 var(--pk-font-sans);
        color: var(--pk-text-muted);
        justify-self: center;
        padding: 10px 14px;
      }
      /* Input hints: monochrome filled glyphs, switching with the last input device. */
      .hints {
        position: absolute;
        right: 32px;
        bottom: 28px;
        display: flex;
        gap: 22px;
        font-size: 17px;
        color: #fff;
        padding: 8px 18px 8px 10px;
        border-radius: 999px;
        background: rgb(12 10 22 / 0.6);
        backdrop-filter: blur(16px);
      }
      [data-theme="light"] .hints {
        color: #1c1f2a;
        background: rgb(255 255 255 / 0.8);
      }
      .hints span {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pad {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font: 700 13px/1 var(--pk-font-sans);
        font-style: normal;
        background: rgb(255 255 255 / 0.16);
        color: #fff;
      }
      [data-theme="light"] .pad {
        background: rgb(6 9 18 / 0.1);
        color: #1c1f2a;
      }
      .pad.sh {
        border-radius: 8px;
        width: 34px;
      }
      .gfield {
        min-height: 64px;
        border-radius: 16px;
        background: rgb(0 0 0 / 0.3);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08);
        display: flex;
        align-items: center;
        padding: 14px 20px;
        gap: 12px;
        color: var(--pk-text-strong);
      }
      [data-theme="light"] .gfield {
        background: rgb(255 255 255 / 0.85);
        box-shadow: inset 0 0 0 1px rgb(6 9 18 / 0.08);
      }
      .grow {
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 72px;
        padding: 12px 20px;
        border-radius: 16px;
        background: var(--g-tonal-2);
        color: var(--pk-text-strong);
      }
      .grow + .grow {
        margin-top: 2px;
      }
      .grow.focus {
        background: color-mix(in oklab, var(--g-tonal-2), white 4%);
      }
      .grow .t {
        flex: 1;
        font-weight: 500;
      }
      .grow small {
        display: block;
        color: var(--pk-text-subtle);
        font-size: 16px;
        line-height: 22px;
        font-weight: 400;
      }
      .rd {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 2.5px var(--pk-text-muted);
        flex: none;
      }
      .rd.on {
        box-shadow: inset 0 0 0 2.5px var(--kit-accent-fg);
        background: radial-gradient(
          circle,
          var(--kit-accent-fg) 0 6px,
          transparent 6.5px
        );
      }
      .seats {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .seats i {
        width: 34px;
        height: 6px;
        border-radius: 3px;
        background: var(--pk-text-muted);
      }
      .seats span {
        margin-left: 10px;
        font-size: 16px;
        color: var(--pk-text-muted);
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--g-tonal);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--kit-accent);
      }
      .hud {
        position: absolute;
        top: 36px;
        left: 64px;
        font: 700 28px/1 var(--pk-font-sans);
        color: #fff;
        text-shadow: 0 2px 6px rgb(0 0 0 / 0.5);
        z-index: -1;
        display: grid;
        gap: 8px;
      }
      .hud small {
        font: 500 18px/1 var(--pk-font-sans);
        opacity: 0.85;
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 96px;
        translate: -50% 0;
        width: 520px;
        padding: 16px 20px;
        border-radius: 22px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .tabsg {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tabsg .t {
        padding: 10px 22px;
        border-radius: 999px;
        font-weight: 500;
        color: var(--pk-text-muted);
      }
      .tabsg .t.on {
        background: var(--kit-accent-subtle);
        color: var(--kit-accent-fg);
        font-weight: 600;
      }
      .ghead {
        font: 600 16px/22px var(--pk-font-sans);
        color: var(--pk-text-subtle);
        margin: 20px 4px 8px;
      }
      .srow {
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 64px;
        padding: 0 22px;
        border-radius: 14px;
        background: var(--g-tonal-2);
        color: var(--pk-text-strong);
      }
      .srow + .srow {
        margin-top: 2px;
      }
      .srow .lbl {
        flex: 1;
        font-weight: 500;
      }
      .srow .lbl small {
        display: block;
        color: var(--pk-text-subtle);
        font-size: 16px;
        line-height: 22px;
        font-weight: 400;
      }
      .srow .val {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--pk-text-muted);
      }
      .gsw {
        width: 58px;
        height: 34px;
        border-radius: 999px;
        background: var(--kit-accent);
        position: relative;
      }
      .gsw::after {
        content: "";
        position: absolute;
        right: 4px;
        top: 4px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.3);
      }
      .wordmark {
        display: block;
      }
      .k-tag {
        font-size: 14px;
        line-height: 22px;
        padding: 0 10px;
        margin-inline-start: 10px;
        vertical-align: 2px;
      }
    </style>
  </head>
  <body>
    <template id="art"
      ><div class="art">
        <svg
          viewBox="0 0 1280 720"
          preserveAspectRatio="xMidYMax slice"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" style="stop-color: var(--sky-0)" />
              <stop offset="0.6" style="stop-color: var(--sky-1)" />
              <stop offset="1" style="stop-color: var(--sky-2)" />
            </linearGradient>
            <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" style="stop-color: var(--sun-0)" />
              <stop offset="1" style="stop-color: var(--sun-1)" />
            </linearGradient>
            <radialGradient id="haze" cx="0.5" cy="1" r="0.6">
              <stop
                offset="0"
                style="stop-color: var(--sun-1); stop-opacity: 0.45"
              />
              <stop
                offset="1"
                style="stop-color: var(--sun-1); stop-opacity: 0"
              />
            </radialGradient>
            <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="1" stop-color="#fff" stop-opacity="0.9" />
            </linearGradient>
            <mask id="sunmask">
              <rect width="1280" height="720" fill="#fff" />
              <rect x="500" y="268" width="280" height="2" fill="#000" />
              <rect x="500" y="279" width="280" height="4" fill="#000" />
              <rect x="500" y="292" width="280" height="5" fill="#000" />
              <rect x="500" y="306" width="280" height="7" fill="#000" />
              <rect x="500" y="322" width="280" height="8" fill="#000" />
              <rect x="500" y="339" width="280" height="10" fill="#000" />
            </mask>
            <mask id="gridmask">
              <rect y="446" width="1280" height="274" fill="url(#fade)" />
            </mask>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" />
            </filter>
          </defs>
          <rect width="1280" height="446" fill="url(#sky)" />
          <ellipse cx="640" cy="446" rx="640" ry="220" fill="url(#haze)" />
          <g class="sun">
            <circle
              cx="640"
              cy="330"
              r="132"

            />
          </g>
          <path

          />
          <path

          />

          <path

            style="stroke: var(--grid)"
            stroke-width="1"
            opacity="0.22"
            mask="url(#gridmask)"
            fill="none"
          />
          <path d="M626 446H654L1230 720H50Z" style="fill: var(--road)" />
          <path
            d="M626 446L50 720M654 446L1230 720"
            style="stroke: var(--edge)"

          />
          <path

          <rect
            y="445"

          <g class="kart" transform="translate(960 704) scale(0.8)">
            <ellipse cx="0" cy="2" rx="118" ry="12" fill="#000" opacity="0.4" />

              x="-112"

        </svg></div
    ></template>
    <template id="wm">
      <!-- product.wordmark: the game's own wordmark texture, drawn here as an image asset -->
      <svg
        class="wordmark"
        width="300"
        height="72"
        viewBox="0 0 300 72"
        aria-label="Drift Kart"
      >
        <g transform="skewX(-12)">
          <text
            x="18"
            y="56"
            font-family="Impact, 'Arial Black', sans-serif"
            font-size="60"
            letter-spacing="1"
            fill="#ff6a3d"
            stroke="#1a0b06"
            stroke-width="2"
            paint-order="stroke"
          >
            DRIFT
          </text>
          <text
            x="176"
            y="56"
            font-family="Impact, 'Arial Black', sans-serif"
            font-size="60"
            letter-spacing="1"
            fill="#fff3e8"
            stroke="#1a0b06"
            stroke-width="2"
            paint-order="stroke"
          >
            KART
          </text>
        </g>
        <path
          d="M8 66h120"
          stroke="#ffb347"
          stroke-width="4"
          stroke-linecap="round"
        />
      </svg>
    </template>
    <main class="board">
      <!-- 1. Gate -->
      <figure>
        <figcaption>
          godot · gate (title screen; B does nothing on the root, Quit only on
          desktop builds)
        </figcaption>
        <div class="shot" data-shot="gate">
          <div
            class="scrim side"
            style="
              background: linear-gradient(
                90deg,
                rgb(0 0 0 / 0.45),
                transparent 60%
              );
            "
          ></div>
          <div
            class="glass panel"
            style="
              left: 72px;
              top: 50%;
              transform: translateY(-50%);
              width: 520px;
            "
          >
            <div style="display: flex; gap: 20px; align-items: center">
              <span
                class="k-appicon"
                data-art="driftkart"
                data-size="72"
                style="border-radius: 18px"
              ></span>
              <span class="wm-slot"></span>
            </div>
            <p class="gs">Sign in or add your license to play.</p>
            <div style="display: grid; gap: 16px">
              <div class="gb primary focus">Sign in</div>
              <div class="gb">Use a license key</div>
            </div>
            <span class="gtext">Activate offline</span>
          </div>
          <div class="hints">
            <span><i class="pad">A</i>Select</span>
          </div>
        </div>
      </figure>

      <!-- 2. Activate -->
      <figure>
        <figcaption>
          godot · activate (focus on Activate; the field is quiet until edited)
        </figcaption>
        <div class="shot" data-shot="activate">
          <div class="scrim"></div>
          <div class="glass panel center" style="width: 680px">
            <div class="phead">
              <span
                class="k-appicon"
                data-art="driftkart"
                data-size="40"
                style="border-radius: 10px"
              ></span
              >Drift Kart
            </div>
            <h1 class="gt">Add your license</h1>
            <div>
              <div
                style="
                  font: 500 16px/22px var(--pk-font-sans);
                  color: var(--pk-text-muted);
                  margin-bottom: 8px;
                "
              >
                License key
              </div>
              <div class="gfield">
                <span class="mono" style="font-size: 17px; line-height: 24px"
                  ><span class="k-key"
