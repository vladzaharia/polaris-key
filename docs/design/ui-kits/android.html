<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI kits · Android (Compose, Material 3 Expressive)</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* 412 × 915 dp. Material 3 Expressive structure, Polaris Key colour, type and accent. */
      .shot {
        width: 436px;
        height: 939px;
        padding: 12px;
        border-radius: 52px;
        background: #202124;
        box-shadow:
          0 0 0 1px #3c3d41 inset,
          0 30px 60px -20px rgb(0 0 0 / 0.5);
      }
      [data-theme="light"] .shot {
        background: #d5d8df;
        box-shadow:
          0 0 0 1px #c0c4cc inset,
          0 30px 60px -20px rgb(6 9 18 / 0.25);
      }
      .screen {
        position: relative;
        width: 412px;
        height: 915px;
        border-radius: 40px;
        overflow: hidden;
        background: var(--pk-surface-page);
        isolation: isolate;
        font-size: 16px;
        /* M3 surface-container roles mapped onto Polaris surfaces */
        --c-low: var(--pk-surface-raised);
        --c: color-mix(
          in oklab,
          var(--pk-surface-raised) 80%,
          var(--pk-text-strong) 4%
        );
        --c-high: color-mix(
          in oklab,
          var(--pk-surface-overlay) 88%,
          var(--pk-text-strong) 7%
        );
      }
      [data-theme="light"] .screen {
        --c-low: #ffffff;
        --c: #eef0f8;
        --c-high: #e6e9f3;
      }
      .status {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 28px 0;
        font:
          500 15px/1 system-ui,
          sans-serif;
        color: var(--pk-text-strong);
        z-index: 20;
      }
      .cam {
        position: absolute;
        top: 14px;
        left: 50%;
        width: 22px;
        height: 22px;
        margin-left: -11px;
        border-radius: 50%;
        background: #000;
        z-index: 21;
      }
      .navh {
        position: absolute;
        bottom: 10px;
        left: 50%;
        width: 108px;
        height: 4px;
        margin-left: -54px;
        border-radius: 2px;
        background: var(--pk-text-strong);
        opacity: 0.8;
        z-index: 30;
      }
      .ambient {
        position: absolute;
        top: -160px;
        left: -160px;
        width: 720px;
        height: 620px;
        filter: blur(80px) saturate(1.4);
        opacity: 0.4;
        z-index: -1;
      }
      [data-theme="light"] .ambient {
        opacity: 0.25;
      }
      .ambient svg {
        width: 100%;
        height: 100%;
      }
      .display {
        font: 700 40px/1.08 var(--pk-font-sans);
        letter-spacing: -0.02em;
        color: var(--pk-text-strong);
        margin: 0;
      }
      .headline {
        font: 700 30px/1.15 var(--pk-font-sans);
        letter-spacing: -0.01em;
        color: var(--pk-text-strong);
        margin: 0;
      }
      .body {
        color: var(--pk-text-muted);
        margin: 0;
        font-size: 16px;
        line-height: 1.5;
      }
      .btn {
        height: 56px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font: 700 16px/1 var(--pk-font-sans);
        padding: 0 24px;
      }
      .btn.filled {
        background: var(--kit-accent);
        color: var(--kit-accent-on);
      }
      .btn.tonal {
        background: var(--kit-accent-subtle);
        color: var(--pk-text-strong);
      }
      .btn.text {
        color: var(--kit-accent-fg);
        height: 44px;
        padding: 0 12px;
      }
      .btn.sq {
        border-radius: 18px;
      } /* pressed / selected shape morph */
      .appbar {
        position: absolute;
        top: 44px;
        left: 0;
        right: 0;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 6px;
        color: var(--pk-text-strong);
        z-index: 4;
      }
      .ib {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 50%;
      }
      .ib.tonal {
        background: var(--c-high);
      }
      .tf {
        position: relative;
        height: 60px;
        border: 2px solid var(--kit-accent);
        border-radius: 12px;
        display: flex;
        align-items: center;
        padding: 0 14px 0 16px;
        gap: 10px;
        color: var(--pk-text-strong);
      }
      .tf label {
        position: absolute;
        top: -10px;
        left: 12px;
        padding: 0 4px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--kit-accent-fg);
        background: var(--pk-surface-page);
      }
      .supp {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 16px 0;
        font-size: 14px;
        color: var(--pk-success);
      }
      .seg {
        display: grid;
        gap: 3px;
      }
      .seg > .it {
        background: var(--c);
        border-radius: 6px;
        min-height: 72px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 18px;
        color: var(--pk-text-strong);
      }
      .seg > .it:first-child {
        border-radius: 26px 26px 6px 6px;
      }
      .seg > .it:last-child {
        border-radius: 6px 6px 26px 26px;
      }
      .seg > .it:only-child {
        border-radius: 26px;
      }
      .seg > .it.sel {
        background: var(--kit-accent-subtle);
        border-radius: 26px;
      }
      .it .t {
        flex: 1;
        min-width: 0;
      }
      .it .t small {
        display: block;
        color: var(--pk-text-muted);
        font-size: 14px;
      }
      .it .lead {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--c-high);
        color: var(--pk-text-default);
        flex: none;
      }
      .it.sel .lead {
        background: var(--kit-accent);
        color: var(--kit-accent-on);
        border-radius: 14px;
      }
      .rad {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--pk-text-muted);
        flex: none;
      }
      .it.sel .rad {
        border: 2px solid var(--kit-accent);
        box-shadow: inset 0 0 0 4px var(--kit-accent-subtle);
        background: var(--kit-accent);
      }
      .sw {
        width: 52px;
        height: 32px;
        border-radius: 999px;
        background: var(--kit-accent);
        position: relative;
        flex: none;
      }
      .sw::after {
        content: "";
        position: absolute;
        right: 4px;
        top: 4px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--kit-accent-on);
      }
      .sw .ic {
        position: absolute;
        right: 8px;
        top: 8px;
        z-index: 1;
        color: var(--kit-accent);
      }
      .sw.locked {
        opacity: 0.45;
      }
      .seatm {
        display: flex;
        gap: 4px;
      }
      .seatm i {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: var(--pk-danger);
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        border-radius: 32px 32px 0 0;
        background: var(--c-low);
        padding: 12px 24px 40px;

      [data-theme="light"] .sheet {

      }
      .handle {

        height: 4px;
        border-radius: 2px;
        background: var(--pk-text-subtle);
        margin: 4px auto 22px;
      }
      .scrimA {

        background: rgb(0 0 0 / 0.4);

      }
      .group-h {

      .code {

    <script>
      // M3 Expressive "Cookie 9" shape clipping the product icon.
      function cookiePath(s, n = 9, amp = 0.055) {
        const r = s / 2;
        let d = "";
        for (let i = 0; i <= 360; i += 2) {
          const t = (i * Math.PI) / 180;
          const rr = r * (1 - amp + amp * Math.cos(n * t));
          d +=
            (i ? "L" : "M") +
            (r + rr * Math.cos(t)).toFixed(2) +
            " " +
            (r + rr * Math.sin(t)).toFixed(2);
        }
        return d + "Z";
      }
      let cid = 0;
      document.querySelectorAll("[data-cookie]").forEach((el) => {
        const s = +el.dataset.size;
        const id = "ck" + cid++;
        el.style.display = "inline-block";
        el.style.flex = "none";
        el.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><clipPath id="${id}"><path d="${cookiePath(s)}"/></clipPath><g clip-path="url(#${id})"><foreignObject width="${s}" height="${s}">${art(el.dataset.cookie, s)}</foreignObject></g></svg>`;
      });
      // M3 Expressive contained LoadingIndicator (one frame of the morph).
      document.querySelectorAll(".loader").forEach((el) => {
        const s = 64;
        let d = "";
        for (let i = 0; i <= 360; i += 3) {
          const t = (i * Math.PI) / 180;
          const rr = 16 * (0.86 + 0.14 * Math.cos(7 * t));
          d +=
            (i ? "L" : "M") +
            (32 + rr * Math.cos(t)).toFixed(2) +
            " " +
            (32 + rr * Math.sin(t)).toFixed(2);
        }
        el.innerHTML = `<svg width="${s}" height="${s}"><circle cx="32" cy="32" r="32" fill="var(--kit-accent-subtle)"/><path d="${d}Z" fill="var(--kit-accent)"/></svg>`;
      });
      // M3 Expressive wavy linear progress.
      document.querySelectorAll(".wavy").forEach((el) => {
        const w = 364,
          p = +el.dataset.p,
          end = w * p;
        let d = "M2 8";
        for (let x = 2; x <= end; x += 2)
          d += ` L${x} ${(8 + 3 * Math.sin(x / 6)).toFixed(2)}`;
        el.innerHTML = `<svg width="${w}" height="16"><path d="${d}" fill="none" stroke="var(--kit-accent)" stroke-width="4" stroke-linecap="round"/><line x1="${end + 8}" y1="8" x2="${w - 2}" y2="8" stroke="var(--kit-accent-subtle)" stroke-width="4" stroke-linecap="round"/><circle cx="${w - 2}" cy="8" r="2" fill="var(--kit-accent)"/></svg>`;
      });
      const hl = document.getElementById("hostlist");
      [
        "Harbor demo",
        "Night swim",
        "Field notes",
        "Lighthouse",
        "Low tide",
      ].forEach((t) =>
        hl.insertAdjacentHTML(
          "beforeend",
          `<div class="hostcard"><i></i><div><b>${t}</b><small>Edited today</small></div></div>`,
        ),
      );
      const chrome = document.getElementById("chrome");
      document
        .querySelectorAll(".screen")
        .forEach((s) => s.appendChild(chrome.content.cloneNode(true)));
    </script>
  </body>
</html>
