<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI kits · Web (React and elements)</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* Real window sizes: 1440 × 900 and 390 × 844. Every shot is a container (.kit), so the
         kit responds to its own inline size, never the viewport (UI-KITS §1.4 web row). */
      .shot {
        position: relative;
        overflow: hidden;
        background: var(--pk-surface-page);
        isolation: isolate;
        border-radius: 12px;
        box-shadow: 0 0 0 1px var(--pk-border-subtle);
      }
      .w1440 {
        width: 1440px;
        height: 900px;
      }
      .w390 {
        width: 390px;
        height: 844px;
        border-radius: 28px;
      }

      /* Product ambient (§1.2): the product's own art behind the hero. Dark: the blurred icon.
         Light: the resolved accent's subtle and the icon's sand, never a grey smudge. */
      .ambient {
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
      }
      .ambient > div {
        position: absolute;
        left: 50%;
        top: 42%;
        translate: -50% -50%;
        filter: blur(110px) saturate(1.4);
        opacity: 0.42;
      }
      .ambient svg {
        width: 900px;
        height: 620px;
        display: block;
      }
      @container page (max-width: 560px) {
        .ambient > div {
          top: 18%;
          filter: blur(70px) saturate(1.4);
        }
        .ambient svg {
          width: 520px;
          height: 420px;
        }
      }
      [data-theme="light"] .ambient > div {
        display: none;
      }
      [data-theme="light"] .ambient {
        background:
          radial-gradient(
            circle 560px at 50% 40%,
            color-mix(in oklab, var(--kit-accent-subtle), #9fe3d6 30%),
            transparent 72%
          ),
          radial-gradient(
            circle 300px at 62% 28%,
            rgb(245 211 138 / 0.4),
            transparent 70%
          );
      }
      @container page (max-width: 560px) {
        [data-theme="light"] .ambient {
          background:
            radial-gradient(
              circle 280px at 50% 22%,
              color-mix(in oklab, var(--kit-accent-subtle), #9fe3d6 30%),
              transparent 72%
            ),
            radial-gradient(
              circle 160px at 64% 16%,
              rgb(245 211 138 / 0.4),
              transparent 70%
            );
        }
      }

      .center {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      /* The flow card: every gate step sits in the same card, so step changes morph one surface. */
      .flow {
        container-type: inline-size;
        inline-size: min(440px, 100%);
        padding: 32px;
        display: grid;
        gap: 24px;
      }
      .flow.wide {
        inline-size: min(600px, 100%);
      }
      .flow .spacer {
        display: none;
      }
      .actions {
        display: grid;
        gap: 10px;
      }
      .actions.row {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .actions.row .k-btn {
        min-width: 112px;
      }
      @container page (max-width: 560px) {
        .center {
          padding: 0;
          place-items: stretch;
        }
        .flow,
        .flow.wide {
          inline-size: 100%;
          border-radius: 0;
          box-shadow: none !important;
          background: transparent;
          padding: 64px 20px max(20px, env(safe-area-inset-bottom));
          grid-template-rows: auto 1fr auto;
          align-content: stretch;
        }
        .flow .spacer {
          display: block;
        }
        .flow .k-list {
          background: var(--pk-surface-raised);
        }
        .actions.row {
          display: grid;
          justify-content: stretch;
        }
        .actions.row .k-btn {
          width: 100%;
        }
        .actions.row .k-btn.primary {
          order: -1;
        }
      }

      .hero {
        display: grid;
        justify-items: center;
        text-align: center;
        gap: 6px;
        padding-top: 8px;
      }
      .hero .k-appicon {
        margin-bottom: 18px;
      }
      .hero .display {
        font: 600 clamp(1.75rem, 1.1rem + 2.6cqi, 2.25rem) / 1.12
          var(--pk-font-sans);
        letter-spacing: -0.02em;
        color: var(--pk-text-strong);
        margin: 0;
        text-wrap: balance;
      }
      .hero .by {
        font-size: 13px;
        line-height: 18px;
        color: var(--pk-text-subtle);
      }
      .hero .k-lede {
        margin-top: 8px;
        max-width: 30ch;
      }
      .pagefoot {
        position: absolute;
        bottom: 24px;
        inset-inline: 0;
        display: flex;
        justify-content: center;
        gap: 20px;
        font-size: 13px;
        color: var(--pk-text-subtle);
      }
      @container page (max-width: 560px) {
        .pagefoot {
          display: none;
        }
      }

      /* Hand-off: the code reads as output, not as an input. */
      .code {
        position: relative;
        display: grid;
        place-items: center;
        padding: 22px 48px;
        border-radius: 16px;
        background: var(--kit-fill);
      }
      .code .mono {
        font-size: 40px;
        line-height: 1;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: var(--pk-text-strong);
        margin-right: -0.12em;
      }
      .code .k-iconbtn {
        position: absolute;
        inset-inline-end: 10px;
        top: 50%;
        translate: 0 -50%;
      }
      .goto {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: var(--pk-text-muted);
      }
      .goto b {
        font-weight: 500;
        color: var(--pk-text-strong);
      }
      .waiting {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: var(--pk-text-muted);
      }
      .handoff {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 24px;
        align-items: center;
      }
      .qrtile {
        display: grid;
        gap: 8px;
        justify-items: center;
        font-size: 12px;
        color: var(--pk-text-subtle);
      }
      .qrtile .q {
        padding: 8px;
        background: #fff;
        border-radius: 14px;
        line-height: 0;
      }
      .qrlink {
        display: none;
      }
      @container page (max-width: 560px) {
        .handoff {
          grid-template-columns: 1fr;
        }
        .qrtile {
          display: none;
        }
        .qrlink {
          display: inline-flex;
        }
      }

      /* A faux host app with ITS OWN look (system font, flat neutrals): the kit drops into
         someone else's product. */
      .host {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-rows: 52px 1fr;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #111214;
        color: #d4d4d8;
        --h-line: #222327;
        --h-mute: #8b8b93;
        --h-on: #1c1d21;
      }
      [data-theme="light"] .host {
        background: #fafafa;
        color: #27272a;
        --h-line: #e7e7ea;
        --h-mute: #71717a;
        --h-on: #efeff1;
      }
      .host .bar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border-bottom: 1px solid var(--h-line);
        font-weight: 600;
        font-size: 14px;
      }
      .host .side {
        border-right: 1px solid var(--h-line);
        padding: 12px 10px;
        display: grid;
        align-content: start;
        gap: 2px;
        font-size: 14px;
      }
      .host .side span {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 7px 10px;
        border-radius: 6px;
        color: var(--h-mute);
      }
      .host .side span.on {
        background: var(--h-on);
        color: inherit;
      }
      .host .side h6 {
        margin: 16px 10px 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--h-mute);
      }
      .tracks {
        padding: 20px;
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .track {
        height: 64px;
        border-radius: 6px;
        background: var(--h-on);
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 14px;
        overflow: hidden;
      }
      .track i {
        width: 3px;
        border-radius: 2px;
        background: #33c3b0;
        opacity: 0.8;
        flex: none;
      }
      .track.b i {
        background: #e7b65c;
      }
      .track.c i {
        background: #8fa6ff;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--kit-scrim);
        backdrop-filter: blur(var(--kit-scrim-blur)) saturate(1.2);
      }
      .dialog {
        container-type: inline-size;
        width: 520px;
        padding: 28px;
        display: grid;
        gap: 20px;
        font-family: var(--pk-font-sans);
        color: var(--pk-text-default);
      }
      .whatsnew {
        display: grid;
        gap: 8px;
      }
      .pmeta {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--pk-text-muted);
        margin-top: 8px;
      }

      /* Embedded settings: the pane inherits the host's font (typography.family "inherit"),
         keeps the kit's structure, rows and accent. */
      .settings-main {
        padding: 32px 40px;
        overflow: hidden;
      }
      .pane {
        max-width: 640px;
        display: grid;
        gap: 32px;
        --pk-font-sans: inherit;
        font-family: inherit;
        color: var(--pk-text-default);
      }
      .pane h2 {
        font:
          600 24px/1.2 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        letter-spacing: -0.01em;
        color: var(--pk-text-strong);
        margin: 0;
      }
      .pane .k-group-h,
      .pane .k-btn,
      .pane .k-seg,
      .pane .k-pill {
        font-family: inherit;
      }
      .ver {
        font-family: var(--kit-mono);
        font-size: 13px;
      }
      .navnarrow {
        display: none;
      }
      @container page (max-width: 720px) {
        .host {
          grid-template-columns: 1fr;
        }
        .host .side {
          display: none;
        }
        .settings-main {
          padding: 56px 16px 24px;
        }
        .navnarrow {
          display: flex;
          align-items: center;
          gap: 2px;
          font-size: 16px;
          color: var(--kit-accent-fg);
          margin: 0 0 -12px -6px;
        }
        .pane {
          gap: 24px;
        }
        .pane h2 {
          font-size: 30px;
        }
        .k-row .v .wide {
          display: none;
        }
      }

      /* Theming board */
      .themes {
        display: grid;
        grid-template-columns: repeat(4, 300px);
        gap: 24px;
        padding: 32px;
        align-items: start;
      }
      .themes > div {
        display: grid;
        gap: 12px;
        align-content: start;
      }
      .themes .cap {
        font-size: 13px;
        color: var(--pk-text-muted);
        line-height: 1.45;
        min-height: 58px;
      }
      .themes .cap b {
        color: var(--pk-text-strong);
        font-weight: 500;
      }
      .themes code {
        font-family: var(--kit-mono);
        font-size: 12px;
        color: var(--pk-text-default);
      }
      .mini {
        container-type: inline-size;
        padding: 24px;
        display: grid;
        gap: 18px;
      }
      .mini .k-h1 {
        font-size: 22px;
      }
      .mini .k-field .mono {
        font-size: 13px;
      }
      /* accent: "core", resolved (§3.3): #9a5cff in dark, #7a2fff in light. */
      .p-core {
        --kit-accent: #9051f3;
        --kit-accent-fg: #c0a6ff;
        --kit-accent-subtle: #17122d;
        --kit-focus: #c0a6ff;
      }
      [data-theme="light"] .p-core {
        --kit-accent: #7a2fff;
        --kit-accent-fg: #7321f6;
        --kit-accent-subtle: #eae4ff;
        --kit-focus: #7a2fff;
      }
      .p-compact {
        --kit-control-h: 36px;
        --kit-radius-card: 10px;
        --kit-radius-control: 6px;
      }
      .p-compact .mini {
        gap: 12px;
        padding: 18px;
      }
      .p-compact .k-btn {
        font-size: 14px;
        border-radius: 6px;
      }
      /* Native preset: the HOST's font (font: inherit), Canvas neutrals, the host's
         accent-color, radius from the host, no ambient, no Rubik. Host here: system-ui, orange. */
      .p-native {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        accent-color: #ea580c;
        --pk-font-sans: inherit;
        /* The host's accent-color, resolved for contrast (§3.3). */
        --kit-accent: #cf4b00;
        --kit-accent-fg: #ff9972;
        --kit-focus: #ff9972;
        --kit-accent-subtle: #1e1110;
        --kit-radius-card: 8px;
        --kit-radius-control: 6px;
        --kit-fill: Canvas;
        --pk-surface-raised: color-mix(in srgb, Canvas 94%, CanvasText);
        --pk-text-strong: CanvasText;
        --pk-text-muted: color-mix(in srgb, CanvasText 65%, Canvas);
        --kit-hairline: color-mix(in srgb, CanvasText 18%, Canvas);
      }
      [data-theme="light"] .p-native {
        --kit-accent-fg: #b03e00;
        --kit-focus: #cf4b00;
        --kit-accent-subtle: #f2e7e6;
        --pk-surface-raised: Canvas;
        --kit-fill: color-mix(in srgb, Canvas 96%, CanvasText);
      }
      .p-native .k-card {
        box-shadow: 0 0 0 1px var(--kit-hairline) !important;
      }
      .p-native .k-h1,
      .p-native .k-label,
      .p-native .k-btn,
      .p-native .k-product,
      .p-native .k-verdict {
        font-family: inherit;
      }

      /* State sheet */
      .sheetgrid {
        padding: 40px;
        display: grid;
        gap: 36px;
      }
      .sheetgrid h3 {
        margin: 0 0 14px;
        font: 500 13px/18px var(--pk-font-sans);
        color: var(--pk-text-muted);
      }
      .states {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 20px;
        align-items: end;
      }
      .states > div {
        display: grid;
        gap: 10px;
      }
      .states small {
        font-size: 12px;
        color: var(--pk-text-subtle);
      }
      .spin16 {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0 25%,
          currentColor 100%
        );
        mask: radial-gradient(circle, transparent 5.5px, #000 6px);
        opacity: 0.9;
      }

      /* Components sheet */
      .comps {
        padding: 40px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
        align-items: start;
      }
      .comps > section {
        display: grid;
        gap: 12px;
      }
      .comps h3 {
        margin: 0;
        font: 500 13px/18px var(--pk-font-sans);
        color: var(--pk-text-muted);
      }
      .banner {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 10px 10px 16px;
        border-radius: 14px;
        background: var(--pk-warning-subtle);
        color: var(--pk-text-default);
        font-size: 14px;
      }
      .banner > .ic {
        color: var(--pk-warning);
      }
      .toast {
        position: relative;
        display: grid;
        gap: 10px;
        padding: 14px 14px 14px 16px;
        border-radius: 16px;
        background: var(--pk-surface-overlay);
        box-shadow:
          inset 0 0 0 1px var(--kit-hairline),
          var(--pk-elevation-3);
        overflow: hidden;
      }
      [data-theme="light"] .toast {
        box-shadow:
          0 0 0 1px rgb(6 9 18 / 0.06),
          0 16px 32px -12px rgb(6 9 18 / 0.18);
      }
      .toast .timer {
        position: absolute;
        inset: auto 0 0 0;
        height: 2px;
        background: color-mix(in oklab, var(--pk-text-strong) 8%, transparent);
      }
      .toast .timer i {
        display: block;
        height: 100%;
        width: 64%;
        background: var(--pk-text-subtle);
      }
      .sync {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--pk-text-muted);
      }

      /* Layers board */
      .layers {
        padding: 40px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
      }
      .layers h3 {
        margin: 0 0 6px;
        font: 600 17px/1.3 var(--pk-font-sans);
        color: var(--pk-text-strong);
      }
      .layers p {
        margin: 0 0 16px;
        color: var(--pk-text-muted);
        font-size: 14px;
      }
      .layers p code {
        font: 13px var(--kit-mono);
        color: var(--pk-text-default);
      }
      pre.src {
        margin: 0;
        padding: 18px 20px;
        border-radius: 14px;
        background: var(--pk-surface-raised);
        box-shadow: inset 0 0 0 1px var(--kit-hairline);
        font: 400 12.5px/1.65 var(--kit-mono);
        color: var(--pk-text-default);
        white-space: pre;
        overflow: hidden;
      }
      pre.src .c {
        color: var(--pk-text-subtle);
      }
      pre.src .k {
        color: var(--kit-accent-fg);
      }
      .hostcard {
        margin-top: 16px;
        border-radius: 12px;
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f4f4f5;
        color: #18181b;
        display: grid;
        gap: 12px;
        max-width: 420px;
      }
      [data-theme="dark"] .hostcard {
        background: #18181b;
        color: #f4f4f5;
      }
      .hostcard .hb {
        height: 36px;
        border-radius: 999px;
        background: #18181b;
        color: #fff;
        font: 500 14px/36px system-ui;
        text-align: center;
      }
      [data-theme="dark"] .hostcard .hb {
        background: #f4f4f5;
        color: #18181b;
      }
      .hostcard .hi {
        height: 36px;
        border-radius: 8px;
        padding: 0 12px;
        box-shadow: inset 0 0 0 1px #d4d4d8;
        font: 12.5px/36px var(--kit-mono);
        white-space: nowrap;
        overflow: hidden;
      }
      [data-theme="dark"] .hostcard .hi {
        box-shadow: inset 0 0 0 1px #3f3f46;
      }

      /* Motion board */
      .motion {
        padding: 40px;
        display: grid;
        gap: 28px;
      }
      .mrow {
        display: grid;
        grid-template-columns: 220px repeat(4, 1fr);
        gap: 16px;
        align-items: center;
      }
      .mrow > b {
        font-weight: 500;
        color: var(--pk-text-strong);
        font-size: 14px;
      }
      .mrow > b small {
        display: block;
        font-weight: 400;
        color: var(--pk-text-muted);
        font-size: 12px;
        margin-top: 4px;
        font-family: var(--kit-mono);
      }
      .frame {
        height: 128px;
        border-radius: 14px;
        background: var(--kit-fill);
        position: relative;
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      .frame.dim1 {
        background: color-mix(in oklab, var(--kit-fill) 85%, black);
      }
      .frame.dim2 {
        background: color-mix(in oklab, var(--kit-fill) 75%, black);
      }
      [data-theme="light"] .frame.dim1 {
        background: color-mix(in oklab, var(--kit-fill) 94%, #060912);
      }
      [data-theme="light"] .frame.dim2 {
        background: color-mix(in oklab, var(--kit-fill) 88%, #060912);
      }
      .frame .t {
        position: absolute;
        left: 10px;
        bottom: 8px;
        font: 400 11px var(--kit-mono);
        color: var(--pk-text-subtle);
      }
      .fcard {
        width: 120px;
        height: 70px;
        border-radius: 12px;
        background: var(--pk-surface-raised);
        box-shadow:
          inset 0 0 0 1px var(--kit-hairline),
          var(--pk-elevation-2);
        display: grid;
        gap: 6px;
        padding: 12px;
        align-content: start;
      }
      .fcard i {
        height: 6px;
        border-radius: 3px;
        background: var(--kit-tonal-hover);
      }
    </style>
  </head>
  <body>
    <main class="board">
      <!-- 1. Gate, 1440 -->
      <figure>
        <figcaption>web · gate · 1440 × 900</figcaption>
        <div class="shot kit w1440" data-shot="gate">
          <div class="ambient">
            <div data-art="tidewater" data-size="64"></div>
          </div>
          <div class="center">
            <div class="k-card flow">
              <div class="hero">
                <div
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="96"
                ></div>
                <h1 class="display">Welcome to Tidewater Studio</h1>
                <span class="by">by Harbor Audio</span>
                <p class="k-lede">Sign in or add your license to start.</p>
              </div>
              <span class="spacer"></span>
              <div style="display: grid; gap: 20px">
                <div class="actions">
                  <button class="k-btn primary block">Sign in</button>
                  <button class="k-btn secondary block">
                    Use a license key
                  </button>
                </div>
                <div class="k-links">
                  <a>Start a 14-day trial</a><a>Activate offline</a>
                </div>
              </div>
            </div>
          </div>
          <div class="pagefoot">
            <span>Help</span><span>Privacy</span
            ><span>Tidewater Studio <span class="tnum">2.4.1</span></span>
          </div>

      const fill = (id, tpl) =>
        document
          .getElementById(id)
          .appendChild(document.getElementById(tpl).content.cloneNode(true));
      fill("dl1", "dl");
      fill("dl2", "dl");
      fill("set1", "set");
      fill("set2", "set");
      ["t1", "t2", "t3", "t4"].forEach((id) => fill(id, "mini"));
      const tracks = document.getElementById("tracks");
      ["", "b", "c", "", "b", "c"].forEach((cls, t) => {
        let bars = "";
        for (let i = 0; i < 260; i++) {
          const h =
            6 +
            Math.abs(Math.sin(i * 0.37 + t) * Math.cos(i * 0.11 + t * 2)) * 44;
          bars += `<i style="height:${h.toFixed(0)}px"></i>`;
        }
        tracks.insertAdjacentHTML(
          "beforeend",
          `<div class="track ${cls}">${bars}</div>`,
        );
      });
      [0, 0.4, 0.75, 1].forEach((p, i) => {
        const len = 24;
        document
          .getElementById("ck" + i)
          .insertAdjacentHTML(
            "afterbegin",
            `<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke="var(--pk-success)" opacity="${(0.2 + p * 0.8).toFixed(2)}"/><path d="m7.5 12.5 3 3 6-6.5" stroke="var(--pk-success)" stroke-dasharray="${len}" stroke-dashoffset="${(len * (1 - p)).toFixed(1)}"/></svg>`,
          );
      });
