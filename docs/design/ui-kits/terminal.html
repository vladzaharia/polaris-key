<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI kits · Terminal (Node and Python CLI prompts)</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* Truecolor output from the brand tokens; NO_COLOR and ANSI-16 fallbacks per UI-KITS §4.6. */
      .shot {
        width: 820px;
        border-radius: 16px;
        overflow: hidden;
        background: #0b0e17;
        box-shadow:
          0 0 0 1px #262b38,
          0 24px 50px -16px rgb(0 0 0 / 0.5);
        font: 14.5px/1.6 var(--pk-font-mono);
        color: #dbe4ff;
        --a: #9a5cff;
        --ok: #56d57b;
        --warn: #c38d18;
        --err: #f2513f;
        --mute: #969eb2;
        --strong: #ffffff;
        --lic: #c6e940;
        --upd: #fe8001;
        --idn: #d77df2;
      }
      [data-theme="light"] .shot {
        background: #fbfcff;
        color: #262d40;
        box-shadow:
          0 0 0 1px #dadee9,
          0 24px 50px -16px rgb(6 9 18 / 0.2);
        --a: #7a2fff;
        --ok: #167337;
        --warn: #814d00;
        --err: #be2323;
        --mute: #5d667b;
        --strong: #060912;
        --lic: #556e00;
        --upd: #aa5000;
        --idn: #9e34ae;
      }
      .tbar {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        border-bottom: 1px solid rgb(127 127 127 / 0.18);
        font: 600 12.5px/1 var(--pk-font-sans);
        color: var(--mute);
      }
      .tbar i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .tbar i:nth-child(2) {
        background: #febc2e;
      }
      .tbar i:nth-child(3) {
        background: #28c840;
        margin-right: 10px;
      }
      pre {
        margin: 0;
        padding: 18px 22px 22px;
        font: inherit;
        white-space: pre;
      }
      .a {
        color: var(--a);
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .err {
        color: var(--err);
      }
      .m {
        color: var(--mute);
      }
      .s {
        color: var(--strong);
        font-weight: 700;
      }
      .lic {
        color: var(--lic);
      }
      .upd {
        color: var(--upd);
      }
      .idn {
        color: var(--idn);
      }
      .bar {
        color: var(--a);
      }
      .qrwrap {
        display: inline-block;
        line-height: 0;
        vertical-align: top;
        padding: 6px;
        background: #fff;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main class="board">
      <figure>
        <figcaption>terminal · sign-in (device code)</figcaption>
        <div class="shot" data-shot="sign-in">
          <div class="tbar"><i></i><i></i><i></i>tidewater — zsh</div>
          <pre><span class="m">$</span> tidewater login
<span class="m">┌</span>  <span class="s">Tidewater Studio</span> <span class="m">· sign in</span>
<span class="m">│</span>
<span class="idn">◆</span>  Open <span class="s">key.plrs.im/tv</span> on any device and enter
<span class="m">│</span>
<span class="m">│</span>     <span class="s" style="font-size: 26px; letter-spacing: 0.14em">WDJB-MJHT</span>       <span class="qrwrap" data-qr="9" data-size="92"></span>
<span class="m">│</span>
<span class="m">│</span>  <span class="a">◒</span> Waiting for you to sign in <span class="m">· 4:52 · press</span> o <span class="m">to open the browser</span>
<span class="m">└</span></pre>
        </div>
      </figure>

      <figure>
        <figcaption>terminal · device limit picker</figcaption>
        <div class="shot" data-shot="device-limit">
          <div class="tbar"><i></i><i></i><i></i>tidewater — zsh</div>
          <pre><span class="m">$</span> tidewater activate
<span class="m">┌</span>  <span class="s">Tidewater Studio</span> <span class="m">· activate</span>
<span class="m">│</span>
<span class="lic">◇</span>  License key <span class="m">· pkey_tidewater_7Q2M···WPLDA</span>  <span class="ok">✓ Tidewater Studio Pro · Lifetime</span>
<span class="m">│</span>
<span class="warn">▲</span>  <span class="s">Your license is on 3 of 3 devices</span>  <span class="err">■■■</span>
<span class="m">│</span>  Remove one to use it on <span class="s">build-server-02</span>. You can add it back later.
<span class="m">│</span>
<span class="a">◆</span>  Which device?
<span class="m">│</span>  <span class="a">●</span> <span class="s">Work laptop</span>    <span class="m">Windows 11 · last used 41 days ago</span>
<span class="m">│</span>  <span class="m">○</span> Mara’s iPad    <span class="m">iPadOS 26 · used yesterday</span>
<span class="m">│</span>  <span class="m">○</span> MacBook Pro    <span class="m">macOS 26 · used today</span>
<span class="m">└</span>  <span class="m">↑/↓ choose · enter remove and continue · esc cancel</span></pre>
        </div>
      </figure>

      <figure>
        <figcaption>terminal · status and update progress</figcaption>
        <div class="shot" data-shot="update">
          <div class="tbar"><i></i><i></i><i></i>tidewater — zsh</div>
          <pre><span class="m">$</span> tidewater status
  <span class="s">Tidewater Studio Pro</span>      <span class="m">Lifetime · mara@fennick.studio</span>
  Devices                   2 of 3
  Version                   2.4.1 <span class="m">· checked 2 min ago</span>
  Offline grace             <span class="warn">▲ 3 days left</span> <span class="m">· connect to renew</span>

<span class="m">$</span> tidewater update
<span class="upd">◆</span>  <span class="s">Tidewater Studio 2.5</span> <span class="m">· 61 MB</span>
<span class="m">│</span>  • Stem export in one click, with loudness matching
<span class="m">│</span>  • Track freeze now works with every plug-in
<span class="m">│</span>
<span class="m">│</span>  <span class="bar">━━━━━━━━━━━━━━━━━━━━━━━━━</span><span class="m">───────────────</span>  62% <span class="m">· 38 of 61 MB · 20 s</span>
<span class="m">└</span>  <span class="m">Ctrl-C to stop · --json for scripts · NO_COLOR respected</span></pre>
        </div>
      </figure>
    </main>
  </body>
</html>
