<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI kits · Terminal (Node and Python CLIs; Textual)</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* A real cell grid: 14 px JetBrains Mono at line-height 1.2 (8.4 × 16.8 px cells), 80
         columns unless stated. Status roles map to ANSI-16 by default (ok green, warn yellow,
         err red, mute bright black) so they follow the user's terminal theme; truecolor is used
         only for the product accent, and only when COLORTERM=truecolor. One cell size: no big
         text, no rounded tiles. */
      .shot {
        border-radius: 12px;
        overflow: hidden;
        background: var(--t-bg);
        box-shadow:
          0 0 0 1px var(--t-frame),
          0 24px 50px -16px rgb(0 0 0 / 0.5);
        font: 14px/1.2 var(--kit-mono);
        font-variant-ligatures: none;
        color: var(--t-fg);
        --t-bg: #101114;
        --t-frame: #26282e;
        --t-fg: #d7dae0;
        --a: #72cabe; /* truecolor product accent (resolver fg, dark) */
        --ok: #5fd38d;
        --warn: #e5c07b;
        --err: #ef6b73;
        --mute: #7f848e;
        --strong: #ffffff;
        --cyan: #56b6c2;
      }
      [data-theme="light"] .shot {
        --t-bg: #fbfbfc;
        --t-frame: #dcdee3;
        --t-fg: #24292f;
        --a: #14796f;
        --ok: #1a7f37;
        --warn: #9a6700;
        --err: #cf222e;
        --mute: #6e7781;
        --strong: #0b0d10;
        --cyan: #1b7c83;
        box-shadow:
          0 0 0 1px var(--t-frame),
          0 24px 50px -16px rgb(6 9 18 / 0.2);
      }
      .tbar {
        height: 34px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-bottom: 1px solid var(--t-frame);
        font: 500 12px/1 var(--pk-font-sans);
        color: var(--mute);
      }
      .tbar i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .tbar i:nth-child(2) {
        background: #febc2e;
      }
      .tbar i:nth-child(3) {
        background: #28c840;
        margin-inline-end: 10px;
      }
      pre {
        margin: 0;
        padding: 14px 16.8px 16.8px;
        font: inherit;
        white-space: pre;
      }
      .a {
        color: var(--a);
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .err {
        color: var(--err);
      }
      .m {
        color: var(--mute);
      }
      .s {
        color: var(--strong);
        font-weight: 600;
      }
      .cy {
        color: var(--cyan);
      }
      .u {
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .chip {
        background: var(--a);
        color: var(--t-bg);
        font-weight: 600;
      }
      .rev {
        background: var(--strong);
        color: var(--t-bg);
        font-weight: 600;
      }
      .cell {
        display: inline-block;
        width: 8.4px;
        text-align: center;
        overflow: visible;
      }
      .bx {
        display: inline-block;
        width: 8.4px;
        height: 16.8px;
        vertical-align: top;
        position: relative;
      }
      .bx::before,
      .bx::after {
        content: "";
        position: absolute;
        background: currentColor;
      }
      .bx.v::before {
        inset-inline-start: 3.7px;
        width: 1px;
        top: 0;
        bottom: 0;
      }
      .bx.tl::before {
        inset-inline-start: 3.7px;
        width: 1px;
        top: 8.4px;
        bottom: 0;
      }
      .bx.tl::after {
        inset-inline-start: 3.7px;
        inset-inline-end: 0;
        height: 1px;
        top: 8.4px;
      }
      .bx.bl::before {
        inset-inline-start: 3.7px;
        width: 1px;
        top: 0;
        height: 8.9px;
      }
      .bx.bl::after {
        inset-inline-start: 3.7px;
        inset-inline-end: 0;
        height: 1px;
        top: 8.4px;
      }
      /* ▌ (the masked field's cursor): the left half of the cell, full height, as a terminal
         draws block elements. */
      .bx.hl::before {
        inset-inline-start: 0;
        width: 4.2px;
        top: 0;
        bottom: 0;
      }
      .cols80 {
        width: calc(80 * 8.4px + 33.6px);
      }
      .cols60 {
        width: calc(60 * 8.4px + 33.6px);
      }
      .strip {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
      }
      .strip > div {
        border-top: 1px solid var(--t-frame);
      }
      .strip > div:nth-child(odd) {
        border-inline-end: 1px solid var(--t-frame);
      }
      .strip .lbl {
        font: 500 11px/1 var(--pk-font-sans);
        color: var(--mute);
        padding: 10px 16.8px 0;
      }
      /* NO_COLOR drops every escape (packages/sdk-node/src/cli/term/caps.ts): no colour, no bold,
         no underline, no reverse video. */
      .nocolor * {
        color: var(--t-fg) !important;
        background: none !important;
        font-weight: 400 !important;
        text-decoration: none !important;
      }
      .nocolor .s,
      .nocolor .chip {
        color: var(--t-fg) !important;
      }
      .ansi16 {
        --a: var(--cyan);
      }
      /* Textual */
      .tx {
        display: grid;
        grid-template-columns: calc(22 * 8.4px) 1fr;
        grid-template-rows: 16.8px 1fr 16.8px;
        height: calc(24 * 16.8px);
      }
      .tx .hd,
      .tx .ft {
        grid-column: 1 / -1;
        padding: 0 8.4px;
      }
      .tx .hd {
        background: color-mix(in oklab, var(--a) 22%, var(--t-bg));
        color: var(--strong);
      }
      .tx .ft {
        background: color-mix(in oklab, var(--t-fg) 8%, var(--t-bg));
      }
      .tx .side {
        border-inline-end: 1px solid
          color-mix(in oklab, var(--t-fg) 18%, transparent);
        padding: 16.8px 0;
      }
      .tx .side div {
        padding: 0 16.8px;
      }
      .tx .side .on {
        background: color-mix(in oklab, var(--a) 18%, var(--t-bg));
        color: var(--strong);
      }
      .tx .main {
        padding: 16.8px 25.2px;
        white-space: pre;
      }
      /* Textual buttons: one shape, two weights. The primary is the accent block, the
         secondary a tonal block of the same height and padding. Never brackets next to blocks. */
      .tbtn2 {
        background: color-mix(in srgb, var(--strong) 16%, var(--t-bg));
        color: var(--strong);
      }
    </style>
  </head>
  <body>
    <main class="board">
      <figure>
        <figcaption>
          terminal · sign-in (device code, no QR, 80 × 24)
        </figcaption>
        <div class="shot cols80" data-shot="sign-in">
          <div class="tbar"><i></i><i></i><i></i>tidewater — 80 × 24</div>
          <pre id="signin"></pre>
        </div>
      </figure>
      <figure>
        <figcaption>
          terminal · activate (masked key entry: the public prefix, then
          bullets)
        </figcaption>
        <div class="shot cols80" data-shot="activate">
          <div class="tbar"><i></i><i></i><i></i>tidewater — 80 × 24</div>
          <pre id="activate"></pre>
        </div>
      </figure>
      <figure>
        <figcaption>
          terminal · device limit on the key path (replace a device in the
          browser)
        </figcaption>
        <div class="shot cols80" data-shot="device-limit">
          <div class="tbar"><i></i><i></i><i></i>tidewater — 80 × 24</div>
          <pre id="dl"></pre>
        </div>
      </figure>
      <figure>
        <figcaption>terminal · status and update progress</figcaption>
        <div class="shot cols80" data-shot="update">
          <div class="tbar"><i></i><i></i><i></i>tidewater — 80 × 24</div>
          <pre id="update"></pre>
        </div>
      </figure>
      <figure>
        <figcaption>
          terminal · blocked status with the fix as a command
        </figcaption>
        <div class="shot cols80" data-shot="status-error">
          <div class="tbar"><i></i><i></i><i></i>tidewater — 80 × 24</div>
          <pre id="err"></pre>
        </div>
      </figure>
      <figure>
        <figcaption>
          terminal · boot (spinner, then the result), healthy status and the
          offline error
        </figcaption>
        <div class="shot cols80" data-shot="states">
          <div class="tbar"><i></i><i></i><i></i>tidewater — 80 × 24</div>
          <pre id="states"></pre>
        </div>
      </figure>
      <figure>
        <figcaption>
          terminal · grouped help (cut to 24 rows: Devices, Settings, Updates,
          Content and Support left out)
        </figcaption>
        <div class="shot cols80" data-shot="help">
          <div class="tbar"><i></i><i></i><i></i>tidewater — 80 × 24</div>
          <pre id="help"></pre>
        </div>
      </figure>
      <figure>
        <figcaption>
          terminal · fallbacks: truecolor, ANSI-16, NO_COLOR, ascii symbols
        </figcaption>
        <div
          class="shot"
          data-shot="fallbacks"
          style="width: calc(160 * 8.4px + 67px)"
        >
          <div class="tbar"><i></i><i></i><i></i>the same output four ways</div>
          <div class="strip">
            <div>
              <div class="lbl">truecolor (COLORTERM=truecolor)</div>
              <pre class="fb"></pre>
            </div>
            <div class="ansi16">
              <div class="lbl">ANSI-16 (default)</div>
              <pre class="fb"></pre>
            </div>
            <div class="nocolor">
              <div class="lbl">NO_COLOR=1</div>
              <pre class="fb"></pre>
            </div>
            <div class="ansi16">
              <div class="lbl">ascii symbols (--ascii, ANSI-16)</div>
              <pre class="fb ascii"></pre>
            </div>
          </div>
        </div>
      </figure>
      <figure>
        <figcaption>
          terminal · 60 columns (the device limit's browser hand-off; the text
          wraps at the column)
        </figcaption>
        <div class="shot cols60" data-shot="narrow">
          <div class="tbar"><i></i><i></i><i></i>tidewater — 60 × 24</div>
          <pre id="narrow"></pre>
        </div>
      </figure>
      <figure>
        <figcaption>terminal · Textual app (optional, Python)</figcaption>
        <div class="shot cols80" data-shot="textual">
          <div class="tx" id="tx">
            <div class="hd">
              <span class="s">Tidewater Studio</span> <span>· account</span>
            </div>
            <div class="side">
              <div class="on">Account</div>
              <div>Devices</div>
              <div>Updates</div>
              <div>About</div>
            </div>
            <div class="main" id="txmain"></div>
            <div class="ft">
              <span class="s">↑↓</span> <span class="m">move</span>
              <span class="s">enter</span> <span class="m">open</span>
              <span class="s">q</span> <span class="m">quit</span>
            </div>
          </div>
        </div>
      </figure>
    </main>
    <script>
      // Every character occupies exactly one cell, as in a terminal: glyphs outside the font's
      // subset are pinned to the cell width, and box-drawing rails are drawn edge to edge.
      const BOX = { "│": "v", "┌": "tl", "└": "bl", "▌": "hl" };
      const esc = (t) =>
        [...t]
          .map((ch) => {
            if (BOX[ch]) return `<span class="bx ${BOX[ch]}"></span>`;
            const e = ch === "&" ? "&amp;" : ch === "<" ? "&lt;" : ch;
            return ch.charCodeAt(0) > 0x2000 && ch !== "’" && ch !== "…"
              ? `<span class="cell">${e}</span>`
              : e;
          })
          .join("");
      // A line is a list of [class, text] segments.
      const L = (...segs) => ({
        html: segs
          .map(([c, t]) => (c ? `<span class="${c}">${esc(t)}</span>` : esc(t)))
          .join(""),
      });
      const R = (...segs) => L(["m", "│"], ["", "  "], ...segs);
      const put = (id, lines) =>
        (document.getElementById(id).innerHTML = lines
          .map((l) => (typeof l === "string" ? l : l.html))
          .join("\n"));
      const keys = (...pairs) =>
        pairs.flatMap(([k, a], i) => [
          ...(i ? [["m", " · "]] : []),
          ["s", k],
          ["m", " " + a],
        ]);

      // ASCII symbols (--ascii): the same lines with every Unicode mark swapped for its ASCII
      // stand-in, as the kit's symbol table does.
      const ASCII = {
        "┌": "+",
        "│": "|",
        "└": "`",
        "◇": "o",
        "◆": "*",
        "▲": "!",
        "✓": "+",
        "●": "#",
        "○": "-",
        "•": "*",
        "·": "-",
        "…": "...",
        "▌": "_",
      };
      const asciify = (segs) =>
        segs.map(([c, t]) => [c, [...t].map((ch) => ASCII[ch] ?? ch).join("")]);
      const draw = (lines, ascii) =>
        lines.map((s) => L(...(ascii ? asciify(s) : s)));
      const rail = (...segs) => [["m", "│"], ["", "  "], ...segs];
      const head = (verb) => [
        ["m", "┌  "],
        ["chip", " Tidewater Studio "],
        ["m", " · " + verb],
      ];

      // The drawn shots follow the Node kit's goldens (packages/sdk-node/test/cli/golden/ansi/),
      // with the shell prompt that ran the verb above them.

      // 1. Sign in: the headless code view (golden sign-in-handoff-code). No QR on any terminal
      // (SIGN-IN.md D-67, D-68, §4.15 frame 32); the code in reverse video, the countdown, then
      // the braille spinner in mute. The frame stays open while it waits.
      put(
        "signin",
        draw([
          [
            ["m", "$ "],
            ["", "tidewater login"],
          ],
          head("login"),
          [["m", "│"]],
          [
            ["m", "◇"],
            ["", "  No browser on this computer. Use a code instead:"],
          ],
          rail(
            ["", "On any phone or computer, go to "],
            ["u", "key.plrs.im/device"],
            ["", " and enter this code."],
          ),
          [["m", "│"]],
          rail(["", "   "], ["rev", " WDJB-MJHT "]),
          [["m", "│"]],
          rail(["", "Check the code there matches this one."]),
          rail(["m", "Code expires in 4:12"]),
          [["m", "│"]],
          [
            ["m", "⠋"],
            ["", "  Waiting for you to sign in…"],
          ],
          rail(...keys(["c", "copy the code"], ["Esc", "cancel"])),
        ]),
      );

      // 2. Activate (golden activate-parsed): the key is never echoed. The public product prefix
      // shows, then one bullet per character, and the verdict names only the product.
      put(
        "activate",
        draw([
          [
            ["m", "$ "],
            ["", "tidewater activate"],
          ],
          head("activate"),
          [["m", "│"]],
          [
            ["cy", "◆"],
            ["", "  "],
            ["s", "License key"],
            ["m", "  You'll find it in your purchase email."],
          ],
          rail(["m", "pkey_tidewater_"], ["", "•".repeat(22)], ["cy", "▌"]),
          [
            ["ok", "✓"],
            ["", "  Key for Tidewater Studio"],
          ],
          [["m", "└  "], ...keys(["Enter", "activate"], ["Esc", "cancel"])],
        ]),
      );

      // 3. Device limit on the key path (golden device-limit-browser-mode, 80 and 60 columns).
      // The terminal cannot list the license's devices before activation, so it hands Replace a
      // device to the portal (SIGN-IN.md §4.15, "Kit DeviceLimit (key path)": URL to manageUrl).
      const deviceLimit = ({ cols = 80, prompt = true } = {}) => [
        ...(prompt
          ? [
              [
                ["m", "$ "],
                ["", "tidewater activate"],
              ],
            ]
          : []),
        head("activate"),
        [["m", "│"]],
        [
          ["m", "◇"],
          ["", "  "],
          ["s", "License key"],
          ["", " "],
          ["m", "· pkey_tidewater_"],
          ["", "••••••"],
        ],
        [
          ["warn", "▲"],
          ["", "  "],
          ["s", "Your license is on 3 of 3 devices"],
        ],
        rail(["s", "●●●"], ["m", " 3 of 3 in use"]),
        ...(cols < 80
          ? [
              rail(["", "Replace a device in your browser. Tidewater Studio"]),
              rail(["", "continues when you're done."]),
            ]
          : [
              rail([
                "",
                "Replace a device in your browser. Tidewater Studio continues when",
              ]),
              rail(["", "you're done."]),
            ]),
        rail(["u", "key.plrs.im/portal/tidewater/devices"]),
        [
          ["m", "└  "],
          ...keys(["Enter", "open in browser"], ["Esc", "cancel"]),
        ],
      ];
      put("dl", draw(deviceLimit()));
      put("narrow", draw(deviceLimit({ cols: 60 })));

      // 4. Status and update. Truecolor is for the product chip only (§1.4): the step glyph and
      // the progress fill use ANSI cyan.
      const bar = (p, w) =>
        `<span class="cy">${esc("━".repeat(Math.round(p * w)))}</span><span class="m">${esc("━".repeat(w - Math.round(p * w)))}</span>`;
      put("update", [
        L(["m", "$ "], ["", "tidewater status"]),
        L(
          ["s", "Tidewater Studio Pro"],
          ["m", " · Lifetime · mara@fennick.studio"],
        ),
        L(["m", "  Devices              "], ["", "2 of 3"]),
        L(
          ["m", "  Version              "],
          ["", "2.4.1"],
          ["m", " · checked 2 min ago"],
        ),
        L(
          ["m", "  Works offline until  "],
          ["", "Oct 8 "],
          ["warn", "(3 days)"],
          ["m", " · go online to renew"],
        ),
        "",
        L(["m", "$ "], ["", "tidewater update"]),
        L(["m", "┌  "], ["chip", " Tidewater Studio "], ["m", " · update"]),
        L(["m", "│"]),
        L(
          ["cy", "◆"],
          ["", "  "],
          ["s", "Tidewater Studio 2.5"],
          ["m", " · 61 MB"],
        ),
        R(["", "Stem export in one click, with loudness matching"]),
        R(["", "Track freeze now works with every plug-in"]),
        R(["m", "Release notes: "], ["m u", "tidewater.app/releases/2.5"]),
        L(["m", "│"]),
        {
          html: `<span class="m">${esc("│")}</span>  ${bar(0.62, 36)}  62% <span class="m">${esc("· 38 of 61 MB · 20 s left")}</span>`,
        },
        L(["m", "└  "], ...keys(["ctrl-c", "cancel"])),
      ]);

      // 5. Status error
      put("err", [
        L(["m", "$ "], ["", "tidewater status"]),
        L(
          ["err", "✗"],
          ["", "  "],
          ["s", "Tidewater Studio"],
          ["", " · license revoked"],
        ),
        R(["", "Harbor Audio revoked this key on Oct 2, after a refund."]),
        L(["m", "│"]),
        R(["", "To keep using Tidewater Studio:"]),
        R(["s", "tidewater activate"], ["m", "   add a different key"]),
        R(
          ["s", "tidewater login   "],
          ["m", "   use the license on your account"],
        ),
        L(["m", "└  "], ["m", "exit 3 · --json for scripts"]),
      ]);

      // 5b. Boot, healthy status, offline error
      put("states", [
        L(["m", "$ "], ["", "tidewater"]),
        L(["m", "⠹"], ["", "  Checking your license"], ["m", " …"]),
        L(
          ["ok", "✓"],
          ["", "  "],
          ["s", "Tidewater Studio Pro"],
          ["m", " · ready"],
        ),
        "",
        L(["m", "$ "], ["", "tidewater status"]),
        L(["m", "┌  "], ["chip", " Tidewater Studio "], ["m", " · status"]),
        L(["m", "│"]),
        R(
          ["ok", "✓"],
          ["", " License   "],
          ["s", "Pro"],
          ["m", " · Lifetime · mara@fennick.studio"],
        ),
        R(
          ["ok", "✓"],
          ["", " Devices   "],
          ["s", "2 of 3"],
          ["m", " · this Mac, MacBook Pro"],
        ),
        R(
          ["ok", "✓"],
          ["", " Offline   "],
          ["s", "14 days"],
          ["m", " before it needs to check in"],
        ),
        R(
          ["ok", "✓"],
          ["", " Version   "],
          ["s", "2.4.1"],
          ["m", " · up to date on stable"],
        ),
        L(["m", "└  "], ["m", "exit 0 · --json for scripts"]),
        "",
        L(["m", "$ "], ["", "tidewater update"]),
        L(["warn", "▲"], ["", "  "], ["s", "Can’t reach Harbor Audio"]),
        R([
          "",
          "Check your connection. Tidewater Studio keeps working offline",
        ]),
        R(["", "for "], ["warn", "3 more days"], ["", "."]),
        L(
          ["m", "└  "],
          ["s", "tidewater update --retry"],
          ["m", "   try again · exit 4"],
        ),
      ]);

      // 6. Help (golden help, 80 columns): the kit's groups in its order, cut to 24 rows. The
      // description column starts at cell 28; a long description wraps under itself.
      const cmd = (c, d, ...more) => [
        L(["", "  "], ["s", c], ["", " ".repeat(26 - c.length) + d]),
        ...more.map((t) => L(["", " ".repeat(28) + t])),
      ];
      put("help", [
        L(["s", "tidewater"], ["m", " · Tidewater Studio license and updates"]),
        "",
        L(["m", "Usage"], ["", "  tidewater <command> [options]"]),
        "",
        L(["s", "License"]),
        ...cmd(
          "activate [key]",
          "Add a license key (prompts; never an argument)",
        ),
        ...cmd("status", "License, devices and offline time"),
        ...cmd(
          "enroll",
          "Get the free license, when Tidewater Studio",
          "offers one",
        ),
        ...cmd(
          "deactivate",
          "Stop using your license on this device and free",
          "its seat",
        ),
        "",
        L(["s", "Account"]),
        ...cmd("login", "Sign in with your account in the browser"),
        ...cmd("logout", "Sign out on this device"),
        "",
        L(["s", "Options"]),
        ...cmd("--json", "JSON output for scripts, on every command"),
        ...cmd("--no-color", "Plain text (also NO_COLOR=1)"),
        ...cmd("--ascii", "ASCII symbols only"),
        ...cmd("-h, --help", "Help for a command"),
        "",
        L(["m", "Run tidewater <command> --help for one command's options."]),
      ]);

      // 7. Fallbacks: the device limit (golden device-limit-browser-mode) in truecolor-80-dark,
      // ansi16-80, no-color-80 and ascii-80. The quadrant's class sets the colour level.
      document.querySelectorAll(".fb").forEach(
        (p) =>
          (p.innerHTML = draw(
