<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      UI kits · Windows 11 (Electron, Tauri, Compose Desktop, Qt Quick)
    </title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* Windows 11, Fluent 2 platform variant (theme.platform "windows"): 32 px controls with a
         4 px radius, the primary first at equal width, a ContentDialog on a smoke layer for the
         `sheet` presentation, the Fluent focus ring. Every window is one component that reads
         its own size (container queries on .wapp): the passport pane beside the form, a one-line
         strip when narrow, two columns when short, a sheet-scale surface on the product ambient
         when large. polaris-key resolves the product accent; native (data-ui-preset) takes the
         Fluent look with the host accent. */
      :root {
        --w-mica: #202227;
        --w-layer: #2b2d33;
        --w-card: #2f3137;
        --w-sunk: rgb(0 0 0 / 0.22);
        --w-stroke: rgb(255 255 255 / 0.07);
        --w-text: #ffffff;
        --w-mute: rgb(255 255 255 / 0.66);
        --w-ctl: rgb(255 255 255 / 0.07);
        --w-field: rgb(255 255 255 / 0.05);
        --w-acc: var(--kit-accent);
        --w-acc-fg: var(--kit-accent-fg);
        --w-on: var(--kit-accent-on);
        --w-ring: var(--kit-focus);
        --w-edge: rgb(0 0 0 / 0.2);
        --w-amb-a: #9fe3d6;
        --w-amb-b: rgb(245 211 138 / 0.4);
        --w-wall-a: #1f3d63;
        --w-wall-b: #12324a;
        --w-wall: #0e1622;
        --w-shadow: rgb(0 0 0 / 0.37);
        --w-rim: rgb(0 0 0 / 0.4);
        --w-smoke: rgb(0 0 0 / 0.42);
      }
      [data-theme="light"] {
        --w-mica: #eef1f4;
        --w-layer: #f9f9fb;
        --w-card: #ffffff;
        --w-sunk: rgb(0 0 0 / 0.045);
        --w-stroke: rgb(0 0 0 / 0.07);
        --w-text: #1b1b1b;
        --w-mute: rgb(0 0 0 / 0.6);
        --w-ctl: #ffffff;
        --w-field: #ffffff;
        --w-wall-a: #bcd3ef;
        --w-wall-b: #cfe2ef;
        --w-wall: #e6edf5;
        --w-shadow: rgb(0 0 0 / 0.18);
        --w-rim: rgb(0 0 0 / 0.1);
        --w-smoke: rgb(0 0 0 / 0.3);
      }
      /* Native: Fluent type and the host's accent (the Windows blue), resolved so the label
         keeps 4.5:1 and the fill 3:1 on the surfaces below. */
      [data-ui-preset="native"] {
        --w-acc: #60cdff;
        --w-acc-fg: #60cdff;
        --w-on: #000000;
        --w-ring: #ffffff;
        font-family:
          "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      [data-theme="light"] [data-ui-preset="native"] {
        --w-acc: #0067c0;
        --w-acc-fg: #005a9e;
        --w-on: #ffffff;
        --w-ring: #1b1b1b;
      }

      .shot {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        isolation: isolate;
        display: flex;
        gap: 48px;
        align-items: flex-start;
        padding: 48px;
      }
      .shot::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(80% 90% at 70% 10%, var(--w-wall-a) 0%, transparent 60%),
          radial-gradient(60% 70% at 10% 100%, var(--w-wall-b) 0%, transparent 60%),
          var(--w-wall);
      }
      .win {
        position: relative;
        flex: none;
        border-radius: 8px;
        overflow: hidden;
        background: var(--w-mica);
        color: var(--w-text);
        font-size: 14px;
        line-height: 20px;
        display: grid;
        grid-template-rows: 40px 1fr;
        box-shadow:
          0 0 0 1px var(--w-rim),
          0 32px 64px var(--w-shadow),
          0 2px 21px var(--w-shadow);
      }
      /* The host OS window: Mica title bar, caption buttons. Drawn around the kit. */
      .tb {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-inline-start: 16px;
        font-size: 12px;
      }
      .caps {
        margin-inline-start: auto;
        display: flex;
        height: 100%;
      }
      .caps span {
        width: 46px;
        display: grid;
        place-items: center;
        color: var(--w-text);
      }
      .wapp {
        container: app / size;
        background: var(--w-layer);
        border-top: 1px solid var(--w-stroke);
        border-radius: 8px 0 0 0;
        position: relative;
        overflow: hidden;
        min-height: 0;
      }
      .stage {
        height: 100%;
        display: grid;
        position: relative;
        z-index: 1;
      }

      /* ---- Controls ---- */
      .wb {
        height: 32px;
        min-width: 96px;
        padding: 0 16px;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font: 400 14px/20px var(--pk-font-sans);
        background: var(--w-ctl);
        color: var(--w-text);
        white-space: nowrap;
        box-shadow:
          inset 0 0 0 1px var(--w-stroke),
          inset 0 -1px 0 var(--w-stroke);
      }
      [data-ui-preset="native"] .wb,
      [data-ui-preset="native"] .wh,
      [data-ui-preset="native"] .wfield .mono {
        font-family: inherit;
      }
      .wb.primary {
        background: var(--w-acc);
        color: var(--w-on);
        font-weight: 500;
        box-shadow: inset 0 -1px 0 var(--w-edge);
      }
      .wb.eq {
        flex: 1 1 0;
        min-width: 0;
      }
      .wb.block {
        width: 100%;
      }
      .wb.sm {
        height: 24px;
        min-width: 0;
        padding: 0 8px;
        font-size: 12px;
        line-height: 16px;
      }
      .wlink {
        color: var(--w-acc-fg);
      }
      .ring {
        outline: 2px solid var(--w-ring);
        outline-offset: 2px;
      }
      [data-ui-preset="native"] .ring {
        outline-offset: 1px;
        box-shadow: 0 0 0 1px var(--w-layer);
      }
      .wfield {
        min-height: 32px;
        border-radius: 4px;
        background: var(--w-field);
        box-shadow: inset 0 0 0 1px var(--w-stroke);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 4px 4px 12px;
        position: relative;
        overflow: hidden;
      }
      .wfield.focus {
        background: var(--w-card);
      }
      .wfield.focus::after {
        content: "";
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        height: 2px;
        background: var(--w-acc-fg);
      }
      .wfield .mono {
        flex: 1;
        font-size: 13px;
        line-height: 20px;
      }
      .wlabel {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
      }
      .wverdict {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
        color: var(--w-mute);
      }
      .wverdict b {
        font-weight: 500;
        color: var(--w-text);
      }
      .wmute {
        color: var(--w-mute);
      }
      .wh {
        font: 600 20px/28px var(--pk-font-sans);
        margin: 0;
        text-wrap: balance;
      }
      .wh.hero {
        font-size: 28px;
        line-height: 36px;
      }
      .wp {
        margin: 0;
        color: var(--w-mute);
        text-wrap: pretty;
      }
      .wcode {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 12px 12px 20px;
        border-radius: 4px;
        background: var(--w-sunk);
        box-shadow: inset 0 0 0 1px var(--w-stroke);
      }
      .wcode .mono {
        font-size: 28px;
        line-height: 36px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      .wwait {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--w-mute);
      }
      /* DL6: a refusal is neutral text on the sunken surface, with its fix as the one primary. */
      .wnote {
        padding: 12px 16px;
        border-radius: 4px;
        background: var(--w-sunk);
        box-shadow: inset 0 0 0 1px var(--w-stroke);
        text-wrap: pretty;
      }
      .wlist {
        border-radius: 4px;
        background: var(--w-card);
        box-shadow: inset 0 0 0 1px var(--w-stroke);
      }
      .wdev {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 8px 16px;
        position: relative;
      }
      .wdev + .wdev::before {
        content: "";
        position: absolute;
        inset-inline: 16px;
        top: 0;
        height: 1px;
        background: var(--w-stroke);
      }
      .wdev .t {
        flex: 1;
        min-width: 0;
      }
      .wdev small,
      .wrow small {
        display: block;
        font-size: 12px;
        line-height: 16px;
        color: var(--w-mute);
      }

      /* ---- The window's one layout: passport pane beside the form ---- */
      .gate {
        display: grid;
        grid-template-columns: clamp(240px, 38%, 360px) 1fr;
        grid-template-areas: "start end";
        width: 100%;
        height: 100%;
        min-height: 0;
      }
      .start {
        grid-area: start;
        margin: 16px 0 16px 16px;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
      }
      .start .art,
      .start .art svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .start .iconpane {
        display: none;
        position: absolute;
        inset: 0;
        place-items: center;
        background: var(--w-sunk);
      }
      [data-ui-preset="native"] .start .art {
        display: none;
      }
      [data-ui-preset="native"] .start .iconpane {
        display: grid;
      }
      .strip {
        grid-area: strip;
        display: none;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding-inline: 24px;
        font-weight: 500;
      }
      .end {
        grid-area: end;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 48px 48px 32px;
        overflow: hidden;
      }
      .hdr {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 500;
      }
      .body {
        display: grid;
        gap: 16px;
        align-content: start;
      }
      .lines {
        display: grid;
        gap: 4px;
      }
      .acts {
        display: flex;
        gap: 8px;
      }
      .acts.stack {
        display: grid;
        max-width: 320px;
      }
      .links {
        display: flex;
        gap: 20px;
        color: var(--w-mute);
      }
      .amb {
        display: none;
      }

      /* Narrow (under 560): the pane collapses to a one-line strip, actions dock at the bottom. */
      @container app (max-width: 559px) {
        .gate {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
          grid-template-areas: "strip" "end";
        }
        .start,
        .hdr {
          display: none;
        }
        .strip {
          display: flex;
        }
        .end {
          padding: 32px 24px 24px;
          gap: 16px;
        }
        .acts {
          margin-top: auto;
        }
        .acts.stack {
          max-width: none;
        }
      }
      /* Short landscape (under 30 rem tall): two columns, secondary lines give way. */
      @container app (min-width: 560px) and (max-height: 479px) {
        .gate {
          grid-template-columns: clamp(200px, 30%, 280px) 1fr;
        }
        .start {
          margin-block: 12px;
        }
        .end {
          padding: 24px 32px 16px;
          gap: 16px;
        }
        .body {
          gap: 12px;
        }
        .opt {
          display: none;
        }
        .wh.hero {
          font-size: 24px;
          line-height: 32px;
        }
        .wdev {
          min-height: 40px;
          padding-block: 4px;
        }
      }
      /* Large (1100 and up): a sheet-scale row on the product ambient, never stretched. */
      @container app (min-width: 1100px) and (min-height: 640px) {
        .stage {
          place-items: center;
        }
        .gate {
          width: 1040px;
          height: 560px;
          border-radius: 8px;
          background: var(--w-layer);
          box-shadow:
            0 0 0 1px var(--w-stroke),
            0 16px 32px var(--w-shadow);
          grid-template-columns: 400px 1fr;
        }
        .end {
          padding: 56px 56px 40px;
        }
        .amb {
          display: block;
          position: absolute;
          inset: 0;
          pointer-events: none;
          overflow: hidden;
        }
        .amb > div {
          position: absolute;
          inset-inline-start: 50%;
          top: 42%;
          translate: -50% -50%;
          filter: blur(110px) saturate(1.4);
          opacity: 0.42;
        }
        .amb svg {
          width: 900px;
          height: 620px;
          display: block;
        }
      }
      [data-theme="light"] .amb > div {
        display: none;
      }
      [data-theme="light"] .amb {
        background:
          radial-gradient(
            circle 560px at 50% 40%,
            color-mix(in oklab, var(--kit-accent-subtle), var(--w-amb-a) 30%),
            transparent 72%
          ),
          radial-gradient(circle 300px at 62% 28%, var(--w-amb-b), transparent 70%);
      }
      [data-ui-preset="native"] .amb {
        display: none;
      }

      /* ---- Dialog (the `sheet` presentation, and the update window) ---- */
      .smoke {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: var(--w-smoke);
        z-index: 5;
      }
      .dialog {
        position: absolute;
        inset-inline-start: 50%;
        top: 50%;
        translate: -50% -50%;
        width: 480px;
        border-radius: 8px;
        overflow: hidden;
        background: var(--w-layer);
        box-shadow:
          0 0 0 1px var(--w-rim),
          0 32px 64px var(--w-shadow);
        z-index: 6;
      }
      .dialog .dbody {
        padding: 24px;
        display: grid;
        gap: 16px;
      }
      .dialog .foot {
        padding: 24px;
        background: var(--w-mica);
        border-top: 1px solid var(--w-stroke);
        display: flex;
        gap: 8px;
      }
      .tracks {
        padding: 20px;
        display: grid;
        gap: 4px;
        align-content: start;
      }
      .track {
        height: 56px;
        border-radius: 4px;
        background: var(--w-card);
        box-shadow: inset 0 0 0 1px var(--w-stroke);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        overflow: hidden;
      }
      .track b {
        width: 96px;
        flex: none;
        font-weight: 500;
      }
      .wave {
        display: flex;
        align-items: center;
        height: 40px;
        white-space: nowrap;
      }
      .wave i {
        display: inline-block;
        width: 3px;
        margin-inline-end: 3px;
        border-radius: 2px;
        background: var(--kit-accent);
      }

      /* ---- Settings (NavigationView) ---- */
      .nav span {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 36px;
        padding: 0 12px;
        border-radius: 4px;
        position: relative;
      }
      .nav span.on {
        background: var(--w-ctl);
      }
      .nav span.on::before {
        content: "";
        position: absolute;
        inset-inline-start: 0;
        top: 12px;
        bottom: 12px;
        width: 3px;
        border-radius: 2px;
        background: var(--w-acc-fg);
      }
      .wrow {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 56px;
        padding: 8px 16px;
        background: var(--w-card);
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px var(--w-stroke);
      }
      .wrow .t {
        flex: 1;
        min-width: 0;
      }
      .wgroup {
        display: grid;
        gap: 4px;
      }
      .wgroup > h2 {
        font: 600 14px/20px var(--pk-font-sans);
        margin: 16px 0 4px;
      }
      .tog {
        width: 40px;
        height: 20px;
        border-radius: 999px;
        background: var(--w-acc);
        position: relative;
        flex: none;
      }
      .tog::after {
        content: "";
        position: absolute;
        inset-inline-end: 4px;
        top: 4px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--w-on);
      }
      .val {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--w-mute);
      }

      /* ---- Boot, status, error: message screens, one block at most 560 wide ---- */
      .msg {
        width: 100%;
        height: 100%;
        display: grid;
        align-content: center;
        justify-items: start;
        gap: 16px;
        padding: 32px 40px;
      }
      .msg .lines {
        gap: 8px;
      }
      .msg .acts {
        justify-self: stretch;
      }
      .msg.boot {
        justify-items: center;
        text-align: center;
      }
      .shim {
        position: relative;
        width: 160px;
        height: 2px;
        background: var(--w-stroke);
        overflow: hidden;
      }
      .banner {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        margin: 16px 20px 0;
        border-radius: 4px;
        background: var(--pk-warning-subtle);
        box-shadow: inset 0 0 0 1px var(--pk-warning-border);
        color: var(--w-text);
      }
      .banner .grow {
        flex: 1;
      }
      .glyph {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--w-ctl);
        box-shadow: inset 0 0 0 1px var(--w-stroke);
      }
    </style>
  </head>
  <body>
    <main class="board" id="board"></main>
    <script>
      const NAME = "Tidewater Studio";
      const caps = `<div class="caps"><span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></span><span><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor"/></svg></span><span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10" stroke="currentColor"/></svg></span></div>`;
      const artSvg = `<svg viewBox="0 0 300 460" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="460" fill="#0b3a48"/><circle cx="210" cy="110" r="30" fill="#f5d38a"/>${[
        0, 1, 2, 3,
      ]
        .map((i) => {
          const y = 260 + i * 46;
          let d = `M-20 ${y}`;
          for (let x = -20; x <= 320; x += 60) d += ` q15 -16 30 0 t30 0`;
          return `<path d="${d}" stroke="${["#5fe3cf", "#8eeedd", "#bff5ea", "#5fe3cf"][i]}" stroke-width="9" fill="none" stroke-linecap="round" opacity="${(0.95 - i * 0.15).toFixed(2)}"/>`;
        })
        .join("")}</svg>`;
      const appIcon = (s, r) =>
        `<span class="k-appicon" data-art="tidewater" data-size="${s}" style="border-radius:${r}px"></span>`;
      const g = (n, s = 16) => `<span data-icon="${n}" data-size="${s}"></span>`;
      const key = `<span class="mono"><span class="k-key"><span>pkey_tidewater_7Q2MXK9RV4TC8HJN</span><span>3WPLDA</span></span></span>`;
      const ok = `<span style="color:var(--pk-success)" data-icon="checkCircle" data-size="16"></span>`;

      // The product header (DL5): the icon, and the name once when the title does not say it.
      const head = (named) => (named ? appIcon(56, 12) : `${appIcon(32, 8)}<span>${NAME}</span>`);

      const FLOW = {
        gate: () => ({
          named: true,
          body: `<div class="lines"><h1 class="wh hero">Welcome to Tidewater Studio</h1><span class="wmute opt" data-ui-no-strings>by Harbor Audio</span></div><p class="wp opt">Sign in or use a license key to continue.</p>`,
          acts: `<div class="acts stack"><span class="wb primary block">Sign in</span><span class="wb block">Use a license key</span></div>`,
          after: `<div class="links"><span>Start a free trial</span><span>Activate offline</span></div>`,
        }),
        activate: () => ({
          body: `<div class="lines"><h1 class="wh">Enter your license key</h1><p class="wp opt">You’ll find it in your purchase email.</p></div>
            <div><span class="wlabel">License key</span><div class="wfield focus">${key}<span class="wb sm">Paste</span></div>
            <div class="wverdict">${ok}<span><b>Tidewater Studio Pro</b> · Lifetime</span></div></div>`,
          acts: `<div class="acts"><span class="wb primary eq">Activate license</span><span class="wb eq">Cancel</span></div>`,
        }),
        signin: () => ({
          body: `<div class="lines"><h1 class="wh">Finish in your browser</h1><p class="wp opt">Check the code there matches this one.</p></div>
            <div class="wcode"><span class="mono">WDJB-MJHT</span><span class="wb sm">${g("copy", 14)}Copy</span></div>
            <div class="wmute opt">Or go to key.plrs.im/activate</div>
            <div class="wwait tnum"><span data-countdown="0.84" data-size="16"></span>Code expires in 4:12</div>`,
          acts: `<div class="acts"><span class="wb primary eq">${g("external", 14)}Open browser again</span><span class="wb eq">Cancel</span></div>`,
        }),
        limit: () => ({
          body: `<div class="lines"><h1 class="wh">Your license is on 3 of 3 devices</h1></div>
            <div class="wlist">
              <div class="wdev">${g("laptop", 20)}<div class="t">Work laptop<small>Windows 11 · last seen 41 days ago</small></div></div>
              <div class="wdev">${g("tablet", 20)}<div class="t">Mara’s iPad<small>iPadOS 26 · last seen yesterday</small></div></div>
              <div class="wdev opt">${g("laptop", 20)}<div class="t">MacBook Pro<small>macOS 26 · last seen today</small></div></div>
            </div>
            <div class="wnote">Replace a device in your browser. Tidewater Studio continues when you’re done.</div>`,
          acts: `<div class="acts"><span class="wb primary eq">${g("external", 14)}Open in browser</span><span class="wb eq">Cancel</span></div>`,
        }),
      };

      function pane(flow, opt = {}) {
        const f = FLOW[flow]();
        if (opt.ring) f.acts = f.acts.replace("wb primary", "wb primary ring");
        const stripName = f.named ? "" : `<span>${NAME}</span>`;
        return `<div class="gate">
          <div class="start"><div class="art">${artSvg}</div><div class="iconpane">${appIcon(96, 22)}</div></div>
          <div class="strip">${appIcon(32, 8)}${stripName}</div>
          <div class="end"><div class="hdr">${head(f.named)}</div><div class="body">${f.body}</div>${f.acts}${f.after || ""}</div>
        </div>`;
      }
      const tb = (title) =>
        `<div class="tb" data-ui-chrome>${appIcon(16, 4)}<span>${title}</span>${caps}</div>`;
      function win({ w, h, flow, native, title = NAME, dialog, content, ring }) {
        const inner =
          content ??
          `<div class="amb"><div data-art="tidewater" data-size="64"></div></div><div class="stage">${pane(flow, { ring })}</div>`;
        return `<div class="win"${native ? ' data-ui-preset="native"' : ""} style="width:${w}px;height:${h}px">${tb(title)}<div class="wapp">${inner}</div>${dialog || ""}</div>`;
      }
      // The `sheet` presentation: a ContentDialog over the host window and a smoke layer.
      function sheetOf(flow) {
        const f = FLOW[flow]();
        return `<div class="smoke"></div><div class="dialog"><div class="dbody"><div class="hdr">${head(false)}</div>${f.body.replace(/ opt/g, "")}</div>${f.acts.replace('class="acts"', 'class="foot"')}</div>`;
      }
      const tracks = (extra = "") =>
        `${extra}<div class="tracks">${["Vocals", "Guitar", "Drums", "Keys", "Bass", "Room mics"]
          .map((n, k) => {
            let w = "";
            for (let i = 0; i < 104; i++)
              w += `<i style="height:${(6 + Math.abs(Math.sin(i * 0.55 + k * 1.7)) * 26).toFixed(0)}px"></i>`;
            return `<div class="track"><b>${n}</b><span class="wave">${w}</span></div>`;
          })
          .join("")}</div>`;
      const msg = (inner, cls = "") => `<div class="msg ${cls}">${inner}</div>`;
      const sw = (inner, native, w = 480, h = 340) =>
        win({ w, h, content: inner, native });

      const settings = () => {
        const row = (ic, t, small, right) =>
          `<div class="wrow">${g(ic, 20)}<div class="t">${t}${small ? `<small>${small}</small>` : ""}</div>${right || ""}</div>`;
        return `<div style="display:grid;grid-template-columns:240px 1fr;height:100%">
          <div class="nav" style="padding:8px;display:grid;align-content:start;gap:4px">
            <span>${g("sliders")}General</span><span>${g("play")}Audio</span><span class="on">${g("user")}Account and license</span></div>
          <div style="padding:28px 36px;display:grid;align-content:start;gap:4px;background:var(--w-layer);border-radius:8px 0 0 0;overflow:hidden">
            <h1 class="wh hero" style="margin-bottom:16px">Account and license</h1>
            <div class="wrow" style="min-height:72px">${appIcon(40, 8)}<div class="t"><span style="font-weight:500">Tidewater Studio Pro</span><small>Lifetime · mara@fennick.studio</small></div><span class="wb">Manage${g("external", 14)}</span></div>
            ${row("laptop", "<span>Devices</span>", "2 of 3 in use", `<span class="wmute">${g("chevronRight")}</span>`)}
            <div class="wgroup"><h2>From Harbor Audio</h2>
              ${row("download", "<span>Update automatically</span>", "Changed by you", `<span class="val">On</span><span class="tog"></span>`)}</div>
            <div class="wgroup"><h2>Managed settings</h2>
              ${row("shield", "Share crash reports", "Set by Fennick Studio", `<span class="val">${g("lock", 14)}On</span>`)}</div>
            <div class="wgroup"><h2>Updates</h2>
              ${row("update", "Version <span class=tnum>2.4.1</span>", "You’re up to date", `<span class="wb">Check for updates</span>`)}</div>
          </div></div>`;
      };
      const update = `<div class="smoke"></div><div class="dialog"><div class="dbody">
        <div style="display:flex;gap:16px;align-items:center">${appIcon(48, 10)}<div><h2 class="wh">Tidewater Studio 2.5</h2><span class="wmute tnum">You have 2.4.1 · 61 MB download</span></div></div>
        <div style="display:grid;gap:4px"><span class="wmute" style="font-size:12px">What’s new</span><span>Stem export in one click, with loudness matching</span><span>Track freeze now works with every plug-in</span><span class="wlink">All changes in 2.5</span></div>
        <div><div style="height:3px;border-radius:2px;background:var(--w-stroke)"><div style="width:62%;height:100%;border-radius:2px;background:var(--w-acc-fg)"></div></div>
        <div class="wmute tnum" style="display:flex;justify-content:space-between;font-size:12px;margin-top:8px"><span>Downloading · 38 of 61 MB</span><span>About 20 seconds left</span></div></div>
        </div><div class="foot"><span class="wb primary eq ring">Restart when ready</span><span class="wb eq">Later</span></div></div>`;

      const shots = [];
      const add = (name, cap, ...wins) => shots.push({ name, cap, wins });
      const W = 900, H = 600;
      const fr = (flow, w, h, native) => win({ w, h, flow, native });

      add("gate", "gate · polaris-key · 900 × 600 · Mica (opaque on Windows 10, Remote Desktop, Transparency effects off)", fr("gate", W, H));
      add("gate-native", "gate · native · 900 × 600 · Fluent, Windows accent", fr("gate", W, H, true));
      add("gate-shapes", "gate · narrow 480 × 640 and short landscape 900 × 400", fr("gate", 480, 640), fr("gate", 900, 400));
      add("gate-large", "gate · large 1440 × 900 · the row on the product ambient", fr("gate", 1440, 900));
      add("activate", "activate · inline · polaris-key · 900 × 600", fr("activate", W, H));
      add("activate-sheet", "activate · presentation: “sheet” · ContentDialog on a smoke layer", win({ w: W, h: H, content: tracks(), dialog: sheetOf("activate") }));
      add("activate-shapes", "activate · narrow 480 × 640 and short landscape 900 × 400", fr("activate", 480, 640), fr("activate", 900, 400));
      add("sign-in", "sign-in code · inline · polaris-key · 900 × 600", fr("signin", W, H));
      add("sign-in-native", "sign-in code · inline · native · 900 × 600", fr("signin", W, H, true));
      add("sign-in-sheet", "sign-in code · presentation: “sheet”", win({ w: W, h: H, content: tracks(), dialog: sheetOf("signin") }));
      add("sign-in-shapes", "sign-in code · narrow 480 × 640 and short landscape 900 × 400", fr("signin", 480, 640), fr("signin", 900, 400));
      add("sign-in-large", "sign-in code · large 1440 × 900", fr("signin", 1440, 900));
      add("device-limit", "device limit · key path · polaris-key · 900 × 600", fr("limit", W, H));
      add("device-limit-native", "device limit · key path · native · 900 × 600", fr("limit", W, H, true));
      add("device-limit-shapes", "device limit · narrow 480 × 640 and short landscape 900 × 400", fr("limit", 480, 640), fr("limit", 900, 400));
      add("device-limit-large", "device limit · large 1440 × 900", fr("limit", 1440, 900));
      add("focus", "keyboard focus · polaris-key accent ring and Fluent ring · 480 × 640", win({ w: 480, h: 640, flow: "gate", ring: true }), win({ w: 480, h: 640, flow: "gate", native: true, ring: true }));
      add("update", "update · ContentDialog over the app, focus on the primary", win({ w: W, h: H, content: tracks(), dialog: update }));
      add("settings", "account and license · provenance groups", win({ w: 900, h: 640, title: "Settings", content: settings() }));
      add(
        "states",
        "boot, grace and can’t connect",
        sw(msg(`${appIcon(72, 16)}<div class="shim"><span class="k-shimmer"></span></div><span class="wmute">Checking your license…</span>`, "boot")),
        sw(tracks(`<div class="banner">${g("wifiOff", 20)}<span class="grow">Offline · 3 days left to reconnect</span><span class="wb sm">Try again</span></div>`)),
        sw(msg(`<div class="glyph">${g("wifiOff", 20)}</div><div class="lines"><h1 class="wh">Can’t connect</h1><p class="wp">Can’t reach Polaris Key. Check your connection and try again.</p></div><div class="acts"><span class="wb primary eq">Try again</span><span class="wb eq">Continue offline</span></div>`)),
      );
      add(
        "revoked",
        "signed out (revoked) and expired · polaris-key and native",
        sw(msg(`${appIcon(48, 10)}<div class="lines"><h1 class="wh">Signed out</h1><p class="wp">This device was signed out. Sign in or activate again to continue.</p></div><div class="acts"><span class="wb primary eq">Sign in</span><span class="wb eq">Use a license key</span></div>`)),
        sw(msg(`${appIcon(48, 10)}<div class="lines"><h1 class="wh">License expired</h1><p class="wp">Your license has expired. Connect to the internet or renew it to continue.</p></div><div class="acts"><span class="wb primary eq">Renew${g("external", 14)}</span><span class="wb eq">Use another license</span></div>`), true),
      );

      document.getElementById("board").innerHTML = shots
        .map(
          (s) =>
            `<figure><figcaption>windows · ${s.cap}</figcaption><div class="shot" data-shot="${s.name}">${s.wins.join("")}</div></figure>`,
        )
        .join("");

    </script>
  </body>
</html>
