<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI kits · Qt (Qt Quick and QWidget, Python)</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="shared.js"></script>
    <style>
      /* The Python Qt kit (UK-12), drawn as Qt draws it rather than borrowed from the web
         variants. Qt Quick reads polaris_key/ui/qt/Theme.qml (generated): the platform variant's
         measures (Windows 32 px controls at radius 4, GNOME/Linux 34 px at radius 8, macOS 28 pt
         capsules), Rubik and the kit mono from the wheel. The QWidget parts read the generated
         polaris_key_{dark,light}.qss: object names (#pkTitle, #pkPrimary, #pkKey, #pkCard) and the
         product accent filled into its @pk-*@ placeholders. Linux Qt apps wear the KDE Breeze
         window frame. */
      :root {
        --q-win: #1f2025;
        --q-card: #2a2b31;
        --q-sunken: #16171b;
        --q-sep: rgb(255 255 255 / 0.08);
        --q-text: #ffffff;
        --q-mute: rgb(255 255 255 / 0.64);
        --q-ctl: rgb(255 255 255 / 0.08);
      }
      [data-theme="light"] {
        --q-win: #f6f7f9;
        --q-card: #ffffff;
        --q-sunken: #eceef3;
        --q-sep: rgb(0 0 0 / 0.08);
        --q-text: #14161b;
        --q-mute: rgb(0 0 0 / 0.58);
        --q-ctl: rgb(0 0 0 / 0.06);
      }
      .shot {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        isolation: isolate;
        display: grid;
        place-items: center;
        padding: 48px;
      }
      .shot::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(70% 90% at 20% 0%, #23414f 0%, transparent 60%),
          radial-gradient(60% 80% at 100% 100%, #2f2b3e 0%, transparent 60%),
          #12151a;
      }
      [data-theme="light"] .shot::before {
        background:
          radial-gradient(70% 90% at 20% 0%, #c8dbe2 0%, transparent 60%),
          radial-gradient(60% 80% at 100% 100%, #dad7e6 0%, transparent 60%),
          #eceef1;
      }
      .win {
        position: relative;
        overflow: hidden;
        background: var(--q-win);
        color: var(--q-text);
        font-size: 14px;
        line-height: 20px;
        box-shadow:
          0 0 0 1px rgb(0 0 0 / 0.45),
          0 28px 60px rgb(0 0 0 / 0.42);
      }
      [data-theme="light"] .win {
        box-shadow:
          0 0 0 1px rgb(0 0 0 / 0.12),
          0 28px 60px rgb(6 9 18 / 0.2);
      }
      /* Title bars: Windows 11 (Qt's default frame there), KDE Breeze, macOS. */
      .tb-win {
        height: 36px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding-left: 12px;
        font-size: 12px;
      }
      .tb-win .caps {
        margin-left: auto;
        display: flex;
        height: 100%;
      }
      .tb-win .caps span {
        width: 46px;
        display: grid;
        place-items: center;
      }
      .tb-kde {
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        font-size: 13px;
        background: color-mix(in oklab, var(--q-win) 85%, var(--q-text));
        border-bottom: 1px solid var(--q-sep);
      }
      .tb-kde .ico {
        position: absolute;
        left: 8px;
      }
      .tb-kde .btns {
        position: absolute;
        right: 6px;
        display: flex;
        gap: 6px;
      }
      .tb-kde .btns i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--q-ctl);
      }
      .tb-kde .btns i.x {
        background: #da4453;
      }
      .tb-mac {
        height: 40px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 8px;
      }
      .tb-mac i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .tb-mac i:nth-child(2) {
        background: #febc2e;
      }
      .tb-mac i:nth-child(3) {
        background: #28c840;
      }

      /* Qt Quick controls, from Theme.qml. */
      .qb {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 16px;
        font: 500 14px/1 var(--pk-font-sans);
        background: var(--q-ctl);
        color: var(--q-text);
        white-space: nowrap;
      }
      .qb.primary {
        background: var(--kit-accent);
        color: var(--kit-accent-on);
      }
      .windows .qb {
        height: 32px;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px var(--q-sep);
      }
      .gnome .qb {
        height: 34px;
        border-radius: 8px;
      }
      .mac .qb {
        height: 28px;
        border-radius: 999px;
        font-size: 13px;
        padding: 0 14px;
      }
      .qfield {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--q-sunken);
        padding: 0 10px;
      }
      .windows .qfield {
        min-height: 32px;
        border-radius: 4px;
        box-shadow: inset 0 -2px 0 var(--kit-accent-fg);
      }
      .gnome .qfield {
        min-height: 34px;
        border-radius: 8px;
        outline: 2px solid
          color-mix(in oklab, var(--kit-focus) 70%, transparent);
        outline-offset: -2px;
      }
      .qfield .mono {
        flex: 1;
        font-size: 13px;
      }
      .qt-title {
        font: 600 26px/32px var(--pk-font-sans);
        margin: 0;
        text-wrap: balance;
      }
      .qt-mute {
        color: var(--q-mute);
      }
      .qt-label {
        font: 500 13px/18px var(--pk-font-sans);
        margin-bottom: 6px;
        display: block;
      }
      .art {
        position: relative;
        overflow: hidden;
        background: #0b3a48;
      }
      .art svg {
        position: absolute;
        inset: 0;
      }

      /* QWidget parts, as the generated QSS draws them. */
      .parts {
        display: grid;
        grid-template-columns: repeat(2, 300px);
        gap: 22px 36px;
        padding: 24px 28px 28px;
      }
      .parts h3 {
        font: 500 12px/16px var(--pk-font-sans);
        color: var(--q-mute);
        margin: 0 0 8px;
      }
      .w-card {
        background: var(--q-card);
        border: 1px solid var(--q-sep);
        border-radius: 14px;
        padding: 18px;
        display: grid;
        gap: 6px;
      }
      .w-btn {
        height: 34px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        font: 500 13px/1 var(--pk-font-sans);
        background: var(--q-sunken);
        color: var(--q-text);
      }
      .w-btn.primary {
        background: var(--kit-accent);
        color: var(--kit-accent-on);
      }
      .w-btn.danger {
        background: var(--pk-kit-danger-solid);
        color: #fff;
      }
      .w-btn.link {
        background: transparent;
        color: var(--kit-accent-fg);
        padding: 0;
      }
      .w-btn.focus {
        box-shadow: 0 0 0 2px var(--kit-focus) inset;
      }
      .w-btn.disabled {
        color: var(--pk-text-subtle);
      }
      .w-edit {
        height: 34px;
        border-radius: 8px;
        background: var(--q-sunken);
        display: flex;
        align-items: center;
        padding: 0 12px;
        font: 400 13px/1 var(--pk-font-mono);
      }
      .w-edit.focus {
        box-shadow: 0 0 0 2px var(--kit-focus) inset;
      }
      .w-prog {
        height: 6px;
        border-radius: 3px;
        background: var(--q-sep);
        overflow: hidden;
      }
      .w-prog i {
        display: block;
        height: 100%;
        width: 62%;
        border-radius: 3px;
        background: var(--kit-accent);
      }
      .w-list {
        background: var(--q-card);
        border: 1px solid var(--q-sep);
        border-radius: 14px;
        overflow: hidden;
      }
      .w-list div {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        padding: 0 12px;
        font-size: 13px;
      }
      .w-list div.sel {
        background: var(--kit-accent-subtle);
      }
      .w-list small {
        margin-left: auto;
        color: var(--q-mute);
      }
      .trio {
        display: flex;
        gap: 32px;
        align-items: center;
      }
      .sbody {
        padding: 30px 36px 28px;
        display: grid;
        justify-items: center;
        text-align: center;
        gap: 10px;
        min-height: 280px;
        align-content: center;
      }
      .sglyph {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--q-ctl);
      }
    </style>
  </head>
  <body>
    <template id="caps">
      <span class="caps"
        ><span>
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 5h10" stroke="currentColor" />
          </svg> </span
        ><span>
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect
              x=".5"
              y=".5"
              width="9"
              height="9"
              rx="1.5"
              fill="none"
              stroke="currentColor"
            />
          </svg> </span
        ><span>
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0l10 10M10 0 0 10" stroke="currentColor" />
          </svg> </span
      ></span>
    </template>
    <main class="board">
      <!-- 1. Qt Quick gate, Windows -->
      <figure>
        <figcaption>
          qt · Qt Quick gate on Windows 11 (Theme.qml, platform "windows": 32 px
          controls, radius 4)
        </figcaption>
        <div class="shot" data-shot="quick-gate">
          <div
            class="win windows"
            style="
              width: 760px;
              height: 500px;
              border-radius: 8px;
              display: grid;
              grid-template-rows: 36px 1fr;
            "
          >
            <div class="tb-win">
              <span
                class="k-appicon"
                data-art="tidewater"
                data-size="16"
                style="border-radius: 4px; box-shadow: none"
              ></span
              >Tidewater Studio<span class="cap-slot"></span>
            </div>
            <div style="display: grid; grid-template-columns: 290px 1fr">
              <div
                class="art"
                style="margin: 14px 0 14px 14px; border-radius: 8px"
              ></div>
              <div
                style="
                  display: grid;
                  align-content: center;
                  padding: 0 52px;
                  gap: 20px;
                "
              >
                <div
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="56"
                  style="border-radius: 12px"
                ></div>
                <div style="display: grid; gap: 4px">
                  <h1 class="qt-title">Welcome to Tidewater Studio</h1>
                  <span class="qt-mute" style="font-size: 12px"
                    >by Harbor Audio</span
                  >
                  <p class="qt-mute" style="margin: 6px 0 0">
                    Sign in or add your license to start.
                  </p>
                </div>
                <div style="display: grid; gap: 8px; max-width: 300px">
                  <span class="qb primary">Sign in</span>
                  <span class="qb">Use a license key</span>
                </div>
                <div
                  class="qt-mute"
                  style="display: flex; gap: 20px; font-size: 13px"
                >
                  <span>Start a 14-day trial</span><span>Activate offline</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <!-- 2. Qt Quick activate, Linux (KDE Plasma frame) -->
      <figure>
        <figcaption>
          qt · Qt Quick activate on Linux (KDE Breeze frame; platform "gnome":
          34 px, radius 8)
        </figcaption>
        <div class="shot" data-shot="quick-activate">
          <div class="win gnome" style="width: 560px; border-radius: 10px">
            <div class="tb-kde">
              <span
                class="ico k-appicon"
                data-art="tidewater"
                data-size="16"
                style="border-radius: 4px; box-shadow: none"
              ></span
              >Add your license — Tidewater Studio
              <span class="btns"
                ><i data-icon="chevronDown" data-size="12"></i
                ><i
                  class="x"
                  data-icon="x"
                  data-size="12"
                  style="color: #fff"
                ></i
              ></span>
            </div>
            <div style="padding: 26px 32px 28px; display: grid; gap: 18px">
              <div
                style="
                  display: flex;
                  gap: 10px;
                  align-items: center;
                  font-weight: 500;
                "
              >
                <span
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="28"
                  style="border-radius: 7px"
                ></span
                >Tidewater Studio
                <span class="qt-mute" style="font-weight: 400">· Pro</span>
              </div>
              <div style="display: grid; gap: 4px">
                <h1 class="qt-title" style="font-size: 22px; line-height: 28px">
                  Add your license
                </h1>
                <p class="qt-mute" style="margin: 0">
                  Your key is in the purchase email from Harbor Audio.
                </p>
              </div>
              <div>
                <span class="qt-label">License key</span>
                <div class="qfield">
                  <span class="mono"
                    ><span class="k-key"
                      ><span>pkey_tidewater_7Q2MXK9RV4TC8HJN</span
                      ><span>3WPLDA</span></span
                    ></span
                  >
                </div>
                <div class="k-verdict" style="font-size: 13px; margin-top: 8px">
                  <span data-icon="checkCircle" data-size="15"></span>
                  <span
                    ><b style="font-weight: 600; color: var(--q-text)"
                      >Tidewater Studio Pro</b
                    >&#8201;·&#8201;Lifetime&#8201;·&#8201;3 devices</span
                  >
                </div>
              </div>
              <div
                style="
                  display: flex;
                  gap: 8px;
                  justify-content: flex-end;
                  margin-top: 4px;
                "
              >
                <span class="qb">Cancel</span
                ><span class="qb primary">Activate</span>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <!-- 3. QWidget parts -->
      <figure>
        <figcaption>
          qt · QWidget parts from the generated QSS (object names; the accent in
          @pk-*@)
        </figcaption>
        <div class="shot" data-shot="widgets">
          <div class="win mac" style="border-radius: 12px">
            <div class="tb-mac"><i></i><i></i><i></i></div>
            <div class="parts">
              <div>
                <h3>QFrame#pkCard · QLabel#pkTitle · #pkBody · #pkMeta</h3>
                <div class="w-card">
                  <span style="font: 600 22px/28px var(--pk-font-sans)"
                    >Tidewater Studio Pro</span
                  >
                  <span>Lifetime license, 3 devices.</span>
                  <span class="qt-mute" style="font-size: 12px"
                    >mara@fennick.studio</span
                  >
                </div>
              </div>
              <div>
                <h3>QLabel#pkCode (the kit mono)</h3>
                <div class="w-card" style="justify-items: start">
                  <span
                    style="
                      font: 600 28px/34px var(--pk-font-mono);
                      letter-spacing: 0.06em;
                    "
                    >WDJB-MJHT</span
                  >
                  <span class="qt-mute" style="font-size: 12px"
                    >Code expires in 9:12</span
                  >
                </div>
              </div>
              <div>
                <h3>QPushButton · #pkPrimary · #pkDanger · #pkLink</h3>
                <div
                  style="
                    display: flex;
                    flex-wrap: wrap;
                    gap: 8px;
                    align-items: center;
                  "
                >
                  <span class="w-btn primary">Activate</span
                  ><span class="w-btn">Cancel</span
                  ><span class="w-btn danger">Remove</span
                  ><span class="w-btn link">Where is my key?</span>
                </div>
              </div>
              <div>
                <h3>:focus · :disabled</h3>
                <div style="display: flex; gap: 8px">
                  <span class="w-btn primary focus">Activate</span
                  ><span class="w-btn disabled">Continue</span>
                </div>
              </div>
              <div>
                <h3>QLineEdit#pkKey (:focus)</h3>
                <div class="w-edit focus">pkey_tidewater_7Q2MXK9RV4…</div>
              </div>
              <div>
                <h3>QProgressBar</h3>
                <div style="display: grid; gap: 8px; padding-top: 6px">
                  <div class="w-prog"><i></i></div>
                  <span class="qt-mute" style="font-size: 12px"
                    >38 of 61 MB · about 20 s left</span
                  >
                </div>
              </div>
              <div style="grid-column: 1 / -1">
                <h3>QListView (selected row: the accent's subtle)</h3>
                <div class="w-list">
                  <div class="sel">
                    <span data-icon="laptop" data-size="16"></span>Work
                    laptop<small>last used 41 days ago</small>
                  </div>
                  <div>
                    <span data-icon="tablet" data-size="16"></span>Mara’s
                    iPad<small>yesterday</small>
                  </div>
                  <div>
                    <span data-icon="laptop" data-size="16"></span>MacBook
                    Pro<small>today</small>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <!-- 4. Boot, status, error (Qt Quick, Windows) -->
      <figure>
        <figcaption>
          qt · boot, status (blocked) and error (offline), Qt Quick on Windows
        </figcaption>
        <div class="shot" data-shot="states">
          <div class="trio">
            <div class="win windows" style="width: 420px; border-radius: 8px">
              <div class="tb-win">
                <span
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="16"
                  style="border-radius: 4px; box-shadow: none"
                ></span
                >Tidewater Studio<span class="cap-slot"></span>
              </div>
              <div class="sbody">
                <div
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="72"
                  style="border-radius: 16px"
                ></div>
                <div class="k-progress" style="width: 160px; margin-top: 18px">
                  <i style="width: 45%"></i>
                </div>
                <span class="qt-mute" style="font-size: 12px"
                  >Checking your license</span
                >
              </div>
            </div>
            <div class="win windows" style="width: 420px; border-radius: 8px">
              <div class="tb-win">
                <span
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="16"
                  style="border-radius: 4px; box-shadow: none"
                ></span
                >Tidewater Studio<span class="cap-slot"></span>
              </div>
              <div class="sbody">
                <div
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="52"
                  style="border-radius: 12px"
                ></div>
                <h1
                  class="qt-title"
                  style="font-size: 20px; line-height: 28px; margin-top: 8px"
                >
                  Your license has ended
                </h1>
                <p class="qt-mute" style="margin: 0">
                  Tidewater Studio Pro ended on 30 September. Renew to keep
                  working on your sessions.
                </p>
                <div
                  style="
                    display: flex;
                    gap: 8px;
                    justify-content: flex-end;
                    width: 100%;
                    margin-top: 16px;
                  "
                >
                  <span class="qb">Use a different key</span
                  ><span class="qb primary">Renew</span>
                </div>
              </div>
            </div>
            <div class="win windows" style="width: 420px; border-radius: 8px">
              <div class="tb-win">
                <span
                  class="k-appicon"
                  data-art="tidewater"
                  data-size="16"
                  style="border-radius: 4px; box-shadow: none"
                ></span
                >Tidewater Studio<span class="cap-slot"></span>
              </div>
              <div class="sbody">
                <div class="sglyph" data-icon="wifiOff" data-size="22"></div>
                <h1
                  class="qt-title"
                  style="font-size: 20px; line-height: 28px; margin-top: 8px"
                >
                  Can’t reach Harbor Audio
                </h1>
                <p class="qt-mute" style="margin: 0">
                  Check your connection. You can keep working offline for 3 more
                  days.
                </p>
                <div
                  style="
                    display: flex;
                    gap: 8px;
                    justify-content: flex-end;
                    width: 100%;
                    margin-top: 16px;
                  "
                >
                  <span class="qb">Continue offline</span
                  ><span class="qb primary">Try again</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </figure>
    </main>
    <script>
      document
        .querySelectorAll(".cap-slot")
        .forEach((s) =>
          s.replaceWith(
            document.getElementById("caps").content.cloneNode(true),
          ),
        );
      const artSvg = `<svg width="100%" height="100%" viewBox="0 0 300 460" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="460" fill="#0b3a48"/><circle cx="210" cy="110" r="30" fill="#f5d38a"/>${[
        0, 1, 2, 3,
      ]
        .map((i) => {
          const y = 260 + i * 46;
          let d = `M-20 ${y}`;
          for (let x = -20; x <= 320; x += 60) d += ` q15 -16 30 0 t30 0`;
          return `<path d="${d}" stroke="${["#5fe3cf", "#8eeedd", "#bff5ea", "#5fe3cf"][i]}" stroke-width="9" fill="none" stroke-linecap="round" opacity="${(0.95 - i * 0.15).toFixed(2)}"/>`;
        })
        .join("")}</svg>`;
      document.querySelectorAll(".art").forEach((a) => (a.innerHTML = artSvg));
    </script>
  </body>
</html>
