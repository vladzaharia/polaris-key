<pre tabindex="0" class="term-body"><span class="c-prompt">❯</span> pkey help
<span class="c-b">pkey</span><span class="c-dim"> · Polaris Key from the command line</span>                                   <span class="c-dim">0.9.0</span>

<span class="c-dim">Usage</span>  pkey &lt;command&gt; [options]
<span class="c-dim">Here </span>  DJDL (djdl) <span class="c-dim">from .pkey/product · key.plrs.im</span>

<span class="c-b">Start</span>
  init                         Scaffold .pkey/ in this folder
  validate [--fix]             Check .pkey/; --fix repairs what it safely can
  doctor                       Manifest, keys, and Verified for each feature
  sdk add &lt;sdk&gt;                Add an SDK, write polaris-key.json and pin keys
  login|logout                 Sign in with your Polaris Key account

<span class="c-b">Manifest</span>
  manifest schemas             Write the .pkey/ JSON Schemas for editors
  mirror                       Write typed catalog mirrors for each language

<span class="c-b">Releases from CI</span>
  auth github-oidc             Exchange the job's OIDC token for a CI token
  release publish              Publish an app or pack release from a build
  release promote              Move a release to a release track
  release pin|unpin            Hold a release track on one release, or free it
  release yank                 Withdraw a release
  release keys init            Create the release key; --sparkle for Sparkle
  release delegate|revoke      Let a content key sign packs, or take it back
  release content-stamp        Write the pkey-content.json a build embeds

<span class="c-b">Channels</span>
  distribution rollout         Start or change a rollout on a channel
  distribution pause|resume    Pause or resume that rollout
  distribution halt|complete   Halt that rollout, or finish it at 100%
  distribution report          Report a store's availability or submission
  channel add &lt;channel&gt;        Declare a channel in .pkey/distribution
  channel sync                 Run every declared channel's CI and PR steps
  channel pr &lt;channel&gt;         Open the winget, Homebrew, Scoop or Flathub PR
  channel push itch            Push a build to itch.io with butler
  channel upload snap          Upload a snap to the release tracks it declares

<span class="c-b">Packages and packs</span>
  feeds setup                  Print the setup for one package feed
  feeds prune                  Remove dev builds a stable release replaced
  transport &lt;store&gt; …          Package a pack for a store's own delivery
  bundle                       Make an offline bundle for an air-gapped device

<span class="c-b">Listing</span>
  listing assets               Derive every store's icons, art and screenshots
  assets push                  Host a file in a listing or presentation slot

<span class="c-b">Shell</span>
  completion bash|zsh|fish     Print a shell completion script
  help [command]               This help, or one command's

<span class="c-b">Options</span>
  --product &lt;slug&gt;             Default: from .pkey/product
  --base-url &lt;url&gt;             Default: $PKEY_BASE_URL or https://key.plrs.im
  --json                       JSON for scripts, on every command
  --no-color, --ascii          Plain text, or ASCII symbols only
  -h, --help                   Help for a command

<span class="c-dim">Every command and flag: key.plrs.im/docs/reference/cli</span>
<span class="c-prompt">❯</span> <span class="cursor"></span></pre>

<pre tabindex="0" class="term-body"><span class="c-prompt">❯</span> pkey help sdk add
<span class="c-b">pkey sdk add</span><span class="c-dim"> · Add an SDK to an app and pin the product&#x27;s keys</span>

<span class="c-dim">Usage</span>  pkey sdk add &lt;sdk&gt; [--expect &lt;kid&gt;@sha256:&lt;hex&gt;]
                         [--dir &lt;path&gt;] [--product &lt;slug&gt;]
                         [--dry-run] [--json]

<span class="c-b">Arguments</span>
  &lt;sdk&gt;             node, react, python, swift, kotlin or godot

<span class="c-b">Options</span>
  --expect &lt;fp&gt;     Required the first time in a folder: the
                    fingerprint Integration shows.
  --dir &lt;path&gt;      The app&#x27;s folder. Default: this folder
  --product &lt;slug&gt;  Default: from .pkey/product
  --dry-run         Show what would change and write nothing

<span class="c-b">What it does</span><span class="c-dim">, for swift in macos/</span>
  1  Adds PolarisKey from pkg.plrs.im to DJDL.xcodeproj
  2  Writes macos/polaris-key.json for djdl on key.plrs.im
  3  Pins djdl-2026, the staged djdl-2026b and the release key
     djdl-rk-2026

<span class="c-b">Examples</span>
  pkey sdk add swift --dir macos/ \
      --expect <span class="c-accent">djdl-2026@sha256:3f9a0c…e41b</span>
  pkey sdk add kotlin --dir windows/ \
      --expect <span class="c-accent">djdl-2026@sha256:3f9a0c…e41b</span>

<span class="c-dim">See also  pkey doctor · key.plrs.im/docs/start/first-product</span></pre>
