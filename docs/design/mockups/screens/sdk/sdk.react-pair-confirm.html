<style>
  /* sdk.react-pair-confirm: DJDL's accent, from its icon (coral between the brand's orange and rose), as sdk.react-activate. */
  [data-screen="sdk.react-pair-confirm"] {
    --kit-accent: color-mix(
      in oklab,
      var(--pk-service-update) 45%,
      var(--pk-brand-rose)
    );
    --kit-accent-on: var(--pk-text-on-accent);
    --kit-accent-subtle: color-mix(
      in oklab,
      var(--kit-accent) 13%,
      var(--pk-surface-raised)
    );
  }
  /* Light: the same coral one step deeper, so its label and its links read at 4.5:1 on white. */
  [data-theme="light"] [data-screen="sdk.react-pair-confirm"] {
    --kit-accent: color-mix(
      in oklab,
      color-mix(in oklab, var(--pk-service-update) 45%, var(--pk-brand-rose))
        78%,
      var(--pk-brand-text)
    );
  }
  /* Frames backfill a hole a two-column frame leaves (desktop and tablet). */
  [data-screen="sdk.react-pair-confirm"] .frame-grid.windows {
    grid-auto-flow: row dense;
  }
  /* The primary in an inline panel keeps the product's fill (the panel only quiets its secondaries). */
  [data-screen="sdk.react-pair-confirm"] .kit-confirm .kit-btn.primary {
    background: var(--kit-accent);
  }
  /* A quiet link inside a notice: its own line under the words. */
  [data-screen="sdk.react-pair-confirm"] .kit-state > span > .kit-link {
    display: flex;
    width: fit-content;
  }
  /* The code: the kit's code face (40/48, weight 500, 0.12em), centred and tabular, the largest thing on the screen. */
  [data-screen="sdk.react-pair-confirm"] .kit-code.pair {
    justify-content: center;
  }
  [data-screen="sdk.react-pair-confirm"] .kit-code.pair > b {
    flex: none;
    font: var(--pk-kit-type-code-weight) var(--pk-kit-type-code-size) /
      var(--pk-kit-type-code-line-height) var(--pk-kit-type-code-family);
    letter-spacing: var(--pk-kit-type-code-tracking);
    font-variant-numeric: tabular-nums;
  }
  /* The digits that just changed, lit for a moment after a new code (the first two never change). */
  [data-screen="sdk.react-pair-confirm"] .kit-code.pair .chg {
    border-radius: 4px;
    background: var(--kit-accent-subtle);
    box-shadow: 0 0 0 3px var(--kit-accent-subtle);
  }
  [data-screen="sdk.react-pair-confirm"] .kit-count.center {
    justify-content: center;
  }
  /* Time left: a 20px ring with a 2px stroke (UI-KITS 4.4), the figures tabular. */
  [data-screen="sdk.react-pair-confirm"] .kit-ring.stroke {
    width: 20px;
    height: 20px;
    background: conic-gradient(
      var(--kit-accent) 0 var(--left),
      var(--mk-line) var(--left) 100%
    );
    -webkit-mask: radial-gradient(
      farthest-side,
      transparent calc(100% - 2px),
      var(--pk-text-strong) calc(100% - 2px)
    );
    mask: radial-gradient(
      farthest-side,
      transparent calc(100% - 2px),
      var(--pk-text-strong) calc(100% - 2px)
    );
  }
  [data-screen="sdk.react-pair-confirm"] .kit-ring.r97 {
    --left: 97%;
  }
  [data-screen="sdk.react-pair-confirm"] .kit-ring.r70 {
    --left: 70%;
  }
  [data-screen="sdk.react-pair-confirm"] .kit-ring.r55 {
    --left: 55%;
  }
  [data-screen="sdk.react-pair-confirm"] .kit-ring.r100 {
    --left: 100%;
  }
  /* The QR: large enough to scan from a phone held at arm's length. */
  [data-screen="sdk.react-pair-confirm"] .qr.pair {
    width: 184px;
    height: 184px;
  }
  [data-screen="sdk.react-pair-confirm"] .pair-qr {
    display: flex;
    justify-content: center;
  }
  [data-screen="sdk.react-pair-confirm"] .pair-two {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: center;
  }
  /* Two panes from 600px of window (536px of form): code beside QR, centred on each other. */
  @container (min-width: 536px) {
    [data-screen="sdk.react-pair-confirm"] .pair-two {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "code qr" "rest .";
    }
    [data-screen="sdk.react-pair-confirm"] .pair-two > .pair-code {
      grid-area: code;
    }
    [data-screen="sdk.react-pair-confirm"] .pair-two > .pair-qr {
      grid-area: qr;
    }
    [data-screen="sdk.react-pair-confirm"] .pair-two > .pair-rest {
      grid-area: rest;
    }
  }
  [data-screen="sdk.react-pair-confirm"] .kit-host.plain > .kit-form.wide {
    max-width: 880px;
  }
  /* The code field: the shown code's face and size, so the two devices read alike. */
  [data-screen="sdk.react-pair-confirm"] .kit-input.pair-code {
    min-height: 72px;
    font: var(--pk-kit-type-code-weight) var(--pk-kit-type-code-size) /
      var(--pk-kit-type-code-line-height) var(--pk-kit-type-code-family);
    letter-spacing: var(--pk-kit-type-code-tracking);
    font-variant-numeric: tabular-nums;
  }
  [data-screen="sdk.react-pair-confirm"] .kit-input .caret {
    display: inline-block;
    width: 2px;
    height: 36px;
    vertical-align: -6px;
    background: var(--pk-text-strong);
  }
  /* A device name is words, not a key: the kit's body face. */
  [data-screen="sdk.react-pair-confirm"] .kit-input.name {
    font-family: var(--pk-kit-type-body-family);
  }
</style>
