<style>
  /* sdk.swiftui-sign-in: Diceroll's accent, from its icon's red die (toward rose, so it never reads as an error). */
  [data-screen="sdk.swiftui-sign-in"] {
    --kit-accent: color-mix(in oklab, var(--pk-danger) 68%, var(--pk-brand-rose));
    --kit-accent-on: var(--pk-text-on-accent);
    --kit-accent-subtle: color-mix(in oklab, var(--kit-accent) 14%, var(--pk-surface-raised));
  }
  /* One order at every size: the four phones, the landscape frame, then the code. At wide the
     landscape frame and the code share the last row (two cells each). */
  @container screen (min-width: 1600px) {
    [data-screen="sdk.swiftui-sign-in"] .code-cell {
      grid-column: span 2;
    }
  }
  [data-screen="sdk.swiftui-sign-in"] .code-cell {
    align-self: stretch;
  }
  [data-screen="sdk.swiftui-sign-in"] .code-cell > .code {
    flex: 1;
  }
  /* Five device rows fit above the sheet. */
</style>
