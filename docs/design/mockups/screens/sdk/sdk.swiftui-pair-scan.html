<style>
  /* sdk.swiftui-pair-scan: Diceroll's accent, from its icon's red die (toward rose, so it never reads as an error), as sdk.swiftui-activate. */
  [data-screen="sdk.swiftui-pair-scan"] {
    --kit-accent: color-mix(
      in oklab,
      var(--pk-danger) 68%,
      var(--pk-brand-rose)
    );
    --kit-accent-on: var(--pk-text-on-accent);
    --kit-accent-subtle: color-mix(
      in oklab,
      var(--kit-accent) 14%,
      var(--pk-surface-raised)
    );
  }
  /* Frames backfill a hole a two-column frame leaves (desktop and tablet). */
  [data-screen="sdk.swiftui-pair-scan"] .frame-grid.windows {
    grid-auto-flow: row dense;
  }
  /* The primary in an inline panel keeps the product's fill (the panel only quiets its secondaries). */
  [data-screen="sdk.swiftui-pair-scan"] .kit-confirm .kit-btn.primary {
    background: var(--kit-accent);
  }
  /* A quiet link inside a notice: its own line under the words. */
  [data-screen="sdk.swiftui-pair-scan"] .kit-state > span > .kit-link {
    display: flex;
    width: fit-content;
  }
  /* The code: the kit's code face (40/48, weight 500, 0.12em), centred and tabular, the largest thing on the screen. */
  [data-screen="sdk.swiftui-pair-scan"] .kit-code.pair {
    justify-content: center;
  }
  [data-screen="sdk.swiftui-pair-scan"] .kit-code.pair > b {
    flex: none;
    font: var(--pk-kit-type-code-weight) var(--pk-kit-type-code-size) /
      var(--pk-kit-type-code-line-height) var(--pk-kit-type-code-family);
    letter-spacing: var(--pk-kit-type-code-tracking);
    font-variant-numeric: tabular-nums;
  }
  /* The digits that just changed, lit for a moment after a new code (the first two never change). */
  [data-screen="sdk.swiftui-pair-scan"] .kit-code.pair .chg {
    border-radius: 4px;
    background: var(--kit-accent-subtle);
    box-shadow: 0 0 0 3px var(--kit-accent-subtle);
  }
  [data-screen="sdk.swiftui-pair-scan"] .kit-count.center {
    justify-content: center;
  }
  /* Time left: a 20px ring with a 2px stroke (UI-KITS 4.4), the figures tabular. */
  [data-screen="sdk.swiftui-pair-scan"] .kit-ring.stroke {
    width: 20px;
    height: 20px;
    background: conic-gradient(
      var(--kit-accent) 0 var(--left),
      var(--mk-line) var(--left) 100%
    );
    -webkit-mask: radial-gradient(
      farthest-side,
      transparent calc(100% - 2px),
      var(--pk-text-strong) calc(100% - 2px)
    );
    mask: radial-gradient(
      farthest-side,
      transparent calc(100% - 2px),
      var(--pk-text-strong) calc(100% - 2px)
    );
  }
  [data-screen="sdk.swiftui-pair-scan"] .kit-ring.r97 {
    --left: 97%;
  }
  [data-screen="sdk.swiftui-pair-scan"] .kit-ring.r70 {
    --left: 70%;
  }
  [data-screen="sdk.swiftui-pair-scan"] .kit-ring.r55 {
    --left: 55%;
  }
  [data-screen="sdk.swiftui-pair-scan"] .kit-ring.r100 {
    --left: 100%;
  }
  /* The QR: large enough to scan from a phone held at arm's length. */
  [data-screen="sdk.swiftui-pair-scan"] .qr.pair {
    width: 184px;
    height: 184px;
  }
  [data-screen="sdk.swiftui-pair-scan"] .pair-qr {
    display: flex;
    justify-content: center;
  }
  [data-screen="sdk.swiftui-pair-scan"] .pair-two {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: center;
  }
  /* Two panes from 600px of window (536px of form): code beside QR, centred on each other. */
  @container (min-width: 536px) {
    [data-screen="sdk.swiftui-pair-scan"] .pair-two {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "code qr" "rest .";
    }
    [data-screen="sdk.swiftui-pair-scan"] .pair-two > .pair-code {
      grid-area: code;
    }
    [data-screen="sdk.swiftui-pair-scan"] .pair-two > .pair-qr {
      grid-area: qr;
    }
    [data-screen="sdk.swiftui-pair-scan"] .pair-two > .pair-rest {
      grid-area: rest;
    }
  }
  [data-screen="sdk.swiftui-pair-scan"] .kit-host.plain > .kit-form.wide {
    max-width: 880px;
  }
  /* The code field: the shown code's face and size, so the two devices read alike. */
  [data-screen="sdk.swiftui-pair-scan"] .kit-input.pair-code {
    min-height: 72px;
    font: var(--pk-kit-type-code-weight) var(--pk-kit-type-code-size) /
      var(--pk-kit-type-code-line-height) var(--pk-kit-type-code-family);
    letter-spacing: var(--pk-kit-type-code-tracking);
    font-variant-numeric: tabular-nums;
  }
  [data-screen="sdk.swiftui-pair-scan"] .kit-input .caret {
    display: inline-block;
    width: 2px;
    height: 36px;
    vertical-align: -6px;
    background: var(--pk-text-strong);
  }
  /* A device name is words, not a key: the kit's body face. */
  [data-screen="sdk.swiftui-pair-scan"] .kit-input.name {
    font-family: var(--pk-kit-type-body-family);
  }
  /* The camera view: dark in both themes, the other device's QR tilted in it, a viewfinder's corners. */
  [data-screen="sdk.swiftui-pair-scan"] .pair-cam {
    --cam-ground: var(--pk-brand-text);
    --cam-ink: var(--pk-brand-page);
    position: relative;
    display: grid;
    place-items: center;
    aspect-ratio: 1;
    border-radius: var(--pk-kit-radius-group);
    overflow: hidden;
    background: var(--cam-ground);
  }
  [data-theme="dark"] [data-screen="sdk.swiftui-pair-scan"] .pair-cam {
    --cam-ground: var(--pk-brand-page);
    --cam-ink: var(--pk-brand-text);
  }
  [data-screen="sdk.swiftui-pair-scan"] .pair-cam > .qr.pair-seen {
    width: 46%;
    height: auto;
    aspect-ratio: 1;
    transform: rotate(-6deg) skewX(3deg);
  }
  [data-screen="sdk.swiftui-pair-scan"] .pair-frame {
    position: absolute;
    inset: 18%;
    --c: var(--cam-ink);
    background:
      linear-gradient(var(--c), var(--c)) top left / 28px 3px no-repeat,
      linear-gradient(var(--c), var(--c)) top left / 3px 28px no-repeat,
      linear-gradient(var(--c), var(--c)) top right / 28px 3px no-repeat,
      linear-gradient(var(--c), var(--c)) top right / 3px 28px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / 28px 3px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / 3px 28px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / 28px 3px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / 3px 28px no-repeat;
  }
  /* Camera off: the message sits in the view, the corners still mark where the code goes. */
  [data-screen="sdk.swiftui-pair-scan"] .pair-cam > .kit-state {
    position: relative;
    z-index: 1;
    width: 78%;
  }
  /* iOS: every text link is a 44pt target. */
  [data-screen="sdk.swiftui-pair-scan"] [data-pk-platform="ios"] .kit-link {
    justify-content: center;
    min-height: 44px;
  }
  /* The answers card takes one phone cell, two beside the last phone at desktop. */
  [data-screen="sdk.swiftui-pair-scan"] .frame-grid.devices > .p8 {
    grid-column: auto;
  }
  @container screen (min-width: 1280px) and (max-width: 1599px) {
    [data-screen="sdk.swiftui-pair-scan"] .frame-grid.devices > .p8 {
      grid-column: span 2;
    }
  }
</style>
