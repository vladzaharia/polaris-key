<style>
  /* sdk.react-pair-off: DJDL's accent, from its icon (coral between the brand's orange and rose), as sdk.react-activate. */
  [data-screen="sdk.react-pair-off"] {
    --kit-accent: color-mix(
      in oklab,
      var(--pk-service-update) 45%,
      var(--pk-brand-rose)
    );
    --kit-accent-on: var(--pk-text-on-accent);
    --kit-accent-subtle: color-mix(
      in oklab,
      var(--kit-accent) 13%,
      var(--pk-surface-raised)
    );
  }
  /* Light: the same coral one step deeper, so its label and its links read at 4.5:1 on white. */
  [data-theme="light"] [data-screen="sdk.react-pair-off"] {
    --kit-accent: color-mix(
      in oklab,
      color-mix(in oklab, var(--pk-service-update) 45%, var(--pk-brand-rose))
        78%,
      var(--pk-brand-text)
    );
  }
  /* Frames backfill a hole a two-column frame leaves (desktop and tablet). */
  [data-screen="sdk.react-pair-off"] .frame-grid.windows {
    grid-auto-flow: row dense;
  }
  /* The primary in an inline panel keeps the product's fill (the panel only quiets its secondaries). */
  [data-screen="sdk.react-pair-off"] .kit-confirm .kit-btn.primary {
    background: var(--kit-accent);
  }
  /* A quiet link inside a notice: its own line under the words. */
  [data-screen="sdk.react-pair-off"] .kit-state > span > .kit-link {
    display: flex;
    width: fit-content;
  }
  /* A paired device's row: the name over when it was last seen (one line each), then its menu; the
     Can connect switch sits before the menu only when more than 8 are paired or one is off. */
  [data-screen="sdk.react-pair-off"] .kit-device.pr {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  [data-screen="sdk.react-pair-off"] .pr-text > :is(b, small) {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  [data-screen="sdk.react-pair-off"] .pr-end > .kit-btn {
    width: 40px;
  }
  /* The switch: a 44 x 24 target around the 36 x 20 track. */
  [data-screen="sdk.react-pair-off"] .pr-switch {
    display: inline-grid;
    place-items: center;
    width: 44px;
    height: 24px;
  }
  /* Quiet switches: on is a tint with the knob in the product's colour, so a list of them never
     outweighs the one primary. Off is the kit's sunken track. */
  [data-screen="sdk.react-pair-off"] .kit-host .switch.on {
    border-color: color-mix(in oklab, var(--kit-accent) 55%, transparent);
    background: var(--kit-accent-subtle);
  }
  [data-screen="sdk.react-pair-off"] .kit-host .switch.on::after {
    background: var(--kit-accent);
  }
  /* The column label, its end on the switches' end. */
  [data-screen="sdk.react-pair-off"] .kit-device.pr-head {
    min-height: 0;
    font: var(--pk-kit-type-footnote-weight) var(--pk-kit-type-footnote-size) /
      var(--pk-kit-type-footnote-line-height) var(--pk-kit-type-footnote-family);
    color: var(--pk-text-subtle);
  }
  [data-screen="sdk.react-pair-off"] .pr-head .pr-col {
    white-space: nowrap;
  }
  [data-screen="sdk.react-pair-off"] .pr-head .pr-menu {
    width: 40px;
  }
  /* Under 480px of window the label goes; the switch keeps its accessible name. */
  [data-screen="sdk.react-pair-off"] .kit-host {
    container-name: pk-window;
  }
  @container pk-window (max-width: 479px) {
    [data-screen="sdk.react-pair-off"] .kit-device.pr-head {
      display: none;
    }
  }
  /* A row being renamed or forgotten: the field or the question, then its buttons, in the row. */
  [data-screen="sdk.react-pair-off"] .kit-device.pr.editing {
    grid-template-columns: minmax(0, 1fr);
  }
  /* The code field: the shown code's face and size, so the two devices read alike. */
  [data-screen="sdk.react-pair-off"] .kit-input.pair-code {
    min-height: 72px;
    font: var(--pk-kit-type-code-weight) var(--pk-kit-type-code-size) /
      var(--pk-kit-type-code-line-height) var(--pk-kit-type-code-family);
    letter-spacing: var(--pk-kit-type-code-tracking);
    font-variant-numeric: tabular-nums;
  }
  [data-screen="sdk.react-pair-off"] .kit-input .caret {
    display: inline-block;
    width: 2px;
    height: 36px;
    vertical-align: -6px;
    background: var(--pk-text-strong);
  }
  /* A device name is words, not a key: the kit's body face. */
  [data-screen="sdk.react-pair-off"] .kit-input.name {
    font-family: var(--pk-kit-type-body-family);
  }
  /* Desktop and tablet: the list beside the two short windows stacked. */
  @container screen (max-width: 1599px) {
    [data-screen="sdk.react-pair-off"] .frame-grid.windows > .o1 {
      grid-row: span 2;
    }
  }
  @container screen (max-width: 639px) {
    [data-screen="sdk.react-pair-off"] .frame-grid.windows > .o1 {
      grid-row: auto;
    }
  }
</style>
