<style>
  /* sdk.react-pair-show: DJDL's accent, from its icon (coral between the brand's orange and rose), as sdk.react-activate. */
  [data-screen="sdk.react-pair-show"] {
    --kit-accent: color-mix(
      in oklab,
      var(--pk-service-update) 45%,
      var(--pk-brand-rose)
    );
    --kit-accent-on: var(--pk-text-on-accent);
    --kit-accent-subtle: color-mix(
      in oklab,
      var(--kit-accent) 13%,
      var(--pk-surface-raised)
    );
  }
  /* Light: the same coral one step deeper, so its label and its links read at 4.5:1 on white. */
  [data-theme="light"] [data-screen="sdk.react-pair-show"] {
    --kit-accent: color-mix(
      in oklab,
      color-mix(in oklab, var(--pk-service-update) 45%, var(--pk-brand-rose))
        78%,
      var(--pk-brand-text)
    );
  }
  /* Frames backfill a hole a two-column frame leaves (desktop and tablet). */
  [data-screen="sdk.react-pair-show"] .frame-grid.windows {
    grid-auto-flow: row dense;
  }
  /* The primary in an inline panel keeps the product's fill (the panel only quiets its secondaries). */
  [data-screen="sdk.react-pair-show"] .kit-confirm .kit-btn.primary {
    background: var(--kit-accent);
  }
  /* A quiet link inside a notice: its own line under the words. */
  [data-screen="sdk.react-pair-show"] .kit-state > span > .kit-link {
    display: flex;
    width: fit-content;
  }
  /* The code: the kit's code face (40/48, weight 500, 0.12em), centred and tabular, the largest thing on the screen. */
  [data-screen="sdk.react-pair-show"] .kit-code.pair {
    justify-content: center;
  }
  [data-screen="sdk.react-pair-show"] .kit-code.pair > b {
    flex: none;
    font: var(--pk-kit-type-code-weight) var(--pk-kit-type-code-size) /
      var(--pk-kit-type-code-line-height) var(--pk-kit-type-code-family);
    letter-spacing: var(--pk-kit-type-code-tracking);
    font-variant-numeric: tabular-nums;
  }
  /* The digits that just changed, lit for a moment after a new code (the first two never change). */
  [data-screen="sdk.react-pair-show"] .kit-code.pair .chg {
    border-radius: 4px;
    background: var(--kit-accent-subtle);
    box-shadow: 0 0 0 3px var(--kit-accent-subtle);
  }
  [data-screen="sdk.react-pair-show"] .kit-count.center {
    justify-content: center;
  }
  /* Time left: a 20px ring with a 2px stroke (UI-KITS 4.4), the figures tabular. */
  [data-screen="sdk.react-pair-show"] .kit-ring.stroke {
    width: 20px;
    height: 20px;
    background: conic-gradient(
      var(--kit-accent) 0 var(--left),
      var(--mk-line) var(--left) 100%
    );
    -webkit-mask: radial-gradient(
      farthest-side,
      transparent calc(100% - 2px),
      var(--pk-text-strong) calc(100% - 2px)
    );
    mask: radial-gradient(
      farthest-side,
      transparent calc(100% - 2px),
      var(--pk-text-strong) calc(100% - 2px)
    );
  }
  [data-screen="sdk.react-pair-show"] .kit-ring.r97 {
    --left: 97%;
  }
  [data-screen="sdk.react-pair-show"] .kit-ring.r70 {
    --left: 70%;
  }
  [data-screen="sdk.react-pair-show"] .kit-ring.r55 {
    --left: 55%;
  }
  [data-screen="sdk.react-pair-show"] .kit-ring.r100 {
    --left: 100%;
  }
  /* The QR: large enough to scan from a phone held at arm's length. */
  [data-screen="sdk.react-pair-show"] .qr.pair {
    width: 184px;
    height: 184px;
  }
  [data-screen="sdk.react-pair-show"] .pair-qr {
    display: flex;
    justify-content: center;
  }
  [data-screen="sdk.react-pair-show"] .pair-two {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: center;
  }
  /* Two panes from 600px of window (536px of form): code beside QR, centred on each other. */
  @container (min-width: 536px) {
    [data-screen="sdk.react-pair-show"] .pair-two {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "code qr" "rest .";
    }
    [data-screen="sdk.react-pair-show"] .pair-two > .pair-code {
      grid-area: code;
    }
    [data-screen="sdk.react-pair-show"] .pair-two > .pair-qr {
      grid-area: qr;
    }
    [data-screen="sdk.react-pair-show"] .pair-two > .pair-rest {
      grid-area: rest;
    }
  }
  [data-screen="sdk.react-pair-show"] .kit-host.plain > .kit-form.wide {
    max-width: 880px;
  }
  /* A short window (720 x 420: a laptop with a title bar, a Steam Deck, a TV): the logo is the window's
     own, the QR runs beside the whole start pane, nothing scrolls. */
  [data-screen="sdk.react-pair-show"] .window.short {
    width: 720px;
    max-width: 100%;
    height: 420px;
  }
  [data-screen="sdk.react-pair-show"] .short .pair-two {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "head qr" "code qr" "rest qr";
  }
  [data-screen="sdk.react-pair-show"] .short .pair-two > .kit-head {
    grid-area: head;
  }
  [data-screen="sdk.react-pair-show"] .short .pair-two > .pair-code {
    grid-area: code;
  }
  [data-screen="sdk.react-pair-show"] .short .pair-two > .pair-qr {
    grid-area: qr;
  }
  [data-screen="sdk.react-pair-show"] .short .pair-two > .pair-rest {
    grid-area: rest;
  }
  [data-screen="sdk.react-pair-show"] .short .qr.pair {
    width: 168px;
    height: 168px;
  }
</style>
