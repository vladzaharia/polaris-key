<style>
  /* sdk.react-activate: DJDL's accent, from its icon (coral between the brand's orange and rose). */
  [data-screen="sdk.react-activate"] {
    --kit-accent: color-mix(in oklab, var(--pk-service-update) 45%, var(--pk-brand-rose));
    --kit-accent-on: var(--pk-text-on-accent);
    --kit-accent-subtle: color-mix(in oklab, var(--kit-accent) 13%, var(--pk-surface-raised));
  }
  /* Light: the same coral one step deeper, so its label and its links read at 4.5:1 on white. */
  [data-theme="light"] [data-screen="sdk.react-activate"] {
    --kit-accent: color-mix(in oklab, color-mix(in oklab, var(--pk-service-update) 45%, var(--pk-brand-rose)) 78%, #060912);
  }
  /* From 1600: three columns. 1 and 1c in the first, the errors 1b and 1d in the second, the device list
     across two rows in the third; then Other answers (1e) beside 3. */
  @container screen (min-width: 1600px) {
    [data-screen="sdk.react-activate"] .frame-grid.windows {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-flow: row;
    }
    [data-screen="sdk.react-activate"] .a1  { grid-column: 1; grid-row: 1; }
    [data-screen="sdk.react-activate"] .a1c { grid-column: 1; grid-row: 2; }
    [data-screen="sdk.react-activate"] .a3  { grid-column: 3; grid-row: 3; }
    [data-screen="sdk.react-activate"] .a1b { grid-column: 2; grid-row: 1; }
    [data-screen="sdk.react-activate"] .a1d { grid-column: 2; grid-row: 2; }
    [data-screen="sdk.react-activate"] .a1e { grid-column: 1 / span 2; grid-row: 3; }
    [data-screen="sdk.react-activate"] .a2  { grid-column: 3; grid-row: 1 / span 2; }
  }
</style>
