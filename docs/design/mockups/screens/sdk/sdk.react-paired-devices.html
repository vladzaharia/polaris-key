<style>
  /* sdk.react-paired-devices: DJDL's accent, from its icon (coral between the brand's orange and rose), as sdk.react-activate. */
  [data-screen="sdk.react-paired-devices"] {
    --kit-accent: color-mix(
      in oklab,
      var(--pk-service-update) 45%,
      var(--pk-brand-rose)
    );
    --kit-accent-on: var(--pk-text-on-accent);
    --kit-accent-subtle: color-mix(
      in oklab,
      var(--kit-accent) 13%,
      var(--pk-surface-raised)
    );
  }
  /* Light: the same coral one step deeper, so its label and its links read at 4.5:1 on white. */
  [data-theme="light"] [data-screen="sdk.react-paired-devices"] {
    --kit-accent: color-mix(
      in oklab,
      color-mix(in oklab, var(--pk-service-update) 45%, var(--pk-brand-rose))
        78%,
      var(--pk-brand-text)
    );
  }
  /* Frames backfill a hole a two-column frame leaves (desktop and tablet). */
  [data-screen="sdk.react-paired-devices"] .frame-grid.windows {
    grid-auto-flow: row dense;
  }
  /* The pairing code: a field as tall as the code it holds, digits spaced like the shown code. */
  [data-screen="sdk.react-paired-devices"] .kit-input.pair-code {
    min-height: 56px;
    font-size: 24px;
    line-height: 32px;
    letter-spacing: 0.08em;
  }
  /* A device name is words, not a key: the kit's body face. */
  [data-screen="sdk.react-paired-devices"] .kit-input.name {
    font-family: var(--pk-kit-type-body-family);
  }
  /* The primary in an inline panel keeps the product's fill (the panel only quiets its secondaries). */
  [data-screen="sdk.react-paired-devices"] .kit-confirm .kit-btn.primary {
    background: var(--kit-accent);
  }
  /* A switch in the kit is checked in the product's accent, not the page's. */
  [data-screen="sdk.react-paired-devices"] .kit-host .switch.on {
    border-color: var(--kit-accent);
    background: var(--kit-accent);
  }
  [data-screen="sdk.react-paired-devices"] .kit-host .switch.on::after {
    background: var(--kit-accent-on);
  }
  /* A paired device's row: name over last seen · Can connect · its menu. The middle column is fixed
     so the column label above the switches lines up with them. */
  [data-screen="sdk.react-paired-devices"] .kit-device.pr {
    grid-template-columns: minmax(0, 1fr) 88px 40px;
  }
  [data-screen="sdk.react-paired-devices"] .kit-device.pr > .switch {
    justify-self: center;
  }
  [data-screen="sdk.react-paired-devices"] .kit-device.pr-head {
    min-height: 0;
    font: var(--pk-kit-type-footnote-weight) var(--pk-kit-type-footnote-size) /
      var(--pk-kit-type-footnote-line-height) var(--pk-kit-type-footnote-family);
    color: var(--pk-text-subtle);
    text-align: center;
  }
</style>
