<style>
  /* sdk.react-pair-enter: DJDL's accent, from its icon (coral between the brand's orange and rose), as sdk.react-activate. */
  [data-screen="sdk.react-pair-enter"] {
    --kit-accent: color-mix(
      in oklab,
      var(--pk-service-update) 45%,
      var(--pk-brand-rose)
    );
    --kit-accent-on: var(--pk-text-on-accent);
    --kit-accent-subtle: color-mix(
      in oklab,
      var(--kit-accent) 13%,
      var(--pk-surface-raised)
    );
  }
  /* Light: the same coral one step deeper, so its label and its links read at 4.5:1 on white. */
  [data-theme="light"] [data-screen="sdk.react-pair-enter"] {
    --kit-accent: color-mix(
      in oklab,
      color-mix(in oklab, var(--pk-service-update) 45%, var(--pk-brand-rose))
        78%,
      var(--pk-brand-text)
    );
  }
  /* Frames backfill a hole a two-column frame leaves (desktop and tablet). */
  [data-screen="sdk.react-pair-enter"] .frame-grid.windows {
    grid-auto-flow: row dense;
  }
  /* The pairing code: a field as tall as the code it holds, digits spaced like the shown code. */
  [data-screen="sdk.react-pair-enter"] .kit-input.pair-code {
    min-height: 56px;
    font-size: 24px;
    line-height: 32px;
    letter-spacing: 0.08em;
  }
  /* A device name is words, not a key: the kit's body face. */
  [data-screen="sdk.react-pair-enter"] .kit-input.name {
    font-family: var(--pk-kit-type-body-family);
  }
  /* The primary in an inline panel keeps the product's fill (the panel only quiets its secondaries). */
  [data-screen="sdk.react-pair-enter"] .kit-confirm .kit-btn.primary {
    background: var(--kit-accent);
  }
  /* A switch in the kit is checked in the product's accent, not the page's. */
  [data-screen="sdk.react-pair-enter"] .kit-host .switch.on {
    border-color: var(--kit-accent);
    background: var(--kit-accent);
  }
  [data-screen="sdk.react-pair-enter"] .kit-host .switch.on::after {
    background: var(--kit-accent-on);
  }
  [data-screen="sdk.react-pair-enter"] .kit-ring.r97 {
    background: conic-gradient(
      var(--kit-accent) 0 97%,
      var(--mk-line) 97% 100%
    );
  }
  [data-screen="sdk.react-pair-enter"] .kit-ring.r70 {
    background: conic-gradient(
      var(--kit-accent) 0 70%,
      var(--mk-line) 70% 100%
    );
  }
  /* The phone frames are the SwiftUI kit with Diceroll's facts (its accent, as sdk.swiftui-activate). */
  [data-screen="sdk.react-pair-enter"] .dice {
    --kit-accent: color-mix(
      in oklab,
      var(--pk-danger) 68%,
      var(--pk-brand-rose)
    );
    --kit-accent-subtle: color-mix(
      in oklab,
      var(--kit-accent) 14%,
      var(--pk-surface-raised)
    );
  }
  /* The camera view: dark in both themes, the other device's QR tilted in it, a viewfinder's corners. */
  [data-screen="sdk.react-pair-enter"] .pair-cam {
    --cam-ground: var(--pk-brand-text);
    --cam-ink: var(--pk-brand-page);
    position: relative;
    display: grid;
    place-items: center;
    aspect-ratio: 1;
    border-radius: var(--pk-kit-radius-group);
    overflow: hidden;
    background: var(--cam-ground);
  }
  [data-theme="dark"] [data-screen="sdk.react-pair-enter"] .pair-cam {
    --cam-ground: var(--pk-brand-page);
    --cam-ink: var(--pk-brand-text);
  }
  [data-screen="sdk.react-pair-enter"] .pair-cam > .qr.pair-seen {
    width: 46%;
    height: auto;
    aspect-ratio: 1;
    transform: rotate(-6deg) skewX(3deg);
  }
  [data-screen="sdk.react-pair-enter"] .pair-frame {
    position: absolute;
    inset: 18%;
    --c: var(--cam-ink);
    background:
      linear-gradient(var(--c), var(--c)) top left / 28px 3px no-repeat,
      linear-gradient(var(--c), var(--c)) top left / 3px 28px no-repeat,
      linear-gradient(var(--c), var(--c)) top right / 28px 3px no-repeat,
      linear-gradient(var(--c), var(--c)) top right / 3px 28px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / 28px 3px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / 3px 28px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / 28px 3px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / 3px 28px no-repeat;
  }
  /* Camera off: the message sits in the view, the corners still mark where the code goes. */
  [data-screen="sdk.react-pair-enter"] .pair-cam > .kit-state {
    position: relative;
    z-index: 1;
    width: 78%;
  }
</style>
