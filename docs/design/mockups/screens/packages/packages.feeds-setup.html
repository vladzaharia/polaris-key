<style>
  /* packages.feeds-setup: the laptop run beside the CI run and the rerun from 1280px (at wide, each

  [data-screen="packages.feeds-setup"] .board-grid {
    --cols-desktop: minmax(0, 1fr) minmax(0, 1fr);

<div class="board" data-service="core">
  <div class="board-page">
    <header class="board-head">
      <h1>pkey feeds setup --write</h1>
      <p>Sets up every package manager with its own packages-only token. Never writes into a project.</p>
    </header>

    <div class="board-grid equal">
      <div class="board-col">
        <figure class="board-item">
          <figcaption><strong>On a laptop</strong>Each file is merged, never replaced: other registries in ~/.npmrc stay as they were.</figcaption>
          <div class="term cols-80 fade-x wrap-phone">
            <div class="term-bar"><span class="term-dots"><i></i><i></i><i></i></span><span class="term-title">zsh — ~/code/djdl-sources</span></div>
<pre class="term-body" tabindex="0" role="region" aria-label="Terminal output"><span class="c-prompt">❯</span> pkey feeds setup --write
<span class="c-b">Polaris Key packages</span> <span class="c-dim">· key.plrs.im</span>

To sign in, open <span class="c-accent c-u">https://key.plrs.im/device</span> and enter <span class="c-b">QFJT-7KWD</span>

          </div>
        </figure>
      </div>

      <div class="board-col">
        <figure class="board-item">
          <figcaption><strong>In CI</strong>The service token comes from the repository’s secrets.</figcaption>
          <div class="term cols-80 fade-x wrap-phone">
            <div class="term-bar"><span class="term-dots"><i></i><i></i><i></i></span><span class="term-title">GitHub Actions — djdl-plugins</span></div>
<pre class="term-body" tabindex="0" role="region" aria-label="Terminal output"><span class="c-prompt">❯</span> pkey feeds setup --print npm --token-env PKEY_TOKEN &gt;&gt; ~/.npmrc
<span class="c-dim">Printed for DJDL (polaris-key.json), using $PKEY_TOKEN: service token</span>
<span class="c-accent">pkeyci_…R8VQ</span> <span class="c-dim">“Plugin CI”. Nothing signed in, no token made.</span>
<span class="c-prompt">❯</span> cat ~/.npmrc
@djdl:registry=https://pkg.plrs.im/npm/djdl/
//pkg.plrs.im/npm/:_authToken=${PKEY_TOKEN}
<span class="c-prompt">❯</span> npm ci
added 214 packages in 6s</pre>
          </div>
        </figure>
