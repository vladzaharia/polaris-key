<div class="hosted" data-service="core">
  <div class="hosted-brand"><i class="pk-mark sm"></i>Polaris Key</div>

  <!-- PX-12, portal-direct: no app is asking, so no app header and no art beside the card (B12). -->
  <main class="hosted-card" aria-labelledby="ps-title">
    <div class="hosted-body">
      <h1 id="ps-title">Sign in to Polaris Key</h1>
      <div class="field">
        <label class="field-label" for="ps-email">Email</label>
        <div class="input focus" id="ps-email"><span class="ph"><span class="caret"></span>name@example.com</span></div>
      </div>
      <button class="btn primary block">Continue<i class="ic ic-arrow-right"></i></button>
      <div class="provider-row" role="group" aria-label="Or continue with">
        <a class="provider" href="#" aria-label="Continue with Apple" title="Continue with Apple"><i class="ic ic-apple"></i></a>
        <a class="provider" href="#" aria-label="Continue with Google" title="Continue with Google"><i class="gmark lg"></i></a>
        <a class="provider" href="#" aria-label="Continue with Steam" title="Continue with Steam"><i class="ic ic-steam"></i></a>
      </div>
      <button class="btn ghost block"><i class="ic ic-fingerprint"></i>Sign in with a passkey</button>
      <div class="hosted-links row-14">
        <a href="#"><i class="ic ic-key-round sm"></i>Have a license key?</a>
        <a href="#"><i class="ic ic-smartphone sm"></i>Sign in with another device</a>
      </div>
    </div>
  </main>

  <nav class="hosted-legal centered" aria-label="Legal"><a href="#">Help</a><span>·</span><a href="#">Privacy</a><span>·</span><a href="#">Terms</a></nav>
</div>
