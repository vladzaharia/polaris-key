<div class="portal" data-brand="locker">
  <!-- 2026-10-20 shell (PX-35, BR-lockups): the trimmed lockup, the nav, the account chip (its menu
       opens with Activate a license, and holds Help and Privacy). -->
  <header class="portal-top">
    <a class="portal-brand" href="#"><i class="lk-lockup" role="img" aria-label="Polaris Locker"></i></a>
    <nav class="portal-nav" aria-label="Polaris Locker">
      <a class="active" href="#">Library</a>
      <a href="#">Discover</a>
    </nav>
    <div class="portal-actions">
      <span class="account"><span class="avatar sm">DO</span><span>Dana Ortiz</span><i class="ic ic-chevron-down"></i></span>
    </div>
  </header>

  <main class="portal-page">
    <div class="mk-stack-2">
      <h1>Your library</h1>
      <p class="muted">Signed in as dana@example.edu</p>
    </div>
    <!-- portal-17: the empty library says one thing and offers the two ways in. With no header button,
         this state's Activate a license is the page's one ink primary (PX-35). -->
    <section class="empty" aria-labelledby="le-title">
      <span class="empty-icon"><i class="lk-mark"></i></span>
      <h2 id="le-title">Nothing here yet</h2>
      <div class="btn-row"><button class="btn primary"><i class="ic ic-key-round"></i>Activate a license</button><a class="btn outline" href="#"><i class="ic ic-sparkles"></i>See 2 in Discover</a></div>
    </section>
  </main>

  <!-- The Library's sticky strip (PX-35): no key tile here, so Activate a license leads it. -->
  <section class="portal-strip" aria-label="Missing a license?">
    <div class="strip-row">
      <p class="strip-title" aria-hidden="true">Missing a license?</p>
      <button class="strip-toggle" type="button" aria-expanded="false" aria-controls="missing-ways">Missing a license?<i class="ic ic-chevron-up"></i></button>
      <ul class="strip-ways" id="missing-ways">
        <li><button class="strip-link" type="button">Activate a license</button></li>
        <li>Another email? <a class="strip-link" href="#">Add it in Sign-in methods</a></li>
        <li>Bought on Steam? <a class="strip-link" href="#">Connect Steam</a></li>
        <li>Bought in a store? Sign in from the app</li>
      </ul>
    </div>
  </section>

  <nav class="portal-tabbar docked" aria-label="Polaris Locker tabs">
    <a class="active" href="#" aria-current="page"><i class="ic ic-layout-grid"></i>Library</a>
    <a href="#"><i class="ic ic-sparkles"></i>Discover</a>
  </nav>
</div>
