<div class="portal focused" data-brand="locker">
  <!-- 2026-10-20 shell, a focused flow (FocusedFlow, PORTAL.md §4.4): the lockup and one way back,
       no nav, no account, no phone bar, no footer. Priya came from her Library, so the way back is
       DJDL's page ("See DJDL in your library"; "See DJDL" on a phone, "Back" under 384 px); an
       app's declared return= would make it "Back to DJDL". -->
  <header class="portal-top flow-top">
    <a class="portal-brand" href="#"><i class="lk-lockup" role="img" aria-label="Polaris Locker"></i></a>
    <a class="flow-back" href="#" aria-label="See DJDL in your library"><i class="ic ic-arrow-left"></i><span class="long">See DJDL<span class="tail"> in your library</span></span><span class="short" aria-hidden="true">Back</span></a>
  </header>

  <!-- PX-29 / P2-13: the focused download. The build is named before its action, then its facts
       (channel, SHA-256, the install hint) in one card, then the other platforms folded. A phone
       sees the desktop builds and mails itself the link. -->
  <main class="portal-page task">
    <div class="task-head">
      <p class="task-crumb">DJDL / Download</p>
      <h1 id="dl-title">Download DJDL 4.2.0</h1>
    </div>
    <div class="task-frame">
      <aside class="task-aside" aria-label="Product">
        <div class="identity-row">
          <span class="logo lg" data-product="djdl"></span>
          <div class="grow"><strong>DJDL</strong><span class="meta">From Example Audio</span></div>
        </div>
      </aside>
      <section class="task-main" aria-labelledby="dl-title">
        <div class="mk-stack-3">
          <div class="mk-stack-1">
            <div class="show-phone"><p class="icon-line type-small muted"><i class="ic ic-monitor"></i><span>You’re viewing desktop builds.</span></p></div>
            <p class="build-line"><strong>macOS, Universal</strong> · .dmg · 84 MB</p>
          </div>
          <div class="task-actions">
            <button class="btn primary lg hide-phone"><i class="ic ic-download"></i>Download for macOS</button>
            <button class="btn primary lg show-phone"><i class="ic ic-mail"></i>Email me the download</button>
          </div>
        </div>
        <section class="card" aria-label="Build details">
          <dl class="kv-rows">
            <div><dt>Channel</dt><dd>Stable · Sep 22, 2026</dd></div>
            <div><dt>SHA-256</dt><dd><span class="hash-row"><button class="hash-short" type="button" aria-label="SHA-256 5be0c2…1f9a, show full value"><span aria-hidden="true">5be0c2…1f9a</span></button><button class="btn outline sm" type="button" aria-label="Copy SHA-256"><i class="ic ic-copy"></i>Copy</button></span></dd></div>
          </dl>
          <div class="card-foot start"><span class="type-small muted">Open the .dmg and drag DJDL to Applications.</span></div>
        </section>
        <button class="card fold-row dashed" type="button" aria-expanded="false"><i class="ic ic-chevron-right"></i><span class="fold-row-text"><strong>Other platforms and architectures</strong><span>Windows</span></span></button>
      </section>
    </div>
  </main>
</div>
