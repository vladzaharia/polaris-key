<style>
  /* licenses.change-tier: colour only; spacing comes from the kit. */
  [data-screen="licenses.change-tier"] .ic-layers {
    color: var(--pk-accent-fg);
  }
</style>

<div class="board cols-2 floor" data-service="license">
  <div class="board-title">
    <h1>Change tier</h1>
    <p>From the tier control, the Limits card or ⋯ on licenses.detail.</p>
  </div>

  <!-- Moving up: the license becomes Studio; it stays an Automatic grant and nothing moves it back. -->
  <figure class="board-item">
    <div class="dialog lg" role="dialog" aria-labelledby="ct-up-title">
      <div class="dialog-head"><h2 id="ct-up-title">Change Priya Raman’s tier</h2><button class="btn ghost icon sm" aria-label="Close"><i class="ic ic-x"></i></button></div>
      <div class="dialog-body">
        <div class="field">
          <label class="field-label">Move to</label>
          <div class="select"><i class="ic ic-layers"></i><span class="grow">Studio</span><span class="type-small muted">1 of 5</span><i class="ic ic-chevrons-up-down"></i></div>
        </div>
        <section class="card" aria-labelledby="ct-up-diff">
          <div class="card-head"><div class="title"><h3 id="ct-up-diff">What changes</h3></div></div>
          <dl class="kv-rows">
            <div><dt>Devices</dt><dd><del class="diff-old"><span>4</span></del><ins class="diff-new">12</ins><span class="source">10 from Studio, 2 from a seat pack</span></dd></div>
            <div><dt>Release tracks</dt><dd><del class="diff-old"><span>stable</span></del><ins class="diff-new">stable, beta</ins></dd></div>
            <div><dt>Duration</dt><dd><del class="diff-old"><span>Ends Sep 14, 2027</span></del><ins class="diff-new">Lifetime</ins></dd></div>
            <div><dt>Includes</dt><dd><del class="diff-old"><span>recording, 4 decks</span></del><ins class="diff-new">recording, stems, 4 decks</ins></dd></div>
          </dl>
        </section>
        <ul class="icon-list small">
          <li><i class="ic ic-check"></i><span>Unchanged: offline days 14 (set on this license), fingerprint Normal and the 3 add-ons. Still an Automatic grant; Studio is the top tier, so no sign-in moves it back. Devices get the new limits at their next check.</span></li>
        </ul>
      </div>
      <div class="dialog-foot std">
        <button class="btn">Cancel</button>
        <button class="btn primary">Move to Studio</button>
      </div>
    </div>
    <figcaption><strong>Moving up</strong>Each changed limit, now and after; what stays; why the move sticks.</figcaption>
  </figure>

  <!-- Moving down: the access rule would move it back up at the next sign-in, so the dialog says so. -->
  <figure class="board-item">
    <div class="dialog lg caution" role="dialog" aria-labelledby="ct-down-title">
      <div class="dialog-head"><h2 id="ct-down-title">Change Priya Raman’s tier</h2><button class="btn ghost icon sm" aria-label="Close"><i class="ic ic-x"></i></button></div>
      <div class="dialog-body">
        <div class="field">
          <label class="field-label">Move to</label>
          <div class="select"><i class="ic ic-layers"></i><span class="grow">Free</span><span class="type-small muted">5 of 5</span><i class="ic ic-chevrons-up-down"></i></div>
        </div>
        <section class="card" aria-labelledby="ct-down-diff">
          <div class="card-head"><div class="title"><h3 id="ct-down-diff">What changes</h3></div></div>
          <dl class="kv-rows">
            <div><dt>Devices</dt><dd><del class="diff-old"><span>4</span></del><ins class="diff-new">3</ins><span class="source">She has 3, so none is signed out</span></dd></div>
            <div><dt>Duration</dt><dd><del class="diff-old"><span>Ends Sep 14, 2027</span></del><ins class="diff-new">Lifetime</ins></dd></div>
            <div><dt>Includes</dt><dd><del class="diff-old"><span>recording, 4 decks</span></del><ins class="diff-new">2 decks, no recording</ins></dd></div>
          </dl>
        </section>
        <div class="callout warning">
          <i class="ic ic-triangle-alert"></i>
          <div class="grow">
            <div class="callout-title">Her next sign-in moves it back to Education</div>
            <div class="callout-text">Verified email domain <code>example.edu</code> gives Education. To keep her on Free, change that rule first.</div>
          </div>
        </div>
      </div>
      <div class="dialog-foot std">
        <a class="btn ghost start" href="#">Open Access<i class="ic ic-arrow-right"></i></a>
        <button class="btn">Cancel</button>
        <button class="btn primary">Move to Free</button>
      </div>
    </div>
    <figcaption><strong>Moving down</strong>A rule still covers Priya, so the dialog warns that her next sign-in undoes the move. Nothing is blocked.</figcaption>
  </figure>
</div>
