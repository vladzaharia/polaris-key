<div class="board cols-2 wide-3 floor" data-service="core">
  <div class="board-title">
    <h1>Saving Access</h1>
  </div>

  <!-- Rules → Nobody. -->
  <figure class="board-item dlg-center">
    <div class="dialog caution" role="dialog" aria-labelledby="ac-nobody">
      <div class="dialog-head"><i class="ic ic-triangle-alert"></i><h2 id="ac-nobody">Stop automatic licenses for DJDL?</h2><button class="btn ghost icon sm" aria-label="Close"><i class="ic ic-x"></i></button></div>
      <div class="dialog-body">
        <p class="mk-cluster">Automatic licenses<del class="diff-old"><span>Rules</span></del><ins class="diff-new">Nobody</ins></p>
        <ul class="icon-list">
          <li class="success"><i class="ic ic-check"></i><span><strong>650 automatic licenses stay</strong> on their tiers</span></li>
          <li><i class="ic ic-ban"></i><span>New sign-ins get nothing</span></li>
          <li><i class="ic ic-list-filter"></i><span>Your 4 rules are kept</span></li>
        </ul>
      </div>
      <div class="dialog-foot std">
        <button class="btn">Keep Rules</button>
        <button class="btn primary">Stop automatic licenses</button>
      </div>
    </div>
    <figcaption><strong>Rules → Nobody</strong>Asked when Save access includes this switch.</figcaption>
  </figure>

  <!-- Rules → Everyone who signs in. -->
  <figure class="board-item dlg-center">
    <div class="dialog caution" role="dialog" aria-labelledby="ac-everyone">
      <div class="dialog-head"><i class="ic ic-triangle-alert"></i><h2 id="ac-everyone">Give every signed-in account a DJDL license?</h2><button class="btn ghost icon sm" aria-label="Close"><i class="ic ic-x"></i></button></div>
      <div class="dialog-body">
        <p class="mk-cluster">Automatic licenses<del class="diff-old"><span>Rules</span></del><ins class="diff-new">Everyone who signs in</ins></p>
        <ul class="icon-list">
          <li class="success"><i class="ic ic-trending-up"></i><span><strong>Every account that signs in gets Trial</strong></span><span class="sub">14 days of Standard, then Free</span></li>
          <li><i class="ic ic-shield-check"></i><span>Nobody moves down</span></li>
          <li><i class="ic ic-list-filter"></i><span>Your 4 rules are kept</span></li>
          <li><i class="ic ic-circle-pause"></i><span>They don’t apply while this is on</span></li>
        </ul>
        <div class="field">
          <label class="field-label">Type <span class="confirm-word neutral">djdl</span> to confirm</label>
          <div class="input mono"><span class="grow">djdl</span></div>
        </div>
      </div>
      <div class="dialog-foot std">
        <button class="btn">Keep Rules</button>
        <button class="btn primary">Give everyone Trial</button>
      </div>
    </div>
    <figcaption><strong>Rules → Everyone who signs in</strong></figcaption>
  </figure>

  <!-- Saved: the bar goes; a toast names what changed, with History. -->
  <figure class="board-item full">
    <div class="board-frame">
      <header class="page-head">
        <div class="page-heading"><h2 class="type-page">Access</h2></div>
        <div class="page-actions"><button class="btn outline"><i class="ic ic-history"></i>History</button></div>
      </header>
      <section class="card" aria-label="Updates, downloads and packages">
        <div class="card-rows">
          <div class="item-row">
            <span class="icon-tile sm neutral"><i class="ic ic-circle-arrow-up"></i></span>
            <div class="item-text"><div class="item-title">Update checks</div><div class="item-desc">Sparkle on macOS, WinSparkle on Windows</div></div>
            <div class="item-end"><div class="segmented sm matrix fit" role="radiogroup" aria-label="Update checks"><span>Public</span><span>Signed in</span><span class="on">Customers</span><span>Entitlement</span></div></div>
          </div>
          <div class="item-row">
            <span class="icon-tile sm neutral"><i class="ic ic-download"></i></span>
            <div class="item-text"><div class="item-title">App downloads</div><div class="item-desc">key.plrs.im/djdl</div></div>
            <div class="item-end"><div class="segmented sm matrix fit" role="radiogroup" aria-label="App downloads"><span class="on">Public</span><span>Signed in</span><span>Customers</span><span>Entitlement</span></div></div>
          </div>
        </div>
      </section>
      <div class="toast success wrap-action" role="status">
        <i class="ic ic-circle-check"></i>
        <div class="grow"><div class="toast-title">Saved access</div><div class="toast-text">App downloads are now Public.</div></div>
        <button class="btn ghost xs">View in History</button>
      </div>
    </div>
    <figcaption><strong>Saved</strong>A failed save keeps the bar and every change.</figcaption>
  </figure>
</div>
