<style>
  /* products.sidebar-contexts: screen details only; the board's layout is the kit's .board-spec. */
  [data-screen="products.sidebar-contexts"] .figcaption-title {
    color: var(--pk-text-strong);
  }
  [data-screen="products.sidebar-contexts"] .menu-item .end .ic {
    color: var(--pk-text-strong);
  }
  [data-screen="products.sidebar-contexts"] .ctx.open {
    border-color: var(--mk-action);
    box-shadow: 0 0 0 1px var(--mk-action);
  }
  [data-screen="products.sidebar-contexts"] .switcher {
    right: 0;
    z-index: 5;
  }
  [data-screen="products.sidebar-contexts"] .switcher .menu {
    min-width: 0;
  }
  /* The nav under the open menu is not drawn: the menu is the only thing in focus; the hidden nav keeps the frame as tall as the menu. */
  [data-screen="products.sidebar-contexts"] .dimmed {
    visibility: hidden;
    height: 340px;
    overflow: hidden;
  }
  [data-screen="products.sidebar-contexts"] .sidebar-foot.dimmed {
    display: none;
  }
  [data-screen="products.sidebar-contexts"] .menu-item .count-text {
    font-size: var(--fs-meta);
    color: var(--pk-text-muted);
  }
  @container screen (max-width: 1023px) {
    [data-screen="products.sidebar-contexts"] .menu-item .count-text {
      display: none;
    }
  }
</style>
