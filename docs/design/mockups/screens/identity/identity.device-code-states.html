<div class="board" data-service="core">
  <div class="board-page">
    <header class="board-head rhythm">
      <h1>Device code: when the code doesn’t work</h1>
    </header>
    <div class="frame-grid fixed-cards">
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">1</span><span><strong>Wrong code</strong>WDJB-MJTH typed for WDJB-MJHT</span></figcaption>
          <div class="hosted-card">
            <div class="hosted-body">
              <h1>Enter the code from your device</h1>
              <div class="field invalid">
                <label class="field-label" for="w-code">Code</label>
                <div class="code-entry" id="w-code" aria-invalid="true" aria-describedby="w-err"><span>WDJB</span><span class="sep">–</span><span>MJTH</span></div>
                <p class="error-text" id="w-err"><i class="ic ic-circle-x"></i>No device is waiting for that code. Check it against your device’s screen.</p>
              </div>
              <button class="btn primary block">Continue<i class="ic ic-arrow-right"></i></button>
            </div>
            <footer class="hosted-foot"><i class="ic ic-lock sm"></i><span>Polaris Key signs you in on the device that shows this code. You confirm it on the next step.</span></footer>
          </div>
      </figure>
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">2</span><span><strong>Expired</strong>after 10 minutes</span></figcaption>
          <div class="hosted-card">
            <div class="hosted-body">
              <h1>That code expired</h1>
              <div class="hosted-callout" role="status"><i class="ic ic-clock"></i><div><strong>Your device shows a new code</strong><span>Codes last 10 minutes. Enter the new one.</span></div></div>
              <button class="btn primary block">Enter the new code</button>
            </div>
            <footer class="hosted-foot"><i class="ic ic-lock sm"></i><span>Polaris Key signs you in on the device that shows this code. You confirm it on the next step.</span></footer>
          </div>
      </figure>
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">3</span><span><strong>Too many tries</strong>rate limited</span></figcaption>
          <div class="hosted-card">
            <div class="hosted-body">
              <h1>Enter the code from your device</h1>
              <div class="hosted-callout" role="status"><i class="ic ic-clock"></i><div><strong>Too many codes tried</strong><span>Try again at 21:14. The code on your device still works until it expires.</span></div></div>
            </div>
            <footer class="hosted-foot"><i class="ic ic-lock sm"></i><span>Polaris Key signs you in on the device that shows this code. You confirm it on the next step.</span></footer>
          </div>
      </figure>
    </div>
  </div>
</div>
