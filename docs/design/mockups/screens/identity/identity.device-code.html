<div class="hosted" data-service="core">
  <div class="hosted-brand"><i class="pk-mark sm"></i>Polaris Key</div>

  <!-- key.plrs.im/device, the Worker's script-free page: a form that POSTs (origin-checked). It cannot
       name a product before the code resolves, so there is no app header and no art (B9). -->
  <main class="hosted-card" aria-labelledby="dc-title">
    <div class="hosted-body">
      <h1 id="dc-title">Enter the code from your device</h1>
      <p class="hosted-lede">It’s on the screen that asked you to sign in.</p>
      <div class="field">
        <label class="field-label" for="dc-code">Code</label>
        <div class="code-entry focus" id="dc-code"><span>WDJB</span><span class="sep">–</span><span>MJHT</span></div>
      </div>
      <p class="hosted-note"><i class="ic ic-shield sm"></i><span>Only use a code from your own product, not one somebody sent you.</span></p>
      <button class="btn primary block">Continue<i class="ic ic-arrow-right"></i></button>
    </div>
    <footer class="hosted-foot"><i class="ic ic-lock sm"></i><span>Polaris Key signs you in on the device that shows this code. You confirm it on the next step.</span></footer>
  </main>

  <nav class="hosted-legal centered" aria-label="Legal"><a href="#">Help</a><span>·</span><a href="#">Privacy</a><span>·</span><a href="#">Terms</a></nav>
</div>
