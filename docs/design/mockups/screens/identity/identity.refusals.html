<div class="board" data-service="core">
  <div class="board-page">
    <header class="board-head rhythm">
      <h1>When the card refuses</h1>
    </header>
    <div class="frame-grid fixed-cards">
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">1</span><span><strong>Device limit</strong>one license, full</span></figcaption>
        <div class="hosted-card">
          <header class="hosted-head">
            <span class="logo lg" data-product="djdl"></span>
            <div class="grow">
              <div class="hosted-title"><strong>DJDL</strong> wants you to sign in</div>
              <div class="hosted-sub"><span class="by-dev">Example Audio</span><span aria-hidden="true">·</span><span class="on-device"><i class="ic ic-monitor sm"></i>on Studio Mac mini</span></div>
            </div>
          </header>
          <div class="hosted-body">
            <h1>Replace a device</h1>
            <div class="hosted-callout"><i class="ic ic-monitor-smartphone"></i><div><strong>Your license is on 3 of 3 devices</strong><span>To use it on this computer, replace one. You can add it back later.</span></div></div>
            <div class="hosted-actions">
              <button class="btn primary block">Replace a device</button>
              <button class="btn ghost block">Use a license key instead</button>
            </div>
          </div>
        </div>
      </figure>
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">2</span><span><strong>All full</strong></span></figcaption>
        <div class="hosted-card">
          <header class="hosted-head">
            <span class="logo lg" data-product="diceroll"></span>
            <div class="grow">
              <div class="hosted-title"><strong>Diceroll</strong> wants you to sign in</div>
              <div class="hosted-sub"><span class="by-dev">Example Games</span><span aria-hidden="true">·</span><span class="on-device"><i class="ic ic-smartphone sm"></i>on Mara’s Pixel 8</span></div>
            </div>
          </header>
          <div class="hosted-body">
            <h1>Choose a license for this device</h1>
            <div class="hosted-list" role="radiogroup" aria-label="Licenses for Diceroll">
              <div class="hosted-row choice-row on" role="radio" aria-checked="true"><span class="radio on"><span class="box"></span></span><div class="hosted-row-text"><strong>Diceroll Standard</strong><span>From the App Store · 3 of 3 devices</span></div><span class="pill sm">No free devices</span></div>
              <div class="hosted-row choice-row" role="radio" aria-checked="false"><span class="radio"><span class="box"></span></span><div class="hosted-row-text"><strong>Diceroll Family</strong><span>Gift · 5 of 5 devices</span></div><span class="pill sm">No free devices</span></div>
            </div>
            <div class="hosted-callout"><i class="ic ic-monitor-smartphone"></i><div><span>Your licenses are on all their devices. Replace a device to use one here.</span></div></div>
            <div class="hosted-actions">
              <button class="btn primary block">Replace a device</button>
              <button class="btn ghost block">Use a license key instead</button>
            </div>
          </div>
        </div>
      </figure>
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">3</span><span><strong>Email mismatch</strong></span></figcaption>
        <div class="hosted-card">
          <header class="hosted-head">
            <span class="logo lg" data-product="djdl"></span>
            <div class="grow">
              <div class="hosted-title"><strong>DJDL</strong> wants you to sign in</div>
              <div class="hosted-sub"><span class="by-dev">Example Audio</span><span aria-hidden="true">·</span><span class="on-device"><i class="ic ic-monitor sm"></i>on Studio Mac mini</span></div>
            </div>
          </header>
          <div class="hosted-body">
            <h1>This license was sent to another email</h1>
            <div class="hosted-callout"><i class="ic ic-at-sign"></i><div><span>It was sent to p•••@example.edu. Sign in with that email, or add it to this account and verify it.</span></div></div>
            <div class="hosted-actions">
              <button class="btn primary block">Use another account</button>
              <button class="btn ghost block">Verify that email</button>
            </div>
          </div>
        </div>
      </figure>
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">4</span><span><strong>Key entries used up</strong>5 wrong keys this hour</span></figcaption>
        <div class="hosted-card">
          <header class="hosted-head">
            <span class="logo lg" data-product="djdl"></span>
            <div class="grow">
              <div class="hosted-title"><strong>DJDL</strong></div>
              <div class="hosted-sub"><span class="by-dev">Example Audio</span><span aria-hidden="true">·</span><span class="on-device"><i class="ic ic-monitor sm"></i>on Studio Mac mini</span></div>
            </div>
          </header>
          <div class="hosted-body">
            <h1>Enter your license key</h1>
            <div class="hosted-callout"><i class="ic ic-clock"></i><div><span>This key has no entries left in DJDL. Add it to your account and DJDL signs you in instead.</span></div></div>
            <div class="hosted-actions">
              <button class="btn primary block">Sign in instead</button>
            </div>
          </div>
        </div>
      </figure>
    </div>
  </div>
</div>
