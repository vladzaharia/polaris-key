<div class="board" data-service="core">
  <div class="board-page">
    <header class="board-head rhythm">
      <h1>When the card refuses</h1>
      <p>A neutral callout says what happened; the fix is the one primary. Never amber, never a disabled primary.</p>
    </header>
    <div class="frame-grid fixed-cards">
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">1</span><span><strong>Device limit</strong>one license, full</span></figcaption>
        <div class="hosted-card">
          <header class="hosted-head">
            <span class="logo lg" data-product="djdl"></span>
            <div class="grow">
              <div class="hosted-title"><strong>DJDL</strong> wants you to sign in</div>
              <div class="hosted-sub"><span class="by-dev">Example Audio</span><span aria-hidden="true">·</span><span class="on-device"><i class="ic ic-monitor sm"></i>on Studio Mac mini</span></div>
            </div>
          </header>
          <div class="hosted-body">
            <h1>Replace a device</h1>
            <div class="hosted-callout"><i class="ic ic-monitor-smartphone"></i><div><strong>DJDL Studio is on 3 of 3 devices</strong><span>Replace one to use it here. You can add it back later.</span></div></div>
            <div class="hosted-actions">
              <button class="btn primary block">Replace a device</button>
              <button class="btn ghost block">Use a different license</button>
            </div>
          </div>
        </div>
      </figure>
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">2</span><span><strong>All full</strong>every license is full</span></figcaption>
        <div class="hosted-card">
          <header class="hosted-head">
            <span class="logo lg" data-product="diceroll"></span>
            <div class="grow">
              <div class="hosted-title"><strong>Diceroll</strong> wants you to sign in</div>
              <div class="hosted-sub"><span class="by-dev">Example Games</span><span aria-hidden="true">·</span><span class="on-device"><i class="ic ic-smartphone sm"></i>on Mara’s Pixel 8</span></div>
            </div>
          </header>
          <div class="hosted-body">
            <h1>Choose a license</h1>
            <div class="hosted-list">
              <div class="hosted-row"><div class="hosted-row-text"><strong>Diceroll Standard</strong><span>3 of 3 devices</span></div><span class="pill sm">Full</span></div>
              <div class="hosted-row"><div class="hosted-row-text"><strong>Family (gift)</strong><span>5 of 5 devices</span></div><span class="pill sm">Full</span></div>
            </div>
            <div class="hosted-callout"><i class="ic ic-monitor-smartphone"></i><div><strong>Both licenses are full</strong><span>Replace a device on Diceroll Standard to sign in here.</span></div></div>
            <button class="btn primary block">Replace a device</button>
          </div>
        </div>
      </figure>
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">3</span><span><strong>Email mismatch</strong>license for another address</span></figcaption>
        <div class="hosted-card">
          <header class="hosted-head">
            <span class="logo lg" data-product="djdl"></span>
            <div class="grow">
              <div class="hosted-title"><strong>DJDL</strong> wants you to sign in</div>
              <div class="hosted-sub"><span class="by-dev">Example Audio</span><span aria-hidden="true">·</span><span class="on-device"><i class="ic ic-monitor sm"></i>on Studio Mac mini</span></div>
            </div>
          </header>
          <div class="hosted-body">
            <h1>This license is for another email</h1>
            <div class="hosted-callout"><i class="ic ic-at-sign"></i><div><strong>Bought by priya@example.edu</strong><span>You’re signed in as priya.raman@example.com.</span></div></div>
            <div class="hosted-actions">
              <button class="btn primary block">Use another account</button>
              <button class="btn ghost block">Add priya@example.edu to this account</button>
            </div>
          </div>
        </div>
      </figure>
      <figure class="board-item">
        <figcaption class="mk-cluster no-wrap"><span class="anno">4</span><span><strong>Key entries used up</strong>5 wrong keys this hour</span></figcaption>
        <div class="hosted-card">
          <header class="hosted-head">
            <span class="logo lg" data-product="djdl"></span>
            <div class="grow">
              <div class="hosted-title"><strong>DJDL</strong></div>
              <div class="hosted-sub"><span class="by-dev">Example Audio</span><span aria-hidden="true">·</span><span class="on-device"><i class="ic ic-monitor sm"></i>on Studio Mac mini</span></div>
            </div>
          </header>
          <div class="hosted-body">
            <h1>Enter your license key</h1>
            <div class="hosted-callout"><i class="ic ic-clock"></i><div><strong>No key entries left until 11:42</strong><span>Signing in finds licenses bought with your email.</span></div></div>
            <button class="btn primary block">Sign in instead</button>
          </div>
        </div>
      </figure>
    </div>
  </div>
</div>
