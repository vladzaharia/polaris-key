      :root {
        --mono:
          "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --sans: "Rubik", system-ui, sans-serif;
        --control-h: 48px;
        --provider-h: 52px;
        --card-w: 28.5rem;
        --card-r: 22px;
        --field: var(--pk-surface-sunken);
        --row: var(--pk-surface-overlay);
        --hair: var(--pk-border-subtle);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #444;
      }
      body {
        font-family: var(--sans);
        color: var(--pk-text-default);
        font-size: 15px;
        line-height: 22px;
        -webkit-font-smoothing: antialiased;
      }
      .board {
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
        padding: 40px;
        align-items: flex-start;
      }

      /* ---------- screen ---------- */
      .screen {
        position: relative;
        background: var(--pk-surface-page);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .screen.desktop {
        width: 1440px;
        min-height: 900px;
        padding: 72px 0 48px;
      }
      .screen.phone {
        width: 390px;
        min-height: 844px;
        padding: 0 0 24px;
      }
      .stars {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .phone .stars {
        display: none;
      }
      .lockup {
        position: relative;
        color: var(--pk-text-strong);
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
      }
      .lockup svg.mark {
        width: 34px;
        height: 34px;
        color: var(--pk-brand-violet);
      }
      .lockup .word {
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.01em;
      }
      .lockup .sep {
        width: 1px;
        height: 24px;
        background: var(--pk-border-strong);
        margin: 0 4px;
      }
      .lockup .surface {
        font-size: 22px;
        font-weight: 500;
        color: var(--pk-text-muted);
      }
      .phone .lockup {
        height: 56px;
        margin: 0;
        align-self: stretch;
        justify-content: center;
      }
      .phone .lockup svg.mark {
        width: 26px;
        height: 26px;
      }
      .phone .lockup .word {
        font-size: 21px;
      }
      .phone .lockup .surface {
        font-size: 17px;
      }

      /* ---------- card ---------- */
      .card {
        position: relative;
        width: var(--card-w);
        background: var(--pk-surface-raised);
        border: 1px solid var(--hair);
        border-radius: var(--card-r);
        box-shadow: var(--pk-elevation-3);
        overflow: hidden;
      }
      .phone .card {
        width: 100%;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        box-shadow: none;
      }
      .card-head {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 18px 24px;
        background: color-mix(
          in oklab,
          var(--pk-accent-subtle) 70%,
          var(--pk-surface-raised)
        );
        border-bottom: 1px solid var(--hair);
      }
      .card-head .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        flex: none;
        overflow: hidden;
      }
      .card-head .t {
        color: var(--pk-text-strong);
        font-size: 18px;
        line-height: 24px;
      }
      .card-head .t b {
        font-weight: 600;
      }
      .card-head .w {
        color: var(--pk-text-muted);
        font-size: 13px;
        line-height: 18px;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 2px;
      }
      .card-head .w svg {
        width: 14px;
        height: 14px;
      }
      .codepanel {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        column-gap: 10px;
        row-gap: 2px;
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--pk-surface-sunken);
        font-size: 13px;
        color: var(--pk-text-muted);
      }
      .codepanel > * {
        white-space: nowrap;
      }
      .codepanel code {
        font-family: var(--mono);
        color: var(--pk-text-strong);
        font-size: 17px;
        letter-spacing: 0.12em;
        font-weight: 500;
      }
      .body {
        padding: 28px 28px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .phone .body {
        padding: 24px 20px 24px;
      }
      h1 {
        margin: 0;
        color: var(--pk-text-strong);
        font-size: 24px;
        line-height: 30px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .lede {
        margin: -6px 0 0;
        color: var(--pk-text-muted);
      }
      .lede b,
      p b {
        color: var(--pk-text-strong);
        font-weight: 500;
      }
      p {
        margin: 0;
      }
      .small {
        font-size: 13px;
        line-height: 18px;
        color: var(--pk-text-subtle);
      }
      .muted {
        color: var(--pk-text-muted);
      }
      .mono {
        font-family: var(--mono);
      }
      label.lab {
        display: block;
        color: var(--pk-text-strong);
        font-weight: 500;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .input {
        height: var(--control-h);
        border-radius: 12px;
        border: 1px solid var(--pk-border-subtle);
        background: var(--field);
        display: flex;
        align-items: center;
        padding: 0 14px;
        color: var(--pk-text-strong);
      }
      .input.ph {
        color: var(--pk-text-subtle);
      }
      .input.focus {
        outline: 2px solid var(--pk-focus);
        outline-offset: 2px;
      }
      .help {
        margin-top: 8px;
        font-size: 13px;
        line-height: 18px;
        color: var(--pk-text-muted);
      }

      /* buttons */
      .btn {
        height: var(--control-h);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 700;
        font-size: 15px;
        border: 1px solid transparent;
        color: var(--pk-text-strong);
        width: 100%;
      }
      .btn svg {
        width: 18px;
        height: 18px;
      }
      .btn.primary {
        background: var(--pk-accent);
        color: var(--pk-accent-on);
      }
      .btn.primary.disabled {
        opacity: 0.45;
      }
      .btn.secondary {
        background: var(--pk-surface-raised);
        border-color: var(--pk-border-subtle);
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.ghost .acc {
        color: var(--pk-accent-fg);
      }
      .btn.danger {
        background: var(--pk-danger);
        color: var(--pk-danger-on);
      }
      .btn.inline {
        width: auto;
        height: 36px;
        padding: 0 14px;
        font-size: 14px;
        border-radius: 10px;
      }
      .or {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--pk-text-subtle);
        font-size: 13px;
      }
      .or::before,
      .or::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--hair);
      }
      .providers {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .providers .p {
        flex: 1;
        height: var(--provider-h);
        border-radius: 12px;
        border: 1px solid var(--pk-border-subtle);
        background: var(--pk-surface-raised);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--pk-text-strong);
      }
      .providers.one .p {
        flex: 0 0 calc(50% - 5px);
      }
      .providers .p svg {
        width: 24px;
        height: 24px;
      }
      .links {
        border-top: 1px solid var(--hair);
        padding-top: 16px;
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        font-size: 14px;
        color: var(--pk-text-muted);
      }
      .links span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .links svg {
        width: 16px;
        height: 16px;
      }
      .link {
        color: var(--pk-accent-fg);
        font-weight: 500;
      }
      .center {
        text-align: center;
      }
      .card-foot {
        border-top: 1px solid var(--hair);
        padding: 14px 24px;
        display: flex;
        gap: 10px;
        font-size: 12.5px;
        line-height: 18px;
        color: var(--pk-text-subtle);
      }
      .card-foot svg {
        width: 14px;
        height: 14px;
        flex: none;
        margin-top: 2px;
      }
      .below {
        position: relative;
        width: var(--card-w);
        display: flex;
        justify-content: flex-end;
        margin-top: 14px;
        font-size: 13px;
        color: var(--pk-text-muted);
      }
      .phone .below {
        width: 100%;
        justify-content: center;
      }

      /* cells */
      .cells {
        display: flex;
        gap: 8px;
      }
      .cells div {
        flex: 1;
        height: 56px;
        border-radius: 12px;
        background: var(--field);
        border: 1px solid var(--pk-border-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-size: 24px;
        color: var(--pk-text-strong);
      }
      .cells div.cur {
        outline: 2px solid var(--pk-focus);
        outline-offset: 1px;
      }

      /* person row */
      .person {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--row);
        border: 1px solid var(--hair);
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #b05a2b, #e08a3a);
        font-size: 15px;
      }
      .person .n {
        color: var(--pk-text-strong);
        font-weight: 500;
      }
      .person .e {
        font-size: 13px;
        color: var(--pk-text-muted);
        line-height: 18px;
      }
      .person .x {
        margin-left: auto;
        font-size: 13px;
      }

      /* license rows */
      .group-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--pk-text-muted);
        margin-bottom: -6px;
      }
      .lic {
        border-radius: 14px;
        border: 1px solid var(--pk-border-subtle);
        background: var(--pk-surface-raised);
        padding: 14px 14px 14px 14px;
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 4px 12px;
        align-items: start;
      }
      .lic.sel {
        border-color: var(--pk-accent);
        background: color-mix(
          in oklab,
          var(--pk-accent-subtle) 60%,
          var(--pk-surface-raised)
        );
        box-shadow: 0 0 0 1px var(--pk-accent) inset;
      }
      .lic.full {
        background: var(--pk-surface-raised);
      }
      .lic .nosel {
        width: 20px;
        height: 20px;
        margin-top: 1px;
        color: var(--pk-warning);
      }
      .lic .nosel svg {
        width: 20px;
        height: 20px;
      }
      .lic.blocked .nosel {
        color: var(--pk-text-subtle);
      }
      .lic.chosen {
        grid-template-columns: 1fr auto;
      }
      .lic.chosen .lm {
        grid-column: 1 / 3;
      }
      .lic .act .link {
        font-size: 14px;
      }
      .radio {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--pk-border-strong);
        margin-top: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sel > .radio {
        border-color: var(--pk-accent);
      }
      .sel > .radio::after {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--pk-accent);
      }
      .ln {
        color: var(--pk-text-strong);
        font-weight: 500;
      }
      /* SIGN-IN.md O-11: line 2 is the tier as a neutral pill, then the device counter or
   "Account-wide · {used} of {limit} devices" (SIGN-IN.md D-53). */
      .tl {
        grid-column: 2 / 4;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
        line-height: 18px;
        color: var(--pk-text);
      }
      .pill {
        font-size: 12px;
        font-weight: 500;
        line-height: 16px;
        padding: 1px 8px;
        border-radius: 999px;
        border: 1px solid var(--pk-border-strong);
        color: var(--pk-text-strong);
        background: transparent;
        white-space: nowrap;
      }
      .tl .aw {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .tl .aw svg {
        width: 14px;
        height: 14px;
        color: var(--pk-text-muted);
      }
      .lm {
        grid-column: 2 / 4;
        font-size: 13px;
        line-height: 18px;
        color: var(--pk-text-muted);
      }
      .tag {
        font-size: 12px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--pk-text-strong) 9%, transparent);
        color: var(--pk-text-strong);
        white-space: nowrap;
        align-self: center;
      }
      .tag.new {
        background: var(--pk-accent-subtle);
        color: var(--pk-accent-fg);
      }
      .tag.warn {
        background: var(--pk-warning-subtle);
        color: var(--pk-warning);
        border: 1px solid var(--pk-warning-border);
      }
      .meter {
        grid-column: 2 / 4;
        display: flex;
        gap: 3px;
        margin-top: 6px;
      }
      .meter i {
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: var(--pk-border-subtle);
      }
      .meter i.on {
        background: var(--pk-text-muted);
      }
      .full .meter i.on {
        background: var(--pk-warning);
      }
      .lic .act {
        grid-column: 2 / 4;
        margin-top: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .disclose {
        font-size: 14px;
        color: var(--pk-text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .disclose svg {
        width: 16px;
        height: 16px;
      }

      /* replace panel */
      .replace {
        grid-column: 1 / 4;
        margin-top: 10px;
        border-top: 1px solid var(--hair);
        padding-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .replace h2 {
        margin: 0;
        font-size: 15px;
        color: var(--pk-text-strong);
        font-weight: 600;
      }
      .devs {
        border-radius: 14px;
        border: 1px solid var(--pk-border-subtle);
        overflow: hidden;
      }
      .dev {
        display: grid;
        grid-template-columns: 22px 20px 1fr auto;
        gap: 2px 12px;
        align-items: center;
        padding: 12px 12px;
        min-height: 60px;
        border-top: 1px solid var(--hair);
      }
      .dev:first-child {
        border-top: 0;
      }
      .dev.sel {
        background: var(--pk-accent-subtle);
      }
      .dev svg.g {
        width: 20px;
        height: 20px;
        color: var(--pk-text-muted);
      }
      .dev .dn {
        color: var(--pk-text-strong);
        font-weight: 500;
      }
      .dev .dm {
        font-size: 13px;
        color: var(--pk-text-muted);
        line-height: 18px;
      }
      .notice {
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 14px;
        line-height: 20px;
        display: flex;
        gap: 10px;
      }
      .notice svg {
        width: 18px;
        height: 18px;
        flex: none;
        margin-top: 1px;
      }
      .notice.info {
        background: var(--pk-info-subtle);
        border: 1px solid var(--pk-info-border);
        color: var(--pk-text-default);
      }
      .notice.warn {
        background: var(--pk-warning-subtle);
        border: 1px solid var(--pk-warning-border);
        color: var(--pk-text-default);
      }
      .notice.danger {
        background: var(--pk-danger-subtle);
        border: 1px solid var(--pk-danger-border);
        color: var(--pk-text-default);
      }
      .items {
        border: 1px solid var(--pk-border-subtle);
        border-radius: 14px;
        padding: 4px 14px;
      }
      .item {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 2px 12px;
        padding: 12px 0;
        border-top: 1px solid var(--hair);
      }
      .item:first-child {
        border-top: 0;
      }
      .item svg {
        width: 18px;
        height: 18px;
        color: var(--pk-accent-fg);
        margin-top: 2px;
      }
      .item .in {
        color: var(--pk-text-strong);
        font-weight: 500;
      }
      .item .im {
        grid-column: 2;
        font-size: 13px;
        color: var(--pk-text-muted);
        line-height: 18px;
      }
      .strip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--pk-success-subtle);
        border: 1px solid var(--pk-success-border);
        font-size: 14px;
      }
      .strip svg {
        width: 18px;
        height: 18px;
      }
      .strip .ok {
        margin-left: auto;
        color: var(--pk-success);
        font-weight: 500;
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .keycard {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border-radius: 14px;
        background: var(--row);
        border: 1px solid var(--hair);
      }
      .keycard .icon {
        width: 44px;
        height: 44px;
        border-radius: 11px;
        overflow: hidden;
        flex: none;
      }
      .segs {
        display: flex;
        gap: 4px;
      }
      .segs i {
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: var(--pk-border-subtle);
      }
      .segs i.used {
        background: var(--pk-warning);
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 10px;
        height: var(--control-h);
        padding: 0 8px 0 6px;
        border-radius: 999px;
        border: 1px solid var(--pk-border-subtle);
        background: var(--field);
        color: var(--pk-text-strong);
      }
      .chip .avatar {
        width: 34px;
        height: 34px;
        font-size: 13px;
        background: #3b4a6b;
      }
      .chip .ch {
        margin-left: auto;
        padding-right: 8px;
      }
      .qr {
        width: 168px;
        height: 168px;
        background: #fff;
        border-radius: 12px;
        padding: 10px;
        flex: none;
      }
      .bigcode {
        font-family: var(--mono);
        font-size: 30px;
        letter-spacing: 0.12em;
        color: var(--pk-text-strong);
        font-weight: 500;
      }
      .success-mark {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--pk-success-subtle);
        border: 1px solid var(--pk-success-border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--pk-success);
        align-self: center;
      }
      .success-mark svg {
        width: 30px;
        height: 30px;
      }
      .prodrow {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border-radius: 14px;
        background: var(--row);
        border: 1px solid var(--hair);
      }
      .prodrow .icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        overflow: hidden;
        flex: none;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid var(--pk-border-strong);
        border-top-color: var(--pk-accent-fg);
        flex: none;
      }

      /* ---------- kit (in-app native screen) ---------- */
      .kit {
        --pk-accent: #0f8075;
        --pk-accent-fg: #4fd8c4;
        --pk-accent-on: #ffffff;
        --pk-accent-subtle: #0c2628;
        --pk-focus: #4fd8c4;
      }
      [data-theme="light"] .kit {
        --pk-accent: #0d7369;
        --pk-accent-fg: #0b6158;
        --pk-accent-subtle: #e0f4f1;
        --pk-focus: #0d7369;
      }
      .kit.screen.phone {
        padding-top: 54px;
        padding-bottom: 0;
      }
      .kit .statusbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 32px;
        font-weight: 600;
        font-size: 16px;
        color: var(--pk-text-strong);
      }
      .kit .sheet {
        width: 100%;
        flex: 1;
        background: var(--pk-surface-raised);
        border-radius: 28px 28px 0 0;
        padding: 18px 20px 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        border-top: 1px solid var(--hair);
      }
      .kit .grab {
        width: 40px;
        height: 5px;
        border-radius: 3px;
        background: var(--pk-border-strong);
        align-self: center;
        opacity: 0.6;
      }
      .kit .phead {
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--pk-text-strong);
        font-weight: 500;
      }
      .kit .phead .icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        overflow: hidden;
      }
      .kit .btn {
        border-radius: 999px;
        height: 52px;
      }
      .kit .lic {
        border-radius: 16px;
      }
      .kit .desk {
        width: 100%;
      }
      .kit.screen.desktop {
        justify-content: center;
      }
      .bigcode + .small {
        margin-top: 6px;
      }

      /* app contexts: the product is the hero, the Polaris Key lockup is a quiet frame (SIGN-IN D-48) */
      .app .lockup {
        margin-bottom: 20px;
        color: var(--pk-text-muted);
        gap: 8px;
      }
      .app .lockup svg.mark {
        width: 20px;
        height: 20px;
        color: var(--pk-text-muted);
      }
      .app .lockup .word {
        font-size: 18px;
        font-weight: 600;
      }
      .phone.app .lockup {
        height: 44px;
        margin: 0;
      }
      .phone.app .lockup svg.mark {
        width: 18px;
        height: 18px;
      }
      .phone.app .lockup .word {
        font-size: 16px;
      }
      /* Replace confirm block */
      .confirm {
        border-radius: 12px;
        background: var(--pk-surface-sunken);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .confirm h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--pk-text-strong);
      }
      .confirm p {
        font-size: 14px;
        line-height: 20px;
        color: var(--pk-text-default);
      }
      .tag.active {
        background: var(--pk-success-subtle);
        color: var(--pk-success);
      }
      .kit .phead.hero {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        font-size: 22px;
        font-weight: 700;
      }
      .kit .phead.hero .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      .kit .who {
        font-size: 13px;
        color: var(--pk-text-muted);
      }

      /* ---------- desktop scenes (SIGN-IN.md §3.17, §4.15; UI-KITS.md §2.1 platform variants) ---------- */
      .screen.desk {
        display: block;
        height: 900px;
        min-height: 900px;
        padding: 0;
        font-size: 13px;
        line-height: 18px;
      }
      .wall {
        position: absolute;
        inset: 0;
      }
      .wall.mac {
        background:
          radial-gradient(60% 70% at 15% 10%, #3b3f8f 0%, transparent 60%),
          radial-gradient(50% 60% at 90% 90%, #6b2f6f 0%, transparent 60%),
          linear-gradient(160deg, #141631, #0b0c18);
      }
      .wall.w11 {
        background:
          radial-gradient(45% 55% at 50% 60%, #2d6bd8 0%, transparent 70%),
          radial-gradient(70% 60% at 30% 20%, #10306b 0%, transparent 70%),
          linear-gradient(180deg, #0a1630, #071021);
      }
      .wall.gnome {
        background:
          radial-gradient(60% 60% at 80% 20%, #2a4a6e 0%, transparent 70%),
          linear-gradient(180deg, #1d2430, #121820);
      }
      [data-theme="light"] .wall.mac {
        background:
          radial-gradient(60% 70% at 15% 10%, #c9cdfa 0%, transparent 60%),
          radial-gradient(50% 60% at 90% 90%, #f3c8ea 0%, transparent 60%),
          linear-gradient(160deg, #e9ecfb, #f6eef6);
      }
      [data-theme="light"] .wall.w11 {
        background:
          radial-gradient(45% 55% at 50% 60%, #8fb8ff 0%, transparent 70%),
          radial-gradient(70% 60% at 30% 20%, #cfe0ff 0%, transparent 70%),
          linear-gradient(180deg, #e6eefc, #d7e4fa);
      }
      [data-theme="light"] .wall.gnome {
        background:
          radial-gradient(60% 60% at 80% 20%, #c4d6ec 0%, transparent 70%),
          linear-gradient(180deg, #eef1f5, #dde3ea);
      }

      .win {
        position: absolute;
        overflow: hidden;
        background: var(--pk-surface-raised);
        color: var(--pk-text-default);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.35),
          0 24px 70px rgba(0, 0, 0, 0.45);
      }
      [data-theme="light"] .win {
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.12),
          0 24px 60px rgba(30, 40, 80, 0.22);
      }
      .win.behind {
        filter: saturate(0.85) brightness(0.92);
      }
      .win .tb {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        position: relative;
        z-index: 2;
      }
      .win .tt {
        font-size: 13px;
        font-weight: 500;
        color: var(--pk-text-muted);
      }
      .win .wc {
        position: absolute;
        inset: 40px 0 0 0;
      }
      /* macOS: traffic lights, centred title, content under a transparent title bar */
      .win.mac,
      .win.term,
      .win.browser {
        border-radius: 14px;
      }
      .mac .tb i,
      .term .tb i,
      .browser .tabs i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: none;
      }
      .tb i.r,
      .tabs i.r {
        background: #ff5f57;
      }
      .tb i.y,
      .tabs i.y {
        background: #febc2e;
      }
      .tb i.g,
      .tabs i.g {
        background: #28c840;
      }
      .mac .tt,
      .term .tt {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
      }
      .win.mac .wc {
        inset: 0;
      }
      .win.mac .tb {
        background: transparent;
      }
      /* the macOS 26 sheet: inset below the title bar, rounded on every side, no dimming */
      .msheet {
        position: absolute;
        top: 52px;
        left: 50%;
        transform: translateX(-50%);
        width: 460px;
        z-index: 3;
        padding: 22px 24px 20px;
        border-radius: 24px;
        background: color-mix(
          in oklab,
          var(--pk-surface-raised) 86%,
          transparent
        );
        backdrop-filter: blur(28px) saturate(1.4);
        border: 1px solid var(--pk-border-subtle);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      [data-theme="light"] .msheet {
        box-shadow: 0 18px 50px rgba(30, 40, 80, 0.22);
      }
      /* Windows 11: Mica title bar, caption buttons on the right, ContentDialog on smoke */
      .win.w11 {
        border-radius: 8px;
      }
      .w11 .tb {
        background: color-mix(
          in oklab,
          var(--pk-surface-page) 80%,
          #1b3a6b 20%
        );
        padding: 0 0 0 12px;
      }
      [data-theme="light"] .w11 .tb {
        background: color-mix(
          in oklab,
          var(--pk-surface-page) 85%,
          #a9c4ef 15%
        );
      }
      .w11 .ti {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        overflow: hidden;
      }
      .w11 .tt {
        color: var(--pk-text-default);
        font-weight: 400;
        font-size: 12px;
      }
      .w11 .caps {
        margin-left: auto;
        display: flex;
        height: 100%;
      }
      .w11 .caps svg {
        width: 46px;
        padding: 0 18px;
        height: 100%;
        color: var(--pk-text-default);
      }
      .smoke,
      .dim {
        position: absolute;
        inset: 40px 0 0 0;
        background: rgba(0, 0, 0, 0.42);
        z-index: 3;
      }
      [data-theme="light"] .smoke {
        background: rgba(0, 0, 0, 0.28);
      }
      .cdlg {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: calc(50% + 20px);
        transform: translate(-50%, -50%);
        width: 500px;
        border-radius: 8px;
        overflow: hidden;
        background: var(--pk-surface-raised);
        border: 1px solid var(--pk-border-subtle);
        box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4);
      }
      .cdlg .cb {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .cdlg .cf {
        padding: 20px 24px;
        background: var(--pk-surface-sunken);
        border-top: 1px solid var(--hair);
        display: flex;
        gap: 8px;
      }
      .cdlg .cf .db {
        flex: 1;
      }
      /* GNOME: header bar with only the close button; AdwDialog */
      .win.gnome {
        border-radius: 12px;
      }
      .gnome .tb {
        height: 46px;
        justify-content: center;
        background: var(--pk-surface-page);
        border-bottom: 1px solid var(--hair);
      }
      .gnome .tt {
        font-weight: 700;
        color: var(--pk-text-strong);
      }
      .gnome .close {
        position: absolute;
        right: 10px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: color-mix(in oklab, var(--pk-text-strong) 10%, transparent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gnome .close svg {
        width: 14px;
        height: 14px;
      }
      .gnome .wc {
        inset: 46px 0 0 0;
      }
      .gnome .dim {
        inset: 46px 0 0 0;
        background: rgba(0, 0, 0, 0.3);
      }
      [data-theme="light"] .gnome .dim {
        background: rgba(0, 0, 0, 0.12);
      }
      .adlg {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: calc(50% + 23px);
        transform: translate(-50%, -50%);
        width: 470px;
        border-radius: 12px;
        background: var(--pk-surface-raised);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.07),
          0 12px 32px rgba(0, 0, 0, 0.35);
      }
      /* the desktop browser */
      .browser .tabs {
        height: 40px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 0 12px;
        background: color-mix(in oklab, var(--pk-surface-page) 70%, #000 30%);
      }
      [data-theme="light"] .browser .tabs {
        background: #dfe3ea;
      }
      .browser .tabs i {
        align-self: center;
      }
      .browser .tab {
        margin-left: 14px;
        height: 32px;
        width: 240px;
        border-radius: 10px 10px 0 0;
        background: var(--pk-surface-sunken);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        font-size: 12.5px;
        color: var(--pk-text-strong);
      }
      [data-theme="light"] .browser .tab {
        background: #fff;
      }
      .browser .tab svg.mark {
        width: 14px;
        height: 14px;
        color: var(--pk-brand-violet);
      }
      .browser .tab .x {
        margin-left: auto;
        color: var(--pk-text-subtle);
      }
      .browser .bar {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        background: var(--pk-surface-sunken);
        border-bottom: 1px solid var(--hair);
      }
      [data-theme="light"] .browser .bar {
        background: #fff;
      }
      .browser .nav {
        display: flex;
        gap: 10px;
        color: var(--pk-text-muted);
      }
      .browser .nav svg {
        width: 18px;
        height: 18px;
      }
      .browser .url {
        flex: 1;
        height: 30px;
        border-radius: 999px;
        background: var(--pk-surface-raised);
        border: 1px solid var(--hair);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        font-size: 13px;
        color: var(--pk-text-muted);
      }
      [data-theme="light"] .browser .url {
        background: #eef1f5;
      }
      .browser .url svg {
        width: 13px;
        height: 13px;
      }
      .browser .url b {
        color: var(--pk-text-strong);
        font-weight: 500;
      }
      .browser .bc {
        position: absolute;
        inset: 84px 0 0 0;
        background: var(--pk-surface-page);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 28px;
        font-size: 15px;
        line-height: 22px;
      }
      .browser .bc .lockup {
        margin-bottom: 16px;
      }
      /* terminal: follows the user's terminal theme */
      .win.term {
        background: #15161c;
        color: #d6d8e0;
      }
      [data-theme="light"] .win.term {
        background: #fbfbfd;
        color: #2a2c35;
      }
      .term .tb {
        background: transparent;
      }
      .term .tt {
        color: #8b8fa0;
      }
      .term .tc {
        margin: 0;
        padding: 10px 20px;
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 21px;
        white-space: pre;
      }
      .tc .mute {
        color: #7d8296;
      }
      .tc .strong {
        color: #ffffff;
        font-weight: 600;
      }
      [data-theme="light"] .tc .strong {
        color: #000;
      }
      .tc .acc {
        color: #4fd8c4;
      }
      [data-theme="light"] .tc .acc {
        color: #0b7d70;
      }
      .tc .ok {
        color: #5ad27f;
      }
      [data-theme="light"] .tc .ok {
        color: #1d8a45;
      }
      .tc .lnk {
        color: #7ab8ff;
        text-decoration: underline;
      }
      [data-theme="light"] .tc .lnk {
        color: #1f5fbf;
      }
      .tc .tchip {
        background: #0f8075;
        color: #fff;
        border-radius: 3px;
      }
      .tc .rev {
        background: #e8e9ee;
        color: #111;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      [data-theme="light"] .tc .rev {
        background: #1d1f27;
        color: #fff;
      }
      .tc .cur {
        background: currentColor;
      }

      /* ---------- in-app desktop content (kit, desktop density) ---------- */
      .desk h2 {
        margin: 0;
        font-size: 19px;
        line-height: 24px;
        font-weight: 700;
        color: var(--pk-text-strong);
        letter-spacing: -0.005em;
      }
      .desk h2.big {
        font-size: 24px;
        line-height: 30px;
      }
      .desk p {
        color: var(--pk-text-muted);
        font-size: 13px;
        line-height: 19px;
      }
      .desk p b {
        color: var(--pk-text-strong);
      }
      .desk .fine {
        font-size: 12px;
        line-height: 17px;
        color: var(--pk-text-subtle);
        display: flex;
        gap: 6px;
      }
      .desk .fine svg {
        width: 13px;
        height: 13px;
        flex: none;
        margin-top: 2px;
      }
      .dk-head {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--pk-text-strong);
        font-size: 13px;
      }
      .dk-head .icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        overflow: hidden;
        flex: none;
      }
      .dk-head b {
        font-weight: 600;
      }
      .desk .who {
        font-size: 12.5px;
        color: var(--pk-text-muted);
      }
      .db {
        height: 28px;
        padding: 0 14px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        border: 1px solid transparent;
        color: var(--pk-text-strong);
      }
      .db svg {
        width: 14px;
        height: 14px;
      }
      .db.primary {
        background: var(--pk-accent);
        color: var(--pk-accent-on);
      }
      .db.secondary {
        background: color-mix(in oklab, var(--pk-text-strong) 10%, transparent);
      }
      .db.danger {
        background: var(--pk-danger);
        color: var(--pk-danger-on);
      }
      .db.xl {
        height: 36px;
        padding: 0 20px;
        font-size: 14px;
        align-self: stretch;
      }
      .db.sm {
        height: 26px;
        padding: 0 10px;
        font-size: 12px;
      }
      .w11 .db,
      .w11 .db.xl {
        border-radius: 4px;
        height: 32px;
      }
      .w11 .db.secondary {
        background: var(--pk-surface-raised);
        border-color: var(--pk-border-subtle);
      }
      .gnome .db {
        border-radius: 8px;
        height: 34px;
      }
      .gnome .db.pill,
      .gnome .db.xl {
        border-radius: 999px;
      }
      .dk-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }
      .dk-foot .sp,
      .infobar .sp {
        flex: 1;
      }
      .dk-foot .link,
      .cb > .link {
        font-size: 13px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .dk-foot .link svg {
        width: 14px;
        height: 14px;
      }
      .wait {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--pk-text-muted);
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--pk-surface-sunken);
      }
      .wait .ring {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2.5px solid var(--pk-accent-fg);
        border-right-color: var(--pk-border-subtle);
        flex: none;
      }
      .dcode {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--pk-surface-sunken);
      }
      .dcode code {
        flex: 1;
        font-family: var(--mono);
        font-size: 30px;
        line-height: 38px;
        letter-spacing: 0.12em;
        font-weight: 500;
        color: var(--pk-text-strong);
      }
      .desk .link {
        color: var(--pk-accent-fg);
      }
      /* Welcome split window */
      .split {
        position: absolute;
        inset: 0;
        display: flex;
      }
      .split .art {
        width: 42%;
        margin: 10px 0 10px 10px;
        border-radius: 10px;
        overflow: hidden;
      }
      .split .pane {
        flex: 1;
        padding: 92px 72px 40px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .w11 .split .pane,
      .gnome .split .pane {
        padding-top: 60px;
      }
      .split.dimmed .pane {
        opacity: 0.4;
      }
      .hero-icon {
        width: 64px;
        height: 64px;
        border-radius: 15px;
        overflow: hidden;
        margin-bottom: 6px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      }
      .desk .or {
        font-size: 12px;
      }
      .dk-prov {
        display: flex;
        gap: 8px;
      }
      .dk-prov span {
        flex: 1;
        height: 36px;
        border-radius: 999px;
        border: 1px solid var(--pk-border-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--pk-text-strong);
      }
      .w11 .dk-prov span {
        border-radius: 4px;
      }
      .gnome .dk-prov span {
        border-radius: 8px;
      }
      .dk-prov svg {
        width: 18px;
        height: 18px;
      }
      .dk-links {
        display: flex;
        gap: 16px;
        font-size: 13px;
        color: var(--pk-text-muted);
        padding-top: 12px;
        border-top: 1px solid var(--hair);
      }
      .dk-links span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .dk-links svg {
        width: 14px;
        height: 14px;
      }
      /* license rows at desktop density */
      .desk .lic {
        padding: 12px;
        font-size: 13px;
        line-height: 18px;
        border-radius: 12px;
      }
      .desk .lic .ln {
        font-size: 13.5px;
      }
      .desk .tl,
      .desk .lm {
        font-size: 12px;
      }
      .desk .dk-rows {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .desk .lic .act .hint {
        font-size: 12px;
        color: var(--pk-text-subtle);
      }
      .desk .replace h2 {
        font-size: 13.5px;
      }
      .desk .dev {
        min-height: 52px;
        padding: 8px 12px;
      }
      .desk .dev .dn {
        font-size: 13px;
      }
      .desk .dev .dm {
        font-size: 12px;
      }
      .desk .confirm h3 {
        font-size: 13.5px;
      }
      .desk .confirm p {
        font-size: 12.5px;
        line-height: 18px;
        color: var(--pk-text-default);
      }
      .desk .notice {
        font-size: 13px;
        padding: 10px 12px;
      }
      /* signed-in main window */
      .appmain {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      .mac .appmain {
        padding-top: 40px;
      }
      .appmain .cols {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .appmain .side {
        width: 220px;
        padding: 10px;
        background: color-mix(
          in oklab,
          var(--pk-surface-page) 70%,
          transparent
        );
        border-right: 1px solid var(--hair);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .appmain .sh {
        font-size: 11px;
        font-weight: 600;
        color: var(--pk-text-subtle);
        padding: 6px 10px;
      }
      .appmain .si {
        padding: 6px 10px;
        border-radius: 7px;
        color: var(--pk-text-default);
      }
      .appmain .si.on {
        background: var(--pk-accent-subtle);
        color: var(--pk-accent-fg);
        font-weight: 500;
      }
      .appmain .canvas {
        flex: 1;
        padding: 28px 32px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .appmain .ct {
        font-size: 22px;
        font-weight: 700;
        color: var(--pk-text-strong);
      }
      .appmain .wave {
        width: 100%;
        height: 160px;
        fill: var(--pk-accent-fg);
        opacity: 0.8;
      }
      .appmain .knobs {
        display: flex;
        gap: 28px;
      }
      .knob {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        color: var(--pk-text-muted);
        font-size: 12px;
      }
      .knob i {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 3px solid var(--pk-border-strong);
        border-top-color: var(--pk-accent-fg);
      }
      .toast {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-radius: 999px;
        background: color-mix(
          in oklab,
          var(--pk-surface-overlay) 92%,
          transparent
        );
        border: 1px solid var(--pk-border-subtle);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        color: var(--pk-text-strong);
        font-weight: 500;
      }
      .toast svg {
        width: 16px;
        height: 16px;
        color: var(--pk-success);
      }
      .infobar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 12px 12px 0;
        padding: 10px 12px;
        border-radius: 4px;
        background: var(--pk-warning-subtle);
        border: 1px solid var(--pk-warning-border);
        color: var(--pk-text-default);
      }
      .infobar > svg {
        width: 16px;
        height: 16px;
        color: var(--pk-warning);
        flex: none;
      }
      .infobar b {
        color: var(--pk-text-strong);
        font-weight: 600;
      }
      /* Godot desktop export: the game owns the window; the kit panel sits on the art */
      .win.game .wc {
        overflow: hidden;
      }
      .gamebg {
        position: absolute;
        inset: 0;
      }
      .gtitle {
        position: absolute;
        left: 60px;
        top: 60px;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: 0.3em;
        color: #e9e1ff;
      }
      .gpanel {
        position: absolute;
        left: 50%;
        top: 52%;
        transform: translate(-50%, -50%);
        width: 500px;
        padding: 26px 28px 22px;
        border-radius: 16px;
        background: rgba(16, 12, 40, 0.88);
        border: 1px solid rgba(233, 225, 255, 0.16);
        display: flex;
        flex-direction: column;
        gap: 14px;
        --pk-accent: #7b6cf0;
        --pk-accent-fg: #b9aeff;
        --pk-accent-on: #fff;
        --pk-text-strong: #f4f1ff;
        --pk-text-muted: #b7b0d6;
        --pk-text-subtle: #9089b5;
        --pk-surface-sunken: rgba(0, 0, 0, 0.3);
        --pk-border-subtle: rgba(233, 225, 255, 0.16);

            <path
              fill="currentColor"
              d="M16.36 12.62c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.87-.76-1.47.02-2.83.86-3.59 2.18-1.53 2.66-.39 6.59 1.1 8.75.73 1.05 1.6 2.24 2.73 2.2 1.1-.05 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.3-.88-2.32-3.5zM14.18 6.15c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.68-.92 2.67.97.08 1.96-.49 2.56-1.22z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="p"
          aria-label="Continue with Google"
          title="Continue with Google"
        >
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="p"
          aria-label="Continue with Steam"
          title="Continue with Steam"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M11.98 0C5.68 0 .53 4.86.04 11.04l6.44 2.66a3.4 3.4 0 0 1 1.92-.59h.19l2.87-4.15v-.06a4.53 4.53 0 1 1 4.53 4.53h-.1l-4.08 2.92v.16a3.4 3.4 0 0 1-6.74.66L.4 15.4A12 12 0 1 0 11.98 0zM7.54 18.21l-1.47-.61a2.55 2.55 0 1 0 1.4-3.5l1.52.63a1.88 1.88 0 1 1-1.45 3.48zm11.42-9.3a3.02 3.02 0 1 0-6.04 0 3.02 3.02 0 0 0 6.04 0zm-5.28 0a2.27 2.27 0 1 1 4.54 0 2.27 2.27 0 0 1-4.54 0z"
            />
          </svg>
        </button>
      </div>
      <div class="links">
        <button type="button" class="plain" data-go="key" data-onramp="1">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="7.5" cy="15.5" r="3.5" />
            <path d="M10 13l8-8M15 8l3 3M17 6l2 2" />
          </svg>
          Have a license key?
        </button>
      </div>
    </template>

    <!-- 2. CodeStep -->
    <template id="t-code">
      <h1 tabindex="-1">Check your email</h1>
      <p class="lede">
        We sent a code and a sign-in link to <b>mara@fennick.studio</b>. Both
        work for 10 minutes.
      </p>
      <div>
        <label class="lab" for="code">Code</label>
        <div class="cells" data-cells>
          <input
            id="code"
            class="cell-input"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            aria-label="6-digit code"
          />
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
      <p class="small">Or open the link in the email. Keep this tab open.</p>
      <button
        type="button"
        class="btn primary"
        data-go="choose"
        data-needs-code
        disabled
      >
        <span class="lbl">Continue</span
        ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <div class="links">
        <span class="muted">Send a new code in 0:42</span>
        <button
          type="button"
          class="plain link"
          data-go="methods"
          data-dir="back"
        >
          Use a different email
        </button>
        <button type="button" class="plain link demo" data-action="demo-code">
          Type the demo code
        </button>
      </div>
    </template>

    <!-- 3. LicenseChoiceStep (skeleton first, then the rows stagger in) -->
    <template id="t-choose">
      <h1 tabindex="-1">Choose a license for this device</h1>
      <p class="lede">Tidewater Studio will use it on Mara's MacBook Pro.</p>
      <div
        class="rows"
        role="radiogroup"
        aria-label="Licenses for Tidewater Studio"
        data-rows
      >
        <div class="skel"><i></i><i></i><i></i></div>
        <div class="skel"><i></i><i></i><i></i></div>
      </div>
      <button
        type="button"
        class="btn primary"
        data-go="consent"
        data-busy="350"
      >
        <span class="lbl">Use this license and continue</span
        ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <div class="links">
        <button type="button" class="plain" data-go="key">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="7.5" cy="15.5" r="3.5" />
            <path d="M10 13l8-8M15 8l3 3M17 6l2 2" />
          </svg>
          Use a license key instead
        </button>
        <button type="button" class="plain" data-go="methods" data-dir="back">
          Cancel
        </button>
      </div>
    </template>
    <template id="t-rows">
      <div
        class="lic sel"
        role="radio"
        aria-checked="true"
        tabindex="0"
        data-lic="pro"
      >
        <div class="radio"></div>
        <div class="ln">Tidewater Studio</div>
        <span></span>
        <div class="tl">
          <span class="pill">Pro</span><span>2 of 3 devices</span>
        </div>
        <div class="lm">From Harbor Audio · Lifetime</div>
        <div class="meter" aria-hidden="true">
          <i class="on"></i><i class="on"></i><i></i>
        </div>
      </div>
      <div
        class="lic full"
        role="group"
        aria-label="Tidewater Studio Edu"
        aria-describedby="edu-full"
        data-lic="edu"
      >
        <div class="nosel" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="8.5" />
            <path d="M6 18L18 6" />
          </svg>
        </div>
        <div class="ln">Tidewater Studio</div>
        <span class="tag warn" id="edu-full">No free devices</span>
        <div class="tl">
          <span class="pill">Edu</span><span>2 of 2 devices</span>
        </div>
        <div class="lm">Key ending 3WPLDA · Until 12 Jun 2027</div>
        <div class="meter" aria-hidden="true">
          <i class="on"></i><i class="on"></i>
        </div>
        <div class="act">
          <button type="button" class="btn secondary inline" data-go="replace">
            Replace a device
          </button>
        </div>
      </div>
    </template>

    <!-- KeyStep: the on-ramp before sign-in, or "Use a license key instead" after it -->
    <template id="t-key">
      <h1 tabindex="-1" data-title-onramp="Have a license key?">
        Add a license key
      </h1>
      <p class="lede">
        Paste the key from your receipt email. It's used on this device.
      </p>
      <div>
        <label class="lab" for="key">License key</label>
        <input
          class="input field mono"
          id="key"
          autocomplete="off"
          spellcheck="false"
          placeholder="pkey_tidewater_…"
        />
        <div class="verdict" data-verdict hidden>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
          Key for Tidewater Studio
        </div>
      </div>
      <button
        type="button"
        class="btn primary"
        data-go="consent"
        data-busy="450"
        data-key-primary
      >
        <span class="lbl">Add and use on this device</span
        ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <div class="links">
        <button type="button" class="plain link" data-back>Back</button>
        <button type="button" class="plain link demo" data-action="demo-key">
          Paste the demo key
        </button>
      </div>
    </template>

    <!-- ReplaceDevice as a step: the device list replaces the license list; the confirm expands -->
    <template id="t-replace">
      <h1 tabindex="-1">Replace a device</h1>
      <div class="licsum">
        <div class="ln">Tidewater Studio</div>
        <div class="tl">
          <span class="pill">Edu</span><span>2 of 2 devices</span>
        </div>
        <div class="lm">Key ending 3WPLDA · Until 12 Jun 2027</div>
      </div>
      <p class="lede">
        Choose a device to sign out. Mara's MacBook Pro takes its seat.
      </p>
      <div
        class="devs"
        role="radiogroup"
        aria-label="Devices on Tidewater Studio Edu"
      >
        <div
          class="dev sel pk-stagger-1"
          role="radio"
          aria-checked="true"
          tabindex="0"
          data-dev="Work laptop"
        >
          <div class="radio"></div>
          <svg
            class="g"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <rect x="4" y="5" width="16" height="11" rx="1.5" />
            <path d="M2 19h20" />
          </svg>
          <div>
            <div class="dn">Work laptop</div>
            <div class="dm">Windows · last used 23 days ago</div>
          </div>
          <span class="tag">Least recent</span>
        </div>
        <div
          class="dev pk-stagger-2"
          role="radio"
          aria-checked="false"
          tabindex="-1"
          data-dev="Studio iMac"
        >
          <div class="radio"></div>
          <svg
            class="g"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="12" rx="1.5" />
            <path d="M9 20h6M12 16v4" />
          </svg>
          <div>
            <div class="dn">Studio iMac</div>
            <div class="dm">macOS · last used 4 minutes ago</div>
          </div>
          <span class="tag active">Active now</span>
        </div>
      </div>
      <div class="confirm" data-confirm hidden>
        <h3 data-confirm-title>Replace Work laptop?</h3>
        <p data-confirm-body>
          Work laptop signs out of Tidewater Studio and Mara's MacBook Pro takes
          its seat. Work laptop can sign in again later if a seat is free. We'll
          email you about it.
        </p>
        <p class="inuse" data-inuse hidden>Studio iMac is in use right now.</p>
        <button
          type="button"
          class="btn primary"
          data-go="consent"
          data-busy="450"
          data-replace
        >
          <span class="lbl">Replace and continue</span
          ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <button
          type="button"
          class="btn ghost"
          data-go="choose"
          data-dir="back"
        >
          Back
        </button>
      </div>
    </template>

    <!-- ConsentStep -->
    <template id="t-consent">
      <h1 tabindex="-1">Continue to Tidewater Studio as Mara?</h1>
      <div class="group-label">License for this device</div>
      <div class="lic chosen">
        <div class="ln" data-chosen>Tidewater Studio Pro</div>
        <button
          type="button"
          class="plain link"
          data-go="choose"
          data-dir="back"
        >
          Change
        </button>
        <div class="lm" data-chosen-meta>
          Lifetime · this Mac becomes device 3 of 3
        </div>
      </div>
      <div class="group-label">Tidewater Studio will also get</div>
      <div class="items">
        <div class="item pk-stagger-1">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path
              d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"
            />
          </svg>
          <div class="in">Cloud Sync</div>
          <div class="im">Your presets, templates and preferences</div>
        </div>
        <div class="item pk-stagger-2">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c1-4 4-6 8-6s7 2 8 6" />
          </svg>
          <div class="in">Your profile and email</div>
          <div class="im">Mara Fennick, your picture · mara@fennick.studio</div>
        </div>
      </div>
      <p class="small">
        It gets its own id for you, and won't see your other products or how you
        sign in.
      </p>
      <button type="button" class="btn primary" data-go="done" data-busy="600">
        <span class="lbl">Continue to Tidewater Studio</span
        ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <button type="button" class="btn ghost" data-go="methods" data-dir="back">
        Cancel
      </button>
    </template>

    <!-- ReturnStep (desktop): the success moment -->
    <template id="t-done">
      <div class="success" aria-hidden="true">
        <span class="spark s1"></span><span class="spark s2"></span
        ><span class="spark s3"></span> <span class="spark s4"></span
        ><span class="spark s5"></span><span class="spark s6"></span>
        <div class="success-mark">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path class="draw" d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
        </div>
      </div>
      <h1 class="center" tabindex="-1">You're signed in to Tidewater Studio</h1>
      <p class="lede center">
        You can close this tab and return to Tidewater Studio.
      </p>
      <div class="person-note" data-done-license>
        Tidewater Studio Pro · Lifetime · device 3 of 3
      </div>
      <button type="button" class="btn primary">
        Return to Tidewater Studio
      </button>
      <p class="small center"><span class="link">Open your library</span></p>
    </template>
  </body>
</html>
