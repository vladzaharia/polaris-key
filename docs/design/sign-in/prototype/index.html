<!doctype html>
<!--
  The integrated web flow (SIGN-IN.md §4.16) as a clickable, animated prototype, with the motion
  of SIGN-IN.md §3.18. It follows the Worker's strict CSP: one external stylesheet and one external
  script, no inline <script>, no style attributes, no inline handlers. Steps are <template>s that
  proto.js clones into the one card. Open this file in a browser; ?theme=light and ?motion=reduce
  set the starting state. A static design reference, not shipped code.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:"
    />
    <title>Sign in · Polaris Key (prototype)</title>
    <link rel="stylesheet" href="proto.css" />
    <script src="proto.js" defer></script>
  </head>
  <body>
    <nav class="proto-bar" aria-label="Prototype controls">
      <span class="proto-title">Integrated web flow · prototype</span>
      <span class="proto-step" id="proto-step">Sign in</span>
      <span class="sp"></span>
      <button type="button" class="proto-btn" data-action="theme">
        Light theme
      </button>
      <button
        type="button"
        class="proto-btn"
        data-action="motion"
        aria-pressed="false"
      >
        Reduce motion
      </button>
      <button type="button" class="proto-btn" data-action="restart">
        Start over
      </button>
    </nav>

    <main class="stage">
      <div class="lockup">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M3 4 L9 1 L9 19 L3 22 Z" />
          <path fill="currentColor" d="M11 12 L15 12 L21 18 L18 21 L11 14 Z" />
          <path
            fill="currentColor"
            d="M17 1 L19 4 L23 6 L19 8 L17 11 L15 8 L11 6 L15 4 Z"
          />
        </svg>
        <span class="word">Polaris Key</span>
      </div>

      <section class="card" id="card">
        <header class="card-head" id="head">
          <div class="icon">
            <svg viewBox="0 0 52 52" aria-hidden="true">
              <rect width="52" height="52" fill="#0f2a33" />
              <path d="M0 22c9-4 17 4 26 0s17-4 26 0v30H0z" fill="#16525a" />
              <path d="M0 30c9-4 17 4 26 0s17-4 26 0v22H0z" fill="#f2c9a0" />
              <path d="M0 37c9-4 17 4 26 0s17-4 26 0v15H0z" fill="#f08a68" />
            </svg>
          </div>
          <div>
            <div class="t"><b>Tidewater Studio</b> wants you to sign in</div>
            <div class="w">
              Harbor Audio<span>·</span>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <rect x="4" y="5" width="16" height="11" rx="1.5" />
                <path d="M2 19h20" />
              </svg>
              <span>on Mara's MacBook Pro</span>
            </div>
          </div>
        </header>

        <div class="body">
          <div class="person" id="person" hidden>
            <div class="avatar">MF</div>
            <div>
              <div class="n">Mara Fennick</div>
              <div class="e">mara@fennick.studio</div>
            </div>
            <button
              type="button"
              class="x link plain"
              data-go="methods"
              data-dir="back"
            >
              Not you?
            </button>
          </div>
          <div class="step" id="step" aria-live="polite"></div>
        </div>

        <footer class="card-foot" id="foot">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <rect x="5" y="11" width="14" height="9" rx="2" />
            <path d="M8 11V8a4 4 0 0 1 8 0v3" />
          </svg>
          <span
            >Polaris Key signs you in for Tidewater Studio. Harbor Audio never
            sees your codes or passkeys.</span
          >
        </footer>
      </section>
      <div class="below">Help · Privacy · Terms</div>
    </main>

    <!-- 1. MethodsStep -->
    <template id="t-methods">
      <h1 tabindex="-1">Sign in</h1>
      <p class="lede">Use the email you bought Tidewater Studio with.</p>
      <div>
        <label class="lab" for="email">Email</label>
        <input
          class="input field"
          id="email"
          type="email"
          autocomplete="username webauthn"
          value="mara@fennick.studio"
        />
      </div>
      <button type="button" class="btn primary" data-go="code" data-busy="500">
        <span class="lbl">Continue</span
        ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <div class="or">or</div>
      <div class="providers" role="group" aria-label="Or continue with">
        <button
          type="button"
          class="p"
          aria-label="Continue with Apple"
          title="Continue with Apple"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M16.36 12.62c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.87-.76-1.47.02-2.83.86-3.59 2.18-1.53 2.66-.39 6.59 1.1 8.75.73 1.05 1.6 2.24 2.73 2.2 1.1-.05 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.3-.88-2.32-3.5zM14.18 6.15c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.68-.92 2.67.97.08 1.96-.49 2.56-1.22z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="p"
          aria-label="Continue with Google"
          title="Continue with Google"
        >
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="p"
          aria-label="Continue with Steam"
          title="Continue with Steam"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M11.98 0C5.68 0 .53 4.86.04 11.04l6.44 2.66a3.4 3.4 0 0 1 1.92-.59h.19l2.87-4.15v-.06a4.53 4.53 0 1 1 4.53 4.53h-.1l-4.08 2.92v.16a3.4 3.4 0 0 1-6.74.66L.4 15.4A12 12 0 1 0 11.98 0zM7.54 18.21l-1.47-.61a2.55 2.55 0 1 0 1.4-3.5l1.52.63a1.88 1.88 0 1 1-1.45 3.48zm11.42-9.3a3.02 3.02 0 1 0-6.04 0 3.02 3.02 0 0 0 6.04 0zm-5.28 0a2.27 2.27 0 1 1 4.54 0 2.27 2.27 0 0 1-4.54 0z"
            />
          </svg>
        </button>
      </div>
      <div class="links">
        <button type="button" class="plain" data-go="key" data-onramp="1">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="7.5" cy="15.5" r="3.5" />
            <path d="M10 13l8-8M15 8l3 3M17 6l2 2" />
          </svg>
          Have a license key?
        </button>
      </div>
    </template>

    <!-- 2. CodeStep -->
    <template id="t-code">
      <h1 tabindex="-1">Check your email</h1>
      <p class="lede">
        We sent a code and a sign-in link to <b>mara@fennick.studio</b>. Both
        work for 10 minutes.
      </p>
      <div>
        <label class="lab" for="code">Code</label>
        <div class="cells" data-cells>
          <input
            id="code"
            class="cell-input"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            aria-label="6-digit code"
          />
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
      <p class="small">Or open the link in the email. Keep this tab open.</p>
      <button
        type="button"
        class="btn primary"
        data-go="choose"
        data-needs-code
        disabled
      >
        <span class="lbl">Continue</span
        ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <div class="links">
        <span class="muted">Send a new code in 0:42</span>
        <button
          type="button"
          class="plain link"
          data-go="methods"
          data-dir="back"
        >
          Use a different email
        </button>
        <button type="button" class="plain link demo" data-action="demo-code">
          Type the demo code
        </button>
      </div>
    </template>

    <!-- 3. LicenseChoiceStep (skeleton first, then the rows stagger in) -->
    <template id="t-choose">
      <h1 tabindex="-1">Choose a license for this device</h1>
      <p class="lede">Tidewater Studio will use it on Mara's MacBook Pro.</p>
      <div
        class="rows"
        role="radiogroup"
        aria-label="Licenses for Tidewater Studio"
        data-rows
      >
        <div class="skel"><i></i><i></i><i></i></div>
        <div class="skel"><i></i><i></i><i></i></div>
      </div>
      <button
        type="button"
        class="btn primary"
        data-go="consent"
        data-busy="350"
      >
        <span class="lbl">Use this license and continue</span
        ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <div class="links">
        <button type="button" class="plain" data-go="key">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="7.5" cy="15.5" r="3.5" />
            <path d="M10 13l8-8M15 8l3 3M17 6l2 2" />
          </svg>
          Use a license key instead
        </button>
        <button type="button" class="plain" data-go="methods" data-dir="back">
          Cancel
        </button>
      </div>
    </template>
    <template id="t-rows">
      <div
        class="lic sel"
        role="radio"
        aria-checked="true"
        tabindex="0"
        data-lic="pro"
      >
        <div class="radio"></div>
        <div class="ln">Tidewater Studio</div>
        <span></span>
        <div class="tl">
          <span class="pill">Pro</span><span>2 of 3 devices</span>
        </div>
        <div class="lm">From Harbor Audio · Lifetime</div>
        <div class="meter" aria-hidden="true">
          <i class="on"></i><i class="on"></i><i></i>
        </div>
      </div>
      <div
        class="lic full"
        role="group"
        aria-label="Tidewater Studio Edu"
        aria-describedby="edu-full"
        data-lic="edu"
      >
        <div class="nosel" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="8.5" />
            <path d="M6 18L18 6" />
          </svg>
        </div>
        <div class="ln">Tidewater Studio</div>
        <span class="tag warn" id="edu-full">No free devices</span>
        <div class="tl">
          <span class="pill">Edu</span><span>2 of 2 devices</span>
        </div>
        <div class="lm">Key ending 3WPLDA · Until 12 Jun 2027</div>
        <div class="meter" aria-hidden="true">
          <i class="on"></i><i class="on"></i>
        </div>
        <div class="act">
          <button type="button" class="btn secondary inline" data-go="replace">
            Replace a device
          </button>
        </div>
      </div>
    </template>

    <!-- KeyStep: the on-ramp before sign-in, or "Use a license key instead" after it -->
    <template id="t-key">
      <h1 tabindex="-1" data-title-onramp="Have a license key?">
        Add a license key
      </h1>
      <p class="lede">
        Paste the key from your receipt email. It's used on this device.
      </p>
      <div>
        <label class="lab" for="key">License key</label>
        <input
          class="input field mono"
          id="key"
          autocomplete="off"
          spellcheck="false"
          placeholder="pkey_tidewater_…"
        />
        <div class="verdict" data-verdict hidden>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
          Key for Tidewater Studio
        </div>
      </div>
      <button
        type="button"
        class="btn primary"
        data-go="consent"
        data-busy="450"
        data-key-primary
      >
        <span class="lbl">Add and use on this device</span
        ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <div class="links">
        <button type="button" class="plain link" data-back>Back</button>
        <button type="button" class="plain link demo" data-action="demo-key">
          Paste the demo key
        </button>
      </div>
    </template>

    <!-- ReplaceDevice as a step: the device list replaces the license list; the confirm expands -->
    <template id="t-replace">
      <h1 tabindex="-1">Replace a device</h1>
      <div class="licsum">
        <div class="ln">Tidewater Studio</div>
        <div class="tl">
          <span class="pill">Edu</span><span>2 of 2 devices</span>
        </div>
        <div class="lm">Key ending 3WPLDA · Until 12 Jun 2027</div>
      </div>
      <p class="lede">
        Choose a device to sign out. Mara's MacBook Pro takes its seat.
      </p>
      <div
        class="devs"
        role="radiogroup"
        aria-label="Devices on Tidewater Studio Edu"
      >
        <div
          class="dev sel pk-stagger-1"
          role="radio"
          aria-checked="true"
          tabindex="0"
          data-dev="Work laptop"
        >
          <div class="radio"></div>
          <svg
            class="g"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <rect x="4" y="5" width="16" height="11" rx="1.5" />
            <path d="M2 19h20" />
          </svg>
          <div>
            <div class="dn">Work laptop</div>
            <div class="dm">Windows · last used 23 days ago</div>
          </div>
          <span class="tag">Least recent</span>
        </div>
        <div
          class="dev pk-stagger-2"
          role="radio"
          aria-checked="false"
          tabindex="-1"
          data-dev="Studio iMac"
        >
          <div class="radio"></div>
          <svg
            class="g"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="12" rx="1.5" />
            <path d="M9 20h6M12 16v4" />
          </svg>
          <div>
            <div class="dn">Studio iMac</div>
            <div class="dm">macOS · last used 4 minutes ago</div>
          </div>
          <span class="tag active">Active now</span>
        </div>
      </div>
      <div class="confirm" data-confirm hidden>
        <h3 data-confirm-title>Replace Work laptop?</h3>
        <p data-confirm-body>
          Work laptop signs out of Tidewater Studio and Mara's MacBook Pro takes
          its seat. Work laptop can sign in again later if a seat is free. We'll
          email you about it.
        </p>
        <p class="inuse" data-inuse hidden>Studio iMac is in use right now.</p>
        <button
          type="button"
          class="btn primary"
          data-go="consent"
          data-busy="450"
          data-replace
        >
          <span class="lbl">Replace and continue</span
          ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <button
          type="button"
          class="btn ghost"
          data-go="choose"
          data-dir="back"
        >
          Back
        </button>
      </div>
    </template>

    <!-- ConsentStep -->
    <template id="t-consent">
      <h1 tabindex="-1">Continue to Tidewater Studio as Mara?</h1>
      <div class="group-label">License for this device</div>
      <div class="lic chosen">
        <div class="ln" data-chosen>Tidewater Studio Pro</div>
        <button
          type="button"
          class="plain link"
          data-go="choose"
          data-dir="back"
        >
          Change
        </button>
        <div class="lm" data-chosen-meta>
          Lifetime · this Mac becomes device 3 of 3
        </div>
      </div>
      <div class="group-label">Tidewater Studio will also get</div>
      <div class="items">
        <div class="item pk-stagger-1">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path
              d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"
            />
          </svg>
          <div class="in">Cloud Sync</div>
          <div class="im">Your presets, templates and preferences</div>
        </div>
        <div class="item pk-stagger-2">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c1-4 4-6 8-6s7 2 8 6" />
          </svg>
          <div class="in">Your profile and email</div>
          <div class="im">Mara Fennick, your picture · mara@fennick.studio</div>
        </div>
      </div>
      <p class="small">
        It gets its own id for you, and won't see your other products or how you
        sign in.
      </p>
      <button type="button" class="btn primary" data-go="done" data-busy="600">
        <span class="lbl">Continue to Tidewater Studio</span
        ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <button type="button" class="btn ghost" data-go="methods" data-dir="back">
        Cancel
      </button>
    </template>

    <!-- ReturnStep (desktop): the success moment -->
    <template id="t-done">
      <div class="success" aria-hidden="true">
        <span class="spark s1"></span><span class="spark s2"></span
        ><span class="spark s3"></span> <span class="spark s4"></span
        ><span class="spark s5"></span><span class="spark s6"></span>
        <div class="success-mark">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path class="draw" d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
        </div>
      </div>
      <h1 class="center" tabindex="-1">You're signed in to Tidewater Studio</h1>
      <p class="lede center">
        You can close this tab and return to Tidewater Studio.
      </p>
      <div class="person-note" data-done-license>
        Tidewater Studio Pro · Lifetime · device 3 of 3
      </div>
      <button type="button" class="btn primary">
        Return to Tidewater Studio
      </button>
      <p class="small center"><span class="link">Open your library</span></p>
    </template>
  </body>
</html>
