# polaris-key/publish (P2-06): publish a release to Polaris Key from a GitHub Actions job.
#
# The job needs `permissions: id-token: write` (and `contents: read`): the Action exchanges the
# job's OIDC token for a short-lived pkeyci_ token, so the repository stores no secret. It never
# builds, signs binaries or uploads to stores; run your export and vendor tools first, then this.
#
# Until the Action is listed as polaris-key/publish@v1, reference it by commit:
#   uses: vladzaharia/polaris-key/actions/publish@<sha>
#
# Guide: /docs/build/ci/ on the docs site (packages/docs/src/content/docs/build/ci.md).
name: Polaris Key publish
description: Match built files against .pkey/release, upload them and submit the release descriptor (or a pack's signed release record) to Polaris Key.
author: Polaris Key
branding:
  icon: upload-cloud
  color: blue
inputs:
  product:
    description: The product slug (must equal .pkey/product's slug).
    required: true
  deliverable:
    description: The deliverable to publish. `app`, a pack id .pkey/release declares (a pack release, signed with release-key; needs zstd >= 1.5.5, which GitHub's hosted runners carry), or a package id (a package release for a package feed, extracted from dir and never signed).
    required: false
    default: app
  version:
    description: The release version. Defaults to `tag` without a leading `v`.
    required: false
  tag:
    description: The git tag (also the release id) — on a tag push, the github.ref_name context.
    required: false
  channel:
    description: The canonical channel the release is published to (stable, beta or a declared one).
    required: false
  dir:
    description: The directory of built files, searched recursively, relative to the workspace. For a pack, each declared variant's payload sits at <dir>/<variant key or "default">/ (one .pck file, or the tree).
    required: true
  source:
    description: App only. Where the bytes live. `r2` (the default) uploads them to Polaris Key; `github` locates them on the tagged, immutable GitHub release. No `default:` here on purpose, because GitHub passes every defaulted input, and a package publish or a transport step refuses this one; the Action applies `r2` for the app itself.
    required: false
  meta:
    description: 'A JSON file {"<buildId>": {"buildNumber", "minOS", "requires"}}, relative to the workspace.'
    required: false
  base-url:
    description: The Polaris Key origin.
    required: false
    default: https://key.plrs.im
  release-key:
    description: The release key's PKCS#8 PEM, from a GitHub Environment secret (secrets.PKEY_RELEASE_KEY). With it the Action signs the release record (pkey-release+jws) under the .pkey/release releaseKeys entry it matches. Required when .pkey/release declares releaseKeys. Never logged or sent.
    required: false
  content-key:
    description: P4-19, pack only. A delegated content key's PKCS#8 PEM, from the content team's GitHub Environment secret (secrets.PKEY_CONTENT_KEY). With delegation, the Action signs the pack record under the kid pkd1-<delegation sha256> instead of a release key; the pack must be a data-only type (files.tree, data.json, l10n.table) with a compatible or standalone binding, inside the delegation's scope and window, and every file must pass the data-only rule. Exclusive of release-key. Never logged or sent.
    required: false
  delegation:
    description: P4-19, pack only. With content-key, the sha256 of the delegation record that names the key (pkey release delegate prints it).
    required: false
  min-supported-seq:
    description: The release record's minSupportedSeq — the oldest release seq installs on the platforms this release targets should be prompted up to.
    required: false
  content-stamp:
    description: App only, when .pkey/release declares packs. The pkey-content.json stamp the build embedded (written by pkey release content-stamp before the export); it becomes the release's content.
    required: false
  embedded:
    description: App only. Instead of content-stamp, compute the content from the pkey-marker/1 markers under this directory (verified against releaseKeys).
    required: false
  pins:
    description: App only. Pins for packs the build does not embed, as <packId>@<version> entries separated by spaces, commas or newlines; resolved through Polaris Key.
    required: false
  out:
    description: Pack only. Keep the signed record and the payloads at <out>/<packId>/<version>/ for the next publish's bases (cache it with actions/cache, keyed by pack id).
    required: false
  bases:
    description: Pack only. Read earlier releases kept by out; the patch.deltaBases newest whose record Polaris Key confirms get deltas.
    required: false
  script-extensions:
    description: Pack only (godot.pck). P4-28. Extensions the lint refuses as scripts beside .gd, .gdc and .cs, for an app with a GDExtension script language (lua, wren), separated by spaces, commas or newlines. The device asks its engine; this makes CI refuse the same packs.
    required: false
  script-types:
    description: Pack only (godot.pck). P4-28. That language's script class names (LuaScript), refused as embedded-script markers and treated as script types in references, separated by spaces, commas or newlines.
    required: false
  dry-run:
    description: Upload, sign and write no release. For the app, print the descriptor, the unsigned record and the server's verdict on a dry-run submit; for a pack, print the lint, the gate, the objects (new and already stored), the bytes per strategy and the unsigned record, with no server verdict (nothing is submitted). Either way it still mints upload tickets (for a pack, one per 256 objects), which expire within the hour.
    required: false
    default: "false"
  transport:
    description: P5-08, pack only. Instead of publishing, run one store-transport step for the pack release `version` published earlier, whose publish `out` cache is `dir`. One of apple-ba-package (Manifest.json for asset pack <pack>-c<contentApi> and xcrun ba-package; a macOS runner), apple-ba-upload (App Store Connect, with ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY from secrets in the step's env; `dir` is then the package step's transport-out; commit the .pkey/asset-packs.json it writes on the first upload), play-pad-modules (Play asset-pack modules into gradle-project) or steam-depot-vdf (a content-only SteamPipe build for steamcmd). Each writes the pack's marker beside the payload and reports the transport's availability to Distribution.
    required: false
  content-api:
    description: P5-08, apple-ba steps. The content level the asset pack is for (its id is <pack>-c<content-api>). Defaults to .pkey/release's deliverables.app.content.contentApi.
    required: false
  variant:
    description: P5-08, transport steps. The published variant to package (its key, e.g. texture=astc) when the pack varies by an axis the transport cannot target (play-pad targets texture itself).
    required: false
  transport-out:
    description: P5-08, apple-ba-package and steam-depot-vdf. Where to write the asset pack or the SteamPipe build (default build/pkey-transport/apple-ba or build/pkey-transport/steam).
    required: false
  gradle-project:
    description: P5-08, play-pad-modules. The Godot Android Gradle build (android/build) the modules are written into and patched.
    required: false
  pad-delivery:
    description: P5-08, play-pad-modules. fast-follow or on-demand (default fast-follow for essential and prefetch packs, on-demand otherwise).
    required: false
  steam-depot:
    description: P5-08, steam-depot-vdf. The pack's depot id (a DLC depot for a paid pack).
    required: false
  steam-branch:
    description: P5-08, steam-depot-vdf. The Steam branch; default the steam outlet's branches[channel].
    required: false
  steam-setlive:
    description: P5-08, steam-depot-vdf. true sets the build live on a named branch (never the default branch, which a person promotes in Steamworks).
    required: false
  asc-expect-resource:
    description: P5-08, apple-ba-upload. The asset pack's App Store Connect resource id, to adopt an asset pack .pkey/asset-packs.json does not record yet.
    required: false
  transport-report:
    description: P5-08, transport steps. false writes everything and reports nothing to Distribution.
    required: false
    default: "true"
outputs:
  release-id:
    description: The release id (the tag, else `<deliverable>@<version>`).
  outcome:
    description: The submit's outcome — `created`, `enriched` or `unchanged` (on a dry run, the outcome the submit would have).
runs:
  using: node24
  main: dist/index.js
