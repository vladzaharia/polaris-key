# polaris-key/publish (P2-06, v2 in A-25.5): run a pkey command from a GitHub Actions job; by default,
# publish a release to Polaris Key and then sync its delivery channels.
#
# Eight inputs, nothing else: the command and its flags (`command`, `args`), the two signing keys,
# the origin, the directory, `dry-run` and `channels`. Every other flag goes in `args`, and the
# product comes from .pkey/product. Any other `with:` key fails the step before it does anything
# (GitHub forwards undeclared keys), naming the flag that replaces it; the 0.9 upgrade page lists them.
#
#   - uses: vladzaharia/polaris-key/actions/publish@<sha>
#     with:
#       args: --tag ${{ github.ref_name }} --channel beta --dir dist
#       release-key: ${{ secrets.PKEY_RELEASE_KEY }}
#
# The job needs `permissions: id-token: write` (and `contents: read`): the Action exchanges the
# job's OIDC token for a short-lived pkeyci_ token, so the repository stores no secret. It never
# builds, signs binaries or uploads to stores itself; run your export and vendor tools first, then
# this. `channels: auto` runs `pkey channel sync` after a successful app release publish (a pack
# or package publish never syncs); channels whose secret is not in the step's env are skipped.
#
# Until the Action is listed as polaris-key/publish@v1, reference it by commit:
#   uses: vladzaharia/polaris-key/actions/publish@<sha>
#
# Guide: /docs/build/ci/ on the docs site (packages/docs/src/content/docs/build/ci.md).
name: Polaris Key publish
description: Run a pkey command from CI, by default publish a release to Polaris Key and sync its channels.
author: Polaris Key
branding:
  icon: upload-cloud
  color: blue
inputs:
  command:
    description: The pkey command to run, as typed after `pkey` (for example `release publish`, `channel sync`, `assets push`).
    required: false
    default: release publish
  args:
    description: The command's flags and arguments, split on whitespace and newlines; single and double quotes group. No shell, no variable or glob expansion. The product is read from .pkey/product.
    required: false
  release-key:
    description: The release key's PKCS#8 PEM, from a GitHub Environment secret (secrets.PKEY_RELEASE_KEY). Passed to the command as PKEY_RELEASE_KEY, never on argv, never logged or sent.
    required: false
  content-key:
    description: A delegated content key's PKCS#8 PEM, for a data-only pack release (secrets.PKEY_CONTENT_KEY). Passed to the command as PKEY_CONTENT_KEY, never on argv, never logged or sent.
    required: false
  base-url:
    description: The Polaris Key origin (PKEY_BASE_URL). Default key.plrs.im.
    required: false
  working-directory:
    description: The directory the command runs in, relative to the workspace. Default the workspace.
    required: false
  dry-run:
    description: Appends --dry-run. A release publish uploads nothing and writes no release; the channel sync prints its plan and runs no step.
    required: false
    default: "false"
  channels:
    description: "`auto` runs `pkey channel sync` once after a successful app `release publish`; `none` does not."
    required: false
    default: auto
outputs:
  release-id:
    description: The release id (the tag, else `<deliverable>@<version>`), from `release publish`.
  outcome:
    description: The submit's outcome — `created`, `enriched` or `unchanged` (on a dry run, the outcome the submit would have), from `release publish`.
runs:
  using: node24
  main: dist/index.js
