name: Release Python SDK

on:
  push:
    tags:
      - "python-v*"

# Least privilege at the top level, matching ci.yml. The single write scope this workflow
# needs (`id-token: write`, for PyPI Trusted Publishing) is escalated on the `publish` job
# and nowhere else.
permissions:
  contents: read

jobs:
  # B6-07: this job installs `sdks/python[dev]` — pytest, click, typer, cryptography, httpx
  # and their whole transitive closure — unpinned and unhashed, then runs their code. That
  # is acceptable here and only here, because this job holds NO credential: no `id-token`,
  # no write scope, no environment. It is deliberately separated from `publish` below so
  # that a compromised test dependency cannot reach the PyPI Trusted Publishing identity.
  test:
    name: Test Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # BLUE-MG-1: only the canonical repo releases. A fork that pushes a `python-v*` tag
    # runs nothing.
    if: github.repository == 'vladzaharia/polaris-key'
    permissions:
      contents: read
    steps:
      # Nothing here needs to talk to git after checkout, so do not leave the token in
      # .git/config while third-party package code runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate tag matches package version
        working-directory: sdks/python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "python-v$VERSION" ]; then
            echo "Tag $TAG does not match pyproject version $VERSION" >&2
            exit 1
          fi
      - name: Test
        working-directory: sdks/python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -m pytest -q

  # B6-07: the credential-holding job. `id-token: write` here is a live PyPI publishing
  # identity for `polaris-key` — anything that executes in this job can mint a token and
  # push a release under that name. So this job runs the smallest possible amount of code:
  #
  #   * no `pip install -e ".[dev]"`, no pytest, no test dependencies (that is `test`);
  #   * no `pip install --upgrade pip` — that is an unpinned install of the installer;
  #   * build tooling comes only from .github/requirements-build.txt under
  #     `--require-hashes`, which refuses anything unpinned, unhashed, or transitively
  #     unlisted;
  #   * `python -m build --no-isolation`, so pip does not fetch and execute the hatchling
  #     backend unpinned into a throwaway venv — the hashed copy installed above is used.
  publish:
    name: Publish Python SDK to PyPI
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'vladzaharia/polaris-key'
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-pinned build tooling
        run: python -m pip install --require-hashes -r .github/requirements-build.txt
      - name: Build
        working-directory: sdks/python
        run: python -m build --no-isolation
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdks/python/dist/
