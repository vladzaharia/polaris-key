name: Release Python SDK

# A `python-vX.Y.Z` tag publishes the wheel and the sdist of `polaris-key` to Polaris Key's PyPI
# feed on pkg.plrs.im (deliverable pypi.polaris-key, F-10, plans/F-01.md §5.1), through
# publish-package.yml, the polaris-key product's trusted publisher. The CLI extracts each wheel's
# METADATA as its PEP 658 core-metadata file.
#
# Nothing goes to PyPI any more (owner decision 2026-10-04, feeds only): the releases already on
# PyPI stay there and keep the name, and new versions are on the feed only. Install:
# /docs/build/install-from-feeds/.

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Python SDK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Validate tag matches package version
        id: version
        working-directory: sdks/python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "python-v$VERSION" ]; then
            echo "Tag $TAG does not match pyproject version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test
        working-directory: sdks/python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -m pytest -q
      - name: Build
        working-directory: sdks/python
        run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: sdks/python/dist/
          if-no-files-found: error

  publish:
    name: PyPI feed
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      deliverable: pypi.polaris-key
      artifact: python-dist
      version: ${{ needs.build.outputs.version }}
