name: Publish a package to its feed

# The one publishing step for every SDK this repository ships (F-10, plans/F-01.md §5.1).
# publish-sdks.yml builds, version-stamps and packs each SDK, uploads its files as a workflow
# artifact, and calls this workflow once per package deliverable, which publishes them with
# `pkey release publish` (the committed polaris-key/publish Action at the commit being published)
# to the system product `polaris-key`. The feeds serve them on pkg.plrs.im, and NOWHERE else: no
# npmjs, GitHub Packages, PyPI, Maven Central, Swift Package Index, Docker Hub or Godot store
# (owner decision 2026-10-04, feeds only).
#
# Trusted publishing (P2-02): this file is the polaris-key product's one trusted publisher
# (.pkey/release `publishing.trustedPublisher`). GitHub names a called workflow in the OIDC
# token's job_workflow_ref, so every caller publishes through this one policy, and the job runs in
# the `package-registry` environment. The job exchanges its OIDC token for a short-lived pkeyci_
# token; the repository stores no publishing secret. The trusted publisher itself is registered
# automatically: deploy.yml's "Register the platform packages" step applies the root .pkey/ on
# every production deploy (the deploy hook, packages/worker/src/platformDeploy.ts).
#
# Publishes happen from two refs only (owner decision 2026-10-04): a push to main (a prerelease of
# the next version on the `main` channel) and a v* release tag (that version, on `stable`, or
# `beta` for a prerelease tag). Owner setup (DEPLOYMENT §3, "Registry host and feeds"): the
# `package-registry` environment with a deployment policy admitting the `main` branch and `v*`
# tags, and branch protection on main plus a tag ruleset on v* (the publisher requires
# ref_protected).
#
# One exception, npm only (P0-52): npm-repair.yml, dispatched by hand on main, backfills an npm
# package at the version of an existing release tag whose own run never published it. It passes
# `release-tag`; the job then publishes exactly that tag's version, on that tag's channel, only
# from a manual dispatch on main and only when the tag is on main.
#
# Before an npm package is published, the job waits until the feed lists every @polaris-key
# version the packed tarball pins (tools/feed-closure.mjs requires), so no version on the feed can
# pin a sibling the feed does not have, whatever order a caller runs its legs in.

on:
  workflow_call:
    inputs:
      deliverable:
        description: The package deliverable .pkey/release declares (npm.node, pypi.polaris-key, …).
        required: true
        type: string
      artifact:
        description: The workflow artifact holding the packed files (uploaded by the caller in the same run).
        required: true
        type: string
      dir:
        description: The subdirectory of the artifact that holds this package's files (empty = the artifact root).
        required: false
        type: string
        default: ""
      version:
        description: The version the files carry, in the ecosystem's own spelling (PEP 440 for PyPI).
        required: true
        type: string
      channel:
        description: The channel (stable, beta or main), from tools/sdk-version.mjs.
        required: true
        type: string
      base-url:
        description: The Polaris Key origin whose feeds receive the package.
        required: false
        type: string
        default: https://key.plrs.im
      release-tag:
        description: npm-repair.yml only. The release tag (vX.Y.Z) whose version a manual dispatch on main backfills.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.deliverable }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment:
      name: package-registry
      url: https://pkg.plrs.im/
    permissions:
      contents: read
      id-token: write
    steps:
      # The environment's deployment policy admits main and v* tags; this refuses anything else
      # even if that policy is ever loosened, and a channel that does not fit the version.
      - name: Main or a release tag, and a channel that fits the version
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DELIVERABLE: ${{ inputs.deliverable }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) want=main ;;
            refs/tags/v*)
              case "$VERSION" in
                *-* | *a[0-9]* | *b[0-9]* | *rc[0-9]*) want=beta ;;
                *) want=stable ;;
              esac
              ;;
            *)
              echo "::error::Packages are published from main and from v* release tags only (got ${GITHUB_REF})." >&2
              exit 1
              ;;
          esac
          # npm-repair.yml's backfill: that tag's version on that tag's channel, from a manual
          # dispatch on main, npm only.
          if [ -n "$RELEASE_TAG" ]; then
            if [ "$GITHUB_REF" != refs/heads/main ] || [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
              echo "::error::A release-tag backfill runs only from a manual dispatch on main (got $GITHUB_EVENT_NAME on $GITHUB_REF)." >&2
              exit 1
            fi
            case "$DELIVERABLE" in
              npm.*) ;;
              *)
                echo "::error::A release-tag backfill publishes npm packages only (got $DELIVERABLE)." >&2
                exit 1
                ;;
            esac
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|a|b)\.[0-9]+)?$ ]] || [ "$RELEASE_TAG" != "v$VERSION" ]; then
              echo "::error::$RELEASE_TAG is not a release tag of version $VERSION." >&2
              exit 1
            fi
            case "$VERSION" in
              *-*) want=beta ;;
              *) want=stable ;;
            esac
          fi
          if [ "$CHANNEL" != "$want" ]; then
            echo "::error::$VERSION on $GITHUB_REF belongs on the $want channel, not $CHANNEL." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # As deploy.yml (R7-04): only a commit that landed on main may publish.
      - name: The commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to publish: $GITHUB_SHA is not an ancestor of origin/main." >&2
            exit 1
          fi
      - name: The release tag is on main
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if ! commit="$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}")"; then
            echo "::error::There is no tag $RELEASE_TAG." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$RELEASE_TAG ($commit) is not an ancestor of origin/main." >&2
            exit 1
          fi
      # actions/download-artifact@v4 can stall on a slow blob read, give up after 30 s and still
      # exit 0 with an empty dist-feed (v0.9.3 maven.packs: "no POM ... matches"). So the download
      # is verified and, once, retried; a still-incomplete directory fails here with that cause.
      - id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.artifact }}
          path: dist-feed
      - id: arrived
        name: The artifact arrived whole
        continue-on-error: true
        env:
          DELIVERABLE: ${{ inputs.deliverable }}
          VERSION: ${{ inputs.version }}
          SUBDIR: ${{ inputs.dir }}
        run: tools/check-feed-download.sh
      - name: Download the artifact again
        if: steps.arrived.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist-feed
      - name: The artifact arrived whole (second look)
        if: steps.arrived.outcome == 'failure'
        env:
          DELIVERABLE: ${{ inputs.deliverable }}
          VERSION: ${{ inputs.version }}
          SUBDIR: ${{ inputs.dir }}
        run: tools/check-feed-download.sh
      - if: startsWith(inputs.deliverable, 'npm.')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Waits (up to ten minutes, the render queue) until the feed lists every @polaris-key version
      # the packed tarball pins; refuses at once a range pin or a tarball at another version.
      - name: Every @polaris-key version it pins is on the feed
        if: startsWith(inputs.deliverable, 'npm.')
        env:
          DIR: dist-feed/${{ inputs.dir }}
          VERSION: ${{ inputs.version }}
        run: >-
          node tools/feed-closure.mjs requires "$DIR" --version "$VERSION"
          --origin https://pkg.plrs.im --owner polaris-key --timeout 600
      - name: Publish ${{ inputs.deliverable }}
        id: publish
        uses: ./actions/publish
        with:
          product: polaris-key
          deliverable: ${{ inputs.deliverable }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          dir: dist-feed/${{ inputs.dir }}
          base-url: ${{ inputs.base-url }}
      - name: Summary
        env:
          DELIVERABLE: ${{ inputs.deliverable }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          OUTCOME: ${{ steps.publish.outputs.outcome }}
        run: echo "Published $DELIVERABLE $VERSION to the $CHANNEL channel ($OUTCOME)." >> "$GITHUB_STEP_SUMMARY"
