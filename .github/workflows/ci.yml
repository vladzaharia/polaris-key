name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Without this block the workflow inherits the repository default, which is
# configurable per-org and may be read-write. CI only ever needs to read the checkout.
permissions:
  contents: read

jobs:
  js:
    name: JS/TS (build · typecheck · test · conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here — the action reads `packageManager` from package.json.
      # Specifying both makes v4 abort with "Multiple versions of pnpm specified",
      # which is why every CI run in this repo failed at step 2 until 2026-08-26.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Adapter conformance (A-18a, notes/S-15 §6.6): every storefront and feed adapter against the
      # shared contract, and every write of each store's pinned vendor spec classified (allowed or
      # denied with a reason). `pnpm test` runs these too; this step names them, so a failing
      # adapter is legible at a glance and the check is part of this required job.
      - name: Adapter conformance and spec classification
        run: pnpm --filter @polaris-key/worker exec vitest run test/storefront/ test/ascWriteGate.test.ts test/feedAdapters.test.ts
      - run: pnpm lint
      # Every drift gate, from the generator registry (tools/generators.ts): the signed conformance
      # corpus, the HTTP transcripts, the service table, the SDK constants, the platform inventory,
      # the storefront CI plane, the settings reference, the brand tokens, the publish Action's bundle
      # (rebuilt in memory from the built workspace), the docs reference pages, the parity gate (every
      # SDK's parity.json against conformance/parity/features.json), the program INDEX and the
      # generators page. Each is regenerated in memory; exit 1 on any difference. A new generator is
      # one registry entry and needs no change here.
      - run: pnpm gen --check
      - run: pnpm --filter @polaris-key/admin build
      # The docs site is built by `pnpm build` (turbo); assembling proves the worker's
      # single [assets] root composes from both frontends before any deploy does it.
      - run: pnpm --filter @polaris-key/worker assemble
      # Internal-link integrity across the built docs site (paths + anchors).
      - run: pnpm --filter @polaris-key/docs check:links

  # The `js` job above runs every suite under `environment: "node"`. Node permits the runtime
  # code generation workerd forbids, so it is structurally incapable of catching the class of
  # defect that produced this repo's worst release blocker: Ajv's `compile()` ran inside the
  # request handler, and `GET /<product>/config` would have 500'd for every device on every
  # poll while hundreds of green Node tests said nothing (the R10 audit findings
  # §R10-01, reproduced on real workerd in the VERIFY-R10-01 audit note).
  #
  # This job boots the genuine workerd binary. It is its own job, not a step in `js`, so that
  # "the code does not work in the runtime it ships to" is legible at a glance instead of
  # being buried in a 700-test log.
  workerd:
    name: Worker smoke (real workerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The worker imports the workspace packages from their built `dist`, so they must exist
      # before workerd boots.
      - run: pnpm build
      # wrangler.toml's `[assets] directory` is `./assets` — the ASSEMBLED root, gitignored and
      # built from the admin SPA plus the docs site. vitest-pool-workers parses wrangler.toml
      # at startup and hard-errors ("the assets directory specified does not exist") before a
      # single test collects, so the assemble must happen here too. Jobs share no filesystem,
      # so the `js` job doing it is no help. This went unnoticed because typecheck:workerd
      # failed first and test:workerd never ran.
      - run: pnpm --filter @polaris-key/admin build
      - run: pnpm --filter @polaris-key/worker assemble
      - run: pnpm --filter @polaris-key/worker typecheck:workerd
      - run: pnpm --filter @polaris-key/worker test:workerd

  # P1b-05 Part B: the Node conformance runner and the Node SDK suites on the LOWEST Node that
  # `engines.node` allows. One runtime is not proof: notes/A7 §6 found decoder behaviour that only
  # a run on the minimum version shows. The floor is read from the three packages that declare it
  # (they must agree, as `>=X.Y.Z`) and installed exactly. If it fails, raise the declared floor to
  # the lowest version that passes; never skip or weaken a test. The install is filtered to the
  # runner's dependency closure, so nothing the floor does not run (the worker's native modules,
  # the docs site) has to build on it.
  node-floor:
    name: Node floor (engines.node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: floor
        run: |
          floors=$(jq -r '.engines.node' packages/sdk-node/package.json packages/client-core/package.json packages/sdk-react/package.json | sort -u)
          if [ "$(printf '%s\n' "$floors" | wc -l)" -ne 1 ]; then
            echo "::error::engines.node differs between sdk-node, client-core and sdk-react: $floors"; exit 1
          fi
          if ! printf '%s' "$floors" | grep -Eq '^>=[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::engines.node must be '>=X.Y.Z', got '$floors'"; exit 1
          fi
          echo "version=${floors#>=}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.floor.outputs.version }}
          cache: pnpm
      # The banner, and proof that the runtime under test IS the floor (setup-node resolves an
      # exact version, but a cached toolcache must not silently stand in for it).
      - run: |
          node -p "JSON.stringify(process.versions, null, 2)"
          test "$(node --version)" = "v${{ steps.floor.outputs.version }}"
      - run: pnpm install --frozen-lockfile --filter=@polaris-key/conformance-node...
      - run: pnpm exec turbo run build --filter=@polaris-key/conformance-node...
      - run: >-
          pnpm exec turbo run test --filter=@polaris-key/conformance-node
          --filter=@polaris-key/client-core --filter=@polaris-key/node

  # P1b-05 Part A: the conformance corpus in real Chromium. conformance/runners/browser drives the
  # SAME suites as the Node runner (conformance/runners/node/suites.ts) through client-core, so
  # WebCrypto's Ed25519 and SHA-256 verify every cases.json, gate-matrix.json, update-matrix.json
  # and outlet-matrix.json vector. The runner prints navigator.userAgent. The root `pnpm test`
  # leaves this package out (it needs a Playwright browser), which is why it is its own job.
  browser:
    name: Browser conformance (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: >-
          pnpm install --frozen-lockfile --filter=@polaris-key/conformance-browser...
          --filter=@polaris-key/conformance-node...
      - run: pnpm --filter @polaris-key/conformance-browser exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@polaris-key/conformance-browser...
      - run: pnpm --filter @polaris-key/conformance-browser test

  # The console and the customer portal in real Chromium under the Worker's exact CSP
  # (packages/admin/e2e): the console's overlays (zero violations, a real scroll lock behind every
  # dialog, menu and drawer) and the portal quality bar (PX-20, PORTAL.md §8-§9): every shipped §4
  # state in both themes at 1440 and 390 px with zero CSP and axe violations, one h1, no horizontal
  # scroll at 360 px and its visual baseline. It runs in Playwright's own image because the
  # committed linux baselines are rendered there (packages/admin/scripts/portal-baselines.sh); on
  # a failure the actual and diff images are uploaded.
  console:
    name: Console and portal (Chromium, CSP, axe, visual)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # The e2e harness imports the Worker's own security headers and media proxy, so the Worker's
      # dependencies install and build too (core/devices.ts imports @polaris-key/client-core,
      # whose entry is its built dist).
      - run: >-
          pnpm install --frozen-lockfile --filter=@polaris-key/admin...
          --filter=@polaris-key/worker...
      - run: >-
          pnpm exec turbo run build --filter=@polaris-key/admin... --filter=@polaris-key/brand
          --filter=@polaris-key/worker^...
      - run: pnpm --filter @polaris-key/admin test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portal-visual-diff
          path: packages/admin/e2e/__baselines__/portal/.out
          if-no-files-found: ignore

  # UK-15: the UI-kit visual QA lane (UI-KITS.md §7). The modernity lint over the mockup boards
  # (both themes) and any kit stylesheets, the string lint against the copy catalogs, the per-kit
  # source lints, the side-by-side report and the lint's own browser suites (a seeded violation
  # per rule). In Playwright's image, like the console job, so the Chromium build is pinned. The
  # web kits add their component pages here as they land (UK-04, UK-05); the native kits run
  # their own equivalents in their lanes.
  ui-kits:
    name: UI kits (modernity lint, string lint, report)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter=@polaris-key/ui-qa...
      - run: pnpm ui:lint
      - run: pnpm ui:report
      - run: pnpm --filter @polaris-key/ui-qa test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-kits-report
          path: |
            packages/ui-qa/.out
            docs/design/ui-kits/shots
          if-no-files-found: ignore

  # The React drop-in kit in real Chromium (packages/sdk-react/test/browser): every screen at 320,
  # 390, 768, 1024, 1440 and 2560 px, a phone on its side (844x390), 200 % zoom and a 24 px root
  # font, in dark and light. No sideways scroll, the main action in the first viewport, every
  # control at least 24 px, no browser serif, and every piece of text scaling with the root font.
  # In Playwright's image, like the console job, so the Chromium build is pinned.
  react-kit:
    name: React kit (Chromium, responsive)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter=@polaris-key/react...
      - run: pnpm exec turbo run build --filter=@polaris-key/react^...
      - run: pnpm --filter @polaris-key/react test:browser

  # P1b-05 Part D: the same runner in Firefox 155.0, the build bundled with playwright 1.63.0 (the
  # engine S-04 measured), in Playwright's own image, which already carries that browser. Firefox
  # refuses to run as root under a $HOME another user owns, and Actions sets HOME=/github/home, so
  # the test step points HOME back at /root (Playwright's documented container setup).
  browser-firefox:
    name: Browser conformance (Firefox, Linux)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: >-
          pnpm install --frozen-lockfile --filter=@polaris-key/conformance-browser...
          --filter=@polaris-key/conformance-node...
      - run: pnpm exec turbo run build --filter=@polaris-key/conformance-browser...
      - run: pnpm --filter @polaris-key/conformance-browser test --browser=firefox
        env:
          HOME: /root

  # P1b-05 Part D: WebKit 26.6 on macOS. playwright 1.63.0 pins an OLDER WebKit build on macOS 14
  # (browsers.json revisionOverrides mac14), so this runs on macos-15. Do NOT add a Linux WebKit
  # leg: Linux Playwright WebKit, like WebKitGTK 2.52.6 with libgcrypt 1.10.3, kills the web
  # process when WebCrypto Ed25519 verifies a message of about 64 KiB or more, so payload-at-cap
  # and bundle-payload-at-cap fail on every run (notes/S-04). That failure is correct and loud;
  # never skip, cap or special-case those rows. Linux WebKit waits for an (unowned) size-aware
  # Ed25519 fallback in shared-jws/client-core, which is a plan-mode change.
  browser-webkit:
    name: Browser conformance (WebKit, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: >-
          pnpm install --frozen-lockfile --filter=@polaris-key/conformance-browser...
          --filter=@polaris-key/conformance-node...
      - run: pnpm --filter @polaris-key/conformance-browser exec playwright install webkit
      - run: pnpm exec turbo run build --filter=@polaris-key/conformance-browser...
      - run: pnpm --filter @polaris-key/conformance-browser test --browser=webkit

  # The Python SDK on the lowest and the highest CPython that `requires-python` admits (3.9 and
  # 3.14 differ in zstd, PARITY §4.3) on Linux, and the current one on macOS. tests/conftest.py
  # prints the interpreter and the cryptography (with its OpenSSL) and httpx versions first.
  python:
    name: Python SDK (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-14
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Per-kit modernity lint (UI-KITS.md §7.3, UK-15): the qt source rules of
      # packages/ui-qa/rules/kit-rules.json. Zero dependencies, so plain Node runs it; it fails on any
      # hit beyond the debt ledger (packages/ui-qa/rules/kit-debt.json) and on stale debt.
      - name: UI kit source lint (qt)
        run: node packages/ui-qa/bin/kit-lint.mjs --kit=qt
      - name: Create venv + install (editable, dev extras)
        working-directory: sdks/python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: pytest
        working-directory: sdks/python
        run: .venv/bin/python -m pytest -q

  swift:
    name: Swift SDK
    # macos-14 ships Swift 5.10, but sdks/swift/Package.swift declares
    # `swift-tools-version: 6.0` and `swiftLanguageMode(.v6)`, so this job failed with
    # "package 'swift' is using Swift tools version 6.0.0 but the installed version is
    # 5.10.0" on every run. macos-15 ships Swift 6.x.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Echo the toolchain so a future runner-image bump fails loudly and legibly rather
      # than looking like a source error.
      - run: swift --version
      # Per-kit modernity lint (UI-KITS.md §7.3, UK-15): the swiftui source rules of
      # packages/ui-qa/rules/kit-rules.json. Zero dependencies, so plain Node runs it; it fails on any
      # hit beyond the debt ledger (packages/ui-qa/rules/kit-debt.json) and on stale debt.
      - name: UI kit source lint (swiftui)
        run: node packages/ui-qa/bin/kit-lint.mjs --kit=swiftui
      - run: swift test --package-path sdks/swift
      # P4-07: packs (PolarisKeyPacks, linking libzstd) and the update client that carries
      # `update.packs` build for iOS without Sparkle, whose product is conditioned to macOS.
      - name: iOS build (packs, update, platform)
        working-directory: sdks/swift
        # P5-05: PolarisKeyPlatform compiles here with Xcode 16.4 (Swift 6.1) because its Xcode 26+
        # SDK code (AssetPackManager and the 26.4 Background Assets methods) is behind
        # `#if compiler(>=6.3)`; this step proves the guards hold. The macos-26 job below compiles
        # the guarded code.
        # Warnings are errors for the P5-05 targets only: with SWIFT_TREAT_WARNINGS_AS_ERRORS the
        # clang importer's libzstd configuration-macro warnings fail PolarisKeyPacks (measured
        # with Xcode 26.6), which is not this job's concern.
        run: |
          for scheme in PolarisKeyPacks PolarisKeyUpdate; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO -quiet build
          done
          for scheme in PolarisKeyPlatform PolarisKeyPlatformC; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES -quiet build
          done

  # P5-05: the Apple platform plugin with the Xcode 26 SDK. macos-26 (arm64, GA) ships Xcode
  # 26.0.1 to 26.6 (26.6 the default) and the iOS 26.2, 26.4 and 26.5 simulator runtimes. Xcode
  # is PINNED to 26.6 and the job fails unless the compiler is Swift 6.3 or later: the
  # Background Assets client is behind `#if compiler(>=6.3)`, so an older default Xcode would
  # silently compile it out. Steps: the package's `swift test` (fakes only) and an iOS build of every
  # library with warnings as errors; the hosted XCTest project (StoreKit Testing needs a host
  # app with get-task-allow; it asserts the product count); the xcframework for device and
  # simulator; the iOS export check (store preset has the Background Assets extension, App
  # Group and BA keys, sideload has none; both build for the device, unsigned); the PKeyApple
  # facade's headless stub tests. P5-08 adds `pkey transport apple-ba package` against the real
  # `xcrun ba-package` and the platform transports suite (`transports`) beside the stub tests. No
  # Apple account, certificate or App Store Connect is used.
  apple:
    name: Apple plugin (macos-26)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 26.6, Swift 6.3 or later
        run: sdks/swift/tools/select-xcode-26.sh
      - name: Boot the iOS simulator for the hosted tests
        # Now, so its first boot settles while the libraries build: on this 3-vCPU runner a new
        # simulator stays busy for minutes, and StoreKit Testing stalled inside that window
        # (PlatformHostTests/run.sh, which still waits for it to go quiet).
        run: |
          udid="$(sdks/swift/PlatformHostTests/run.sh --boot)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: swift build + test (warnings as errors)
        run: |
          swift build --package-path sdks/swift -Xswiftc -warnings-as-errors
          swift test --package-path sdks/swift
      - name: iOS build of every library
        working-directory: sdks/swift
        # Every library builds for iOS; the P5-05 targets with warnings as errors (the libzstd
        # importer warnings make PolarisKeyPacks fail under SWIFT_TREAT_WARNINGS_AS_ERRORS).
        run: |
          for scheme in PolarisKeyCore PolarisKeyLicense PolarisKeyConfig PolarisKeyRelease PolarisKeyIdentity \
            PolarisKeyPacks PolarisKeyUpdate PolarisKeyUI PolarisKey; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO -quiet build
          done
          for scheme in PolarisKeyPlatform PolarisKeyPlatformC; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES -quiet build
          done
      - name: Mac Catalyst build of every library
        working-directory: sdks/swift
        # SP-S16: Catalyst takes the iOS branches (identifierForVendor, no Sparkle: the Sparkle
        # product is conditioned on .macOS and every Sparkle file is #if os(macOS)).
        run: |
          for scheme in PolarisKeyCore PolarisKeyLicense PolarisKeyConfig PolarisKeyRelease PolarisKeyIdentity \
            PolarisKeyPacks PolarisKeyUpdate PolarisKeyUI PolarisKey PolarisKeyPlatform; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=macOS,variant=Mac Catalyst' \
              CODE_SIGNING_ALLOWED=NO -quiet build
          done
      - name: hosted StoreKit / Keychain tests (iOS simulator)
        # XcodeGen 2.45.4, the release asset checked against its SHA-256.
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          XCODEGEN="$RUNNER_TEMP/xcodegen/bin/xcodegen" sdks/swift/PlatformHostTests/run.sh
      # P5-08: `pkey transport apple-ba package` against the real `xcrun ba-package` (the other
      # tests use an exec seam). No App Store Connect key: the upload runs against a fake.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: pkey transport apple-ba package (real xcrun ba-package)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@polaris-key/cli..." build
          xcrun ba-package --version
          PKEY_REAL_BA_PACKAGE=1 pnpm --filter @polaris-key/cli exec vitest run test/transport.test.ts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pkey-godot/4.7.2-ios
          key: pkey-godot-4.7.2-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      - name: Godot 4.7.2 editor and iOS export templates
        run: |
          D="$HOME/.cache/pkey-godot/4.7.2-ios"
          sdks/godot/tools/fetch_godot.sh 4.7.2 "$D" --ios-template
          T="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$T" && cp "$D/templates/ios.zip" "$D/templates/version.txt" "$T/"
      - name: xcframework (device + simulator)
        run: GODOT_BIN="$HOME/.cache/pkey-godot/4.7.2-ios/godot" sdks/godot/native/ios/build.sh
      - name: iOS export check (store vs sideload, device builds)
        run: |
          gem install --user-install xcodeproj -v 1.27.0 --no-document
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH" GEM_HOME="$(ruby -e 'print Gem.user_dir')"
          GODOT_BIN="$HOME/.cache/pkey-godot/4.7.2-ios/godot" BUILD=1 sdks/godot/native/ios/export_check.sh
      - name: PKeyApple facade stub tests (headless)
        run: |
          rm -rf sdks/godot/addons/polaris_key/native/ios
          GODOT_BIN="$HOME/.cache/pkey-godot/4.7.2-ios/godot" PKEY_TEST_SUITES=native_apple,update,transports sdks/godot/tools/run_tests.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-logs
          path: |
            sdks/swift/PlatformHostTests/build/logs/
            sdks/godot/build/ios_export_check/logs/
            sdks/godot/build/logs/

  # The Kotlin SDK's JVM modules (sdks/kotlin, P6-06, P6-07, P6-08): the unit suites of :core, the service
  # modules (:license, :config, :identity, :release, :update, :packs) and the umbrella :sdk, and the :conformance
  # runner, which reads conformance/corpus/v2/ and conformance/transcripts/ in place and runs every
  # suite on the JCA Ed25519 backend and again with Tink forced. JDK 17 only: -Ppkey.jvmOnly leaves
  # the Android modules out, so no Android SDK is needed. checkModuleBoundaries proves no JVM module
  # has an Android dependency and each service module sees :core only (the android job proves
  # :platform depends on no SDK module), and the local maven-publish step writes build/repo only
  # (no signing, no remote repository). P6-08: :packs decodes zstd through zstd-jni, whose Android
  # natives must be 16 KB page aligned; tools/check_16k_alignment.py reads every ELF PT_LOAD of the
  # pinned zstd-jni AAR's .so files (arm64-v8a and x86_64 must align; 32-bit ABIs are reported).
  kotlin:
    name: Kotlin SDK (JVM modules + conformance runner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Module tests, conformance (JCA and Tink), module boundaries, local publish
        working-directory: sdks/kotlin
        run: >-
          ./gradlew --no-daemon -Ppkey.jvmOnly=true :core:test :license:test :config:test :identity:test
          :release:test :update:test :packs:test :sdk:test :desktop:test :conformance:test :sample-cli:test checkModuleBoundaries
          :core:publishCorePublicationToLocalRepository :license:publishLicensePublicationToLocalRepository
          :config:publishConfigPublicationToLocalRepository :identity:publishIdentityPublicationToLocalRepository
          :release:publishReleasePublicationToLocalRepository :update:publishUpdatePublicationToLocalRepository
          :packs:publishPacksPublicationToLocalRepository :sdk:publishSdkPublicationToLocalRepository
          :zstd:publishZstdPublicationToLocalRepository :desktop:publishDesktopPublicationToLocalRepository
      - name: zstd-jni's Android natives are 16 KB page aligned
        working-directory: sdks/kotlin
        run: python3 tools/check_16k_alignment.py
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-reports
          path: |
            sdks/kotlin/*/build/reports/

  # UK-40 (SP-K12): the Kotlin SDK's JVM desktop parity on the three desktop OSes. The keyring store's
  # storage contract runs against the REAL OS keyring (PKEY_KEYRING_TESTS=1): the login Keychain on
  # macOS, Credential Manager on Windows, and Secret Service on Linux through gnome-keyring in a
  # dbus-run-session, unlocked headless; a Linux session whose Secret Service is unreachable or
  # refuses skips that one test and prints the recorded `core.store` jvm `dependency` N/A. macOS and
  # Linux run the :core, :update and :sdk suites whole; Windows runs the desktop suites (the keyring
  # store, the install driver and its fetch, the slots, the desktop entry point, capabilities). Every run
  # passes --no-build-cache so a :core:test result restored from setup-java's Gradle cache can never
  # stand in for the real-keyring contract (core also declares PKEY_KEYRING_TESTS a Test input).
  kotlin-desktop:
    name: Kotlin SDK JVM desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PKEY_KEYRING_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Secret Service (gnome-keyring) for the headless session
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: JVM desktop suites (Linux, Secret Service)
        if: runner.os == 'Linux'
        working-directory: sdks/kotlin
        run: >-
          dbus-run-session -- bash -c 'printf pkey | gnome-keyring-daemon --unlock --components=secrets >/dev/null;
          ./gradlew --no-daemon --no-build-cache -Ppkey.jvmOnly=true :core:test :update:test :sdk:test :desktop:test'
      - name: JVM desktop suites (macOS, login Keychain)
        if: runner.os == 'macOS'
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon --no-build-cache -Ppkey.jvmOnly=true :core:test :update:test :sdk:test :desktop:test
      - name: JVM desktop suites (Windows, Credential Manager)
        if: runner.os == 'Windows'
        working-directory: sdks/kotlin
        run: >-
          ./gradlew --no-daemon --no-build-cache -Ppkey.jvmOnly=true
          :core:test --tests 'im.plrs.key.core.KeyringStoreTest' --tests 'im.plrs.key.core.CapabilitiesTest'
          :update:test --tests 'im.plrs.key.update.DesktopInstallDriverTest' --tests 'im.plrs.key.update.DirUpdateSlotsTest'
          --tests 'im.plrs.key.update.BootGuardTest'
          :desktop:test
      - name: The real-keyring contract ran (or recorded its Linux N/A)
        working-directory: sdks/kotlin
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          root = ET.parse("core/build/test-results/test/TEST-im.plrs.key.core.KeyringStoreTest.xml").getroot()
          case = next(c for c in root.iter("testcase") if c.get("name") == "theContractHoldsOnTheRealOsKeyring")
          if case.find("skipped") is not None:
              if os.environ["RUNNER_OS"] != "Linux":
                  sys.exit("the real-keyring contract must run on " + os.environ["RUNNER_OS"])
              print("recorded N/A: core.store jvm dependency (no usable Secret Service in this session)")
          else:
              print("the real-keyring contract ran on " + os.environ["RUNNER_OS"])
          PY
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-desktop-reports-${{ matrix.os }}
          path: |
            sdks/kotlin/*/build/reports/

  # P5-06/P6-09/P6-10/P6-12: the Android platform AAR (sdks/kotlin :platform, polaris-key-platform-{play,direct}),
  # the Godot Android binding over it alone (sdks/godot/native/android, built as :godot) and the Kotlin
  # SDK's Android glue over the SDK and the platform (:android, polaris-key-android-{play,direct}), on JDK 17 and the
  # runner's Android SDK with platforms;android-36 and build-tools;36.1.0. Steps: both flavours'
  # unit tests (Robolectric; Play Core's FakeAppUpdateManager, a fake asset-pack manager, the
  # PackageInstaller verification refusals and Robolectric's PackageInstaller; :android's drivers,
  # PAD transport, Keystore store and readers against fakes and the corpus), assembleRelease of
  # both flavours of every module and of the :boundary app, the flavour boundary on those release
  # outputs (tools/check_flavours.sh: no install permission and no session creation or commit in
  # play, no Play Core in direct, no native library but zstd-jni's 16 KB-aligned one), and PKeyAndroid's headless stub tests (with
  # P5-08's platform transports suite). No
  # secrets, no signing key, no Play Console: In-App Updates and Play Asset Delivery on a real Play
  # install are the owner's device checklist (the P5-06 brief). First-party actions, plus Gradle's
  # own wrapper-validation action, SHA-pinned, which checks the committed gradle-wrapper.jar against
  # Gradle's published checksums before anything runs it.
  # P6-11: the Compose UI kit (:ui, polaris-key-ui): its unit, state-holder, branding, contrast and
  # TalkBack suites with every screen's committed Roborazzi snapshot verified (Robolectric's native
  # graphics, no emulator), lint and assembleRelease, and the local publication.
  android:
    name: Android platform AAR + Godot binding + Compose UI kit + Android glue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Per-kit modernity lint (UI-KITS.md §7.3, UK-15): the compose source rules of
      # packages/ui-qa/rules/kit-rules.json. Zero dependencies, so plain Node runs it; it fails on any
      # hit beyond the debt ledger (packages/ui-qa/rules/kit-debt.json) and on stale debt.
      - name: UI kit source lint (compose)
        run: node packages/ui-qa/bin/kit-lint.mjs --kit=compose
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` dies of SIGPIPE when sdkmanager stops reading, which pipefail would report.
          set +o pipefail
          yes | "$SDKM" --licenses >/dev/null
          set -o pipefail
          "$SDKM" "platforms;android-36" "build-tools;36.1.0" >/dev/null
      - name: Unit tests (play and direct)
        working-directory: sdks/kotlin
        run: >-
          ./gradlew --no-daemon :platform:testPlayDebugUnitTest :platform:testDirectDebugUnitTest
          :godot:testPlayDebugUnitTest :godot:testDirectDebugUnitTest :ui:verifyRoborazziDebug
          :android:testPlayDebugUnitTest :android:testDirectDebugUnitTest :billing:testDebugUnitTest
      - name: Lint and assembleRelease (play and direct)
        working-directory: sdks/kotlin
        run: >-
          ./gradlew --no-daemon :platform:lintPlayRelease :platform:lintDirectRelease
          :godot:lintPlayRelease :godot:lintDirectRelease :android:lintPlayRelease :android:lintDirectRelease
          :platform:assembleRelease :godot:assembleRelease :android:assembleRelease :boundary:assembleRelease
          :ui:lintRelease :ui:assembleRelease :billing:lintRelease :billing:assembleRelease
      - name: Flavour boundary
        run: sdks/kotlin/tools/check_flavours.sh
      - name: Module boundaries (:core has no Android dependency, :platform no SDK module, only :android sees both)
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon checkModuleBoundaries
      # P6-09: :platform stays standalone (no project or im.plrs.key module on any classpath), and
      # both flavours publish to the local build/repo with POM, sources and Gradle module metadata.
      # P6-10: :godot reaches :platform and no other SDK module on any classpath (checkPlatformOnly),
      # publishes polaris-key-godot-{play,direct} beside it (each POM naming only
      # polaris-key-platform-<same flavour>), and the export plugin's Play Core list matches the
      # platform play POM (check_publication.sh).
      - name: Standalone platform, platform-only Godot binding and local publication
        working-directory: sdks/kotlin
        run: |
          ./gradlew --no-daemon :platform:checkStandalone :godot:checkPlatformOnly \
            :platform:publishAllPublicationsToLocalRepository :godot:publishAllPublicationsToLocalRepository \
            :ui:publishUiPublicationToLocalRepository :android:publishAllPublicationsToLocalRepository
          tools/check_publication.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pkey-godot/4.7.2
          key: pkey-godot-4.7.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      - run: sdks/godot/tools/fetch_godot.sh 4.7.2 "$HOME/.cache/pkey-godot/4.7.2"
      - name: PKeyAndroid stub tests (headless)
        run: >-
          GODOT_BIN="$HOME/.cache/pkey-godot/4.7.2/godot" PKEY_TEST_SUITES=native_android,update,transports
          sdks/godot/tools/run_tests.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-logs
          path: |
            sdks/kotlin/platform/build/reports/
            sdks/kotlin/ui/build/reports/
            sdks/kotlin/ui/build/outputs/roborazzi/
            sdks/kotlin/android/build/reports/
            sdks/godot/native/android/build/reports/
            sdks/godot/build/logs/

  # SP-50: the Kotlin SDK as an app consumes it. sdks/kotlin/samples/android-consumer is a separate
  # build over the PUBLISHED artifacts (build/repo): the documented Android set (polaris-key-sdk,
  # polaris-key-android-direct, polaris-key-ui, polaris-key-billing) with no exclude and no app R8
  # rule, debug and minified release, on the documented toolchain (AGP 8.6.1, Kotlin 2.1.21, Gradle
  # 8.11.1, compileSdk 36) and the latest (AGP 9.4.1, Kotlin 2.4.20, Gradle 9.7.1, compileSdk 37).
  # Its `lean` flavour must carry no libzstd-jni; its `packs` flavour adds polaris-key-zstd and must
  # carry zstd-jni's 16 KB-aligned Android natives, never the desktop JAR's (check_apks.sh).
  kotlin-consumer:
    name: Kotlin SDK consumer app (${{ matrix.toolchain }} toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        toolchain: [documented, latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses >/dev/null
          set -o pipefail
          "$SDKM" "platforms;android-36" "platforms;android-37.0" "build-tools;36.1.0" >/dev/null
      - name: Publish the SDK locally (build/repo)
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon publishAllPublicationsToLocalRepository
      - name: Build the consumer app (documented toolchain, this build's wrapper)
        if: matrix.toolchain == 'documented'
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon -p samples/android-consumer assembleDebug assembleRelease assembleLeanDebugAndroidTest
      - name: Gradle 9.7.1 for the latest toolchain
        if: matrix.toolchain == 'latest'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.7.1"
      - name: Build the consumer app (latest toolchain)
        if: matrix.toolchain == 'latest'
        working-directory: sdks/kotlin/samples/android-consumer
        run: gradle --no-daemon -Ppkey.toolchain=latest assembleDebug assembleRelease assembleLeanDebugAndroidTest
      - name: The APKs hold what the artifacts promise
        run: sdks/kotlin/samples/android-consumer/check_apks.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-consumer-${{ matrix.toolchain }}
          path: sdks/kotlin/samples/android-consumer/app/build/reports/

  # SP-50: the emulator lane. The consumer app's instrumented tests on the minSdk (24), API 34 and the
  # newest (36) emulators: Ed25519 chosen by RFC 8032's known answers (Tink; Android 16's JCA fails
  # them), client(context) -> activate() -> sync() from Dispatchers.Main against a server that
  # splits headers and body under StrictMode penaltyDeath, every public suspend function of the
  # client and its facets swept on the main thread under the same policy, a client without a store
  # refused clearly, and the pack decoder present in the `packs` flavour only.
  kotlin-emulator:
    name: Kotlin SDK on the Android emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 34, 36]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses >/dev/null
          set -o pipefail
          "$SDKM" "platforms;android-36" "build-tools;36.1.0" >/dev/null
      - name: Publish the SDK locally and build the consumer app's test APKs
        working-directory: sdks/kotlin
        run: |
          ./gradlew --no-daemon publishAllPublicationsToLocalRepository
          ./gradlew --no-daemon -p samples/android-consumer assembleLeanDebug assembleLeanDebugAndroidTest \
            assemblePacksDebug assemblePacksDebugAndroidTest
      - name: Instrumented tests (lean and packs)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level == 24 && 'default' || 'google_apis' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          working-directory: sdks/kotlin
          script: ./gradlew --no-daemon -p samples/android-consumer connectedLeanDebugAndroidTest connectedPacksDebugAndroidTest
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-emulator-${{ matrix.api-level }}
          path: |
            sdks/kotlin/samples/android-consumer/app/build/outputs/androidTest-results/
            sdks/kotlin/samples/android-consumer/app/build/reports/

  # The Godot SDK (sdks/godot): pure-GDScript SHA-512, both Ed25519 verifiers and the corpus
  # `jwsCases`, read from the generator-owned res:// mirror. PARITY requires the runner on the
  # editor AND an exported release template, because official 4.6+ templates ignore `--path`,
  # `--script` and `--main-pack`; the runner is the project's main loop, so both run it the same
  # way. Four Linux legs, one per supported engine (P1-12): the 4.7.2, 4.6.3 and 4.5.2 editors, each
  # with its official linux_release.x86_64 template, and the 4.4.1 editor (the source-compatible
  # floor). The README's tested matrix names exactly these engines. run_tests.sh also exports the
  # harness preset headless with PKEY_BUILD_OUTLET=steam, PKEY_BUILD_CHANNEL=beta and
  # PKEY_BUILD_NUMBER=42 (the P1-11 build stamp): the export_stamps suite checks the stamps in the
  # editor and the build_stamp suite asserts the stamp and the pkey_* feature tags on the release
  # template. No path filter: a required check behind a filter never reports. Only first-party
  # actions; every engine download is checked against the upstream SHA-512 in
  # sdks/godot/tools/godot.sha512, which also keys the cache.
  godot:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Godot SDK (4.7.2 editor + release template)"
            os: ubuntu-latest
            godot: "4.7.2"
            template: "--template"
            suites: ""
          - name: "Godot SDK (4.6.3 editor + release template)"
            os: ubuntu-latest
            godot: "4.6.3"
            template: "--template"
            suites: ""
          - name: "Godot SDK (4.5.2 editor + release template)"
            os: ubuntu-latest
            godot: "4.5.2"
            template: "--template"
            suites: ""
          - name: "Godot SDK (4.4.1 editor, floor)"
            os: ubuntu-latest
            godot: "4.4.1"
            template: ""
            suites: ""
          # Editor smoke legs (P1-05): the Windows and macOS fingerprint readers on a real
          # machine. The platform suite asserts the anchor and the MachineGuid / IOPlatformUUID
          # device id; the devices suite runs the readers over the committed captures.
          - name: "Godot SDK (4.7.2 editor, Windows smoke)"
            os: windows-latest
            godot: "4.7.2"
            template: ""
            suites: "platform,devices"
          - name: "Godot SDK (4.7.2 editor, macOS smoke)"
            os: macos-14
            godot: "4.7.2"
            template: ""
            suites: "platform,devices"
    steps:
      # windows-latest's system git sets core.autocrlf=true; check out byte for byte (LF) so the
      # bash tools, the pin file and the corpus the suites verify reach the job as committed.
      # .gitattributes pins sdks/godot to LF as well.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Per-kit modernity lint (UI-KITS.md §7.3, UK-15): the godot source rules (engine dialogs,
      # CheckBox, hard-coded alignment, colour literals outside the theme). The runtime half, every
      # engine control icon themed, is tests/support/ui_lint.gd (suite ui_lint).
      - name: UI kit source lint (godot)
        run: node packages/ui-qa/bin/kit-lint.mjs --kit=godot
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pkey-godot/${{ matrix.godot }}
          key: pkey-godot-${{ matrix.godot }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      - run: >-
          sdks/godot/tools/fetch_godot.sh "${{ matrix.godot }}"
          "$HOME/.cache/pkey-godot/${{ matrix.godot }}" ${{ matrix.template }}
      - run: |
          D="$HOME/.cache/pkey-godot/${{ matrix.godot }}"
          export GODOT_BIN="$D/godot"
          if [ -n "${{ matrix.template }}" ]; then export GODOT_TEMPLATE="$D/linux_release.x86_64"; fi
          if [ -n "${{ matrix.suites }}" ]; then export PKEY_TEST_SUITES="${{ matrix.suites }}"; fi
          sdks/godot/tools/run_tests.sh
      # Import, export and runs must leave the tree as committed: no rewritten file, no new .uid.
      - run: git diff --exit-code -- sdks/godot && test -z "$(git status --porcelain -- sdks/godot)"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
