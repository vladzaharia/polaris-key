name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Without this block the workflow inherits the repository default, which is
# configurable per-org and may be read-write. CI only ever needs to read the checkout.
permissions:
  contents: read

# One required check: `CI OK` (the ci-ok job at the end). Which jobs a pull request runs is decided
# once, by the `changes` job from tools/ci-scope.json (the same map `pnpm gate` reads
# through tools/ci-scope.mjs): a lane runs when a changed path is one of its `paths` or a `shared` input;
# the `js` job always runs. A pull request runs the floor and the latest of each matrix, `main`
# (and any non-PR run, or a pull request whose changed files cannot be read) every lane and the full
# matrix. A skipped lane counts as passed in `ci-ok`; a failed or cancelled one does not.
jobs:
  changes:
    name: Changes (which lanes run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # One per lane and matrix of tools/ci-scope.json (tools/ci-scope.test.ts checks the list).
      workerd: ${{ steps.scope.outputs.workerd }}
      node-floor: ${{ steps.scope.outputs.node-floor }}
      browser: ${{ steps.scope.outputs.browser }}
      console: ${{ steps.scope.outputs.console }}
      ui-kits: ${{ steps.scope.outputs.ui-kits }}
      react-kit: ${{ steps.scope.outputs.react-kit }}
      ui-recipes: ${{ steps.scope.outputs.ui-recipes }}
      python: ${{ steps.scope.outputs.python }}
      swift: ${{ steps.scope.outputs.swift }}
      swift-floor: ${{ steps.scope.outputs.swift-floor }}
      swiftui-mac: ${{ steps.scope.outputs.swiftui-mac }}
      compose-desktop: ${{ steps.scope.outputs.compose-desktop }}
      kotlin: ${{ steps.scope.outputs.kotlin }}
      android: ${{ steps.scope.outputs.android }}
      godot: ${{ steps.scope.outputs.godot }}
      e2e-backend: ${{ steps.scope.outputs.e2e-backend }}
      docs: ${{ steps.scope.outputs.docs }}
      python-matrix: ${{ steps.scope.outputs.python-matrix }}
      kotlin-desktop-matrix: ${{ steps.scope.outputs.kotlin-desktop-matrix }}
      kotlin-emulator-matrix: ${{ steps.scope.outputs.kotlin-emulator-matrix }}
      godot-matrix: ${{ steps.scope.outputs.godot-matrix }}
    steps:
      # The whole history: the pull request's changed files are the diff against its base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        # tools/ci-scope.mjs has no dependencies: plain Node, no install. Outside a pull request
        # BASE_REF is empty and every lane runs.
        run: node tools/ci-scope.mjs ci --event "$GITHUB_EVENT_NAME" --base "origin/$BASE_REF" --github-output

  js:
    name: JS/TS (build · typecheck · test · conformance)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      # P0-50: fail on a high or critical advisory in the production dependency tree. --prod keeps
      # a dev-only advisory (build and test tooling) from blocking; lower severities are tracked
      # through Dependabot, not this gate.
      - name: Advisory audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level high
      # The docs snippet lane (packages/docs/test/snippets) compiles every Python code block on a
      # covered docs page against the SDK with mypy, so it needs the SDK's own venv (with the Qt kit).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python venv for the docs snippet lane
        run: |
          python -m venv sdks/python/.venv
          sdks/python/.venv/bin/pip install -e "sdks/python[dev,qt]"
      - run: pnpm build
      # The React bundle budget (SP-47): gzip JS of Provider + LicenseGate and Provider + useLicense
      # over bare React, and no .wasm emitted or inlined. The second step is its negative control:
      # it must fail when a budget is exceeded.
      - run: pnpm --filter @polaris-key/react size
      - name: Size budget fails when exceeded (negative control)
        run: |
          if pnpm --filter @polaris-key/react size --budget provider+use-license=1000; then
            echo "::error::the size budget did not fail when exceeded"; exit 1
          fi
      - run: pnpm typecheck
      # SP-41, the React lane. The React SDK's live suite (packages/sdk-react/test) runs inside the
      # `pnpm test` below, against a fresh `pkey dev` started here from the CLI that `pnpm build` just
      # made: loopback only, `--auto-approve`, the built-in Tidewater product and its seven test
      # keys, on a port the OS picks. `start` writes what `pkey sdk --lang react --dev --write`
      # generates under $RUNNER_TEMP and exports PKEY_DEV_BASE_URL, PKEY_DEV_CONFIG and
      # PKEY_DEV_APPROVE (the host-side device-code approver) to the steps after it. turbo.json lists
      # them under the `test` task's `env`: turbo's strict env mode would otherwise hide them from
      # vitest and the suite would skip itself. `check` fails the job, naming what is missing, when a
      # variable, the config or the server is not there. `stop`, given the job's status, fails a job
      # that otherwise passed unless the server's request log shows the traffic SP-41's B1-B5 make
      # (activations, refusals, a config change, a sign-in, a release, the update feed): a suite that
      # skipped itself cannot pass. The same three steps and contract serve every SDK lane below.
      - name: Start pkey dev (React live lane)
        run: node packages/cli/scripts/start-dev-ci.mjs start --lang react
      - name: Check the pkey dev lane (variables, config, server)
        run: node packages/cli/scripts/start-dev-ci.mjs check
      # The docs snippet lane's Swift, Kotlin and GDScript blocks compile in the `docs-snippets` jobs
      # below, each on the toolchain it needs; this job runs the TypeScript and Python lanes.
      - run: pnpm test
        env:
          PKEY_DOCS_SKIP_LANES: swift,kotlin,gdscript
      # `pnpm test` includes the adapter conformance suites (A-18a, notes/S-15 §6.6: test/storefront/,
      # test/services/distribution/ascWriteGate.test.ts, test/surfaces/feedAdapters.test.ts): every storefront and feed adapter
      # against the shared contract, every write of each store's pinned vendor spec classified.
      - name: Stop pkey dev (React live lane)
        if: always()
        run: node packages/cli/scripts/start-dev-ci.mjs stop --lang react --job-status "${{ job.status }}"
      - run: pnpm lint
      # P0-46.3: copy-paste detection (jscpd, .jscpd.json) against the shrink-only ledger
      # tools/lint/debt/jscpd.json: a new duplicate block fails, a cleared one asks for a re-record.
      - name: Duplicate code (jscpd)
        run: pnpm lint:dupes
      # Unused files, exports and dependencies (knip), against the shrink-only ledger (P0-46.2).
      - run: pnpm lint:knip
      # AX-07.5: the agent kit's skills against the repo (check) and against a real Claude Code
      # (validate). The CLI is pinned: the newest @anthropic-ai/claude-code published at least 14
      # days before the pin was set (2.1.296, 2026-10-09); keep in step with PINNED_CLAUDE_CODE in
      # tools/agent-kit-release.ts and with deploy.yml's verify job.
      - run: pnpm skills:check
      - name: Validate the agent kit
        env:
          PKEY_CLAUDE_BIN: npx --yes @anthropic-ai/claude-code@2.1.296
        run: pnpm skills:validate
      # P0-30.3: the 800-line budget for packages/worker/src, against tools/lint/debt/size.json.
      - name: Size budget
        run: pnpm lint:size
      # Every drift gate, from the generator registry (tools/generators.ts): the signed conformance
      # corpus, the HTTP transcripts, the service table, the SDK constants, the platform inventory,
      # the storefront CI plane, the settings reference, the brand tokens, the publish Action's bundle
      # (rebuilt in memory from the built workspace), the docs reference pages, the parity gate (every
      # SDK's parity.json against conformance/parity/features.json), the program INDEX and the
      # generators page. Each is regenerated in memory; exit 1 on any difference. A new generator is
      # one registry entry and needs no change here.
      - run: pnpm gen --check
      - run: pnpm --filter @polaris-key/admin build
      # The docs site is built by `pnpm build` (turbo); assembling proves the worker's
      # single [assets] root composes from both frontends before any deploy does it.
      - run: pnpm --filter @polaris-key/worker assemble
        env:
          PKEY_ELEMENTS_UNSTAMPED_OK: "1" # never published: the deploy job stamps the tag's version
      # Internal-link integrity across the built docs site (paths + anchors); when a change can
      # reach the site (tools/ci-scope.json lane docs).
      - if: needs.changes.outputs.docs == 'true'
        run: pnpm --filter @polaris-key/docs check:links

  # The `js` job above runs every suite under `environment: "node"`. Node permits the runtime
  # code generation workerd forbids, so it is structurally incapable of catching the class of
  # defect that produced this repo's worst release blocker: Ajv's `compile()` ran inside the
  # request handler, and `GET /<product>/config` would have 500'd for every device on every
  # poll while hundreds of green Node tests said nothing (the R10 audit findings
  # §R10-01, reproduced on real workerd in the VERIFY-R10-01 audit note).
  #
  # This job boots the genuine workerd binary. It is its own job, not a step in `js`, so that
  # "the code does not work in the runtime it ships to" is legible at a glance instead of
  # being buried in a 700-test log.
  workerd:
    name: Worker smoke (real workerd)
    needs: changes
    if: needs.changes.outputs.workerd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      # The worker imports the workspace packages from their built `dist`, so they must exist
      # before workerd boots.
      - run: pnpm build
      # wrangler.toml's `[assets] directory` is `./assets` — the ASSEMBLED root, gitignored and
      # built from the admin SPA plus the docs site. vitest-pool-workers parses wrangler.toml
      # at startup and hard-errors ("the assets directory specified does not exist") before a
      # single test collects, so the assemble must happen here too. Jobs share no filesystem,
      # so the `js` job doing it is no help. This went unnoticed because typecheck:workerd
      # failed first and test:workerd never ran.
      - run: pnpm --filter @polaris-key/admin build
      - run: pnpm --filter @polaris-key/worker assemble
        env:
          PKEY_ELEMENTS_UNSTAMPED_OK: "1" # never published: the deploy job stamps the tag's version
      - run: pnpm --filter @polaris-key/worker typecheck:workerd
      - run: pnpm --filter @polaris-key/worker test:workerd

  # P1b-05 Part B: the Node conformance runner and the Node SDK suites on the LOWEST Node that
  # `engines.node` allows. One runtime is not proof: notes/A7 §6 found decoder behaviour that only
  # a run on the minimum version shows. The floor is read from the three packages that declare it
  # (they must agree, as `>=X.Y.Z`) and installed exactly. If it fails, raise the declared floor to
  # the lowest version that passes; never skip or weaken a test. The install is filtered to the
  # runner's dependency closure, so nothing the floor does not run (the worker's native modules,
  # the docs site) has to build on it.
  node-floor:
    name: Node floor (engines.node)
    needs: changes
    if: needs.changes.outputs.node-floor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: floor
        run: |
          floors=$(jq -r '.engines.node' packages/sdk-node/package.json packages/client-core/package.json packages/sdk-react/package.json | sort -u)
          if [ "$(printf '%s\n' "$floors" | wc -l)" -ne 1 ]; then
            echo "::error::engines.node differs between sdk-node, client-core and sdk-react: $floors"; exit 1
          fi
          if ! printf '%s' "$floors" | grep -Eq '^>=[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::engines.node must be '>=X.Y.Z', got '$floors'"; exit 1
          fi
          echo "version=${floors#>=}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.floor.outputs.version }}
          cache: pnpm
      # The banner, and proof that the runtime under test IS the floor (setup-node resolves an
      # exact version, but a cached toolcache must not silently stand in for it).
      - run: |
          node -p "JSON.stringify(process.versions, null, 2)"
          test "$(node --version)" = "v${{ steps.floor.outputs.version }}"
      - run: pnpm install --frozen-lockfile --filter=@polaris-key/conformance-node...
      - run: pnpm exec turbo run build --filter=@polaris-key/conformance-node...
      - run: >-
          pnpm exec turbo run test --filter=@polaris-key/conformance-node
          --filter=@polaris-key/client-core --filter=@polaris-key/node

  # P1b-05 Part A: the conformance corpus in real Chromium. conformance/runners/browser drives the
  # SAME suites as the Node runner (conformance/runners/node/suites.ts) through client-core, so
  # WebCrypto's Ed25519 and SHA-256 verify every cases.json, gate-matrix.json, update-matrix.json
  # and outlet-matrix.json vector. The runner prints navigator.userAgent. The root `pnpm test`
  # leaves this package out (it needs a Playwright browser), which is why it is its own job.
  browser:
    name: Browser conformance (Chromium)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      - run: >-
          pnpm install --frozen-lockfile --filter=@polaris-key/conformance-browser...
          --filter=@polaris-key/conformance-node...
      - run: pnpm --filter @polaris-key/conformance-browser exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@polaris-key/conformance-browser...
      - run: pnpm --filter @polaris-key/conformance-browser test

  # The console and the customer portal in real Chromium under the Worker's exact CSP
  # (packages/admin/e2e): the console's overlays (zero violations, a real scroll lock behind every
  # dialog, menu and drawer) and the portal quality bar (PX-20, PORTAL.md §8-§9): every shipped §4
  # state in both themes at 1440 and 390 px with zero CSP and axe violations, one h1, no horizontal
  # scroll at 360 px and its visual baseline. It runs in Playwright's own image because the
  # committed linux baselines are rendered there (packages/admin/scripts/portal-baselines.sh); on
  # a failure the actual and diff images are uploaded.
  console:
    name: Console and portal (Chromium, CSP, axe, visual)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      # The e2e harness imports the Worker's own security headers and media proxy, so the Worker's
      # dependencies install and build too (core/devices.ts imports @polaris-key/client-core,
      # whose entry is its built dist).
      - run: >-
          pnpm install --frozen-lockfile --filter=@polaris-key/admin...
          --filter=@polaris-key/worker...
      - run: >-
          pnpm exec turbo run build --filter=@polaris-key/admin... --filter=@polaris-key/brand
          --filter=@polaris-key/worker^...
      - run: pnpm --filter @polaris-key/admin test:e2e
      # The motion smoke in Firefox (MO-13.6; S-23 §11). The image ships Playwright's browsers.
      # Non-blocking until it has passed once on main (MO-13.6); then remove continue-on-error.
      - name: Motion smoke (Firefox)
        continue-on-error: true
        env:
          PK_MOTION_BROWSER: firefox
          HOME: /root
        run: >-
          pnpm --filter @polaris-key/admin exec vitest run -c vitest.e2e.config.ts
          e2e/motion.e2e.test.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-visual-diff
          path: packages/admin/e2e/__baselines__/portal/.out
          # `.out` is a hidden directory, which upload-artifact v4+ skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore

  # Help search under the Worker's real docs CSP (the docs script-src needs 'wasm-unsafe-eval' for
  # Pagefind; without it search spun forever). The test serves the built docs through the Worker
  # router in Chromium (packages/worker/test/docsSearchBrowser.test.ts). It fails, not skips, when
  # PKEY_DOCS_BROWSER=1 and the docs dist is missing, and the step checks the report for skips.
  help-search:
    name: Help search (Chromium, the Worker's docs CSP)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      # The docs build renders the console's ui/ components from packages/admin/src (DOC-02a), so
      # admin's dependencies (lucide-react) are installed too; admin itself is not built.
      - run: >-
          pnpm install --frozen-lockfile --filter=@polaris-key/docs...
          --filter=@polaris-key/admin --filter=@polaris-key/worker...
      - run: >-
          pnpm exec turbo run build --filter=@polaris-key/docs...
          --filter=@polaris-key/worker^...
      - name: Search returns results under the docs CSP
        env:
          PKEY_DOCS_BROWSER: "1"
        run: >-
          pnpm --filter @polaris-key/worker exec vitest run test/docsSearchBrowser.test.ts
          --reporter=json --outputFile="$RUNNER_TEMP/help-search.json"
      - name: The search tests ran (not skipped)
        run: >-
          node -e "const r=require(process.env.RUNNER_TEMP+'/help-search.json');
          if(r.numPassedTests<4||r.numPendingTests>0){console.error('help search tests skipped or missing',r.numPassedTests,r.numPendingTests);process.exit(1)}"

  # UK-15: the UI-kit visual QA lane (UI-KITS.md §7). The modernity lint over the mockup boards
  # (both themes) and any kit stylesheets, the string lint against the copy catalogs, the per-kit
  # source lints, the side-by-side report and the lint's own browser suites (a seeded violation
  # per rule). In Playwright's image, like the console job, so the Chromium build is pinned. The
  # web kits add their component pages here as they land (UK-04, UK-05); the native kits run
  # their own equivalents in their lanes.
  ui-kits:
    name: UI kits (modernity lint, string lint, report)
    needs: changes
    if: needs.changes.outputs.ui-kits == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install-args: --frozen-lockfile --filter=@polaris-key/ui-qa...
      - run: pnpm ui:lint
      - run: pnpm ui:report
      - run: pnpm --filter @polaris-key/ui-qa test:e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-kits-report
          path: |
            packages/ui-qa/.out
            docs/design/ui-kits/shots
          if-no-files-found: ignore

  # The UI-kit recipes (examples/ui/recipes, UK-31): a standalone pnpm workspace with its own
  # lockfile. Build @polaris-key/elements, install the recipes frozen, build each, then run the
  # modernity lint on every built page at a phone and a desktop size in both schemes. The
  # Tauri recipe's src-tauri/ is reference and is never compiled here. In Playwright's image,
  # like ui-kits, so the Chromium build is pinned. The audit fails on a high advisory in a
  # production dependency of any recipe.
  ui-recipes:
    name: UI recipes (build, modernity lint, audit)
    needs: changes
    if: needs.changes.outputs.ui-recipes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # The lint step builds an array of pages; the container's default sh has no arrays.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install-args: --frozen-lockfile --filter=@polaris-key/ui-qa... --filter=@polaris-key/elements...
      - run: pnpm exec turbo run build --filter=@polaris-key/elements...
      - run: pnpm install --frozen-lockfile --dir examples/ui/recipes
      - run: pnpm --dir examples/ui/recipes -r build
      # --html paths are relative to the repository root, which the lint serves.
      - name: Lint every recipe page
        run: |
          pages=()
          for r in htmx vue svelte solid preact angular tauri byo-design-system; do
            pages+=("--html=examples/ui/recipes/$r/dist/index.html")
          done
          pnpm ui:lint "${pages[@]}" --size=390x844,1440x900 --scheme=dark,light
      - run: pnpm audit --prod --audit-level high --dir examples/ui/recipes

  # The React drop-in kit in real Chromium (packages/sdk-react/test/browser): every screen at 320,
  # 390, 768, 1024, 1440 and 2560 px, a phone on its side (844x390), 200 % zoom and a 24 px root
  # font, in dark and light. No sideways scroll, the main action in the first viewport, every
  # control at least 24 px, no browser serif, and every piece of text scaling with the root font.
  # In Playwright's image, like the console job, so the Chromium build is pinned.
  react-kit:
    name: React kit (Chromium, responsive)
    needs: changes
    if: needs.changes.outputs.react-kit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          # The React 19 fixture is a workspace package nothing depends on, so it is named here.
          install-args: --frozen-lockfile --filter=@polaris-key/react... --filter=@polaris-key/react-react19
      # The kit's own dist too (no `^`): its tests import `@polaris-key/react` and `@polaris-key/react/kit`
      # through the package's exports map, which points at dist.
      - run: pnpm exec turbo run build --filter=@polaris-key/react...
      # The Vitest workspace has React 18 and React 19 projects; keep both supported majors live.
      - run: pnpm --filter @polaris-key/react test
      - run: pnpm --filter @polaris-key/react test:browser

  # P1b-05 Part D: the same runner in Firefox 155.0, the build bundled with playwright 1.63.0 (the
  # engine S-04 measured), in Playwright's own image, which already carries that browser. Firefox
  # refuses to run as root under a $HOME another user owns, and Actions sets HOME=/github/home, so
  # the test step points HOME back at /root (Playwright's documented container setup).
  browser-firefox:
    name: Browser conformance (Firefox, Linux)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      - run: >-
          pnpm install --frozen-lockfile --filter=@polaris-key/conformance-browser...
          --filter=@polaris-key/conformance-node...
      - run: pnpm exec turbo run build --filter=@polaris-key/conformance-browser...
      - run: pnpm --filter @polaris-key/conformance-browser test --browser=firefox
        env:
          HOME: /root

  # P1b-05 Part D: WebKit 26.6 on macOS. playwright 1.63.0 pins an OLDER WebKit build on macOS 14
  # (browsers.json revisionOverrides mac14), so this runs on macos-15. Do NOT add a Linux WebKit
  # leg: Linux Playwright WebKit, like WebKitGTK 2.52.6 with libgcrypt 1.10.3, kills the web
  # process when WebCrypto Ed25519 verifies a message of about 64 KiB or more, so payload-at-cap
  # and bundle-payload-at-cap fail on every run (notes/S-04). That failure is correct and loud;
  # never skip, cap or special-case those rows. Linux WebKit waits for an (unowned) size-aware
  # Ed25519 fallback in shared-jws/client-core, which is a plan-mode change.
  browser-webkit:
    name: Browser conformance (WebKit, macOS)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      - run: >-
          pnpm install --frozen-lockfile --filter=@polaris-key/conformance-browser...
          --filter=@polaris-key/conformance-node...
      - run: pnpm --filter @polaris-key/conformance-browser exec playwright install webkit
      - run: pnpm exec turbo run build --filter=@polaris-key/conformance-browser...
      - run: pnpm --filter @polaris-key/conformance-browser test --browser=webkit

  # The Python SDK on the lowest and the highest CPython that `requires-python` admits (3.9 and
  # 3.14 differ in zstd, PARITY §4.3) on Linux, and the current one on macOS. tests/conftest.py
  # prints the interpreter and the cryptography (with its OpenSSL) and httpx versions first.
  python:
    name: Python SDK (${{ matrix.python }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # PR: CPython 3.9 and 3.14 on Linux; main adds the current one on macOS (tools/ci-scope.json).
      matrix: ${{ fromJSON(needs.changes.outputs.python-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Per-kit modernity lint (UI-KITS.md §7.3, UK-15): the qt source rules of
      # packages/ui-qa/rules/kit-rules.json. Zero dependencies, so plain Node runs it; it fails on any
      # hit beyond the debt ledger (packages/ui-qa/rules/kit-debt.json) and on stale debt.
      - name: UI kit source lint (qt)
        run: node packages/ui-qa/bin/kit-lint.mjs --kit=qt
      - name: Create venv + install (editable, dev extras)
        working-directory: sdks/python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      # P0-46.4: ruff and mypy (pinned in the dev extras) against sdks/python/lint-debt.json. A new
      # finding fails, and so does debt a tool no longer reports. One leg only (D-L5): the ledger is
      # recorded on 3.14, and 3.9 resolves older dependencies whose stubs differ (mypy import-untyped).
      - name: Lint (ruff, mypy)
        if: matrix.python == '3.14' && matrix.os == 'ubuntu-latest'
        working-directory: sdks/python
        run: tools/lint.sh check
      - name: pytest
        working-directory: sdks/python
        run: .venv/bin/python -m pytest -q
      # SP-41, the Python lane: the 3.14 leg also runs the live suite against a fresh `pkey dev` (the
      # `js` job says what `start` and `check` do). It comes after the plain `pytest -q` above, where
      # tests/test_dev_live.py skips because none of the PKEY_DEV_* variables are set: the live test
      # takes seats, publishes a release and changes config, so it refuses a server anything else
      # has used, and it runs once, named on the command line, which makes missing variables fail it
      # instead of skipping it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.live
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.live
        with:
          node-version: 22
          cache: pnpm
      - name: Build the pkey dev server (the CLI and the Worker's dependencies)
        if: matrix.live
        run: |
          pnpm install --frozen-lockfile --filter=@polaris-key/worker...
          pnpm exec turbo run build --filter=@polaris-key/worker^...
      - name: Start pkey dev (Python live lane)
        if: matrix.live
        run: node packages/cli/scripts/start-dev-ci.mjs start --lang python
      - name: Check the pkey dev lane (variables, config, server)
        if: matrix.live
        run: node packages/cli/scripts/start-dev-ci.mjs check
      - name: pytest, live (device-code sign-in, config event, update decision)
        if: matrix.live
        working-directory: sdks/python
        run: .venv/bin/python -m pytest -q tests/test_dev_live.py
      - name: Stop pkey dev (Python live lane)
        if: always() && matrix.live
        run: node packages/cli/scripts/start-dev-ci.mjs stop --lang python --job-status "${{ job.status }}"

  # SP-65: a client SDK against an example backend against a live `pkey dev` (the Worker's own
  # router in this runner, loopback only, no secrets, no network beyond the runner). Node: the Node
  # client -> examples/server-express, server-hono and server-next (packages/server/test/
  # e2e.live.test.ts). Python: the Python client -> a FastAPI and a Flask app built on
  # polaris_key.server (sdks/python/tests/test_e2e_live.py). Each leg gets its own fresh server
  # through the same start/check/stop harness the SDK live lanes use; the cases are an activation, a
  # valid gated call, no credential, not_entitled, a failed re-sync and a stale document that
  # refreshes and then succeeds, with the client's gate state after each. Slots for the clients and
  # backends SP-59 and the React lane add: a leg here, run against the same harness. Scope:
  # tools/ci-scope.json lane e2e-backend.
  e2e-backend:
    name: End to end (client, example backend, pkey dev)
    needs: changes
    if: needs.changes.outputs.e2e-backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      - run: >-
          pnpm install --frozen-lockfile --filter=@polaris-key/cli... --filter=@polaris-key/worker...
          --filter=@polaris-key/server...
      - run: >-
          pnpm exec turbo run build --filter=@polaris-key/cli... --filter=@polaris-key/server...
      - name: Start pkey dev (Node leg)
        run: node packages/cli/scripts/start-dev-ci.mjs start --lang node
      - name: Check the pkey dev lane (variables, config, server)
        run: node packages/cli/scripts/start-dev-ci.mjs check
      - name: Node client, example backends (Express, Hono, Next route handlers)
        # A leg that skipped itself must fail: PKEY_E2E_REQUIRED turns the skip into a failure.
        env:
          PKEY_E2E_REQUIRED: "1"
        run: pnpm --filter @polaris-key/server exec vitest run test/e2e.live.test.ts
      - name: Stop pkey dev (Node leg)
        if: always()
        run: node packages/cli/scripts/start-dev-ci.mjs stop --lang node
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python venv (the SDK, FastAPI, Flask, uvicorn)
        working-directory: sdks/python
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e ".[fastapi,flask]" uvicorn pytest
      - name: Start pkey dev (Python leg)
        run: node packages/cli/scripts/start-dev-ci.mjs start --lang python
      - name: Check the pkey dev lane (variables, config, server)
        run: node packages/cli/scripts/start-dev-ci.mjs check
      - name: Python client, example backends (FastAPI, Flask)
        working-directory: sdks/python
        # Named on the command line: a missing variable fails the file instead of skipping it.
        run: .venv/bin/python -m pytest -q tests/test_e2e_live.py
      - name: Stop pkey dev (Python leg)
        if: always()
        run: node packages/cli/scripts/start-dev-ci.mjs stop --lang python

  # The Swift SDK on the OLDEST toolchain it supports: the half of the old `swift` job that `apple`
  # does not repeat (P0-43). sdks/swift/Package.swift is `swift-tools-version: 6.0`, and the Xcode 26+
  # SDK code of PolarisKeyPlatform (AssetPackManager and the 26.4 Background Assets methods) is
  # behind `#if compiler(>=6.3)`, the iOS 27 manifest API behind `#if compiler(>=6.4)`. `apple`
  # pins Xcode 26.6 and compiles only the guarded branch; this job pins Xcode 16.4 (Swift 6.1 on
  # macos-15) and compiles the other, so a newer API used outside its guard fails here and nowhere
  # else, though it would break a supported client. Build only: the package's tests run once, on
  # `apple`. The scheme lists are the old job's: packs and update plain, the platform and its C
  # surface with warnings as errors (with SWIFT_TREAT_WARNINGS_AS_ERRORS the clang importer's
  # libzstd configuration-macro warnings fail PolarisKeyPacks, measured with Xcode 26.6, which is
  # not this job's concern). Its lane, `swift-floor`, is the package alone (sdks/swift/): a change
  # to the Godot addon or the CLI needs `apple`, not a second macOS run of the same package.
  swift-floor:
    name: Swift SDK floor (macos-15, Xcode 16.4)
    needs: changes
    if: needs.changes.outputs.swift-floor == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 16.4, Swift below 6.3
        run: sdks/swift/tools/select-xcode-16.sh
      - name: swift build (macOS host)
        run: swift build --package-path sdks/swift
      - name: iOS build (packs, update, platform)
        working-directory: sdks/swift
        run: |
          for scheme in PolarisKeyPacks PolarisKeyUpdate; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO -quiet build
          done
          for scheme in PolarisKeyPlatform PolarisKeyPlatformC; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES -quiet build
          done

  # The Swift SDK and the Apple platform plugin on macos-26, as four jobs (P0-43 put them on one
  # job; it grew past its 45 minutes, measured 2026-10-12: pkey dev build 5.5 min, swift test
  # 6 min, iOS builds 5 min, footprint 9 min, Catalyst 7 min, hosted tests 11-22 min, plugin tail
  # 6-7 min, about 55 to 65 min in all, and the job was cancelled in its hosted-test or plugin
  # steps. The four share no state, so each gets its own runner): `apple`, the SDK's tests and
  # builds; `apple-hosted`, the hosted StoreKit/Keychain tests; `apple-footprint`, the report-only
  # footprint measurement; `apple-plugin`, the Godot addon's Apple half. The old `swift` job ran
  # the same `swift test` and a subset of the iOS builds below on macos-15. Its Xcode 16.4 half is
  # `swift-floor` above; the package's tests run only in `apple`.
  #
  # `apple`: first the swift kit's
  # modernity lint (UI-KITS.md §7.3, UK-15: the swiftui source rules of
  # packages/ui-qa/rules/kit-rules.json; zero dependencies, so plain Node runs it; it fails on any
  # hit beyond the debt ledger packages/ui-qa/rules/kit-debt.json and on stale debt).
  #
  # P5-05: the Apple platform plugin with the Xcode 26 SDK. macos-26 (arm64, GA) ships Xcode
  # 26.0.1 to 26.6 (26.6 the default) and the iOS 26.2, 26.4 and 26.5 simulator runtimes. Xcode
  # is PINNED to 26.6 and each job fails unless the compiler is Swift 6.3 or later: the
  # Background Assets client is behind `#if compiler(>=6.3)`, so an older default Xcode would
  # silently compile it out. `apple` runs the package's `swift test` (fakes only) and an iOS build
  # of every library with warnings as errors; `apple-hosted` the hosted XCTest project (StoreKit
  # Testing needs a host app with get-task-allow; it asserts the product count); `apple-plugin`
  # the xcframework for device and simulator; the iOS export check (store preset has the
  # Background Assets extension, App Group and BA keys, sideload has none; both build for the
  # device, unsigned); the PKeyApple facade's headless stub tests. P5-08 adds `pkey transport
  # apple-ba package` against the real `xcrun ba-package` and the platform transports suite
  # (`transports`) beside the stub tests. No Apple account, certificate or App Store Connect is
  # used.
  apple:
    name: Swift SDK (macos-26)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      - name: UI kit source lint (swiftui)
        run: node packages/ui-qa/bin/kit-lint.mjs --kit=swiftui
      - name: Xcode 26.6, Swift 6.3 or later
        run: sdks/swift/tools/select-xcode-26.sh
      # SP-41, the Swift lane: the full `swift test` runs the live test, which needs a fresh `pkey dev`
      # (the `js` job says what `start` and `check` do). The no-server run is the same test with none
      # of the PKEY_DEV_* variables set, so it skips.
      - name: Build the pkey dev server (the CLI and the Worker's dependencies)
        run: |
          pnpm install --frozen-lockfile --filter=@polaris-key/worker...
          pnpm exec turbo run build --filter=@polaris-key/worker^...
      # P0-46.6: swift-format lint on the lint-debt ledger (sdks/swift/lint-debt.json, recorded from
      # this step's swift-format-lint artifact of run 40144484635): a new finding fails the step.
      - name: Swift lint (swift-format, lint-debt ledger)
        env:
          PKEY_SWIFT_LINT_RAW: ${{ runner.temp }}/swift-format-lint.txt
        run: sdks/swift/tools/lint.sh check
      - name: Upload the raw swift-format output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-format-lint
          path: ${{ runner.temp }}/swift-format-lint.txt
          if-no-files-found: ignore
      - name: Start pkey dev (Swift live lane)
        run: node packages/cli/scripts/start-dev-ci.mjs start --lang swift
      - name: Check the pkey dev lane (variables, config, server)
        run: node packages/cli/scripts/start-dev-ci.mjs check
      - name: swift build + test (warnings as errors)
        run: |
          swift build --package-path sdks/swift -Xswiftc -warnings-as-errors
          swift test --package-path sdks/swift
      - name: Stop pkey dev (Swift live lane)
        if: always()
        run: node packages/cli/scripts/start-dev-ci.mjs stop --lang swift --job-status "${{ job.status }}"
      # SP-52: the registry archive stays small and ships no tests or tools, and the resolve
      # graph clones only the Sparkle binary dependency (zstd is vendored).
      - name: Swift registry archive footprint
        run: sdks/swift/tools/check-registry-archive.sh
      - name: Swift resolve boundary
        run: sdks/swift/tools/check-resolve-clones.sh
      - name: iOS build of every library
        working-directory: sdks/swift
        # Every library builds for iOS; the P5-05 targets with warnings as errors (the libzstd
        # importer warnings make PolarisKeyPacks fail under SWIFT_TREAT_WARNINGS_AS_ERRORS).
        run: |
          for scheme in PolarisKeyCore PolarisKeyLicense PolarisKeyConfig PolarisKeyRelease PolarisKeyIdentity \
            PolarisKeyPacks PolarisKeyUpdate PolarisKeyUI PolarisKeyUpdateUI PolarisKey; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO -quiet build
          done
          for scheme in PolarisKeyPlatform PolarisKeyPlatformC; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES -quiet build
          done
      - name: Mac Catalyst build of every library
        working-directory: sdks/swift
        # SP-S16: Catalyst takes the iOS branches (identifierForVendor, no Sparkle: the Sparkle
        # product is conditioned on .macOS and every Sparkle file is #if os(macOS)).
        run: |
          for scheme in PolarisKeyCore PolarisKeyLicense PolarisKeyConfig PolarisKeyRelease PolarisKeyIdentity \
            PolarisKeyPacks PolarisKeyUpdate PolarisKeyUI PolarisKeyUpdateUI PolarisKey PolarisKeyPlatform; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=macOS,variant=Mac Catalyst' \
              CODE_SIGNING_ALLOWED=NO -quiet build
          done
      - name: macOS build of the update and UI libraries
        working-directory: sdks/swift
        # UK-08.6: PolarisKeyUpdateUI is macOS only (the SwiftUI Sparkle user driver); it and the
        # libraries it sits on build for the Mac with warnings as errors.
        run: |
          for scheme in PolarisKeyUpdate PolarisKeyUI PolarisKeyUpdateUI; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=macOS' \
              CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES -quiet build
          done

  # The hosted XCTest project on an iOS simulator. On this 3-vCPU runner a new simulator stays busy
  # for minutes and StoreKit Testing stalled inside that window, so the simulator boots first and
  # PlatformHostTests/run.sh still waits for it to go quiet. It needs nothing the other Apple jobs
  # build, only Xcode, the simulator runtime and XcodeGen.
  apple-hosted:
    name: Apple platform hosted tests (macos-26, iOS simulator)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 26.6, Swift 6.3 or later
        run: sdks/swift/tools/select-xcode-26.sh
      - name: Boot the iOS simulator
        run: |
          udid="$(sdks/swift/PlatformHostTests/run.sh --boot)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: hosted StoreKit / Keychain tests (iOS simulator)
        # XcodeGen 2.45.4, the release asset checked against its SHA-256.
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          XCODEGEN="$RUNNER_TEMP/xcodegen/bin/xcodegen" sdks/swift/PlatformHostTests/run.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-hosted-logs
          path: sdks/swift/PlatformHostTests/build/logs/

  # UK-08.8: the SwiftUI kit's macOS render suite (examples/ui/swiftui/UITests/KitRenderMacTests.swift:
  # `run.sh --mac`, XCUITest with the accessibility audit and the layout assertions on every render).
  # Two legs, because the kit draws two looks: macos-26 (Xcode 26.6) renders the full set (the board
  # screens at four window sizes x schemes x presets, every preview state, the update window, the
  # accessibility rows, the 200 % rows, inactive windows); macos-15 (Xcode 16.4) renders the board
  # screens at 900x640 x schemes x presets, the macOS 15 look. Baselines are committed per OS
  # (`mac26-*`, `mac15-*` under sdks/swift/Tests/PolarisKeyUISnapshotTests/__Snapshots__); a leg
  # whose OS has none yet RECORDS them and passes (the harness's record-first rule), so the first run
  # on main produces the set to commit; after that a render that differs fails. Always uploads the
  # renders, renders-mac*.json, the recorded baselines and the xcresult. Estimate: macos-26 about 600
  # renders at 8 to 12 s (80 to 120 min) plus a 10 min build; macos-15 32 renders (5 min) plus the build.
  swiftui-mac:
    name: SwiftUI kit, macOS renders (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.swiftui-mac == 'true'
    # Non-blocking until the first baselines are committed (UK-08.8); the baseline commit removes this and adds the job to ci-ok.
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            os: "26"
            xcode: sdks/swift/tools/select-xcode-26.sh
            timeout: 150
            inactive: "1"
            only: ""
            windows: ""
            tests: ""
          - runner: macos-15
            os: "15"
            xcode: sdks/swift/tools/select-xcode-16.sh
            timeout: 45
            inactive: "0"
            only: "Welcome.default,Activate.parsed,SignIn.methods,DeviceLimit.default,UpdatePrompt.available,SettingsPane.account,StatusScreen.revoked,GraceBanner.days-left"
            windows: "900x640"
            tests: "KitRenderMacTests/testRenders"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode (26.6 or 16.4)
        run: ${{ matrix.xcode }}
      - name: Render the kit on the Mac (record when this OS has no baselines)
        env:
          PKEY_KIT_BASELINES: ${{ github.workspace }}/sdks/swift/Tests/PolarisKeyUISnapshotTests/__Snapshots__
          PKEY_KIT_INACTIVE: ${{ matrix.inactive }}
          PKEY_KIT_ONLY: ${{ matrix.only }}
          PKEY_KIT_WINDOWS: ${{ matrix.windows }}
          PKEY_KIT_TESTS: ${{ matrix.tests }}
        # XcodeGen 2.45.4, the release asset checked against its SHA-256 (as in apple-hosted).
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          XCODEGEN="$RUNNER_TEMP/xcodegen/bin/xcodegen" examples/ui/swiftui/run.sh --mac
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftui-mac-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            examples/ui/swiftui/build/shots-mac/
            examples/ui/swiftui/build/results-mac-*.xcresult
            sdks/swift/Tests/PolarisKeyUISnapshotTests/__Snapshots__/**/mac${{ matrix.os }}-*.png

  # UK-10.12: the Compose desktop UI kit (:ui desktop target) and its sample (examples/ui/compose-desktop)
  # on the three desktop OSes. Linux verifies the Roborazzi references (verifyRoborazziDesktop) and runs
  # the sample's --smoke under xvfb-run; macOS and Windows run the assertions (:ui:desktopTest), --smoke
  # and --shots. Every leg uploads its renders (always). No references are committed yet: until the lead
  # commits them from the first run's `compose-desktop-ubuntu-latest` artifact, the Linux leg RECORDS and
  # uploads instead of verifying. Non-blocking until then (as swiftui-mac): the lead removes
  # `continue-on-error` after recording the baselines (and adds the job to ci-ok).
  compose-desktop:
    name: Compose desktop kit (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.compose-desktop == 'true'
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      SHOTS: ${{ github.workspace }}/shots
    steps:
      # windows-latest's system git sets core.autocrlf=true; check out byte for byte (LF).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ "$RUNNER_OS" = Windows ]; then SDKM="$SDKM.bat"; fi
          # `yes` dies of SIGPIPE when sdkmanager stops reading, which pipefail would report.
          set +o pipefail
          yes | "$SDKM" --licenses >/dev/null
          set -o pipefail
          "$SDKM" "platforms;android-36" "build-tools;36.1.0" >/dev/null
      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Roborazzi references (Linux; records and uploads while none are committed)
        if: runner.os == 'Linux'
        working-directory: sdks/kotlin
        run: |
          if [ -n "$(find ui/src/desktopTest/snapshots -name '*.png' 2>/dev/null | head -n 1)" ]; then
            xvfb-run -a ./gradlew --no-daemon --continue :ui:verifyRoborazziDesktop
          else
            echo "::notice::no committed desktop references: recording them for the artifact instead of verifying"
            xvfb-run -a ./gradlew --no-daemon --continue :ui:recordRoborazziDesktop
          fi
      - name: Assertions (:ui:desktopTest)
        if: runner.os != 'Linux'
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon :ui:desktopTest
      # A failed assertion must not hide the renders: the smoke, the runtime check and --shots always run.
      - name: Sample --smoke (Linux, under xvfb-run)
        if: always() && runner.os == 'Linux'
        working-directory: sdks/kotlin
        run: xvfb-run -a ./gradlew --no-daemon :sample-compose-desktop:smoke
      - name: Sample --smoke
        if: always() && runner.os != 'Linux'
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon :sample-compose-desktop:smoke
      # UK-10.13 (K7): the Java Access Bridge must be in the packaged runtime, or Windows screen readers see nothing.
      - name: Packaged runtime has jdk.accessibility (Windows)
        if: always() && runner.os == 'Windows'
        working-directory: sdks/kotlin
        run: |
          ./gradlew --no-daemon :sample-compose-desktop:createRuntimeImage
          release="$(find ../../examples/ui/compose-desktop/build/compose -name release -path '*runtime*' | head -n 1)"
          test -n "$release"
          cat "$release"
          grep -q 'jdk.accessibility' "$release"
      - name: Sample --shots
        if: always() && runner.os != 'Linux'
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon :sample-compose-desktop:shots -Pshots="$SHOTS"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-desktop-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            shots/
            sdks/kotlin/ui/src/desktopTest/snapshots/
            sdks/kotlin/ui/build/outputs/roborazzi/
            sdks/kotlin/ui/build/reports/

  # SP-52 / SP-52b: a Release arm64 app (the kit + client.update.decide(), tools/size-app) must be at
  # least 25% smaller than the same app over the v0.8.33 SDK. The script rebuilds both trees on this
  # runner's toolchain, so the CI figure is the acceptance; no number is recorded. Report only until it
  # holds: at 2026-10-24 the tree is still LARGER (CI 3,348,956 B vs 3,109,960 B, +7.7%; target
  # 2,332,470 B). The cuts are SP-52b.2-.5. With PKEY_FOOTPRINT_KEEP=<dir> the script keeps both
  # archives and link maps and writes footprint.json (bytes per payload part, per module, per
  # section). Drop `continue-on-error` and "report only" when the target holds. It is its own job
  # because it takes 9 minutes of Release builds.
  apple-footprint:
    name: iOS app footprint (macos-26, report only)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 26.6, Swift 6.3 or later
        run: sdks/swift/tools/select-xcode-26.sh
      - name: iOS app footprint (kit + decide() vs 0.8.33)
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          XCODEGEN="$RUNNER_TEMP/xcodegen/bin/xcodegen" sdks/swift/tools/measure-ios-footprint.sh

  # The Godot addon's Apple half: the real `xcrun ba-package`, the xcframework, the export check
  # and the headless facade suites. It reads the Swift package's sources but builds nothing the
  # `apple` job builds.
  apple-plugin:
    name: Apple platform plugin (macos-26)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      - name: Xcode 26.6, Swift 6.3 or later
        run: sdks/swift/tools/select-xcode-26.sh
      # P5-08: `pkey transport apple-ba package` against the real `xcrun ba-package` (the other
      # tests use an exec seam). No App Store Connect key: the upload runs against a fake. Node
      # and pnpm come from the setup step at the top.
      - name: pkey transport apple-ba package (real xcrun ba-package)
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter="@polaris-key/cli..."
          xcrun ba-package --version
          PKEY_REAL_BA_PACKAGE=1 pnpm --filter @polaris-key/cli exec vitest run test/transport.test.ts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pkey-godot/4.7.2-ios
          key: pkey-godot-4.7.2-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      - name: Godot 4.7.2 editor and iOS export templates
        run: |
          D="$HOME/.cache/pkey-godot/4.7.2-ios"
          sdks/godot/tools/fetch_godot.sh 4.7.2 "$D" --ios-template
          T="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$T" && cp "$D/templates/ios.zip" "$D/templates/version.txt" "$T/"
      - name: xcframework (device + simulator)
        run: GODOT_BIN="$HOME/.cache/pkey-godot/4.7.2-ios/godot" sdks/godot/native/ios/build.sh
      - name: iOS export check (store vs sideload, device builds)
        run: |
          gem install --user-install xcodeproj -v 1.27.0 --no-document
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH" GEM_HOME="$(ruby -e 'print Gem.user_dir')"
          GODOT_BIN="$HOME/.cache/pkey-godot/4.7.2-ios/godot" BUILD=1 sdks/godot/native/ios/export_check.sh
      - name: PKeyApple facade stub tests (headless)
        run: |
          rm -rf sdks/godot/addons/polaris_key/native/ios
          GODOT_BIN="$HOME/.cache/pkey-godot/4.7.2-ios/godot" PKEY_TEST_SUITES=native_apple,update,transports sdks/godot/tools/run_tests.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-plugin-logs
          path: |
            sdks/godot/build/ios_export_check/logs/
            sdks/godot/build/logs/

  # The Kotlin SDK's JVM modules (sdks/kotlin, P6-06, P6-07, P6-08): the unit suites of :core, the service
  # modules (:license, :config, :identity, :release, :update, :packs) and the umbrella :sdk, and the :conformance
  # runner, which reads conformance/corpus/v2/ and conformance/transcripts/ in place and runs every
  # suite on the JCA Ed25519 backend and again with Tink forced. JDK 17 only: -Ppkey.jvmOnly leaves
  # the Android modules out, so no Android SDK is needed. checkModuleBoundaries proves no JVM module
  # has an Android dependency and each service module sees :core only (the android job proves
  # :platform depends on no SDK module), and the local maven-publish step writes build/repo only
  # (no signing, no remote repository). P6-08: :packs decodes zstd through zstd-jni, whose Android
  # natives must be 16 KB page aligned; tools/check_16k_alignment.py reads every ELF PT_LOAD of the
  # pinned zstd-jni AAR's .so files (arm64-v8a and x86_64 must align; 32-bit ABIs are reported).
  # SP-45b: the docs snippet lane for Kotlin and GDScript (packages/docs/test/snippets/nativeLanes.ts).
  # Every ```kotlin and ```gdscript block on a covered docs page compiles against the real SDK: the
  # JVM blocks in sdks/kotlin :docs-snippets, the `android` blocks in :docs-snippets-android (the
  # runner's Android SDK), the GDScript blocks in a headless Godot project with the addon linked.
  # A deliberately broken block must fail each lane, and a covered page may name only symbols the SDK
  # exports. PKEY_DOCS_LANES makes a lane that cannot run a failure instead of a skip.
  docs-snippets:
    name: Docs snippets (Kotlin, Godot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses >/dev/null
          set -o pipefail
          "$SDKM" "platforms;android-36" "build-tools;36.1.0" >/dev/null
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pkey-godot/4.7.2
          key: pkey-godot-4.7.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      - run: sdks/godot/tools/fetch_godot.sh 4.7.2 "$HOME/.cache/pkey-godot/4.7.2"
      - name: Kotlin and GDScript lanes
        working-directory: packages/docs
        env:
          PKEY_DOCS_LANES: kotlin,gdscript
          PKEY_DOCS_SKIP_LANES: swift
        run: GODOT_BIN="$HOME/.cache/pkey-godot/4.7.2/godot" pnpm exec vitest run test/snippets/snippets.test.ts -t "kotlin lane|gdscript lane|Godot class names"

  # SP-45b: the Swift half of the docs snippet lane, on the macOS runner Swift 6 needs.
  docs-snippets-swift:
    name: Docs snippets (Swift)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: swift --version
      - name: Swift lane
        working-directory: packages/docs
        env:
          PKEY_DOCS_LANES: swift
          PKEY_DOCS_SKIP_LANES: kotlin,gdscript
        run: pnpm exec vitest run test/snippets/snippets.test.ts -t "swift lane"

  kotlin:
    name: Kotlin SDK (JVM modules + conformance runner)
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Lint (ktlint and detekt against the lint-debt ledger)
        working-directory: sdks/kotlin
        run: tools/lint.sh check
      - name: Module tests, conformance (JCA and Tink), module boundaries, local publish
        working-directory: sdks/kotlin
        run: >-
          ./gradlew --no-daemon -Ppkey.jvmOnly=true :core:test :license:test :config:test :identity:test
          :release:test :update:test :packs:test :sdk:test :ui-core:test :server:test :server-ktor:test :spring-boot-starter:test :desktop:test :conformance:test :sample-cli:test checkModuleBoundaries
          :core:publishCorePublicationToLocalRepository :license:publishLicensePublicationToLocalRepository
          :config:publishConfigPublicationToLocalRepository :identity:publishIdentityPublicationToLocalRepository
          :release:publishReleasePublicationToLocalRepository :update:publishUpdatePublicationToLocalRepository
          :packs:publishPacksPublicationToLocalRepository :sdk:publishSdkPublicationToLocalRepository
          :server:publishServerPublicationToLocalRepository :server-ktor:publishServerKtorPublicationToLocalRepository
          :spring-boot-starter:publishSpringBootStarterPublicationToLocalRepository
          :zstd:publishZstdPublicationToLocalRepository :desktop:publishDesktopPublicationToLocalRepository
      - name: zstd-jni's Android natives are 16 KB page aligned
        working-directory: sdks/kotlin
        run: python3 tools/check_16k_alignment.py
      # SP-41, the Kotlin lane: the live suite is its own Gradle task, :conformance:liveDevTest (never
      # up to date or cached, JCA only, not part of :conformance:test), against a fresh `pkey dev`
      # (the `js` job says what `start` and `check` do). JDK 17 and -Ppkey.jvmOnly=true are enough:
      # no Android SDK.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Build the pkey dev server (the CLI and the Worker's dependencies)
        run: |
          pnpm install --frozen-lockfile --filter=@polaris-key/worker...
          pnpm exec turbo run build --filter=@polaris-key/worker^...
      - name: Start pkey dev (Kotlin live lane)
        run: node packages/cli/scripts/start-dev-ci.mjs start --lang kotlin
      - name: Check the pkey dev lane (variables, config, server)
        run: node packages/cli/scripts/start-dev-ci.mjs check
      - name: Kotlin live (device-code sign-in, config event, update decision)
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon -Ppkey.jvmOnly=true :conformance:liveDevTest
      - name: Stop pkey dev (Kotlin live lane)
        if: always()
        run: node packages/cli/scripts/start-dev-ci.mjs stop --lang kotlin --job-status "${{ job.status }}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-reports
          path: |
            sdks/kotlin/*/build/reports/

  # UK-40 (SP-K12): the Kotlin SDK's JVM desktop parity on the three desktop OSes. The keyring store's
  # storage contract runs against the REAL OS keyring (PKEY_KEYRING_TESTS=1): the login Keychain on
  # macOS, Credential Manager on Windows, and Secret Service on Linux through gnome-keyring in a
  # dbus-run-session, unlocked headless; a Linux session whose Secret Service is unreachable or
  # refuses skips that one test and prints the recorded `core.store` jvm `dependency` N/A. macOS and
  # Linux run the :core, :update and :sdk suites whole; Windows runs the desktop suites (the keyring
  # store, the install driver and its fetch, the slots, the desktop entry point, capabilities). Every run
  # passes --no-build-cache so a :core:test result restored from setup-java's Gradle cache can never
  # stand in for the real-keyring contract (core also declares PKEY_KEYRING_TESTS a Test input).
  kotlin-desktop:
    name: Kotlin SDK JVM desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # PR: Linux (the real Secret Service); main adds macOS and Windows (tools/ci-scope.json).
      matrix: ${{ fromJSON(needs.changes.outputs.kotlin-desktop-matrix) }}
    defaults:
      run:
        shell: bash
    env:
      PKEY_KEYRING_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Secret Service (gnome-keyring) for the headless session
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: JVM desktop suites (Linux, Secret Service)
        if: runner.os == 'Linux'
        working-directory: sdks/kotlin
        run: >-
          dbus-run-session -- bash -c 'printf pkey | gnome-keyring-daemon --unlock --components=secrets >/dev/null;
          ./gradlew --no-daemon --no-build-cache -Ppkey.jvmOnly=true :core:test :update:test :sdk:test :desktop:test'
      - name: JVM desktop suites (macOS, login Keychain)
        if: runner.os == 'macOS'
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon --no-build-cache -Ppkey.jvmOnly=true :core:test :update:test :sdk:test :desktop:test
      - name: JVM desktop suites (Windows, Credential Manager)
        if: runner.os == 'Windows'
        working-directory: sdks/kotlin
        run: >-
          ./gradlew --no-daemon --no-build-cache -Ppkey.jvmOnly=true
          :core:test --tests 'im.plrs.key.core.KeyringStoreTest' --tests 'im.plrs.key.core.CapabilitiesTest'
          :update:test --tests 'im.plrs.key.update.DesktopInstallDriverTest' --tests 'im.plrs.key.update.DirUpdateSlotsTest'
          --tests 'im.plrs.key.update.BootGuardTest'
          :desktop:test
      - name: The real-keyring contract ran (or recorded its Linux N/A)
        working-directory: sdks/kotlin
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          root = ET.parse("core/build/test-results/test/TEST-im.plrs.key.core.KeyringStoreTest.xml").getroot()
          case = next(c for c in root.iter("testcase") if c.get("name") == "theContractHoldsOnTheRealOsKeyring")
          if case.find("skipped") is not None:
              if os.environ["RUNNER_OS"] != "Linux":
                  sys.exit("the real-keyring contract must run on " + os.environ["RUNNER_OS"])
              print("recorded N/A: core.store jvm dependency (no usable Secret Service in this session)")
          else:
              print("the real-keyring contract ran on " + os.environ["RUNNER_OS"])
          PY
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-desktop-reports-${{ matrix.os }}
          path: |
            sdks/kotlin/*/build/reports/

  # P5-06/P6-09/P6-10/P6-12: the Android platform AAR (sdks/kotlin :platform, polaris-key-platform-{play,direct}),
  # the Godot Android binding over it alone (sdks/godot/native/android, built as :godot) and the Kotlin
  # SDK's Android glue over the SDK and the platform (:android, polaris-key-android-{play,direct}), on JDK 17 and the
  # runner's Android SDK with platforms;android-36 and build-tools;36.1.0. Steps: both flavours'
  # unit tests (Robolectric; Play Core's FakeAppUpdateManager, a fake asset-pack manager, the
  # PackageInstaller verification refusals and Robolectric's PackageInstaller; :android's drivers,
  # PAD transport, Keystore store and readers against fakes and the corpus), assembleRelease of
  # both flavours of every module and of the :boundary app, the flavour boundary on those release
  # outputs (tools/check_flavours.sh: no install permission and no session creation or commit in
  # play, no Play Core in direct, no native library but zstd-jni's 16 KB-aligned one), and PKeyAndroid's headless stub tests (with
  # P5-08's platform transports suite). No
  # secrets, no signing key, no Play Console: In-App Updates and Play Asset Delivery on a real Play
  # install are the owner's device checklist (the P5-06 brief). First-party actions, plus Gradle's
  # own wrapper-validation action, SHA-pinned, which checks the committed gradle-wrapper.jar against
  # Gradle's published checksums before anything runs it.
  # P6-11: the Compose UI kit (:ui, polaris-key-ui): its unit, state-holder, branding, contrast and
  # TalkBack suites with every screen's committed Roborazzi snapshot verified (Robolectric's native
  # graphics, no emulator), lint and assembleRelease, and the local publication.
  android:
    name: Android platform AAR + Godot binding + Compose UI kit + Android glue
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Per-kit modernity lint (UI-KITS.md §7.3, UK-15): the compose source rules of
      # packages/ui-qa/rules/kit-rules.json. Zero dependencies, so plain Node runs it; it fails on any
      # hit beyond the debt ledger (packages/ui-qa/rules/kit-debt.json) and on stale debt.
      - name: UI kit source lint (compose)
        run: node packages/ui-qa/bin/kit-lint.mjs --kit=compose
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` dies of SIGPIPE when sdkmanager stops reading, which pipefail would report.
          set +o pipefail
          yes | "$SDKM" --licenses >/dev/null
          set -o pipefail
          "$SDKM" "platforms;android-36" "build-tools;36.1.0" >/dev/null
      - name: Unit tests (play and direct)
        working-directory: sdks/kotlin
        run: >-
          ./gradlew --no-daemon :platform:testPlayDebugUnitTest :platform:testDirectDebugUnitTest
          :godot:testPlayDebugUnitTest :godot:testDirectDebugUnitTest :ui:verifyRoborazziDebug
          :android:testPlayDebugUnitTest :android:testDirectDebugUnitTest :billing:testDebugUnitTest
          :sample-compose-android:testDirectDebugUnitTest
      - name: Lint and assembleRelease (play and direct)
        working-directory: sdks/kotlin
        run: >-
          ./gradlew --no-daemon :platform:lintPlayRelease :platform:lintDirectRelease
          :godot:lintPlayRelease :godot:lintDirectRelease :android:lintPlayRelease :android:lintDirectRelease
          :platform:assembleRelease :godot:assembleRelease :android:assembleRelease :boundary:assembleRelease
          :ui:lintRelease :ui:assembleRelease :billing:lintRelease :billing:assembleRelease
          :sample-compose-android:assembleDebug
      - name: Flavour boundary
        run: sdks/kotlin/tools/check_flavours.sh
      - name: Module boundaries (:core has no Android dependency, :platform no SDK module, only :android sees both)
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon checkModuleBoundaries
      # P6-09: :platform stays standalone (no project or im.plrs.key module on any classpath), and
      # both flavours publish to the local build/repo with POM, sources and Gradle module metadata.
      # P6-10: :godot reaches :platform and no other SDK module on any classpath (checkPlatformOnly),
      # publishes polaris-key-godot-{play,direct} beside it (each POM naming only
      # polaris-key-platform-<same flavour>), and the export plugin's Play Core list matches the
      # platform play POM (check_publication.sh).
      - name: Standalone platform, platform-only Godot binding and local publication
        working-directory: sdks/kotlin
        run: |
          ./gradlew --no-daemon :platform:checkStandalone :godot:checkPlatformOnly \
            :platform:publishAllPublicationsToLocalRepository :godot:publishAllPublicationsToLocalRepository \
            :ui:publishAllPublicationsToLocalRepository :android:publishAllPublicationsToLocalRepository
          tools/check_publication.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pkey-godot/4.7.2
          key: pkey-godot-4.7.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      - run: sdks/godot/tools/fetch_godot.sh 4.7.2 "$HOME/.cache/pkey-godot/4.7.2"
      - name: PKeyAndroid stub tests (headless)
        run: >-
          GODOT_BIN="$HOME/.cache/pkey-godot/4.7.2/godot" PKEY_TEST_SUITES=native_android,update,transports
          sdks/godot/tools/run_tests.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-logs
          path: |
            sdks/kotlin/platform/build/reports/
            sdks/kotlin/ui/build/reports/
            sdks/kotlin/ui/build/outputs/roborazzi/
            sdks/kotlin/android/build/reports/
            examples/ui/compose-android/build/reports/
            sdks/godot/native/android/build/reports/
            sdks/godot/build/logs/

  # SP-50: the Kotlin SDK as an app consumes it. sdks/kotlin/samples/android-consumer is a separate
  # build over the PUBLISHED artifacts (build/repo): the documented Android set (polaris-key-sdk,
  # polaris-key-android-direct, polaris-key-ui, polaris-key-billing) with no exclude and no app R8
  # rule, debug and minified release, on the documented toolchain (AGP 8.6.1, Kotlin 2.1.21, Gradle
  # 8.11.1, compileSdk 36) and the latest (AGP 9.4.1, Kotlin 2.4.20, Gradle 9.7.1, compileSdk 37).
  # Its `lean` flavour must carry no libzstd-jni; its `packs` flavour adds polaris-key-zstd and must
  # carry zstd-jni's 16 KB-aligned Android natives, never the desktop JAR's (check_apks.sh).
  kotlin-consumer:
    name: Kotlin SDK consumer app (${{ matrix.toolchain }} toolchain)
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        toolchain: [documented, latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses >/dev/null
          set -o pipefail
          "$SDKM" "platforms;android-36" "platforms;android-37.0" "build-tools;36.1.0" >/dev/null
      - name: Publish the SDK locally (build/repo)
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon publishAllPublicationsToLocalRepository
      - name: Build the consumer app (documented toolchain, this build's wrapper)
        if: matrix.toolchain == 'documented'
        working-directory: sdks/kotlin
        run: ./gradlew --no-daemon -p samples/android-consumer assembleDebug assembleRelease assembleLeanDebugAndroidTest
      - name: Gradle 9.7.1 for the latest toolchain
        if: matrix.toolchain == 'latest'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.7.1"
      - name: Build the consumer app (latest toolchain)
        if: matrix.toolchain == 'latest'
        working-directory: sdks/kotlin/samples/android-consumer
        run: gradle --no-daemon -Ppkey.toolchain=latest assembleDebug assembleRelease assembleLeanDebugAndroidTest
      - name: The APKs hold what the artifacts promise
        run: sdks/kotlin/samples/android-consumer/check_apks.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-consumer-${{ matrix.toolchain }}
          path: sdks/kotlin/samples/android-consumer/app/build/reports/

  # SP-50: the emulator lane. The consumer app's instrumented tests on the minSdk (24), API 34 and the
  # newest (36) emulators: Ed25519 chosen by RFC 8032's known answers (Tink; Android 16's JCA fails
  # them), client(context) -> activate() -> sync() from Dispatchers.Main against a server that
  # splits headers and body under StrictMode penaltyDeath, every public suspend function of the
  # client and its facets swept on the main thread under the same policy, a client without a store
  # refused clearly, and the pack decoder present in the `packs` flavour only.
  kotlin-emulator:
    name: Kotlin SDK on the Android emulator (API ${{ matrix.api-level }})
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # PR: the minSdk and the newest; main adds API 34 (tools/ci-scope.json).
      matrix: ${{ fromJSON(needs.changes.outputs.kotlin-emulator-matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses >/dev/null
          set -o pipefail
          "$SDKM" "platforms;android-36" "build-tools;36.1.0" >/dev/null
      - name: Publish the SDK locally and build the consumer app's test APKs
        working-directory: sdks/kotlin
        run: |
          ./gradlew --no-daemon publishAllPublicationsToLocalRepository
          ./gradlew --no-daemon -p samples/android-consumer assembleLeanDebug assembleLeanDebugAndroidTest \
            assemblePacksDebug assemblePacksDebugAndroidTest
      # The emulator now and then fails to boot ("could not connect to TCP port 5554") and passes on
      # a rerun, so the step runs once more when it fails. A real test failure fails both.
      - name: Instrumented tests (lean and packs)
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level == 24 && 'default' || 'google_apis' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          working-directory: sdks/kotlin
          script: ./gradlew --no-daemon -p samples/android-consumer connectedLeanDebugAndroidTest connectedPacksDebugAndroidTest
      - name: Instrumented tests (lean and packs), second attempt
        if: steps.emulator.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level == 24 && 'default' || 'google_apis' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          working-directory: sdks/kotlin
          script: ./gradlew --no-daemon -p samples/android-consumer connectedLeanDebugAndroidTest connectedPacksDebugAndroidTest
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-emulator-${{ matrix.api-level }}
          path: |
            sdks/kotlin/samples/android-consumer/app/build/outputs/androidTest-results/
            sdks/kotlin/samples/android-consumer/app/build/reports/

  # The Godot SDK (sdks/godot): pure-GDScript SHA-512, both Ed25519 verifiers and the corpus
  # `jwsCases`, read from the generator-owned res:// mirror. PARITY requires the runner on the
  # editor AND an exported release template, because official 4.6+ templates ignore `--path`,
  # `--script` and `--main-pack`; the runner is the project's main loop, so both run it the same
  # way. Four Linux legs, one per supported engine (P1-12): the 4.7.2, 4.6.3 and 4.5.2 editors, each
  # with its official linux_release.x86_64 template, and the 4.4.1 editor (the source-compatible
  # floor). The README's tested matrix names exactly these engines. run_tests.sh also exports the
  # harness preset headless with PKEY_BUILD_OUTLET=steam, PKEY_BUILD_CHANNEL=beta and
  # PKEY_BUILD_NUMBER=42 (the P1-11 build stamp): the export_stamps suite checks the stamps in the
  # editor and the build_stamp suite asserts the stamp and the pkey_* feature tags on the release
  # template. No path filter: a required check behind a filter never reports. Only first-party
  # actions; every engine download is checked against the upstream SHA-512 in
  # sdks/godot/tools/godot.sha512, which also keys the cache. The `ci` selection's editor step takes
  # 4-5 minutes on a hosted runner and the UI resolution matrix step 6-10, past run_tests.sh's
  # default 300 s per step: PKEY_TEST_TIMEOUT gives each step 900 s, as the local gate does.
  godot:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # PR: the newest editor with its release template and the 4.4.1 floor; main runs all four
      # Linux engines and the Windows and macOS editor smokes (tools/ci-scope.json). The
      # editor smoke legs (P1-05) run the Windows and macOS fingerprint readers on a real machine:
      # the platform suite asserts the anchor and the MachineGuid / IOPlatformUUID device id; the
      # devices suite runs the readers over the committed captures.
      matrix: ${{ fromJSON(needs.changes.outputs.godot-matrix) }}
    steps:
      # windows-latest's system git sets core.autocrlf=true; check out byte for byte (LF) so the
      # bash tools, the pin file and the corpus the suites verify reach the job as committed.
      # .gitattributes pins sdks/godot to LF as well.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Per-kit modernity lint (UI-KITS.md §7.3, UK-15): the godot source rules (engine dialogs,
      # CheckBox, hard-coded alignment, colour literals outside the theme). The runtime half, every
      # engine control icon themed, is tests/support/ui_lint.gd (suite ui_lint).
      - name: UI kit source lint (godot)
        run: node packages/ui-qa/bin/kit-lint.mjs --kit=godot
      # P0-46.7: gdlint (gdtoolkit, pinned in sdks/godot/tools/lint-requirements.txt) against
      # sdks/godot/lint-debt.json. One leg only (Linux, newest editor): the lint needs no engine.
      - name: GDScript lint (gdlint)
        if: runner.os == 'Linux' && matrix.godot == '4.7.2'
        run: sdks/godot/tools/lint.sh check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pkey-godot/${{ matrix.godot }}
          key: pkey-godot-${{ matrix.godot }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      - run: >-
          sdks/godot/tools/fetch_godot.sh "${{ matrix.godot }}"
          "$HOME/.cache/pkey-godot/${{ matrix.godot }}" ${{ matrix.template }}
      # SP-41, the Godot lane (the Linux legs): the default `ci` selection includes the `dev_live`
      # suite, which needs a fresh `pkey dev` (the `js` job says what `start` and `check` do). Every
      # leg is its own runner, so no server is shared; the Windows and macOS smoke legs select
      # `platform,devices` and need none. The generated config goes under $RUNNER_TEMP, never
      # sdks/godot: the step after the run requires that tree to be as committed, and run_tests.sh
      # empties sdks/godot/build. The editor run and the exported-pack run use the one server; the
      # suite is written for that.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: runner.os == 'Linux'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: pnpm
      - name: Build the pkey dev server (the CLI and the Worker's dependencies)
        if: runner.os == 'Linux'
        run: |
          pnpm install --frozen-lockfile --filter=@polaris-key/worker...
          pnpm exec turbo run build --filter=@polaris-key/worker^...
      - name: Start pkey dev (Godot live lane)
        if: runner.os == 'Linux'
        run: node packages/cli/scripts/start-dev-ci.mjs start --lang godot
      - name: Check the pkey dev lane (variables, config, server)
        if: runner.os == 'Linux'
        run: node packages/cli/scripts/start-dev-ci.mjs check
      - run: |
          D="$HOME/.cache/pkey-godot/${{ matrix.godot }}"
          export GODOT_BIN="$D/godot"
          export PKEY_TEST_TIMEOUT=900
          if [ -n "${{ matrix.template }}" ]; then export GODOT_TEMPLATE="$D/linux_release.x86_64"; fi
          if [ -n "${{ matrix.suites }}" ]; then export PKEY_TEST_SUITES="${{ matrix.suites }}"; fi
          # The newest editor runs the UI matrix on both presentation paths (scrim and opaque page).
          if [ "${{ matrix.godot }}" = 4.7.2 ]; then export PKEY_UI_MATRIX_PATHS=both; fi
          sdks/godot/tools/run_tests.sh
      # Import, export and runs must leave the tree as committed: no rewritten file, no new .uid.
      - run: git diff --exit-code -- sdks/godot && test -z "$(git status --porcelain -- sdks/godot)"
      - name: Stop pkey dev (Godot live lane)
        if: always() && runner.os == 'Linux'
        run: node packages/cli/scripts/start-dev-ci.mjs stop --lang godot --job-status "${{ job.status }}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-logs-${{ matrix.godot }}-${{ matrix.os }}
          path: sdks/godot/build/logs/

  # The one required check. `always()` so it reports when a lane failed or was skipped: a lane the
  # `changes` job left out counts as passed; a failed or cancelled one does not. `changes` and
  # `js` have to have run, or an outage in either would turn every other job into a skip and pass.
  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs:
      [
        changes,
        js,
        workerd,
        node-floor,
        browser,
        console,
        help-search,
        ui-kits,
        react-kit,
        ui-recipes,
        browser-firefox,
        browser-webkit,
        python,
        apple,
        apple-hosted,
        apple-footprint,
        apple-plugin,
        swift-floor,
        kotlin,
        kotlin-desktop,
        android,
        kotlin-consumer,
        kotlin-emulator,
        godot,
        e2e-backend,
        docs-snippets,
        docs-snippets-swift,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            (.changes.result == "success" and .js.result == "success")
            and all(.[]; .result == "success" or .result == "skipped")' >/dev/null \
            || { echo "::error::a CI job failed, was cancelled, or changes/js did not run"; exit 1; }
