name: Registry clients

# The real-client matrices for the package feeds on the registry host (F-02, plans/F-01.md §6.8).
# Each job stands up a seeded local Worker (`wrangler dev --env test`, local D1, R2 and KV; never a
# deployed environment) and runs one client against it through
# packages/worker/scripts/registry-clients/run.mjs. F-02 ships the smoke client (curl), which pins
# the host's isolation contract over real HTTP; F-04 to F-09 add their ecosystem's clients as
# matrix rows (npm, pnpm, Yarn, Bun; pip, uv, Poetry; SwiftPM on macOS; Gradle and Maven; docker,
# podman and crane; GodotEnv).
#
# Making it a required check on pull requests that touch these paths is a branch-protection
# setting (DEPLOYMENT §7).

on:
  pull_request:
    paths:
      - "packages/worker/src/services/distribution/registry/**"
      - "packages/worker/src/core/registryHost.ts"
      - "packages/worker/src/core/registryHostname.ts"
      - "packages/worker/src/core/registryLanding.ts"
      - "packages/worker/scripts/registry-clients/**"
      - "packages/worker/wrangler.toml"
      - "packages/cli/src/package/**"
      - ".github/workflows/registry-clients.yml"
  workflow_dispatch:
    inputs:
      ecosystem:
        description: "Run only this ecosystem's clients (curl, npm, …); empty runs every job."
        required: false
        default: ""

# Least privilege: the jobs only read the checkout.
permissions:
  contents: read

jobs:
  client:
    name: Registry client (${{ matrix.name || matrix.client }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ecosystem == '' || inputs.ecosystem == matrix.ecosystem }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: curl
            ecosystem: curl
            os: ubuntu-latest
          # F-04: the npm feed (plans/F-01.md §6.8). Each row pins its client's major release.
          - client: npm
            name: npm 10
            ecosystem: npm
            os: ubuntu-latest
            env: NPM_VERSION=10
          - client: npm
            name: npm 11
            ecosystem: npm
            os: ubuntu-latest
            env: NPM_VERSION=11
          - client: pnpm
            name: pnpm 9
            ecosystem: npm
            os: ubuntu-latest
            env: PNPM_VERSION=9
          - client: pnpm
            name: pnpm 10
            ecosystem: npm
            os: ubuntu-latest
            env: PNPM_VERSION=10
          - client: yarn
            name: Yarn 4
            ecosystem: npm
            os: ubuntu-latest
            env: YARN_VERSION=4
          - client: bun
            name: Bun
            ecosystem: npm
            os: ubuntu-latest
            bun: true
    steps:
      - uses: actions/checkout@v7
      # No `version:` here: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: ${{ matrix.bun }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: pnpm install --frozen-lockfile
      # The Worker imports the built workspace packages (brand, manifest, protocol, …).
      - run: pnpm build
      - name: Run the client
        run: |
          if [ -n "${{ matrix.env }}" ]; then export ${{ matrix.env }}; fi
          pnpm --filter @polaris-key/worker registry:clients -- --client ${{ matrix.client }}
