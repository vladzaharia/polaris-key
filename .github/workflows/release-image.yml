name: Release pkey image

# The pkey image (F-10, plans/F-01.md §5.1): with each @polaris-key/cli release tag
# (`@polaris-key/cli@<version>`, written by `pnpm changeset tag`), build packages/cli/image/Dockerfile
# (node:22-slim plus the committed CLI bundle, actions/publish/dist/index.js) for linux/amd64 and
# linux/arm64 into an OCI image layout, and publish it to Polaris Key's OCI feed through
# publish-package.yml, the polaris-key product's trusted publisher (deliverable oci.pkey):
#
#   docker pull pkg.plrs.im/polaris-key/pkey:<version>
#
# The version is also the image's tag; the stable channel is `latest` and a pre-release goes to
# `beta`. Never Docker Hub, GHCR or any other registry (owner decision 2026-10-04, feeds only).
# Install: /docs/build/install-from-feeds/.

on:
  push:
    tags:
      - "@polaris-key/cli@*"

permissions:
  contents: read

jobs:
  build:
    name: Build the image layout
    runs-on: ubuntu-latest
    if: github.repository == 'vladzaharia/polaris-key'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: The tag matches @polaris-key/cli's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^@polaris-key/cli@([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::$TAG is not @polaris-key/cli@<semver>." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          actual="$(node -p 'require("./packages/cli/package.json").version')"
          if [ "$actual" != "$version" ]; then
            echo "::error::$TAG does not match packages/cli/package.json version $actual." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@polaris-key/cli..." build
      # The image carries the committed bundle; it must be what this commit's CLI builds.
      - run: pnpm --filter @polaris-key/cli bundle:action -- --check
      - name: Build linux/amd64 and linux/arm64 into an OCI image layout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The default docker driver cannot export a multi-platform OCI layout; a
          # docker-container builder can. The Dockerfile has no RUN step, so no emulation.
          docker buildx create --name pkey-image --driver docker-container --use
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-context action=actions/publish \
            --build-arg VERSION="$VERSION" \
            --provenance=false --sbom=false \
            --output type=oci,dest=build/pkey-image,tar=false,rewrite-timestamp=true \
            packages/cli/image
          rm -rf build/pkey-image/ingest
          test -f build/pkey-image/oci-layout
      - name: Smoke-test the amd64 image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build --platform linux/amd64 --build-context action=actions/publish \
            --build-arg VERSION="$VERSION" --load -t pkey-smoke packages/cli/image
          docker run --rm -v "$PWD:/work" pkey-smoke validate
      - uses: actions/upload-artifact@v7
        with:
          name: pkey-image
          path: build/pkey-image/
          if-no-files-found: error

  publish:
    name: OCI feed
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      deliverable: oci.pkey
      artifact: pkey-image
      version: ${{ needs.build.outputs.version }}
