name: Feed closure

# P0-52: every version on the platform's npm feed pins only @polaris-key versions the feed lists,
# and every version on its PyPI feed has a file to install (tools/feed-closure.mjs). publish-sdks.yml
# checks the version it publishes; this checks every version, daily and on demand, so a gap left
# by an older run (v0.8.28, v0.8.29) stays red and listed in the job summary until it is repaired
# (npm-repair.yml). Read-only: no credential, no environment, nothing published.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    name: Every pin on the feeds resolves
    if: github.repository == 'vladzaharia/polaris-key'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @polaris-key/tools --ignore-scripts
      - name: The npm and PyPI feeds of polaris-key
        run: >-
          node tools/feed-closure.mjs --origin https://pkg.plrs.im --owner polaris-key
          --ecosystem npm,pypi --summary "$GITHUB_STEP_SUMMARY"
