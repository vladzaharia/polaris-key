name: Release Godot SDK

# A `godot-vX.Y.Z` tag publishes the addon as a GitHub Release (P1-12). The tag, plugin.cfg's
# version and PolarisKey.SDK_VERSION must be one value (sdks/godot/tools/package.py checks all
# three before anything else runs); the zips are built reproducibly from the committed
# addons/polaris_key/ tree; the release is created only after the test runner passed on the
# 4.7.2 editor and release template and the clean-install smoke test passed on the 4.4.1 floor
# and 4.7.2. Run it by hand (workflow_dispatch) for a dry run: every step but the release, with
# the zips kept as a workflow artefact. The Asset Store and the legacy Asset Library have no
# upload API; their uploads are the owner's (sdks/godot/store/CHECKLIST.md).

on:
  push:
    tags:
      - "godot-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Dry run: the tag to validate and package as (godot-vX.Y.Z); no release is created"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  validate:
    name: Validate the tag and versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag, plugin.cfg and SDK_VERSION agree
        run: |
          python3 sdks/godot/tools/package.py --check-version --tag "$TAG"
          version="${TAG#godot-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - name: CHANGELOG has the version's section
        run: python3 sdks/godot/tools/package.py --notes "${TAG#godot-v}"

  test:
    name: Test (4.7.2 editor + release template)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pkey-godot/4.7.2
          key: pkey-godot-4.7.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      - run: sdks/godot/tools/fetch_godot.sh 4.7.2 "$HOME/.cache/pkey-godot/4.7.2" --template
      - run: |
          D="$HOME/.cache/pkey-godot/4.7.2"
          GODOT_BIN="$D/godot" GODOT_TEMPLATE="$D/linux_release.x86_64" sdks/godot/tools/run_tests.sh
      - run: git diff --exit-code -- sdks/godot && test -z "$(git status --porcelain -- sdks/godot)"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-release-test-logs
          path: sdks/godot/build/logs/

  package:
    name: Package the zips
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zips (twice, to prove they are reproducible)
        run: |
          python3 sdks/godot/tools/package.py --tag "$TAG" --out build/a
          python3 sdks/godot/tools/package.py --tag "$TAG" --out build/b
          cmp build/a/SHA256SUMS build/b/SHA256SUMS
          python3 sdks/godot/tools/package.py --notes "${TAG#godot-v}" > build/a/NOTES.md
      - name: The canonical zip holds addons/polaris_key/** only
        run: |
          zip="build/a/polaris-key-godot-v${TAG#godot-v}.zip"
          unzip -Z1 "$zip" | grep -vE '^addons/(polaris_key/.*)?$' && { echo "entries outside addons/polaris_key/" >&2; exit 1; } || true
          for f in plugin.cfg LICENSE README.md polaris_key.gd polaris_key.gd.uid; do
            unzip -Z1 "$zip" | grep -qx "addons/polaris_key/$f" || { echo "missing $f" >&2; exit 1; }
          done
          for gd in $(unzip -Z1 "$zip" | grep '\.gd$'); do
            unzip -Z1 "$zip" | grep -qx "$gd.uid" || { echo "missing $gd.uid" >&2; exit 1; }
          done
          unzip -Z1 "$zip" | grep -E '(^|/)(tests|\.godot|build)/' && { echo "test or build files in the zip" >&2; exit 1; } || true
          echo "$(unzip -Z1 "$zip" | grep -vc '/$') files"
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-key-godot-${{ needs.validate.outputs.version }}
          path: build/a/
          if-no-files-found: error

  smoke:
    name: Clean install (${{ matrix.godot }})
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.4.1", "4.7.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: polaris-key-godot-${{ needs.validate.outputs.version }}
          path: release
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pkey-godot/${{ matrix.godot }}
          key: pkey-godot-${{ matrix.godot }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      - run: sdks/godot/tools/fetch_godot.sh "${{ matrix.godot }}" "$HOME/.cache/pkey-godot/${{ matrix.godot }}"
      - name: Install each zip into an empty project, enable the plugin, run it
        run: |
          export GODOT_BIN="$HOME/.cache/pkey-godot/${{ matrix.godot }}/godot"
          for zip in release/*.zip; do sdks/godot/tools/smoke_install.sh "$zip"; done

  release:
    name: Create the GitHub Release
    needs: [validate, test, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: polaris-key-godot-${{ needs.validate.outputs.version }}
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            --title "Polaris Key Godot $VERSION" \
            --notes-file release/NOTES.md \
            --verify-tag "${flags[@]}" \
            release/polaris-key-godot-v$VERSION.zip \
            release/polaris-key-godot-v$VERSION-assetlib.zip \
            release/SHA256SUMS
