name: Deploy

on:
  push:
    tags: ["v*"]

# Least privilege. This job holds CLOUDFLARE_API_TOKEN, so it must not also inherit a
# read-write GITHUB_TOKEN from the repository default.
permissions:
  contents: read

# Only the canonical repo deploys (forks/PRs run CI but never deploy).
jobs:
  # Everything that runs repository or dependency code beyond the
  # deploy itself (dependency install scripts, test, lint, typecheck) runs HERE, on a job with
  # no environment, no secrets and no id-token, so a compromised dependency or test cannot
  # reach CLOUDFLARE_API_TOKEN or mint a deploy-audience OIDC token. The tag/ancestry gate is
  # the first thing it checks, before any install or build.
  verify:
    name: Verify (unprivileged)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'vladzaharia/polaris-key'
    permissions:
      contents: read
      # Reads the check runs recorded against the tagged commit ("Require green checks").
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing here pushes; `git fetch origin main` reads a public repository.
          persist-credentials: false
      - name: Tag is a release tag on main
        env:
          REF: ${{ github.ref }}
        run: |
          TAG="${REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc|a|b)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Production deploy tags are vMAJOR.MINOR.PATCH, optionally -alpha.N, -beta.N or -rc.N" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to deploy: $GITHUB_SHA is not an ancestor of origin/main." >&2
            exit 1
          fi
      # Ancestry proves only that the tagged commit is REACHABLE from main. It says nothing
      # about whether anything ran on it: a commit can land on main with CI red (an admin
      # merge, a check that was not yet required, a workflow that errored before reporting)
      # and still pass the gate above. So also require every check run recorded against this
      # exact SHA to be green.
      #
      # Fails CLOSED: zero check runs, or an API error reading them, is a failure, not a pass.
      # Runs still in progress are polled for a bounded time (tagging right after the merge
      # is normal), never forever. Like the checks above this lives in the tag's own tree, so
      # it stops mistakes, not an actor who can write a tag (see "environment: production"
      # below).
      - name: Require green checks on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          MAX_ATTEMPTS=30   # 30 x 30s = 15 minutes for in-progress runs to finish
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            # Exclude this workflow run's own check runs (verify, deploy, the called SDK
            # publish): they are necessarily still in progress while this step executes.
            # Actions check runs carry an html_url of the form
            # .../actions/runs/<run_id>/job/<job_id>, so the current run is matched exactly by
            # id and no job display name is duplicated here. RUN_ID is read through jq's $ENV
            # rather than interpolated, so nothing is spliced into the program text.
            # Capture through a variable, not process substitution: `gh` exits non-zero on an
            # API error but writes the error BODY to stdout, so piping straight into mapfile
            # would turn "the API was unreachable" into a nonsense check-run row. Test the
            # exit status explicitly and fail with a distinguishable message.
            if ! CHECKS_TSV=$(
              gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                --jq '.check_runs[]
                      | select(((.html_url // "") | contains("/actions/runs/" + $ENV.RUN_ID + "/")) | not)
                      | [.name, .status, (.conclusion // "pending")]
                      | @tsv'
            ); then
              echo "Refusing to deploy: could not read check runs for $SHA." >&2
              echo "This is an API/permissions failure, not a red build. The job needs" >&2
              echo "'checks: read'; see the permissions block above." >&2
              exit 1
            fi

            # A here-string over an empty capture still yields one empty line, so filter.
            ROWS=()
            PENDING=0
            while IFS= read -r LINE; do
              [ -n "$LINE" ] || continue
              ROWS+=("$LINE")
              REST="${LINE#*$'\t'}"
              [ "${REST%%$'\t'*}" = "completed" ] || PENDING=$((PENDING + 1))
            done <<< "$CHECKS_TSV"

            if [ "${#ROWS[@]}" -eq 0 ]; then
              echo "Refusing to deploy: no check runs recorded against $SHA." >&2
              echo "CI must have run on the tagged commit before it can be deployed." >&2
              exit 1
            fi
            if [ "$PENDING" -eq 0 ]; then break; fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Refusing to deploy: $PENDING check run(s) on $SHA still not finished after 15 minutes." >&2
              exit 1
            fi
            echo "$PENDING check run(s) still in progress (attempt $attempt/$MAX_ATTEMPTS) — retrying in 30s"
            sleep 30
          done

          # Advisory lanes (owner decision 2026-10-26): a CI job declared `continue-on-error: true`
          # at job level is allowed to fail in CI, so its failure does not block a deploy either.
          # The list is read from this tag's own ci.yml (job display names, cut before a matrix
          # expression suffix), never typed here, so a lane is advisory exactly while CI says so.
          # Every other check still fails closed.
          mapfile -t ADVISORY < <(python3 - .github/workflows/ci.yml <<'PY'
          import re, sys
          job = name = None; advisory = False; out = []
          def flush():
              if job and advisory and name: out.append(name)
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r"^  ([A-Za-z0-9_-]+):\s*$", line)
              if m:
                  flush(); job, name, advisory = m.group(1), None, False; continue
              m = re.match(r"^    name:\s*(.+?)\s*$", line)
              if m and job: name = m.group(1).strip("'\"").split("$" + "{{")[0].rstrip(" (")
              if re.match(r"^    continue-on-error:\s*true\s*$", line): advisory = True
          flush()
          print("\n".join(out))
          PY
          )

          BAD=0
          for ROW in "${ROWS[@]}"; do
            NAME="${ROW%%$'\t'*}"
            REST="${ROW#*$'\t'}"
            STATUS="${REST%%$'\t'*}"
            CONCLUSION="${REST##*$'\t'}"
            case "$STATUS:$CONCLUSION" in
              completed:success | completed:skipped | completed:neutral)
                echo "  ok    $NAME ($CONCLUSION)"
                ;;
              *)
                LANE=""
                for A in "${ADVISORY[@]}"; do
                  [ -n "$A" ] && [ "${NAME#"$A"}" != "$NAME" ] && LANE="$A"
                done
                if [ -n "$LANE" ] && [ "$STATUS" = "completed" ]; then
                  echo "  advisory  $NAME ($CONCLUSION): allowed to fail (continue-on-error in ci.yml)"
                else
                  echo "  FAIL  $NAME (status=$STATUS conclusion=$CONCLUSION)" >&2
                  BAD=1
                fi
                ;;
            esac
          done

          if [ "$BAD" -ne 0 ]; then
            echo "Refusing to deploy: CI is not green on $SHA." >&2
            exit 1
          fi
          echo "All ${#ROWS[@]} check run(s) on $SHA are green."
      # No `version:` here — the action reads `packageManager` from package.json.
      # Specifying both makes v4 abort with "Multiple versions of pnpm specified",
      # which is why every CI run in this repo failed at step 2 until 2026-08-26.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The docs snippet lane compiles every Python block on a covered page against the SDK with
      # mypy, so `pnpm test` needs the SDK's own venv with the same extras as ci.yml's JS/TS job
      # (`qt`: the Qt kit page imports PySide6).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python venv for the docs snippet lane
        run: |
          python -m venv sdks/python/.venv
          sdks/python/.venv/bin/pip install -e "sdks/python[dev,qt]"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # As in ci.yml's JS/TS job: the Swift, Kotlin and GDScript snippet lanes run in CI's own
      # docs-snippets jobs on their toolchains; a runner's preinstalled JDK must not start them here.
      - run: pnpm test
        env:
          PKEY_DOCS_SKIP_LANES: swift,kotlin,gdscript
      - run: pnpm lint
      # AX-07.5: the agent kit, built and validated here (unprivileged: no environment, no
      # secrets) and handed to `agent-kit-release` as an artifact. The pinned Claude Code CLI is
      # the same pin as ci.yml's js job (tools/agent-kit-release.ts, PINNED_CLAUDE_CODE).
      - name: Derive the version
        id: version
        run: node tools/sdk-version.mjs derive --ref "$GITHUB_REF" --github-output
      - name: Build the agent kit
        env:
          KIT_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm exec tsx tools/agent-kit-release.ts --kit packages/agent-kit --version "$KIT_VERSION" --out dist/agent-kit
      - name: Validate the agent kit
        env:
          PKEY_CLAUDE_BIN: npx --yes @anthropic-ai/claude-code@2.1.296
        run: pnpm skills:validate
      - name: Upload the agent kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-kit
          path: |
            dist/agent-kit/polaris-key-*.zip
            dist/agent-kit/marketplace.json
          if-no-files-found: error
          retention-days: 7

  deploy-worker:
    name: Deploy worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'vladzaharia/polaris-key'
    # =========================================================================
    # DO NOT DELETE `environment: production` BELOW. It is the only line in this file that
    # is actually enforcement.
    #
    # This workflow triggers on `push: tags`. For a push event GitHub runs the copy of THIS
    # FILE carried by the pushed ref's own tree, not the copy on `main`. So anyone holding
    # `contents: write` (no merge rights, no review) can branch locally, delete every gate
    # written in this file, commit, and push that commit straight to `refs/tags/v9.9.9`. The
    # commit never appears on a branch or in a PR, and GitHub runs their edited workflow.
    #
    # Therefore every check in this file (tag shape, ancestry, CI green on the tagged commit)
    # is ADVISORY: each stops a mistake, none stops an actor who can write a tag, because that
    # actor edits them out in the same commit they deploy.
    #
    # The one thing that actor cannot rewrite from inside the tag is WHICH SECRETS THE JOB MAY
    # SEE. CLOUDFLARE_API_TOKEN is an ENVIRONMENT secret on `production`, not a repository
    # secret. Deleting the line below does not unlock the deploy; it removes the credential
    # and wrangler fails with no token. The `production` environment's protection rules
    # (required reviewers, and a deployment tag policy of `v*`) live in repository settings,
    # out of reach of anything in this tree.
    #
    # If CLOUDFLARE_API_TOKEN is ever recreated as a *repository* secret, this line becomes
    # decorative again and the whole gate collapses. See docs/DEPLOYMENT.md, "GitHub Actions
    # secret (environment-scoped, not repository-scoped)".
    # =========================================================================
    environment: production
    # id-token: write is for "Register the platform packages" only: the deploy hook
    # (POST /webhooks/deploy) authenticates this job by its GitHub OIDC token, so no
    # registration secret exists anywhere. The token names this workflow, this environment and
    # this tag; the Worker admits nothing else.
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # No dependency lifecycle script runs beside CLOUDFLARE_API_TOKEN and the
      # id-token (as sync-worker-secrets.yml). The build below is repository code; test, lint
      # and typecheck already passed in `verify`.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Select target
        id: target
        env:
          REF: ${{ github.ref }}
        run: |
          TAG="${REF#refs/tags/}"
          # The prerelease suffixes every SDK ecosystem can carry (tools/sdk-version.mjs: PyPI
          # has no other spelling), so a tag that deploys is a tag every SDK publishes at.
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc|a|b)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Production deploy tags are vMAJOR.MINOR.PATCH, optionally -alpha.N, -beta.N or -rc.N" >&2
            exit 1
          fi
          # R7-04: the tag NAME was the only gate, so a tag pointing at any commit — one
          # never on main, never reviewed, pushed straight from a laptop — deployed to
          # production. Branch protection gives zero coverage against that. Require the
          # tagged commit to be an ancestor of origin/main.
          git fetch --no-tags --depth=100 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to deploy: $GITHUB_SHA is not an ancestor of origin/main." >&2
            echo "Tag a commit that has landed on main." >&2
            exit 1
          fi
          echo "env=prod" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # UK-04b: the Elements CDN bundle is named for the release, never package.json's
          # unstamped 0.0.0 (an exact version is served immutable). Only a stable tag moves the
          # floating major (/elements/<major>/pk.js); an -alpha/-beta/-rc/-a/-b deploy publishes
          # its exact version and writes no major shim.
          echo "elements_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "elements_float=0" >> "$GITHUB_OUTPUT"; else echo "elements_float=1" >> "$GITHUB_OUTPUT"; fi
          echo "database=polaris_key_prod" >> "$GITHUB_OUTPUT"
          # A data-plane endpoint, deliberately NOT the SPA. The previous smoke URL was
          # https://key.plrs.im/manage — a STATIC ASSET, which returns 200 with D1, KV and
          # the whole licensing path down. /<product>/.well-known/jwks.json exercises the
          # router, D1, product load AND opening the signing key under PLATFORM_KEK, so a
          # missing or wrong KEK fails the deploy instead of silently 404ing every route.
          echo "smoke=https://key.plrs.im/djdl/.well-known/jwks.json" >> "$GITHUB_OUTPUT"
          # LK-11/LK-17: the customer host (docs/DEPLOYMENT.md "Customer host"). CUSTOMER_ORIGIN in
          # [vars] is the cutover; the smoke check proves it is serving and the old URLs redirect.
          echo "customer=https://polaris.locker" >> "$GITHUB_OUTPUT"
      # RUNBOOK "Representability check": a value stored before the signer's checks existed can
      # turn a product's documents into 500 document_not_representable. Run it here, with this
      # environment's token, before anything changes, so a flagged value fails the deploy instead
      # of depending on someone remembering to run it from a laptop.
      - name: Representability check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd packages/worker
          pnpm check:representable
      # P4-17: both scripts bind pkey-deltas-<env> (the request Worker as a producer, the
      # lazy-delta consumer as its consumer), so `wrangler deploy` needs the queues to exist and
      # the token to hold Queues Edit (docs/DEPLOYMENT.md §2). Check both here, BEFORE the
      # migrations, so a missing permission or queue fails the job before anything changes.
      # HA-05: the request Worker also produces to and consumes pkey-assets-<env>, with its DLQ.
      - name: Queues preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENV: ${{ steps.target.outputs.env }}
        run: |
          cd packages/worker
          npx wrangler queues info "pkey-deltas-$ENV"
          npx wrangler queues info "pkey-deltas-dlq-$ENV"
          npx wrangler queues info "pkey-assets-$ENV"
          npx wrangler queues info "pkey-assets-dlq-$ENV"
      # Required secrets (names only) and the bytes/registry/image origins, before
      # anything changes.
      - name: Config preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENV: ${{ steps.target.outputs.env }}
        run: |
          cd packages/worker
          npx wrangler secret list --env "$ENV" --format json | node scripts/check-config.mjs "$ENV"
      # UK-04b: /elements/* is served by the Worker, so a product that already holds the slug
      # `elements` (reserved for new products since UK-04b) would be shadowed. Fail before anything
      # changes. test/releaseWorkflows.test.ts pins this step.
      - name: Elements slug preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENV: ${{ steps.target.outputs.env }}
          DATABASE: ${{ steps.target.outputs.database }}
        run: |
          cd packages/worker
          npx wrangler d1 execute "$DATABASE" --env "$ENV" --remote --json \
            --command "SELECT slug FROM products WHERE slug = 'elements'" > "$RUNNER_TEMP/elements-slug.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const n=r.flatMap(x=>x.results??[]).length; if(n){console.error("A product uses the slug elements; /elements/* would shadow it. Rename it first.");process.exit(1)}' "$RUNNER_TEMP/elements-slug.json"
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENV: ${{ steps.target.outputs.env }}
          DATABASE: ${{ steps.target.outputs.database }}
        run: |
          cd packages/worker
          npx wrangler d1 migrations apply "$DATABASE" --env "$ENV" --remote
          # Re-assert the indexes the code depends on, on EVERY deploy.
          # The assertion is recorded in d1_migrations, so its SQL half runs exactly once per
          # database — which is the wrong cadence for an invariant check. R11-04 found that 7 of
          # the original migrations fail on replay, and a partially-applied one can strand the
          # database missing an index the licensing path silently depends on (the enroll
          # dedupe index is the example that bit us). Running it here turns "a required index
          # vanished" into a failed deploy instead of a latent correctness bug.
          # Always the NEWEST *_index_assertion.sql (0018, then 0027_i, ...): each successor
          # DELETEs and re-INSERTs the full list, so re-running an older file would overwrite
          # the row with a shorter list and stop checking the indexes added since.
          # test/surfaces/scheduled.test.ts pins this step to that selection.
          ASSERTION="$(ls migrations/*_index_assertion.sql | sort | tail -1)"
          echo "Re-asserting required indexes from $ASSERTION"
          npx wrangler d1 execute "$DATABASE" --env "$ENV" --remote --file "$ASSERTION"
      # P4-17: the lazy-delta consumer, a second Worker script (wrangler.deltas.toml →
      # polaris-key-deltas-<env>): after the migrations whose tables it reads, before the request
      # Worker whose nightly sweep produces to its queue. Same environment, same token (Workers
      # Scripts edit covers both scripts). It ships with LAZY_DELTAS = "runtime" (A-13: the console's
      # platform settings store decides, default off): until an operator turns it on and opts a
      # product in, it acknowledges every message without work. The queues
      # and the token's Queues Edit are checked by "Queues preflight" before the migrations; a
      # failure HERE comes after the migrations were applied (they are additive, and the previous
      # Worker version keeps serving), so re-run the job once the cause is fixed.
      #
      # A-11 deploy identity, on BOTH deploys: the release tag and commit as vars
      # (PKEY_RELEASE_TAG, PKEY_GIT_SHA → GET /manage/api/platform/version), and the same tag and
      # commit on the Cloudflare version itself (--tag, --message; the tag is cut to 25 characters
      # and the message to 80 plus the short commit, so neither can exceed a version-field
      # limit). wrangler writes its result, including the new version id, to
      # WRANGLER_OUTPUT_FILE_PATH for "Record deploy".
      - name: Deploy lazy-delta consumer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENV: ${{ steps.target.outputs.env }}
          TAG: ${{ steps.target.outputs.tag }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deltas.ndjson
        run: |
          cd packages/worker
          npx wrangler deploy -c wrangler.deltas.toml --env "$ENV" \
            --var "PKEY_RELEASE_TAG:$TAG" --var "PKEY_GIT_SHA:$GITHUB_SHA" \
            --tag "${TAG:0:25}" --message "${TAG:0:80} ${GITHUB_SHA:0:12}"
      - name: Assemble static assets (admin SPA + docs site)
        env:
          PKEY_ELEMENTS_VERSION: ${{ steps.target.outputs.elements_version }}
          PKEY_ELEMENTS_FLOAT: ${{ steps.target.outputs.elements_float }}
        run: pnpm --filter @polaris-key/worker assemble
      - name: Deploy worker + admin assets
        id: deploy-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENV: ${{ steps.target.outputs.env }}
          TAG: ${{ steps.target.outputs.tag }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-main.ndjson
        run: |
          cd packages/worker
          npx wrangler deploy --env "$ENV" \
            --var "PKEY_RELEASE_TAG:$TAG" --var "PKEY_GIT_SHA:$GITHUB_SHA" \
            --tag "${TAG:0:25}" --message "${TAG:0:80} ${GITHUB_SHA:0:12}"
      - name: Smoke check
        id: smoke
        env:
          SMOKE_URL: ${{ steps.target.outputs.smoke }}
          CUSTOMER_URL: ${{ steps.target.outputs.customer }}
        run: |
          BODY=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 "$SMOKE_URL")
          # Assert on content, not just status. A 200 carrying an error body, an empty key
          # set, or an HTML error page would all have passed the old status-only check.
          echo "$BODY" | jq -e '.keys | length > 0' > /dev/null || {
            echo "Smoke check failed: JWKS returned no keys." >&2
            echo "$BODY" | head -c 400 >&2
            exit 1
          }
          # The docs site is tiered (packages/worker/src/docs.ts, DOCS_TIERS): the landing page
          # and the developer sections are public, Operate and Contribute are gated. A gated
          # page must redirect to the access page (sign-in) with no session — a 200 would mean the gate is off,
          # a 5xx that the assembled assets are broken.
          #
          # Poll, do not ask once. `wrangler deploy` returns as soon as the triggers are
          # updated, and the new version needs a few seconds to reach every edge. v0.2.2
          # failed here on a 404 served 1.1s after "Deployed ... triggers" by the PREVIOUS
          # version, which predated the docs site — a green deploy reported red. `curl
          # --retry` cannot cover this: a 404 is a well-formed response, not a transport
          # error, so curl never retries it. Hence an explicit poll, ~60s total.
          ORIGIN=$(echo "$SMOKE_URL" | sed -E 's#^(https://[^/]+).*#\1#')
          for attempt in $(seq 1 12); do
            DOCS_LOCATION=$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' "$ORIGIN/docs/contribute/")
            case "$DOCS_LOCATION" in
              # DOC-03b: a sessionless gated page goes to the public access page, which links sign-in.
              302\ */docs/access/*) echo "Docs gate OK: $DOCS_LOCATION"; break ;;
            esac
            if [ "$attempt" -eq 12 ]; then
              echo "Smoke check failed: /docs/contribute/ unauthenticated returned: $DOCS_LOCATION" >&2
              exit 1
            fi
            echo "Docs gate not ready (attempt $attempt/12): $DOCS_LOCATION — retrying in 5s"
            sleep 5
          done
          # The public landing page answers with the built site, not a redirect.
          LANDING=$(curl --silent "$ORIGIN/docs/")
          if ! printf '%s' "$LANDING" | grep -q 'name="generator" content="Starlight'; then
            echo "Smoke check failed: /docs/ is not the built docs landing page." >&2
            exit 1
          fi
          echo "Docs landing OK (public)."
          # The gate alone is false assurance. The /manage asset proxy is a second door into the
          # same assets root, and the docs bundle sits in docs/ of it: a request for a gated page
          # through /manage with no session must never be served the docs site. /manage answers
          # unknown paths with the console's own shell (a 200), so the test is the body: a
          # Starlight page there is a real bypass.
          BYPASS_BODY=$(curl --silent "$ORIGIN/manage/docs/contribute/index.html")
          if printf '%s' "$BYPASS_BODY" | grep -q 'name="generator" content="Starlight'; then
            echo "Smoke check failed: /manage/docs/contribute/index.html served the gated docs page." >&2
            exit 1
          fi
          echo "Docs gate OK via /manage proxy."
          # The customer host (LK-11) is the same Worker on a second custom domain. The first
          # deploy attaches it and Cloudflare issues its certificate, which can take minutes, so
          # poll (curl exit 35/60 are TLS errors, not responses) for up to ~5 minutes. Every
          # assertion is on an answer the host gives.
          CUSTOMER_OK=""
          for attempt in $(seq 1 30); do
            HEADERS=$(curl --silent --dump-header - --output /dev/null "$CUSTOMER_URL/" || true)
            HOSTDOC=$(curl --silent "$CUSTOMER_URL/.well-known/polaris-host.json" || true)
            if printf '%s' "$HEADERS" | head -n 1 | grep -q ' 200' \
              && [ "$(printf '%s' "$HOSTDOC" | jq -r '.host' 2>/dev/null)" = "customer" ]; then
              CUSTOMER_OK=1; break
            fi
            echo "Customer host not ready (attempt $attempt/30) — retrying in 10s"
            sleep 10
          done
          if [ -z "$CUSTOMER_OK" ]; then
            echo "Smoke check failed: $CUSTOMER_URL did not serve / (200) and polaris-host.json." >&2
            exit 1
          fi
          printf '%s' "$HEADERS" | grep -qi '^content-security-policy:' || {
            echo "Smoke check failed: $CUSTOMER_URL/ carries no Content-Security-Policy." >&2
            exit 1
          }
          if printf '%s' "$HEADERS" | grep -qi '^set-cookie:'; then
            echo "Smoke check failed: $CUSTOMER_URL/ set a cookie." >&2
            exit 1
          fi
          CUSTOMER_MANAGE=$(curl --silent --output /dev/null --write-out '%{http_code}' "$CUSTOMER_URL/manage")
          if [ "$CUSTOMER_MANAGE" != "404" ]; then
            echo "Smoke check failed: $CUSTOMER_URL/manage returned $CUSTOMER_MANAGE, not 404." >&2
            exit 1
          fi
          # Related Origin Requests: the API host lists the customer origin while the host is
          # usable (CUSTOMER_ORIGIN set).
          RELATED=$(curl --silent "$ORIGIN/.well-known/webauthn")
          echo "$RELATED" | jq -e --arg o "$CUSTOMER_URL" '.origins == [$o]' > /dev/null || {
            echo "Smoke check failed: $ORIGIN/.well-known/webauthn is not the customer origin: $RELATED" >&2
            exit 1
          }
          # LK-17: the old customer URLs on the API host redirect (no -L: read the first answer).
          OLD=$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' "$ORIGIN/activate")
          if [ "$OLD" != "301 $CUSTOMER_URL/activate" ]; then
            echo "Smoke check failed: $ORIGIN/activate did not 301 to $CUSTOMER_URL/activate: $OLD" >&2
            exit 1
          fi
          # LK-14: with a customer host, the API host's root is the console's front door.
          ROOT=$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' "$ORIGIN/")
          if [ "$ROOT" != "302 $ORIGIN/manage" ]; then
            echo "Smoke check failed: $ORIGIN/ did not 302 to $ORIGIN/manage: $ROOT" >&2
            exit 1
          fi
          echo "Customer host OK (portal CSP, no cookie, /manage 404, related origins, old URLs 301, / 302)."
          echo "Smoke check OK: data plane is serving a non-empty JWKS."
      # F-10 automation (owner decision 2026-10-04): keep the platform's own SDKs registered on
      # its package feeds, on every deploy and safe to rerun. The deploy hook bootstraps the system
      # product polaris-key (idempotent: a service, packageFeeds or a feed an operator turned off
      # stays off), links it to this repository and applies the root .pkey/ of this tag: the
      # package deliverables every SDK publish is checked against and the trusted publisher
      # (publish-package.yml, package-registry). After the smoke check, so it talks to the new
      # version; a failure fails the deploy loudly (rerun the job once the cause is fixed).
      - name: Register the platform packages
        env:
          ORIGIN: https://key.plrs.im
        run: |
          cd packages/worker
          node scripts/register-platform.mjs
      # A-11: one platform_deploys row for the console's Deployment page (tag, commit, run URL,
      # time, environment, both Cloudflare version ids, the smoke outcome). LAST, and it can never
      # fail the deploy: continue-on-error, and a miss prints a ::warning:: annotation instead.
      # It runs whenever the request Worker deploy succeeded, even if the smoke check failed,
      # because the row records what is live. Same token: it already holds D1 edit (migrations).
      # test/core/recordDeploy.test.ts pins this step's position and guards.
      - name: Record deploy
        if: ${{ !cancelled() && steps.deploy-main.outcome == 'success' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENV: ${{ steps.target.outputs.env }}
          DATABASE: ${{ steps.target.outputs.database }}
          TAG: ${{ steps.target.outputs.tag }}
          GIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SMOKE: ${{ steps.smoke.outcome }}
          MAIN_OUTPUT: ${{ runner.temp }}/wrangler-main.ndjson
          DELTAS_OUTPUT: ${{ runner.temp }}/wrangler-deltas.ndjson
        run: |
          cd packages/worker
          node scripts/record-deploy.mjs

  # AX-07.5: attach the agent kit to the tag's GitHub release.
  #
  # SECURITY: this job holds `contents: write` and nothing else, so it runs NO repository code:
  # no checkout, no install, no script from the tag's tree. The only inputs are the `agent-kit`
  # artifact that `verify` built (unprivileged) and `gh`, which the runner image provides. It has
  # no `environment` (so no environment secret is reachable) and no secret beyond the job's own
  # GITHUB_TOKEN. It runs after `deploy-worker` succeeded, so a tag that did not deploy gets no
  # kit. As with the other gates in this file, `if:` stops a mistake, not an actor who can write a
  # tag; the worst such an actor reaches here is a release asset on their own tag.
  agent-kit-release:
    name: Agent kit release
    needs: [verify, deploy-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'vladzaharia/polaris-key' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-kit
          path: agent-kit
      - name: Create the release if the tag has none, then upload the kit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Agent kit for $TAG" $([[ "$TAG" == *-* ]] && echo --prerelease)
          fi
          gh release upload "$TAG" agent-kit/polaris-key-*.zip agent-kit/marketplace.json --clobber

  # F-10 automation: every SDK at exactly this tag's version, published to the feeds once the
  # Worker that serves them is live and the root .pkey/ of this tag is registered (the step
  # above). Pushes to main publish their prereleases from publish-sdks.yml directly.
  publish-sdks:
    name: Publish SDKs
    needs: deploy-worker
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-sdks.yml
    # Required for the `package-registry` environment's secrets (the Swift signing key, cert and
    # chain) to reach publish-sdks.yml's swift-sign job: that job declares the environment, but a
    # called workflow resolves `secrets.*` only from what its caller passes, and without this line
    # every SWIFT_REGISTRY_* expanded empty on the v0.8.15 tag run while the same job, started by a
    # push to main, read them. The repository holds no repository-level secret, so nothing else
    # is handed over.
    secrets: inherit
