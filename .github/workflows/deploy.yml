name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

# Only the canonical repo deploys (forks/PRs run CI but never deploy).
jobs:
  deploy-worker:
    name: Deploy worker
    runs-on: ubuntu-latest
    if: github.repository == 'vladzaharia/polaris-key'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @polaris-key/admin build
      - name: Deploy (staging on main, prod on tag)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then ENV=prod; else ENV=staging; fi
          cd packages/worker && npx wrangler deploy --env "$ENV"
