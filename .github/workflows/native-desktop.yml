name: Native desktop plugins

# P5-07: the Godot SDK's desktop update plugins (sdks/godot/native/). Each job builds its OS's
# GDExtension from source (nothing binary is committed) and runs the end-to-end updates unsigned,
# against feeds rendered by the Worker's own code:
#
#   macos    the Sparkle bridge (universal), the export plugin's Info.plist / entitlement /
#            never-unsigned / chmod switches, sign_and_notarize.sh ad hoc, and delta and full
#            Sparkle updates through PKeySparkleBridge with the headless user driver
#   windows  pkey_win.dll (Velopack, WinSparkle, StoreContext) and the Velopack shim, a Microsoft
#            Store export without updater DLLs, the facades with the DLLs removed, StoreContext
#            unpackaged, a Velopack delta through the 302 package route, and a WinSparkle silent
#            installer
#   keyring  SP-27: the desktop keyring store's real-keyring contract (tests/suite_keyring.gd with
#            PKEY_KEYRING_TESTS=1) on each OS: macOS builds PolarisKeyApple's desktop dylib
#            (native/macos/build_apple.sh) and uses the login keychain; Windows builds pkey_win.dll
#            (PKeyWinCredentialNative) and uses Credential Manager; Linux runs secret-tool against
#            gnome-keyring unlocked inside a dbus-run-session. The last step fails unless the real
#            contract ran (Linux may record an N/A instead when no Secret Service is reachable).
#
# No secrets, no signing certificate, no account: safe on pull_request. Code signing,
# notarisation and Store checks are the owner's checklist (notes/S-11 §7). A path filter keeps
# these 10-20 minute jobs off unrelated changes; they are not required checks. Only first-party
# actions; every download is pinned (sdks/godot/tools/godot.sha512, sdks/godot/native/deps.env).
# The composite action the macOS and Windows jobs set up Node with (.github/actions/setup-js) is a
# trigger too: a change to it changes those jobs as much as an edit of this file does.
on:
  push:
    branches: [main]
    paths:
      - "sdks/godot/**"
      - "sdks/swift/Sources/PolarisKeyPlatform/**"
      - "sdks/swift/Sources/PolarisKeyPlatformC/**"
      - "packages/worker/src/services/update/**"
      - "packages/worker/src/services/release/sparkle.ts"
      - ".github/workflows/native-desktop.yml"
      - ".github/actions/setup-js/**"
  pull_request:
    paths:
      - "sdks/godot/**"
      - "sdks/swift/Sources/PolarisKeyPlatform/**"
      - "sdks/swift/Sources/PolarisKeyPlatformC/**"
      - "packages/worker/src/services/update/**"
      - "packages/worker/src/services/release/sparkle.ts"
      - ".github/workflows/native-desktop.yml"
      - ".github/actions/setup-js/**"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  macos:
    name: Native desktop (macOS Sparkle bridge + e2e)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pkey-godot/native-${{ env.GODOT_VERSION }}
          key: pkey-godot-native-${{ env.GODOT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      # godot-cpp with its SCons signatures, and Sparkle: rebuilt only when deps.env changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sdks/godot/native/.deps
          key: pkey-native-deps-${{ runner.os }}-${{ hashFiles('sdks/godot/native/deps.env') }}-r1
      - run: >-
          sdks/godot/tools/fetch_godot.sh "$GODOT_VERSION"
          "$HOME/.cache/pkey-godot/native-$GODOT_VERSION" --host-template
      - run: pip3 install --break-system-packages "scons==$(grep '^SCONS_VERSION=' sdks/godot/native/deps.env | cut -d= -f2)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@polaris-key/worker^...
      - name: macOS end-to-end
        timeout-minutes: 25
        run: |
          D="$HOME/.cache/pkey-godot/native-$GODOT_VERSION"
          GODOT_BIN="$D/Godot.app/Contents/MacOS/Godot" \
            sdks/godot/native/e2e/macos/run.sh --work "$RUNNER_TEMP/e2e-macos" --template "$D/macos.zip"
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-desktop-macos-logs
          path: ${{ runner.temp }}/e2e-macos/logs
          retention-days: 7

  windows:
    name: Native desktop (Windows Velopack, WinSparkle, StoreContext + e2e)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pkey-godot/native-${{ env.GODOT_VERSION }}
          key: pkey-godot-native-${{ env.GODOT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      # godot-cpp with the SCons signature database build.ps1 keeps beside it (uncached 287-503 s
      # on this runner, cached under 30 s), velopack_libc and WinSparkle.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sdks/godot/native/.deps
          key: pkey-native-deps-${{ runner.os }}-${{ hashFiles('sdks/godot/native/deps.env') }}-r1
      - shell: bash
        run: >-
          sdks/godot/tools/fetch_godot.sh "$GODOT_VERSION"
          "$HOME/.cache/pkey-godot/native-$GODOT_VERSION" --host-template
      - name: Tools (SCons, vpk, Inno Setup)
        run: |
          $pins = @{}
          Get-Content sdks/godot/native/deps.env | Where-Object { $_ -match '^([A-Z0-9_]+)=(.*)$' } | ForEach-Object { $pins[$Matches[1]] = $Matches[2] }
          python -m pip install --quiet "scons==$($pins.SCONS_VERSION)"
          dotnet tool install -g vpk --version $pins.VELOPACK_VERSION
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@polaris-key/worker^...
      # One step per stage, each followed by an upload of the logs: a runner that is lost (every run
      # since 2026-10-28 ended "lost communication" after ~50 min, with no log) leaves the artifacts
      # of the stages it got through and a live log with the heartbeat (phase, memory, disk).
      # Bounded, so a hung case fails with its log instead of running into the job's limit: run.ps1
      # gives each phase a budget and has a watchdog (watchdog.ps1) that logs the hung phase and the
      # process tree, then stops the whole tree. A green run takes 6 minutes in all.
      - name: Windows end-to-end (prepare, build, export, pack)
        timeout-minutes: 12
        run: sdks/godot/native/e2e/windows/ci-step.ps1 -Stage prepare -DeadlineMinutes 10
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-desktop-windows-logs-prepare
          path: ${{ runner.temp }}/e2e-windows/logs
          retention-days: 7
      - name: Windows end-to-end (facades, nodlls, store)
        timeout-minutes: 8
        run: sdks/godot/native/e2e/windows/ci-step.ps1 -Stage facades -DeadlineMinutes 6
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-desktop-windows-logs-facades
          path: ${{ runner.temp }}/e2e-windows/logs
          retention-days: 7
      - name: Windows end-to-end (Velopack)
        timeout-minutes: 8
        run: sdks/godot/native/e2e/windows/ci-step.ps1 -Stage velopack -DeadlineMinutes 6
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-desktop-windows-logs-velopack
          path: ${{ runner.temp }}/e2e-windows/logs
          retention-days: 7
      - name: Windows end-to-end (WinSparkle)
        timeout-minutes: 8
        run: sdks/godot/native/e2e/windows/ci-step.ps1 -Stage winsparkle -DeadlineMinutes 6
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-desktop-windows-logs-winsparkle
          path: ${{ runner.temp }}/e2e-windows/logs
          retention-days: 7
      - name: Windows end-to-end diagnostics
        if: failure()
        timeout-minutes: 2
        run: |
          $l = Join-Path $env:RUNNER_TEMP "e2e-windows/logs"
          foreach ($f in "watchdog.log", "progress.log", "phase.txt", "heartbeat.log") {
            Write-Host "---- $f"
            if (Test-Path "$l/$f") { Get-Content "$l/$f" -Tail 40 }
          }
      - run: git diff --exit-code; if ($LASTEXITCODE -ne 0 -or (git status --porcelain)) { git status --porcelain; exit 1 }
      - name: Stop what the end-to-end left running
        if: always()
        timeout-minutes: 2
        run: Get-Process pkeye2e, PKeyE2E, PKeyE2E_godot, PKeyE2EWS, Update, python, vpk, ISCC -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

  keyring:
    name: Godot desktop keyring (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 for Xcode 26.6 (Swift 6.3), as the Apple plugin job: the dylib compiles the
          # PolarisKeyPlatform sources with warnings as errors.
          - name: macOS login keychain
            os: macos-26
          - name: Windows Credential Manager
            os: windows-latest
          - name: Linux Secret Service
            os: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pkey-godot/${{ env.GODOT_VERSION }}
          key: pkey-godot-${{ env.GODOT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/godot/tools/godot.sha512') }}
      - run: sdks/godot/tools/fetch_godot.sh "$GODOT_VERSION" "$HOME/.cache/pkey-godot/$GODOT_VERSION"
      - name: PolarisKeyApple desktop dylib (macOS)
        if: runner.os == 'macOS'
        run: |
          sdks/swift/tools/select-xcode-26.sh
          GODOT_BIN="$HOME/.cache/pkey-godot/$GODOT_VERSION/godot" sdks/godot/native/macos/build_apple.sh --install sdks/godot
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Windows'
        with:
          path: sdks/godot/native/.deps
          key: pkey-native-deps-${{ runner.os }}-${{ hashFiles('sdks/godot/native/deps.env') }}-r1
      - name: pkey_win.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File sdks/godot/native/windows/build.ps1 -SkipShim -Install sdks/godot
      - name: Secret Service tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libsecret-tools gnome-keyring dbus-x11
      - name: Real-keyring contract
        run: |
          export GODOT_BIN="$HOME/.cache/pkey-godot/$GODOT_VERSION/godot"
          export PKEY_KEYRING_TESTS=1 PKEY_TEST_SUITES=keyring PKEY_TEST_STAMPS=0
          if [ "$RUNNER_OS" = Linux ]; then
            # A fresh login collection, unlocked with a throwaway password, on this session's bus.
            dbus-run-session -- sh -c 'echo ci-keyring | gnome-keyring-daemon --unlock --components=secrets >/dev/null && sdks/godot/tools/run_tests.sh'
          else
            sdks/godot/tools/run_tests.sh
          fi
      - name: The real contract ran (or Linux recorded its N/A)
        run: |
          log=sdks/godot/build/logs/editor.log
          if grep -q '^PKEY-KEYRING REAL ' "$log"; then grep '^PKEY-KEYRING' "$log"; exit 0; fi
          if [ "$RUNNER_OS" = Linux ] && grep -q '^PKEY-KEYRING N/A ' "$log"; then grep '^PKEY-KEYRING' "$log"; exit 0; fi
          echo "the real-keyring contract did not run" >&2
          exit 1
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyring-${{ runner.os }}-logs
          path: sdks/godot/build/logs
          retention-days: 7
