name: Sync Worker secrets

# A-16: push the platform's team-level store credentials from GitHub environment secrets to the
# Worker, so a private key never passes through a laptop shell history or an agent transcript.
# Set the environment secret from the local file (`gh secret set NAME --env production < file`),
# then dispatch this workflow. Each value travels GitHub secret → step env → wrangler's stdin:
# never on a command line, never echoed. Unset secrets are skipped; only NAMES are logged.
# test/syncWorkerSecretsWorkflow.test.ts (packages/worker) holds these properties.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Worker environment to write to"
        type: choice
        options: [prod, staging]
        default: prod

# Least privilege: this job holds CLOUDFLARE_API_TOKEN and every store key.
permissions:
  contents: read

jobs:
  sync:
    name: Sync platform store secrets
    runs-on: ubuntu-latest
    # The `production` environment accepts only `v*` tags (deployment-branch policy), and tag creation
    # is restricted by the "Protect release tags" ruleset: dispatchable from a release tag only.
    if: github.repository == 'vladzaharia/polaris-key' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    concurrency:
      group: sync-worker-secrets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here — the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Only the worker and what it depends on, and no lifecycle scripts: this job holds every
      # store key, so no dependency's install script runs beside them. `wrangler secret put`
      # needs neither workerd nor esbuild's postinstall.
      - run: pnpm install --frozen-lockfile --filter @polaris-key/worker... --ignore-scripts
      - name: Check wrangler runs
        working-directory: packages/worker
        run: npx wrangler --version
      - name: Push secrets to the Worker
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ inputs.target }}
          PLATFORM_ASC_API_KEY: ${{ secrets.PLATFORM_ASC_API_KEY }}
          PLATFORM_APP_STORE_SERVER_KEY: ${{ secrets.PLATFORM_APP_STORE_SERVER_KEY }}
          PLATFORM_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PLATFORM_GOOGLE_SERVICE_ACCOUNT }}
          PLATFORM_MS_PARTNER_CENTER: ${{ secrets.PLATFORM_MS_PARTNER_CENTER }}
          PLATFORM_STEAM_PUBLISHER_KEY: ${{ secrets.PLATFORM_STEAM_PUBLISHER_KEY }}
          PLATFORM_APPLE_TEAM_ID: ${{ secrets.PLATFORM_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            prod|staging) ;;
            *) echo "target must be prod or staging" >&2; exit 1 ;;
          esac
          synced=()
          skipped=()
          for NAME in PLATFORM_ASC_API_KEY PLATFORM_APP_STORE_SERVER_KEY \
                      PLATFORM_GOOGLE_SERVICE_ACCOUNT PLATFORM_MS_PARTNER_CENTER \
                      PLATFORM_STEAM_PUBLISHER_KEY PLATFORM_APPLE_TEAM_ID; do
            if [ -z "${!NAME:-}" ]; then
              skipped+=("$NAME")
              continue
            fi
            # The value is read from the step's env by name and fed on stdin. wrangler's stdout is
            # discarded and its stderr goes to a file that is never printed: a failure is one
            # generic line, so nothing wrangler might say can carry a value into the log.
            err_file="$RUNNER_TEMP/wrangler-secret.err"
            if ! printenv "$NAME" | npx wrangler secret put "$NAME" --env "$TARGET" > /dev/null 2> "$err_file"; then
              rm -f "$err_file"
              echo "failed to sync $NAME (wrangler secret put failed; details withheld)" >&2
              exit 1
            fi
            rm -f "$err_file"
            synced+=("$NAME")
          done
          echo "target: $TARGET"
          echo "synced: ${synced[*]:-none}"
          echo "skipped (unset): ${skipped[*]:-none}"
