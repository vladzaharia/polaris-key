name: Sync Worker secrets

# A-16: push the platform's team-level store credentials from GitHub environment secrets to the
# Worker, so a private key never passes through a laptop shell history or an agent transcript.
# Set the environment secret from the local file (`gh secret set NAME --env production < file`),
# then dispatch this workflow. Each value travels GitHub secret → step env → wrangler's stdin:
# never on a command line, never echoed. Unset secrets are skipped; only NAMES are logged.
# test/syncWorkerSecretsWorkflow.test.ts (packages/worker) holds these properties.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Worker environment to write to"
        type: choice
        options: [prod, staging]
        default: prod

# Least privilege: this job holds CLOUDFLARE_API_TOKEN and every store key.
permissions:
  contents: read

jobs:
  sync:
    name: Sync platform store secrets
    runs-on: ubuntu-latest
    if: github.repository == 'vladzaharia/polaris-key'
    environment: production
    concurrency:
      group: sync-worker-secrets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # No `version:` here — the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Push secrets to the Worker
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ inputs.target }}
          PLATFORM_ASC_API_KEY: ${{ secrets.PLATFORM_ASC_API_KEY }}
          PLATFORM_APP_STORE_SERVER_KEY: ${{ secrets.PLATFORM_APP_STORE_SERVER_KEY }}
          PLATFORM_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.PLATFORM_GOOGLE_SERVICE_ACCOUNT }}
          PLATFORM_MS_PARTNER_CENTER: ${{ secrets.PLATFORM_MS_PARTNER_CENTER }}
          PLATFORM_STEAM_PUBLISHER_KEY: ${{ secrets.PLATFORM_STEAM_PUBLISHER_KEY }}
          PLATFORM_APPLE_TEAM_ID: ${{ secrets.PLATFORM_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            prod|staging) ;;
            *) echo "target must be prod or staging" >&2; exit 1 ;;
          esac
          synced=()
          skipped=()
          for NAME in PLATFORM_ASC_API_KEY PLATFORM_APP_STORE_SERVER_KEY \
                      PLATFORM_GOOGLE_SERVICE_ACCOUNT PLATFORM_MS_PARTNER_CENTER \
                      PLATFORM_STEAM_PUBLISHER_KEY PLATFORM_APPLE_TEAM_ID; do
            if [ -z "${!NAME:-}" ]; then
              skipped+=("$NAME")
              continue
            fi
            # The value is read from the step's env by name and fed on stdin; wrangler's own
            # output is discarded so nothing it prints can carry it.
            printenv "$NAME" | npx wrangler secret put "$NAME" --env "$TARGET" > /dev/null
            synced+=("$NAME")
          done
          echo "target: $TARGET"
          echo "synced: ${synced[*]:-none}"
          echo "skipped (unset): ${skipped[*]:-none}"
