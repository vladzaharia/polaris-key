name: Release SDKs

on:
  push:
    branches: [main]

# Changesets opens/maintains a "Version Packages" PR; merging it publishes the JS SDKs
# (@polaris-key/*) to the private registry. Python (PyPI) and Swift (git tag) are released
# from their own tags.
jobs:
  release:
    name: Changesets publish
    runs-on: ubuntu-latest
    if: github.repository == 'vladzaharia/polaris-key'
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — the action reads `packageManager` from package.json.
      # Specifying both makes v4 abort with "Multiple versions of pnpm specified",
      # which is why every CI run in this repo failed at step 2 until 2026-08-26.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm --filter @polaris-key/cli bundle:action -- --check
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The CLI outside npm (P2-06): when @polaris-key/cli is published, attach the standalone
      # bundle to its GitHub release as pkey.mjs, so a repository with no node_modules (a Godot
      # project) can run `node pkey.mjs validate`. The bundle is the committed, freshness-checked
      # actions/publish/dist/index.js.
      - name: Attach pkey.mjs to the @polaris-key/cli release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version=$(node -e 'const p=JSON.parse(process.env.PUBLISHED).find((x)=>x.name==="@polaris-key/cli");if(p)console.log(p.version)')
          if [ -n "$version" ]; then
            cp actions/publish/dist/index.js pkey.mjs
            gh release upload "@polaris-key/cli@${version}" pkey.mjs --clobber
          fi
