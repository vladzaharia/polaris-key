name: Release SDKs

on:
  push:
    branches: [main]

# Changesets opens/maintains a "Version Packages" PR; merging it publishes the JS SDKs
# (@polaris-key/*) to the private registry. Python (PyPI) and Swift (git tag) are released
# from their own tags.
jobs:
  release:
    name: Changesets publish
    runs-on: ubuntu-latest
    if: github.repository == 'vladzaharia/polaris-key'
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
