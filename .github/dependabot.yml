version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 (native compiler) has no stable JS compiler API yet; tsup --dts, astro check
      # and the tsx tooling depend on it. Revisit when they support TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # wrangler >= 4.117 and @cloudflare/vitest-pool-workers >= 0.20 ship miniflare 5 alpha; both
      # are pinned to the last miniflare-4 releases together (see packages/worker/package.json).
      - dependency-name: wrangler
      - dependency-name: "@cloudflare/vitest-pool-workers"
      - dependency-name: miniflare
  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: weekly
  # The Swift and Gradle (Kotlin) SDKs were the two ecosystems with no update PRs.
  - package-ecosystem: swift
    directory: /sdks/swift
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /sdks/kotlin
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
