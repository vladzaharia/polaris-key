name: Set up JS
description: >-
  pnpm, Node and the frozen install that every JS job of this repository repeats (P0-43). Run
  actions/checkout first: a local action is read from the checkout.

# No `version:` for pnpm: pnpm/action-setup reads `packageManager` from package.json, and giving
# both makes it abort with "Multiple versions of pnpm specified".
inputs:
  node-version:
    description: >-
      The Node version setup-node installs. An exact release, not a floating "22": the Unicode
      data in ICU moves between 22.x releases (22.13 carries Unicode 16, 22.23 carries 17), and
      tools/gen-godot-nfc.test.ts compares against it. Bump it deliberately, to a release at
      least 14 days old.
    default: 22.23.4
  install:
    description: >-
      "true" runs `pnpm install`; "false" leaves the install to the caller (a job that must check
      the runtime first, or that installs later).
    default: "true"
  install-args:
    description: Arguments to `pnpm install` (a filter, --ignore-scripts).
    default: --frozen-lockfile

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      # Unquoted on purpose: the arguments are several words.
      run: pnpm install $INSTALL_ARGS
