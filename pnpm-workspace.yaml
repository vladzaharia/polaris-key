packages:
  - "packages/*"
  # React 19 for @polaris-key/brand's second test project (its peer range is >=18).
  - "packages/brand/test/react19"
  - "tools"
  - "conformance/runners/node"
  - "conformance/runners/browser"
  - "products"
overrides:
  "@types/node": ^22.14.0
  jiti: ^2.7.0
  # Security floors for transitive dependencies (Dependabot). Most selectors stay inside the
  # major their parents ask for and only lift a lockfile pin to the patched release. Two cross a
  # 0.x minor on purpose: esbuild 0.28.1 (tsup asks ^0.27; wrangler 4.72 and vitest-pool-workers
  # pin 0.27.3) and sharp 0.35 (miniflare asks ^0.34). All of these are build/test tooling; the
  # published packages' dist/ output and the Worker bundle were verified unchanged (bar the docs
  # CSP hashes) when these were added.
  "undici@^7": ^7.29.1
  "undici@^8": ^8.10.2
  "ws@^8": ^8.21.0
  "sharp@<0.35.4": ^0.35.4
  "devalue@^5": ^5.9.3
  "fast-uri@^3": ^3.1.8
  "browserslist@^4": ^4.28.7
  "baseline-browser-mapping@^2": ^2.11.0
  "postcss@^8": ^8.5.23
  "js-yaml@^3": ^3.15.2
  "js-yaml@^4": ^4.3.2
  "esbuild@>=0.27.3 <0.28.1": ^0.28.1
