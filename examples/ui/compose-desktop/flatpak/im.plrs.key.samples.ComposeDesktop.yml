# UK-10.13 (K7): the Compose desktop sample as a Flatpak, to prove the kit on a constrained host: links
# leave through the OpenURI portal and the appearance reads answer from the Settings portal.
#
# Runtime, SDK and the OpenJDK 17 extension are all branch 24.08 (the freedesktop 24.08 release series);
# there is nothing to download while building: the only source is the sample's uber jar, which
# .github/workflows/flatpak.yml builds with Gradle and copies to flatpak/tidewater.jar first.
#
#   cp "examples/ui/compose-desktop/build/compose/jars/"*-linux-x64-*.jar examples/ui/compose-desktop/flatpak/tidewater.jar
#   flatpak-builder --user --force-clean --install-deps-from=flathub build-dir <this file>
app-id: im.plrs.key.samples.ComposeDesktop
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: tidewater
finish-args:
  # A window, and nothing else: no network (the sample runs on fixtures), no filesystem, no own bus names.
  # The portals (OpenURI, Settings) are reachable from every sandbox without a permission.
  - --socket=x11
  - --share=ipc
  - --device=dri
modules:
  - name: jre
    buildsystem: simple
    build-commands:
      # install.sh puts the JRE at /app/jre (installjdk.sh does not: the first CI run found no /app/jre/bin/java).
      - /usr/lib/sdk/openjdk17/install.sh
      - test -x /app/jre/bin/java
  - name: tidewater
    buildsystem: simple
    build-commands:
      - install -Dm644 tidewater.jar /app/lib/tidewater/tidewater.jar
      - install -Dm755 tidewater.sh /app/bin/tidewater
    sources:
      - type: file
        path: tidewater.jar
      - type: script
        dest-filename: tidewater.sh
        commands:
          - exec /app/jre/bin/java -Djava.awt.headless=false -jar /app/lib/tidewater/tidewater.jar "$@"
