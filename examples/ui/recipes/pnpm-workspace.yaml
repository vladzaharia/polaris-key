# A standalone workspace: the recipes are not part of the repo's pnpm workspace or lockfile.
# Every dependency is pinned to an exact release; the install refuses anything younger than
# 14 days (minutes), so a freshly published (or hijacked) release cannot reach a recipe.
packages:
  - "*"
minimumReleaseAge: 20160
# Security floor (GHSA-f86p-h4j2-7qgj): solid-js 1.9.17 still depends on seroval 1.6.9, so keep these.
overrides:
  seroval: 1.6.11
  seroval-plugins: 1.6.11
# `pnpm audit` reads the lockfile's importer id `angular` (the recipe's directory) as the npm
# package "angular" (AngularJS 1.x), and reports its advisory against version 1.0.0. The recipe
# uses @angular/*, not AngularJS; this is the only high finding, and it is this false match.
auditConfig:
  ignoreGhsas:
    - GHSA-89mq-4x47-5v83
